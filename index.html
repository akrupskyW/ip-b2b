<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Redirecting…</title>
  <!--
    The WISE app lives entirely under /pages/, driven by the single shared
    navigation module (js/agent-menu.js → mountAgentMenu). This root file is
    just an entry point: send authenticated users to the workspace overview and
    everyone else to sign-in, using the same `wise-auth` check as auth-guard.js.
  -->
  <script>
    (function () {
      var target = 'pages/login.html';
      try {
        var raw = localStorage.getItem('wise-auth');
        if (raw) {
          var u = JSON.parse(raw);
          if (u && u.loggedIn) target = 'pages/overview.html';
        }
      } catch (e) { /* fall back to login on any storage/parse error */ }
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=pages/login.html" />
</head>
<body>
  <noscript><a href="pages/login.html">Continue to WISE</a></noscript>
</body>
</html>
