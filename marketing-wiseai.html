<!DOCTYPE html>
<html lang="en" class="mkt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISEcodeAI™ · WISE</title>
  <meta name="description" content="Chat with WISEcodeAI™ — your food-truth assistant. Ask about any food, the Non-UPF standard, WISEcoach, or getting the app." />

  <!-- FOUC theme guard — mirrors the app's wise-theme storage key. Marketing defaults to light. -->
  <script>
    (function () { try { var t = localStorage.getItem('wise-theme'); document.documentElement.classList.toggle('dark', t === 'dark'); } catch (e) {} })();
  </script>
  <script src="js/text-size-fouc.js"></script>

  <!-- Hand the page to the shared marketing shell (nav + persistent chat + router). -->
  <script>window.__WISE_MKT_SHELL__ = true;</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="js/icon-svg-shim.js"></script>
  <!-- Legacy Material Icons — the shared WISEcodeAI chat module renders its controls with <span class="material-symbols-outlined">. -->

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)', surface: 'var(--surface)', 'surface-2': 'var(--surface-2)',
            text: 'var(--text)', muted: 'var(--text-muted)', primary: 'var(--primary)',
          },
          fontFamily: { body: ['DM Sans', 'system-ui', 'sans-serif'], serif: ['Noto Serif', 'Georgia', 'serif'] },
          maxWidth: { shell: '1200px' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="marketing.css" />
  <!-- The exact product WISEcodeAI chat module styles (mirror of wise.css Section 2). -->
  <link rel="stylesheet" href="wiseai-chat.css" />
</head>
<body class="mkt mkt-appshell" data-mkt-route="wiseai">

  <!-- Shared nav + the persistent WISEcodeAI chat rail are injected by
       js/marketing-shell.js. On this route the shell enters "focus mode", so the
       one persistent chat expands to take over the page — no separate chat
       instance, so arriving here just continues the conversation you were
       already having elsewhere on the marketing site. -->

  <div id="mkt-body-module">
    <main>
      <!-- Focus mode hides this body module; it exists only so the router has a
           swappable region and the page degrades gracefully without the shell. -->
      <section class="mkt-section" style="padding-top:calc(var(--mkt-nav-h) + var(--mkt-nav-top) + 64px)">
        <div class="mkt-shell">
          <div class="mkt-section-head is-center mkt-reveal">
            <h1 class="mkt-section-title">Ask WISEcodeAI anything about your food.</h1>
            <p class="mkt-lede" style="margin-inline:auto">Your food-truth assistant is right here — scan a product, learn the Non-UPF standard, or get the app.</p>
          </div>
        </div>
      </section>
    </main>
  </div><!-- /#mkt-body-module -->

  <script defer src="js/marketing.js"></script>
  <script type="module" src="js/marketing-shell.js"></script>
  <script defer src="js/count-up-all.js"></script>
  <script defer src="js/feedback.js"></script>
</body>
</html>
