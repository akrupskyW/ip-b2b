<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Page gallery</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint. Mirrors the
       other app pages so the shell never flashes the wrong theme. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Full-screen gallery — no app chrome. Close / Escape returns to All Modules. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body[data-page-gallery] {
      padding: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }
    #pg-root {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .pg-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    html.dark .pg-bar { background: #1A2339; border-bottom-color: rgba(255,255,255,0.08); }
    .pg-bar-text { min-width: 0; flex: 1 1 auto; }
    .pg-title {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .pg-lede {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .pg-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }
    .pg-bar .adm-btn { height: 40px; }
    .pg-reeval-btn .material-symbols-outlined { font-size: 18px !important; }
    .pg-reeval-btn:disabled { opacity: 0.7; cursor: progress; }
    .pg-reeval-btn.is-busy .material-symbols-outlined { animation: pg-reeval-spin 0.8s linear infinite; }
    .pg-reeval-btn.is-done {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 32%, transparent);
    }
    html.dark .pg-reeval-btn.is-done {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--primary-bright, #8B9FAF) 40%, transparent);
    }
    @keyframes pg-reeval-spin { to { transform: rotate(360deg); } }
    .pg-count {
      flex: 0 0 auto;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .pg-reeval-meta {
      display: block;
      margin: 4px 0 0;
      font-size: 0.72rem;
      color: var(--text-subtle);
      line-height: 1.35;
      max-width: 70ch;
    }
    .pg-reeval-status {
      flex: 0 0 auto;
      margin: 0;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
      line-height: 1.5;
    }
    .pg-reeval-status[hidden] { display: none; }
    .pg-reeval-status.is-busy { color: var(--text-muted); }
    .pg-reeval-status.is-ok {
      background: color-mix(in srgb, var(--primary) 10%, var(--surface));
      border-bottom-color: color-mix(in srgb, var(--primary) 32%, var(--border));
    }
    html.dark .pg-reeval-status.is-ok {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 12%, var(--surface));
      border-bottom-color: color-mix(in srgb, var(--primary-bright, #8B9FAF) 32%, var(--border));
    }
    .pg-reeval-status.is-warn {
      background: color-mix(in srgb, var(--ter-amber, #F5C434) 12%, var(--surface));
      border-bottom-color: color-mix(in srgb, var(--ter-amber, #F5C434) 36%, var(--border));
    }
    .pg-reeval-status.is-err {
      background: color-mix(in srgb, var(--ter-red, #dc2626) 8%, var(--surface));
      border-bottom-color: color-mix(in srgb, var(--ter-red, #dc2626) 32%, var(--border));
    }
    .pg-reeval-status-head {
      display: flex; align-items: flex-start; gap: 8px;
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text);
    }
    .pg-reeval-status-head .material-symbols-outlined { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .pg-reeval-status.is-ok .pg-reeval-status-head .material-symbols-outlined { color: var(--primary); }
    .pg-reeval-status.is-warn .pg-reeval-status-head .material-symbols-outlined { color: var(--ter-amber, #b45309); }
    .pg-reeval-status.is-err .pg-reeval-status-head .material-symbols-outlined { color: var(--ter-red, #dc2626); }
    .pg-reeval-status.is-busy .pg-reeval-status-head .material-symbols-outlined { color: var(--text-muted); }
    html.dark .pg-reeval-status.is-ok .pg-reeval-status-head .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    html.dark .pg-reeval-status.is-warn .pg-reeval-status-head .material-symbols-outlined { color: #F5C434; }
    html.dark .pg-reeval-status.is-err .pg-reeval-status-head .material-symbols-outlined { color: #fca5a5; }
    .pg-reeval-status p { margin: 6px 0 0; color: var(--text-muted); }
    .pg-reeval-status ul { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .pg-reeval-status li { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .pg-reeval-status a { color: var(--primary); font-weight: 700; text-decoration: none; }
    html.dark .pg-reeval-status a { color: var(--primary-bright, #93C5FD); }
    .pg-reeval-status a:hover { text-decoration: underline; }
    .pg-reeval-status code {
      font-family: var(--font-mono); font-size: 0.75rem;
      color: var(--text-subtle);
    }
    /* Circular close — no rounded-square tile behind the icon. */
    .pg-close {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    html.dark .pg-close { border-color: rgba(255,255,255,0.14); }
    .pg-close .material-symbols-outlined { font-size: 22px !important; line-height: 1 !important; }
    .pg-close:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: var(--shadow-1);
    }
    .pg-close:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
    }

    .pg-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 96px 22px 48px;
    }

    .pg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 72px 16px;
    }
    .pg-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      cursor: grab;
    }
    .pg-card:active { cursor: grabbing; }
    .pg-card.is-dragging { opacity: 0.4; }
    .pg-card.is-dragging .pg-card-viewport { transform: none; }
    .pg-card-skip {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 24px 18px; text-align: center; font-size: 0.75rem; font-weight: 600;
      color: var(--text-muted); line-height: 1.45;
    }
    .pg-card-viewport {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-2, var(--surface));
      box-shadow: var(--shadow-1);
      container-type: inline-size;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    html.dark .pg-card-viewport { border-color: rgba(255,255,255,0.10); }
    .pg-card.is-marketing .pg-card-viewport {
      border-color: var(--ter-amber, #FFC434);
    }
    html.dark .pg-card.is-marketing .pg-card-viewport {
      border-color: var(--ter-amber, #FFC434);
    }
    .pg-card:hover .pg-card-viewport {
      transform: translateY(-3px);
      box-shadow: var(--shadow-2);
      border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
    }
    .pg-card.is-marketing:hover .pg-card-viewport {
      border-color: var(--ter-amber, #FFC434);
    }
    .pg-card-shot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.22s ease;
    }
    .pg-card-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;
      height: 900px;
      border: 0;
      pointer-events: none;
      transform-origin: top left;
      /* 100cqw / 1440px is a number (length ÷ length). A bare 1440 is
         a number, so 100cqw / 1440 is a length — invalid for scale()
         and the iframe painted 1:1, clipped to the top-left rail. */
      transform: scale(var(--pg-scale, calc(100cqw / 1440px)));
      background: var(--surface);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .pg-card.is-live .pg-card-frame { opacity: 1; }
    .pg-card.is-live .pg-card-shot { opacity: 0; }
    .pg-card.is-dimmed .pg-card-shot,
    .pg-card.is-dimmed .pg-card-skip { opacity: 0.2; }
    .pg-card.is-dimmed.is-live .pg-card-frame { opacity: 0.2; }
    .pg-card.is-dimmed.is-live .pg-card-shot { opacity: 0; }
    /* Circular eye toggle — no rounded-square tile behind the icon. */
    .pg-card-eye {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 3;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      box-shadow: var(--shadow-1);
      opacity: 0.92;
      transition: border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }
    html.dark .pg-card-eye {
      border-color: rgba(255,255,255,0.16);
      background: color-mix(in srgb, #1A2339 88%, transparent);
    }
    .pg-card-eye .material-symbols-outlined { font-size: 13px !important; line-height: 1 !important; }
    .pg-card-eye:hover {
      opacity: 1;
      border-color: var(--primary);
      color: var(--primary);
    }
    .pg-card-eye[aria-pressed="true"] { color: var(--text-muted); }
    .pg-card-eye:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
    }
    .pg-card-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 0 2px;
      min-width: 0;
    }
    .pg-card-name {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pg-card:hover .pg-card-name { color: var(--primary-ink, var(--primary)); }
    .pg-card-href {
      font-size: 0.7rem;
      color: var(--text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pg-card-badge {
      margin-left: 6px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
      vertical-align: 1px;
    }
    html.dark .pg-card-badge { color: var(--primary-bright, #93C5FD); }

    /* ---- Re-evaluate progress panel (same pattern as All Modules) ---- */
    .pg-scan-scrim {
      position: fixed; inset: 0; z-index: 10050;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: color-mix(in srgb, #0b1220 55%, transparent);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .pg-scan-scrim.is-open { opacity: 1; pointer-events: auto; }
    .pg-scan-card {
      width: min(760px, calc(100vw - 32px));
      max-height: min(86vh, 880px);
      display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 18px;
      box-shadow: var(--shadow-card, 0 24px 60px rgba(0,0,0,0.28));
      overflow: hidden;
      transform: translateY(10px) scale(0.98); transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .pg-scan-scrim.is-open .pg-scan-card { transform: none; }
    html.dark .pg-scan-card {
      background: #14242f; border-color: rgba(255,255,255,0.08);
    }
    .pg-scan-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 20px 22px 12px; flex: 0 0 auto;
    }
    .pg-scan-head > .material-symbols-outlined {
      font-size: 22px; color: var(--primary); flex: 0 0 auto; margin-top: 4px;
    }
    html.dark .pg-scan-head > .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .pg-scan-titles { flex: 1 1 auto; min-width: 0; }
    .pg-scan-eyebrow {
      font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--primary);
    }
    html.dark .pg-scan-eyebrow { color: var(--primary-bright, #7FB0E0); }
    .pg-scan-title {
      margin: 4px 0 0;
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 1.28rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text);
    }
    .pg-scan-sub { margin: 6px 0 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; }
    .pg-scan-now {
      margin: 4px 0 0; font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pg-scan-close {
      border: 0; background: transparent; cursor: pointer; color: var(--text-muted);
      border-radius: 50%; padding: 6px; line-height: 0; flex: 0 0 auto;
    }
    .pg-scan-close:hover { background: var(--surface-2); color: var(--text); }
    html.dark .pg-scan-close:hover { background: rgba(255,255,255,0.06); }
    .pg-scan-close[hidden] { display: none; }
    .pg-scan-score {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding: 0 22px 8px;
    }
    .pg-scan-pct {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em;
      color: var(--text); font-variant-numeric: tabular-nums; line-height: 1;
    }
    .pg-scan-frac { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .pg-scan-bar {
      height: 8px; margin: 0 22px; border-radius: 999px;
      background: var(--surface-2); overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .pg-scan-fill {
      display: block; height: 100%; width: 0%; border-radius: 999px;
      background: var(--primary); transition: width 0.2s ease;
    }
    html.dark .pg-scan-fill { background: var(--primary-bright, #8B9FAF); }
    .pg-scan-log {
      margin: 14px 22px 0; padding: 0; list-style: none;
      flex: 1 1 auto; min-height: 180px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface-2);
    }
    html.dark .pg-scan-log { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); }
    .pg-scan-phase {
      display: flex; flex-direction: column; gap: 2px;
      padding: 10px 12px 8px;
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 0.82rem; font-weight: 800; color: var(--text);
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      border-bottom: 1px solid var(--border);
    }
    html.dark .pg-scan-phase {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 12%, #14242f);
      border-color: rgba(255,255,255,0.08);
    }
    .pg-scan-phase span { font-family: inherit; font-weight: 500; font-size: 0.72rem; color: var(--text-muted); }
    .pg-scan-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid var(--border);
      font-size: 0.75rem; color: var(--text-subtle);
    }
    html.dark .pg-scan-row { border-color: rgba(255,255,255,0.06); }
    .pg-scan-row:last-child { border-bottom: 0; }
    .pg-scan-row .material-symbols-outlined { font-size: 16px !important; flex: 0 0 auto; margin-top: 1px; }
    .pg-scan-row-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .pg-scan-row-name {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; color: inherit;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pg-scan-row-detail { font-size: 0.7rem; color: var(--text-muted); line-height: 1.35; }
    .pg-scan-row[data-state="pending"] { color: var(--text-subtle); }
    .pg-scan-row[data-state="run"] { color: var(--text); }
    .pg-scan-row[data-state="run"] .material-symbols-outlined { color: var(--primary); animation: pg-reeval-spin 0.8s linear infinite; }
    .pg-scan-row[data-state="ok"] { color: var(--text); }
    .pg-scan-row[data-state="ok"] .material-symbols-outlined { color: var(--sec-green, #16A34A); }
    html.dark .pg-scan-row[data-state="ok"] .material-symbols-outlined { color: #4ADE80; }
    .pg-scan-row[data-state="skip"] { color: var(--text-muted); }
    .pg-scan-row[data-state="skip"] .material-symbols-outlined { color: var(--text-subtle); }
    .pg-scan-row[data-state="err"] { color: var(--text); }
    .pg-scan-row[data-state="err"] .material-symbols-outlined { color: var(--ter-red, #dc2626); }
    html.dark .pg-scan-row[data-state="err"] .material-symbols-outlined { color: #fca5a5; }
    .pg-scan-row[data-state="info"] { color: var(--text-muted); }
    .pg-scan-row[data-state="info"] .material-symbols-outlined { color: var(--primary); }
    .pg-scan-foot {
      padding: 12px 22px 18px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex: 0 0 auto;
    }
    .pg-scan-note { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; min-width: 0; }
    .pg-scan-foot .adm-btn--primary .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

  </style>
</head>
<body data-page-gallery>
  <div id="pg-root"></div>
  <script type="module" src="../js/page-gallery.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
