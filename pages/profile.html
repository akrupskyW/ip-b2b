<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · My Profile</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint. Mirrors overview.html. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* =====================================================================
       Organization Profile — an account surface rendered by js/profile-flow.js
       into #agent-main-scroll. It pairs the persistent WISEcodeAI chat dock (left)
       with an editable org / contact / brand form (right): every intent chip
       drives a field here, and every on-form edit narrates back into the chat.
       Everything is token-driven so it tracks light/dark exactly.
    ===================================================================== */
    /* The Profile module carries no title strip, but it still gets the standard
       pane chrome — the ⋯ options menu + width toggle that every other module
       has. Rather than hide the whole header (which would drop those controls
       too), collapse it to zero height, hide only its title/icon, and pin the
       control cluster to the module's top-right corner — the same treatment
       headerless modules get under Appearance → header-float. */
    body[data-nav-id="profile"] #agent-main-header {
      height: 0;
      min-height: 0;
      padding: 0;
      border-bottom: 0;
      background: transparent;
      overflow: visible;
    }
    body[data-nav-id="profile"] #agent-main-header > *:not(.panel-controls) { display: none; }
    body[data-nav-id="profile"] #agent-main-header .panel-controls {
      position: absolute;
      top: 14px;
      right: 16px;
      margin: 0;
      z-index: 6;
    }
    /* Reserve room at the top-right so the pinned controls never collide with
       the header's Save CTA. */
    body[data-nav-id="profile"] .pf-head-actions { margin-right: 54px; }
    body[data-nav-id="profile"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="profile"] #modules-row { margin-top: 0; }

    .pf-wrap { padding: 26px 40px 64px; }

    /* Header row — title/lede on the left, a top Save CTA on the right (the
       footer keeps a second Save so the action is reachable at both ends). */
    .pf-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .pf-head-copy { min-width: 0; }
    .pf-head-actions { flex-shrink: 0; padding-top: 6px; }
    .pf-title { font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif); font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
    .pf-lede { font-size: 0.9rem; color: var(--text-muted); margin: 8px 0 0; max-width: 64ch; }

    /* ---------- Card ---------- */
    .pf-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 14px); box-shadow: var(--shadow-1); padding: 26px 26px 22px; }
    .pf-section + .pf-section { margin-top: 26px; padding-top: 26px; border-top: 1px solid var(--border); }
    .pf-section-title { display: flex; align-items: center; gap: 9px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 16px; }
    .pf-section-title .material-symbols-outlined { font-size: 18px; color: var(--primary-ink, var(--primary)); }

    /* ---------- Field grid (6-col) ---------- */
    .pf-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px 22px; }
    .pf-field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .pf-col-2 { grid-column: span 2; }
    .pf-col-3 { grid-column: span 3; }
    .pf-col-6 { grid-column: span 6; }
    .pf-label { display: inline-flex; align-items: center; gap: 3px; font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .pf-req { color: var(--sec-red-text, #c0392b); font-weight: 700; }
    .pf-input, .pf-select {
      width: 100%; height: 44px; box-sizing: border-box; padding: 0 18px;
      font-family: inherit; font-size: 0.9rem; color: var(--text);
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    html.dark .pf-input, html.dark .pf-select { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
    .pf-input::placeholder { color: var(--text-subtle); }
    .pf-input:focus, .pf-select:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .pf-select { appearance: none; -webkit-appearance: none; cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; padding-right: 38px; }

    /* Flash highlight when the chat jumps to / updates a field */
    @keyframes pf-flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); border-color: var(--primary); } 100% { box-shadow: 0 0 0 8px transparent; } }
    .pf-field.is-flash .pf-input, .pf-field.is-flash .pf-select, .pf-upload.is-flash { animation: pf-flash 1.1s ease-out; border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); }

    /* ---------- Associated brand ---------- */
    .pf-brandchips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pf-brandchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); }
    html.dark .pf-brandchip { background: rgba(255,255,255,0.05); }
    .pf-brandchip .material-symbols-outlined { font-size: 15px; color: var(--primary-ink, var(--primary)); }

    /* ---------- Uploader (logo / banner) ---------- */
    .pf-upload { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 16px; background: var(--surface-2); }
    html.dark .pf-upload { background: rgba(255,255,255,0.03); }
    .pf-upload + .pf-upload { margin-top: 16px; }
    .pf-upload-head { margin-bottom: 12px; }
    .pf-upload-title { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .pf-upload-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }
    .pf-uptabs { display: flex; gap: 18px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .pf-uptab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer; padding: 8px 2px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--text-muted); font-family: inherit; font-size: 0.8rem; font-weight: 600; transition: color 0.15s ease, border-color 0.15s ease; }
    .pf-uptab .material-symbols-outlined { font-size: 16px; }
    .pf-uptab:hover { color: var(--text); }
    .pf-uptab.is-active { color: var(--primary-ink, var(--primary)); border-bottom-color: var(--primary); }
    .pf-uprow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .pf-file-btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease; }
    html.dark .pf-file-btn { background: rgba(255,255,255,0.05); }
    .pf-file-btn:hover { border-color: var(--primary); color: var(--primary-ink, var(--primary)); }
    .pf-file-btn .material-symbols-outlined { font-size: 17px; }
    .pf-file-name { font-size: 0.82rem; color: var(--text-muted); }
    .pf-file-name.is-set { color: var(--text); font-weight: 600; }
    .pf-url-input { flex: 1; min-width: 180px; height: 38px; box-sizing: border-box; padding: 0 16px; font-family: inherit; font-size: 0.85rem; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; outline: none; }
    html.dark .pf-url-input { background: rgba(255,255,255,0.05); }
    .pf-url-input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
    .pf-hint { font-size: 0.74rem; color: var(--text-subtle); margin-top: 10px; }

    /* ---------- Avatar uploader ---------- */
    .pf-avatar-row { display: flex; align-items: flex-start; gap: 18px; }
    .pf-avatar-preview {
      flex-shrink: 0; width: 76px; height: 76px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: var(--surface); border: 1.5px dashed var(--border-strong); color: var(--text-subtle);
    }
    html.dark .pf-avatar-preview { background: rgba(255,255,255,0.05); }
    .pf-avatar-preview.is-set { border-style: solid; border-color: var(--border); }
    .pf-avatar-preview .material-symbols-outlined { font-size: 38px; }
    .pf-avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-avatar-controls { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pf-avatar-controls .pf-uptabs { margin-bottom: 12px; }
    .pf-avatar-remove { align-self: flex-start; margin-top: 12px; }
    .pf-avatar-remove:hover { border-color: var(--sec-red, #DC3038); color: var(--sec-red, #DC3038); }
    /* One-tap pattern presets */
    .pf-avatar-presets { margin-top: 16px; }
    .pf-avatar-presets-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 9px; }
    .pf-avatar-presets-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .pf-avatar-preset {
      width: 46px; height: 46px; padding: 0; border-radius: 50%; overflow: hidden; cursor: pointer;
      background: var(--surface); border: 2px solid var(--border-strong);
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pf-avatar-preset img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-avatar-preset:hover { transform: translateY(-1px) scale(1.05); border-color: var(--text-subtle); }
    .pf-avatar-preset.is-active { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    @media (max-width: 860px) { .pf-avatar-row { flex-direction: column; align-items: flex-start; } }

    /* ---------- Buttons / footer ---------- */
    .pf-footer { display: flex; justify-content: flex-end; margin-top: 24px; }
    .pf-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent;
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: filter 0.15s ease, background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    .pf-btn .material-symbols-outlined { font-size: 18px; }
    .pf-btn:active { transform: translateY(1px); }
    .pf-btn--primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-1); }
    .pf-btn--primary:hover { filter: brightness(1.08); }

    /* ---------- Toast ---------- */
    #pf-toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .pf-toast { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-3); opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .pf-toast.is-in { opacity: 1; transform: none; }
    .pf-toast .material-symbols-outlined { font-size: 17px; }

    @media (max-width: 860px) {
      .pf-wrap { padding: 20px 20px 48px; }
      .pf-grid { grid-template-columns: 1fr; }
      .pf-col-2, .pf-col-3, .pf-col-6 { grid-column: 1 / -1; }
      .pf-title { font-size: var(--module-title-size, 1.2rem); }
      .pf-head { flex-direction: column; gap: 16px; }
      .pf-head-actions { padding-top: 0; }
      .pf-head-actions .pf-btn { width: 100%; }
      /* Stacked layout: drop the desktop right-reserve and instead keep the
         copy clear of the pinned corner controls. */
      body[data-nav-id="profile"] .pf-head-actions { margin-right: 0; }
      body[data-nav-id="profile"] .pf-head-copy { padding-right: 44px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="profile" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <!-- Top bar rendered by the shared component in js/topbar.js (mountTopbar). -->
    <div id="topbar-row" hidden aria-hidden="true"></div>

    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
