<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Dashboard</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint so the page
       never flashes dark→light (or vice versa). Mirrors ai-chat.html storage. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="agent-page.css?v=noheader-scout3" />
  <link rel="stylesheet" href="scout-chat.css?v=noheader-scout3" />
  <link rel="stylesheet" href="dashboard.css?v=claim-restore2" />
  <style>
    /* =====================================================================
       Typography lock-in (aha.html only) — Noto Serif is the display face for
       H1/H2-level headings, the big stat numerals, and CTAs across the
       dashboard + Scout welcome. Body copy, labels, eyebrows, pills and
       descriptions stay in DM Sans. Scoped to body[data-product-id="dashboard"]
       so the shared agent-page.css / scout-chat.css aren't touched elsewhere.
    ===================================================================== */
    body[data-product-id="dashboard"] {
      --font-serif: 'Noto Serif', 'Noto Serif Fallback', Georgia, 'Times New Roman', serif;
    }

    /* --- H1 / H2 headings --- */
    body[data-product-id="dashboard"] .ws-heading,
    body[data-product-id="dashboard"] .dash-hero-title,
    body[data-product-id="dashboard"] .dash-section-title,
    body[data-product-id="dashboard"] .dash-card-title,
    body[data-product-id="dashboard"] .dash-pillars-cta-headline,
    body[data-product-id="dashboard"] .dash-modal-title,
    body[data-product-id="dashboard"] .dash-report-summary,
    body[data-product-id="dashboard"] .agent-hero-title,
    body[data-product-id="dashboard"] .agent-section-title,
    body[data-product-id="dashboard"] .agent-card-title {
      font-family: var(--font-serif);
      letter-spacing: -0.01em;
    }

    /* --- Big stat numerals (47 / 6% / 79 / 92% / 75 …) --- */
    body[data-product-id="dashboard"] .dash-bignum,
    body[data-product-id="dashboard"] .dash-pct,
    body[data-product-id="dashboard"] .dash-score-num .n,
    body[data-product-id="dashboard"] .dash-donut-num,
    body[data-product-id="dashboard"] .dash-headline-num,
    body[data-product-id="dashboard"] .dash-wisescore-num .n,
    body[data-product-id="dashboard"] .dash-pillar-score,
    body[data-product-id="dashboard"] .dash-report-stat-val {
      font-family: var(--font-serif);
    }

    /* --- CTAs / primary action buttons --- */
    body[data-product-id="dashboard"] .dash-btn,
    body[data-product-id="dashboard"] .dash-cta-banner-btn,
    body[data-product-id="dashboard"] .dash-pillars-cta-btn,
    body[data-product-id="dashboard"] .dash-ai-btn,
    body[data-product-id="dashboard"] .agent-cta {
      font-family: var(--font-serif);
      letter-spacing: 0;
    }
  </style>
</head>
<body data-product-id="dashboard" data-default-pivot="0" data-default-full-bleed="1" data-default-header="1">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <!-- Top bar rendered by the shared component in js/topbar.js (mountTopbar). -->
    <div id="topbar-row" hidden aria-hidden="true"></div>

    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    /* Minimum font-size floor (this page only): no rendered text ever drops
       below 12px. Content here is injected dynamically by agent-overview.js and
       the chart modules, so a MutationObserver re-applies the floor as nodes
       arrive. Decorative em-based glyphs (e.g. the superscript % on a large
       numeral) compute well above 12px and are left untouched. */
    (function () {
      var MIN = 12;
      function clamp(el) {
        if (el.nodeType !== 1 || el.dataset.wiseMinFs === '1') return;
        var fs = parseFloat(window.getComputedStyle(el).fontSize);
        if (fs && fs < MIN) {
          el.style.setProperty('font-size', MIN + 'px', 'important');
        }
        el.dataset.wiseMinFs = '1';
      }
      function scan(root) {
        if (!root || root.nodeType !== 1) return;
        clamp(root);
        var nodes = root.querySelectorAll('*');
        for (var i = 0; i < nodes.length; i++) clamp(nodes[i]);
      }
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var added = muts[i].addedNodes;
          for (var j = 0; j < added.length; j++) scan(added[j]);
        }
      }).observe(document.body, { childList: true, subtree: true });
      scan(document.body);
    })();
  </script>
  <script>
    /* Truncate the dashboard (this page only): keep everything up to and
       including the pillars section — whose CTA reads "Every metric,
       distribution & flagged product across all 3 pillars" — and drop every
       container rendered after it (breakdown, radar, ingredients, products,
       flags, distribution). Content is injected dynamically by
       dashboard-home.js, so a MutationObserver removes the trailing sections as
       soon as the pillars section appears. */
    (function () {
      function truncate() {
        var pillars = document.querySelector('.dash-pillars-section');
        if (!pillars) return false;
        var sib = pillars.nextElementSibling;
        while (sib) {
          var next = sib.nextElementSibling;
          sib.remove();
          sib = next;
        }
        return true;
      }
      truncate();
      /* Keep observing: the brand-toggle re-renders the whole dashboard, which
         re-adds the trailing sections, so re-truncate whenever the DOM changes. */
      new MutationObserver(truncate).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
