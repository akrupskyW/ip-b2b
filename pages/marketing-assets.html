<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Marketing Assets</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint so the page
       never flashes dark→light (or vice versa). Mirrors verification.html. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* no saved theme: default light */
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* =====================================================================
       Marketing Assets — a nested-table asset browser rendered by
       js/marketing-assets-flow.js into #agent-main-scroll. Mirrors the
       verification-flow shell: the shared pane header is hidden and the
       content supplies its own breadcrumb + serif title, so the module reads
       like the rest of the app while keeping its own chrome. Every class is
       token-driven so it tracks light/dark exactly like vf-/pf- surfaces.
    ===================================================================== */
    /* The shared #agent-main-header collapses to zero height but stays rendered
       so its ⋯ + width control cluster floats pinned to the module's top-right
       (see the shared rule in wise.css). The module supplies its own .ma-head
       title/breadcrumb below. */
    body[data-nav-id="marketing-assets"] .agent-main-scroll { padding: 0; }

    /* Zero the shell's default 8px top margin + bottom padding on #modules-row so
       the Marketing Assets Module and the WISEcodeAI chat dock line up flush with the
       full-height navigation rail (matches verification / gras-verification). */
    body[data-nav-id="marketing-assets"] #modules-row { margin-top: 0; }

    /* ---------- Head (serif title + subtitle) ---------- */
    .ma-head { padding: 26px 40px 0; }
    .ma-head-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .ma-head-titles { min-width: 0; }
    .ma-head-title {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text);
      line-height: 1.15; margin: 0; letter-spacing: -0.01em;
    }
    .ma-head-meta { font-size: 0.85rem; color: var(--text-muted); margin: 8px 0 0; max-width: 60ch; }

    /* ---------- Toolbar (search + in-pill filter) ----------
       One search field that fills the row. Filters live in a tune icon floated
       to the right inside the pill (same shape as .pf-filter-btn / .adm-search-filter)
       that opens a popover — never as a row of pills beside the search. */
    .ma-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .ma-search-inline { position: relative; display: inline-flex; align-items: center; flex: 1 1 320px; min-width: 240px; }
    .ma-search-inline > .material-symbols-outlined {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: var(--text-subtle); pointer-events: none;
    }
    .ma-search {
      width: 100%; height: 38px; box-sizing: border-box; padding: 0 72px 0 42px;
      font-family: inherit; font-size: 0.8125rem; font-weight: 400; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill, 999px); outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    html.dark .ma-search { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .ma-search::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .ma-search:focus {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .ma-search-clear {
      position: absolute; right: 38px; top: 50%; transform: translateY(-50%);
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0;
      background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ma-search-clear:hover { background: var(--surface-3); color: var(--text); }
    .ma-search-clear[hidden] { display: none; }
    .ma-search-clear .material-symbols-outlined { font-size: 16px; }

    /* Funnel floated inside the right edge of the search field. */
    .ma-filter-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .ma-filter-btn:hover, .ma-filter-btn.is-active { background: var(--surface-3); color: var(--text); }
    html.dark .ma-filter-btn:hover, html.dark .ma-filter-btn.is-active { background: rgba(255,255,255,0.08); }
    .ma-filter-btn .material-symbols-outlined { font-size: 18px !important; }
    .ma-filter-btn.has-filters { color: var(--primary-ink, var(--primary)); }
    html.dark .ma-filter-btn.has-filters { color: var(--primary-bright, #8B9FAF); }
    .ma-filter-btn .ma-filter-dot {
      position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%;
      background: var(--primary); border: 1.5px solid var(--surface-2); display: none;
    }
    .ma-filter-btn.has-filters .ma-filter-dot { display: block; }

    .ma-filter-pop {
      position: absolute; z-index: 60; top: calc(100% + 8px); right: 0; width: 300px; max-width: 92vw;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow-2, 0 12px 32px rgba(0,0,0,0.18)); padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .ma-filter-pop[hidden] { display: none; }
    .ma-filter-pop-head { display: flex; align-items: center; justify-content: space-between; }
    .ma-filter-pop-title { font-size: 13px; font-weight: 800; color: var(--text); }
    .ma-filter-clear {
      border: none; background: transparent; color: var(--primary-ink, var(--primary));
      font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
      padding: 2px 4px; border-radius: 6px;
    }
    .ma-filter-clear:hover { text-decoration: underline; }
    html.dark .ma-filter-clear { color: var(--primary-bright, #8B9FAF); }
    .ma-filter-label { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 7px; }
    .ma-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ma-fchip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border-strong); background: var(--surface-2);
      font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--text-muted);
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    html.dark .ma-fchip { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.12); }
    .ma-fchip .material-symbols-outlined { font-size: 13px !important; line-height: 1 !important; }
    .ma-fchip:hover { color: var(--text); border-color: var(--primary); }
    .ma-fchip.is-on {
      color: #fff; border-color: var(--primary); background: var(--primary);
    }
    .ma-fchip.is-on .material-symbols-outlined { color: #fff; }
    html.dark .ma-fchip.is-on, html.dark .ma-fchip.is-on:hover {
      color: #fff; border-color: var(--primary); background: var(--primary);
    }
    .ma-filter-pop-foot { display: flex; justify-content: flex-end; padding-top: 2px; }
    .ma-searchbar-meta {
      display: flex; align-items: center; gap: 6px;
      margin: -4px 2px 12px; font-size: 0.76rem; font-weight: 600; color: var(--text-muted);
    }
    .ma-searchbar-meta .material-symbols-outlined { font-size: 16px; color: var(--text-subtle); }

    /* Matched text in a name during search. */
    .ma-hl {
      background: color-mix(in srgb, var(--ter-amber) 45%, transparent);
      color: inherit; border-radius: 3px; padding: 0 1px;
    }
    html.dark .ma-hl { background: color-mix(in srgb, var(--ter-amber) 34%, transparent); }

    /* Follow-up action chips inside a WISEcodeAI reply (download / open the exact
       file just discussed). Reuses the shared .chip pill so it reads as a
       suggested reply; the primary tint marks it as an actionable download. */
    .ma-reply-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ma-do-chip {
      background: color-mix(in srgb, var(--primary) 12%, var(--surface-2));
      border-color: color-mix(in srgb, var(--primary) 45%, var(--border-strong));
      color: var(--text); font-weight: 600;
    }
    .ma-do-chip:hover {
      background: color-mix(in srgb, var(--primary) 20%, var(--surface-2));
      border-color: var(--primary);
    }
    .ma-do-chip .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }
    html.dark .ma-do-chip { background: color-mix(in srgb, var(--primary) 26%, transparent); border-color: var(--primary); }

    /* ---------- Score cards (file-type summary + filter) ----------
       Compact stat tiles above the table, one per file type in the library
       (Images, Vectors, PDFs, Documents) plus an "All assets" card. They read
       exactly like the product-portfolio "at a glance" tiles — a big serif
       number on top and a small label below, no icon, no description — and
       double as filters: click one to scope the table to that type; click it
       again (or "All assets") to clear. Tokens track light/dark. */
    .ma-scorecards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .ma-scorecard {
      flex: 1 1 120px; min-width: 108px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 12px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; box-shadow: var(--shadow-1);
      font-family: inherit; text-align: center; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    /* Scorecard fill mirrors the chat module (.sc-card) across every theme. */
    html.dark .ma-scorecard { background: #1A2339; }
    html.chat-tint:not(.dark) .ma-scorecard { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .ma-scorecard { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .ma-scorecard:hover { transform: translateY(-1px); box-shadow: var(--shadow-card, var(--shadow-2)); border-color: var(--border-strong); }
    .ma-scorecard:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .ma-scorecard.is-active {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 10%, var(--surface));
      box-shadow: inset 0 0 0 1px var(--primary), var(--shadow-1);
    }
    html.dark .ma-scorecard.is-active { background: color-mix(in srgb, var(--primary) 26%, transparent); }
    .ma-sc-metric { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); }
    .ma-sc-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    /* Per-type number tint so each tile reads at a glance (mirrors the
       portfolio stat colours). */
    .ma-scorecard--image .ma-sc-metric { color: var(--sec-green); }
    .ma-scorecard--vector .ma-sc-metric { color: #8a6400; }
    html.dark .ma-scorecard--vector .ma-sc-metric { color: #FFD98A; }
    .ma-scorecard--pdf .ma-sc-metric { color: var(--sec-red); }
    .ma-scorecard--doc .ma-sc-metric { color: #0E7490; }
    html.dark .ma-scorecard--doc .ma-sc-metric { color: #67E8D8; }

    /* ---------- Body + card ---------- */
    .ma-body { padding: 18px 40px 56px; }
    .ma-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-1);
      padding: 8px;
      overflow: visible;
    }

    /* ---------- Nested tables ---------- */
    .ma-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .ma-table--nested { border-top: 0; }
    .ma-table thead th {
      padding: 10px 14px; text-align: left; vertical-align: middle;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-subtle); border-bottom: 1px solid var(--border);
      background: var(--surface); white-space: nowrap;
    }
    .ma-th--sortable { cursor: pointer; user-select: none; }
    .ma-th--sortable:hover { color: var(--text-muted); }
    .ma-th--num { text-align: right; }
    .ma-th--end { text-align: right; }
    .ma-sort-arrow {
      display: inline-flex; width: 12px; height: 12px; margin-left: 5px; vertical-align: middle;
      opacity: 0.3; transition: opacity 0.12s ease, transform 0.12s ease;
    }
    .ma-sort-arrow svg { width: 12px; height: 12px; }
    .ma-th--sortable[data-ma-dir="asc"] .ma-sort-arrow { opacity: 1; color: var(--primary-ink, var(--primary)); transform: rotate(180deg); }
    .ma-th--sortable[data-ma-dir="desc"] .ma-sort-arrow { opacity: 1; color: var(--primary-ink, var(--primary)); }
    /* A folder's children live in a nested <table> dropped into a full-width
       cell — literal "tables within tables". Each level indents from the left
       and gains a soft guide rail so the hierarchy reads at a glance. */
    .ma-nest-cell {
      padding: 0 0 0 22px;
      border-left: 2px solid color-mix(in srgb, var(--primary) 22%, transparent);
      margin-left: 20px;
    }
    .ma-nest-inner { padding: 2px 0 6px 12px; }

    .ma-row { transition: background 0.15s ease; }
    .ma-row > td {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }
    .ma-table > tbody > tr.ma-row:first-child > td { border-top: 0; }
    .ma-row:hover > td { background: var(--surface-2); }
    html.dark .ma-row:hover > td { background: rgba(255,255,255,0.04); }
    .ma-row--folder { cursor: pointer; }
    .ma-nest-row > td { padding: 0; border-top: 1px solid var(--border); }

    /* Pulse a folder row when a WISEcodeAI chip jumps you to it. */
    .ma-row.ma-flash > td { animation: maFlash 1.4s ease; }
    @keyframes maFlash {
      0%, 100% { background: transparent; }
      15%, 45% { background: color-mix(in srgb, var(--primary) 14%, transparent); }
    }

    .ma-cell-icon { width: 44px; }
    .ma-cell-size, .ma-th-size { width: 92px; }
    .ma-cell-date, .ma-th-date { width: 128px; }
    .ma-cell-actions, .ma-table thead th.ma-th-actions { width: 44px; padding-left: 8px; padding-right: 4px; }
    .ma-cell-size { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--text-muted); }
    .ma-cell-date { font-size: 0.8rem; color: var(--text-muted); }
    .ma-cell-actions { white-space: nowrap; text-align: center; }

    /* Leading ⋮ actions — same shell as .pf-rowmenu / .adm-rowmenu. The
       popover opens to the right of the icon (never directly below). */
    .ma-rowmenu { position: relative; display: inline-flex; }
    .ma-rowmenu-btn {
      width: 30px; height: 30px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid transparent; background: transparent; color: var(--text-subtle);
      cursor: pointer; overflow: hidden; transition: background 0.15s ease, color 0.15s ease;
    }
    .ma-rowmenu-btn:hover, .ma-rowmenu.is-open .ma-rowmenu-btn { background: var(--surface-2); color: var(--text); }
    html.dark .ma-rowmenu-btn:hover, html.dark .ma-rowmenu.is-open .ma-rowmenu-btn { background: rgba(255,255,255,0.06); }
    .ma-rowmenu-btn .material-symbols-outlined { font-size: 18px !important; line-height: 1; }
    .ma-rowmenu-pop {
      position: absolute; z-index: 40; top: 0; left: calc(100% + 4px); min-width: 188px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-2, 0 12px 32px rgba(0,0,0,0.18)); padding: 6px;
    }
    .ma-rowmenu-pop[hidden] { display: none; }
    .ma-rowmenu-item {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border: none; background: transparent; cursor: pointer; border-radius: 8px;
      font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text); text-align: left;
    }
    .ma-rowmenu-item:hover { background: var(--surface-2); }
    html.dark .ma-rowmenu-item:hover { background: rgba(255,255,255,0.06); }
    .ma-rowmenu-item .material-symbols-outlined {
      font-size: 16px !important; line-height: 1 !important; color: var(--text-subtle);
      width: 18px; height: 18px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ma-rowmenu-item:hover .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }

    /* File-type / folder icon — the glyph only, no background square. Each icon
       is chosen from the row's own label (a shield, an envelope, a package…),
       tinted by kind so the column scans quickly. */
    .ma-ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex-shrink: 0; }
    .ma-ic .material-symbols-outlined { font-size: 24px; }
    .ma-ic--folder .material-symbols-outlined { color: var(--primary); }
    html.dark .ma-ic--folder .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .ma-ic--pdf .material-symbols-outlined { color: var(--sec-red); }
    .ma-ic--img .material-symbols-outlined { color: var(--sec-green); }
    .ma-ic--vector .material-symbols-outlined { color: var(--ter-amber-text); }
    html.dark .ma-ic--vector .material-symbols-outlined { color: var(--ter-amber); }
    .ma-ic--doc .material-symbols-outlined { color: var(--text-subtle); }

    /* Name + meta cell */
    .ma-name-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ma-name-block { min-width: 0; }
    .ma-name { font-size: 0.9rem; font-weight: 600; color: var(--text); line-height: 1.25; }
    .ma-row--folder .ma-name { font-weight: 700; }
    .ma-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    .ma-meta-dot { margin: 0 5px; opacity: 0.6; }
    .ma-count-pill {
      display: inline-flex; align-items: center; gap: 4px;
      margin-left: 8px; padding: 1px 8px; border-radius: 999px;
      font-size: 0.66rem; font-weight: 700; color: var(--text-subtle);
      background: var(--surface-2); border: 1px solid var(--border);
      vertical-align: middle;
    }
    html.dark .ma-count-pill { background: rgba(255,255,255,0.05); }
    .ma-name--warn { color: var(--sec-red-text); }

    /* Disclosure caret on folder names — not an action, just open/closed state. */
    .ma-chevron {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; flex-shrink: 0; color: var(--text-subtle);
      transition: transform 0.2s ease;
    }
    .ma-chevron .material-symbols-outlined { font-size: 18px; }
    .ma-row--folder.is-open .ma-chevron { transform: rotate(90deg); color: var(--primary); }
    html.dark .ma-row--folder.is-open .ma-chevron { color: var(--primary-bright, #8B9FAF); }

    /* Action buttons (Preview / Download) */
    .ma-actions { display: inline-flex; align-items: center; gap: 8px; }
    .ma-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 16px; border-radius: 999px;
      font-family: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer;
      border: 1px solid transparent; transition: filter 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .ma-btn .material-symbols-outlined { font-size: 16px; }
    .ma-btn:active { transform: translateY(1px); }
    .ma-btn--sm { height: 30px; padding: 0 12px; font-size: 0.72rem; }
    .ma-btn--primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-1); }
    .ma-btn--primary:hover { filter: brightness(1.08); }
    .ma-btn--ghost {
      background: transparent; color: var(--text-muted);
      border-color: var(--border-strong);
    }
    .ma-btn--ghost:hover { color: var(--text); background: var(--surface-2); }
    html.dark .ma-btn--ghost:hover { background: rgba(255,255,255,0.05); }

    .ma-empty {
      padding: 18px 14px; font-size: 0.8rem; color: var(--text-muted);
      font-style: italic; text-align: left;
    }

    /* ---------- Preview modal ---------- */
    .ma-modal-scrim {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(5, 12, 18, 0.55); backdrop-filter: blur(2px);
      display: flex; align-items: stretch; justify-content: stretch; padding: 0;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .ma-modal-scrim.is-open { opacity: 1; }
    .ma-modal {
      width: 100%; height: 100%; max-height: none; overflow: hidden;
      display: flex; flex-direction: column;
      background: var(--surface); border: 0;
      border-radius: 0; box-shadow: none;
      transform: translateY(8px); transition: transform 0.24s ease;
    }
    .ma-modal-scrim.is-open .ma-modal { transform: none; }
    .ma-modal-head {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
