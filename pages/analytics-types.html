  <script>
    /* =====================================================================
       Polar area chart (analytics-types.html only).
       The pillar-metrics chart is rendered as a radar (spider) web by the
       shared js/dashboard-home.js. On this page we swap that radar for a
       polar area chart: 15 equal-angle wedges, one per metric, each wedge's
       radius proportional to the metric's 0–100 score and coloured by its
       status tier. We read the data straight off the rendered radar's dots
       (data-value / data-color / data-label / data-ring) and axis <text>
       labels — so the shared module is untouched and aha.html still shows
       the original radar. The radar's own animation/replay/tooltip helpers
       all null-guard, so removing the radar internals here is a safe no-op
       for them.
    ===================================================================== */
    (function () {
      const SIZE = 460, CX = 230, CY = 230, MAX_R = 145, LABEL_R = MAX_R + 20;
      const LEVELS = [20, 40, 60, 80, 100];
      const NS = 'http://www.w3.org/2000/svg';
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const rad = (deg) => (deg * Math.PI) / 180;
      const P = (deg, r) => [CX + r * Math.cos(rad(deg)), CY + r * Math.sin(rad(deg))];
      const f = (v) => Number(v).toFixed(1);

      /* One hue per pillar so the rosette reads as a status chart, not a
         single navy family. Within a pillar the wedge shade ramps with the
         metric's score (higher score → richer/darker). */
      const PILLAR_HUE = {
        'Nutrient Quality':   { h: 146, s: 54, l: 43 },  /* --sec-green  #32A966 */
        'Ingredient Quality': { h: 210, s: 54, l: 31 },  /* --primary    #25507C */
        'Health Outcomes':    { h:  43, s: 100, l: 60 }, /* --ter-amber  #FFC434 */
      };
      function pillarColor(group, value) {
        const base = PILLAR_HUE[group] || { h: 146, s: 54, l: 43 };
        const t = Math.max(0, Math.min(1, (value - 45) / 55)); /* 45–100 → 0–1 */
        const l = base.l + (1 - t) * 24;  /* lower score → lighter   */
        const s = base.s - (1 - t) * 16;  /* lower score → softer     */
        return `hsl(${base.h} ${Math.round(s)}% ${Math.round(l)}%)`;
      }
      /* Representative solid hue for a pillar's legend dot. */
      function pillarSwatch(group) {
        const b = PILLAR_HUE[group] || { h: 146, s: 54, l: 43 };
        return `hsl(${b.h} ${b.s}% ${b.l + 4}%)`;
      }

      /* Word-wrap a long metric name into <= 2 short lines so the full names
         ("Banned / Unsafe Ingredients", "Carbohydrate Quality", …) ring the
         chart without clipping. */
      function wrapLabel(text, max) {
        const words = String(text).split(/\s+/);
        const lines = [];
        let cur = '';
        words.forEach((w) => {
          const cand = cur ? cur + ' ' + w : w;
          if (cand.length > max && cur) { lines.push(cur); cur = w; }
          else cur = cand;
        });
        if (cur) lines.push(cur);
        return lines;
      }

      /* Pull each metric off the rendered radar. Dots and axis labels are
         emitted in the same axis order, so they pair by index. */
      function readAxes(radar) {
        const dots = [...radar.querySelectorAll('.dash-radar-dot')];
        const labels = [...radar.querySelectorAll('.dash-radar-axis-label')].map((t) => t.textContent.trim());
        return dots.map((dot, i) => ({
          value: parseFloat(dot.dataset.value) || 0,
          color: dot.dataset.color || dot.getAttribute('fill') || 'var(--primary)',
          full: dot.dataset.label || '',
          group: dot.dataset.ring || '',
          short: labels[i] || dot.dataset.label || '',
        }));
      }

      function wedgePath(a0, a1, r) {
        if (r <= 0) return `M ${f(CX)} ${f(CY)} Z`;
        const [x0, y0] = P(a0, r);
        const [x1, y1] = P(a1, r);
        const large = a1 - a0 > 180 ? 1 : 0;
        return `M ${f(CX)} ${f(CY)} L ${f(x0)} ${f(y0)} A ${f(r)} ${f(r)} 0 ${large} 1 ${f(x1)} ${f(y1)} Z`;
      }

      function buildSvg(axes) {
        const n = axes.length || 1;
        const span = 360 / n;
        const half = span / 2;
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'pa-svg');
        svg.setAttribute('viewBox', `0 0 ${SIZE} ${SIZE}`);
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', 'WISEscore pillar metrics polar area chart');

        const add = (el) => svg.appendChild(el);
        const mk = (tag, attrs) => {
          const el = document.createElementNS(NS, tag);
          for (const k in attrs) el.setAttribute(k, attrs[k]);
          return el;
        };

        /* Inset-shadow filter — paints a soft dark rim on the inside edge of a
           shape, so the grey backing disc looks debossed (pressed into the
           card) rather than floating on top of it. */
        const defs = mk('defs', {});
        const filt = mk('filter', { id: 'pa-well', x: '-25%', y: '-25%', width: '150%', height: '150%' });
        filt.appendChild(mk('feComponentTransfer', { in: 'SourceAlpha', result: 'inv' }));
        filt.lastChild.appendChild(mk('feFuncA', { type: 'table', tableValues: '1 0' }));
        filt.appendChild(mk('feGaussianBlur', { in: 'inv', stdDeviation: '5' }));
        filt.appendChild(mk('feOffset', { dx: '0', dy: '3', result: 'blur' }));
        filt.appendChild(mk('feFlood', { 'flood-color': 'rgba(8,15,26,0.34)', result: 'col' }));
        filt.appendChild(mk('feComposite', { in: 'col', in2: 'blur', operator: 'in' }));
        filt.appendChild(mk('feComposite', { in2: 'SourceAlpha', operator: 'in', result: 'shadow' }));
        const merge = mk('feMerge', {});
        merge.appendChild(mk('feMergeNode', { in: 'SourceGraphic' }));
        merge.appendChild(mk('feMergeNode', { in: 'shadow' }));
        filt.appendChild(merge);
        defs.appendChild(filt);
        add(defs);

        /* Recessed backing disc the rosette sits inside. */
        add(mk('circle', { class: 'pa-bg', cx: CX, cy: CY, r: f(MAX_R + 8), filter: 'url(#pa-well)' }));

        /* Concentric grid rings. */
        LEVELS.forEach((lv) => add(mk('circle', { class: 'pa-grid', cx: CX, cy: CY, r: f((lv / 100) * MAX_R) })));

        /* Spokes at every sector boundary. */
        for (let i = 0; i < n; i++) {
          const [x, y] = P(-90 + span * i - half, MAX_R);
          add(mk('line', { class: 'pa-spoke', x1: CX, y1: CY, x2: f(x), y2: f(y) }));
        }

        /* Wedges — start collapsed at the centre for the entrance sweep. */
        const wedges = axes.map((a, i) => {
          const center = -90 + span * i;
          const a0 = center - half, a1 = center + half;
          const color = pillarColor(a.group, a.value);
          const path = mk('path', { class: 'pa-wedge', fill: color, d: wedgePath(a0, a1, 0) });
          path.style.color = color;
          const title = document.createElementNS(NS, 'title');
          title.textContent = `${a.full}: ${a.value}` + (a.group ? ` · ${a.group}` : '');
          path.appendChild(title);
          add(path);
          return { path, a0, a1, rFull: (a.value / 100) * MAX_R };
        });

        /* Numeric scale climbing the top axis. */
        LEVELS.forEach((lv) => {
          const [x, y] = P(-90, (lv / 100) * MAX_R);
          const t = mk('text', { class: 'pa-ringval', x: f(x + 8), y: f(y + 3) });
          t.textContent = lv;
          add(t);
        });

        /* Axis labels — the FULL metric name (e.g. "Anti-Inflammatory",
           "Gut Health"), wrapped to <= 2 lines, anchored by quadrant and
           vertically centred on the axis so they ring the chart cleanly. */
        const LH = 12;
        axes.forEach((a, i) => {
          const center = -90 + span * i;
          const [x, y] = P(center, LABEL_R);
          const cos = Math.cos(rad(center)), sin = Math.sin(rad(center));
          let anchor = 'middle';
          if (cos > 0.25) anchor = 'start'; else if (cos < -0.25) anchor = 'end';
          let dy = 4;
          if (sin < -0.5) dy = -1; else if (sin > 0.5) dy = 11;
          const lines = wrapLabel(a.full || a.short, 15);
          const t = mk('text', { class: 'pa-axis-label', x: f(x), y: f(y), 'text-anchor': anchor });
          const startDy = dy - ((lines.length - 1) * LH) / 2;
          lines.forEach((ln, li) => {
            const ts = mk('tspan', { x: f(x), dy: f(li === 0 ? startDy : LH) });
            ts.textContent = ln;
            t.appendChild(ts);
          });
          add(t);
        });

        return { svg, wedges };
      }

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function animate(wedges, duration) {
        if (reduceMotion()) {
          wedges.forEach((w) => w.path.setAttribute('d', wedgePath(w.a0, w.a1, w.rFull)));
          return;
        }
        const start = performance.now();
        const tick = (now) => {
          const e = easeOutCubic(Math.min(1, (now - start) / duration));
          wedges.forEach((w) => w.path.setAttribute('d', wedgePath(w.a0, w.a1, w.rFull * e)));
          if (e < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      /* Repaint the radar card's pillar legend dots to the matching pillar
         hue, so the legend keys the three colour families in the chart. */
      function recolorLegend(radar) {
        const card = radar.closest('.dash-radar-card') || radar.parentElement;
        if (!card) return;
        card.querySelectorAll('.dash-radar-legend .dash-legend-item').forEach((item) => {
          const name = (item.querySelector('.dash-legend-l') || item).textContent.trim();
          const key = Object.keys(PILLAR_HUE).find((k) => name.indexOf(k) !== -1);
          const dot = item.querySelector('.dash-dot');
          if (key && dot) dot.style.background = pillarSwatch(key);
        });
      }

      function buildBars(axes) {
        const wrap = document.createElement('div');
        wrap.className = 'pa-bars';
        wrap.setAttribute('aria-label', 'Pillar metrics as bars');
        axes.forEach((a) => {
          const row = document.createElement('div');
          row.className = 'pa-bar-row';
          const label = a.full || a.short || '';
          row.innerHTML =
            `<div class="pa-bar-head"><span>${esc(label)}</span><span class="pa-bar-val">${Math.round(a.value)}</span></div>` +
            `<div class="pa-bar-track"><div class="pa-bar-fill" style="width:${Math.max(0, Math.min(100, a.value))}%;background:${a.color}"></div></div>`;
          wrap.appendChild(row);
        });
        return wrap;
      }

      function convert(radar) {
        if (!radar || radar.dataset.polar === '1') return false;
        const axes = readAxes(radar);
        if (!axes.length) return false;
        radar.dataset.polar = '1';
        const { svg, wedges } = buildSvg(axes);
        radar.innerHTML = '';
        radar.appendChild(svg);
        radar.appendChild(buildBars(axes));
        radar._paWedges = wedges;
        radar._paAxes = axes;
        recolorLegend(radar);
        if (window.IntersectionObserver) {
          const io = new IntersectionObserver((entries) => {
            entries.forEach((en) => { if (en.isIntersecting) { animate(wedges, 1200); io.disconnect(); } });
          }, { threshold: 0.35 });
          io.observe(radar);
        } else {
          animate(wedges, 1200);
        }
        return true;
      }

      /* Replay the sweep on tap. The shared dashboard attaches a capture-phase
         click handler on the scroll host that would otherwise swallow the
         gesture (and no-op, since the radar internals are gone), so we
         intercept earlier at the document level. */
      document.addEventListener('click', (e) => {
        const radar = e.target.closest && e.target.closest('.dash-radar[data-polar="1"]');
        if (!radar || !radar._paWedges) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        animate(radar._paWedges, 1200);
      }, true);

      function scan() {
        let did = false;
        document.querySelectorAll('.dash-radar-card .dash-radar').forEach((r) => { if (convert(r)) did = true; });
        return did;
      }

      /* Snap every polar wedge to its full radius for export/print — the
         entrance sweep is gated on scroll-into-view, so an off-screen radar
         would otherwise print collapsed at the centre. */
      function finalizeForExport() {
        document.querySelectorAll('.dash-radar[data-polar="1"]').forEach((radar) => {
          if (!radar._paWedges) return;
          radar._paWedges.forEach((w) => w.path.setAttribute('d', wedgePath(w.a0, w.a1, w.rFull)));
        });
      }
      window.addEventListener('wise:finalize-charts', finalizeForExport);
      window.addEventListener('beforeprint', finalizeForExport);

      window.__attPolarSetOrient = function (orient) {
        document.querySelectorAll('.dash-radar[data-polar="1"]').forEach((radar) => {
          radar.classList.toggle('is-bars', orient === 'v');
        });
      };

      function init() {
        scan();
        const host = document.getElementById('agent-main-scroll') || document.body;
        new MutationObserver(scan).observe(host, { childList: true, subtree: true });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script type="module">
    /* =====================================================================
       Floating section navigation (analytics-types.html only). Builds a fixed
       right-edge rail listing every chart / section on the page and wires it
       up as a scrollspy: clicking an item smooth-scrolls the report's scroll
       pane (#agent-main-scroll) to that section, and an IntersectionObserver
       keeps the item for the section currently in view highlighted.

       The list of sections lives in js/analytics-types-catalog.js — the same
       file All Modules uses for its thumbnail gallery. Add a chart there
       (and render it on this page) and both surfaces stay in sync.

       The dashboard body is injected asynchronously by agent-overview.js, and
       two of the sections (the Portfolio Overview stats row and the
       Performance Matrix card) are added later still by the inline scripts
       above — so we (re)build whenever the DOM changes until every known
       section has appeared, sorting the rail by true document order.
    ===================================================================== */
    import { ANALYTICS_NAV as SECTIONS } from '../js/analytics-types-catalog.js';
    (function () {

      const nav = document.getElementById('az-nav');
      const list = document.getElementById('az-nav-inner');
      if (!nav || !list) return;

      const reduceMotion = () =>
        window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const scroller = () => document.getElementById('agent-main-scroll');

      /* ---- Skinny-bar toggle -------------------------------------------------
         Flips every chunky .dash-ws-health-bar to a slim track and relocates the
         score from inside the fill up into the row's head. The relocated score
         is injected once per bar (hidden until skinny mode via CSS); we read the
         final value off the count-up's data-count-to so it's correct regardless
         of animation timing. State persists across reloads. */
      const SKINNY_KEY = 'az-skinny-bars';

      function readScore(num) {
        const to = num.getAttribute('data-count-to') || (num.textContent || '').trim();
        let suffix = num.getAttribute('data-count-suffix') || '';
        if (!suffix && num.closest('.dash-pct-wrap')) suffix = '%';
        return to + suffix;
      }

      function enhanceBars() {
        const sc = scroller();
        const root = (sc && sc.querySelector('.dash')) || document.body;
        root.querySelectorAll('.dash-ws-health-bar').forEach((bar) => {
          if (bar.dataset.azScore) return;
          const num = bar.querySelector('.dash-ws-health-num');
          if (!num) return;
          bar.dataset.azScore = '1';
          const chip = document.createElement('span');
          chip.className = 'az-score-chip';
          chip.textContent = readScore(num);
          const fill = bar.querySelector('.dash-ws-health-fill');
          if (fill && fill.style.background) chip.style.color = fill.style.background;
          const head = bar.previousElementSibling;
          if (head && head.nodeType === 1 && /-bar-head\b/.test(head.className || '')) {
            head.appendChild(chip);
          } else {
            chip.classList.add('az-score-chip--overlay');
            bar.appendChild(chip);
          }
        });
      }

      function applySkinny(on) {
        document.body.classList.toggle('az-skinny-bars', on);
        try { localStorage.setItem(SKINNY_KEY, on ? '1' : '0'); } catch (_) {}
      }

      let skinny = false;
      try { skinny = localStorage.getItem(SKINNY_KEY) === '1'; } catch (_) {}

      function buildToggle() {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'az-toggle';
        btn.setAttribute('role', 'switch');
        btn.setAttribute('aria-checked', skinny ? 'true' : 'false');
        btn.title = 'Toggle slim health bars';
        btn.innerHTML =
          '<span class="az-nav-label">Skinny bars</span>' +
          '<span class="az-switch"><span class="az-switch-dot"></span></span>';
        btn.addEventListener('click', () => {
          skinny = !skinny;
          btn.setAttribute('aria-checked', skinny ? 'true' : 'false');
          enhanceBars();
          applySkinny(skinny);
        });
        list.appendChild(btn);
        const sep = document.createElement('div');
        sep.className = 'az-nav-sep';
        list.appendChild(sep);
      }

      let entries = [];   /* [{ el, btn }] in document order */
      let spy = null;
      let activeEl = null;

      function setActive(el) {
        if (el === activeEl) return;
        activeEl = el;
        entries.forEach((e) => e.btn.classList.toggle('is-active', e.el === el));
      }

      function scrollTo(el, toTop) {
        const sc = scroller();
        if (!sc) return;
        /* The page header sits above the scroll pane (it isn't a child of it),
           so there's nothing to scroll *to* — jump the pane back to the top. */
        if (toTop) {
          sc.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
          return;
        }
        const top = el.getBoundingClientRect().top
          - sc.getBoundingClientRect().top + sc.scrollTop - 18;
        sc.scrollTo({ top: Math.max(0, top), behavior: reduceMotion() ? 'auto' : 'smooth' });
      }

      /* Scrollspy: a section is "current" while its top sits in the upper band
         of the scroll pane. We keep the set of in-band sections and light up
         the earliest one in document order. */
      function wireSpy() {
        const sc = scroller();
        if (!sc || !('IntersectionObserver' in window)) return;
        if (spy) spy.disconnect();
        const visible = new Set();
        spy = new IntersectionObserver((obs) => {
          obs.forEach((o) => {
            if (o.isIntersecting) visible.add(o.target);
            else visible.delete(o.target);
          });
          for (const e of entries) {
            if (visible.has(e.el)) { setActive(e.el); return; }
          }
        }, { root: sc, rootMargin: '-12% 0px -70% 0px', threshold: 0 });
        /* Skip the page header — it lives outside the scroll root, so the
           observer can never report it. It stays click-to-top only. */
        entries.forEach((e) => { if (!e.doc) spy.observe(e.el); });
      }

      function build() {
        const sc = scroller();
        const dash = sc && sc.querySelector('.dash');
        if (!dash) return false;

        const found = [];
        SECTIONS.forEach((s) => {
          let el;
          /* Most sections live inside `.dash`; the page header (doc:true) sits
             above the scroll pane, so resolve it against the whole document. */
          try { el = s.doc ? document.querySelector(s.sel) : dash.querySelector(s.sel); } catch (_) { el = null; }
          if (el && !found.some((f) => f.el === el)) found.push({ el, label: s.label, doc: !!s.doc });
        });
        if (!found.length) return false;

        found.sort((a, b) =>
          (a.el.compareDocumentPosition(b.el) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);

        /* Skip a rebuild if the same sections are already shown, so the live
           MutationObserver doesn't thrash the rail on unrelated DOM churn. */
        const sig = found.map((f) => f.label).join('|');
        if (sig === list.dataset.sig) return found.length === SECTIONS.length;
        list.dataset.sig = sig;

        list.innerHTML = '';
        buildToggle();
        enhanceBars();
        applySkinny(skinny);
        entries = found.map((f) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'az-nav-item';
          btn.title = f.label;
          btn.innerHTML =
            '<span class="az-nav-label">' + f.label + '</span><span class="az-nav-tick"></span>';
          btn.addEventListener('click', () => { setActive(f.el); scrollTo(f.el, f.doc); });
          list.appendChild(btn);
          return { el: f.el, btn, doc: f.doc };
        });

        nav.hidden = false;
        activeEl = null;
        wireSpy();
        return found.length === SECTIONS.length;
      }

      function init() {
        const complete = build();
        const host = document.getElementById('agent-main-scroll') || document.body;
        const obs = new MutationObserver(() => { if (build()) obs.disconnect(); });
        obs.observe(host, { childList: true, subtree: true });
        /* Stop watching after a grace period even if a section never appears,
           so the observer doesn't run for the life of the page. */
        if (!complete) setTimeout(() => obs.disconnect(), 12000);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script>
    /* =====================================================================
       Metrics Highlight chart (analytics-types.html only).
       Rebuilds the shared Metric Spotlight card into a stack of gut-health-style
       rows, one per metric below. Content is taken verbatim from the portfolio's
       Clean-Label / additive breakdown; the markup is the same the shared module
       emits for the gut-health spotlight, so styling stays identical.
    ===================================================================== */
    (function () {
      const TIER = {

        poor:      { label: 'Poor',      color: 'var(--chart-status-poor)' },

      const ORDER = ['excellent', 'good', 'okay', 'fair', 'poor'];

      const CLEAN_LABEL = {
        kind: 'composite', name: 'Clean Label', tone: 'excellent', score: 88,
        desc: 'Composite score evaluating the absence of 4 categories of artificial additives.',
        dist: { excellent: 58, good: 29, okay: 9, fair: 4 },
        top: { name: 'Original Granola', score: 96 }, low: { name: 'Frosted Granola', score: 72 },
      };
      const COMPONENTS = [
        { kind: 'component', name: 'Artificial Colors', tone: 'excellent', score: 95,
          desc: 'Presence of synthetic colorants with no nutritional benefit.',
          dist: { excellent: 75, good: 20, okay: 5 },
          top: { name: 'Original Granola', score: 100 }, low: { name: 'Berry Blend Granola', score: 88 } },
        { kind: 'component', name: 'Artificial Flavors', tone: 'excellent', score: 87,
          desc: 'Synthetic flavor compounds used in place of natural sources.',
          dist: { excellent: 58, good: 29, okay: 13 },
          top: { name: 'Original Granola', score: 100 }, low: { name: 'Vanilla Bean Granola', score: 79 } },
        { kind: 'component', name: 'Artificial Sweeteners', tone: 'excellent', score: 96,
          desc: 'Non-caloric synthetic sweeteners linked to gut microbiome disruption.',
          dist: { excellent: 83, good: 13, okay: 4 },
          top: { name: 'Most SKUs', score: 100 }, low: { name: 'Protein Granola', score: 88 } },
        { kind: 'component', name: 'Artificial Preservatives', tone: 'excellent', score: 82,
          desc: 'Chemical preservatives that extend shelf life without nutritional benefit.',
          dist: { excellent: 63, good: 25, okay: 8, fair: 4 },
          top: { name: 'Original Granola', score: 100 }, low: { name: 'Frosted Granola', score: 72 } },
      ];
      const STANDALONE = [
        { kind: 'metric', name: 'Banned / Unsafe Ingredients', tone: 'good', score: 79,
          desc: 'Screens for ingredients prohibited in key global markets (EU, UK, Canada) or flagged by major health agencies.',
          dist: { excellent: 46, good: 33, okay: 13, fair: 8 },
          top: { name: 'Original Granola', score: 100 }, low: { name: 'Protein Blend Mix', score: 54 } },
        { kind: 'metric', name: 'Emulsifiers of Concern', tone: 'good', score: 74,
          desc: 'Identifies emulsifiers associated with gut microbiome disruption in peer-reviewed research.',
          dist: { excellent: 38, good: 38, okay: 17, fair: 7 },
          top: { name: 'Original Oatmeal', score: 92 }, low: { name: 'Blueberry Muffin Mix', score: 49 } },
        { kind: 'metric', name: 'Ultra-Processed Food', tone: 'good', score: 61,
          desc: 'Measures degree of industrial processing on the WISEcode spectrum. Non-UPF products score highest.',
          dist: { excellent: 29, good: 33, okay: 21, fair: 13, poor: 4 },
          top: { name: 'Original Granola', score: 88 }, low: { name: 'Protein Bar', score: 31 } },
        { kind: 'metric', name: 'Seed Oils of Concern', tone: 'okay', score: 58,
          desc: 'Evaluates presence of high-omega-6 industrial seed oils linked to inflammation.',
          dist: { excellent: 21, good: 29, okay: 29, fair: 17, poor: 4 },
          top: { name: 'Coconut Granola', score: 88 }, low: { name: 'Granola Snack Mix', score: 34 } },
      ];

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function segHTML(dist) {
        return ORDER.map((k) => {
          const p = dist[k] || 0;
          if (!p) return '';
          return `<div class="dash-seg-part" style="flex-grow:${p};background:${TIER[k].color}" title="${TIER[k].label} ${p}%"><span class="dash-seg-part-label">${p}%</span></div>`;
        }).join('');
      }

      function legendHTML(dist) {
        return ORDER.map((k) => {
          const p = dist[k] || 0;
          if (!p) return '';
          const c = TIER[k].color;
          return `<div class="dash-seg-leg-cell" style="flex-grow:${p}">
              <span class="dash-seg-leg-line" style="background:${c}"></span>
              <span class="dash-seg-leg-info">
                <span class="dash-seg-leg-dot" style="background:${c}"></span>
                <span class="dash-seg-leg-name">${TIER[k].label}</span>
              </span>
            </div>`;
        }).join('');
      }

      function rowHTML(m) {
        const t = TIER[m.tone];
        const icon = m.kind === 'composite'
          ? '<span class="material-symbols-outlined att-mhc-icon att-mhc-icon--composite" title="Composite metric">widgets</span>'
          : m.kind === 'component'
            ? '<span class="material-symbols-outlined att-mhc-icon" title="Component metric">extension</span>'
            : '';
        return `
          <div class="att-mhc-row">
            <div class="dash-section-head dash-mrow-head">
              <span class="dash-badge dash-badge--${m.tone} dash-mrow-badge">${t.label}</span>
              <div class="dash-mrow-main">
                <div class="dash-mrow-titlerow">
                  <h2 class="dash-section-title dash-mrow-title">${icon}${esc(m.name)}</h2>
                  <div class="dash-wisescore-num dash-seg-num dash-mrow-score"><span class="n dash-seg-pct-num att-mhc-count" data-to="${m.score}">0</span><span class="d">/ 100</span></div>
                </div>
                <p class="dash-wisescore-note dash-mrow-note">${esc(m.desc)}</p>
              </div>
              <div class="dash-mrow-chips">
                <span class="dash-mrow-chip"><span class="dash-mrow-chip-tag dash-mrow-chip-tag--top">Top</span><span class="dash-mrow-chip-name">${esc(m.top.name)}</span><span class="dash-mrow-chip-score">${m.top.score}</span></span>
                <span class="dash-mrow-chip"><span class="dash-mrow-chip-tag dash-mrow-chip-tag--low">Low</span><span class="dash-mrow-chip-name">${esc(m.low.name)}</span><span class="dash-mrow-chip-score">${m.low.score}</span></span>
                <button class="dash-mrow-report" type="button" data-dash-action="metricspotlight-report" aria-label="View report for ${esc(m.name)}"><span class="dash-mrow-report-label">View report</span><span class="material-symbols-outlined dash-mrow-report-icon">north_east</span></button>
              </div>
            </div>
            <div class="dash-seg-row dash-mrow-row">
              <div class="dash-seg-bars dash-mrow-seg">
                <div class="dash-seg-track">${segHTML(m.dist)}</div>
                <div class="dash-seg-legend">${legendHTML(m.dist)}</div>
              </div>
            </div>
          </div>`;
      }

      function buildHTML() {
        return `
          <div class="att-mhc-rows">
            ${rowHTML(CLEAN_LABEL)}
            <div class="att-mhc-group">
              <div class="att-mhc-subhead"><span class="att-mhc-subhead-count">4 Components</span><span>Clean Label Components</span></div>
              ${COMPONENTS.map(rowHTML).join('')}
            </div>
            ${STANDALONE.map(rowHTML).join('')}
          </div>`;
      }

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function countUp(el, to, dur) {
        const start = performance.now();
        (function tick(now) {
          const p = Math.min(1, (now - start) / dur);
          el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        })(start);
      }

      /* Reveal the stacked rows the same way the shared module reveals the
         single gut-health bar: wipe each segmented track open (clip-path via
         .is-seg-ready) and count the scores up, once, on scroll-in. */
      function reveal(card) {
        const tracks = card.querySelectorAll('.dash-seg-track');
        const nums = card.querySelectorAll('.att-mhc-count');
        if (reduced) {
          tracks.forEach((tk) => tk.classList.add('is-seg-ready'));
          nums.forEach((n) => { n.textContent = n.getAttribute('data-to'); });
          return;
        }
        const run = () => {
          tracks.forEach((tk) => tk.classList.add('is-seg-ready'));
          nums.forEach((n) => countUp(n, parseInt(n.getAttribute('data-to'), 10) || 0, 1300));
        };
        if (!window.IntersectionObserver) { run(); return; }
        let done = false;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => { if (en.isIntersecting && !done) { done = true; run(); io.disconnect(); } });
        }, { threshold: 0.2 });
        io.observe(card);
      }

      function mount() {
        const card = document.querySelector('.dash-mrow-section .dash-mrow-card');
        if (!card || card.dataset.mhc === '1') return !!card;
        card.dataset.mhc = '1';
        card.innerHTML = buildHTML();
        reveal(card);
        return true;
      }

      /* Snap the stacked rows to their finished state for export/print: open
         every clip-path track and jump each score to its final value. (The
         reveal is gated on scroll-into-view, so off-screen rows would otherwise
         print collapsed with 0 scores.) */
      function finalizeForExport() {
        const card = document.querySelector('.dash-mrow-section .dash-mrow-card');
        if (!card) return;
        card.querySelectorAll('.dash-seg-track').forEach((tk) => tk.classList.add('is-seg-ready'));
        card.querySelectorAll('.att-mhc-count').forEach((n) => { n.textContent = n.getAttribute('data-to'); });
      }
      window.addEventListener('wise:finalize-charts', finalizeForExport);
      window.addEventListener('beforeprint', finalizeForExport);

      /* Replay one row's reveal on tap: snap its segmented track shut (transition
         suppressed so it doesn't run backwards), rewind its score, then re-run
         the clip-path wipe + count-up. */
      function replayRow(row) {
        if (reduced) return;
        const tracks = [...row.querySelectorAll('.dash-seg-track')];
        const nums = [...row.querySelectorAll('.att-mhc-count')];
        tracks.forEach((tk) => { tk.style.transition = 'none'; tk.classList.remove('is-seg-ready'); });
        nums.forEach((n) => { n.textContent = '0'; });
        void row.offsetWidth;
        tracks.forEach((tk) => { tk.style.transition = ''; tk.classList.add('is-seg-ready'); });
        nums.forEach((n) => countUp(n, parseInt(n.getAttribute('data-to'), 10) || 0, 1300));
      }

      /* Tap the segmented bar of any row to replay just that row. Intercept at
         document capture (before the shared dashboard host handler, which would
         otherwise replay every row's wipe but leave these custom counters at 0)
         and scope the hit to the bar area so the title + report action stay
         clickable. */
      document.addEventListener('click', (e) => {
        if (!e.target.closest) return;
        const bars = e.target.closest('.dash-mrow-card[data-mhc="1"] .dash-seg-bars');
        if (!bars) return;
        const row = bars.closest('.att-mhc-row');
        if (!row) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        replayRow(row);
      }, true);

      function init() {
        if (mount()) return;
        const obs = new MutationObserver(() => { if (mount()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

      const fmt = (n) => Math.round(n).toLocaleString('en-US');

        const n = junctionW.length - 1;
        const x = Math.max(0, Math.min(1, t)) * n;
        const i = Math.min(n - 1, Math.floor(x));
        const f = smoothstep(x - i);
        const base = junctionW[i] * (1 - f) + junctionW[i + 1] * f;
        const stageT = x - i;
        const lobe = Math.sin(stageT * Math.PI) * shape.lobeAmp * Math.max(0.08, base);
        const wave = Math.sin(t * Math.PI * shape.waveFreq) * Math.sin(t * Math.PI) * Math.max(0.012, base * shape.waveAmp);
        const wave2 = Math.sin(t * Math.PI * shape.waveFreq2 + shape.wavePhase2) * Math.sin(t * Math.PI) * base * shape.waveAmp2;
        const skew = side === 'r' ? 1 + shape.sideSkew : 1 - shape.sideSkew * 0.42;
        return Math.max(0.045, Math.min(1.16, (base + lobe + wave + wave2) * skew));
      }

      function swayAt(t, shape, side) {
        const s = Math.sin(t * Math.PI * shape.swayFreq + shape.swayPhase) * Math.sin(t * Math.PI) * shape.swayAmp
          + Math.sin(t * Math.PI * shape.swayFreq2 + shape.swayPhase2) * Math.sin(t * Math.PI) * shape.swayAmp2;
        return side === 'r' ? s * 0.52 : s;
      }

      function sampleBand(t0, t1, axis, center, start, span, maxThick, shape, junctionW) {
        const pts = [];
        const steps = shape.steps || 56;
        for (let i = 0; i <= steps; i++) {
          const t = t0 + (t1 - t0) * (i / steps);
          const pos = start + span * t;
          const halfL = widthAt(t, shape, 'l', junctionW) * maxThick / 2;
          const halfR = widthAt(t, shape, 'r', junctionW) * maxThick / 2;
          const swayL = swayAt(t, shape, 'l') * maxThick;
          const swayR = swayAt(t, shape, 'r') * maxThick;
          if (axis === 'v') {
            pts.push({
              a: { x: center - halfL + swayL, y: pos },
              b: { x: center + halfR + swayR, y: pos },
            });
          } else {
            pts.push({
              a: { x: pos, y: center - halfL + swayL },
              b: { x: pos, y: center + halfR + swayR },
            });
          }
        }
        return pts;
      }

      function catmull(pts) {
        const n = pts.length;
        if (!n) return '';
        let d = `M ${pt(pts[0])}`;
        for (let i = 0; i < n - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(n - 1, i + 2)];
          const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
          const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
          d += ` C ${pt(c1)}, ${pt(c2)}, ${pt(p2)}`;
        }
        return d;
      }

      function bandPath(pts, axis) {
        const first = pts[0], last = pts[pts.length - 1];
        const cap = axis === 'v'
          ? { x: (last.a.x + last.b.x) / 2, y: last.a.y + 8 }
          : { x: last.a.x + 8, y: (last.a.y + last.b.y) / 2 };
        const open = axis === 'v'
          ? { x: (first.a.x + first.b.x) / 2, y: first.a.y - 10 }
          : { x: first.a.x - 10, y: (first.a.y + first.b.y) / 2 };
        const loop = [
          ...pts.map((p) => p.a),
          cap,
          ...pts.slice().reverse().map((p) => p.b),
          open,
        ];
        return catmull(loop) + ' Z';
      }

      function ribbonPath(a0, b0, a1, b1, axis) {
        if (axis === 'v') {
          const mid = (a0.y + a1.y) / 2;
          return `M ${pt(a0)} C ${a0.x.toFixed(1)} ${mid.toFixed(1)}, ${a1.x.toFixed(1)} ${mid.toFixed(1)}, ${pt(a1)} L ${pt(b1)} C ${b1.x.toFixed(1)} ${mid.toFixed(1)}, ${b0.x.toFixed(1)} ${mid.toFixed(1)}, ${pt(b0)} Z`;
        }
        const mid = (a0.x + a1.x) / 2;
        return `M ${pt(a0)} C ${mid.toFixed(1)} ${a0.y.toFixed(1)}, ${mid.toFixed(1)} ${a1.y.toFixed(1)}, ${pt(a1)} L ${pt(b1)} C ${mid.toFixed(1)} ${b1.y.toFixed(1)}, ${mid.toFixed(1)} ${b0.y.toFixed(1)}, ${pt(b0)} Z`;
      }

      function mk(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }

      function layout(orient) {
        if (orient === 'h') {
          const VW = 1040, VH = 500;
          const funnelX = 24, funnelW = 540, cy = 228, maxThick = 300;
          const barX = 748, barW = 46, barY = 72, barH = 368;
          return { VW, VH, axis: 'h', funnelX, funnelW, cy, maxThick, barX, barY, barW, barH };
        }
        const VW = 900, VH = 600;
        const funnelY = 16, funnelH = 258, cx = 368, maxThick = 552;
        const barX = 36, barW = 828, barY = 468, barH = 46;
        return { VW, VH, axis: 'v', funnelY, funnelH, cx, maxThick, barX, barY, barW, barH };
      }

      function numSpan(value, extraClass) {
        return `<span class="inf-num${extraClass ? ' ' + extraClass : ''}" data-count-to="${value}">0</span>`;
      }

      function renderChart(host, ds, orient) {
        const L = layout(orient);
        const M = metrics(ds);
        const axis = L.axis;
        const start = axis === 'v' ? L.funnelY : L.funnelX;
        const span = axis === 'v' ? L.funnelH : L.funnelW;
        const center = axis === 'v' ? L.cx : L.cy;
        const n = ds.stages.length;
        const stageTs = ds.stages.map((_, i) => [i / n, (i + 1) / n]);
        const bands = stageTs.map(([t0, t1]) => sampleBand(t0, t1, axis, center, start, span, L.maxThick, SHAPE, M.junctionW));
        const last = bands[n - 1][bands[n - 1].length - 1];
        const uid = ds.id;

        const svg = mk('svg', {
          class: 'inf-svg',
          viewBox: `0 0 ${L.VW} ${L.VH}`,
          role: 'img',
          'aria-label': ds.ariaLabel,
        });
        const defs = mk('defs', {});
        const clip = mk('clipPath', { id: 'inf-bar-clip-' + uid });
        clip.appendChild(mk('rect', {
          x: String(L.barX), y: String(L.barY),
          width: String(L.barW), height: String(L.barH), rx: '10',
        }));
        defs.appendChild(clip);

        /* One wash across the whole funnel — vertical = top→bottom of the
           funnel span; horizontal = left→right of the funnel span. */
        const bandG = mk('linearGradient', {
          id: 'inf-band-g-' + uid,
          gradientUnits: 'userSpaceOnUse',
          x1: String(axis === 'v' ? L.cx : L.funnelX),
          y1: String(axis === 'v' ? L.funnelY : L.cy),
          x2: String(axis === 'v' ? L.cx : L.funnelX + L.funnelW),
          y2: String(axis === 'v' ? L.funnelY + L.funnelH : L.cy),
        });
        bandG.appendChild(mk('stop', { offset: '0%', 'stop-color': 'var(--inf-s1)' }));
        bandG.appendChild(mk('stop', { offset: '38%', 'stop-color': 'var(--inf-s2)' }));
        bandG.appendChild(mk('stop', { offset: '72%', 'stop-color': 'var(--inf-s3)' }));
        bandG.appendChild(mk('stop', { offset: '100%', 'stop-color': 'var(--inf-s3)' }));
        defs.appendChild(bandG);

        const mouth = axis === 'v'
          ? { x: center, y: start + span }
          : { x: start + span, y: center };
        const barMid = axis === 'v'
          ? { x: L.barX + L.barW * M.groupSplit * 0.5, y: L.barY }
          : { x: L.barX, y: L.barY + L.barH * M.groupSplit * 0.5 };
        const flowG = mk('linearGradient', {
          id: 'inf-flow-g-' + uid,
          gradientUnits: 'userSpaceOnUse',
          x1: String(mouth.x), y1: String(mouth.y),
          x2: String(barMid.x), y2: String(barMid.y),
        });
        flowG.appendChild(mk('stop', { offset: '0%', 'stop-color': 'var(--inf-s3)', 'stop-opacity': '0.58' }));
        flowG.appendChild(mk('stop', { offset: '100%', 'stop-color': 'var(--inf-ref)', 'stop-opacity': '0.22' }));
        defs.appendChild(flowG);
        svg.appendChild(defs);

        bands.forEach((pts, i) => {
          const path = mk('path', {
            class: 'inf-band',
            d: bandPath(pts, axis),
            fill: 'url(#inf-band-g-' + uid + ')',
          });
          path.appendChild(mk('title', {})).textContent =
            `${fmt(ds.stages[i].value)} ${ds.stages[i].cap}`;
          svg.appendChild(path);
        });

        let a1, b1;
        if (axis === 'v') {
          a1 = { x: L.barX, y: L.barY };
          b1 = { x: L.barX + L.barW * M.groupSplit, y: L.barY };
        } else {
          a1 = { x: L.barX, y: L.barY };
          b1 = { x: L.barX, y: L.barY + L.barH * M.groupSplit };
        }
        const ribbon = mk('path', {
          class: 'inf-ribbon',
          d: ribbonPath(last.a, last.b, a1, b1, axis),
          fill: 'url(#inf-flow-g-' + uid + ')',
        });
        svg.appendChild(ribbon);

        const gBar = mk('g', { 'clip-path': 'url(#inf-bar-clip-' + uid + ')' });
        let acc = 0;
        ds.segs.forEach((seg) => {
          const frac = seg.value / M.barTotal;
          let x, y, w, h;
          if (axis === 'v') {
            x = L.barX + acc * L.barW; y = L.barY; w = frac * L.barW; h = L.barH;
          } else {
            x = L.barX; y = L.barY + acc * L.barH; w = L.barW; h = frac * L.barH;
          }
          acc += frac;
          const r = mk('rect', {
            class: 'inf-seg',
            x: x.toFixed(1), y: y.toFixed(1),
            width: Math.max(0.5, w).toFixed(1), height: Math.max(0.5, h).toFixed(1),
            fill: seg.fill,
          });
          r.appendChild(mk('title', {})).textContent = `${seg.cap} ${fmt(seg.value)}`;
          gBar.appendChild(r);
        });
        svg.appendChild(gBar);

        const s3 = bands[n - 1];
        const mid3 = s3[Math.floor(s3.length / 2)];
        let leader;
        if (axis === 'v') {
          const x0 = Math.max(mid3.a.x, mid3.b.x) + 8;
          const y0 = (mid3.a.y + mid3.b.y) / 2;
          leader = mk('path', {
            class: 'inf-leader',
            d: `M ${x0.toFixed(1)} ${y0.toFixed(1)} H ${(x0 + 28).toFixed(1)}`,
          });
        } else {
          const x0 = (mid3.a.x + mid3.b.x) / 2;
          const y0 = Math.max(mid3.a.y, mid3.b.y) + 8;
          leader = mk('path', {
            class: 'inf-leader',
            d: `M ${x0.toFixed(1)} ${y0.toFixed(1)} V ${(y0 + 16).toFixed(1)}`,
          });
        }
        svg.appendChild(leader);

        const labels = document.createElement('div');
        labels.className = 'inf-labels';

        function pct(x, y) {
          return { left: (x / L.VW * 100).toFixed(2) + '%', top: (y / L.VH * 100).toFixed(2) + '%' };
        }
        function place(el, x, y) {
          const p = pct(x, y);
          el.style.left = p.left;
          el.style.top = p.top;
        }

        ds.stages.forEach((st, i) => {
          const pts = bands[i];
          const mid = pts[Math.floor(pts.length / 2)];
          const el = document.createElement('div');
          const inside = !st.callout;
          el.className = 'inf-label' + (st.callout
            ? (axis === 'v' ? ' inf-label--callout' : ' inf-label--callout-below')
            : '');
          el.style.color = inside ? st.ink : 'var(--text)';
          el.style.setProperty('--ld', (0.28 + i * 0.22) + 's');
          el.innerHTML = `${numSpan(st.value)}<span class="inf-cap">${esc(st.cap)}</span>`;
          if (st.callout && axis === 'v') {
            place(el, Math.max(mid.a.x, mid.b.x) + 42, (mid.a.y + mid.b.y) / 2);
          } else if (st.callout) {
            place(el, (mid.a.x + mid.b.x) / 2, Math.max(mid.a.y, mid.b.y) + 28);
          } else {
            place(el, (mid.a.x + mid.b.x) / 2, (mid.a.y + mid.b.y) / 2);
          }
          labels.appendChild(el);
        });

        const title = document.createElement('div');
        title.className = 'inf-label inf-label--bar-title' + (axis === 'h' ? ' inf-label--bar-title-side' : '');
        title.style.setProperty('--ld', '1.05s');
        title.innerHTML = esc(ds.barTitle).replace('{n}', numSpan(M.barTotal));
        if (axis === 'v') place(title, L.barX, L.barY - 52);
        else place(title, L.barX + L.barW + 14, L.barY);
        labels.appendChild(title);

        ds.groups.forEach((g, i) => {
          const el = document.createElement('div');
          el.className = 'inf-label ' + (axis === 'v' ? 'inf-label--group' : 'inf-label--group-side');
          el.style.setProperty('--ld', (1.12 + i * 0.1) + 's');
          el.innerHTML = `${numSpan(g.value)}<span class="inf-cap">${esc(g.cap)}</span>`;
          const startFrac = i === 0 ? 0 : M.groupSplit;
          const endFrac = i === 0 ? M.groupSplit : 1;
          const midFrac = (startFrac + endFrac) / 2;
          if (axis === 'v') {
            place(el, L.barX + L.barW * midFrac, L.barY - 6);
          } else {
            place(el, L.barX + L.barW + 14, L.barY + L.barH * midFrac);
          }
          labels.appendChild(el);
        });

        const reveal = document.createElement('div');
        reveal.className = 'inf-reveal';
        reveal.appendChild(svg);
        reveal.appendChild(labels);

        host.innerHTML = '';
        host.dataset.orient = orient;
        host.appendChild(reveal);
      }

      function countUp(el, to, dur) {
        if (reduced) { el.textContent = fmt(to); return; }
        const start = performance.now();
        (function tick(now) {
          const p = Math.min(1, (now - start) / dur);
          el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        })(start);
      }

      function snapNums(card) {
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => {
          n.textContent = fmt(parseInt(n.getAttribute('data-count-to'), 10) || 0);
        });
      }

      function play(card) {
        const chart = card.querySelector('.inf-chart');
        if (!chart) return;
        card._infPlayGen = (card._infPlayGen || 0) + 1;
        const gen = card._infPlayGen;
        const reveal = chart.querySelector('.inf-reveal');
        if (reveal) reveal.style.clipPath = '';
        chart.classList.remove('is-ready');
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => { n.textContent = '0'; });
        void chart.offsetWidth;
        chart.classList.add('is-ready');
        if (reveal && !reduced) {
          reveal.addEventListener('animationend', function onEnd(ev) {
            if (ev.target !== reveal || card._infPlayGen !== gen) return;
            reveal.style.clipPath = 'none';
          }, { once: true });
        }
        if (reduced) { snapNums(card); return; }
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => {
          countUp(n, parseInt(n.getAttribute('data-count-to'), 10) || 0, 1650);
        });
      }

      function setOrient(card, variant, orient) {
        writeOrient(variant.id, orient);
        card.querySelectorAll('.inf-orient-btn').forEach((b) => {
          const on = b.dataset.orient === orient;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        renderChart(card.querySelector('.inf-chart'), variant, orient);
        play(card);
      }

      function buildCard(ds) {
        const card = document.createElement('section');
        card.className = ds.className;
        card.id = ds.cardId;
        card.innerHTML = `
          <div class="att-head att-head--split">
            <div class="inf-head-lead"><span class="att-title">${esc(ds.title)}</span></div>
            <div class="att-orient inf-orient" role="group" aria-label="Chart orientation">
              <button type="button" class="inf-orient-btn is-on" data-orient="v" aria-pressed="true">Vertical</button>
              <button type="button" class="inf-orient-btn" data-orient="h" aria-pressed="false">Horizontal</button>
            </div>
          </div>
          <p class="att-intro">${esc(ds.intro)}</p>
          <div class="inf-chart"></div>
          <div class="inf-legend">${
            ds.segs.map((s) =>
              `<span><span class="att-dot" style="background:${s.fill}"></span>${esc(s.cap)} <span class="inf-legend-n inf-num" data-count-to="${s.value}">0</span></span>`
            ).join('')
          }</div>
          <p class="inf-note">${esc(ds.note)}</p>`;
        return card;
      }

      function wire(card, variant) {
        card.querySelectorAll('.inf-orient-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            setOrient(card, variant, btn.dataset.orient);
          });
        });
        const chart = card.querySelector('.inf-chart');
        chart.addEventListener('click', (e) => {
          if (e.target.closest('.inf-orient')) return;
          play(card);
        });
        const finalize = () => {
          const ch = card.querySelector('.inf-chart');
          const rev = ch && ch.querySelector('.inf-reveal');
          if (ch) ch.classList.add('is-ready');
          if (rev) rev.style.clipPath = 'none';
          snapNums(card);
        };
        window.addEventListener('wise:finalize-charts', finalize);
        window.addEventListener('beforeprint', finalize);
        if (window.IntersectionObserver) {
          const io = new IntersectionObserver((entries) => {
            entries.forEach((en) => {
              if (en.isIntersecting) { play(card); io.disconnect(); }
            });
          }, { threshold: 0.2 });
          io.observe(card);
        } else {
          play(card);
        }
      }

      function mountOne(variant, after) {
        if (document.getElementById(variant.cardId)) return document.getElementById(variant.cardId);
        const card = buildCard(variant);
        after.insertAdjacentElement('afterend', card);
        const orient = readOrient(variant.id);
        renderChart(card.querySelector('.inf-chart'), variant, orient);
        card.querySelectorAll('.inf-orient-btn').forEach((b) => {
          const on = b.dataset.orient === orient;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        wire(card, variant);
        return card;
      }

      function mount() {
        const scroll = document.getElementById('agent-main-scroll');
        const dash = scroll && scroll.querySelector('.dash');
        if (!dash) return false;
        if (document.getElementById('inf-funnel-card-claim')) return true;
        const anchor = document.getElementById('gras-prod-card')
          || document.getElementById('proc-class-card')
          || document.getElementById('gras-class-card')
          || document.getElementById('upf-class-card')
          || document.getElementById('att-tree-card');
        if (!anchor) return false;
        let last = anchor;
        DATASETS.forEach((v) => { last = mountOne(v, last); });
        return true;
      }

      function init() {
        if (mount()) return;
        const obs = new MutationObserver(() => { if (mount()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
        setTimeout(() => obs.disconnect(), 12000);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script>
    /* =====================================================================
       GRAS conversion funnel (analytics-types.html only).
       A different chart type from the organic pour: stacked trapezoids
       sized linearly to the remaining count, with the drop-off written
       between bands. Vertical stacks top→bottom; horizontal runs
       left→right. Click to replay.
    ===================================================================== */
    (function () {
      const NS = 'http://www.w3.org/2000/svg';
      const STAGES = [
        { value: 24, cap: 'SKUs in the analyzed portfolio', fill: 'var(--cf-s1)', ink: 'var(--cf-ink-1)' },
        { value: 23, cap: 'no unsafe ingredients',          fill: 'var(--cf-s2)', ink: 'var(--cf-ink-2)' },
        { value: 21, cap: 'GRAS or historical-use class',   fill: 'var(--cf-s3)', ink: 'var(--cf-ink-3)' },
        { value: 15, cap: 'FDA GRAS-affirmed',              fill: 'var(--cf-s4)', ink: 'var(--cf-ink-4)' },
      ];
      const CARD_ID = 'cf-funnel-card';
      const KEY = 'az-funnel-orient-cf';

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const fmt = (n) => Math.round(n).toLocaleString('en-US');
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function readOrient() {
        try { return localStorage.getItem(KEY) === 'h' ? 'h' : 'v'; }
        catch (_) { return 'v'; }
      }
      function writeOrient(o) {
        try { localStorage.setItem(KEY, o); } catch (_) {}
      }

      function mk(tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }

      function trapV(cx, y, w0, w1, h) {
        const tL = (cx - w0 / 2).toFixed(1), tR = (cx + w0 / 2).toFixed(1);
        const bL = (cx - w1 / 2).toFixed(1), bR = (cx + w1 / 2).toFixed(1);
        const y0 = y.toFixed(1), y1 = (y + h).toFixed(1);
        return `M ${tL} ${y0} L ${tR} ${y0} L ${bR} ${y1} L ${bL} ${y1} Z`;
      }
      function trapH(x, cy, h0, h1, w) {
        const tT = (cy - h0 / 2).toFixed(1), tB = (cy + h0 / 2).toFixed(1);
        const rT = (cy - h1 / 2).toFixed(1), rB = (cy + h1 / 2).toFixed(1);
        const x0 = x.toFixed(1), x1 = (x + w).toFixed(1);
        return `M ${x0} ${tT} L ${x1} ${rT} L ${x1} ${rB} L ${x0} ${tB} Z`;
      }

      function geom(orient) {
        const n = STAGES.length;
        const maxV = STAGES[0].value;
        if (orient === 'h') {
          const VW = 1040, VH = 440;
          const left = 28, right = VW - 28, gap = 22;
          const span = right - left;
          const stageW = (span - gap * (n - 1)) / n;
          const cy = VH * 0.42;
          const maxH = VH * 0.58;
          return {
            VW, VH, axis: 'h',
            dropY: VH * 0.86,
            stages: STAGES.map((s, i) => {
              const next = STAGES[i + 1];
              const h0 = maxH * (s.value / maxV);
              const h1 = maxH * ((next ? next.value : s.value * 0.82) / maxV);
              return { x: left + i * (stageW + gap), cy, w: stageW, h0, h1, gap };
            }),
          };
        }
        const VW = 900, VH = 560;
        const top = 24, bot = VH - 16, gap = 18;
        const span = bot - top;
        const stageH = (span - gap * (n - 1)) / n;
        const cx = VW * 0.44;
        const maxW = VW * 0.62;
        return {
          VW, VH, axis: 'v',
          dropX: cx + maxW / 2 + 70,
          stages: STAGES.map((s, i) => {
            const next = STAGES[i + 1];
            const w0 = maxW * (s.value / maxV);
            const w1 = maxW * ((next ? next.value : s.value * 0.82) / maxV);
            return { cx, y: top + i * (stageH + gap), w0, w1, h: stageH, gap };
          }),
        };
      }

      function numSpan(value) {
        return `<span class="inf-num" data-count-to="${value}">0</span>`;
      }

      function renderChart(host, orient) {
        const L = geom(orient);
        const axis = L.axis;
        const svg = mk('svg', {
          class: 'cf-svg',
          viewBox: `0 0 ${L.VW} ${L.VH}`,
          role: 'img',
          'aria-label': 'GRAS conversion funnel: 24 analyzed SKUs narrow to 15 that are FDA GRAS-affirmed',
        });

        L.stages.forEach((g, i) => {
          const st = STAGES[i];
          const d = axis === 'v'
            ? trapV(g.cx, g.y, g.w0, g.w1, g.h)
            : trapH(g.x, g.cy, g.h0, g.h1, g.w);
          const path = mk('path', { class: 'cf-band', d, fill: st.fill });
          path.appendChild(mk('title', {})).textContent = `${fmt(st.value)} ${st.cap}`;
          svg.appendChild(path);
        });

        const labels = document.createElement('div');
        labels.className = 'cf-labels';

        function place(el, x, y) {
          el.style.left = (x / L.VW * 100).toFixed(2) + '%';
          el.style.top = (y / L.VH * 100).toFixed(2) + '%';
        }

        L.stages.forEach((g, i) => {
          const st = STAGES[i];
          const el = document.createElement('div');
          el.className = 'cf-label';
          el.style.color = st.ink;
          el.style.setProperty('--ld', (0.22 + i * 0.16) + 's');
          el.innerHTML = `${numSpan(st.value)}<span class="inf-cap">${esc(st.cap)}</span>`;
          if (axis === 'v') place(el, g.cx, g.y + g.h / 2);
          else place(el, g.x + g.w / 2, g.cy);
          labels.appendChild(el);

          if (i === L.stages.length - 1) return;
          const next = STAGES[i + 1];
          const drop = st.value - next.value;
          const keep = Math.round((next.value / st.value) * 100);
          const dropEl = document.createElement('div');
          dropEl.className = 'cf-drop';
          dropEl.style.setProperty('--ld', (0.7 + i * 0.12) + 's');
          dropEl.innerHTML = `<span class="cf-drop-n">${keep}%</span> remain · −${drop}`;
          if (axis === 'v') {
            place(dropEl, L.dropX, g.y + g.h + g.gap / 2);
          } else {
            place(dropEl, g.x + g.w + g.gap / 2, L.dropY);
          }
          labels.appendChild(dropEl);
        });

        const reveal = document.createElement('div');
        reveal.className = 'cf-reveal';
        reveal.appendChild(svg);
        reveal.appendChild(labels);

        host.innerHTML = '';
        host.dataset.orient = orient;
        host.appendChild(reveal);
      }

      function countUp(el, to, dur) {
        if (reduced) { el.textContent = fmt(to); return; }
        const start = performance.now();
        (function tick(now) {
          const p = Math.min(1, (now - start) / dur);
          el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        })(start);
      }

      function snapNums(card) {
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => {
          n.textContent = fmt(parseInt(n.getAttribute('data-count-to'), 10) || 0);
        });
      }

      function play(card) {
        const chart = card.querySelector('.cf-chart');
        if (!chart) return;
        card._cfPlayGen = (card._cfPlayGen || 0) + 1;
        const gen = card._cfPlayGen;
        const reveal = chart.querySelector('.cf-reveal');
        if (reveal) reveal.style.clipPath = '';
        chart.classList.remove('is-ready');
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => { n.textContent = '0'; });
        void chart.offsetWidth;
        chart.classList.add('is-ready');
        if (reveal && !reduced) {
          reveal.addEventListener('animationend', function onEnd(ev) {
            if (ev.target !== reveal || card._cfPlayGen !== gen) return;
            reveal.style.clipPath = 'none';
          }, { once: true });
        }
        if (reduced) { snapNums(card); return; }
        card.querySelectorAll('.inf-num[data-count-to]').forEach((n) => {
          countUp(n, parseInt(n.getAttribute('data-count-to'), 10) || 0, 1650);
        });
      }

      function setOrient(card, orient) {
        writeOrient(orient);
        card.querySelectorAll('.inf-orient-btn').forEach((b) => {
          const on = b.dataset.orient === orient;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        renderChart(card.querySelector('.cf-chart'), orient);
        play(card);
      }

      function buildCard() {
        const card = document.createElement('section');
        card.className = 'att-card cf-funnel';
        card.id = CARD_ID;
        card.innerHTML = `
          <div class="att-head att-head--split">
            <div class="inf-head-lead"><span class="att-title">GRAS conversion funnel</span></div>
            <div class="att-orient inf-orient" role="group" aria-label="Chart orientation">
              <button type="button" class="inf-orient-btn is-on" data-orient="v" aria-pressed="true">Vertical</button>
              <button type="button" class="inf-orient-btn" data-orient="h" aria-pressed="false">Horizontal</button>
            </div>
          </div>
          <p class="att-intro">How the 24 analyzed SKUs survive a GRAS safety screen. Each trapezoid is sized to the count that remains; the leak between bands is the drop-off — not a pour into a bar.</p>
          <div class="cf-chart"></div>
          <p class="inf-note">Band width is linear to the count — unlike the ingredient funnel, which is square-root scaled. Click the chart to replay.</p>`;
        return card;
      }

      function wire(card) {
        card.querySelectorAll('.inf-orient-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            setOrient(card, btn.dataset.orient);
          });
        });
        card.querySelector('.cf-chart').addEventListener('click', (e) => {
          if (e.target.closest('.inf-orient')) return;
          play(card);
        });
        const finalize = () => {
          const ch = card.querySelector('.cf-chart');
          const rev = ch && ch.querySelector('.cf-reveal');
          if (ch) ch.classList.add('is-ready');
          if (rev) rev.style.clipPath = 'none';
          snapNums(card);
        };
        window.addEventListener('wise:finalize-charts', finalize);
        window.addEventListener('beforeprint', finalize);
        if (window.IntersectionObserver) {
          const io = new IntersectionObserver((entries) => {
            entries.forEach((en) => {
              if (en.isIntersecting) { play(card); io.disconnect(); }
            });
          }, { threshold: 0.2 });
          io.observe(card);
        } else {
          play(card);
        }
      }

      function mount() {
        if (document.getElementById(CARD_ID)) return true;
        const after = document.getElementById('inf-funnel-card-claim')
          || document.getElementById('inf-funnel-card');
        if (!after) return false;
        const card = buildCard();
        after.insertAdjacentElement('afterend', card);
        const orient = readOrient();
        renderChart(card.querySelector('.cf-chart'), orient);
        card.querySelectorAll('.inf-orient-btn').forEach((b) => {
          const on = b.dataset.orient === orient;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        wire(card);
        return true;
      }

      function init() {
        if (mount()) return;
        const obs = new MutationObserver(() => { if (mount()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
        setTimeout(() => obs.disconnect(), 12000);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script>
    /* =====================================================================
       Chart orientation (analytics-types.html only). Every chart gets the
       same Vertical / Horizontal pill. Default keeps the existing layout;
       the other value flips the primary axis (or, for tables / polar /
       scatter / the matrix, the already-built alternate reading).
    ===================================================================== */
    (function () {
      const KEY = 'az-chart-orient';
      function store() {
        try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
        catch (_) { return {}; }
      }
      function persist(id, orient) {
        const all = store();
        all[id] = orient;
        try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (_) {}
      }

      function tableFlip(toggleId) {
        return function (host, orient) {
          const btn = host.querySelector('#' + toggleId);
          if (!btn) return;
          const wantCards = orient === 'v';
          const isCards = btn.getAttribute('aria-checked') === 'true';
          if (wantCards !== isCards) btn.click();
        };
      }

      const CHARTS = [
        { id: 'pscale',     sel: ':scope > .pscale, .pscale', def: 'h', place: 'before' },
        { id: 'claim',      sel: ':scope > .dash-claim:not(.att-overview-claim)', def: 'h', place: 'before' },
        { id: 'overview',   sel: '.att-overview-claim', def: 'h', place: 'before' },
        { id: 'top5',       sel: '.dash-top5-section:not(.dash-top5-hero-section)', def: 'h', place: 'head' },
        { id: 'top5hero',   sel: '.dash-top5-hero-section', def: 'h', place: 'head' },
        { id: 'upf-donut',  sel: '#dash-charts .dash-donut-card:first-child', def: 'h', place: 'topbar' },
        { id: 'gras-donut', sel: '#dash-charts .dash-donut-card:last-child', def: 'h', place: 'topbar' },
        { id: 'pillars',    sel: '.dash-pillars-section', def: 'h', place: 'head' },
        { id: 'breakdown',  sel: '.dash-pillars-breakdown', def: 'h', place: 'head' },
        { id: 'polar',      sel: '.dash-radar-card', def: 'h', place: 'topbar',
          onChange: function (_h, o) { if (window.__attPolarSetOrient) window.__attPolarSetOrient(o); } },
        { id: 'grasbars',   sel: '.dash-gras-bar-card', def: 'h', place: 'topbar' },
        { id: 'hotspots',   sel: '.dash-ingredients-section .dash-ingredients-card', def: 'h', place: 'topbar' },
        { id: 'antiinf',    sel: '.dash-products-section .dash-ingredients-card', def: 'h', place: 'topbar' },
        { id: 'mhc',        sel: '.dash-mrow-section', def: 'h', place: 'before-inner' },
        { id: 'unsafe',     sel: '.dash-flag-card:first-child', def: 'h', place: 'topbar' },
        { id: 'unknown',    sel: '.dash-flag-card:last-child', def: 'h', place: 'topbar' },
        { id: 'seg',        sel: '.dash-seg-section', def: 'h', place: 'head' },
        { id: 'scatter',    sel: '.dash-scatter-section', def: 'h', place: 'topbar' },
        { id: 'matrix',     sel: '#att-tree-card', def: 'h', place: 'head',
          onChange: function (_h, o) { if (window.__attPmxSetOrient) window.__attPmxSetOrient(o); } },
        { id: 'upf-table',  sel: '#upf-class-card', def: 'h', place: 'head', onChange: tableFlip('upf-view-toggle') },
        { id: 'gras-table', sel: '#gras-class-card', def: 'h', place: 'head', onChange: tableFlip('gras-view-toggle') },
        { id: 'proc-table', sel: '#proc-class-card', def: 'h', place: 'head', onChange: tableFlip('proc-view-toggle') },
        { id: 'gras-prod',  sel: '#gras-prod-card', def: 'h', place: 'head', onChange: tableFlip('gras-prod-view-toggle') },
      ];

      function syncFills(host) {
        host.querySelectorAll('.dash-ws-health-fill, .dash-metric-fill').forEach((el) => {
          const w = el.style.width;
          if (w) el.style.setProperty('--att-fill', w);
        });
      }

      function toggleRoot(host) {
        const prev = host.previousElementSibling;
        if (prev && prev.classList.contains('att-orient-bar')) return prev;
        return host;
      }

      function apply(host, spec, orient) {
        host.dataset.attOrient = orient;
        if (spec.id === 'scatter') {
          const row = host.closest('.dash-scatter-row');
          if (row) row.dataset.attOrient = orient;
        }
        if (spec.id === 'top5' || spec.id === 'top5hero') {
          const claim = host.querySelector('.dash-claim');
          if (claim) claim.dataset.attOrient = orient;
        }
        syncFills(host);
        if (spec.onChange) spec.onChange(host, orient);
        toggleRoot(host).querySelectorAll('.att-orient-btn').forEach((b) => {
          const on = b.dataset.orient === orient;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }

      function buildToggle(host, spec, orient) {
        const wrap = document.createElement('div');
        wrap.className = 'att-orient';
        wrap.setAttribute('role', 'group');
        wrap.setAttribute('aria-label', 'Chart orientation');
        wrap.innerHTML =
          '<button type="button" class="att-orient-btn" data-orient="h" aria-pressed="false">Horizontal</button>' +
          '<button type="button" class="att-orient-btn" data-orient="v" aria-pressed="false">Vertical</button>';
        wrap.addEventListener('click', (e) => {
          const btn = e.target.closest('.att-orient-btn');
          if (!btn) return;
          e.stopPropagation();
          persist(spec.id, btn.dataset.orient);
          apply(host, spec, btn.dataset.orient);
        });
        return wrap;
      }

      function placeToggle(host, toggle, place) {
        if (place === 'before') {
          if (host.previousElementSibling && host.previousElementSibling.classList.contains('att-orient-bar')) return;
          const bar = document.createElement('div');
          bar.className = 'att-orient-bar';
          bar.appendChild(toggle);
          host.parentNode.insertBefore(bar, host);
          return;
        }
        if (place === 'before-inner') {
          if (host.querySelector(':scope > .att-orient-bar')) return;
          const bar = document.createElement('div');
          bar.className = 'att-orient-bar';
          bar.appendChild(toggle);
          host.insertBefore(bar, host.firstChild);
          return;
        }
        if (place === 'topbar') {
          const topbar = host.querySelector('.dash-card-topbar');
          if (topbar) {
            const kebab = topbar.querySelector('.dash-kebab-wrap');
            if (kebab) topbar.insertBefore(toggle, kebab);
            else topbar.appendChild(toggle);
            return;
          }
        }
        if (place === 'head') {
          const head = host.querySelector('.att-head, .dash-breakdown-title, .dash-pillars-heading, .dash-seg-head, .dash-section-head:not(.dash-mrow-head)');
          if (head) { head.appendChild(toggle); return; }
          const title = host.querySelector('.dash-top5-title, .att-title');
          if (title) {
            const bar = document.createElement('div');
            bar.className = 'att-orient-bar';
            bar.appendChild(toggle);
            title.insertAdjacentElement('afterend', bar);
            return;
          }
        }
        const bar = document.createElement('div');
        bar.className = 'att-orient-bar';
        bar.appendChild(toggle);
        host.insertBefore(bar, host.firstChild);
      }

      function attach(spec) {
        const root = document.querySelector('#agent-main-scroll .dash') || document;
        const host = root.querySelector(spec.sel);
        if (!host || host.dataset.attOrientBound === '1') return !!host;
        if (toggleRoot(host).querySelector('.att-orient')) {
          host.dataset.attOrientBound = '1';
          return true;
        }
        const saved = store()[spec.id];
        const orient = saved === 'v' || saved === 'h' ? saved : spec.def;
        const toggle = buildToggle(host, spec, orient);
        placeToggle(host, toggle, spec.place);
        host.dataset.attOrientBound = '1';
        apply(host, spec, orient);
        return true;
      }

      function scan() {
        let all = true;
        CHARTS.forEach((spec) => { if (!attach(spec)) all = false; });
        return all;
      }

      function init() {
        if (scan()) return;
        const obs = new MutationObserver(() => { if (scan()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
        setTimeout(() => obs.disconnect(), 14000);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <style>
    /* =====================================================================
       Additional chart types (analytics-types.html only).
       Ten common analytics charts the portfolio gallery was missing —
       line/trend, stacked columns, stacked area, histogram, KPI gauges,
       combo dual-axis, waterfall, bubble, a U.S. tile-grid choropleth, and
       box-and-whisker. All share the .att-card shell, the WISE status-colour
       tokens (so light/dark parity is automatic), count-up numerics, an
       entrance sweep on scroll-in, and click-to-replay.
    ===================================================================== */
    .atx-card .att-intro { margin-bottom: 10px; }
    .atx-stage { position: relative; width: 100%; margin-top: 6px; cursor: pointer; outline: none; }
    .atx-stage:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 10px; }
    .atx-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .atx-grid { stroke: color-mix(in srgb, var(--border) 65%, transparent); stroke-width: 1; }
    html.dark .atx-grid { stroke: rgba(255, 255, 255, 0.08); }
    .atx-axis { stroke: var(--border); stroke-width: 1.25; }
    html.dark .atx-axis { stroke: rgba(255, 255, 255, 0.16); }
    .atx-tick { fill: var(--text-muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .atx-tick--x { font-size: 10.5px; }
    .atx-alabel { fill: var(--text-subtle); font-size: 11px; font-weight: 800; letter-spacing: .02em; }
    .atx-dot-lbl { fill: var(--text); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .atx-white-lbl { fill: #fff; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* Bars grow from their own base for the entrance / replay sweep. */
    .atx-bar { transform-box: fill-box; transform-origin: bottom; }
    .atx-stage.is-in .atx-bar { animation: atxRise .72s cubic-bezier(.22,1,.36,1) both; }
    @keyframes atxRise { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .atx-pop { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .atx-stage.is-in .atx-pop { animation: atxPop .55s cubic-bezier(.22,1,.36,1) both; }
    @keyframes atxPop { from { opacity: 0; transform: scale(.15); } 60% { opacity: 1; } to { opacity: 1; transform: scale(1); } }

    .atx-fade { opacity: 0; }
    .atx-stage.is-in .atx-fade { animation: atxFade .5s ease both; }
    @keyframes atxFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .atx-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }

    @media (prefers-reduced-motion: reduce) {
      .atx-stage.is-in .atx-bar,
      .atx-stage.is-in .atx-bar--h,
      .atx-stage.is-in .atx-pop,
      .atx-stage.is-in .atx-fade,
      .atx-stage.is-in .atx-geo-tile,
      .atx-stage.is-in .atx-mini-fill { animation: none; }
      .atx-pop, .atx-fade, .atx-geo-tile { opacity: 1; }
      .atx-mini-fill { transform: none; }
    }

    /* KPI gauges */
    .atx-gauges { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .atx-gauge { flex: 1 1 180px; max-width: 240px; display: flex; flex-direction: column; align-items: center; }
    .atx-gauge svg { width: 100%; height: auto; overflow: visible; display: block; }
    .atx-gauge-track { fill: none; stroke: color-mix(in srgb, var(--border) 70%, var(--surface)); stroke-width: 14; stroke-linecap: round; }
    html.dark .atx-gauge-track { stroke: rgba(255, 255, 255, 0.09); }
    .atx-gauge-val { fill: none; stroke-width: 14; stroke-linecap: round; }
    .atx-gauge-num { fill: var(--text); font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .atx-gauge-notch { stroke: var(--text); stroke-width: 2.5; opacity: .55; }
    .atx-gauge-label { margin-top: 2px; font-size: 13px; font-weight: 800; color: var(--text); text-align: center; }
    .atx-gauge-target { font-size: 11.5px; color: var(--text-subtle); font-weight: 600; }

    /* U.S. tile-grid choropleth */
    .atx-geo { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; max-width: 620px; margin: 4px auto 0; }
    .atx-geo-tile {
      aspect-ratio: 1 / 1; border-radius: 8px; opacity: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .atx-stage.is-in .atx-geo-tile { animation: atxPopH .48s cubic-bezier(.22,1,.36,1) both; }
    @keyframes atxPopH { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
    .atx-geo-tile:hover { transform: scale(1.12); box-shadow: var(--shadow-2); z-index: 2; }
    .atx-geo-ab { font-size: 11px; font-weight: 800; line-height: 1; }
    .atx-geo-v { font-size: 9.5px; font-weight: 700; opacity: .92; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .atx-note { margin: 14px 0 0; font-size: 12px; color: var(--text-subtle); line-height: 1.55; }
