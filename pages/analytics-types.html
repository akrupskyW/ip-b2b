<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Dashboard</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint so the page
       never flashes dark→light (or vice versa). Mirrors ai-chat.html storage. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* no saved theme: default light */
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* =====================================================================
       Typography lock-in (aha.html only) — Noto Serif is the display face for
       H1/H2-level headings, the big stat numerals, and CTAs across the
       dashboard + WISEcodeAI welcome. Body copy, labels, eyebrows, pills and
       descriptions stay in DM Sans. Scoped to body[data-product-id="dashboard"]
       so the shared pages/wise.css rules aren't touched elsewhere.
    ===================================================================== */
    body[data-product-id="dashboard"] {
      --font-serif: 'WISE Digits', 'Noto Serif', serif;
    }

    /* --- H1 / H2 headings --- */
    body[data-product-id="dashboard"] .ws-heading,
    body[data-product-id="dashboard"] .dash-hero-title,
    body[data-product-id="dashboard"] .dash-section-title,
    body[data-product-id="dashboard"] .dash-card-title,
    body[data-product-id="dashboard"] .dash-pillars-cta-headline,
    body[data-product-id="dashboard"] .dash-modal-title,
    body[data-product-id="dashboard"] .dash-report-summary,
    body[data-product-id="dashboard"] .agent-hero-title,
    body[data-product-id="dashboard"] .agent-section-title,
    body[data-product-id="dashboard"] .agent-card-title {
      font-family: 'WISE Digits', var(--font-serif);
      letter-spacing: -0.01em;
    }

    /* --- Big stat numerals (47 / 6% / 79 / 92% / 75 …) --- */
    body[data-product-id="dashboard"] .dash-bignum,
    body[data-product-id="dashboard"] .dash-pct,
    body[data-product-id="dashboard"] .dash-score-num .n,
    body[data-product-id="dashboard"] .dash-donut-num,
    body[data-product-id="dashboard"] .dash-headline-num,
    body[data-product-id="dashboard"] .dash-wisescore-num .n,
    body[data-product-id="dashboard"] .dash-pillar-score,
    body[data-product-id="dashboard"] .dash-report-stat-val,
    body[data-product-id="dashboard"] .dash-seg-pct-num {
      font-family: 'WISE Digits', var(--font-serif);
    }

    /* --- CTAs / primary action buttons --- */
    body[data-product-id="dashboard"] .dash-btn,
    body[data-product-id="dashboard"] .dash-btn-row .wise-btn,
    body[data-product-id="dashboard"] .dash-cta-banner-btn,
    body[data-product-id="dashboard"] .dash-pillars-cta-btn,
    body[data-product-id="dashboard"] .dash-ai-btn,
    body[data-product-id="dashboard"] .agent-cta {
      font-family: 'WISE Digits', var(--font-serif);
      letter-spacing: 0;
    }

    /* =====================================================================
       analytics-types.html only — strip the chrome down to the core charts.
       The shell + dashboard content come from shared JS (also used by
       aha.html), so these page-scoped rules hide the pieces we don't want
       here without touching the shared modules.
    ===================================================================== */
    /* Navigation rail */
    #menu-panel { display: none !important; }
    /* WISEcodeAI dock module */
    #wiseai-dock-panel { display: none !important; }
    /* Top welcome hero (brand banner image) */
    .dash-hero { display: none !important; }
    /* Bottom CTA hero (owl watermark + headline) */
    .dash-pillars-cta { display: none !important; }
    /* Floating "ready to verify" copy over the third claim column */
    .dash-score-toast { display: none !important; }

    /* Drop the "Highest-leverage fixes" ranked list from the focus-scatter row,
       but keep the shared two-column grid so the "Where to focus" scatter stays
       in column one (the hidden side card leaves column two empty). */
    .dash-scatter-side { display: none !important; }
    .dash-scatter-row[data-att-orient="v"] .dash-scatter-side { display: flex !important; }

    /* "Where to focus" header: stack the description beneath the headline instead
       of letting it wrap to the right of it (the shared topbar lead is a flex row). */
    .dash-scatter-section .dash-card-topbar-lead {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    /* The shared scatter intro is capped at 52ch (sized for the narrower
       two-column dashboard layout), which makes it wrap midway here. Let it run
       the full width of the card so it fills the container. */
    .dash-scatter-section .dash-scatter-intro {
      max-width: none;
    }

    /* Scatter x/y axis tick numbers: smaller + regular weight. Exempted from the
       12px font floor below (see the min-font-size script's skip rule). */
    .dash-scatter-tick {
      font-size: 10px !important;
      font-weight: 400 !important;
    }

    /* The WISEscore status popover (the five-tier "Excellent / Good / …" scale)
       must stay hidden until its underlined term is hovered or focused. This
       rule lives inline so it always loads with the page and can't be served
       from a stale cached dashboard.css. */
    .dash-status-tip {
      position: absolute !important;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .dash-status-term:hover .dash-status-tip,
    .dash-status-term:focus .dash-status-tip,
    .dash-status-term:focus-within .dash-status-tip {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* The tooltip rows are inline <span>s (so they can legally nest inside the
       <p>/<h2> that hosts the status term without the parser ejecting them).
       Force block/flex layout here too, in case a stale cached dashboard.css is
       served without the matching display rules. */
    .dash-status-tip-row { display: block !important; }
    .dash-status-tip-line { display: flex !important; }
    .dash-status-tip-desc { display: block !important; }

    /* The Portfolio Analysis block is the last section on the page, so its
       status popover would open downward off the bottom and get clipped. Flip
       it to open upward (above the word) so the full scale stays visible.
       Inline here for the same stale-cache reason as the rule above. */
    .dash-seg-note .dash-status-tip {
      top: auto !important;
      bottom: calc(100% + 9px) !important;
    }

    /* Segmented health-bar legend: stack the score on its own line beneath the
       status name (instead of sitting inline to its right). */
    .dash-seg-leg-info {
      flex-wrap: wrap;
      justify-content: center;
    }
    .dash-seg-leg-count {
      flex-basis: 100%;
      text-align: center;
      margin-top: 2px;
    }

    /* =====================================================================
       Portfolio Performance Matrix (analytics-types.html only).
       A dense SKU × metric cross-reference grid: 10 product rows × 15 metric
       columns. Each cell's COLOR encodes that product's status on that metric
       (Excellent → Poor). Column codes are colour-coded by category. Built as
       an aligned CSS grid so columns/rows stay scannable.
       Uses the WISE token palette + the report's 5-tier status colours.
    ===================================================================== */
    .att-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 16px);
      box-shadow: var(--shadow-card);
      padding: 22px 24px;
      margin: 0 0 22px;
    }
    .att-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .att-eyebrow {
      display: inline-flex; align-items: center;
      padding: 4px 11px; border-radius: var(--radius-pill, 999px);
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      font-size: 11px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--primary);
    }
    html.dark .att-eyebrow { color: var(--primary-bright, var(--primary)); }
    .att-title {
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 21px; font-weight: 700; color: var(--text); letter-spacing: -0.01em;
    }
    .att-intro {
      font-size: 13px; color: var(--text-subtle); line-height: 1.65;
      max-width: 760px; margin: 10px 0 18px;
    }
    .att-scroll { overflow-x: auto; overflow-y: visible; padding-bottom: 4px; }
    #att-tree-card .att-scroll {
      padding-top: 92px;
      margin-top: -76px;
    }
    .att-stage { position: relative; margin: 0 auto; width: 100%; overflow: visible; }

    /* --- Performance matrix grid (products × metric codes) ---
       A dense SKU × metric cross-reference: rows are products, columns are the
       15 metric codes. Each cell's COLOUR encodes that product's status on that
       metric. Built as a CSS grid so columns stay aligned for column scanning. */
    .pmx {
      display: grid;
      grid-template-columns: 40px 1px minmax(132px, 168px) repeat(15, minmax(44px, 1fr));
      gap: 4px;
      min-width: 920px;
    }
    .pmx-corner { background: transparent; }
    /* Horizontal metric codes sit on the x-axis below the cells. */
    .pmx-xlabel {
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 7px; text-align: center;
    }
    .pmx-xlabel span {
      font-size: 11px; font-weight: 700; letter-spacing: .01em;
      line-height: 1.18; color: var(--text);
    }
    .pmx-rowavatar {
      display: flex; align-items: center; justify-content: center;
      padding: 0 2px;
    }
    .pmx-avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; flex: none;
      border-radius: 9px; overflow: hidden;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--primary) 8%, transparent);
    }
    .pmx-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pmx-avatar-ph { font-size: 16px; color: var(--text-subtle); }
    .pmx-rowdivider {
      align-self: stretch;
      width: 1px;
      margin: 4px 0;
      background: var(--border);
    }
    html.dark .pmx-rowdivider { background: rgba(255, 255, 255, .12); }
    .pmx-rowmeta {
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px 0 8px; min-width: 0;
    }
    .pmx-rowname {
      font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .pmx-rowscore {
      margin-left: auto;
      font-size: 11px; font-weight: 800; color: var(--text-subtle);
      font-variant-numeric: tabular-nums; flex-shrink: 0;
    }
    .pmx-cell {
      position: relative;
      border-radius: 5px; min-height: 30px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 800;
      font-variant-numeric: tabular-nums; cursor: default;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
      transition: transform .1s ease, box-shadow .1s ease, filter .1s ease;
    }
    .pmx-cell > span { position: relative; z-index: 1; }
    /* Poor / fair cells host a floating fix nudge (mirrors aha.html's score toast). */
    .pmx-cell--fix {
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    .pmx-fix-toast {
      position: absolute;
      /* Default placement: floating above the cell. The exact horizontal `left`
         (in px, relative to the cell) and the --pmx-arrow-x are set by JS so the
         bubble stays inside the scroll box and the arrow keeps pointing at the
         cell. The float/entrance animations only translateY, so they never fight
         this horizontal positioning. */
      left: 0;
      bottom: calc(100% + 8px);
      z-index: 8;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: max-content;
      min-width: 170px;
      max-width: 224px;
      padding: 10px 12px 11px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary, #25507C) 0%, #336699 100%);
      color: #fff;
      box-shadow: 0 10px 26px rgba(37, 80, 124, 0.38), 0 3px 8px rgba(0, 0, 0, 0.14);
      pointer-events: auto;
      animation:
        dash-score-toast-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) both,
        dash-score-toast-float 3.6s ease-in-out 0.32s infinite;
    }
    /* Arrow for the default (above-the-cell) placement: points down at the cell.
       Its x is re-pointed at the cell centre via --pmx-arrow-x when the bubble is
       shifted sideways to stay on-screen. */
    .pmx-fix-toast::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: var(--pmx-arrow-x, 50%);
      width: 11px;
      height: 11px;
      margin-left: -5px;
      background: #336699;
      transform: rotate(45deg);
      border-radius: 0 0 2px 0;
    }
    /* Flipped placement: when there isn't room above (top rows scrolled near the
       viewport top), the bubble drops below the cell and the arrow points up. */
    .pmx-fix-toast--below {
      bottom: auto;
      top: calc(100% + 8px);
    }
    .pmx-fix-toast--below::after {
      bottom: auto;
      top: -5px;
      background: var(--primary, #25507C);
      border-radius: 2px 0 0 0;
    }
    .pmx-fix-toast-icon { display: inline-flex; flex-shrink: 0; margin-top: 0; }
    .pmx-fix-toast-icon .material-symbols-outlined { font-size: 17px; color: #fff; }
    .pmx-fix-toast-body { min-width: 0; }
    /* Type authored at the page's 12px floor so the min-font-size clamp leaves it
       untouched (it used to bump 10/11px up to 12px and break the layout). */
    .pmx-fix-toast-title {
      font-size: 12px; font-weight: 800; line-height: 1.3;
      padding-right: 20px;
    }
    .pmx-fix-toast-text {
      margin: 3px 0 0;
      font-size: 12px;
      line-height: 1.42;
      color: rgba(255, 255, 255, 0.94);
    }
    .pmx-fix-toast-close {
      position: absolute;
      top: 6px;
      right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .pmx-fix-toast-close:hover { background: rgba(255, 255, 255, 0.42); transform: scale(1.08); }
    .pmx-fix-toast-close .material-symbols-outlined { font-size: 14px; line-height: 1; }
    @media (prefers-reduced-motion: reduce) {
      .pmx-fix-toast { animation: dash-score-toast-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
    }
    .pmx-cell span { opacity: 0; transition: opacity .1s ease; }
    .pmx-cell:hover {
      transform: scale(1.12); filter: brightness(1.06);
      box-shadow: var(--shadow-2); z-index: 3;
    }
    .pmx-cell:hover span { opacity: 1; }
    /* Entrance / replay sweep — cells fade + scale in along a diagonal wave
       (staggered animation-delay set in JS), matching the load-in / tap-to-
       replay behaviour of the dashboard's other charts. The class is stripped
       on animationend so the hover transform/transition takes over again. */
    @keyframes pmxCellIn {
      from { opacity: 0; transform: scale(0.35); }
      60%  { opacity: 1; }
      to   { opacity: 1; transform: scale(1); }
    }
    .pmx-cell.is-pmx-in { animation: pmxCellIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @media (prefers-reduced-motion: reduce) {
      .pmx-cell.is-pmx-in { animation: none; }
    }
    .att-legend {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      margin-top: 18px; font-size: 12px; color: var(--text-subtle);
    }
    .att-legend-dots {
      grid-column: 2; display: flex; gap: 18px; flex-wrap: wrap;
      justify-content: center;
    }
    .att-legend-dots > span { display: flex; align-items: center; gap: 6px; }
    .att-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .att-more {
      grid-column: 1; justify-self: start;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0; border: none; background: none; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 700;
      color: var(--primary);
    }
    html.dark .att-more { color: var(--primary-bright, var(--primary)); }
    .att-more:hover { text-decoration: underline; }
    .att-more .material-symbols-outlined { font-size: 16px; }

    /* =====================================================================
       Matrix responsiveness — keyed to the dashboard column width via the
       shared `dash` query container (.dash on this page). The module resize
       toggle (full → wide → reading) and the WISEcodeAI panel both change that
       width; as it tightens we trade horizontal scroll for graceful shrink:
       the name column and heat cells get narrower. Default (roomy): the grid
       keeps an 860px min and scrolls if the column is narrower still.
    ===================================================================== */
    @container dash (max-width: 760px) {
      .pmx {
        grid-template-columns: 34px 1px minmax(104px, 152px) repeat(15, minmax(30px, 1fr));
        min-width: 680px;
      }
      .pmx-avatar { width: 28px; height: 28px; }
    }
    @container dash (max-width: 560px) {
      .pmx {
        grid-template-columns: 28px 1px minmax(82px, 1fr) repeat(15, minmax(18px, 1fr));
        min-width: 0; gap: 3px;
      }
      .pmx-cell { min-height: 26px; border-radius: 4px; }
      .pmx-avatar { width: 24px; height: 24px; border-radius: 6px; }
      .pmx-rowmeta { padding-left: 6px; gap: 6px; }
      .pmx-fix-toast { display: none; }
    }
    @container dash (max-width: 440px) {
      .pmx {
        grid-template-columns: 24px 1px minmax(66px, 1fr) repeat(15, minmax(13px, 1fr));
        gap: 2px;
      }
      .pmx-cell { min-height: 22px; border-radius: 3px; }
      .pmx-xlabel { padding-top: 5px; }
      .pmx-avatar { width: 20px; height: 20px; border-radius: 5px; }
    }

    /* =====================================================================
       Rich cursor-following tooltip for the matrix cells. Explains exactly
       what's being hovered: the product (+ its WISEscore), the metric (full
       name, category, what it measures), a health bar filled to that score,
       and a plain-language meaning of the metric's status directly beneath it.
       Built/positioned by the inline script below; styled to match the shared
       #dash-donut-tip popover. Floored to the page's 12px minimum font size, so
       type sizes are authored at 12px and up.
    ===================================================================== */
    #pmx-tip {
      position: fixed; z-index: 10000; left: 0; top: 0;
      width: 278px; max-width: 88vw; padding: 13px 15px 12px;
      border-radius: 12px; background: var(--surface); color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card, 0 12px 32px rgba(0, 0, 0, .2));
      font-family: inherit; pointer-events: none;
      opacity: 0; transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
    }
    #pmx-tip.is-visible { opacity: 1; transform: translateY(0); }
    html.dark #pmx-tip {
      background: #14242f; border-color: rgba(255, 255, 255, .1);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .55);
    }
    .pmx-tip-head { display: flex; align-items: center; gap: 10px; }
    .pmx-tip-sku { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
    .pmx-tip-sku-sub { font-size: 12px; color: var(--text-subtle); margin-top: 1px; }
    .pmx-tip-sku-sub strong { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
    .pmx-tip-divider { height: 1px; background: var(--border); margin: 11px 0; }
    .pmx-tip-eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
      color: var(--text-subtle); margin-bottom: 3px;
    }
    .pmx-tip-metric { font-size: 13px; font-weight: 800; color: var(--text); }
    .pmx-tip-metric-desc { font-size: 12px; line-height: 1.5; color: var(--text-subtle); margin-top: 3px; }
    .pmx-tip-status-desc { font-size: 12px; line-height: 1.5; color: var(--text-subtle); margin-top: 9px; }
    .pmx-tip-bar { margin: 13px 0 0; }
    .pmx-tip-bar-track {
      position: relative; height: 10px; border-radius: 999px; overflow: hidden;
      background: color-mix(in srgb, var(--text-subtle) 16%, transparent);
    }
    .pmx-tip-bar-fill {
      position: absolute; left: 0; top: 0; bottom: 0; min-width: 6px;
      border-radius: 999px; transition: width .2s ease;
    }
    .pmx-tip-foot {
      font-size: 12px; line-height: 1.45; color: var(--text-muted);
      margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--border);
    }

    /* =====================================================================
       Polar area chart (analytics-types.html only). Replaces the shared
       pillar-metrics radar with equal-angle wedges whose radius encodes each
       metric's score. Grid / spokes / labels reuse the radar's token palette
       so it sits seamlessly inside the existing card. Injected by the inline
       script below, which reads the data straight off the rendered radar.
    ===================================================================== */
    .pa-svg { width: 100%; height: auto; display: block; overflow: visible; }
    /* Recessed "well" the rosette sits inside: a subtly grey disc stamped into
       the card with an inset shadow, so the petals read as raised above it. */
    .pa-bg { fill: color-mix(in srgb, var(--border) 60%, var(--surface)); }
    html.dark .pa-bg { fill: rgba(255, 255, 255, 0.035); }
    .pa-grid { fill: none; stroke: color-mix(in srgb, var(--border) 70%, transparent); stroke-width: 1; }
    .pa-spoke { stroke: color-mix(in srgb, var(--border) 70%, transparent); stroke-width: 1; }
    html.dark .pa-grid,
    html.dark .pa-spoke { stroke: rgba(255, 255, 255, 0.08); }
    .pa-ringval { fill: var(--text-subtle); font-size: 11px; font-weight: 600; }
    .pa-axis-label { fill: var(--text-muted); font-size: 11px; font-weight: 600; }
    .pa-wedge {
      fill-opacity: 0.92;
      stroke: var(--surface);
      stroke-width: 1.5;
      stroke-linejoin: round;
      cursor: pointer;
      /* Elevation + depth: a broad ambient shadow paired with a tight contact
         shadow lifts each wedge off the grid so the rosette reads as a cluster
         of raised petals rather than a flat fill. */
      filter: drop-shadow(0 3px 5px rgba(8, 15, 26, 0.22)) drop-shadow(0 1px 1.5px rgba(8, 15, 26, 0.16));
      transition: fill-opacity 0.15s ease, filter 0.15s ease;
    }
    .pa-wedge:hover {
      fill-opacity: 1;
      /* Lift the hovered wedge higher (deeper shadow) and add its status-color glow. */
      filter: brightness(1.05) drop-shadow(0 7px 11px rgba(8, 15, 26, 0.28)) drop-shadow(0 0 6px currentColor);
    }
    html.dark .pa-wedge {
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5)) drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.4));
    }
    html.dark .pa-wedge:hover {
      filter: brightness(1.08) drop-shadow(0 7px 13px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 6px currentColor);
    }

    /* =====================================================================
       Page header (analytics-types.html only). Mirrors the shared navigation
       brand lock-up: the WISEcode wordmark on the left with the "Intelligence™"
       tagline stacked beneath it, and a right-aligned meta cluster (report ID,
       generated date, export-to-PDF). Built standalone so it renders even with
       the nav rail + top bar suppressed on this page.
    ===================================================================== */
    .ah-topbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      padding: 16px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ah-topbar-logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }
    .ah-topbar-logo svg { display: block; height: 24px; width: auto; color: var(--text); }
    .ah-topbar-tagline {
      align-self: flex-end;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .ah-topbar-tagline .tagline-tm {
      font-size: 0.5em;
      letter-spacing: 0;
      vertical-align: super;
      margin-left: 1px;
    }
    .ah-topbar-meta { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .ah-meta-item { text-align: right; }
    .ah-meta-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .ah-meta-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .ah-export-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: filter 0.12s ease;
    }
    .ah-export-btn:hover { filter: brightness(1.06); }
    .ah-export-btn svg { width: 13px; height: 13px; display: block; }
    .ah-export { position: relative; }
    .ah-export-caret { width: 10px !important; height: 10px !important; margin-left: -1px; transition: transform 0.15s ease; }
    .ah-export.is-open .ah-export-caret { transform: rotate(180deg); }
    .ah-export-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 232px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-card, 0 12px 32px rgba(0, 0, 0, .2));
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ah-export-menu[hidden] { display: none; }
    .ah-export-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 9px 11px;
      background: none;
      border: none;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: background 0.12s ease;
    }
    .ah-export-item:hover,
    .ah-export-item:focus-visible {
      background: color-mix(in srgb, var(--primary) 9%, var(--surface));
      outline: none;
    }
    .ah-export-item svg { width: 16px; height: 16px; flex: none; color: var(--primary); }
    html.dark .ah-export-item svg { color: var(--primary-bright, var(--primary)); }
    .ah-export-item > span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .ah-export-item-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .ah-export-item-sub { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    /* Toast — transient feedback for the export actions (copy / share / CSV).
       Inverted chip pinned to the bottom-center, themed off the token palette so
       it reads in both light and dark. */
    .ah-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(12px);
      z-index: 11000;
      max-width: min(440px, 90vw);
      padding: 11px 18px;
      border-radius: 10px;
      background: var(--text);
      color: var(--surface);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-card, 0 12px 32px rgba(0, 0, 0, .25));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .ah-toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =====================================================================
       Print / Export-to-PDF (analytics-types.html only). The screen layout is a
       fixed-viewport flex/grid shell with internal scroll panes; for print we
       unlock every height/overflow constraint so the whole report flows onto
       paper, force exact colour reproduction so the charts + heat cells print as
       seen, and keep cards from breaking across page boundaries. Because the
       matrix's @container rules key off the printed page width, the PDF stays
       responsive — it mirrors exactly what's on screen at its current size.
    ===================================================================== */
    @media print {
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        /* Always print/export on a plain white page, even in dark mode. */
        background: #fff !important;
        background-color: #fff !important;
      }
      /* Render at a "small desktop" width, then scale the whole report down to
         fit US Letter — so the roomy desktop layout (wide matrix, multi-column
         rows) prints instead of the collapsed narrow one, fitting far more per
         page. At zoom 0.7 the ~710px printable width lays out as ~1015px of
         desktop space; unlike transform: scale() this still paginates cleanly. */
      body { zoom: 0.7; }
      #agent-shell-wrap,
      #agent-shell-wrap.menu-brand-integrated,
      #modules-row,
      #agent-main,
      .agent-main-inner,
      .agent-main-scroll,
      #agent-main-scroll {
        display: block !important;
        height: auto !important;
        max-height: none !important;
        min-height: 0 !important;
        max-width: none !important;
        overflow: visible !important;
        box-shadow: none !important;
      }
      .agent-main-inner { border: none !important; background: none !important; }
      /* Interactive-only chrome that shouldn't appear on paper. */
      .ah-export,
      .ah-toast,
      #pmx-tip,
      #dash-donut-tip,
      .inf-orient,
      .att-orient,
      .att-orient-bar { display: none !important; }
      /* Pagination strategy: do NOT force whole cards/sections onto one page —
         that's what left large empty gaps at the foot of a page whenever a tall
         chart card couldn't fit in the remaining space. Instead let the big
         containers flow across page boundaries so each page packs full, and only
         protect the atomic pieces (a single chart graphic, a legend, one bar /
         row) from being sliced mid-way. */
      .att-card,
      .dash-card,
      .dash-section {
        break-inside: auto;
        page-break-inside: auto;
      }
      /* Atomic visuals that must never split across a page break. */
      .dash-donut-row,
      .dash-radar-body,
      .dash-radar,
      .dash-scatter-plot,
      .dash-breakdown-donut-stage,
      .dash-seg-bars,
      .dash-pillar-card,
      .dash-score-card,
      .dash-claim-col,
      .dash-breakdown-bar,
      .dash-pillar-row,
      .att-legend,
      .inf-chart,
      .cf-chart,
      .atx-svg,
      .atx-donuts,
      .atx-half,
      .atx-tbl {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      /* Never orphan a heading at the bottom of a page from its chart. */
      .dash-card-title,
      .dash-card-topbar,
      .dash-section-title,
      .dash-section-head {
        break-after: avoid;
        page-break-after: avoid;
      }
      /* Let the collapsible matrix scroller expand so nothing is clipped. */
      .att-scroll { overflow: visible !important; }
      /* Snap any in-flight matrix entrance to its finished (visible) state so a
         print captured mid-sweep still shows every cell at full size. */
      .pmx-cell.is-pmx-in { animation: none !important; }
      .pmx-fix-toast { display: none !important; }
      @page { size: 8.5in 11in; margin: 14mm; }
    }

    /* =====================================================================
       Floating section navigation (analytics-types.html only). A fixed
       right-edge rail that lists every chart / section on the page; clicking
       an item smooth-scrolls the report's scroll pane to that section.
       Collapsed to a column of ticks by default, it expands to reveal the
       labels on hover / keyboard focus. A scrollspy highlights whichever
       section is currently in view. Hidden when printing and on narrow
       viewports where it would crowd the report.
    ===================================================================== */
    .az-nav {
      position: fixed;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      z-index: 950;
      display: flex;
      max-height: 86vh;
    }
    .az-nav[hidden] { display: none; }
    .az-nav-inner {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .az-nav-inner::-webkit-scrollbar { width: 0; height: 0; }
    .az-nav:hover .az-nav-inner,
    .az-nav:focus-within .az-nav-inner {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow-card, 0 12px 32px rgba(0, 0, 0, .2));
    }
    html.dark .az-nav:hover .az-nav-inner,
    html.dark .az-nav:focus-within .az-nav-inner {
      background: #14242f;
      border-color: rgba(255, 255, 255, .1);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .55);
    }
    .az-nav-item {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      padding: 5px 4px;
      border: none;
      background: none;
      border-radius: 9px;
      cursor: pointer;
      color: var(--text-subtle);
      font-family: inherit;
      text-align: right;
      transition: background .12s ease, color .12s ease;
    }
    .az-nav-label {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      max-width: 0;
      margin-right: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-width .22s ease, opacity .16s ease, margin-right .22s ease;
    }
    .az-nav:hover .az-nav-label,
    .az-nav:focus-within .az-nav-label {
      max-width: 240px;
      margin-right: 10px;
      opacity: 1;
    }
    .az-nav-tick {
      flex: none;
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      transition: background .14s ease, width .14s ease, height .14s ease;
    }
    html.dark .az-nav-tick { background: rgba(255, 255, 255, .2); }
    .az-nav-item:hover,
    .az-nav-item:focus-visible {
      background: color-mix(in srgb, var(--primary) 9%, var(--surface));
      color: var(--text);
      outline: none;
    }
    .az-nav-item:hover .az-nav-tick,
    .az-nav-item:focus-visible .az-nav-tick {
      background: var(--text-subtle);
      width: 22px;
    }
    .az-nav-item.is-active { color: var(--text); }
    .az-nav-item.is-active .az-nav-label { font-weight: 800; color: var(--text); }
    .az-nav-item.is-active .az-nav-tick {
      background: var(--primary);
      width: 24px;
      height: 4px;
    }
    html.dark .az-nav-item.is-active .az-nav-tick {
      background: var(--primary-bright, var(--primary));
    }
    @media (max-width: 1180px) { .az-nav { display: none !important; } }
    @media print { .az-nav { display: none !important; } }
    @media (prefers-reduced-motion: reduce) {
      .az-nav-inner,
      .az-nav-item,
      .az-nav-tick,
      .az-nav-label { transition: none; }
    }

    /* --- Pink "skinny bars" toggle, pinned to the top of the floating nav.
       Flips every chunky WISEscore health bar (.dash-ws-health-bar) to a slim
       track; the switch track turns pink when engaged. The label rides the same
       hover-reveal behaviour as the section items below it. ------------------ */
    .az-nav { --az-pink: #ec4899; }
    .az-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      padding: 6px 4px;
      border: none;
      background: none;
      border-radius: 9px;
      cursor: pointer;
      color: var(--text-subtle);
      font-family: inherit;
      text-align: right;
      transition: background .12s ease, color .12s ease;
    }
    .az-toggle:hover,
    .az-toggle:focus-visible {
      background: color-mix(in srgb, var(--az-pink) 14%, var(--surface));
      color: var(--text);
      outline: none;
    }
    .az-switch {
      flex: none;
      position: relative;
      width: 26px;
      height: 15px;
      border-radius: 999px;
      background: var(--border);
      transition: background .16s ease;
    }
    html.dark .az-switch { background: rgba(255, 255, 255, .22); }
    .az-switch-dot {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
      transition: transform .16s ease;
    }
    .az-toggle[aria-checked="true"] .az-switch { background: var(--az-pink); }
    .az-toggle[aria-checked="true"] .az-switch-dot { transform: translateX(11px); }
    .az-toggle[aria-checked="true"] .az-nav-label { color: var(--az-pink); font-weight: 800; }
    .az-nav-sep {
      height: 1px;
      margin: 5px 2px 6px;
      background: var(--border);
    }
    html.dark .az-nav-sep { background: rgba(255, 255, 255, .1); }
    @media (prefers-reduced-motion: reduce) {
      .az-toggle,
      .az-switch,
      .az-switch-dot { transition: none; }
    }

    /* =====================================================================
       Skinny health-bar mode (toggled by the pink switch above). Only the
       "fat" WISEscore bars (.dash-ws-health-bar) are affected: the chunky
       ~22px track collapses to a slim 8px pill, the score baked into the
       coloured fill is hidden, and the relocated score (.az-score-chip,
       injected once per bar by the script below) surfaces in the row's head —
       joining the existing rating / share chip, or standing in for it when the
       head has none. The slim, score-above layout mirrors the pillar-card
       metric bars. The segmented and pillar-metric bars are left untouched.
    ===================================================================== */
    body.az-skinny-bars .dash-ws-health-track { height: 4px; }
    body.az-skinny-bars .dash-ws-health-bar { position: relative; }
    body.az-skinny-bars .dash-ws-health-fill { min-width: 0; padding-right: 0; }
    body.az-skinny-bars .dash-ws-health-fill .dash-ws-health-num,
    body.az-skinny-bars .dash-ws-health-fill .dash-pct-wrap,
    body.az-skinny-bars .dash-ws-health-fill .dash-pct { display: none; }

    /* The relocated score chip: hidden in fat mode, revealed in skinny mode. */
    .az-score-chip { display: none; }
    body.az-skinny-bars .az-score-chip {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    /* Every head row above a skinny bar: pin the row's label on the left and
       float all its chips — status / rating / intent chips plus the relocated
       score — together to the right. */
    body.az-skinny-bars .dash-breakdown-bar-head,
    body.az-skinny-bars .dash-ing-bar-head,
    body.az-skinny-bars .dash-gras-bar-head {
      justify-content: flex-start;
      margin-bottom: 6px;
    }
    body.az-skinny-bars .dash-breakdown-bar-head > .dash-breakdown-bar-name,
    body.az-skinny-bars .dash-ing-bar-head > .dash-ing-name,
    body.az-skinny-bars .dash-gras-bar-head > .dash-gras-bar-name { margin-right: auto; }

    /* Bars with no per-row head (the overall WISEscore bar): float the score at
       the bar's top-right, "in place of the chip". */
    body.az-skinny-bars .az-score-chip--overlay {
      position: absolute;
      right: 0;
      bottom: calc(100% + 6px);
    }

    /* =====================================================================
       Product-Level UPF Classification (analytics-types.html only).
       A sortable table of every active SKU with its UPF classification, WISEcode
       processing level, and Non-UPF shield status. Every column header sorts
       (click to toggle asc/desc); a pink switch flips the whole table into a
       responsive grid of cards — same rows, same sort order, card layout.
       Built on the shared .att-card shell and the WISE token palette so it
       sits seamlessly beside the other report cards. Injected by the inline
       script below.
    ===================================================================== */
    #upf-class-card { --upf-pink: #ec4899; }

    /* Controls bar: count + sort dropdown on the left, the pink view toggle on
       the right. Stacks on narrow report columns. */
    .upf-controls {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 14px; flex-wrap: wrap; margin-bottom: 16px;
    }

    /* Pink view toggle (table ↔ cards). A label-less switch; track turns pink
       when card view is on. */
    .upf-toggle {
      display: inline-flex; align-items: center;
      padding: 6px; border: none; background: none; cursor: pointer;
      border-radius: 9px; font-family: inherit;
      transition: background .12s ease;
    }
    .upf-toggle:hover,
    .upf-toggle:focus-visible {
      background: color-mix(in srgb, var(--upf-pink) 12%, transparent);
      outline: none;
    }
    .upf-switch {
      flex: none; position: relative; width: 42px; height: 24px;
      border-radius: 999px; background: var(--upf-pink); transition: background .16s ease;
    }
    .upf-switch-dot {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
      transition: transform .16s ease;
    }
    .upf-toggle[aria-checked="true"] .upf-switch { background: var(--upf-pink); }
    .upf-toggle[aria-checked="true"] .upf-switch-dot { transform: translateX(18px); }

    /* --- Table view --- */
    .upf-table-wrap { overflow-x: auto; padding-bottom: 2px; }
    .upf-table-wrap[hidden] { display: none; }
    .upf-table {
      width: 100%; min-width: 720px; border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      background: #fff;
    }
    html.dark .upf-table { background: #1A2339; }
    .upf-table thead th {
      padding: 0 0 11px; border-bottom: 1px solid var(--border-strong);
      text-align: left; vertical-align: bottom;
    }
    .upf-table .upf-th-action { width: 1%; white-space: nowrap; }
    .upf-th-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0; margin: 0; border: none; background: none; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-muted);
      transition: color .12s ease;
    }
    .upf-th-btn:hover, .upf-th-btn:focus-visible { color: var(--text); outline: none; }
    .upf-th-arrow {
      display: inline-flex; width: 12px; height: 12px; flex: none;
      opacity: .28; transition: opacity .12s ease, transform .12s ease;
    }
    .upf-th-arrow svg { width: 12px; height: 12px; display: block; }
    .upf-th-btn[data-sort="asc"] .upf-th-arrow { opacity: 1; color: var(--primary); transform: rotate(180deg); }
    .upf-th-btn[data-sort="desc"] .upf-th-arrow { opacity: 1; color: var(--primary); }
    html.dark .upf-th-btn[data-sort] .upf-th-arrow { color: var(--primary-bright, var(--primary)); }
    .upf-th-action .upf-th-label {
      font-size: 11px; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .upf-table tbody td {
      padding: 14px 18px 14px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text); vertical-align: middle;
    }
    .upf-table tbody tr:last-child td { border-bottom: none; }
    .upf-table tbody tr { transition: background .12s ease; }
    .upf-table tbody tr:hover { background: var(--primary-soft); }
    .upf-name { font-weight: 700; color: var(--text); white-space: nowrap; }
    .upf-upc { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-subtle); letter-spacing: .02em; white-space: nowrap; }

    /* --- Status pills (shared by table + cards), themed off WISE tokens --- */
    .upf-pill {
      display: inline-flex; align-items: center;
      padding: 4px 11px; border-radius: var(--radius-pill, 999px);
      font-size: 12px; font-weight: 800; white-space: nowrap; line-height: 1.2;
    }
    .upf-pill--good { background: color-mix(in srgb, var(--sec-green) 15%, transparent); color: var(--sec-green-text); }
    .upf-pill--primary { background: var(--primary-soft); color: var(--primary); }
    html.dark .upf-pill--primary { color: var(--primary-bright, var(--primary)); }
    .upf-pill--warn { background: color-mix(in srgb, var(--ter-amber) 24%, transparent); color: var(--ter-amber-text); }
    .upf-pill--alert { background: color-mix(in srgb, var(--sec-red) 16%, transparent); color: var(--sec-red-text); }

    /* --- Card view --- */
    .upf-cards {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    }
    .upf-cards[hidden] { display: none; }
    .upf-card {
      display: flex; flex-direction: column; gap: 14px;
      padding: 18px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--surface); box-shadow: var(--shadow-1);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .upf-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
    .upf-card-top { display: flex; flex-direction: column; gap: 4px; }
    .upf-card-name { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
    .upf-card-upc { font-family: var(--font-mono); font-size: 12px; color: var(--text-subtle); letter-spacing: .02em; }
    .upf-card-fields { display: flex; flex-direction: column; gap: 10px; }
    .upf-field { display: flex; align-items: center; justify-content: flex-start; gap: 12px; }
    .upf-field-label {
      font-size: 10.5px; font-weight: 800; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .upf-card .dash-mrow-report { align-self: flex-start; margin: -2px 0 0 -4px; }

    @media (prefers-reduced-motion: reduce) {
      .upf-card, .upf-toggle, .upf-switch, .upf-switch-dot, .upf-th-arrow { transition: none; }
    }

    /* =====================================================================
       Ingredient GRAS & Historical Safety (analytics-types.html only).
       A second sortable table built on the exact same shell, controls, pills
       and card view as the Product-Level UPF Classification card above — only
       the columns and data differ. Reuses every .upf-* class; the few rules
       below just let the long "Basis for Classification" prose wrap instead of
       forcing a single line, and top-align the row so the ingredient name and
       status pill sit with the first line of that prose.
    ===================================================================== */
    #gras-class-card { --upf-pink: #ec4899; }
    #gras-class-card .upf-table { min-width: 640px; }
    #gras-class-card .upf-table tbody td { vertical-align: top; }
    #gras-class-card .upf-basis {
      display: block; max-width: 640px;
      font-size: 13px; line-height: 1.55; color: var(--text-subtle); white-space: normal;
    }
    #gras-class-card .upf-card-basis {
      font-size: 13px; line-height: 1.55; color: var(--text-subtle);
    }

    /* =====================================================================
       Ingredient Processing Details (analytics-types.html only).
       Same sortable-table shell as the GRAS card above, with an added numeric
       Processing Score column. Rules below mirror the GRAS prose-wrapping and
       add a tone-coloured score so it reads at a glance.
    ===================================================================== */
    #proc-class-card { --upf-pink: #ec4899; }
    #proc-class-card .upf-table { min-width: 720px; }
    #proc-class-card .upf-table tbody td { vertical-align: top; }
    #proc-class-card .upf-basis {
      display: block; max-width: 560px;
      font-size: 13px; line-height: 1.55; color: var(--text-subtle); white-space: normal;
    }
    #proc-class-card .upf-card-basis {
      font-size: 13px; line-height: 1.55; color: var(--text-subtle);
    }
    #proc-class-card .upf-score { font-weight: 800; font-size: 15px; }
    #proc-class-card .upf-score--warn { color: var(--ter-amber-text); }
    #proc-class-card .upf-score--good { color: var(--sec-green-text); }

    /* =====================================================================
       UPF Processing Spectrum (analytics-types.html only).
       The dashboard's first row: a six-segment scale that frames the whole
       report. The leading segment is the brand-blue "Non-UPF Verified" tier
       (the WISEcode Shield); the remaining five run the WISEcode processing
       ladder from Minimal → Super Ultra, each segment a solid status colour.
       Injected as the first child of .dash by the inline script below.
    ===================================================================== */
    .pscale {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      isolation: isolate;
    }
    .pscale-col {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      gap: 7px; padding: 24px 16px 26px; min-height: 104px; text-align: center;
      color: #fff; background: var(--c, var(--primary));
    }
    .pscale-col > * { position: relative; z-index: 1; }
    /* Thin separators between adjacent segments so the band still reads as a
       connected scale. */
    .pscale-col + .pscale-col { box-shadow: inset 1px 0 0 rgba(255, 255, 255, .18); }
    /* Large, minimal icon disc stamped into the segment's own colour — the same
       debossed treatment as the scorecard stamp marks, adapted to sit tone-on-tone
       over a solid coloured background (translucent white instead of tinted ink). */
    .pscale-ico {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 50%; margin-bottom: 4px;
      border: 1.5px solid rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .96);
      box-shadow:
        inset 0 1px 1px rgba(0, 0, 0, .10),
        inset 0 -1px 0 rgba(255, 255, 255, .35),
        0 1px 0 rgba(0, 0, 0, .06);
    }
    .pscale-ico .material-symbols-outlined {
      font-size: 30px; line-height: 1;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'opsz' 24;
    }
    .pscale-tier {
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 1.0625rem; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em;
    }
    .pscale-cap {
      font-size: 0.6875rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: rgba(255, 255, 255, .82); line-height: 1.25;
    }
    .pscale-desc {
      margin-top: 4px;
      font-size: 0.75rem; font-weight: 400; line-height: 1.42;
      color: rgba(255, 255, 255, .88);
    }
    /* The brand-blue verified tier leads the scale and is visually anchored by
       its shield mark. */
    .pscale-col--verified { background: var(--primary); }

    /* Narrow report columns: let the scale wrap to two rows of three rather
       than crushing six segments into a sliver. */
    @container dash (max-width: 640px) {
      .pscale { grid-template-columns: repeat(3, 1fr); }
    }

    /* =====================================================================
       Product hero (analytics-types.html only). Merges the aha.html welcome
       hero — full-bleed brand banner + circular brand badge — with the product
       identity header from the spec: eyebrow, product name, claim / verified
       pills, a product-image slot, and the UPC/GTIN. Injected as the first
       child of the rendered `.dash`, then pulled full-bleed with the same
       negative margins the shared .dash-hero uses (cancelling the scroll pane's
       28px top / 64px side padding — see .agent-main-scroll).
    ===================================================================== */
    .att-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 28px;
      min-height: 232px;
      margin: -28px -64px 0;
      padding: 28px 56px;
      background: color-mix(in srgb, var(--primary) 78%, #1A2339);
    }
    /* Banner artwork (kept from the aha.html hero) sits behind everything. */
    .att-hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }
    /* Scrim keeps the headline + pills + UPC legible over the banner image. */
    .att-hero-scrim {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(105deg, rgba(7, 12, 26, 0.84) 0%, rgba(7, 12, 26, 0.62) 46%, rgba(7, 12, 26, 0.4) 100%);
    }
    /* Product image slot (left) — a framed, light card holding the SKU shot.
       Distinct from the circular brand badge on the right. It's a button: click
       to upload / paste a product photo (mirrors the hero logo + banner editors). */
    .att-hero-product {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 116px;
      height: 150px;
      padding: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 26px rgba(7, 12, 26, 0.34);
      overflow: hidden;
      color: var(--primary);
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .att-hero-product:hover,
    .att-hero-product:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(7, 12, 26, 0.44);
      outline: none;
    }
    .att-hero-product-ph { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .att-hero-product img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .att-hero-product .material-symbols-outlined { font-size: 30px; opacity: 0.7; }
    .att-hero-product-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; text-align: center; line-height: 1.25;
      color: color-mix(in srgb, var(--primary) 68%, #475569);
    }
    /* "Edit" affordance revealed on hover / focus — same language as the hero
       logo badge in aha.html. */
    .att-hero-product-edit {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      height: 34%;
      background: linear-gradient(180deg, rgba(7, 12, 26, 0) 0%, rgba(7, 12, 26, 0.64) 100%);
      color: #fff; opacity: 0; transition: opacity 0.18s ease;
    }
    .att-hero-product-edit .material-symbols-outlined { font-size: 18px; opacity: 1; margin-bottom: 6px; color: #fff; }
    .att-hero-product:hover .att-hero-product-edit,
    .att-hero-product:focus-visible .att-hero-product-edit { opacity: 1; }
    /* Body (center) — brand line, product name, status pills. */
    .att-hero-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    /* Brand line — the circular brand badge sits inline, prepended to the
       eyebrow brand name. */
    .att-hero-brandline { display: inline-flex; align-items: center; gap: 9px; }
    /* The brand badge is a button: click to upload / paste a logo (mirrors the
       product-image slot and the aha.html hero logo editor). */
    .att-hero-logo {
      position: relative;
      width: 30px; height: 30px; flex-shrink: 0; padding: 0; border: 0;
      border-radius: 50%; overflow: hidden; background: #fff; cursor: pointer;
      box-shadow: 0 2px 8px rgba(7, 12, 26, 0.34), 0 0 0 2px rgba(255, 255, 255, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .att-hero-logo:hover,
    .att-hero-logo:focus-visible {
      transform: scale(1.07);
      outline: none;
      box-shadow: 0 3px 12px rgba(7, 12, 26, 0.44), 0 0 0 2px rgba(255, 255, 255, 0.55);
    }
    .att-hero-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .att-hero-logo-ph {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: var(--primary);
    }
    .att-hero-logo-ph .material-symbols-outlined { font-size: 16px; }
    .att-hero-logo-edit {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(7, 12, 26, 0.52); color: #fff;
      opacity: 0; transition: opacity 0.18s ease;
    }
    .att-hero-logo-edit .material-symbols-outlined { font-size: 14px; }
    .att-hero-logo:hover .att-hero-logo-edit,
    .att-hero-logo:focus-visible .att-hero-logo-edit { opacity: 1; }
    .att-hero-eyebrow {
      font-size: 12px; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: #9DC1FF;
    }
    .att-hero-title {
      margin: 0;
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 2.1rem; font-weight: 800; line-height: 1.05;
      letter-spacing: -0.02em; color: #fff;
    }
    .att-hero-pills { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 2px; }
    .att-hero-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px 6px 9px; border-radius: 999px;
      font-size: 12.5px; font-weight: 700; line-height: 1; white-space: nowrap;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .att-hero-pill .material-symbols-outlined { font-size: 16px; }
    .att-hero-pill sup { font-size: 0.62em; font-weight: 700; }
    .att-hero-pill--claimed {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.94);
    }
    .att-hero-pill--verified {
      background: rgba(99, 132, 255, 0.28);
      border: 1px solid rgba(157, 193, 255, 0.5);
      color: #EAF1FF;
    }
    .att-hero-pill--verified .material-symbols-outlined { color: #9DC1FF; }
    /* Aside (right) — the UPC/GTIN in its own card with a real, scannable
       UPC-A barcode (rendered as SVG) above the human-readable digits. */
    .att-hero-aside { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 16px; }
    .att-hero-upc {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 13px 9px; border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(7, 12, 26, 0.32);
    }
    .att-hero-upc-label {
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.16em;
      text-transform: uppercase; color: #64748B;
    }
    .att-hero-upc-barcode { display: block; width: 168px; height: auto; }
    @media (max-width: 900px) {
      .att-hero { gap: 20px; padding: 26px 40px; }
      .att-hero-title { font-size: 1.75rem; }
    }
    @media (max-width: 767px) {
      .att-hero {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
        min-height: 0;
        margin: -20px -32px 0;
        padding: 22px 28px;
      }
      .att-hero-product { width: 92px; height: 120px; }
      .att-hero-body { flex-basis: 100%; order: 3; }
      .att-hero-aside { align-items: flex-start; gap: 12px; }
    }

    /* =====================================================================
       Report headers (analytics-types.html only). The two portfolio reports
       from the screenshots — the Date Better Snacks GRAS Report and the
       Purely Elizabeth Portfolio Insights Report — rendered as full-bleed
       hero banners. Borrows the aha.html welcome-hero treatment: that hero
       has no default image, so it falls back to a flat primary-blue field
       with an oversized, embossed WISE-bug watermark (see .dash-hero-pattern
       / .dash-hero-bug in dashboard.css). Only the report copy is carried
       over — none of the source prototype's UI chrome (topbar, export
       buttons, report-ID chips). Colours stay within our palette tokens.
    ===================================================================== */
    .rpt-hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 200px;
      /* Vertical spacing is handled by the .dash flex `gap`; the negative
         side margins break the banner full-bleed out of the scroll padding,
         matching .att-hero. */
      margin: 0 -64px;
      padding: 30px 64px 28px;
      background: color-mix(in srgb, var(--primary) 78%, #1A2339);
    }
    .rpt-hero-pattern {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }
    /* A single oversized WISE bug, tilted and pulled mostly into the banner
       with only a sliver bleeding off the right edge (mirrors .dash-hero-bug). */
    .rpt-hero-bug {
      position: absolute;
      top: 50%;
      right: 0;
      width: min(1280px, 130%);
      height: auto;
      color: color-mix(in srgb, #0B1426 38%, var(--primary));
      filter: drop-shadow(0 1.5px 0 rgba(255, 255, 255, 0.14));
      transform: translate(calc(14% + 120px), calc(-50% + 40px)) rotate(-18deg);
    }
    .rpt-hero-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      /* Leave room for the circular brand badge floated to the right. */
      padding-right: 168px;
    }
    /* Brand logo — a circular badge floated to the right and vertically
       centered, sitting on top of the watermark (mirrors .dash-hero-logo in
       dashboard.css). Static here (no editor) since these are report banners. */
    .rpt-hero-logo {
      position: absolute;
      top: 50%;
      right: 56px;
      transform: translateY(-50%);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 28px rgba(7, 12, 26, 0.34), 0 0 0 5px rgba(255, 255, 255, 0.16);
    }
    .rpt-hero-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    /* Initials fallback when a brand has no logo asset. */
    .rpt-hero-logo-monogram {
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--primary);
    }
    .rpt-hero-eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9DC1FF;
    }
    .rpt-hero-title {
      margin: 0;
      font-family: 'WISE Digits', var(--font-serif);
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .rpt-hero-tagline {
      margin: 1px 0 0;
      font-family: 'WISE Digits', var(--font-serif);
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.86);
    }
    .rpt-hero-meta {
      margin: 5px 0 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.78);
    }
    .rpt-hero-badge {
      margin-top: 9px;
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #EAF1FF;
      background: rgba(99, 132, 255, 0.28);
      border: 1px solid rgba(157, 193, 255, 0.5);
    }
    @media (max-width: 900px) {
      .rpt-hero { min-height: 0; padding: 26px 40px; }
      .rpt-hero-title { font-size: 1.75rem; }
      .rpt-hero-logo { width: 96px; height: 96px; right: 32px; }
      .rpt-hero-logo-monogram { font-size: 2rem; }
      .rpt-hero-body { padding-right: 132px; }
    }
    @media (max-width: 767px) {
      .rpt-hero { margin: 0 -32px; padding: 22px 28px; }
      .rpt-hero-logo { right: 24px; }
    }
    @media (max-width: 520px) {
      .rpt-hero-logo { display: none; }
      .rpt-hero-body { padding-right: 0; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>

                  t(quiet + 71, code.slice(6, 11)) + t(quiet + 95 + 4.5, code[11]);
        return '<svg class="att-hero-upc-barcode" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
               'aria-label="UPC ' + code + '" xmlns="http://www.w3.org/2000/svg">' +
               '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>' + rects + txt + '</svg>';
      }

      /* --- Editable images: the product slot AND the circular brand logo are
         both click-to-edit, mirroring the hero logo / banner editors in
         aha.html. Each persists its choice in localStorage so it survives
         reloads + dashboard re-renders. --- */
      function escAttr(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function cssUrl(u) { return "url('" + String(u).replace(/'/g, '%27') + "')"; }

      /* Product image store — defaults to the bundled Cashew Lime Crisp shot;
         '__none__' → removed (shows the "Add Product Image" placeholder). */
      var PROD_KEY = 'att-product-image', PROD_NONE = '__none__';
      var DEFAULT_PRODUCT = '../assets/date-better-cashew-lime-crisp.png';
      function getProductImage() {
        var v;
        try { v = localStorage.getItem(PROD_KEY) || ''; } catch (_) { v = ''; }
        if (v === PROD_NONE) return '';
        return v || DEFAULT_PRODUCT;
      }
      function setProductImage(url) {
        try { localStorage.setItem(PROD_KEY, url || PROD_NONE); } catch (_) { /* quota */ }
      }
      function productInner(url) {
        var body = url
          ? '<img src="' + escAttr(url) + '" alt="Cashew Lime Crisp product image" />'
          : '<span class="att-hero-product-ph"><span class="material-symbols-outlined">add_photo_alternate</span><span class="att-hero-product-label">Add Product Image</span></span>';
        return body + '<span class="att-hero-product-edit" aria-hidden="true"><span class="material-symbols-outlined">edit</span></span>';
      }
      function applyProductImage(url) {
        var btn = document.getElementById('att-hero-product');
        if (btn) btn.innerHTML = productInner(url);
      }

      /* Brand logo store — mirrors dashboard-home.js and reuses the same
         'wise-brand-logo' key so the badge stays in sync with the shared
         dashboard: unset → bundled default Date Better badge, '__none__' →
         removed (shows an "add logo" affordance). */
      var LOGO_KEY = 'wise-brand-logo', LOGO_NONE = '__none__';
      function getBrandLogo() {
        var v;
        try { v = localStorage.getItem(LOGO_KEY) || ''; } catch (_) { v = ''; }
        if (v === LOGO_NONE) return '';
        return v || LOGO;
      }
      function setBrandLogo(url) {
        try { localStorage.setItem(LOGO_KEY, url || LOGO_NONE); } catch (_) { /* quota */ }
      }

      /* One-time prefill: clear any stale values left from earlier testing so
         both the brand logo and the product image show their bundled defaults
         out of the box. Future uploads / removals persist normally. */
      (function prefillDefaultsOnce() {
        var FLAG = 'att-hero-prefill-v1';
        try {
          if (localStorage.getItem(FLAG)) return;
          localStorage.removeItem(PROD_KEY);
          localStorage.removeItem(LOGO_KEY);
          localStorage.setItem(FLAG, '1');
        } catch (_) { /* storage unavailable — defaults already apply */ }
      })();
      function logoInner(url) {
        var body = url
          ? '<img src="' + escAttr(url) + '" alt="Date Better Snacks logo" />'
          : '<span class="att-hero-logo-ph"><span class="material-symbols-outlined">add_photo_alternate</span></span>';
        return body + '<span class="att-hero-logo-edit" aria-hidden="true"><span class="material-symbols-outlined">edit</span></span>';
      }
      function applyBrandLogo(url) {
        var btn = document.getElementById('att-hero-logo');
        if (btn) btn.innerHTML = logoInner(url);
      }

      /* Image editor — same shared overlay as the Overview banner / logo
         pickers. Parameterised so the same panel serves the product image
         and the brand logo. */
      var imageModalClose = null;
      function closeImageModal() {
        if (imageModalClose) imageModalClose();
        else if (typeof window.WiseCloseModal === 'function') window.WiseCloseModal('att-image-modal');
        imageModalClose = null;
      }

      function openImageModal(cfg) {
        var openModal = window.WiseOpenModal;
        var modalHTML = window.WiseModalHTML;
        var modalFoot = window.WiseModalFoot;
        if (!openModal || !modalHTML || !modalFoot) return;
        var current = cfg.getCurrent();
        var draft = current;
        var opened = openModal({
          id: 'att-image-modal',
          persistent: true,
          html: modalHTML({
            eyebrow: escAttr(cfg.eyebrow),
            title: escAttr(cfg.title),
            titleId: 'att-image-title',
            closeAttrs: 'data-img-close data-wise-modal-close',
            body:
              '<div class="dash-banner-preview' + (cfg.previewMod ? ' ' + cfg.previewMod : '') + '">' +
                '<div class="dash-banner-preview-img" id="att-img-preview-img"></div>' +
                '<span class="dash-banner-preview-empty" id="att-img-preview-empty"><span class="material-symbols-outlined">image</span>' + escAttr(cfg.emptyLabel) + '</span>' +
              '</div>' +
              '<label class="dash-banner-drop" id="att-img-drop">' +
                '<input type="file" accept="image/*" id="att-img-file" hidden>' +
                '<span class="material-symbols-outlined">cloud_upload</span>' +
                '<span class="dash-banner-drop-text"><strong>Upload an image</strong> or drag &amp; drop<br><span class="dash-banner-drop-hint">' + escAttr(cfg.dropHint) + '</span></span>' +

              '<div class="dash-banner-or"><span>or paste a URL</span></div>' +
              '<input type="url" class="dash-banner-url" id="att-img-url" placeholder="' + escAttr(cfg.urlPlaceholder) + '" autocomplete="off">',
            foot: modalFoot({
              left: '<button class="wise-btn wise-btn--ghost" type="button" data-img-remove><span class="material-symbols-outlined">delete</span>Remove</button>',
              actions:
                '<button class="wise-btn wise-btn--ghost" type="button" data-img-close>Cancel</button>' +
                '<button class="wise-btn wise-btn--primary" type="button" data-img-save><span class="material-symbols-outlined">check</span>' + escAttr(cfg.saveLabel) + '</button>',
            }),
          }),
        });
        var modal = opened.modal;
        imageModalClose = opened.close;
        if (!modal) return;
        modal.setAttribute('aria-label', cfg.title);

        var previewImg = modal.querySelector('#att-img-preview-img');
        var previewEmpty = modal.querySelector('#att-img-preview-empty');
        var urlInput = modal.querySelector('#att-img-url');
        var fileInput = modal.querySelector('#att-img-file');
        var drop = modal.querySelector('#att-img-drop');

        function setPreview(val) {
          draft = val || '';
          if (draft) {
            previewImg.style.backgroundImage = cssUrl(draft);
            previewImg.style.display = 'block';
            previewEmpty.style.display = 'none';
          } else {
            previewImg.style.backgroundImage = '';
            previewImg.style.display = 'none';
            previewEmpty.style.display = '';
          }
        }
        setPreview(current);
        if (current && /^https?:/i.test(current)) urlInput.value = current;

        urlInput.addEventListener('input', function () { setPreview(urlInput.value.trim()); });

        function readFile(file) {
          if (!file || !file.type.startsWith('image/')) return;
          var reader = new FileReader();
          reader.onload = function () { urlInput.value = ''; setPreview(reader.result); };
          reader.readAsDataURL(file);
        }
        fileInput.addEventListener('change', function () { readFile(fileInput.files[0]); });
        ['dragover', 'dragenter'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-drag'); }); });
        ['dragleave', 'dragend'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove('is-drag'); }); });
        drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('is-drag'); readFile(e.dataTransfer.files[0]); });

        modal.querySelector('[data-img-remove]').addEventListener('click', function () { urlInput.value = ''; setPreview(''); });
        modal.querySelector('[data-img-save]').addEventListener('click', function () {
          cfg.onSave(draft);
          closeImageModal();
        });
        modal.querySelectorAll('[data-img-close]').forEach(function (b) { b.addEventListener('click', closeImageModal); });
      }

      function openProductModal() {
        openImageModal({
          eyebrow: 'Product image',
          title: 'Update product image',
          emptyLabel: 'No product image yet',
          dropHint: 'PNG, JPG or WEBP — product shots look best',
          urlPlaceholder: 'https://…/product.jpg',
          saveLabel: 'Save image',
          getCurrent: getProductImage,
          onSave: function (url) { setProductImage(url); applyProductImage(url); },

      function openLogoModal() {
        openImageModal({
          eyebrow: 'Brand logo',
          title: 'Update brand logo',
          emptyLabel: 'No logo yet',

          urlPlaceholder: 'https://…/logo.png',
