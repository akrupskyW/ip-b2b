<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Non-UPF Dashboard</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Match the Product Portfolio module's headline + button sizing so the
       Non-UPF dashboard header reads at the same scale. Scoped to this page so
       the shared adm-* set stays untouched on other admin surfaces. */
    [data-nav-id="non-upf-dashboard"] .adm-title {
      font-size: 1.2rem;
      line-height: 1.15;
      letter-spacing: normal;
    }
    /* ── Status chips match Product Portfolio `.pf-chip` ─────────────────
       Shared `.adm-chip` is a larger pill (0.72rem, 3×10 padding, 5px gap).
       Score-card chips also wrap to the card width (`white-space: normal` +
       `max-width: 100%`), so they read as fat buttons instead of compact
       labels. Size score-card and table chips to the portfolio table chips
       so both surfaces match. */
    [data-nav-id="non-upf-dashboard"] .adm-chip {
      gap: 1px;
      padding: 2px 9px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1.5;
    }
    [data-nav-id="non-upf-dashboard"] .adm-chip .material-symbols-outlined {
      font-size: 13px !important;
      line-height: 1 !important;
      width: 14px; height: 14px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    [data-nav-id="non-upf-dashboard"] .adm-vf-stat-chipwrap { min-height: 0; }
    [data-nav-id="non-upf-dashboard"] .adm-vf-stat .adm-chip {
      width: max-content;
      max-width: 100%;
      white-space: normal;
      text-align: center;
      justify-content: center;
      line-height: 1.5;
    }

    /* ── Row actions "⋮" — mirror Product Portfolio's .pf-rowmenu-btn ──────
       The shared .adm-icon-btn is a bordered, filled 34px circle; the portfolio
       uses a bare, transparent 30px button with only a subtle hover fill. Match
       it here so the three-dot trigger reads identically across both surfaces. */
    [data-nav-id="non-upf-dashboard"] .nud-actions { justify-content: center; }
    [data-nav-id="non-upf-dashboard"] .nud-rowmenu-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid transparent; background: transparent; color: var(--text-subtle);
    }
    [data-nav-id="non-upf-dashboard"] .nud-rowmenu-btn:hover {
      border-color: transparent; background: var(--surface-2); color: var(--text);
    }
    html.dark [data-nav-id="non-upf-dashboard"] .nud-rowmenu-btn { background: transparent; }
    html.dark [data-nav-id="non-upf-dashboard"] .nud-rowmenu-btn:hover { background: rgba(255,255,255,0.06); }
    [data-nav-id="non-upf-dashboard"] .nud-rowmenu-btn .material-symbols-outlined { font-size: 18px; }

    /* ── Product name wraps instead of truncating ─────────────────────────
       The shared .adm-idcell-name is nowrap + ellipsis, which clipped long
       product names. Let the name wrap onto multiple lines within its column
       so it never spills into (or is cut short by) the neighbouring columns. */
    [data-nav-id="non-upf-dashboard"] .adm-idcell-name {
      white-space: normal; overflow: visible; text-overflow: clip;
      line-height: 1.3; overflow-wrap: anywhere;
    }

    /* ── Updated column matches the other columns' visual weight ───────────
       Drop the one-off inline font styling so the date reads at the same size
       and weight as the product name / status text, with the time as a sub. */
    [data-nav-id="non-upf-dashboard"] .nud-updated-date {
      font-size: 0.86rem; font-weight: 700; color: var(--text); line-height: 1.3;
    }

    /* ── Product table: rows by default, cards only on mobile ─────────────
       The shared adm table collapses to stacked cards at a 720px container
       width, which fires too eagerly when this dashboard is docked beside the
       chat. Here we keep the row layout and let it scroll horizontally when the
       container is too narrow for every column; the card layout is opt-in via
       the toolbar toggle (.adm-table--cards), or forced on true mobile. All
       rules are scoped to this page so the other admin tables are untouched. */
    [data-nav-id="non-upf-dashboard"] .adm-table-card { overflow-x: auto; }
    /* 88 + 220 + 150 + 190 + 160 columns + 4×12 gaps + 24 row padding = 880px:
       the row's intrinsic minimum, so columns stay aligned as it scrolls. */
    [data-nav-id="non-upf-dashboard"] .adm-table { min-width: 880px; }
    [data-nav-id="non-upf-dashboard"] .adm-table--cards { min-width: 0; }

    /* Neutralise the global 720px auto-collapse on this page — the attribute
       prefix raises specificity so these win over the shared container query.
       Gated above mobile so the true-mobile block below can still force cards. */
    @media (min-width: 641px) {
      @container adm (max-width: 720px) {
        [data-nav-id="non-upf-dashboard"] .adm-table:not(.adm-table--cards) .adm-thead { display: grid; }
        [data-nav-id="non-upf-dashboard"] .adm-table:not(.adm-table--cards) .adm-trow { grid-template-columns: var(--adm-cols) !important; gap: 12px; padding: 12px 12px; position: static; }
        [data-nav-id="non-upf-dashboard"] .adm-table:not(.adm-table--cards) .adm-td--num { justify-content: center; text-align: center; }
        [data-nav-id="non-upf-dashboard"] .adm-table:not(.adm-table--cards) .adm-trow .adm-td--end { position: static; top: auto; right: auto; padding: 0; }
      }
    }

    /* Cards view (manual toggle). */
    [data-nav-id="non-upf-dashboard"] .adm-table--cards .adm-thead { display: none; }
    [data-nav-id="non-upf-dashboard"] .adm-table--cards .adm-trow { grid-template-columns: 1fr !important; gap: 6px; position: relative; padding: 14px 12px; }
    [data-nav-id="non-upf-dashboard"] .adm-table--cards .adm-actions { justify-content: flex-start; }
    [data-nav-id="non-upf-dashboard"] .adm-table--cards .adm-td--num { justify-content: flex-start; text-align: left; }
    [data-nav-id="non-upf-dashboard"] .adm-table--cards .adm-trow .adm-td--end { position: absolute; top: 10px; right: 10px; padding: 0; }

    /* Page ⋮ — invoices, export, and row/card live in the header (see
       openPageMenu). Reuses .nud-rowmenu-btn (bare 30px circle); it grows a
       subtle "active" tint while its menu is open. */
    [data-nav-id="non-upf-dashboard"] .nud-page-menu-btn { flex: 0 0 auto; }
    [data-nav-id="non-upf-dashboard"] .nud-page-menu-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
    html.dark [data-nav-id="non-upf-dashboard"] .nud-page-menu-btn[aria-expanded="true"] { background: rgba(255,255,255,0.06); }

    /* Row / Card items inside the ⋮ menu: label fills the row, a trailing check
       marks the active layout in the brand colour. */
    .nud-view-item .nud-view-item-label { flex: 1 1 auto; }
    .nud-view-item .nud-view-item-check { font-size: 17px; color: var(--primary); }
    html.dark .nud-view-item .nud-view-item-check { color: var(--primary-bright, #93C5FD); }
    .nud-view-item.is-active { color: var(--primary); }
    html.dark .nud-view-item.is-active { color: var(--primary-bright, #93C5FD); }
    .nud-view-item.is-active .material-symbols-outlined { color: inherit; }

    /* True mobile — cards are the only sensible layout, so force them and hide
       the row/card items in the page menu. Invoices and export stay. */
    @media (max-width: 640px) {
      [data-nav-id="non-upf-dashboard"] .adm-table { min-width: 0; }
      [data-nav-id="non-upf-dashboard"] .adm-thead { display: none; }
      [data-nav-id="non-upf-dashboard"] .adm-trow { grid-template-columns: 1fr !important; gap: 6px; position: relative; padding: 14px 12px; }
      [data-nav-id="non-upf-dashboard"] .adm-actions { justify-content: flex-start; }
      [data-nav-id="non-upf-dashboard"] .adm-td--num { justify-content: flex-start; text-align: left; }
      [data-nav-id="non-upf-dashboard"] .adm-trow .adm-td--end { position: absolute; top: 10px; right: 10px; padding: 0; }
      .nud-view-item, .nud-view-sep { display: none; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="non-upf-dashboard" data-adm-page data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
