<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Preferences</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Preferences — settings surface rendered by js/preferences-flow.js. */
    body[data-nav-id="preferences"] #agent-main-header { display: none; }
    body[data-nav-id="preferences"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="preferences"] #modules-row { margin-top: 0; }

    .prefs-wrap { padding: 26px 40px 56px; max-width: 860px; }
    .prefs-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; }
    .prefs-breadcrumb .material-symbols-outlined { font-size: 16px; opacity: 0.6; }
    .prefs-breadcrumb-here { color: var(--text); }
    .prefs-title { font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif); font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
    .prefs-lede { font-size: 0.9rem; color: var(--text-muted); margin: 8px 0 26px; max-width: 62ch; }

    .prefs-group { margin-bottom: 30px; }
    .prefs-group-title { display: flex; align-items: center; gap: 9px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
    .prefs-group-title .material-symbols-outlined { font-size: 19px; color: var(--primary-ink, var(--primary)); }

    .prefs-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 14px); box-shadow: var(--shadow-1); overflow: hidden; }
    .prefs-row { display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-top: 1px solid var(--border); }
    .prefs-row:first-child { border-top: 0; }
    .prefs-row-body { flex: 1; min-width: 0; }
    .prefs-row-label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .prefs-row-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; }

    /* Switch */
    .prefs-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; border: 0; border-radius: 999px; cursor: pointer; background: var(--border-strong); transition: background 0.2s ease; padding: 0; }
    .prefs-switch.is-on { background: var(--primary); }
    .prefs-knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform 0.2s ease; }
    .prefs-switch.is-on .prefs-knob { transform: translateX(20px); }

    /* Segmented */
    .prefs-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; flex-shrink: 0; }
    html.dark .prefs-seg { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .prefs-seg-btn { border: 0; border-radius: 999px; padding: 6px 14px; height: 30px; cursor: pointer; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.78rem; font-weight: 600; transition: background 0.2s ease, color 0.2s ease; }
    .prefs-seg-btn:hover:not(.is-active) { color: var(--text); }
    .prefs-seg-btn.is-active { background: var(--primary); color: #fff; }

    /* Stepper */
    .prefs-stepper { display: inline-flex; gap: 6px; flex-shrink: 0; }
    .prefs-step { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    html.dark .prefs-step { background: rgba(255,255,255,0.05); }
    .prefs-step:hover { border-color: var(--primary); color: var(--primary-ink, var(--primary)); }
    .prefs-step .material-symbols-outlined { font-size: 18px; }

    /* Select */
    .prefs-select { height: 38px; padding: 0 34px 0 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 0.84rem; cursor: pointer; flex-shrink: 0; }
    html.dark .prefs-select { background: rgba(255,255,255,0.05); }

    /* Toast */
    #prefs-toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .prefs-toast { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-3); opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .prefs-toast.is-in { opacity: 1; transform: none; }
    .prefs-toast .material-symbols-outlined { font-size: 17px; }

    @media (max-width: 720px) {
      .prefs-wrap { padding: 20px 20px 48px; }
      .prefs-row { flex-wrap: wrap; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="preferences" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
</body>
</html>
