<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Alerts</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Alerts inbox — rendered by js/alerts-flow.js. */
    body[data-nav-id="alerts"] #agent-main-header { display: none; }
    body[data-nav-id="alerts"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="alerts"] #modules-row { margin-top: 0; }

    .al-wrap { padding: 26px 40px 56px; max-width: 860px; }
    .al-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; }
    .al-breadcrumb .material-symbols-outlined { font-size: 16px; opacity: 0.6; }
    .al-breadcrumb-here { color: var(--text); }
    .al-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .al-title { font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif); font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
    .al-lede { font-size: 0.9rem; color: var(--text-muted); margin: 8px 0 0; }

    .al-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 20px; }
    .al-filter { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; height: 34px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease; }
    .al-filter:hover:not(.is-active) { color: var(--text); border-color: var(--border-strong); }
    .al-filter.is-active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .al-filter-count { font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-subtle); }
    html.dark .al-filter-count { background: rgba(255,255,255,0.08); }
    .al-filter.is-active .al-filter-count { background: rgba(255,255,255,0.24); color: #fff; }

    .al-group { margin-bottom: 26px; }
    .al-group-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 10px; }
    .al-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 14px); box-shadow: var(--shadow-1); overflow: hidden; }
    .al-item { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-top: 1px solid var(--border); cursor: pointer; transition: background 0.15s ease; position: relative; }
    .al-item:first-child { border-top: 0; }
    .al-item:hover { background: var(--surface-2); }
    html.dark .al-item:hover { background: rgba(255,255,255,0.04); }
    .al-item.is-unread { background: color-mix(in srgb, var(--primary) 5%, transparent); }
    .al-item-ic { width: 40px; height: 40px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--ic, var(--primary)); background: color-mix(in srgb, var(--ic, var(--primary)) 14%, transparent); }
    .al-item-ic .material-symbols-outlined { font-size: 21px; }
    .al-item-body { flex: 1; min-width: 0; }
    .al-item-title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .al-item.is-unread .al-item-title { font-weight: 700; }
    .al-item-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }
    .al-unread-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .al-item-x { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--text-subtle); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s ease, background 0.15s ease; flex-shrink: 0; }
    .al-item:hover .al-item-x { opacity: 1; }
    .al-item-x:hover { background: var(--surface-3, var(--surface-2)); color: var(--text); }
    .al-item-x .material-symbols-outlined { font-size: 17px; }

    /* Buttons */
    .al-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid transparent; font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease; }
    .al-btn .material-symbols-outlined { font-size: 18px; }
    .al-btn--ghost { background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
    .al-btn--ghost:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
    html.dark .al-btn--ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
    .al-btn:disabled { opacity: 0.45; cursor: default; }

    .al-empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 20px; color: var(--text-muted); font-size: 0.9rem; text-align: center; }
    .al-empty .material-symbols-outlined { font-size: 44px; color: var(--text-subtle); }

    #al-toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .al-toast { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-3); opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .al-toast.is-in { opacity: 1; transform: none; }
    .al-toast .material-symbols-outlined { font-size: 17px; }

    @media (max-width: 720px) {
      .al-wrap { padding: 20px 20px 48px; }
    }
  </style>
</head>
<body data-nav-id="alerts" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
