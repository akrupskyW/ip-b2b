<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — WISEcode Intelligence</title>
  <script>
    try { if (localStorage.getItem('wise-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); }
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <script src="../js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-brand">

1.5913C109.804 80.6013 118.311 85.7609 128.784 85.7609C144.626 85.7608 159.473 72.7999 159.473 54.6695C159.473 48.2288 158.231 40.1469 153.481 35.9523H120.94ZM129.254 44.5345C134.349 44.5345 138.48 48.6005 138.48 54.0781C138.48 59.5557 134.349 63.6217 129.254 63.6217C124.158 63.6216 120.027 59.5556 120.027 54.0781C120.027 48.6005 124.158 44.5346 129.254 44.5345Z"/></svg></span>
        <span class="auth-brand-word">WISE<b>code</b></span>
      </div>

      <h1 id="auth-title" class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your WISEcode account</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email">Email address <span class="req">*</span></label>
          <input type="email" id="email" name="email" class="auth-input" autocomplete="email" placeholder="you@company.com" required />
        </div>
        <div class="auth-field">
          <label for="password">Password <span class="req">*</span></label>
          <div class="auth-input-affix">
            <input type="password" id="password" name="password" class="auth-input" autocomplete="current-password" placeholder="Your password" required />
            <button type="button" class="auth-affix-btn" data-toggle-pw aria-label="Show password"><span class="material-icons">visibility</span></button>
          </div>
        </div>
        <div class="auth-row">
          <label class="auth-check"><input type="checkbox" id="remember" checked /><span>Remember me</span></label>
          <a class="auth-link" href="forgot-password.html">Forgot password?</a>
        </div>
        <p class="auth-banner auth-banner--error" id="login-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block"><span class="material-icons">login</span>Sign in</button>
      </form>

      <button type="button" class="btn btn-ghost btn-block" id="demo-btn" style="margin-top:10px"><span class="material-icons">bolt</span>Use demo account</button>

      <div class="auth-divider"><span>or continue with</span></div>
      <div class="auth-sso">
        <button type="button" class="btn btn-secondary" data-sso="Google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" class="btn btn-secondary" data-sso="Microsoft">
          <svg viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
          Microsoft
        </button>
        <button type="button" class="btn btn-secondary" data-sso="LinkedIn">
          <svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </button>
      </div>

      <p class="auth-foot">Don't have an account? <a class="auth-link" href="create-account.html">Create account</a></p>

      <div class="auth-demo">
        <span class="material-icons">info</span>
        <div>
          <div class="auth-demo-title">Demo access</div>
          <div class="auth-demo-body">Explore instantly with <code>demo@wisealliance.com</code> / <code>demo123</code> — or tap “Use demo account”.</div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/auth-forms.js"></script>
  <script>WiseAuthForms.initLogin();</script>
</body>
</html>
