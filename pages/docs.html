<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Docs</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Docs browser — rendered by js/docs-flow.js. */
    body[data-nav-id="docs"] #agent-main-header { display: none; }
    body[data-nav-id="docs"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="docs"] #modules-row { margin-top: 0; }

    .dc-wrap { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 0; min-height: 100%; }
    .dc-sidebar { border-right: 1px solid var(--border); padding: 24px 16px 40px; }
    .dc-side-title { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; color: var(--text); margin-bottom: 18px; }
    .dc-side-title .material-symbols-outlined { font-size: 18px; color: var(--primary-ink, var(--primary)); }
    .dc-side-group { margin-bottom: 18px; }
    .dc-side-group-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); margin: 0 8px 6px; }
    .dc-side-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.84rem; font-weight: 500; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
    .dc-side-item:hover { background: var(--surface-2); color: var(--text); }
    html.dark .dc-side-item:hover { background: rgba(255,255,255,0.05); }
    .dc-side-item.is-active { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary-ink, var(--primary)); font-weight: 700; }
    .dc-side-read { font-size: 0.68rem; color: var(--text-subtle); font-weight: 500; }
    .dc-side-item.is-active .dc-side-read { color: var(--primary-ink, var(--primary)); }

    .dc-article { padding: 30px 44px 60px; max-width: 760px; }
    .dc-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; }
    .dc-breadcrumb .material-symbols-outlined { font-size: 16px; opacity: 0.6; }
    .dc-breadcrumb-here { color: var(--text); }
    .dc-article-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 2rem; font-weight: 800; color: var(--text); margin: 0 0 20px; letter-spacing: -0.01em; }
    .dc-article-body { font-size: 0.92rem; line-height: 1.7; color: var(--text); }
    .dc-article-body p { margin: 0 0 16px; color: var(--text-muted); }
    .dc-article-body h3 { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 1.15rem; font-weight: 700; color: var(--text); margin: 26px 0 10px; }
    .dc-article-body ul { margin: 0 0 16px; padding-left: 22px; color: var(--text-muted); }
    .dc-article-body li { margin-bottom: 6px; }
    .dc-article-body code { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--text); }
    html.dark .dc-article-body code { background: rgba(255,255,255,0.06); }
    .dc-pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 0 0 18px; }
    html.dark .dc-pre { background: rgba(0,0,0,0.28); }
    .dc-pre code { background: none; border: 0; padding: 0; font-size: 0.82rem; line-height: 1.6; color: var(--text); white-space: pre; }
    .dc-callout { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--primary) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); font-size: 0.85rem; color: var(--text); margin: 0 0 18px; }
    .dc-callout .material-symbols-outlined { color: var(--primary-ink, var(--primary)); font-size: 20px; }
    .dc-log { display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-muted); }
    .dc-log:first-child { border-top: 0; }
    .dc-log-date { flex-shrink: 0; width: 74px; font-weight: 700; color: var(--text-subtle); font-size: 0.78rem; padding-top: 1px; }
    .dc-log strong { color: var(--text); }

    @media (max-width: 820px) {
      .dc-wrap { grid-template-columns: 1fr; }
      .dc-sidebar { border-right: 0; border-bottom: 1px solid var(--border); }
      .dc-article { padding: 24px 20px 48px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="docs" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
</body>
</html>
