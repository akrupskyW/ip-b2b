<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Docs</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Docs module — rendered by js/docs-flow.js. Built on the canonical `wmod-`
       module (search + scorecards) with a conversation-library-style card grid,
       plus an in-module article reader. */
    body[data-nav-id="docs"] #agent-main-header { display: none; }
    body[data-nav-id="docs"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="docs"] #modules-row { margin-top: 0; }
    body[data-nav-id="docs"] .wmod-wrap { max-width: 1080px; }

    /* Card grid — mirrors the conversation-library shelf. */
    .dc-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-top: 18px; }
    .dc-card { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 18px; border-radius: 16px; cursor: pointer; text-decoration: none; color: inherit; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-1); font-family: inherit; transition: transform 0.18s cubic-bezier(.2,.7,.3,1), box-shadow 0.18s ease, border-color 0.18s ease; }
    .dc-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--primary) 32%, var(--border)); }
    .dc-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .dc-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .dc-card-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.625rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--primary-ink, var(--primary)); }
    html.dark .dc-card-badge { color: var(--primary-bright, #93C5FD); }
    .dc-card-badge .material-symbols-outlined { font-size: 15px; }
    .dc-card-read { font-size: 0.72rem; color: var(--text-subtle); font-weight: 600; }
    .dc-card-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 1.05rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .dc-card-excerpt { font-size: 0.82rem; line-height: 1.5; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* In-module article reader. */
    .dc-reader { max-width: 760px; margin-top: 8px; }
    .dc-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; border: 0; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer; padding: 6px 10px 6px 6px; border-radius: 999px; }
    .dc-back:hover { background: var(--surface-2); color: var(--text); }
    html.dark .dc-back:hover { background: rgba(255,255,255,0.05); }
    .dc-back .material-symbols-outlined { font-size: 18px; }
    .dc-article-eyebrow { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--primary-ink, var(--primary)); margin-bottom: 8px; }
    html.dark .dc-article-eyebrow { color: var(--primary-bright, #93C5FD); }
    .dc-article-eyebrow .material-symbols-outlined { font-size: 15px; }
    .dc-article-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 2rem; font-weight: 800; color: var(--text); margin: 0 0 20px; letter-spacing: -0.01em; }
    .dc-article-body { font-size: 0.92rem; line-height: 1.7; color: var(--text); }
    .dc-article-body p { margin: 0 0 16px; color: var(--text-muted); }
    .dc-article-body h3 { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 1.15rem; font-weight: 700; color: var(--text); margin: 26px 0 10px; }
    .dc-article-body ul { margin: 0 0 16px; padding-left: 22px; color: var(--text-muted); }
    .dc-article-body li { margin-bottom: 6px; }
    .dc-article-body code { font-size: 0.85em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--text); }
    html.dark .dc-article-body code { background: rgba(255,255,255,0.06); }
    .dc-pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 0 0 18px; }
    html.dark .dc-pre { background: rgba(0,0,0,0.28); }
    .dc-pre code { background: none; border: 0; padding: 0; font-size: 0.82rem; line-height: 1.6; color: var(--text); white-space: pre; }
    .dc-callout { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--primary) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); font-size: 0.85rem; color: var(--text); margin: 0 0 18px; }
    .dc-callout .material-symbols-outlined { color: var(--primary-ink, var(--primary)); font-size: 20px; }
    .dc-log { display: flex; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-muted); }
    .dc-log:first-child { border-top: 0; }
    .dc-log-date { flex-shrink: 0; width: 74px; font-weight: 700; color: var(--text-subtle); font-size: 0.78rem; padding-top: 1px; }
    .dc-log strong { color: var(--text); }

    @media (max-width: 760px) {
      body[data-nav-id="docs"] .wmod-wrap { padding: 20px 20px 48px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="docs" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
