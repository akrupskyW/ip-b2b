<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Helix</title>
  <meta name="description" content="Tune the chat Helix in a dedicated playground, then apply the look to every WISEcodeAI chat." />
  <script src="../js/auth-guard.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/text-size-fouc.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* ═══════════ Helix studio — chat fills the modules row, like wiseai welcome ═══════════
       Canonical nav / shell / chat card from wiseai.html. No result panes. The
       Helix control card pops out on load so every slider is already in the
       draggable popover. Apply publishes the draft to every other chat. */

    :root {
      --sec-green-10: rgba(50, 169, 102, 0.12);
      --sec-red-10: rgba(220, 48, 56, 0.12);
      --ter-amber-10: rgba(255, 196, 52, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--modules-bottom-pad, 12px);
      font-family: 'WISE Digits', 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #chat-shell-wrap { flex: 1 1 0%; min-height: 0; width: 100%; overflow: visible; }
    #chat-shell-wrap.menu-brand-integrated #modules-row {
      grid-area: modules;
      display: flex;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      margin-top: 0;
      padding: 0 2px;
    }

    #chat-shell-wrap #menu-panel:not(.mp-pivot) .menu-brand-bar { min-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-bar { height: var(--panel-header-h); min-height: var(--panel-header-h); max-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo,
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo a { height: 100%; display: flex; align-items: center; justify-content: center; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo svg.tl-bug { transform: translateY(16px); }

    .wa-chat {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      width: auto;
      min-width: 380px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transform-origin: left center;
      animation: panelBounceLeft 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s backwards;
    }

    .sc-reply-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px 42px; }
    .sc-reply-chips .chip { text-align: left; max-width: 100%; }
    @media (max-width: 720px) { .sc-reply-chips { margin-left: 0; } }
    html.header-float .wa-chat .chat-topbar { z-index: 12 !important; }
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: var(--bg);
    }
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: #1A2339;
    }
    html.chat-tint:not(.dark).header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.chat-tint:not(.dark).header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary) 5%, #fff);
    }
    html.dark.chat-tint.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.chat-tint.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339);
    }
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn:hover,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn:hover { background: var(--surface-3); }
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn.is-open,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn.is-on { background: color-mix(in srgb, var(--primary) 16%, var(--surface-2)); }

    /* This page is the Helix and stays on Run — Roll / Crawl / Walk lock
       in the floating switch. Keep this chat up if a leftover mode class
       is still on <html>, so the playground is never an empty card. */
    html.cwr-ui-on:is(.cwr-roll, .cwr-crawl) body[data-helix-studio] #wa-chat,
    html.cwr-ui-on:is(.cwr-roll, .cwr-crawl) body[data-helix-studio] .wa-chat,
    html.cwr-ui-on:is(.cwr-roll, .cwr-crawl) body[data-helix-studio] .wch-chat-anchor {
      display: flex !important;
    }
    html.cwr-ui-on:is(.cwr-roll, .cwr-crawl) body[data-helix-studio] .chat-input-rail,
    html.cwr-ui-on.cwr-walk body[data-helix-studio] .chat-input-rail {
      display: flex !important;
    }

    /* ── Metrics sidecar ──
       A compact always-open module to the right of the Helix chat. Chat keeps
       the leftover row (the playground stays large). This pane opts out of
       the right-of-chat fill default. */
    .wa-pane {
      display: none;
      flex-direction: column;
      min-width: 0; min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .wa-pane.is-open {
      display: flex;
      transform-origin: right center;
      animation: panelBounceRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @media (prefers-reduced-motion: reduce) { .wa-pane.is-open { animation: none !important; } }
    #modules-row .wa-pane.is-open {
      align-self: center;
      height: calc(100% - 30px);
    }
    #modules-row .wa-pane.is-open.sticky-mod.is-sticky {
      background: var(--surface-2);
      box-shadow: none;
      margin-left: calc(-1 * var(--sticky-tuck) - var(--modules-gap, 8px));
      padding-left: var(--sticky-pad);
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
      animation: stickySlideRight 0.42s cubic-bezier(0.34, 1.45, 0.64, 1) both;
    }
    #modules-row .wa-pane.is-sticky .wa-pane-top { background: var(--surface-2); }
    #modules-row .wa-pane.is-sticky:has(.panel-more-btn.is-open),
    #modules-row .wa-pane.is-sticky:has(.topbar-popover:not(.hidden)) {
      z-index: 1 !important;
    }
    @media (prefers-reduced-motion: reduce) {
      #modules-row .wa-pane.is-open.sticky-mod.is-sticky { animation: none !important; }
    }
    #hx-metrics.wa-pane.is-open {
      flex: 0 0 360px;
      width: 360px;
      min-width: 300px;
      max-width: 420px;
    }
    #hx-metrics.wa-pane.is-open.pane-wide { flex: 0 0 480px; width: 480px; max-width: 520px; }
    #hx-metrics.wa-pane.is-open.pane-triple { flex: 0 0 600px; width: 600px; max-width: none; }
    #hx-metrics.wa-pane.is-open.pane-fill {
      flex: 1 1 0%; width: auto; min-width: 360px; max-width: none;
    }
    .wa-pane-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: var(--module-head-pad-t) var(--module-head-ctrl-inset) var(--module-head-pad-b) var(--module-head-pad-l); flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .wa-pane-mast { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
    .wa-pane-title {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      margin: 0; font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800);
      letter-spacing: -.01em; line-height: var(--module-title-lh, 1.16); color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wa-pane-meta {
      font-size: var(--module-sub-size, 0.78125rem); line-height: var(--module-sub-lh, 1.35);
      color: var(--text-muted); margin: var(--module-sub-gap, 3px) 0 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-basis: 100%;
    }
    .wa-pane-top-right { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }
    .wa-pane-controls { display: inline-flex; align-items: center; gap: var(--module-head-ctrl-gap, 2px); flex-shrink: 0; }
    .wa-pane-body { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 16px 56px 24px 18px; }
    #hx-metrics .panel-more-wrap { position: relative; }
    #hx-metrics .topbar-popover {
      top: auto;
      bottom: calc(100% + 8px);
      right: 0;
    }

    .hx-met-stats { margin: 0 0 18px; }
    .hx-met-sec { margin: 0 0 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .hx-met-sec:first-of-type { padding-top: 0; border-top: 0; }
    .hx-met-h {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      margin: 0 0 10px; font-size: 1.05rem; font-weight: 800;
      letter-spacing: -.01em; line-height: 1.2; color: var(--text);
    }
    .hx-met-lead { margin: 0 0 10px; font-size: 12.5px; line-height: 1.45; color: var(--text-muted); }
    .hx-met-rows { display: flex; flex-direction: column; gap: 6px; }
    .hx-met-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 12px; row-gap: 1px;
      align-items: baseline;
      font-size: 12.5px; line-height: 1.35;
    }
    .hx-met-k { color: var(--text-muted); min-width: 0; }
    .hx-met-v { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .hx-met-note {
      grid-column: 2;
      color: var(--text-subtle);
      font-size: 11px; font-weight: 600;
      text-align: right; font-variant-numeric: tabular-nums;
    }
    .hx-met-imgs {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: 6px;
      max-height: 280px; overflow: auto;
    }
    .hx-met-img {
      display: flex; align-items: center; gap: 10px;
      min-width: 0; padding: 4px 2px;
    }
    .hx-met-thumb {
      flex: 0 0 28px; width: 28px; height: 28px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--surface-2) center / cover no-repeat;
    }
    .hx-met-thumb--empty { background: var(--surface-3); }
    .hx-met-img-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .hx-met-img-name {
      font-size: 12.5px; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hx-met-img-meta { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    html.dark .hx-met-thumb--empty { background: rgba(255,255,255,0.08); }

    .hx-inst-bar { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
    .hx-inst-save {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--border-strong); background: var(--primary); color: #fff;
      font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .hx-inst-save .material-symbols-outlined {
      font-size: 16px !important; line-height: 1 !important;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .hx-inst-save:hover { filter: brightness(1.06); }
    .hx-inst-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .hx-inst-item {
      display: flex; align-items: center; gap: 8px;
      min-width: 0; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .hx-inst-item:last-child { border-bottom: 0; }
    .hx-inst-copy { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .hx-inst-name { font-size: 12.5px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hx-inst-when { font-size: 11px; color: var(--text-muted); }
    .hx-inst-act {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 10px; border-radius: 999px;
      border: 1px solid var(--primary); background: transparent;
      color: var(--text); font: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .hx-inst-act:hover { background: var(--surface-3); }
    .hx-inst-del {
      flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
      border: 0; border-radius: 50%; background: transparent;
      color: var(--text-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hx-inst-del:hover { color: var(--text); background: var(--surface-3); }
    .hx-inst-del .material-symbols-outlined { font-size: 16px !important; }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-helix-studio="1">
  <div id="topbar-row" hidden aria-hidden="true">
    <button type="button" id="topbar-menu-toggle" class="topbar-menu-toggle" title="Collapse menu to icons" aria-label="Collapse menu to icons" aria-pressed="false"><span class="material-symbols-outlined">dock_to_left</span></button>
    <button type="button" class="topbar-appearance-btn" id="topbar-appearance-btn" title="Appearance" aria-label="Appearance settings" aria-haspopup="true" aria-expanded="false"><span class="material-symbols-outlined">crossword</span></button>
    <div class="topbar-profile has-dot" id="topbar-profile" title="Arthur Krupsky · akrupsky@wisecode.ai" data-action="user-menu" role="button" tabindex="0" aria-label="User menu">AK</div>
  </div>

  <div id="chat-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>

    <div id="modules-row" class="modules-sticky">
      <main class="wa-chat sticky-chat" id="wa-chat" data-pr-fill></main>

      <section class="wa-pane is-open sticky-mod is-sticky" id="hx-metrics" data-no-fill-default aria-label="Helix metrics">
        <div class="wa-pane-top">
          <div class="wa-pane-mast">
            <h2 class="wa-pane-title">Helix metrics</h2>
            <p class="wa-pane-meta" id="hx-metrics-meta">Measuring this load…</p>
          </div>
          <div class="wa-pane-top-right">
            <div class="wa-pane-controls">
              <div class="panel-more-wrap">
                <button type="button" class="panel-more-btn" title="More options" aria-haspopup="menu" aria-expanded="false" aria-label="More options"><span class="material-symbols-outlined">more_vert</span></button>
                <div class="topbar-popover hidden" role="menu">
                  <button type="button" class="topbar-menu-item" data-pane-act="refresh"><span class="material-symbols-outlined topbar-menu-icon">refresh</span><span>Refresh now</span></button>
                  <button type="button" class="topbar-menu-item" data-pane-act="copy"><span class="material-symbols-outlined topbar-menu-icon">content_copy</span><span>Copy snapshot</span></button>
                  <div class="topbar-menu-divider"></div>
                  <button type="button" class="topbar-menu-item" data-pane-act="save-instance"><span class="material-symbols-outlined topbar-menu-icon">bookmark</span><span>Save Helix instance</span></button>
                </div>
              </div>
              <button type="button" class="panel-width-toggle-btn" data-pane-width="metrics" aria-pressed="false" title="Width (single) — tap to widen" aria-label="Metrics pane width"><span class="material-symbols-outlined">width_normal</span></button>
            </div>
          </div>
        </div>
        <div class="wa-pane-body" id="hx-metrics-body"></div>
      </section>
    </div>
  </div>

  <script type="module">
    import { mountAgentMenu, toggleMenuPivot, isMenuPivoted } from '../js/agent-menu.js';
    import { mountMenuBrand, isMenuFooterAnchor, positionPopoverInMenuPanel, positionPopoverForTopbar, applyMinimalUi, isMinimalUiOn, restoreMinimalUi, applyHeaderFloat, isHeaderFloatOn, restoreHeaderFloat, applyFullBleed, isFullBleedOn, restoreFullBleed, applyColorblind, isColorblindOn, restoreColorblind } from '../js/topbar.js';
    import { setTextSize, applyStoredTextSize, getStoredFontSize } from '../js/text-size.js';
    import { isJamStripOn, applyJamStrip } from '../js/jam-strip.js';
    import { buildAppearanceBody, wireAppearancePopover, buildUserMenuBody } from '../js/appearance-menu.js';

    Object.assign(window, {
      isMenuFooterAnchor, positionPopoverInMenuPanel, positionPopoverForTopbar,
      setTextSize, setChatFontSize: setTextSize, getStoredFontSize,
      toggleMenuPivot, isMenuPivoted,
      applyMinimalUi, isMinimalUiOn,
      applyHeaderFloat, isHeaderFloatOn,
      applyFullBleed, isFullBleedOn,
      applyColorblind, isColorblindOn,
      isJamStripOn, applyJamStrip,
      buildAppearanceBody, wireAppearancePopover, buildUserMenuBody,
    });

    restoreMinimalUi();
    restoreColorblind();
    restoreHeaderFloat();
    restoreFullBleed();

    mountMenuBrand({
      logoHref: 'overview.html',
      profileName: 'Arthur Krupsky',
      profileEmail: 'akrupsky@wisecode.ai',
      avatarText: 'AK',
    });

    const navEl = document.getElementById('agent-menu-nav');
    if (navEl) {
      mountAgentMenu(navEl, null, { fromAgentPage: true, appNav: true, activeNavId: 'helix' });
    }

    applyStoredTextSize();
  </script>

  <script>
    (function () {
      function applyChatTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('wise-theme', theme); } catch (_) {}
      }
      window.toggleChatTheme = function () {
        applyChatTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
      };
      (function bootTheme() {
        let theme = 'light';
        try { theme = localStorage.getItem('wise-theme') || (localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light'); } catch (_) {}
        applyChatTheme(theme === 'dark' ? 'dark' : 'light');
      })();

      let activePopover = null, activeAnchor = null;
      function closePopover() {
        if (!activePopover) return;
        activeAnchor?.classList.remove('is-open');
        activeAnchor?.setAttribute('aria-expanded', 'false');
        activePopover.classList.remove('open');
        const p = activePopover;
        setTimeout(() => p.remove(), 210);
        activePopover = null; activeAnchor = null;
      }
      function positionWisePopover(pop, anchor) {
        if (window.isMenuFooterAnchor?.(anchor)) window.positionPopoverInMenuPanel?.(pop, anchor);
        else window.positionPopoverForTopbar?.(pop, anchor);
      }
      function renderAppearanceBody(pop) {
        pop.innerHTML = window.buildAppearanceBody({
          showPivot: true,
          isPivoted: !!window.isMenuPivoted?.(),
          isDark: document.documentElement.classList.contains('dark'),
          showWISEcodeAIDock: false,
        });
      }
      function openAppearancePopover(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        renderAppearanceBody(pop);
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open'); anchor.setAttribute('aria-expanded', 'true');
        window.wireAppearancePopover(pop, {
          render: () => renderAppearanceBody(pop),
          onClose: closePopover,
          togglePivot: () => window.toggleMenuPivot?.(),
          toggleTheme: () => window.toggleChatTheme?.(),
        });
      }
      function openUserMenu(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        pop.innerHTML = window.buildUserMenuBody({ name: 'Arthur Krupsky' });
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open');
        pop.addEventListener('click', (ev) => {
          const profile = ev.target.closest('[data-pop-action="profile"]');
          if (profile && pop.contains(profile)) { ev.stopPropagation(); location.href = 'profile.html'; return; }
          const invoices = ev.target.closest('[data-pop-action="invoices"]');
          if (invoices && pop.contains(invoices)) { ev.stopPropagation(); location.href = 'invoices.html'; return; }
          const signout = ev.target.closest('[data-pop-action="signout"]');
          if (signout && pop.contains(signout)) { ev.stopPropagation(); window.performSignOut(); return; }
          if (ev.target.closest('.wise-popover-header, .wise-popover-divider, .wise-popover-actions, .wise-pop-vline')) { ev.stopPropagation(); return; }
          closePopover();
        });
      }
      document.getElementById('topbar-appearance-btn')?.addEventListener('click', (e) => { e.stopPropagation(); openAppearancePopover(e.currentTarget); });
      document.getElementById('topbar-profile')?.addEventListener('click', (e) => { e.stopPropagation(); openUserMenu(e.currentTarget); });
      document.addEventListener('wise:menu-footer-layout', (e) => openAppearancePopover(e.detail.anchor));
      document.addEventListener('wise:menu-footer-profile', (e) => openUserMenu(e.detail.anchor));
      document.addEventListener('click', (e) => {
        if (activePopover && !activePopover.contains(e.target) && !activeAnchor?.contains(e.target)) closePopover();
      });
      window.addEventListener('resize', closePopover);
    })();
  </script>

  <script type="module">
    import {
      mountWISEcodeAIChat,
      applyHelixStudio,
      undoHelixStudio,
      isHelixStudioDirty,
      canHelixStudioUndo,
    } from '../js/wiseai-chat.js';
    import { mountHelixMetrics } from '../js/helix-metrics.js';

    const INTENTS = [
      { intent: 'hx:scene', label: 'Load Scene', icon: 'view_in_ar', keepWelcome: true },
      { intent: 'hx:closeup', label: 'Load Close-up', icon: 'zoom_in', keepWelcome: true },
      { intent: 'hx:apply', label: 'Apply everywhere', icon: 'done', nextIntents: ['hx:undo', 'hx:scene', 'hx:closeup'] },
      { intent: 'hx:undo', label: 'Undo', icon: 'undo', nextIntents: ['hx:apply', 'hx:scene', 'hx:closeup'] },
    ];

    function clickSnap(name) {
      const btn = Array.from(document.querySelectorAll('[data-sc="bg-anim-snap"]'))
        .find((el) => (el.textContent || '').trim() === name);
      if (btn) btn.click();
      return !!btn;
    }

    const INTENT_REPLIES = {
      'hx:scene': () => {
        clickSnap('Scene');
        return 'Scene is loaded in the card — the published default. Drag anything, then <strong>Apply</strong> to send it to every chat.';
      },
      'hx:closeup': () => {
        clickSnap('Close-up');
        return 'Close-up is loaded. The strand fills the pane. <strong>Apply</strong> publishes it everywhere; <strong>Undo</strong> takes it back.';
      },
      'hx:apply': () => {
        if (!isHelixStudioDirty()) return 'Nothing new to publish — this look is already what every chat uses. Change a slider, then Apply.';
        applyHelixStudio();
        return 'Not live yet. Confirm twice that this Helix should go to every chat — this page and every other file that runs one.';
      },
      'hx:undo': () => {
        if (!canHelixStudioUndo()) return 'Nothing to undo — the live Helix matches what every chat already uses.';
        const dirty = isHelixStudioDirty();
        undoHelixStudio();
        return dirty
          ? 'Reverted the card to the last published look. Other chats were never changed.'
          : 'Undid the last Apply. Every chat is back to the previous Helix.';
      },
    };

    function reply(text) {
      const t = String(text || '').toLowerCase();
      if (/close-?up|fill the pane/.test(t)) return INTENT_REPLIES['hx:closeup']();
      if (/scene|default look/.test(t)) return INTENT_REPLIES['hx:scene']();
      if (/apply|publish|everywhere/.test(t)) return INTENT_REPLIES['hx:apply']();
      if (/undo|revert|take it back/.test(t)) return INTENT_REPLIES['hx:undo']();
      return 'This chat is only the Helix. Use the card to change opacity, angle, camera, scale, and the rest — then <strong>Apply</strong> to publish it to every chat, or <strong>Undo</strong> to go back.';
    }

    mountHelixMetrics(document.getElementById('hx-metrics'));

    mountWISEcodeAIChat(document.getElementById('wa-chat'), {
      title: 'WISEcodeAI\u2122',
      heading: 'Tune the Helix',
      sub: 'Drag the card, change anything, then Apply to publish it to every chat.',
      placeholder: 'Ask about Scene, Close-up, Apply, or Undo\u2026',
      userInitials: 'AK',
      sourceLabel: '',
      statusLabel: 'WISEcodeAI is tuning the Helix',
      chipsFlow: 'wrap',
      inlineChips: true,
      historyKey: 'wise-chat-history:helix',
      activity: true,
      turns: true,
      turnsSearch: true,
      turnsBreakout: true,
      turnsDockedControls: true,
      turnsBreakoutDefault: false,
      historyBreakout: true,
      historyBreakoutDefault: true,
      historyDockedControls: true,
      historyBreakoutHidden: true,
      stickyModules: true,
      stickyModulesDefault: true,
      stickyModulesMenu: false,
      helixStudio: true,
      intents: INTENTS,
      intentReplies: INTENT_REPLIES,
      reply: (text) => reply(text),
      onIntent: (intent) => {
        if (intent === 'hx:scene') { clickSnap('Scene'); return true; }
        if (intent === 'hx:closeup') { clickSnap('Close-up'); return true; }
        return false;
      },
    });
  </script>
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
