<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Portfolio — The Truth Layer</title>
  <script>
    /* FOUC guard — apply the persisted theme before first paint so the page
       never flashes dark→light (or vice versa). Mirrors ai-chat.html storage. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="agent-page.css" />
  <link rel="stylesheet" href="scout-chat.css" />
  <link rel="stylesheet" href="portfolio.css" />
</head>
<body data-product-id="wisecode-portfolio">
  <div id="agent-shell-wrap">
    <!-- Top bar rendered by the shared component in js/topbar.js (mountTopbar).
         The 'portfolio' variant adds the section-module rail + layout switcher;
         #pf-module-rail is populated by portfolio-module.js. -->
    <div id="topbar-row"></div>

    <div id="modules-row">
      <div id="menu-panel" class="mp-open">
        <div class="menu-inner">
          <div class="menu-panel-header">
            <div class="menu-panel-icon"><span class="material-icons">hub</span></div>
            <div class="menu-panel-titles">
              <div class="menu-panel-title">Navigation</div>
              <div class="menu-panel-sub">WISE Platform</div>
            </div>
          </div>
          <div class="menu-panel-body">
            <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
          </div>
        </div>
      </div>

      <!-- Section modules are injected here by portfolio-module.js, between the
           sticky menu rail and the persistent Scout chat. -->

      <aside id="pf-chat-panel" class="scout-dock scout-dock-open" aria-label="Scout chat"></aside>
    </div>
  </div>

  <!-- Chart.js powers the Analytics section's charts and graphs. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="../js/portfolio-module.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
