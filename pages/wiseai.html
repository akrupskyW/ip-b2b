<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISEai — Ask your verified food data anything</title>
  <script src="../js/text-size-fouc.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* ═══════════ WISEai — page-specific shell ═══════════
       Reuses the shared WISE palette + chat classes (wise.css Section 2). Everything
       bespoke here is prefixed wa-. The shell mirrors reformulation.html / studio-ai.html:
       a fixed-width WISEai chat card on the left, and up to two RESULT panes that open
       on the right as the conversation surfaces data — one for Results & Details (food
       results, food-detail cards, reports) and one for Visuals (charts, graphs, trends).
       Each result pane carries its own three-dot menu + width control. */

    :root {
      --sec-green-10: rgba(50, 169, 102, 0.12);
      --sec-red-10: rgba(220, 48, 56, 0.12);
      --ter-amber-10: rgba(255, 196, 52, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--modules-bottom-pad, 12px);
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #chat-shell-wrap { flex: 1 1 0%; min-height: 0; width: 100%; overflow: visible; }
    #chat-shell-wrap.menu-brand-integrated #modules-row {
      grid-area: modules;
      display: flex;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      /* Scroll horizontally whenever the modules (chat + broken-out History /
         Turns + result panes) total wider than the row, so nothing is stranded
         off-screen with no way to reach it. overflow-y is hidden (not visible)
         because a single overflow axis can't stay `visible` alongside a
         scrolling one; a little vertical padding gives the card shadows room so
         they aren't cut hard at the box edge. */
      overflow-x: auto;
      overflow-y: hidden;
      /* Match the nav module's height exactly. The shared shell adds
         margin-top:8px to the modules row and we used to inset it another 4px
         top/bottom — together that made the middle chat card read ~16px shorter
         than the nav (and, in sticky mode, visibly off). Zero both so the chat
         (and every module) spans the same top-to-bottom band as the nav. */
      margin-top: 0;
      /* overflow-x:auto (needed for horizontal scroll when panes break out)
         forces overflow-y to compute as non-visible, so overflow-y:hidden
         clips the module cards' drop-shadow flush at the row's bottom edge —
         leaving the body's 12px bottom inset as bare empty space. Fix it the
         same way product-portfolio does: keep a bottom SHADOW GUTTER inside the
         row (padding-bottom) so the shadow renders into padding the clip box
         still shows, then pull the row back down by the same amount (negative
         margin) so the panes still fill the nav column's full height. */
      padding: 0 2px;
    }

    /* ── Nav brand strip height (chat-shell), matches every other WISE page ── */
    #chat-shell-wrap #menu-panel:not(.mp-pivot) .menu-brand-bar { min-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-bar { height: var(--panel-header-h); min-height: var(--panel-header-h); max-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo,
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo a { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Drop the owl lower than the shared 7px nudge so it lines up horizontally
       with the headlines of the modules to the right (their heads pad the title
       ~18px from the top, so the centered logo otherwise reads too high). */
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo svg.tl-bug { transform: translateY(16px); }

    /* ── Center chat column (the ONE shared WISEai chat, carded) ──
       Default: the chat fills the whole modules row (full-screen, single pane).
       Once a result pane opens, it collapses to a fixed-width side column so the
       layout reads as a double pane. */
    .wa-chat {
      position: relative;
      flex: 1 1 auto;
      width: auto;
      /* Floor so the chat never collapses to nothing when several fixed-width
         modules (broken-out History / Turns + result panes) push the row past
         the viewport — instead the row scrolls horizontally and the chat keeps
         a usable width. When modules close, its flex-grow refills the space. */
      min-width: 380px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transform-origin: left center;
      /* `backwards` (not `both`): hold the start frame during the delay, but DON'T
         retain the end frame's transform afterwards. A lingering `transform` would
         make the card a containing block for position:fixed AND (with overflow:hidden)
         clip any floated three-dot popover inside the chat — which no z-index escapes.
         The end frame is visually identical to no transform, so reverting is seamless. */
      animation: panelBounceLeft 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s backwards;
    }
    /* When any result pane is open, dock the chat to a fixed-width column. */
    #modules-row:has(.wa-pane.is-open) .wa-chat {
      flex: 0 0 var(--chat-pane-w, 420px);
      width: var(--chat-pane-w, 420px);
    }
    /* Chat width toggle (matches the shared module's 3-step widen) — only
       meaningful while a pane is open and the chat is docked. */
    #modules-row:has(.wa-pane.is-open) .wa-chat.panel-wide { flex-basis: 620px; width: 620px; }
    #modules-row:has(.wa-pane.is-open) .wa-chat.panel-triple { flex-basis: 840px; width: 840px; }

    /* Small in-chat lead + intent-chip helpers reused from studio-ai (kept so the
       shared chat's inline chips read the same as everywhere else in the app). */
    .sc-reply-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px 42px; }
    .sc-reply-chips .chip { font-weight: 500; padding: 7px 13px; font-size: var(--fs-label); line-height: 1.25; text-align: left; max-width: 100%; }
    @media (max-width: 720px) { .sc-reply-chips { margin-left: 0; } }
    html.header-float .wa-chat .chat-topbar { z-index: 12 !important; }
    /* Floated chat controls (⋯ + width): when the transcript scrolls up beneath
       them they gain an opaque backing so glyphs stay legible. The shared rule
       paints that backing white (--surface), which reads as a different color
       from the chat module's scrolling surface (--bg). Match --bg so, at rest,
       the icons blend into the chat module instead of sitting on white pills. */
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: var(--bg);
    }
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: #1A2339; /* matches html.dark .sc-card's surface */
    }
    /* Keep hover/active affordances readable over the new resting backing. */
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn:hover,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn:hover { background: var(--surface-3); }
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn.is-open,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn.is-on { background: color-mix(in srgb, var(--primary) 16%, var(--surface-2)); }

    /* Bigger welcome headline on the WISEai surface — it leads the full-width
       chat, so give it more presence than the shared default. */
    #wa-chat .ws-heading { font-size: clamp(1.9rem, 3.2vw, 2.6rem); }

    /* Make the input placeholder the WISE blue so the prompt pops. */
    #wa-chat .fl-input::placeholder { color: var(--primary); opacity: 1; }
    html.dark #wa-chat .fl-input::placeholder { color: var(--primary-bright, #8B9FAF); }

    /* Center the large welcome cards (and intent chips). The shared rule gives
       these blocks width:100%, so on the full-width WISEai surface they stretch
       edge-to-edge and the cards left-float. Let the card cluster shrink to its
       content and center it (the welcome column is already align-items:center);
       the max-width fits the full set on wide screens and caps + scrolls on
       narrower ones. */
    #wa-chat .sc-welcome > .ws-scorecards-section,
    #wa-chat .sc-welcome > .ws-chips-wrap,
    #wa-chat .sc-welcome > .ws-chips {
      width: auto;
      max-width: min(100%, 1040px);
      margin-left: auto;
      margin-right: auto;
    }

    /* ═══════════ Right result panes ═══════════
       Two carded modules that open on demand. Both share .wa-pane; each keeps its
       own header controls (three-dot menu + 3-step width toggle). Hidden until the
       conversation produces content for them. */
    .wa-pane {
      display: none;
      flex-direction: column;
      min-width: 0; min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .wa-pane.is-open {
      display: flex;
      flex: 1 1 0%;
      min-width: 400px;
      transform-origin: right center;
      animation: panelBounceRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    /* Width control — cycles the pane's grow ratio so it visibly takes more of the
       row. Single (1) · Double (2) · Triple (3). */
    .wa-pane.is-open.pane-wide { flex-grow: 2; }
    .wa-pane.is-open.pane-triple { flex-grow: 3; }
    @media (prefers-reduced-motion: reduce) { .wa-chat, .wa-pane.is-open { animation: none !important; } }

    /* Shared vertical rhythm — EVERY non-chat module (result panes + docked
       History / Turns) sits ~15px shorter top & bottom, centered in the row, to
       match the sticky modules' inset. The chat is the sole exception: it still
       spans the full row height. */
    #modules-row .wa-pane.is-open,
    #modules-row .wch-sidebar.wch-docked {
      align-self: center;
      height: calc(100% - 30px);
    }

    /* Pane top bar — a slim, always-present control strip that replaces the old
       editorial masthead (which merely duplicated the title already rendered
       inside each output block). It carries only the carousel position counter
       on the LEFT and the control cluster on the RIGHT: the prev/next/minimize
       buttons followed by the three-dot menu + width changer, all in one line. */
    .wa-pane-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 12px 10px 20px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    /* The header control cluster (nav + three-dot + width) is ALWAYS pinned to the
       pane's right edge. margin-left:auto guarantees this even when the position
       counter on the left is empty/hidden (a single output) — without it,
       justify-content:space-between would collapse the lone cluster to the left. */
    .wa-pane-top-right { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }
    .wa-pane-controls { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .wa-pane-controls .panel-more-wrap { margin-left: 0; }
    /* .topbar-menu-item carries an explicit display:flex, which would otherwise
       defeat the [hidden] attribute — force menu items/dividers hidden when set
       (used to reveal the "Minimize" item only in carousel mode). */
    .wa-pane .topbar-menu-item[hidden],
    .wa-pane .topbar-menu-divider[hidden] { display: none !important; }

    /* ── Broken-out History / Turns modules ──
       When History or Turns live as their own docked modules (real flex siblings
       in #modules-row), dress them as first-class panes: same surface color,
       border, radius & shadow as .wa-pane, an editorial serif masthead with NO
       boxed icon, and the same header chrome the panes carry (a three-dot menu +
       a width changer). */
    #modules-row .wch-sidebar.wch-docked {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #modules-row .wch-sidebar.wch-docked .wch-head {
      padding: 18px 14px 16px 24px;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    #modules-row .wch-sidebar.wch-docked .wch-head-title {
      font-family: 'Noto Serif', Georgia, serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -.01em;
      line-height: 1.16;
      color: var(--text);
      align-items: center;
    }
    #modules-row .wch-sidebar.wch-docked .wch-head-title .material-symbols-outlined { display: none; }
    /* Header controls cluster (three-dot + width) sits top-right, like the panes. */
    #modules-row .wch-sidebar.wch-docked .wch-controls { margin-top: 1px; }

    /* ── Sticky modules mode ──────────────────────────────────────────────────
       A toggle in the chat's three-dot menu (data-sc="sticky") turns the docked
       History (left) and Turns (right) modules into "drawers" that tuck in behind
       the chat: they butt right up against it (no gap), lose the corners that face
       the chat, slide a few px UNDER it (the chat overlays their inner edge), take
       a calmer, non-white surface, and sit a little shorter top & bottom so they
       read as sliding out from underneath the chat card. */
    #modules-row.modules-sticky { position: relative; }
    /* Chat rides above the tucked drawers (z-index 1) and keeps casting its shadow
       onto them — but must sit BELOW the resize-handle overlay (z-index 60) so the
       drag handles at the chat↔module seams stay grabbable. (The shared pane-resize
       rule otherwise lifts the chat to z-index 500 because the input's always-present
       role="menu" popovers trip its "menu open" test, which would bury the handles.) */
    #modules-row.modules-sticky #wa-chat { position: relative; z-index: 2 !important; }
    #modules-row.modules-sticky .wch-sidebar.wch-docked {
      z-index: 1;
      background: var(--surface-2);
      box-shadow: none;
      align-self: center;
      height: calc(100% - 30px);
    }
    /* History (left of chat): flush + tucked under the chat's LEFT edge. */
    #modules-row.modules-sticky .wch-sidebar.wch-docked:not(.wch-right) {
      margin-right: -22px;                 /* cancels the 8px row gap + ~14px tuck */
      padding-right: 14px;                 /* keep content clear of the tucked edge */
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: 0;
      animation: stickySlideLeft .42s cubic-bezier(.34, 1.45, .64, 1) both;
    }
    /* Turns (right of chat): flush + tucked under the chat's RIGHT edge. */
    #modules-row.modules-sticky .wch-sidebar.wch-docked.wch-right {
      margin-left: -22px;
      padding-left: 14px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
      animation: stickySlideRight .42s cubic-bezier(.34, 1.45, .64, 1) both;
    }
    /* Emerge from behind the chat: start mostly hidden under it, slide outward. */
    @keyframes stickySlideLeft  { from { transform: translateX(26px); opacity: .35; } to { transform: none; opacity: 1; } }
    @keyframes stickySlideRight { from { transform: translateX(-26px); opacity: .35; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #modules-row.modules-sticky .wch-sidebar.wch-docked { animation: none !important; }
    }

    /* ── Stacking: the chat always rides ABOVE the docked History / Turns
       modules, so when they slide in/out they read as tucking behind the chat
       card (never on top of it). Kept well under the resize-handle overlay
       (z-index 60) so the drag grips at the seams stay grabbable. */
    #modules-row #wa-chat { position: relative; z-index: 3; }
    #modules-row .wch-sidebar.wch-docked { position: relative; z-index: 1; }

    /* The docked History / Turns three-dot menu portals its popover to <body>
       (z-index 3000), so the module itself never needs lifting to show it. Pin
       the docked sidebars BELOW the chat even while their menu is open — this
       overrides the shared pane-resize "menu open" rule (which otherwise jumps
       the whole module to z-index 500, popping the entire History module on top
       of the chat). Higher specificity + !important beats that generic rule. */
    #modules-row .wch-sidebar.wch-docked:has(.panel-more-btn.is-open),
    #modules-row .wch-sidebar.wch-docked:has(.topbar-popover:not(.hidden)),
    #modules-row .wch-sidebar.wch-docked:has([role="menu"]:not(.hidden):not([hidden])) {
      z-index: 1 !important;
    }

    /* ── Docked module reveal / conceal ──────────────────────────────────────
       Showing a docked module (History on the left, Turns on the right) slides
       it out from behind the chat; hiding it slides it back in behind the chat
       and then removes it. Because the modules sit a layer below the chat, the
       motion always reads as emerging from / disappearing under the chat card. */
    #modules-row .wch-sidebar.wch-docked.wch-dock-reveal { animation: waDockRevealL .44s cubic-bezier(.34, 1.4, .64, 1) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-right.wch-dock-reveal { animation: waDockRevealR .44s cubic-bezier(.34, 1.4, .64, 1) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-dock-conceal { animation: waDockConcealL .3s cubic-bezier(.4, 0, .75, .25) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-right.wch-dock-conceal { animation: waDockConcealR .3s cubic-bezier(.4, 0, .75, .25) both !important; }
    @keyframes waDockRevealL { from { opacity: 0; transform: translateX(46px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes waDockRevealR { from { opacity: 0; transform: translateX(-46px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes waDockConcealL { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(46px) scale(.97); } }
    @keyframes waDockConcealR { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-46px) scale(.97); } }
    @media (prefers-reduced-motion: reduce) {
      #modules-row .wch-sidebar.wch-docked.wch-dock-reveal,
      #modules-row .wch-sidebar.wch-docked.wch-dock-conceal { animation: none !important; }
    }

    .wa-pane-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px 28px; }
    .wa-pane-body > .wa-block { animation: waBlockIn .34s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    @keyframes waBlockIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Empty-state placeholder that hints what each pane will hold before it opens. */
    .wa-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; height: 100%; gap: 12px; color: var(--text-muted); padding: 24px;
    }
    .wa-empty .material-symbols-outlined { font-size: 34px; color: var(--text-subtle); }
    .wa-empty-title { font-family: 'Noto Serif', Georgia, serif; font-weight: 700; font-size: 15px; color: var(--text); }
    .wa-empty-sub { font-size: 12.5px; line-height: 1.5; max-width: 300px; }

    /* ── Section scaffolding inside panes ── */
    .wa-block { margin: 0 0 26px; }
    .wa-block:last-child { margin-bottom: 0; }
    /* As the conversation surfaces more results/charts, each new answer is
       appended into the pane so it keeps growing. Separate stacked blocks with
       a hairline rule so each result reads as its own section. */
    .wa-pane-body > .wa-block + .wa-block { margin-top: 4px; padding-top: 24px; border-top: 1px solid var(--border); }

    /* ── Carousel mode: one output at a time + a horizontal thumbnail rail ──
       Once a pane holds 2+ blocks we stop stacking them in a long vertical
       scroll. A horizontal strip of scaled "output visual" thumbnails (the same
       surface-card preview idea used in the chat) sits at the top of the pane,
       and only the selected block renders below it. Tap a thumbnail to switch. */
    .wa-pane-body.is-carousel > .wa-block { display: none; margin: 0; padding-top: 0; border-top: 0; }
    .wa-pane-body.is-carousel > .wa-block.is-active { display: block; }

    /* Position counter — lives on the LEFT of the top bar (see .wa-pane-top).
       Hidden when a pane holds a single output (nothing to count). */
    .wa-pane-nav-count { font-size: 11.5px; font-weight: 600; color: var(--text-muted); letter-spacing: .01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .wa-pane-nav-count:empty { display: none; }
    .wa-pane-nav-count b { color: var(--text); font-weight: 800; }
    /* prev/next button group — sits in the top-bar right cluster, just LEFT of
       the three-dot + width controls. Empty (and collapsed) unless the pane is
       in carousel mode. (Minimize now lives inside the three-dot menu.) */
    .wa-pane-nav-btns { display: inline-flex; align-items: center; gap: 2px; }
    .wa-pane-nav-btns:empty { display: none; }
    /* Borderless icon buttons that match the three-dot + width controls beside
       them: no circle backing at rest, a soft fill on hover only. */
    .wa-pane-nav-arrow {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
      background: transparent; border: 0; color: var(--text-muted); opacity: .85; padding: 0;
      transition: background .15s ease, color .15s ease, opacity .15s ease;
    }
    .wa-pane-nav-arrow:hover { opacity: 1; background: var(--surface-3); color: var(--text); }
    .wa-pane-nav-arrow:disabled { opacity: .32; cursor: default; }
    .wa-pane-nav-arrow:disabled:hover { background: transparent; color: var(--text-muted); }
    .wa-pane-nav-arrow .material-symbols-outlined { font-size: 18px; }

    /* Scrollable thumbnail track — a full-width row of its own below the top
       bar, flush to the module's left edge, shown only in carousel mode. */
    .wa-pane-nav-track {
      display: none; flex: 0 0 auto; min-width: 0; width: 100%;
      gap: 10px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; padding: 10px 14px 12px 0;
      border-bottom: 1px solid var(--border); background: var(--surface);
      scroll-snap-type: x proximity;
    }
    .wa-pane-nav-track.is-on { display: flex; }
    /* Keep the very first thumbnail off the pane's left border by a hair without
       losing the edge-to-edge scroll (the strip still begins at the module edge). */
    .wa-pane-thumb-item:first-child { margin-left: 16px; }
    .wa-pane-thumb-item {
      position: relative; scroll-snap-align: start;
      flex: 0 0 auto; width: 118px;
      display: flex; flex-direction: column; gap: 6px;
      padding: 6px; border-radius: 12px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      font-family: inherit; text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    /* Turn/output number, top-left of each thumbnail. */
    .wa-pane-thumb-num {
      position: absolute; top: 4px; left: 4px; z-index: 2;
      min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
      background: var(--surface); color: var(--text-muted); border: 1px solid var(--border-strong);
    }
    .wa-pane-thumb-item.is-active .wa-pane-thumb-num { background: var(--primary); color: #fff; border-color: var(--primary); }
    .wa-pane-thumb-item:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 4px 12px rgba(37,80,124,0.10); }
    .wa-pane-thumb-item:active { transform: translateY(1px); }
    .wa-pane-thumb-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-pane-thumb-item.is-active { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--surface); }
    /* Small clipped snapshot of the block, scaled way down (matches .sc-surface-thumb). */
    .wa-pane-thumb-preview {
      width: 100%; height: 66px; border-radius: 8px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .wa-pane-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.283); transform-origin: top left; pointer-events: none;
    }
    .wa-pane-thumb-inner > * { margin: 0 !important; }
    .wa-pane-thumb-label {
      font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wa-pane-thumb-item.is-active .wa-pane-thumb-label { color: var(--primary); }

    /* ── Minimized (intent-chip) mode ──
       The minimize control collapses the thumbnail cards into compact intent-
       style chips: a small circular preview image + the output's label. */
    .wa-pane-nav-track.is-min { align-items: center; padding-top: 6px; padding-bottom: 8px; }
    .wa-pane-nav-track.is-min .wa-pane-thumb-item {
      flex-direction: row; align-items: center; gap: 8px;
      width: auto; max-width: 190px; padding: 4px 12px 4px 4px; border-radius: 9999px;
    }
    .wa-pane-nav-track.is-min .wa-pane-thumb-num { display: none; }
    .wa-pane-nav-track.is-min .wa-pane-thumb-preview {
      width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%;
    }
    .wa-pane-nav-track.is-min .wa-pane-thumb-inner { transform: scale(0.1056); } /* 38 / 360 */
    .wa-pane-nav-track.is-min .wa-pane-thumb-label {
      display: block; -webkit-line-clamp: none; line-clamp: none;
      font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
    }

    /* ── Unified (merged) rail: two STACKED chip carousels ──
       When Results & Visuals are merged into one module, the rail becomes two
       stacked rows — one per group — each a horizontally-scrolling strip of small
       intent-style pill chips (matching the chat transcript's chips), introduced
       by a compact group label. Clicking a chip reveals that output below. */
    .wa-pane-nav-track.is-stacked {
      flex-direction: column; align-items: stretch; gap: 8px;
      overflow-x: hidden; overflow-y: auto; scroll-snap-type: none;
      padding: 10px 14px 12px;
    }
    /* Label sits DIRECTLY ABOVE its chip row (not beside it), so every chip row
       starts flush against the rail's left edge. */
    .wa-merge-group { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; }
    /* Hairline between the two stacked carousels so each reads as its own row. */
    .wa-pane-nav-track.is-stacked .wa-merge-group + .wa-merge-group { border-top: 1px solid var(--border); padding-top: 10px; }
    .wa-merge-group-label {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding-left: 2px;
      font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-subtle); line-height: 1.2;
    }
    .wa-merge-group-label .material-symbols-outlined { font-size: 15px; color: var(--primary); flex: 0 0 auto; }
    html.dark .wa-merge-group-label .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-merge-chips {
      flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      scroll-snap-type: x proximity; padding: 2px;
    }
    .wa-merge-chips::-webkit-scrollbar { height: 6px; }
    /* Output chip — a rounded-corner RECTANGLE card that mirrors the transcript's
       .sc-surface-card exactly: a tiny scaled preview of the output on the left,
       its name to the right. NOT a pill. Clicking it reveals that output below. */
    .wa-merge-chip {
      flex: 0 0 auto; scroll-snap-align: start; max-width: 260px;
      display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px;
      background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px;
      font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text);
      cursor: pointer; text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    .wa-merge-chip:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 4px 12px rgba(37,80,124,0.10); }
    .wa-merge-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-merge-chip:active { transform: translateY(1px); }
    /* Clipped snapshot of the output, scaled way down (matches .sc-surface-thumb). */
    .wa-merge-chip-thumb {
      width: 40px; height: 40px; flex: 0 0 auto; border-radius: 8px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .wa-merge-chip-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.111); transform-origin: top left; pointer-events: none;
    }
    .wa-merge-chip-thumb-inner > * { margin: 0 !important; }
    .wa-merge-chip-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .wa-merge-chip.is-active {
      background: var(--surface); border-color: var(--primary); color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    html.dark .wa-merge-chip { background: rgba(255,255,255,0.04); }

    .wa-sec-title { font-family: 'Noto Serif', Georgia, serif; font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .wa-sec-title .material-symbols-outlined { font-size: 18px; color: var(--primary); }
    html.dark .wa-sec-title .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-caption { font-size: 11.5px; color: var(--text-subtle); margin: 0 0 12px; font-style: normal; }

    /* ── Result "table" rows (head + pager live under .wa-tbl below) ── */
    .wa-trow { display: grid; align-items: center; gap: 10px; padding: 9px 14px; }
    .wa-td--end { text-align: right; justify-self: end; }
    .wa-trow { border-bottom: 1px solid var(--border); transition: background .14s; }
    .wa-trow:last-child { border-bottom: 0; }
    .wa-trow:hover { background: var(--surface-2); }
    html.dark .wa-trow:hover { background: rgba(255,255,255,0.03); }
    .wa-td { font-size: 12px; color: var(--text-muted); min-width: 0; }
    .wa-food { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.32; }
    .wa-rank { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--surface-3); color: var(--text-muted); font-size: 10.5px; font-weight: 800; flex: 0 0 auto; }
    .wa-score { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    .wa-score--bad { color: var(--sec-red-text); }
    .wa-score--good { color: var(--sec-green-text); }
    .wa-nodata { color: var(--text-subtle); }
    .wa-cat { font-size: 11px; color: var(--text-subtle); }
    .wa-ing { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wa-table-foot { font-size: 11.5px; color: var(--text-subtle); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .wa-table-foot .material-symbols-outlined { font-size: 14px; }

    /* ═══ Result-set treatment ═══
       Each block carries its own title, scorecards, a search, and a proper
       sortable table (the pane no longer has a separate masthead header). */
    .wa-resultset { margin: 0; }

    /* ── Scorecards (result-set) — scoped to .wa-resultset so the report's own
       scorecard styling below can't bleed in and vice-versa. ── */
    .wa-resultset .wa-stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
    .wa-resultset .wa-stat { flex: 1 1 118px; min-width: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-1); text-align: center; }
    html.dark .wa-resultset .wa-stat { background: rgba(255,255,255,0.04); }
    .wa-resultset .wa-stat-num { font-family: 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-resultset .wa-stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .wa-resultset .wa-stat--alert .wa-stat-num { color: var(--sec-red-text); }
    .wa-resultset .wa-stat--good .wa-stat-num { color: var(--sec-green-text); }
    /* Clickable stat = a sort/filter control for the table below it. */
    .wa-resultset button.wa-stat { cursor: pointer; font-family: inherit; position: relative; transition: border-color .14s, box-shadow .14s, transform .05s; }
    .wa-resultset button.wa-stat:hover { border-color: var(--border-strong); box-shadow: 0 3px 10px rgba(0,0,0,0.07); }
    .wa-resultset button.wa-stat:active { transform: translateY(1px); }
    .wa-resultset button.wa-stat .wa-stat-sort { position: absolute; top: 7px; right: 8px; font-size: 13px !important; color: var(--text-subtle); opacity: .55; transition: opacity .14s, color .14s; }
    .wa-resultset button.wa-stat:hover .wa-stat-sort { opacity: 1; }
    .wa-resultset .wa-stat.is-active { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 22%, transparent); }
    .wa-resultset .wa-stat.is-active .wa-stat-sort { opacity: 1; color: var(--primary); }

    /* ── Toolbar + inline search ── */
    .wa-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
    .wa-search-inline { position: relative; display: inline-flex; align-items: center; flex: 1 1 auto; min-width: 200px; }
    .wa-search-inline > .material-symbols-outlined { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-subtle); pointer-events: none; }
    .wa-search { width: 100%; height: 38px; box-sizing: border-box; padding: 0 16px 0 42px; font-family: inherit; font-size: 0.8125rem; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 9999px; outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease; }
    html.dark .wa-search { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-search::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .wa-search:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }

    /* ── Sortable results table (real column headers, click-to-sort) ── */
    /* overflow visible so .wa-tbl-head can stick to the scrolling .wa-pane-body;
       the head + last row carry the rounded corners instead. */
    .wa-tbl { border: 1px solid var(--border); border-radius: 12px; }
    .wa-tbl-head, .wa-trow { display: grid; align-items: center; gap: 12px; padding: 10px 14px; }
    .wa-tbl-head { border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; background: var(--surface); border-radius: 12px 12px 0 0; }
    .wa-tbl-th { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); background: none; border: 0; padding: 0; margin: 0; font-family: inherit; text-align: left; white-space: nowrap; }
    button.wa-tbl-th { cursor: pointer; transition: color .14s; }
    button.wa-tbl-th:hover { color: var(--text); }
    .wa-tbl-th--end { justify-content: flex-end; text-align: right; }
    .wa-tbl-th.is-sorted { color: var(--primary); }
    html.dark .wa-tbl-th.is-sorted { color: var(--primary-bright, #8B9FAF); }
    /* Shared chevron sort arrow (matches srt-arrow / adm-sort-arrow app-wide):
       a faint down-chevron that turns primary and flips to point up on asc. */
    .wa-sort-ic { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; margin-left: 2px; flex: none; opacity: .3; transition: opacity .12s ease, transform .12s ease; }
    .wa-sort-ic svg { width: 12px; height: 12px; display: block; }
    button.wa-tbl-th:hover .wa-sort-ic { opacity: .6; }
    .wa-tbl-th.is-sorted .wa-sort-ic { opacity: 1; }
    .wa-tbl-th[data-wa-dir="asc"] .wa-sort-ic { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) { .wa-sort-ic { transition: none; } }
    .wa-tbl-body { display: block; }
    .wa-trow { border-bottom: 1px solid var(--border); transition: background .14s; }
    .wa-tbl-body .wa-trow:last-child { border-bottom: 0; border-radius: 0 0 12px 12px; }
    .wa-trow:hover { background: var(--surface-2); }
    html.dark .wa-trow:hover { background: rgba(255,255,255,0.03); }
    .wa-td { font-size: 12px; color: var(--text-muted); min-width: 0; }
    .wa-td--end { text-align: right; justify-self: end; }

    /* Product cell — real food image + name with brand beneath it */
    .wa-prod { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .wa-thumb { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; overflow: hidden; position: relative; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--primary); border: 1px solid var(--border); }
    html.dark .wa-thumb { background: rgba(37,80,124,0.28); color: #9DC0E6; border-color: rgba(255,255,255,0.10); }
    .wa-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wa-thumb-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
    .wa-thumb-fallback .material-symbols-outlined { font-size: 19px; }
    .wa-prod-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .wa-prod-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.32; }
    .wa-prod-brand { font-size: 11px; color: var(--text-subtle); }

    /* Ingredients as its own column */
    .wa-ing-cell { font-size: 11px; color: var(--text-muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wa-ing-cell.wa-nodata { color: var(--text-subtle); }

    /* Score as a plain sortable column value (no pill chip) */
    .wa-score-num { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    .wa-score-num--bad { color: var(--sec-red-text); }
    .wa-score-num--good { color: var(--sec-green-text); }
    .wa-empty-row { padding: 22px 14px; text-align: center; color: var(--text-subtle); font-size: 12px; border-top: 1px solid var(--border); }

    /* ── Table pagination (bottom of the sortable table) ── */
    .wa-pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px 6px; font-size: 12px; color: var(--text-subtle); }
    .wa-pager[hidden] { display: none; }
    .wa-pager-range { font-size: 12px; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
    .wa-loadmore { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; background: transparent; border: none; color: var(--primary); font-family: inherit; font-size: 12px; font-weight: 700; }
    .wa-loadmore .material-symbols-outlined { font-size: 16px; }
    .wa-loadmore[hidden] { display: none; }

    /* ── Food-detail hero (failed-lookup notice state) ──
       A clean editorial header rather than a boxed card: the product photo +
       name + brand on the left, with a large, prominent WISEscore on the right.
       No shaded background / card chrome (the pane header already carries the
       title), just a hairline rule beneath so the hero doesn't read as a second
       header. */
    .wa-dhero { display: flex; align-items: center; gap: 16px; padding: 2px 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .wa-dhero-thumb { width: 66px; height: 66px; flex: 0 0 auto; border-radius: 14px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .wa-dhero-thumb .wa-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wa-dhero-thumb .wa-thumb-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
    html.dark .wa-dhero-thumb .wa-thumb-fallback { color: var(--primary-bright, #8B9FAF); }
    .wa-dhero-thumb .wa-thumb-fallback .material-symbols-outlined { font-size: 30px; }
    .wa-dhero-info { flex: 1 1 auto; min-width: 0; }
    .wa-dhero-name { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 18px; line-height: 1.22; color: var(--text); letter-spacing: -.01em; }
    .wa-dhero-brand { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); margin-top: 6px; }
    .wa-dhero-score { flex: 0 0 auto; text-align: center; padding-left: 10px; }
    .wa-dhero-score-n { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 46px; line-height: .9; color: var(--sec-red-text); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .wa-dhero-score-l { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle); margin-top: 6px; }
    .wa-notice { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 11px; font-size: 12px; line-height: 1.45; margin-bottom: 14px; background: var(--ter-amber-10); border: 1px solid color-mix(in srgb, var(--ter-amber) 34%, transparent); color: var(--ter-amber-text); }
    .wa-notice .material-symbols-outlined { font-size: 17px; flex: 0 0 auto; margin-top: 1px; }
    .wa-detail-sub { font-size: 12px; font-weight: 700; color: var(--text); margin: 0 0 8px; }
    .wa-chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
    .wa-ing-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; background: var(--sec-red-10); border: 1px solid color-mix(in srgb, var(--sec-red) 26%, transparent); color: var(--sec-red-text); }

    /* ── Report layout ── */
    .wa-report-hero { margin-bottom: 20px; }
    .wa-report-title { font-family: 'Noto Serif', Georgia, serif; font-weight: 900; font-size: 1.55rem; line-height: 1.15; letter-spacing: -.015em; color: var(--text); margin: 0 0 10px; }
    .wa-report-lede { font-size: 12.5px; line-height: 1.6; color: var(--text-muted); margin: 0; max-width: 640px; }
    .wa-report .wa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .wa-report .wa-stat { padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
    html.dark .wa-report .wa-stat { background: rgba(255,255,255,0.04); }
    .wa-report .wa-stat-num { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 26px; line-height: 1; color: var(--text); }
    .wa-report .wa-stat-num .u { font-size: 14px; color: var(--text-muted); font-weight: 700; }
    .wa-report .wa-stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); margin-top: 7px; }
    .wa-shortlist { display: flex; flex-direction: column; gap: 8px; }
    .wa-cand { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
    html.dark .wa-cand { background: rgba(255,255,255,0.03); }
    .wa-cand-rank { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 13px; background: var(--primary); color: #fff; }
    html.dark .wa-cand-rank { background: var(--primary-bright, #8B9FAF); color: var(--surface); }
    .wa-cand-body { flex: 1 1 auto; min-width: 0; }
    .wa-cand-name { font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .wa-cand-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .wa-cand-score { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 16px; color: var(--sec-green-text); flex: 0 0 auto; }

    /* ── Charts (SVG + div bars, app tokens only) ──
       Charts sit flush in the pane — no bordered card. Adjacent .wa-blocks are
       already separated by the hairline rule above, so each chart just needs
       breathing room, not a rounded container. */
    .wa-chart-card { border: 0; border-radius: 0; padding: 0; background: transparent; }
    .wa-chart-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--text-muted); }
    .wa-chart-legend .k { display: inline-flex; align-items: center; gap: 6px; }
    .wa-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .wa-bars { display: flex; flex-direction: column; gap: 9px; }
    .wa-bar-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; }
    .wa-bar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: right; }
    .wa-bar-track { height: 16px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; }
    .wa-bar-fill { height: 100%; border-radius: 9999px; background: var(--primary); }
    html.dark .wa-bar-fill { background: var(--primary-bright, #8B9FAF); }
    .wa-bars-thin .wa-bar-track { height: 6px; }
    .wa-bar-val { font-size: 11.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    /* Stacked score rows: name on its own line, bar + value beneath it so each
       ranked item gets vertical room to breathe. */
    .wa-scorebars { display: flex; flex-direction: column; gap: 14px; }
    .wa-scorebar { display: flex; flex-direction: column; gap: 7px; }
    .wa-scorebar-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .wa-scorebar-line { display: flex; align-items: center; gap: 12px; }
    .wa-scorebar-line .wa-bar-track { flex: 1 1 auto; height: 8px; }
    .wa-scorebar-line .wa-bar-val { flex: 0 0 auto; }
    .wa-radar-wrap { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
    .wa-radar-scores { width: 100%; }
    /* Let axis labels render past the SVG box instead of being clipped. */
    .wa-radar-svg { overflow: visible; }
    .wa-nd-tag { display: inline-block; padding: 1px 7px; border-radius: 9999px; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--ter-amber-10); color: var(--ter-amber-text); border: 1px solid color-mix(in srgb, var(--ter-amber) 30%, transparent); }

    /* ═══════════ Code Evaluation module ═══════════
       A distinct OUTPUT TYPE (beyond result tables, detail cards, reports &
       charts): the WISEcode "code evaluation" run for a recipe / ingredient
       list. Header carries a score gauge + parse summary; a collapsible STEP
       BREAKDOWN lists the code that produced the score; an INGREDIENT
       PROCESSING panel groups every parsed ingredient by NOVA-style processing
       level with a category tag. Renders inside a .wa-block in the Results pane. */
    .wa-ce-head { display: flex; align-items: center; gap: 18px; padding: 2px 2px 22px; }
    .wa-ce-gauge { flex: 0 0 auto; width: 88px; height: 88px; position: relative; }
    .wa-ce-gauge svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
    .wa-ce-gauge-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wa-ce-gauge-val { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 25px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-gauge-band { font-size: 8.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--sec-green-text); margin-top: 3px; }
    .wa-ce-sum-concept { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); }
    .wa-ce-sum-main { font-family: 'Noto Serif', Georgia, serif; font-size: 18px; font-weight: 800; color: var(--text); margin-top: 4px; line-height: 1.1; }
    .wa-ce-sum-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .wa-ce-sum-sub b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    .wa-ce-sum-sub .sep { color: var(--text-subtle); opacity: .6; }

    .wa-ce-sec { border-top: 1px solid var(--border); padding-top: 16px; }
    .wa-ce-sec + .wa-ce-sec { margin-top: 24px; }
    .wa-ce-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .wa-ce-sec-head > .material-symbols-outlined { font-size: 17px; color: var(--primary); }
    html.dark .wa-ce-sec-head > .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-sec-title { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--text); }
    .wa-ce-sec-count { font-size: 11px; font-weight: 600; color: var(--text-subtle); }
    .wa-ce-sec-chev { margin-left: auto; color: var(--text-subtle); font-size: 18px; }

    .wa-ce-steps-head { display: grid; grid-template-columns: 46px 1fr 72px; gap: 10px; padding: 0 4px 8px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); border-bottom: 1px solid var(--border); }
    .wa-ce-steps-head .end { text-align: right; }
    .wa-ce-step { display: grid; grid-template-columns: 46px 1fr 72px; gap: 10px; align-items: start; padding: 11px 4px; border-bottom: 1px solid var(--border); }
    .wa-ce-step:hover { background: var(--surface-2); }
    html.dark .wa-ce-step:hover { background: rgba(255,255,255,0.03); }
    .wa-ce-step-num { font-size: 11.5px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .wa-ce-step-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .wa-ce-step-name .tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--primary); margin-left: 5px; }
    html.dark .wa-ce-step-name .tag { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-step-note { font-size: 11px; color: var(--text-subtle); line-height: 1.45; margin-top: 3px; }
    .wa-ce-step-val { text-align: right; font-size: 12.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-step-val.is-empty { color: var(--text-subtle); font-weight: 600; }
    .wa-ce-step-val.is-false { color: var(--ter-amber-text); }

    .wa-ce-pl { display: flex; align-items: center; gap: 9px; }
    .wa-ce-pl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sec-green); flex: 0 0 auto; }
    .wa-ce-pl-label { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .wa-ce-pl-count { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-plbar { height: 6px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; margin: 10px 0 16px; }
    .wa-ce-plbar-fill { height: 100%; border-radius: 9999px; background: var(--sec-green); }
    .wa-ce-ings { display: flex; flex-wrap: wrap; gap: 7px; }
    .wa-ce-ing { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 9999px; font-size: 11.5px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); }
    html.dark .wa-ce-ing { background: rgba(255,255,255,0.03); }
    .wa-ce-ing-tag { font-size: 10px; font-weight: 700; color: var(--primary); }
    html.dark .wa-ce-ing-tag { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-role-tag { flex: 0 0 auto; padding: 3px 9px; border-radius: 9999px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--sec-green-10); color: var(--sec-green-text); border: 1px solid color-mix(in srgb, var(--sec-green) 26%, transparent); }

    /* ═══════════ Inline surface preview chip ═══════════
       When a turn opens a Results/Visuals module on the right, a small chip is
       dropped INTO the transcript: a tiny thumbnail preview of that content on
       the left, with the chart/result name to its right. Tapping it re-opens the
       full module. It's a <div role="button"> (not a <button>) so it can safely
       wrap the inner content of the surfaced view. */
    .sc-surface-card {
      display: inline-flex; align-items: center; gap: 10px; width: auto; max-width: min(340px, 100%);
      text-align: left; margin: 4px 0 0; padding: 6px 12px 6px 6px;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: 12px; cursor: pointer; font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    .sc-surface-card:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 4px 12px rgba(37,80,124,0.10); }
    .sc-surface-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sc-surface-card:active { transform: translateY(1px); }
    /* Small clipped snapshot of the surfaced content, scaled way down. */
    .sc-surface-thumb {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 8px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .sc-surface-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.122); transform-origin: top left; pointer-events: none;
    }
    .sc-surface-thumb-inner > * { margin: 0 !important; }
    .sc-surface-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.3; white-space: normal; overflow-wrap: anywhere; }

    /* ═══════════ Conversation manifest (floating Outputs / Sources) ═══════════
       A floating summary card pinned to the chat's top-right, just below the
       width-toggle. It lists every OUTPUT surfaced into the result panes and the
       verified SOURCES this transcript draws on, so a long conversation always
       keeps a jump-list of what it produced. Open by default when the chat is
       wide (≈triple width); otherwise it collapses to a slim icon rail that
       expands on hover. When wide it can also be manually collapsed or closed. */
    .wa-manifest {
      position: absolute;
      top: calc(var(--panel-header-h, 60px) + 10px);
      right: 14px;
      z-index: 24;
      width: auto;               /* hug whichever child is visible, right-anchored */
      max-width: calc(100% - 28px);
      font-family: inherit;
      /* Stack the full panel, the icon rail and the re-open button in one grid
         cell so they can cross-fade in place without any reflow. */
      display: grid;
      justify-items: end;
      align-items: start;
    }
    .wa-manifest.is-empty { display: none; }

    /* Expanded panel — the default when the chat is wide. */
    .wa-manifest-full {
      display: flex; flex-direction: column;
      width: 266px; max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.05);
      padding: 12px 12px 14px;
      max-height: calc(100vh - var(--panel-header-h, 60px) - 60px);
      overflow: hidden;
    }
    html.dark .wa-manifest-full { box-shadow: 0 14px 36px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); }

    /* Smooth open/close. The panel, rail and re-open button share one grid cell
       and cross-fade with a small scale from the top-right. transition-behavior:
       allow-discrete + @starting-style animate the display:none <-> shown flip in
       BOTH directions, so the box eases open and closed instead of popping. */
    .wa-manifest-full,
    .wa-manifest-rail,
    .wa-manifest-reopen {
      grid-area: 1 / 1;
      transform-origin: top right;
      transition: opacity .17s ease,
                  transform .24s cubic-bezier(0.22, 0.61, 0.36, 1),
                  display .24s allow-discrete;
    }
    @starting-style {
      .wa-manifest-full,
      .wa-manifest-rail,
      .wa-manifest-reopen { opacity: 0; transform: scale(0.97) translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wa-manifest-full,
      .wa-manifest-rail,
      .wa-manifest-reopen { transition: none; }
    }

    /* Collapse / close controls — floated in the panel's top-right corner. Only
       meaningful (and shown) when the chat is wide enough to be open by default. */
    .wa-manifest-ctrls { display: flex; justify-content: flex-end; gap: 2px; height: 0; overflow: visible; }
    .wa-manifest:not(.is-wide) .wa-manifest-ctrls { display: none; }
    .wa-manifest-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: 0; border-radius: 7px;
      background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: background .14s, color .14s;
    }
    .wa-manifest-btn:hover { background: var(--surface-2); color: var(--text); }
    html.dark .wa-manifest-btn:hover { background: rgba(255,255,255,0.06); }
    .wa-manifest-btn .material-symbols-outlined { font-size: 17px; }

    .wa-manifest-section { min-height: 0; display: flex; flex-direction: column; }
    .wa-manifest-section[hidden] { display: none; }
    .wa-manifest-label { font-size: 12.5px; font-weight: 700; color: var(--text); margin: 2px 4px 7px; flex: 0 0 auto; }
    .wa-manifest-list { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0; }
    .wa-manifest-div { height: 1px; background: var(--border); margin: 11px 2px; flex: 0 0 auto; }

    .wa-manifest-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 8px; border: 0; border-radius: 9px; background: transparent;
      cursor: pointer; text-align: left; font-family: inherit; color: var(--text);
      transition: background .14s;
    }
    .wa-manifest-item--static { cursor: default; }
    .wa-manifest-item[role="button"]:hover,
    button.wa-manifest-item:hover { background: var(--surface-2); }
    html.dark .wa-manifest-item[role="button"]:hover,
    html.dark button.wa-manifest-item:hover { background: rgba(255,255,255,0.05); }
    .wa-manifest-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .wa-manifest-ic {
      width: 27px; height: 27px; flex: 0 0 auto; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary-soft); color: var(--primary); overflow: hidden;
    }
    html.dark .wa-manifest-ic { color: var(--primary-bright, #8B9FAF); }
    .wa-manifest-ic .material-symbols-outlined { font-size: 16px; }
    .wa-manifest-ic img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
    .wa-manifest-name { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Collapsed icon rail — the slim state on narrow widths. */
    .wa-manifest-rail {
      display: none; opacity: 0; transform: scale(0.97) translateY(-5px);
      flex-direction: column; align-items: center; gap: 5px;
      margin-left: auto; width: max-content; padding: 8px 7px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,0.12);
      max-height: calc(100vh - var(--panel-header-h, 60px) - 60px); overflow-y: auto;
    }
    html.dark .wa-manifest-rail { box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
    .wa-manifest-rail-ic {
      width: 26px; height: 26px; flex: 0 0 auto; border: 0; border-radius: 50%; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: var(--primary-soft); color: var(--primary); overflow: hidden;
      transition: transform .12s, box-shadow .14s;
    }
    html.dark .wa-manifest-rail-ic { color: var(--primary-bright, #8B9FAF); }
    .wa-manifest-rail-ic:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.14); }
    .wa-manifest-rail-ic--static { cursor: default; background: var(--surface-2); color: var(--text-muted); }
    html.dark .wa-manifest-rail-ic--static { background: rgba(255,255,255,0.06); }
    .wa-manifest-rail-ic .material-symbols-outlined { font-size: 14px; }
    .wa-manifest-rail-ic img { width: 14px; height: 14px; object-fit: contain; border-radius: 50%; }
    .wa-manifest-rail-div { width: 18px; height: 1px; background: var(--border); margin: 2px 0; flex: 0 0 auto; }

    /* State toggling: collapsed shows the rail; hovering the rail peeks the full
       panel; hidden shows only a small reopen button. Each shown/hidden variant
       carries its own opacity + transform so the shared transition has real
       start/end values to ease between. */
    .wa-manifest.is-collapsed .wa-manifest-full { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }
    .wa-manifest.is-collapsed .wa-manifest-rail { display: flex; opacity: 1; transform: none; }
    .wa-manifest.is-collapsed:hover .wa-manifest-full { display: flex; opacity: 1; transform: none; }
    .wa-manifest.is-collapsed:hover .wa-manifest-rail { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }

    .wa-manifest.is-hidden .wa-manifest-full,
    .wa-manifest.is-hidden .wa-manifest-rail { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }
    /* Turned off from the chat's three-dot "Hide outputs & sources" switch —
       removes the whole component (panel, rail AND re-open button). */
    .wa-manifest.is-off { display: none !important; }
    .wa-manifest-reopen {
      display: none; opacity: 0; margin-left: auto; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--primary); cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    html.dark .wa-manifest-reopen { color: var(--primary-bright, #8B9FAF); box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
    .wa-manifest-reopen:hover { transform: translateY(-1px); }
    .wa-manifest.is-hidden .wa-manifest-reopen { display: inline-flex; opacity: 1; transform: none; }
    .wa-manifest-reopen .material-symbols-outlined { font-size: 20px; }
    .wa-manifest-reopen-badge {
      position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 9999px; background: var(--primary); color: #fff; font-size: 9.5px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    }
    html.dark .wa-manifest-reopen-badge { background: var(--primary-bright, #8B9FAF); color: var(--surface); }
    .wa-manifest-reopen { position: relative; }

    /* Full bleed — mirror the shared treatment (wise.css): open every module
       top-to-bottom (drop top/bottom borders, corner rounding, shadow + the
       bounce-in) so it runs the full height of the window, while keeping the
       left/right borders + the row gutter so the columns stay separated. */
    html.full-bleed .wa-chat, html.full-bleed .wa-pane,
    html.full-bleed #modules-row .wch-sidebar.wch-docked {
      border-top: 0; border-bottom: 0; border-radius: 0; box-shadow: none; animation: none;
    }
    html.full-bleed body { padding-top: 0; padding-bottom: 0; }

    /* Narrow viewports: let the modules scroll horizontally rather than crush. */
    @media (max-width: 1180px) {
      #chat-shell-wrap.menu-brand-integrated #modules-row { overflow-x: auto; }
      .wa-pane.is-open { min-width: 480px; }
    }

    /* ═══════════ Share side panel (⋯ → Share) ═══════════
       A right-docked panel that slides over the chat, reusing the SHARED
       `.wch-sidebar` shell (identical to "Connect a data source") plus the app's
       own form controls (.adm-field / .adm-input / .adm-btn pill / .chip). Only
       the bits those classes don't cover (chip box, people dropdown, output rows)
       are defined here. */
    #wa-share-panel { width: 372px; }
    /* Editorial serif masthead — matches the result panes / docked modules. The
       title + conversation subtitle stack in the header (no leading icon). */
    #wa-share-panel .wch-head { align-items: flex-start; padding: 16px 12px 14px 18px; }
    #wa-share-panel .wch-head-title { font-family: 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; line-height: 1.16; color: var(--text); }
    .wa-sh-head-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .wa-sh-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-sub { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-form { display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-form[hidden], .wa-sh-done[hidden] { display: none; }

    /* Textarea sibling to .adm-input (which is a fixed-height single-line field). */
    .wa-sh-textarea { width: 100%; box-sizing: border-box; min-height: 74px; padding: 10px 14px; font-family: inherit; font-size: 0.8125rem; line-height: 1.45; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 10px; outline: none; resize: vertical; }
    html.dark .wa-sh-textarea { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-sh-textarea:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .adm-input::placeholder, .wa-sh-textarea::placeholder { color: var(--text-subtle); opacity: 0.85; }

    /* Recipient chip box — matches .adm-input, but wraps chips + a borderless input. */
    .wa-sh-chips { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; box-sizing: border-box; padding: 5px 8px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 10px; }
    html.dark .wa-sh-chips { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-sh-chips:focus-within { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .wa-sh-chipinput { flex: 1 1 90px; min-width: 90px; height: 30px; border: 0; background: transparent; font-family: inherit; font-size: 0.8125rem; color: var(--text); outline: none; padding: 0 4px; }
    .wa-sh-chipinput::placeholder { color: var(--text-subtle); opacity: 0.85; }

    /* Recipient pill (compact take on .chip; body isn't clickable, only the ×). */
    .wa-sh-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 5px 3px 11px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); font-size: 0.76rem; font-weight: 500; color: var(--text); }
    html.dark .wa-sh-chip { background: rgba(255,255,255,0.06); }
    .wa-sh-chip.is-invalid { border-color: var(--sec-red); color: var(--sec-red); }
    .wa-sh-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-chip-x { display: grid; place-items: center; width: 17px; height: 17px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text-subtle); cursor: pointer; }
    .wa-sh-chip-x:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    html.dark .wa-sh-chip-x:hover { background: rgba(255,255,255,0.12); }
    .wa-sh-chip-x .material-symbols-outlined { font-size: 14px; }

    /* People search dropdown. */
    .wa-sh-menu { position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 5; overflow: hidden auto; max-height: 210px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 16px 34px rgba(20,30,60,0.16); }
    html.dark .wa-sh-menu { background: var(--surface-2); box-shadow: 0 16px 34px rgba(0,0,0,0.5); }
    .wa-sh-menu[hidden] { display: none; }
    .wa-sh-person { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer; }
    .wa-sh-person:last-child { border-bottom: 0; }
    .wa-sh-person:hover, .wa-sh-person.is-active { background: var(--surface-2); }
    html.dark .wa-sh-person:hover, html.dark .wa-sh-person.is-active { background: rgba(255,255,255,0.06); }
    .wa-sh-person-av { display: grid; place-items: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: var(--surface-2); color: var(--text-subtle); }
    html.dark .wa-sh-person-av { background: rgba(255,255,255,0.08); }
    .wa-sh-person-av .material-symbols-outlined { font-size: 17px; }
    .wa-sh-person-txt { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
    .wa-sh-person-name { font-size: 0.82rem; font-weight: 600; color: var(--text); white-space: nowrap; }
    .wa-sh-person-mail { font-size: 0.78rem; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-menu-empty { padding: 10px 12px; font-size: 0.8rem; color: var(--text-subtle); line-height: 1.4; }

    /* Checkbox rows (entire org + individual outputs). */
    .wa-sh-check { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--text); cursor: pointer; }
    .wa-sh-outs { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .wa-sh-out { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
    .wa-sh-out:hover { background: var(--surface-2); }
    html.dark .wa-sh-out:hover { background: rgba(255,255,255,0.05); }
    .wa-sh-out-tag { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--primary); flex-shrink: 0; }
    html.dark .wa-sh-out-tag { color: var(--primary-bright); }
    .wa-sh-out-name { min-width: 0; font-size: 0.8125rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Footer pinned to the bottom of the panel. */
    .wa-sh-foot { flex-shrink: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
    html.dark .wa-sh-foot { border-top-color: rgba(255,255,255,0.08); }

    /* Success view — a "Share created" card (link + copy) above the running
       "Existing shares" list. Copy uses the app's primary pill button. */
    .wa-sh-done { display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-created { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--sec-green) 42%, var(--border)); background: color-mix(in srgb, var(--sec-green) 7%, var(--surface)); }
    html.dark .wa-sh-created { background: color-mix(in srgb, var(--sec-green) 14%, var(--surface-2)); }
    .wa-sh-created-title { font-size: 1rem; font-weight: 700; color: var(--sec-green-text, var(--sec-green)); }
    .wa-sh-linkrow { display: flex; gap: 8px; }
    .wa-sh-linkrow .adm-input { flex: 1 1 auto; min-width: 0; font-size: 0.76rem; }
    .wa-sh-linkrow .adm-btn { flex: 0 0 auto; }

    .wa-sh-existing { display: flex; flex-direction: column; padding-top: 14px; border-top: 1px solid var(--border); }
    .wa-sh-existing-label { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .wa-sh-existing-empty { font-size: 0.8rem; color: var(--text-subtle); padding: 4px 0; }
    .wa-sh-share-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .wa-sh-share-ic { display: grid; place-items: center; width: 22px; height: 22px; flex-shrink: 0; color: var(--sec-green); }
    .wa-sh-share-ic .material-symbols-outlined { font-size: 19px; }
    .wa-sh-share-meta { flex: 1 1 auto; min-width: 0; font-size: 0.82rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-sh-share-scope { color: var(--text-subtle); }
    .wa-sh-share-acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .wa-sh-share-act { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--text-subtle); cursor: pointer; }
    .wa-sh-share-act:hover { background: var(--surface-2); color: var(--text); }
    html.dark .wa-sh-share-act:hover { background: rgba(255,255,255,0.06); }
    .wa-sh-share-act .material-symbols-outlined { font-size: 17px; }

    /* ═══════════ Compare module (side pane) ═══════════
       A self-contained comparison board that mirrors the product-comparison
       page: a metric rail on the left and one column per product, aligned by a
       CSS grid. Header tiles carry a full-bleed product photo with a circular
       WISEscore gauge floating on top; each metric row shows a value + coloured
       bar + letter grade, and the board closes with a per-product insight row. */
    .wa-cmp { display: flex; flex-direction: column; gap: 12px; }
    .wa-cmp-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .wa-cmp-chip {
      display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 11px; font-weight: 600;
      color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: 9999px; padding: 5px 12px; cursor: pointer; transition: border-color .15s ease, background .15s ease, color .15s ease;
    }
    .wa-cmp-chip .material-symbols-outlined { font-size: 15px; }
    .wa-cmp-chip:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border-strong)); color: var(--text); }
    .wa-cmp-chip.is-on { background: color-mix(in srgb, var(--primary) 14%, var(--surface-2)); border-color: var(--primary); color: var(--primary); }
    .wa-cmp-chip--add { margin-left: auto; }

    .wa-cmp-grid-wrap { overflow-x: hidden; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); }
    .wa-cmp-grid { display: grid; width: 100%; min-width: 0; }
    .wa-cmp-cell { padding: 10px 12px; border-bottom: 1px solid var(--border); min-width: 0; }
    .wa-cmp-cell--rail { position: sticky; left: 0; z-index: 2; background: var(--surface-2); border-right: 1px solid var(--border); }
    .wa-cmp-cell--entity + .wa-cmp-cell--entity { border-left: 1px solid var(--border); }

    /* Header row */
    .wa-cmp-hcell { position: relative; }
    .wa-cmp-corner { display: flex; flex-direction: column; gap: 3px; }
    .wa-cmp-corner-title { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
    .wa-cmp-corner-h { font-size: 1rem; font-weight: 800; color: var(--text); line-height: 1.1; }
    .wa-cmp-corner-desc { font-size: 10px; color: var(--text-subtle); line-height: 1.4; margin-top: 2px; }

    .wa-cmp-tile {
      position: relative; width: 100%; height: 138px; border-radius: 12px; overflow: hidden;
      background: var(--primary); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .wa-cmp-tile-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .wa-cmp-tile-overlay {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 20px 12px 10px;
      background: linear-gradient(to top, rgba(8,12,20,0.82) 12%, rgba(8,12,20,0.35) 60%, rgba(8,12,20,0) 100%);
    }
    .wa-cmp-ent-name { font-size: 0.78rem; font-weight: 700; color: #fff; line-height: 1.2; overflow-wrap: anywhere; }
    .wa-cmp-ent-cat { font-size: 10px; color: rgba(255,255,255,0.82); overflow-wrap: anywhere; margin-top: 1px; }
    .wa-cmp-rankchip {
      position: absolute; top: 10px; left: 10px; z-index: 4; display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px 2px 3px; border-radius: 9999px; background: rgba(8,12,20,0.55); color: #fff; font-size: 10px; font-weight: 700;
    }
    .wa-cmp-rankchip .wa-cmp-rank {
      width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary-bright, #8B9FAF); color: #fff; font-size: 10px; font-weight: 800;
    }
    .wa-cmp-you {
      position: absolute; top: 10px; right: 10px; z-index: 4; padding: 2px 8px; border-radius: 9999px;
      background: var(--primary); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: 0.04em;
    }
    .wa-cmp-toppill {
      position: absolute; top: 40px; left: 10px; z-index: 4; padding: 2px 8px; border-radius: 9999px;
