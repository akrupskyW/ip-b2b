    function trendSlopeChart() {
      const W = 560, H = 200, padT = 20, padB = 30, padX = 90;
      const series = [
        ['Coconut / almond-base', 42, 88, 'var(--sec-green)'],
        ['Sugar-free / keto', 55, 61, 'var(--primary)'],
        ['Drizzled / enrobed', 70, 24, 'var(--sec-red)'],
      ];
      const y = (v) => padT + (1 - v / 100) * (H - padT - padB);
      const xL = padX, xR = W - padX;
      let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend-style slope of cookie clusters by WISEscore">`;
      svg += `<line x1="${xL}" y1="${padT}" x2="${xL}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>`;
      svg += `<line x1="${xR}" y1="${padT}" x2="${xR}" y2="${H - padB}" stroke="var(--border)" stroke-width="1"/>`;
      svg += `<text x="${xL}" y="${H - 12}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-muted)">Ingredient rank</text>`;
      svg += `<text x="${xR}" y="${H - 12}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-muted)">WISEscore</text>`;
      series.forEach(([lbl, a, b, col]) => {
        svg += `<line x1="${xL}" y1="${y(a).toFixed(1)}" x2="${xR}" y2="${y(b).toFixed(1)}" stroke="${col}" stroke-width="2.5"/>`;
        svg += `<circle cx="${xL}" cy="${y(a).toFixed(1)}" r="3.5" fill="${col}"/>`;
        svg += `<circle cx="${xR}" cy="${y(b).toFixed(1)}" r="3.5" fill="${col}"/>`;
        svg += `<text x="${xR + 8}" y="${(y(b) + 3).toFixed(1)}" font-size="9.5" font-weight="600" fill="var(--text)">${b}</text>`;
      });
      svg += `</svg>`;
      const legend = series.map(([lbl, , , col]) => `<span class="k"><span class="wa-dot" style="background:${col}"></span>${esc(lbl)}</span>`).join('');
      return `
        <div class="wa-block">
          <h3 class="wa-report-title wa-chart-title">Trend-style slopes</h3>
          <p class="wa-caption">Built from the current cookie ranking (not invented time trends): where chocolate falls later in the list, WISEscore climbs.</p>
          <div class="wa-chart-card">${svg}<div class="wa-chart-legend">${legend}</div></div>
        </div>`;
    }

            <p class="wa-report-lede">A full visual read of the chocolate chip cookie ranking — ranked views, a candidate shortlist, and trend-style slopes built from the current data rather than invented time trends. The set still contains noisy / incomplete ingredient lists, so the shortlist is best read as strong candidates plus package-verification candidates.</p>

          <span class="wa-manifest-name">${esc(o.title)}</span>
        </button>`).join('');

      manifestSrcListEl.innerHTML = (hasSrc ? MANIFEST_SOURCES : []).map((s) =>
        `<div class="wa-manifest-item wa-manifest-item--static">
          ${iconMarkup(s, 'wa-manifest-ic')}
          <span class="wa-manifest-name">${esc(s.title)}</span>
        </div>`).join('');

      /* Collapsed icon rail: output icons (clickable) · divider · source icons. */
      manifestRailEl.innerHTML =
        manifestOutputs.map((o) =>
          `<button type="button" class="wa-manifest-rail-ic" data-mf-block="${o.blockId}" title="${esc(o.title)}" aria-label="Open “${esc(o.title)}”"><span class="material-symbols-outlined">${esc(o.icon || 'insights')}</span></button>`
        ).join('') +
        (hasOut && hasSrc ? '<span class="wa-manifest-rail-div"></span>' : '') +
        (hasSrc ? MANIFEST_SOURCES.map((s) =>
          `<span class="wa-manifest-rail-ic wa-manifest-rail-ic--static" title="${esc(s.title)}">${s.logo ? `<img src="${s.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none" class="material-symbols-outlined">${esc(s.icon || 'public')}</span>` : `<span class="material-symbols-outlined">${esc(s.icon || 'public')}</span>`}</span>`
        ).join('') : '');
    }

    /* Chat three-dot "Hide outputs & sources" switch — fully show/hide the
       whole manifest (panel, rail AND re-open button). Applied lazily so it
       works whether or not the box has been built yet. */
    function setManifestOff(off) {
      manifestMenuOff = !!off;
      if (manifestBuilt) syncManifestState();
    }

    function syncManifestState() {
      if (!manifestBuilt || !host) return;
      const w = host.getBoundingClientRect().width;
      const wide = w >= MANIFEST_OPEN_W;
      manifestEl.classList.toggle('is-off', manifestMenuOff);
      manifestEl.classList.toggle('is-wide', wide);
      manifestEl.classList.toggle('is-hidden', manifestUserHidden);
      /* Narrow → always the icon rail (hover to peek). Wide → open unless the
         user manually collapsed it. */
      const collapsed = manifestUserHidden ? false : (wide ? manifestUserCollapsed : true);
      manifestEl.classList.toggle('is-collapsed', collapsed);
      /* The collapse control doubles as a pin-open toggle when collapsed. */
      const cBtn = manifestEl.querySelector('[data-mf="collapse"]');
      if (cBtn) {
        cBtn.querySelector('.material-symbols-outlined').textContent = collapsed ? 'unfold_more' : 'unfold_less';
        cBtn.title = collapsed ? 'Pin open' : 'Collapse to icons';
      }
    }

    function addManifestOutput(o) {
      buildManifest();
      if (!manifestSourcesSeeded) manifestSourcesSeeded = true;
      manifestOutputs.push(o);
      renderManifest();
      syncManifestState();
    }

    /* Open (or refresh) a pane block AND mirror it as an inline preview card. */
    function surfaceBlock(which, { icon, title, meta, html }) {
      const blockId = 'blk' + (++surfaceSeq);
      const tagged = tagBlock(html, blockId, title, meta, icon);
      openPane(which, { title, meta, html: tagged });
      SURFACED[blockId] = { which, title, meta, html: tagged };
      addManifestOutput({ blockId, which, icon, title });
      if (chat && typeof chat.addWISEai === 'function') {
        chat.addWISEai(surfaceCardHtml(blockId, which, icon, title, html), { source: '', feedback: false });
      }
    }

    /* Re-open a surfaced block from its inline preview. If the block is still in
       its pane, just bring the pane forward + scroll to it; otherwise re-add it. */
    function reopenSurface(blockId) {
      const e = SURFACED[blockId];
      if (!e) return;
      /* While merged, every block lives in the unified pane — look for it there. */
      const dest = mergedMode ? 'unified' : e.which;
      const pane = paneEl[dest];
      const present = paneBody[dest] && paneBody[dest].querySelector(`[data-block-id="${blockId}"]`);
      if (present) {
        if (pane && !pane.classList.contains('is-open')) pane.classList.add('is-open');
        if (paneBody[dest].classList.contains('is-carousel')) {
          const idx = Number(present.dataset.slideIndex);
          setPaneSlide(dest, Number.isNaN(idx) ? 0 : idx, { animate: true, scrollNav: true });
        } else {
          requestAnimationFrame(() => present.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      } else {
        openPane(e.which, { title: e.title, meta: e.meta, html: e.html });
      }
    }

    /* When a turn surfaces data, open/refresh the right panes shortly after the
       reply lands (so the transcript reads first, then the pane resolves). */
    function surface(intent) {
      setTimeout(() => {
        if (intent === 'brisket') {
          surfaceBlock('results', {
            icon: 'terminal',
            title: 'Gut Health · code evaluation',
            meta: 'WISEcode run · 18 ingredients parsed · score 64 (Good) · 38 steps',
            html: brisketCodeEvalView(),
          });
          surfaceBlock('visuals', {
            icon: 'stacked_bar_chart',
            title: 'Gut Health score drivers · brisket',
            meta: 'Modeled contribution of each ingredient group + headroom if sauerkraut moves higher',
            html: brisketChartView(),
          });
          surfaceBlock('results', {
            icon: 'summarize',
            title: 'The gut-health-optimized brisket',
            meta: 'WISEai report · ingredient roles, score bands & optimization',
            html: brisketReportView(),
          });
        } else if (intent === 'worst') {
          surfaceBlock('results', {
            icon: 'trending_down',
            title: 'Worst foods in the database',
            meta: '25 of 943,428 matches — all foods, sorted by WISEscore ascending',
            html: worstFoodsView(),
          });
        } else if (intent === 'spider') {
          surfaceBlock('results', {
            icon: 'format_list_numbered',
            title: '10 worst foods · gut & immune request',
            meta: '10 of 943,428 matches — sorted by WISEscore ascending · Gut Health & Excellent Source requested',
            html: tenWorstView(),
          });
          surfaceBlock('visuals', {
            icon: 'radar',
            title: 'Spider chart · 10 worst foods',
            meta: 'Requested sort: gut health & immune-system support. Only WISEscore returned data.',
            html: radarChart(),
          });
        } else if (intent === 'cupcake') {
          surfaceBlock('results', {
            icon: 'cake',
            title: 'Worst-ranked cupcake · detail',
            meta: 'What the search result confirms — full detail lookup failed',
            html: cupcakeDetailView(),
          });
        } else if (intent === 'cookie') {
          surfaceBlock('results', {
            icon: 'cookie',
            title: 'Best chocolate chip cookies',
            meta: "25 of 3,010 matches — category 'snacks,cookies' & name 'chocolate chip', sorted by WISEscore descending",
            html: cookiesView(),
          });
        } else if (intent === 'compare') {
          surfaceBlock('results', {
            icon: 'compare_arrows',
            title: 'Product comparison',
            meta: `${COMPARE_PRODUCTS.length} products \u00b7 WISEscore + ${COMPARE_METRICS.length} key metrics, ranked by WISEscore`,
            html: compareProductsView(),
          });
        } else if (intent === 'report') {
          surfaceBlock('results', {
            icon: 'summarize',
            title: 'Finding the best chocolate chip cookie',
            meta: 'WISEai report · ranked views, candidate shortlist & trend-style slopes',
            html: reportView(),
          });
          surfaceBlock('visuals', {
            icon: 'insights',
            title: 'Report visuals · cookie ranking',
            meta: 'Distribution, score curve & trend-style slopes built from the current data',
            html: reportVisualsView(),
          });
        }
      }, 660);
    }

    const host = document.getElementById('wa-chat');
    let chat = null;
    if (host) {
      chat = mountWISEaiChat(host, {
        title: 'WISEai\u2122',
        heading: 'WISEai\u2122, the intelligence for Food Truth\u2122.',
        sub: 'Search 943,428 foods, compare WISEscores, and turn any answer into a report — with results and visuals in their own panes.',
        subCounter: true,
        placeholder: 'Ask WISEai about any food\u2026',
        chipsFlow: 'wrap',
        inlineChips: true,
        persistChips: false,
        cardsHiddenDefault: false,
        sourceLabel: '',
        statusLabel: 'WISEai is searching',
        /* Small animated "thinking" dots docked under the input that pulse while
           WISEai is working, with a hover read-out of live token/cache/cost
           telemetry for the current turn and the whole conversation. */
        activity: true,
        userInitials: 'AK',
        historyKey: 'wise-chat-history:wiseai',
        /* History is a first-class, broken-out module on WISEai (docked to the
           left of the chat as a real flex sibling in #modules-row) rather than
           an in-chat overlay popover. It carries pane-style header chrome (a
           three-dot menu + width changer) and stays open as its own module. */
        historyBreakout: true,
        /* Open History docked from the very first load (no overlay step). */
        historyBreakoutDefault: true,
        /* Dress the broken-out History header like the result panes: serif
           masthead + three-dot menu + width changer (instead of the overlay's
           break-out / close buttons). */
        historyDockedControls: true,
        /* Add an MCP-server filter toggle to the right of the History search
           that narrows the list to conversations that used the MCP server. */
        historyMcpFilter: true,
        /* Preload a few past conversations so the three-dot → History pane opens
           on an established workspace you can jump back into. Each reuses the
           same verbatim replies the live transcript uses. Bump
           historySeedVersion whenever the seed below changes so every browser
           re-seeds to the latest on next load (clears saved threads there). */
        historySeedVersion: 2,
        historySeed: [
          {
            title: 'Build me a gut-healthy brisket recipe',
            msAgo: 40 * 60000,
            mcp: true,
            turns: [
              { role: 'you', text: 'If I was to make a brisket, what ingredients would give the best gut-health score?' },
              { role: 'wiseai', html: INTENT_REPLIES.brisket },
            ],
          },
          {
            title: 'What\u2019s the worst food in our database?',
            msAgo: 2 * 3600000,
            mcp: true,
            turns: [
              { role: 'you', text: 'What\u2019s the worst food in our database?' },
              { role: 'wiseai', html: INTENT_REPLIES.worst },
              { role: 'you', text: 'Tell me more about the worst-ranked cupcake' },
              { role: 'wiseai', html: INTENT_REPLIES.cupcake },
            ],
          },
          {
            title: 'Best chocolate chip cookie with the least chocolate',
            daysAgo: 1,
            mcp: false,
            turns: [
              { role: 'you', text: 'Best chocolate chip cookie with the least chocolate' },
              { role: 'wiseai', html: INTENT_REPLIES.cookie },
              { role: 'you', text: 'Show me a pretty report — all the charts & trends' },
              { role: 'wiseai', html: INTENT_REPLIES.report },
            ],
          },
          {
            title: 'Is this ingredient list ultra-processed?',
            daysAgo: 4,
            mcp: true,
            turns: [
              { role: 'you', text: 'Is this ingredient list ultra-processed?' },
              { role: 'wiseai', html: INTENT_REPLIES.upf },
              { role: 'you', text: 'Spider-chart the 10 worst foods by gut & immune health' },
              { role: 'wiseai', html: INTENT_REPLIES.spider },
            ],
          },
        ],
        intents: INTENTS,
        intentReplies: INTENT_REPLIES,
        reply,
        /* Retailer & food-data sources WISEai can pull verified product data
           from. The docked below-input rail is dropped (connectorsRail:false);
           sources now live in the three-dot "Connect a data source" side panel. */
        connectorsLabel: 'Connect a data source',
        connectorsRail: false,
        /* Every source is shown in the panel, so the trailing "more connectors"
           three-dot control is redundant — drop it. */
        connectorsMore: false,
        /* Enable the Turns Module — the three-dot "View turns" toggle opens a
           panel listing every turn, each with a "Fork from here" button that
           branches the conversation up to that point into a new chat of your
           own (the original is never touched; forks show a fork badge in
           History and a "Forked from …" banner). */
        turns: true,
        /* Let the Turns overlay "break out" into its own module docked to the
           right of the chat — a real flex sibling in #modules-row, dressed like
           the Results & Details / Visuals panes (same surface, border, radius,
           shadow & serif masthead via the #modules-row .wch-docked rules). */
        turnsBreakout: true,
        turnsBreakoutWidth: 380,
        /* Turns is OFF by default — the module is pre-built and docked to the
           right of the chat but starts hidden. Flipping the "Turns" switch in
           the chat's three-dot menu reveals it (it animates out from behind the
           chat); flipping it off tucks it back behind the chat. */
        turnsBreakoutDefault: false,
        /* Dress the broken-out Turns header like the result panes (serif
           masthead + three-dot menu + width changer). */
        turnsDockedControls: true,
        /* Search box pinned above the turn list to filter turns by question,
           answer text or artifact. */
        turnsSearch: true,
        /* Per-turn Share + Note (annotate) controls in addition to Fork/Jump. */
        turnsShare: true,
        turnsNotes: true,
        /* Sticky is the ONLY module style on WISEai — the docked History (left)
           and Turns (right) modules are always tucked in behind the chat card
           (flush, square inner corners, calmer surface, slightly shorter). The
           free-standing "breakout" look is gone. We still enable the shared
           "sticky" machinery (so the chat lays both flanking modules out at the
           equal, narrower sticky width and calls setSticky on them), default it
           permanently ON, and just pin the row's class so it can never fall back
           to breakout. The now-pointless menu toggle is stripped after mount. */
        stickyModules: true,
        stickyModulesDefault: true,
        onStickyModules: () => {
          const row = document.getElementById('modules-row');
          if (row) row.classList.add('modules-sticky');
        },
        /* "Hide outputs & sources" switch in the chat's three-dot menu — fully
           hides the floating Outputs / Sources manifest pinned to the chat's
           top-right. ON by default (the manifest stays hidden); flipping it off
           brings the component back. */
        outputsToggle: true,
        outputsToggleDefault: true,
        onToggleOutputs: (hidden) => setManifestOff(hidden),
        /* Chat three-dot "Share" opens WISEai's in-app share panel. */
        onShare: () => openShareModal(),
        connectors: [
          { id: 'kroger',   name: 'Kroger',              color: '#0f4b8f', mono: 'K', logo: 'https://www.google.com/s2/favicons?domain=kroger.com&sz=128', connected: true },
          { id: 'instacart', name: 'Instacart',          color: '#0AAD0A', icon: 'shopping_cart', logo: 'https://www.google.com/s2/favicons?domain=instacart.com&sz=128' },
          { id: 'walmart',  name: 'Walmart',             color: '#0071DC', mono: 'W', logo: 'https://www.google.com/s2/favicons?domain=walmart.com&sz=128', connected: true },
          { id: 'usda',     name: 'USDA FoodData Central', color: '#1F5C3D', icon: 'eco', logo: 'https://www.google.com/s2/favicons?domain=fdc.nal.usda.gov&sz=128' },
          { id: 'off',      name: 'Open Food Facts',      color: '#E64A19', icon: 'public', logo: 'https://www.google.com/s2/favicons?domain=openfoodfacts.org&sz=128' },
          { id: 'nielseniq', name: 'NielsenIQ',          color: '#1A2CC0', icon: 'insights', logo: 'https://www.google.com/s2/favicons?domain=nielseniq.com&sz=128' },
          { id: 'wholefoods', name: 'Whole Foods Market', color: '#00674B', mono: 'W', logo: 'https://www.google.com/s2/favicons?domain=wholefoodsmarket.com&sz=128' },
          { id: 'amazonfresh', name: 'Amazon Fresh',     color: '#FF9900', icon: 'local_grocery_store', logo: 'https://www.google.com/s2/favicons?domain=amazon.com&sz=128' },
          { id: 'spins',    name: 'SPINS',               color: '#6D28D9', icon: 'query_stats', logo: 'https://www.google.com/s2/favicons?domain=spins.com&sz=128' },
          { id: 'shopify',  name: 'Shopify',             color: '#5A863E', icon: 'storefront', logo: 'https://www.google.com/s2/favicons?domain=shopify.com&sz=128' },
        ],
        /* Large "at a glance" welcome cards — the big intent chips. */
        scorecards: {
          label: 'Start a conversation',
          cards: [
            { variant: 'wiseai', icon: 'auto_awesome', title: 'Is this ultra-processed?', desc: 'Paste an ingredient list for a WISEcode UPF read.', action: 'Ask', intent: 'upf', ask: 'Is this ingredient list ultra-processed?' },
            { variant: 'metric', icon: 'trending_down', pill: { tone: 'alert', icon: 'south', text: 'Lowest' }, metric: '0.06', title: 'Worst food in the database', desc: 'The bottom of the WISEscore ranking across 943,428 foods.', action: 'Show ranking', intent: 'worst', ask: 'What\u2019s the worst food in our database?' },
            { variant: 'wiseai', icon: 'radar', title: 'Spider-chart the 10 worst foods', desc: 'Compare the bottom of the ranking by gut & immune health.', action: 'Chart it', intent: 'spider', ask: 'Spider-chart the 10 worst foods by gut & immune health' },
            { variant: 'wiseai', icon: 'cake', title: 'Worst-ranked cupcake', desc: 'Dig into the single lowest-scoring cupcake and why it landed there.', action: 'Explain', intent: 'cupcake', ask: 'Tell me more about the worst-ranked cupcake' },
            { variant: 'metric', icon: 'cookie', pill: { tone: 'up', icon: 'north', text: 'Highest' }, metric: '3,010', title: 'Best chocolate chip cookie', desc: 'Highest-WISEscore cookies with the least chocolate.', action: 'Find it', intent: 'cookie', ask: 'Best chocolate chip cookie with the least chocolate' },
            { variant: 'wiseai', icon: 'compare_arrows', title: 'Compare a few products', desc: 'Grab a few products and put them head-to-head on the comparison board.', action: 'Compare', intent: 'compare', ask: 'Compare a few products side by side' },
            { variant: 'intro', icon: 'summarize', title: 'Build me a report', desc: 'Turn the cookie ranking into a full visual report with charts & trends.', action: 'Generate', intent: 'report', ask: 'Show me a pretty report — all the charts & trends' },
            { variant: 'wiseai', icon: 'hub', title: 'Connect a data source', desc: 'Link Kroger, Instacart, USDA FoodData Central & more so WISEai can pull verified product data.', action: 'Connect', intent: 'connect_source' },
            { variant: 'metric', icon: 'outdoor_grill', pill: { tone: 'up', icon: 'north', text: 'Good' }, metric: '64', title: 'Build a gut-healthy brisket', desc: 'Run a brisket ingredient list through the WISEcode Gut Health code evaluation.', action: 'Build it', intent: 'brisket', ask: 'If I was to make a brisket, what ingredients would give the best gut-health score?' },
            { variant: 'wiseai', icon: 'explore', title: 'Take a tour', desc: 'A quick guided walkthrough of WISEai — the panes, prompts & reports.', locked: true },
          ],
        },
        /* Open the right panes when a turn surfaces data; return false so the
           scripted reply still posts into the transcript. */
        onIntent(intent) {
          surface(intent);
          return false;
        },
      });

      /* Tapping an inline surface preview card re-opens its module on the right
         (delegated on the chat root so it covers every card in the transcript,
         including ones parked further up the conversation). */
      host.addEventListener('click', (e) => {
        const card = e.target.closest('.sc-surface-card[data-surface]');
        if (!card) return;
        reopenSurface(card.getAttribute('data-surface'));
      });
      host.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('.sc-surface-card[data-surface]');
        if (!card) return;
        e.preventDefault();
        reopenSurface(card.getAttribute('data-surface'));
      });

      /* History is toggled from the chat's own three-dot menu — inject the entry
         (the shared module wires data-sc="history" to the in-module sidebar). */
      const morePop = host.querySelector('.topbar-popover');
      if (morePop && !morePop.querySelector('[data-sc="history"]')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'topbar-menu-item sc-mcp-item';
        btn.setAttribute('data-sc', 'history');
        btn.setAttribute('role', 'menuitemcheckbox');
        btn.setAttribute('aria-checked', 'false');
        btn.innerHTML = '<span class="material-symbols-outlined topbar-menu-icon">history</span><span>History &amp; Projects</span><span class="sc-switch" aria-hidden="true"></span>';
        const div = document.createElement('div');
        div.className = 'topbar-menu-divider';
        morePop.insertBefore(div, morePop.firstChild);
        morePop.insertBefore(btn, div);
      }
      /* Sticky is now the only module style, so the "Sticky modules" switch has
         nothing to toggle — remove it from the menu. */
      if (morePop) morePop.querySelector('[data-sc="sticky"]')?.remove();

      /* "Merge outputs into one panel" switch — collapses the Results & Details
         and Visuals modules into a single #wa-unified module whose one thumbnail
         rail is grouped (Results · | · Visuals). Uses a custom data attr (not
         data-sc) so the chat module's own menu handler ignores it; we wire it
         ourselves and keep the menu open so the switch state reads back. */
      if (morePop && !morePop.querySelector('[data-merge-outputs]')) {
        const mBtn = document.createElement('button');
        mBtn.type = 'button';
        mBtn.className = 'topbar-menu-item topbar-menu-item--admin sc-mcp-item';
        mBtn.setAttribute('role', 'menuitemcheckbox');
        mBtn.setAttribute('aria-checked', 'false');
        mBtn.setAttribute('data-merge-outputs', '');
        mBtn.innerHTML = '<span class="material-symbols-outlined topbar-menu-icon">dashboard</span><span>Merge outputs into one panel</span><span class="topbar-menu-badge">Admin</span><span class="sc-switch" aria-hidden="true"></span>';
        /* Sit it just above the danger "Close conversation" item when present. */
        const closeItem = morePop.querySelector('[data-sc="close"]');
        const anchor = closeItem ? (closeItem.previousElementSibling?.classList.contains('topbar-menu-divider') ? closeItem.previousElementSibling : closeItem) : null;
        if (anchor) morePop.insertBefore(mBtn, anchor);
        else morePop.appendChild(mBtn);
        mergeMenuItem = mBtn;
        syncMergeMenu();
        mBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          applyMergeMode(!mergedMode);
        });
      }
    }
  </script>
</body>
</html>
