    /* Visible recompute: runs a scanning sweep over the board, then folds any
       pending entrants into the ranking with a settle animation and a chat
       summary of what changed. This is the "recalculate" moment the workflow
       hinges on — updates are deliberate and responsive, never silent. */
    function cmpRecalculate(arg) {
      /* `arg` is the clicked button (manual recalc via onclick) or an options
         object { auto: true } when triggered automatically after an add. */
      const btn = (arg && arg.nodeType) ? arg : null;
      const opts = (arg && !arg.nodeType) ? arg : {};
      const auto = !!opts.auto;
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-recalc-chips')?.remove();
      if (!compareState.stale || compareState.recalcing) return;
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;

      const pendingIds = (compareState.pending || []).slice();
      const addedNames = pendingIds.map(id => (scope.entities.find(e => e.id === id) || {}).name).filter(Boolean);

      if (!auto) addUserMessage('Recalculate the comparison');
      compareState.recalcing = true;
      renderCompare();
      scrollPanelIntoView('compare-panel');
      const typing = showWISEcodeAITyping(auto
        ? ('WISEcodeAI is scoring the new ' + (scope.noun === 'portfolio' ? 'brand' : 'product') + ' and re-ranking')
        : 'WISEcodeAI is recomputing scores and re-ranking');

      setTimeout(() => {
        typing?.remove();
        compareState.recalcing = false;
        compareState.stale = false;
        compareState.pending = [];
        compareState._settle = true;   /* one-shot: triggers the pop animation */
        renderCompare();
        scrollPanelIntoView('compare-panel');

        const afterLive = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e)).filter(e => !e.na);
        const afterOrder = afterLive.slice().sort((a, b) => cmpScoreFor(b, 'wisescore') - cmpScoreFor(a, 'wisescore'));
        const winner = afterOrder[0];
        const nounPlural = scope.noun === 'portfolio' ? 'portfolios' : 'products';
        const newcomerNote = addedNames.length
          ? '<strong>' + addedNames.join('</strong>, <strong>') + '</strong> ' + (addedNames.length > 1 ? 'are' : 'is') + ' now scored and ranked. '
          : '';
        const winnerNote = winner
          ? '<strong>' + winner.name + '</strong> leads with a WISEscore of <strong>' + Math.round(cmpScoreFor(winner, 'wisescore')) + '</strong>. '
          : '';
        addWISEcodeAIMessage('Recalculated — all <strong>' + afterLive.length + '</strong> ' + nounPlural + ' rescored. ' + newcomerNote + winnerNote + 'Ranking, grade bars, takeaways and any category read all refreshed.', { source: false });

        if (compareState.followDone) delete compareState.followDone.add;
        cmpOfferFollowChips();
      }, 1050);
    }

    /* Category-average value for a metric (deterministic, filter-aware). */
    function cmpAvgFor(scope, metricId, category) {
      const base = 58;
      return Math.max(20, Math.min(88, base + ((cmpHash('avg:' + scope.key + ':' + category + ':' + metricId) % 17) - 8)));
    }
    function cmpEntitiesShown() {
      const scope = CMP_SCOPES[compareState.scope];
      return compareState.shown.map(id => scope.entities.find(e => e.id === id)).filter(Boolean);
    }
    /* Attach category count / N/A flag for portfolio scopes under a filter. */
    function cmpResolveEntity(scope, ent) {
      const out = Object.assign({}, ent);
      const kind = cmpEntKind(ent, scope);
      out.kind = kind;
      if (kind === 'category') {
        out.na = false; out.isCategory = true;
        out.catLine = (ent.catName || ent.name) + ' · category avg';
      } else if (kind === 'portfolio') {
        if (compareState.category !== 'all') {
          const n = (ent.cats && ent.cats[compareState.category]) || 0;
          out.count = n; out.na = n === 0; out.catLine = compareState.category + ' · ' + n + ' products';
        } else {
          const total = ent.cats ? Object.values(ent.cats).reduce((a, b) => a + b, 0) : 0;
          out.count = total; out.na = false; out.catLine = 'Portfolio · ' + total + ' products';
        }
      } else {
        out.na = false; out.catLine = ent.cat;
      }
      return out;
    }

    /* Replay a metric bar's grow-in animation on click. Clearing the
       animation, forcing a reflow, then restoring it re-triggers @keyframes;
       the delay is zeroed so the click feels immediate. */
    function cmpReplayBar(cell) {
      const fill = cell && cell.querySelector ? cell.querySelector('.cmp-bar-fill') : null;
      if (!fill) return;
      fill.style.animation = 'none';
      fill.style.animationDelay = '0s';
      void fill.offsetWidth;            /* flush styles so the animation restarts */
      fill.style.animation = '';        /* revert to the stylesheet animation */
      fill.style.animationDelay = '0s';
    }

    /* Count a WISEscore number up from 0 to its target with an ease-out. */
    function cmpCountUp(el, to, dur) {
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);   /* easeOutCubic */
        el.textContent = Math.round(to * eased);
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = to;
      }
      requestAnimationFrame(tick);
    }

    /* Reanimate the WISEscore cells — each number counts up from 0, staggered
       left-to-right so it reads like the bars replaying. */
    function cmpReplayScores() {
      const nums = document.querySelectorAll('.cmp-score-num[data-score]');
      nums.forEach((el, i) => {
        const to = parseInt(el.getAttribute('data-score'), 10) || 0;
        el.textContent = '0';
        setTimeout(() => cmpCountUp(el, to, 700), i * 90);
      });
    }

    /* ── Circular WISEscore gauge (on each header tile) ─────────────────────
       The overall score is promoted from the old score row onto the entity's
       image tile as a centred circular gauge: a full-circle track with a
       coloured arc that sweeps to the score, the number counting up in the
       middle, and the Top-% pill beneath. */
    const CMP_GAUGE_R = 42;                          /* SVG circle radius */
    const CMP_GAUGE_C = 2 * Math.PI * CMP_GAUGE_R;   /* its circumference */
    function cmpScoreGaugeHtml(ov, pillCls, color, top) {
      /* Top-% pill rides at the top-left, directly beneath the kind chip; the
         gauge itself floats large in the centre of the tile. */
      return '<span class="cmp-tile-toppill cmp-top-pill ' + pillCls + '">' + (top || 'Top 50%') + '</span>' +
        '<button type="button" class="cmp-gauge" data-score="' + ov + '" style="--gauge-color:' + color + '" ' +
          'onclick="event.stopPropagation();cmpAnimateGauge(this)" title="Replay WISEscore" aria-label="WISEscore ' + ov + ' — tap to replay">' +
          '<svg class="cmp-gauge-svg" viewBox="0 0 100 100" aria-hidden="true">' +
            '<circle class="cmp-gauge-track" cx="50" cy="50" r="' + CMP_GAUGE_R + '"></circle>' +
            '<circle class="cmp-gauge-arc" cx="50" cy="50" r="' + CMP_GAUGE_R + '" ' +
              'stroke-dasharray="' + CMP_GAUGE_C.toFixed(1) + '" stroke-dashoffset="' + CMP_GAUGE_C.toFixed(1) + '"></circle>' +
          '</svg>' +
          '<span class="cmp-gauge-center"><span class="cmp-gauge-num" data-score="' + ov + '">' + ov + '</span>' +
            '<span class="cmp-gauge-lbl">WISEscore<span class="title-tm">™</span></span></span>' +
        '</button>';
    }

    /* Sweep a single gauge's arc to its score and count the number up. Restarts
       cleanly each call so clicking the gauge replays it. */
    function cmpAnimateGauge(el) {
      if (!el) return;
      const arc = el.querySelector('.cmp-gauge-arc');
      const num = el.querySelector('.cmp-gauge-num');
      const to = parseInt(el.getAttribute('data-score'), 10) || 0;
      if (arc) {
        arc.style.transition = 'none';
        arc.style.strokeDashoffset = CMP_GAUGE_C.toFixed(1);
        void arc.getBoundingClientRect();          /* flush so the sweep restarts */
        arc.style.transition = 'stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1)';
        arc.style.strokeDashoffset = (CMP_GAUGE_C * (1 - to / 100)).toFixed(1);
      }
      if (num) { num.textContent = '0'; cmpCountUp(num, to, 850); }
    }

    /* Replay every header gauge, staggered left-to-right like the bars/scores. */
    function cmpReplayGauges() {
      const gauges = document.querySelectorAll('.cmp-gauge[data-score]');
      gauges.forEach((el, i) => setTimeout(() => cmpAnimateGauge(el), i * 110));
    }

    /* Count the Key Takeaway card scores up, staggered across the cards. */
    function cmpReplayTakeaways() {
      const nums = document.querySelectorAll('.cmp-takeaway-score[data-count]');
      nums.forEach((el, i) => {
        const to = parseInt(el.getAttribute('data-count'), 10) || 0;
        el.textContent = '0';
        setTimeout(() => cmpCountUp(el, to, 700), i * 90);
      });
    }

    /* Replay every bar in a single metric row — triggered from the rail icon.
       Restarts each fill's grow-in with a small left-to-right stagger. */
    function cmpReplayRow(mi) {
      const fills = document.querySelectorAll('.cmp-metric-cell[data-mrow="' + mi + '"] .cmp-bar-fill');
      fills.forEach((fill, i) => {
        fill.style.animation = 'none';
        fill.style.animationDelay = '0s';
        void fill.offsetWidth;          /* flush styles so the animation restarts */
        fill.style.animation = '';      /* revert to the stylesheet animation */
        fill.style.animationDelay = (i * 60) + 'ms';
      });
    }

    /* ── Chart-type toggle (health bars ⇄ spider ⇄ parallel coords ⇄ race) ── */
    function cmpSetChartMode(mode) {
      const m = (mode === 'radar' || mode === 'parallel' || mode === 'race') ? mode : 'bars';
      if (compareState.chartMode === m) return;
      const prev = compareState.chartMode;
      /* The race chart shows the category average by default. We stash the
         user's global setting when entering race and restore it on the way out,
         so this default applies to the race chart only. */
      if (m === 'race') {
        compareState._preRaceAvg = compareState.showAvg;
        compareState.showAvg = true;
      } else if (prev === 'race' && compareState._preRaceAvg != null) {
        compareState.showAvg = compareState._preRaceAvg;
        compareState._preRaceAvg = null;
      }
      compareState.chartMode = m;
      renderCompare();
      scrollPanelIntoView('compare-panel');
    }

    /* A circular legend marker that matches each entity's KIND:
         • product   → the product's photo inside the circle
         • portfolio → the brand's logo inside the circle
         • category  → the category icon on the entity's colour
       Falls back to the brand-colour monogram when no artwork exists. Shared by
       every comparison chart legend so the spider, parallel, and race charts
       all read with the same visual language as the board tiles. */
    /* The inner content of a kind-aware circular bug (shared by the legend and
       the in-chart vertex markers so both always read identically): a category
       icon, or a brand/product photo layered over its monogram fallback. */
    function cmpBugInner(ent) {
      const kind = ent.kind || (ent.isCategory ? 'category' : 'product');
      if (kind === 'category') {
        return `<span class="material-symbols-outlined">${ent.icon || cmpKindIcon('category')}</span>`;
      }
      const imgUrl = cmpImgUrl(ent);
      const mono = ent.abbr || (ent.name ? ent.name[0] : '?');
      const img = imgUrl
        ? `<img src="${imgUrl}" alt="" loading="lazy" onerror="this.remove()">`
        : '';
      return `${mono}${img}`;
    }
    function cmpLegendBug(ent) {
      const color = ent.color || cmpMetricColor('wisescore');
      const kind = ent.kind || (ent.isCategory ? 'category' : 'product');
      const catCls = kind === 'category' ? ' cmp-legend-bug--cat' : '';
      return `<span class="cmp-legend-bug${catCls}" style="--lc:${color}" aria-hidden="true">${cmpBugInner(ent)}</span>`;
    }

    /* Assemble a full chart legend from the entities on the board, each row
       carrying a kind-aware circular marker + name, with an optional dashed
       category-average key appended. */
    function cmpLegendHTML(ents, showAvg) {
      const keys = ents.map(ent =>
        `<span class="cmp-radar-key">${cmpLegendBug(ent)}<span class="cmp-radar-key-name">${ent.name}</span></span>`).join('');
      const avg = showAvg
        ? '<span class="cmp-radar-key"><span class="cmp-radar-swatch cmp-radar-swatch--avg"></span><span class="cmp-radar-key-name">Category avg</span></span>'
        : '';
      return keys + avg;
    }

    /* Build the overlaid spider/radar chart: one axis per selected metric,
       one translucent polygon per entity (in the entity's own brand colour),
       plus an optional dashed category-average ring. Returns an HTML string. */
    function cmpRadarSection(scope, metrics, ents, showAvg, valFn) {
      const val = valFn || ((e, mm) => cmpScoreFor(e, mm.id));
      const M = metrics.length;
      if (M < 3) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">radar</span>' +
          'Add at least 3 metrics from the <strong>Metrics</strong> menu to plot a spider chart.' +
          '</div></div>';
      }
      if (!ents.length) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">radar</span>Nothing scored yet — recalculate to plot the spider chart.</div></div>';
      }

      const size = 320, cx = size / 2, cy = size / 2, R = size / 2 - 46;
      const rings = [0.25, 0.5, 0.75, 1];
      const ang = i => (Math.PI * 2 * i / M) - Math.PI / 2;
      const pt = (i, r) => [cx + Math.cos(ang(i)) * R * r, cy + Math.sin(ang(i)) * R * r];
      const ptsAt = r => metrics.map((_, i) => pt(i, r).map(n => n.toFixed(1)).join(',')).join(' ');

      /* Concentric grid rings + value labels on the vertical axis. */
      let gridEls = rings.map(rr =>
        `<polygon class="cmp-radar-ring" points="${ptsAt(rr)}"></polygon>`).join('');
      gridEls += rings.map(rr =>
        `<text class="cmp-radar-tick" x="${cx + 3}" y="${(cy - R * rr).toFixed(1)}">${Math.round(rr * 100)}</text>`).join('');

      /* Spokes + metric labels. */
      const axisEls = metrics.map((m, i) => {
        const [x, y] = pt(i, 1);
        const [lx, ly] = pt(i, 1.16);
        const anchor = Math.abs(lx - cx) < 6 ? 'middle' : (lx > cx ? 'start' : 'end');
        return `<line class="cmp-radar-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"></line>` +
          `<text class="cmp-radar-label" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${cmpMetricShort(m)}</text>`;
      }).join('');

      /* Optional dashed category-average polygon. */
      let avgEls = '';
      if (showAvg) {
        const pts = metrics.map((m, i) => {
          const v = Math.max(0, Math.min(100, cmpAvgFor(scope, m.id, compareState.category)));
          return pt(i, v / 100).map(n => n.toFixed(1)).join(',');
        }).join(' ');
        avgEls = `<polygon class="cmp-radar-avg" points="${pts}"></polygon>`;
      }

      /* One outline polygon per entity — stroke only, no opaque centre fill, so
         overlapping entities never muddy each other. */
      const polyEls = ents.map((ent, ei) => {
        const color = ent.color || cmpMetricColor('wisescore');
        const coords = metrics.map((m, i) => {
          const v = Math.max(0, Math.min(100, val(ent, m)));
          return pt(i, v / 100);
        });
        const pts = coords.map(c => c.map(n => n.toFixed(1)).join(',')).join(' ');
        const dash = (ent.kind === 'category' || ent.isCategory) ? ';stroke-dasharray:5 4' : '';
        return `<g class="cmp-radar-series" style="--delay:${ei * 90}ms">` +
          `<polygon class="cmp-radar-area" points="${pts}" style="fill:none;stroke:${color}${dash}"></polygon></g>`;
      }).join('');

      /* Vertex bugs — the same kind-aware circular markers used by the parallel
         chart and the legend, layered over the SVG as an HTML overlay positioned
         as a percentage of the (square) plot. Primary/"YOU" sits on top. */
      const bugEls = ents.map((ent, ei) => {
        const color = ent.color || cmpMetricColor('wisescore');
        const kind = ent.kind || (ent.isCategory ? 'category' : 'product');
        const catCls = kind === 'category' ? ' cmp-legend-bug--cat' : '';
        const z = ent.primary ? 30 : (10 + ei);
        return metrics.map((m, i) => {
          const v = Math.max(0, Math.min(100, val(ent, m)));
          const c = pt(i, v / 100);
          const lx = (c[0] / size * 100).toFixed(2);
          const ty = (c[1] / size * 100).toFixed(2);
          const delay = ei * 90 + i * 90 + 90;
          return `<span class="cmp-legend-bug cmp-par-bug${catCls}" ` +
            `style="--lc:${color};left:${lx}%;top:${ty}%;z-index:${z};` +
            `animation-delay:${delay}ms" aria-hidden="true">${cmpBugInner(ent)}</span>`;
        }).join('');
      }).join('');

      const legend = cmpLegendHTML(ents, showAvg);

      return '<div class="cmp-radar-wrap">' +
        '<div class="cmp-radar-head"><span class="cmp-radar-title">All metrics overlaid</span>' +
        '<span class="cmp-radar-sub">' + M + ' metrics · ' + ents.length + ' ' + (scope.noun === 'portfolio' ? 'brands' : 'products') + '</span></div>' +
        '<div class="cmp-radar-canvas">' +
          '<div class="cmp-radar-stage">' +
            `<svg viewBox="0 0 ${size} ${size}" class="cmp-radar-svg" role="img" aria-label="Spider chart overlaying all metrics for each ${scope.noun}">` +
              gridEls + axisEls + avgEls + polyEls +
            '</svg>' +
            '<div class="cmp-par-bugs">' + bugEls + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="cmp-radar-legend">' + legend + '</div>' +
      '</div>';
    }

    /* Build the multi-series parallel-coordinates plot: one vertical axis per
       selected metric, one polyline per entity threading its value across every
       axis (drawn in the entity's brand colour), plus an optional dashed
       category-average line. Returns an HTML string. */
    function cmpParallelSection(scope, metrics, ents, showAvg, valFn) {
      const val = valFn || ((e, mm) => cmpScoreFor(e, mm.id));
      const M = metrics.length;
      if (M < 2) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">ssid_chart</span>' +
          'Add at least 2 metrics from the <strong>Metrics</strong> menu to plot parallel coordinates.' +
          '</div></div>';
      }
      if (!ents.length) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">ssid_chart</span>Nothing scored yet — recalculate to plot parallel coordinates.</div></div>';
      }

      const W = 680, H = 212;
      const padT = 18, padB = 14, padL = 38, padR = 26;
      const plotH = H - padT - padB;
      const axisX = i => (M === 1 ? W / 2 : padL + (W - padL - padR) * i / (M - 1));
      const yFor = v => padT + (1 - Math.max(0, Math.min(100, v)) / 100) * plotH;

      /* Horizontal reference gridlines across all axes + value ticks on the left. */
      const rings = [0, 25, 50, 75, 100];
      let gridEls = rings.map(rv =>
        `<line class="cmp-par-grid" x1="${axisX(0).toFixed(1)}" y1="${yFor(rv).toFixed(1)}" x2="${axisX(M - 1).toFixed(1)}" y2="${yFor(rv).toFixed(1)}"></line>` +
        `<text class="cmp-par-tick" x="${(axisX(0) - 6).toFixed(1)}" y="${(yFor(rv) + 3).toFixed(1)}" text-anchor="end">${rv}</text>`).join('');

      /* Vertical axes + a cap dot at the top of each. The metric labels are
         rendered as HTML below the plot (not SVG text) so they can wrap to
         multiple lines and stay on one shared baseline — never staggered. */
      const axisEls = metrics.map((m, i) => {
        const x = axisX(i);
        return `<line class="cmp-par-axis" x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${(padT + plotH).toFixed(1)}"></line>` +
          `<circle class="cmp-par-axis-dot" cx="${x.toFixed(1)}" cy="${padT}" r="2.8"></circle>`;
      }).join('');

      /* HTML label per axis, positioned by the same fractional x as the axis,
         width-capped to just under the axis spacing so neighbours never touch —
         extra metrics simply wrap onto more lines rather than colliding. */
      const stepPct = M > 1 ? ((axisX(1) - axisX(0)) / W * 100) : 60;
      const maxWPct = (stepPct * 0.94).toFixed(2);
      const labelEls = metrics.map((m, i) => {
        const isStart = i === 0, isEnd = i === M - 1;
        const pctX = axisX(i) / W * 100;
        const cls = isStart ? ' is-start' : (isEnd ? ' is-end' : '');
        /* Anchor the last label by `right` so its auto width isn't squeezed by
           the container's edge (which was forcing "Protein" to wrap). */
        const posStyle = isEnd ? `right:${(100 - pctX).toFixed(2)}%` : `left:${pctX.toFixed(2)}%`;
        return `<span class="cmp-par-xlabel${cls}" style="${posStyle};max-width:${maxWPct}%">${cmpMetricShort(m)}</span>`;
      }).join('');

      /* Optional dashed category-average line. */
      let avgEls = '';
      if (showAvg) {
        const pts = metrics.map((m, i) => {
          const v = cmpAvgFor(scope, m.id, compareState.category);
          return `${axisX(i).toFixed(1)},${yFor(v).toFixed(1)}`;
        }).join(' ');
        avgEls = `<polyline class="cmp-par-avg" points="${pts}"></polyline>`;
      }

      /* One polyline per entity, in its own brand colour. The vertices are NOT
         plain dots — they're the same kind-aware circular bugs the legend uses
         (brand logo / product photo / category icon), rendered as an HTML layer
         over the SVG so the chart and legend read with one visual language. */
      const seriesEls = ents.map((ent, ei) => {
        const color = ent.color || cmpMetricColor('wisescore');
        const coords = metrics.map((m, i) => [axisX(i), yFor(val(ent, m))]);
        const pts = coords.map(c => `${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ');
        return `<g class="cmp-par-series-g" style="--delay:${ei * 90}ms">` +
          `<polyline class="cmp-par-series" points="${pts}" pathLength="1" style="stroke:${color};--delay:${ei * 90}ms"></polyline></g>`;
      }).join('');

      /* Vertex bugs, positioned as a percentage of the plot so they land exactly
         on each polyline node. The primary/"YOU" entity is layered on top so its
         marker is never hidden when scores bunch together. */
      const bugEls = ents.map((ent, ei) => {
        const color = ent.color || cmpMetricColor('wisescore');
        const kind = ent.kind || (ent.isCategory ? 'category' : 'product');
        const catCls = kind === 'category' ? ' cmp-legend-bug--cat' : '';
        const z = ent.primary ? 30 : (10 + ei);
        return metrics.map((m, i) => {
          const lx = (axisX(i) / W * 100).toFixed(2);
          const ty = (yFor(val(ent, m)) / H * 100).toFixed(2);
          const delay = ei * 90 + i * 90 + 90;
          return `<span class="cmp-legend-bug cmp-par-bug${catCls}" ` +
            `style="--lc:${color};left:${lx}%;top:${ty}%;z-index:${z};` +
            `animation-delay:${delay}ms" aria-hidden="true">` +
            `${cmpBugInner(ent)}</span>`;
        }).join('');
      }).join('');

      const legend = cmpLegendHTML(ents, showAvg);

      return '<div class="cmp-radar-wrap">' +
        '<div class="cmp-radar-head"><span class="cmp-radar-title">Parallel coordinates</span>' +
        '<span class="cmp-radar-sub">' + M + ' metrics · ' + ents.length + ' ' + (scope.noun === 'portfolio' ? 'brands' : 'products') + '</span></div>' +
        '<div class="cmp-par-plot">' +
          '<div class="cmp-radar-canvas cmp-par-canvas">' +
            `<svg viewBox="0 0 ${W} ${H}" class="cmp-par-svg" role="img" aria-label="Parallel coordinates plot threading every metric for each ${scope.noun}">` +
              gridEls + axisEls + avgEls + seriesEls +
            '</svg>' +
            '<div class="cmp-par-bugs">' + bugEls + '</div>' +
          '</div>' +
          '<div class="cmp-par-labels">' + labelEls + '</div>' +
        '</div>' +
        '<div class="cmp-radar-legend">' + legend + '</div>' +
      '</div>';
    }

    /* Build the "race" chart: one horizontal 0–100 track per metric with each
       entity rendered as a circular brand bug (logo or monogram) positioned by
       its score, the number tucked underneath. Runners slide in from the start
       line so the metrics read like a race. The right column carries the
       category average, with an optional dashed avg marker on each track.
       Returns an HTML string. */
    function cmpRaceSection(scope, metrics, ents, showAvg, valFn) {
      const val = valFn || ((e, mm) => cmpScoreFor(e, mm.id));
      const M = metrics.length;
      if (!M) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">sports_score</span>' +
          'Add at least 1 metric from the <strong>Metrics</strong> menu to line up the race.' +
          '</div></div>';
      }
      if (!ents.length) {
        return '<div class="cmp-radar-wrap"><div class="cmp-radar-note">' +
          '<span class="material-symbols-outlined">sports_score</span>Nothing scored yet — recalculate to run the race.</div></div>';
      }

      /* One track per metric. Runners are stacked so close scores overlap like
         the reference — the primary/YOU entity always sits on top. The category
         average sits inline, right of the metric label, as plain text. */
      const rows = metrics.map((m, mi) => {
        const avg = cmpAvgFor(scope, m.id, compareState.category);
        const avgMark = showAvg
          ? `<span class="cmp-race-avgmark" style="left:${Math.max(0, Math.min(100, avg))}%"></span>`
          : '';
        const avgInline = showAvg
          ? `<span class="cmp-race-avg-inline">Category average <b>${Math.round(avg)}</b></span>`
          : '';
        const runners = ents.map((ent, ei) => {
          const v = Math.max(0, Math.min(100, val(ent, m)));
          const pos = Math.round(v);
          const color = ent.color || cmpMetricColor('wisescore');
          const kind = ent.kind || (ent.isCategory ? 'category' : 'product');
          const catCls = kind === 'category' ? ' cmp-race-bug--cat' : '';
          const pc = ent.primary ? ' is-primary' : '';
          return `<div class="cmp-race-runner${pc}" style="--pos:${pos}%;--rc:${color};--delay:${ei * 110}ms;z-index:${ent.primary ? 6 : ei + 1}" aria-label="${ent.name}: ${pos}">` +
            `<span class="cmp-race-bug${catCls}">${cmpBugInner(ent)}</span>` +
            `<span class="cmp-race-num">${pos}</span>` +
            `<span class="cmp-race-pop"><span class="cmp-race-pop-dot" style="background:${color}"></span>` +
              `<span class="cmp-race-pop-name">${ent.name}</span><span class="cmp-race-pop-score">${pos}</span></span>` +
          `</div>`;
        }).join('');
        return '<div class="cmp-race-row">' +
          `<div class="cmp-race-metric"><span class="cmp-race-metric-ic cmp-race-metric-ic--btn" role="button" tabindex="0" title="Replay this race" aria-label="Replay ${cmpMetricShort(m)} race" onclick="cmpRaceReplayRow(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cmpRaceReplayRow(this)}"><span class="material-symbols-outlined">${m.icon}</span></span>` +
          `<span class="cmp-race-metric-name">${cmpMetricShort(m)}</span>${avgInline}</div>` +
          `<div class="cmp-race-track" title="Click to replay" onclick="cmpRaceReplayRow(this)"><span class="cmp-race-lane"></span>${avgMark}${runners}</div>` +
        '</div>';
      }).join('');

      const legend = cmpLegendHTML(ents, showAvg);

      return '<div class="cmp-radar-wrap">' +
        '<div class="cmp-radar-head"><span class="cmp-radar-title">Metric race</span>' +
        '<span class="cmp-radar-sub">' + M + ' metrics · ' + ents.length + ' ' + (scope.noun === 'portfolio' ? 'brands' : 'products') + '</span></div>' +
        rows +
        '<div class="cmp-radar-legend">' + legend + '</div>' +
      '</div>';
    }

    /* Re-run the racing animation for a single row — call from either the metric
       icon or a click anywhere on the track. Restarting the CSS animation is a
       matter of clearing it, forcing a reflow, then letting it re-apply (the
       per-runner --delay reinstates the staggered start). */
    function cmpRaceReplayRow(el) {
      const row = el.closest('.cmp-race-row');
      if (!row) return;
      row.querySelectorAll('.cmp-race-runner').forEach(r => {
        r.style.animation = 'none';
        void r.offsetWidth;
        r.style.animation = '';
      });
    }

    /* ── Guiding Stars ──────────────────────────────────────────────────
       The pink header toggle flips the board into a Guiding Stars-style
       nutrition rating table. Ratings are DERIVED deterministically from each
       entity's existing 0–100 goodness scores so the view stays live as the
       shelf set changes: goodness scores are back-solved into plausible
       per-100-kcal nutrient values, those drive debit/credit points, and the
       net score maps to a 0–3 star rating (with a disqualifier gate). */
    function cmpToggleGuidingStars(on) {
      compareState.guidingStars = (on == null) ? !compareState.guidingStars : !!on;
      /* Keep the ⋯ menu switch item (if built) in sync with the new state. */
      document.querySelectorAll('.pf-module-menu').forEach(m => { if (m._syncGsItem) m._syncGsItem(); });
      renderCompare();
      /* Reflect the flip in the chat module: the intent chips are view-specific
         (Guiding Stars chips vs. the default action chips), so re-offer them
         whenever the board flips — including from the ⋯ menu switch, which
         previously left the chat's chips stale. Guarded on an existing chip row
         so it only runs during the interactive phase, not the scripted intro. */
      if (document.getElementById('cmp-follow-chips')) cmpOfferFollowChips();
    }

    /* Guiding Stars uses different scoring algorithms per food group; pick one
       deterministically from the entity's category so the "Algorithm" row reads
       like the reference tool. */
    function cmpGsAlgorithm(ent) {
      const c = ((ent.cat || ent.catLine || '') + '').toLowerCase();
      if (/meat|poultry|fish|nut|dip|sauce|protein/.test(c)) return 'Meat/Dairy/Nuts';
      if (/oil|fat|butter|spread/.test(c)) return 'Fats/Oils';
      if (/drink|beverage|juice|soda|water/.test(c)) return 'Beverages';
      return 'General Foods';
    }

    /* Back-solve a Guiding Stars scorecard for one entity from its goodness
       scores. Returns per-100-kcal nutrients, debit/credit points, the summed
       score, a disqualified flag and a 0–3 star rating. */
    function cmpGuidingStarsData(ent, algoOverride) {
      /* The active algorithm comes from the toolbar selector; 'auto' (or an
         unset override) falls back to the per-food auto-detected algorithm. */
      const sel = algoOverride || ((typeof compareState !== 'undefined' && compareState.gsAlgorithm) || 'auto');
      const algo = (sel && sel !== 'auto') ? sel : cmpGsAlgorithm(ent);
      const nut   = cmpScoreFor(ent, 'nutrient_overall'); /* higher = more nutritious            */
      const sugar = cmpScoreFor(ent, 'sugar_density');    /* higher = less added sugar            */
      const fatQ  = cmpScoreFor(ent, 'fat_quality');      /* higher = better fat profile          */
      const fiberD= cmpScoreFor(ent, 'fiber_density');    /* higher = more fiber                  */
      const upf   = cmpScoreFor(ent, 'upf');              /* higher = less processed              */
      const clean = cmpScoreFor(ent, 'clean_label');      /* higher = fewer additives             */
      const h = cmpHash(ent.id);

      const servingSize = 15 + (h % 385);                       /* g   */
      const calories = 90 + ((h >> 3) % 380);                   /* kcal */

      /* Per-100-kcal nutrient values, back-solved from goodness. */
      const satFat     = Math.max(0, +(((100 - fatQ)  / 100) * 2.6 + (h % 5) / 10).toFixed(1));
      const sodium     = Math.max(0, Math.round(((100 - upf)   / 100) * 230 + ((h >> 4) % 40)));
      const addedSugar = Math.max(0, +(((100 - sugar) / 100) * 21).toFixed(1));
      const fiber      = Math.max(0, +((fiberD / 100) * 3.2).toFixed(1));

      /* Debit points (negative) — Guiding Stars penalizes sat fat, sugar,
         sodium, trans fat and non-GRAS/cosmetic additives. */
      const dSat   = satFat     >= 2   ? -2 : satFat     >= 1   ? -1 : 0;
      const dSugar = addedSugar >= 12  ? -3 : addedSugar >= 6   ? -2 : addedSugar >= 2 ? -1 : 0;
      const dSod   = sodium     >= 240 ? -2 : sodium     >= 120 ? -1 : 0;
      const dTrans = (h % 17) === 0 ? -1 : 0;               /* trans fat is rare — usually 0 */
      const dAdd   = clean < 45 ? -2 : clean < 66 ? -1 : 0;

      /* Credit points (positive) — fiber, micronutrients, whole grain. */
      let cFiber = fiber >= 2.5 ? 2 : fiber >= 1.4 ? 1 : 0;
      const cVit   = nut   >= 78  ? 2 : nut   >= 62  ? 1 : 0;
      const isGrain = /grain|granola|cereal|oat|muesli|bread|pasta|flake/.test(((ent.cat || ent.catLine || '') + '').toLowerCase());
      let cWhole = isGrain ? (upf >= 70 ? 1 : 0) : null;  /* null → "—" for non-grain foods */

      /* Algorithm-specific tuning — Guiding Stars scores food groups on their
         own terms. Fats/Oils and Meat/Dairy/Nuts expect more saturated fat, so
         that debit is relaxed; Beverages are judged harder on sugar; whole
         grain only credits grain-family General Foods. */
      let dSatA = dSat, dSodA = dSod, dSugarA = dSugar;
      if (algo === 'Meat/Dairy/Nuts') { dSatA = Math.min(0, dSat + 1); cWhole = null; }
      else if (algo === 'Fats/Oils') { dSatA = Math.min(0, dSat + 1); dSodA = Math.min(0, dSod + 1); cWhole = null; }
      else if (algo === 'Beverages') { dSugarA = Math.max(-3, dSugar - 1); cFiber = Math.min(cFiber, 1); cWhole = null; }
      else if (algo !== 'General Foods') { cWhole = null; }

      const score = dSatA + dSugarA + dSodA + dTrans + dAdd + cFiber + cVit + (cWhole || 0);
      /* Disqualifiers: heavy additive load or high processing knocks a product
         out of the star system entirely, matching the reference behaviour. */
      const disqualified = dAdd <= -2 || upf < 42 || (dSugarA <= -3 && cVit === 0);
      const stars = disqualified ? 0 : (score >= 4 ? 3 : score >= 2 ? 2 : score >= 0 ? 1 : 0);

      return {
        servingSize, calories, satFat, sodium, addedSugar, fiber,
        dSat: dSatA, dSugar: dSugarA, dSod: dSodA, dTrans, dAdd, cFiber, cVit, cWhole,
        score, disqualified, stars, algorithm: algo,
      };
    }

    /* Guiding Stars line items, rendered as ordinary metric rows on the SAME
       board grid. Each row reads its value off a scorecard from
       cmpGuidingStarsData. `type` decides the cell renderer:
         · 'text'  — plain text (Algorithm)
         · 'flag'  — Yes/No (Disqualified?)
         · 'point' — a debit/credit point (−n / +n / 0 / —)
         · 'num'   — a raw nutrient/serving value, drawn with a proportional bar
       `better` drives best/worst colouring for numeric rows. */
    const CMP_GS_ROWS = [
      { key: 'algorithm', label: 'Algorithm',        icon: 'calculate',   color: '#5B6ED0', type: 'text',  get: g => g.algorithm,
        desc: 'Which Guiding Stars scoring algorithm applies to this food group.' },
      { key: 'disq',      label: 'Disqualified?',     icon: 'gpp_maybe',   color: '#C9832E', type: 'flag',  get: g => g.disqualified,
        desc: 'A heavy additive load or high processing removes a product from the star system entirely.' },
      { key: 'dSat',      label: 'Sat. Fat',          icon: 'opacity',     color: '#DC3038', type: 'point', better: 'higher', get: g => g.dSat,
        desc: 'Debit points for saturated fat per 100 kcal — closer to 0 is better.' },
      { key: 'dSugar',    label: 'Sugar',             icon: 'icecream',    color: '#DC3038', type: 'point', better: 'higher', get: g => g.dSugar,
        desc: 'Debit points for added sugar per 100 kcal — closer to 0 is better.' },
      { key: 'dSod',      label: 'Sodium',            icon: 'grain',       color: '#DC3038', type: 'point', better: 'higher', get: g => g.dSod,
        desc: 'Debit points for sodium per 100 kcal — closer to 0 is better.' },
      { key: 'dTrans',    label: 'Trans Fat',         icon: 'block',       color: '#DC3038', type: 'point', better: 'higher', get: g => g.dTrans,
        desc: 'Debit points for trans fat — any presence is penalised.' },
      { key: 'dAdd',      label: 'Additives',         icon: 'science',     color: '#DC3038', type: 'point', better: 'higher', get: g => g.dAdd,
        desc: 'Debit points for cosmetic or non-GRAS additives — closer to 0 is better.' },
      { key: 'cFiber',    label: 'Fiber',             icon: 'grass',       color: '#2AA866', type: 'point', better: 'higher', get: g => g.cFiber,
        desc: 'Credit points earned for dietary fiber — more is better.' },
      { key: 'cVit',      label: 'Vitamins/Minerals', icon: 'medication',  color: '#2AA866', type: 'point', better: 'higher', get: g => g.cVit,
        desc: 'Credit points earned for naturally occurring vitamins and minerals.' },
      { key: 'cWhole',    label: 'Whole Grain',       icon: 'agriculture', color: '#2AA866', type: 'point', better: 'higher', get: g => g.cWhole,
        desc: 'Credit points earned for whole grain — “—” for foods where it doesn’t apply.' },
      { key: 'satFat',    label: 'Sat. Fat (g)',      icon: 'water_drop',  color: '#2F74C7', type: 'num', unit: 'g',    better: 'lower',  get: g => g.satFat,
        desc: 'Saturated fat per 100 kcal.' },
      { key: 'sodium',    label: 'Sodium (mg)',       icon: 'grain',       color: '#2F74C7', type: 'num', unit: 'mg',   better: 'lower',  get: g => g.sodium,
        desc: 'Sodium per 100 kcal.' },
      { key: 'addedSugar',label: 'Added Sugar (g)',   icon: 'icecream',    color: '#2F74C7', type: 'num', unit: 'g',    better: 'lower',  get: g => g.addedSugar,
        desc: 'Added sugar per 100 kcal.' },
      { key: 'fiber',     label: 'Fiber (g)',         icon: 'grass',       color: '#2F74C7', type: 'num', unit: 'g',    better: 'higher', get: g => g.fiber,
        desc: 'Dietary fiber per 100 kcal.' },
      { key: 'servingSize',label: 'Serving Size',     icon: 'straighten',  color: '#8A5CC4', type: 'num', unit: 'g',    better: null,     get: g => g.servingSize,
        desc: 'Reference serving size.' },
      { key: 'calories',  label: 'Calories',          icon: 'local_fire_department', color: '#8A5CC4', type: 'num', unit: 'kcal', better: 'lower', get: g => g.calories,
        desc: 'Calories per serving.' },
    ];

    /* Stars-and-Score badge that replaces the circular WISEscore gauge on each
       header tile when Guiding Stars is on. */
    function cmpGsBadgeHtml(gs) {
      const cls = gs.disqualified ? 'is-dq' : (gs.stars >= 2 ? 'is-good' : gs.stars === 1 ? 'is-mid' : 'is-low');
      let stars = '';
      for (let i = 0; i < 3; i++) stars += '<span class="cmp-gs-badge-star' + (i < gs.stars ? ' is-on' : '') + '">' + (i < gs.stars ? '★' : '☆') + '</span>';
      const pill = gs.disqualified
        ? '<span class="cmp-tile-toppill cmp-top-pill tp-low">Disqualified</span>'
        : '';
      return pill +
        '<div class="cmp-gs-badge ' + cls + '">' +
          '<div class="cmp-gs-badge-stars">' + stars + '</div>' +
          '<div class="cmp-gs-badge-score">' + (gs.score > 0 ? '+' : '') + gs.score + '</div>' +
          '<div class="cmp-gs-badge-lbl">SCORE</div>' +
        '</div>';
    }

    /* Format a debit/credit point cell. */
    function cmpGsPoint(v) {
      if (v == null) return '<span class="cmp-gs-rowval cmp-gs-zero">—</span>';
      if (v < 0) return '<span class="cmp-gs-rowval cmp-gs-neg">' + v + '</span>';
      if (v > 0) return '<span class="cmp-gs-rowval cmp-gs-pos">+' + v + '</span>';
      return '<span class="cmp-gs-rowval cmp-gs-zero">0</span>';
    }

    /* ── Guiding Stars toolbar controls (parity with the WISEcode toolbar) ──
       Guiding Stars gets the same three controls the default board has:
         · Metrics  — toggles which Guiding Stars line items (rows) are shown
         · Algorithm — the "General Foods / Meat, Dairy & Nuts / …" selector that
                       stands in for the WISEcode Category filter
         · Chart type — Bars (the rating table) / Spider / Parallel / Race, drawn
                       from the Guiding Stars debit/credit & nutrient values. */

    /* Visible Guiding Stars rows, in canonical order (lazily defaults to all). */
    function cmpGsVisibleRows() {
      if (!compareState.gsRows) compareState.gsRows = CMP_GS_ROWS.map(r => r.key);
      return CMP_GS_ROWS.filter(r => compareState.gsRows.includes(r.key));
    }

    /* Metrics-picker menu for Guiding Stars — reuses the WISEcode menu shell
       (same id + open flag) so cmpToggleMetricMenu / cmpOutsideMetric drive it. */
    function cmpGsMetricMenu() {
      if (!compareState.gsRows) compareState.gsRows = CMP_GS_ROWS.map(r => r.key);
      const on = compareState.gsRows;
      const sections = [
        ['Rating basis', ['algorithm', 'disq']],
        ['Debit points', ['dSat', 'dSugar', 'dSod', 'dTrans', 'dAdd']],
        ['Credit points', ['cFiber', 'cVit', 'cWhole']],
        ['Nutrient values', ['satFat', 'sodium', 'addedSugar', 'fiber', 'servingSize', 'calories']],
      ];
      return '<div class="cmp-metric-menu" id="cmp-metric-menu" ' + (compareState.metricMenuOpen ? '' : 'hidden') + '>' +
        sections.map(([title, keys]) => {
          const rows = keys.map(k => CMP_GS_ROWS.find(r => r.key === k)).filter(Boolean);
          if (!rows.length) return '';
          return '<div class="cmp-metric-group">' + title + '</div>' + rows.map(r =>
            '<label class="cmp-metric-opt"><input type="checkbox" ' + (on.includes(r.key) ? 'checked' : '') +
            ' onchange="cmpToggleGsRow(\'' + r.key + '\')">' + r.label + '</label>'
          ).join('');
        }).join('') + '</div>';
    }
    function cmpToggleGsRow(key) {
      if (!compareState.gsRows) compareState.gsRows = CMP_GS_ROWS.map(r => r.key);
      const i = compareState.gsRows.indexOf(key);
      if (i >= 0) { if (compareState.gsRows.length <= 1) return; compareState.gsRows.splice(i, 1); }
      else compareState.gsRows.push(key);
      renderCompare();
    }

    /* Algorithm selector — the Guiding Stars analogue of the Category filter. */
    const CMP_GS_ALGOS = ['auto', 'General Foods', 'Meat/Dairy/Nuts', 'Fats/Oils', 'Beverages'];
    function cmpGsAlgoLabel(a) { return a === 'auto' ? 'Auto (per food)' : a; }
    function cmpGsAlgoControl() {
      const cur = compareState.gsAlgorithm || 'auto';
      return '<div id="cmp-gsalgo-wrap" class="cmp-tool-item" style="position:relative">' +
        '<button type="button" class="cmp-tool-btn cmp-cat-btn" onclick="cmpToggleGsAlgoMenu()" aria-haspopup="menu" aria-expanded="' + (!!compareState.gsAlgoMenuOpen) + '" aria-label="Guiding Stars scoring algorithm">' +
          '<span class="material-symbols-outlined">calculate</span>' +
          '<span class="cmp-cat-btn-label">' + cmpGsAlgoLabel(cur) + '</span>' +
          '<span class="material-symbols-outlined cmp-cat-caret">expand_more</span>' +
        '</button>' +
        '<div class="cmp-metric-menu" id="cmp-gsalgo-menu" ' + (compareState.gsAlgoMenuOpen ? '' : 'hidden') + '>' +
          '<div class="cmp-metric-group">Scoring algorithm</div>' +
          CMP_GS_ALGOS.map(a => {
            const isOn = a === cur;
            return '<label class="cmp-metric-opt' + (isOn ? ' is-active' : '') + '"><input type="radio" name="cmp-gsalgo" ' + (isOn ? 'checked' : '') +
              ' onchange="cmpSetGsAlgorithm(\'' + a.replace(/'/g, "\\'") + '\')">' + cmpGsAlgoLabel(a) + '</label>';
          }).join('') +
        '</div>' +
      '</div>';
    }
    function cmpToggleGsAlgoMenu() {
      compareState.gsAlgoMenuOpen = !compareState.gsAlgoMenuOpen;
      renderCompare();
      if (compareState.gsAlgoMenuOpen) setTimeout(() => document.addEventListener('mousedown', cmpOutsideGsAlgo), 0);
      else document.removeEventListener('mousedown', cmpOutsideGsAlgo);
    }
    function cmpOutsideGsAlgo(e) {
      const wrap = document.getElementById('cmp-gsalgo-wrap');
      if (wrap && wrap.contains(e.target)) return;
      compareState.gsAlgoMenuOpen = false;
      document.removeEventListener('mousedown', cmpOutsideGsAlgo);
      renderCompare();
    }
    function cmpSetGsAlgorithm(a) {
      compareState.gsAlgorithm = a;
      compareState.gsAlgoMenuOpen = false;
      document.removeEventListener('mousedown', cmpOutsideGsAlgo);
      renderCompare();
    }

    /* Chart adapter — turn the quantitative Guiding Stars rows into 0–100
       "goodness" axes so the spider / parallel / race charts can plot them the
       same way they plot WISEcode metrics (higher is always better here). */
    const CMP_GS_CHART_KEYS = ['dSat', 'dSugar', 'dSod', 'dTrans', 'dAdd', 'cFiber', 'cVit', 'cWhole', 'satFat', 'sodium', 'addedSugar', 'fiber', 'calories'];
    function cmpGsChartMetrics() {
      return cmpGsVisibleRows()
        .filter(r => CMP_GS_CHART_KEYS.includes(r.key))
        .map(r => ({ id: 'gs:' + r.key, gsKey: r.key, label: r.label, short: r.label, icon: r.icon, color: r.color, better: 'higher' }));
    }
    function cmpGsGoodness(ent, m) {
      const clamp = x => Math.max(0, Math.min(100, x));
      const c = cmpGuidingStarsData(ent);
      switch (m.gsKey) {
        case 'dSat':       return clamp((2 + c.dSat) / 2 * 100);
        case 'dSugar':     return clamp((3 + c.dSugar) / 3 * 100);
        case 'dSod':       return clamp((2 + c.dSod) / 2 * 100);
        case 'dTrans':     return clamp((1 + c.dTrans) * 100);
        case 'dAdd':       return clamp((2 + c.dAdd) / 2 * 100);
        case 'cFiber':     return clamp(c.cFiber / 2 * 100);
        case 'cVit':       return clamp(c.cVit / 2 * 100);
        case 'cWhole':     return c.cWhole == null ? 50 : clamp(c.cWhole * 100);
        case 'satFat':     return clamp(100 * (1 - c.satFat / 3));
        case 'sodium':     return clamp(100 * (1 - c.sodium / 250));
        case 'addedSugar': return clamp(100 * (1 - c.addedSugar / 21));
        case 'fiber':      return clamp(100 * (c.fiber / 3.2));
        case 'calories':   return clamp(100 * (1 - c.calories / 470));
        default:           return 50;
      }
    }

    /* ── The render engine — paints #cmp-body from state ───────────────── */
    function renderCompare() {
      const scope = CMP_SCOPES[compareState.scope];
      const body = document.getElementById('cmp-body');
      if (!scope || !body) return;
      /* A re-render destroys the kind chips — retire any open slot-type menu so
         it never lingers over a stale anchor. */
      if (typeof cmpCloseKindMenu === 'function') cmpCloseKindMenu();

      const ents = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e));
      /* WISEscore is always present as the header gauge + corner rail, so it is
         never a selectable comparison metric — filter it out of the metric set
         so it can't render as a duplicate bar row / chart axis. */
      const metrics = compareState.metrics.map(id => CMP_METRIC_BY_ID[id]).filter(m => m && m.id !== 'wisescore');
      const M = metrics.length;
      const showAvg = compareState.showAvg;

      /* Pending entrants are added but not yet scored/ranked — they render as
         ghosted, unranked columns pinned to the end until a recalculate. */
      const pendingSet = new Set(compareState.pending || []);
      const rankable = ents.filter(e => !pendingSet.has(e.id));
      const pendingEnts = ents.filter(e => pendingSet.has(e.id));

      /* Display order: YOU/primary is always the leftmost column so the
         head-to-head reads as "your food vs the field". Rank numbers still
         follow overall score (primary keeps its true rank). Other scored
         columns keep score order to the right; pending entrants stay at
         the end until a recalculate. */
      const ranked = rankable.slice().sort((a, b) => (b.na ? -1 : cmpScoreFor(b, 'wisescore')) - (a.na ? -1 : cmpScoreFor(a, 'wisescore')));
      const rankOf = new Map(ranked.map((e, i) => [e.id, i + 1]));
      const primaryEnt = rankable.find(e => e.primary) || pendingEnts.find(e => e.primary);
      const restRanked = ranked.filter(e => e !== primaryEnt);
      const restPending = pendingEnts.filter(e => e !== primaryEnt);
      const ordered = (primaryEnt ? [primaryEnt] : []).concat(restRanked, restPending);

      /* Guiding Stars reuses the SAME board UI (header tiles + metric rows).
         It only swaps WISEscore for the star rating on the tiles and renders
         the Guiding Stars line items as ordinary metric rows below. */
      const gs = !!compareState.guidingStars;

      /* ── Recalculate bar (pending changes / running recompute) ── */
      const noun = scope.noun;
      let recalcBar = '';
      if (compareState.recalcing || compareState.stale) {
        const running = compareState.recalcing;
        const pc = pendingEnts.length;
        recalcBar =
          '<div class="cmp-recalc-bar' + (running ? ' is-running' : '') + '">' +
            '<span class="cmp-recalc-ic"><span class="material-symbols-outlined">' + (running ? 'autorenew' : 'calculate') + '</span></span>' +
            '<div class="cmp-recalc-text">' +
              '<div class="cmp-recalc-title">' + (running ? 'Recalculating comparison…' : 'Comparison needs recalculating') + '</div>' +
              '<div class="cmp-recalc-sub">' + (running
                ? 'Scoring new ' + noun + 's and re-ranking the board'
                : (pc + ' new ' + noun + (pc > 1 ? 's are' : ' is') + ' pending — recompute to fold ' + (pc > 1 ? 'them' : 'it') + ' into the ranking and refresh every score')) + '</div>' +
            '</div>' +
            '<button type="button" class="cmp-recalc-btn" onclick="cmpRecalculate()"' + (running ? ' disabled' : '') + '><span class="material-symbols-outlined">' + (running ? 'autorenew' : 'calculate') + '</span>' + (running ? 'Working…' : 'Recalculate') + '</button>' +
          '</div>';
      }

      /* ── Toolbar ── */

      const metricMenu = '<div class="cmp-metric-menu" id="cmp-metric-menu" ' + (compareState.metricMenuOpen ? '' : 'hidden') + '>' +
        ['Composite', 'Nutrient Quality', 'Ingredient Quality', 'Health Outcomes', 'Future'].map(fam => {
          const opts = CMP_METRICS.filter(m => m.fam === fam && m.id !== 'wisescore');
          if (!opts.length) return '';
          return `<div class="cmp-metric-group">${fam}</div>` + opts.map(m => {
            const on = compareState.metrics.includes(m.id);
            if (m.future) return `<label class="cmp-metric-opt is-future"><input type="checkbox" disabled>${m.label}<span class="cmp-future-tag">Future</span></label>`;
            return `<label class="cmp-metric-opt"><input type="checkbox" ${on ? 'checked' : ''} onchange="cmpToggleMetric('${m.id}')">${m.label}</label>`;
          }).join('');
        }).join('') + '</div>';

      const chartBtn = (mode, icon, label, title) =>
        `<button type="button" class="cmp-chart-btn ${compareState.chartMode === mode ? 'is-active' : ''}" onclick="cmpSetChartMode('${mode}')" title="${title}" aria-label="${title}" aria-pressed="${compareState.chartMode === mode}"><span class="material-symbols-outlined">${icon}</span><span class="cmp-chart-label">${label}</span></button>`;
      /* The toolbar is its own full-width row above the grid container. Guiding
         Stars gets the SAME three controls the default board has: the Metrics
         picker (over the Guiding Stars rows), an Algorithm selector in place of
         the product Category filter, and the chart-type toggle (drawn from the
         Guiding Stars values). The Guiding Stars on/off switch itself still
         lives only in the header ⋯ menu, never in the body. */
      const metricCount = gs ? cmpGsVisibleRows().length : M;
      const toolbar =
        '<div class="cmp-toolbar cmp-toolbar--bar">' +
          '<div id="cmp-metric-wrap" class="cmp-tool-item" style="position:relative">' +
            `<button type="button" class="cmp-tool-btn" onclick="cmpToggleMetricMenu()"><span class="material-symbols-outlined">tune</span>Metrics · ${metricCount}</button>` +
            (gs ? cmpGsMetricMenu() : metricMenu) +
          '</div>' +
          (gs ? cmpGsAlgoControl() : (scope.categories ? cmpCatControl() : '')) +
          '<div class="cmp-chart-toggle" role="group" aria-label="Chart type">' +
            chartBtn('bars', 'align_horizontal_left', 'Bars', gs ? 'Guiding Stars rating table' : 'Health bar view') +
            chartBtn('radar', 'radar', 'Spider', 'Spider chart view') +
            chartBtn('parallel', 'ssid_chart', 'Parallel', 'Parallel coordinates view') +
            chartBtn('race', 'sports_score', 'Race', 'Race view') +
          '</div>' +
          /* The Guiding Stars on/off switch is an admin-gated toggle that lives
             in the pane's three-dot (⋯) menu here — see syncPaneGsItem() — so it
             is no longer duplicated as a toolbar button (parity with the module
             menus on product-portfolio / product-comparison / reformulation). */
          '<span class="cmp-tool-spacer"></span>' +
          cmpAddSplit(compareState.shown.length >= 5) +
        '</div>';

      /* The module header (top strip, in line with the ⋯ controls) keeps the
         "Compare Foods" title; this live meta becomes its subtitle — how many
         products/portfolios and metrics are in play, plus the active category
         filter when one is applied. */
      const nounPlural = scope.noun === 'portfolio' ? 'Portfolios' : 'Products';
      const pendMeta = pendingEnts.length ? ` · ${pendingEnts.length} pending` : '';
      const catMeta = (compareState.category && compareState.category !== 'all') ? ' · ' + compareState.category : '';
      const metaText = gs
        ? (rankable.length + ' ' + nounPlural + pendMeta + ' · Guiding Stars · ' + cmpGsAlgoLabel(compareState.gsAlgorithm || 'auto'))
        : (rankable.length + ' ' + nounPlural + pendMeta + ' · ' + M + ' Metrics' + catMeta);
      const cmpSub = document.getElementById('cmp-subtitle');
      if (cmpSub) cmpSub.textContent = metaText;

      /* Fallback in-board header — shown only when "Header float" appearance
         mode collapses the real panel header. Without this, float mode would
         leave the board with no visible "Compare Foods" title at all (the old
         in-grid rail title was retired when the toolbar moved into that cell). */
      const boardHead =
        '<div class="cmp-board-head" aria-hidden="true">' +
          '<div class="cmp-board-title">Compare Foods</div>' +
          '<div class="cmp-board-meta">' + metaText + '</div>' +
        '</div>';

      /* ── The aligned grid ── */
      /* Rail keeps a comfortable minimum but can flex; entity columns share
         the rest and shrink to zero so the grid always fits its container
         without a horizontal scrollbar, whatever the column count. Once the
         board carries 4+ entity columns the rail collapses to an icon-only
         strip (compact mode) so the columns keep a legible width — the full
         rail label + description then surface in a hover/focus flyout. */
      /* The header rail cell now hosts the live controls (metrics, category,
         chart type, add), so the rail column keeps a usable width even with a
         full shelf set — the old icon-only collapsed rail is retired. */
      const compact = false;
      /* Default state — only YOUR own food is on the board (no competitor yet).
         Trail an empty "add a competitor" column on the right so the head-to-head
         is one obvious click away, using the same split Add control as the top
         toolbar. Suppressed once a second entity (or a pending entrant) exists. */
      const showAddCol = ordered.length === 1;
      const cols = 'minmax(150px, 1.05fr) repeat(' + ordered.length + ', minmax(0, 1fr))'
        + (showAddCol ? ' minmax(0, 0.9fr)' : '');
      const cells = [];
      /* The trailing "add a competitor" column is painted as ONE continuous cell
         that spans every row (see the spanning cell pushed after the grid body),
         so its diagonal stripe texture runs unbroken down the whole column rather
         than restarting cell-by-cell. Individual rows therefore emit no add-column
         cell of their own. */

      /* Header row — the top-left corner cell. The toolbar now lives in its own
         row above the whole grid, so the corner just carries the board title,
         aligned to the left of the entity image tiles. */
      /* The WISEscore metric copy that used to sit in the (now retired) score
         row's rail moves up here, beneath the "Compare Foods" title. The score
         numerals themselves are promoted onto each entity's image tile as a
         circular gauge (below). */
      if (gs) {
        cells.push('<div class="cmp-cell cmp-cell--rail cmp-hcell cmp-hcell--corner">' +
          '<div class="cmp-corner-score"><div class="cmp-rail-metric"><div class="cmp-rail-metric-lead"><span class="cmp-rail-metric-ic" style="--mic:#EC4899"><span class="material-symbols-outlined">star</span></span><div class="cmp-rail-metric-name">Guiding Stars</div></div><div class="cmp-rail-body">' +
          '<div class="cmp-rail-metric-desc">The overall 0–3 star rating and its net score, from the debit &amp; credit points below. <a class="cmp-rail-learn" role="button" tabindex="0" title="How are stars scored?" aria-label="How are stars scored?" onclick="cmpFollow(\'gs_explain\')"><span class="material-symbols-outlined">forum</span></a></div>' +
          '</div></div></div>' +
        '</div>');
      } else {
        cells.push('<div class="cmp-cell cmp-cell--rail cmp-hcell cmp-hcell--corner">' +
          '<div class="cmp-corner-score"><div class="cmp-rail-metric"><div class="cmp-rail-metric-lead"><span class="cmp-rail-metric-ic cmp-rail-metric-ic--btn" role="button" tabindex="0" title="Replay scores" aria-label="Replay WISEscores" style="--mic:' + cmpMetricColor('wisescore') + '" onclick="cmpReplayGauges()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpReplayGauges()}"><span class="material-symbols-outlined">verified</span></span><div class="cmp-rail-metric-name">WISEscore</div></div><div class="cmp-rail-body">' +
          '<div class="cmp-rail-metric-desc">' + cmpMetricDesc('wisescore') + ' <a class="cmp-rail-learn" title="Ask WISEcodeAI about this metric" aria-label="Ask WISEcodeAI about this metric" onclick="cmpExplainMetric(\'wisescore\')"><span class="material-symbols-outlined">forum</span></a></div>' +
          '</div></div></div>' +
        '</div>');
      }
      const seedId = cmpSeedId();
      ordered.forEach(ent => {
        const isPending = pendingSet.has(ent.id);
        const rank = rankOf.get(ent.id);
        const kind = ent.kind || cmpEntKind(ent, scope);
        const isSeed = ent.id === seedId;
        const pc = (ent.primary ? ' is-primary' : (isPending ? ' is-pending' : '')) + (ent.isCategory ? ' is-category' : '');
        const rm = (!ent.primary && compareState.shown.length > 2)
          ? `<button type="button" title="Remove" onclick="cmpRemoveEntity('${ent.id}')" style="position:absolute;top:12px;right:12px;z-index:4;width:20px;height:20px;border:none;border-radius:50%;background:rgba(8,12,20,0.55);color:#fff;cursor:pointer;line-height:1;font-size:14px;display:flex;align-items:center;justify-content:center;">×</button>` : '';
        /* Per-slot control. The SEED (first/anchor) column can change TYPE
           (product / portfolio / category), which re-keys the whole board.
           Every other column is locked to the board's kind and can only be
           swapped for another of that same kind. The slot's rank number rides
           inside the chip as its leading badge. Hidden while mid-add. */
        const chipTitle = isSeed ? 'Change comparison type — product, portfolio or category' : ('Swap in another ' + cmpKindLabel(kind));
        const kindChip = isPending ? '' : `<button type="button" class="cmp-kind-chip${isSeed ? ' is-seed' : ''}" title="${chipTitle}" aria-label="${chipTitle}" aria-haspopup="menu" onclick="event.stopPropagation();cmpToggleKindMenu('${ent.id}', this)"><span class="cmp-kind-rank">${rank}</span><span class="cmp-kind-chip-label">${cmpKindLabel(kind)}</span><span class="material-symbols-outlined cmp-kind-chip-caret">expand_more</span></button>`;
        /* The CATEGORY tag stays inline after the name; the primary "YOU" chip
           floats up to the tile's top-right corner instead (see cmp-you-float). */
        const you = ent.isCategory ? ' <span class="cmp-cat-pill">CATEGORY</span>' : '';
        const youFloat = ent.primary ? '<span class="cmp-you-pill cmp-you-float">YOU</span>' : '';
        const imgUrl = cmpImgUrl(ent);
        const img = imgUrl ? `<img class="cmp-tile-img" src="${imgUrl}" alt="${ent.name}" loading="lazy" onerror="this.style.display='none'">` : '';
        /* Category tiles carry the category's own icon as a centred watermark
           instead of a product photo (and instead of the old diagonal stripes). */
        const catIc = ent.isCategory ? `<span class="cmp-cat-ic" aria-hidden="true"><span class="material-symbols-outlined">${ent.icon || 'category'}</span></span>` : '';
        /* No product/brand photo → paint the tile in the entity's own brand
           colour so the full-bleed treatment still reads as a real image.
           Category tiles get a striped neutral fill via CSS (.is-category). */
        const tileStyle = (imgUrl || ent.isCategory) ? '' : ` style="background:${ent.color}"`;
        /* Non-pending tiles surface their rank inside the type chip (top-left);
           only the pending placeholder still shows a standalone status badge. */
        const badge = isPending
          ? '<span class="cmp-rank cmp-rank--pending"><span class="material-symbols-outlined">schedule</span></span>'
          : '';
        const sub = isPending
          ? `<div class="cmp-ent-cat"><span class="cmp-pending-badge"><span class="material-symbols-outlined">schedule</span>Pending</span></div>`
          : `<div class="cmp-ent-cat">${ent.catLine}</div>`;
        /* The overall WISEscore is promoted from the (retired) score row onto
           the tile itself as a centred circular gauge that animates on click.
           Pending / N-A slots have no score, so they skip the gauge. */
        let gauge = '';
        if (!isPending && !ent.na) {
          if (gs) {
            gauge = cmpGsBadgeHtml(cmpGuidingStarsData(ent));
          } else {
            const ov = Math.round(cmpScoreFor(ent, 'wisescore'));
            const pillCls = ent.isCategory ? 'tp-cat' : (ov < 55 ? 'tp-low' : (ov < 68 ? 'tp-mid' : ''));
            const gaugeColor = ov < 55 ? 'var(--sec-red)' : (ov < 68 ? 'var(--ter-amber)' : 'var(--sec-green)');
            gauge = cmpScoreGaugeHtml(ov, pillCls, gaugeColor, ent.top);
          }
        }
        /* Full-bleed tile: the image is the background; the score gauge, rank,
           name and label are layered on top over a legibility scrim (no drop
           shadows anywhere). */
        cells.push(
          '<div class="cmp-cell cmp-cell--entity cmp-hcell' + pc + '" style="position:relative">' + rm + kindChip +
          `<div class="cmp-tile"${tileStyle}>${img}${catIc}${badge}${youFloat}${gauge}` +
            `<div class="cmp-tile-overlay"><div class="cmp-ent-name" title="${ent.name}">${ent.name}${you}</div>${sub}</div>` +
          `</div>` +
          '</div>');
      });
      /* Score row retired — the WISEscore numerals now live on the header tiles
         as circular gauges, and the metric copy moved into the corner cell. */

      const radarMode = compareState.chartMode === 'radar';
      const parallelMode = compareState.chartMode === 'parallel';
      const raceMode = compareState.chartMode === 'race';
      const chartOverlay = radarMode || parallelMode || raceMode;

      /* Metric rows — only in the default health-bar view. In radar/parallel
         mode these per-metric rows collapse into a single overlaid chart below.
         Guiding Stars reuses the exact same rail + cell rows, but its line items
         (debit/credit points, key nutrients, serving info) stand in for the
         WISEcode metrics. */
      if (!chartOverlay && gs) {
        /* Precompute a scorecard per shown entity so rows can reference values
           and compute per-row best/worst without recomputing each cell. */
        const gsCards = ordered.map(ent => (pendingSet.has(ent.id) || ent.na) ? null : cmpGuidingStarsData(ent));
        cmpGsVisibleRows().forEach((r, mi) => {
          /* Rail — icon replays the whole row's bars (numeric rows) and the desc
             carries the same inline "chat about this" forum link the WISEcode
             rows have, wired to cmpExplainGs so tapping it continues the
             conversation in the chat module. */
          cells.push(
            '<div class="cmp-cell cmp-cell--rail"><div class="cmp-rail-metric"><div class="cmp-rail-metric-lead"><span class="cmp-rail-metric-ic cmp-rail-metric-ic--btn" role="button" tabindex="0" title="Replay this row" aria-label="Replay ' + r.label + ' bars" style="--mic:' + r.color + '" onclick="cmpReplayRow(' + mi + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpReplayRow(' + mi + ')}"><span class="material-symbols-outlined">' + r.icon + '</span></span><div class="cmp-rail-metric-name"><span class="cmp-rail-metric-lbl">' + r.label + '</span></div></div><div class="cmp-rail-body">' +
            '<div class="cmp-rail-metric-desc">' + r.desc + ' <a class="cmp-rail-learn" role="button" tabindex="0" title="Chat about ' + r.label + '" aria-label="Chat with WISEcodeAI about ' + r.label + '" onclick="cmpExplainGs(\'' + r.key + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpExplainGs(\'' + r.key + '\')}"><span class="material-symbols-outlined">forum</span></a></div>' +
            '</div></div></div>');
          /* Numeric rows: find the row's best/worst live value for the bar
             scale + colour, so each row reads like the WISEcode bars. */
          let rowMax = 0, best = null, worst = null;
          if (r.type === 'num') {
            gsCards.forEach(c => { if (!c) return; const v = r.get(c); if (v == null || isNaN(v)) return; rowMax = Math.max(rowMax, v); if (best == null || v > best) best = v; if (worst == null || v < worst) worst = v; });
          }
          ordered.forEach((ent, ei) => {
            const pc = ent.primary ? ' is-primary' : '';
            if (pendingSet.has(ent.id)) { cells.push('<div class="cmp-cell cmp-cell--entity is-pending"><span class="cmp-ghost cmp-ghost--bar"></span></div>'); return; }
            if (ent.na) { cells.push('<div class="cmp-cell cmp-cell--entity' + pc + '"><span class="cmp-metric-na">N/A</span></div>'); return; }
            const card = gsCards[ei];
            const val = r.get(card);
            /* Every cell carries a chat link so you can drill into that exact
               product × metric, mirroring the WISEcode insight cell. */
            const chatLink = '<a class="cmp-gs-cellchat" role="button" tabindex="0" title="Chat about ' + ent.name + ' · ' + r.label + '" aria-label="Chat with WISEcodeAI about ' + ent.name + ' ' + r.label + '" onclick="event.stopPropagation();cmpExplainGs(\'' + r.key + '\',\'' + ent.id + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();event.stopPropagation();cmpExplainGs(\'' + r.key + '\',\'' + ent.id + '\')}"><span class="material-symbols-outlined">forum</span></a>';
            if (r.type === 'text') {
              cells.push('<div class="cmp-cell cmp-cell--entity cmp-gs-cell' + pc + '"><span class="cmp-gs-rowval cmp-gs-text">' + (val || '—') + '</span>' + chatLink + '</div>');
            } else if (r.type === 'flag') {
              cells.push('<div class="cmp-cell cmp-cell--entity cmp-gs-cell' + pc + '"><span class="cmp-gs-rowval ' + (val ? 'cmp-gs-neg' : 'cmp-gs-pos') + '">' + (val ? 'Yes' : 'No') + '</span>' + chatLink + '</div>');
            } else if (r.type === 'point') {
              cells.push('<div class="cmp-cell cmp-cell--entity cmp-gs-cell' + pc + '">' + cmpGsPoint(val) + chatLink + '</div>');
            } else {
              /* num — value + proportional bar, coloured green(best)/red(worst).
                 Clicking the cell replays the bar, exactly like the WISEcode rows. */
              const pct = rowMax > 0 ? Math.round((val / rowMax) * 100) : 0;
              let gc = 'g-c';
              if (r.better && best !== worst) {
                const isBest = r.better === 'lower' ? (val === worst) : (val === best);
                const isWorst = r.better === 'lower' ? (val === best) : (val === worst);
                gc = isBest ? 'g-a' : (isWorst ? 'g-d' : 'g-c');
              }
              cells.push(
                '<div class="cmp-cell cmp-cell--entity cmp-gs-cell' + pc + '"><div class="cmp-metric-cell" data-mrow="' + mi + '" onclick="cmpReplayBar(this)" title="Click to replay" style="--i:' + mi + '">' +
                '<span class="cmp-metric-val">' + val + (r.unit ? '<span class="cmp-gs-unit"> ' + r.unit + '</span>' : '') + '</span>' +
                '<span class="cmp-bar-outer ' + gc + '"><span class="cmp-bar-fill ' + gc + '" style="width:' + pct + '%"></span></span>' +
                '</div>' + chatLink + '</div>');
            }
          });
        });
      } else if (!chartOverlay) {
        metrics.forEach((m, mi) => {
          const avg = showAvg ? cmpAvgFor(scope, m.id, compareState.category) : null;
          cells.push(
            '<div class="cmp-cell cmp-cell--rail"><div class="cmp-rail-metric"><div class="cmp-rail-metric-lead"><span class="cmp-rail-metric-ic cmp-rail-metric-ic--btn" role="button" tabindex="0" title="Replay this row" aria-label="Replay ' + cmpMetricShort(m) + ' bars" style="--mic:' + cmpMetricColor(m.id) + '" onclick="cmpReplayRow(' + mi + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpReplayRow(' + mi + ')}"><span class="material-symbols-outlined">' + m.icon + '</span></span><div class="cmp-rail-metric-name"><span class="cmp-rail-metric-lbl">' + cmpMetricRailName(m) + '</span>' + (avg != null ? '<span class="cmp-rail-metric-avg">avg ' + Math.round(avg) + '</span>' : '') + '</div></div><div class="cmp-rail-body">' +
            '<div class="cmp-rail-metric-desc">' + cmpMetricDesc(m.id) + ' <a class="cmp-rail-learn" title="Ask WISEcodeAI about this metric" aria-label="Ask WISEcodeAI about this metric" onclick="cmpExplainMetric(\'' + m.id + '\')"><span class="material-symbols-outlined">forum</span></a></div>' +
            '</div></div></div>');
          ordered.forEach(ent => {
            const pc = ent.primary ? ' is-primary' : '';
            if (pendingSet.has(ent.id)) { cells.push('<div class="cmp-cell cmp-cell--entity is-pending"><span class="cmp-ghost cmp-ghost--bar"></span></div>'); return; }
            if (ent.na) { cells.push('<div class="cmp-cell cmp-cell--entity' + pc + '"><span class="cmp-metric-na">N/A</span></div>'); return; }
            const v = cmpScoreFor(ent, m.id);
            const g = cmpGrade(v), gc = cmpGradeClass(g);
            const mark = avg != null ? `<span class="cmp-avg-mark" style="left:${Math.round(avg)}%"></span>` : '';
            cells.push(
              '<div class="cmp-cell cmp-cell--entity' + pc + '"><div class="cmp-metric-cell" data-mrow="' + mi + '" onclick="cmpReplayBar(this)" title="Click to replay" style="--i:' + mi + '">' +
              `<span class="cmp-metric-val">${Math.round(v)}</span>` +
              `<span class="cmp-bar-outer ${gc}"><span class="cmp-bar-fill ${gc}" style="width:${Math.round(v)}%"></span>${mark}</span>` +
              `<span class="cmp-grade ${gc}">${g}</span></div></div>`);
          });
        });

        /* Insight row — the rail now carries the OVERALL board read (the
           "what's happening here" summary), mirroring the desc column every
           metric rail shows. It re-derives on each render, so it stays in sync
           as entities/metrics/category change. */
        cells.push('<div class="cmp-cell cmp-cell--rail"><div class="cmp-rail-metric"><div class="cmp-rail-metric-lead"><span class="cmp-rail-metric-ic" style="--mic:#C9A227"><span class="material-symbols-outlined">auto_awesome</span></span><div class="cmp-rail-metric-name">Insight</div></div><div class="cmp-rail-body">' +
          '<div class="cmp-rail-metric-desc">' + cmpOverallInsight(scope, metrics, ordered, pendingSet) + ' <a class="cmp-rail-learn" role="button" tabindex="0" title="Chat about the overall read" aria-label="Chat with WISEcodeAI about the overall comparison" onclick="cmpChatOverall()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpChatOverall()}"><span class="material-symbols-outlined">forum</span></a></div>' +
          '</div></div></div>');
        ordered.forEach(ent => {
          const pc = ent.primary ? ' is-primary' : '';
          if (pendingSet.has(ent.id)) { cells.push('<div class="cmp-cell cmp-cell--entity is-pending"><span class="cmp-pending-badge"><span class="material-symbols-outlined">schedule</span>Recalculate to generate</span></div>'); return; }
          if (ent.na) { cells.push('<div class="cmp-cell cmp-cell--entity' + pc + '"><span class="cmp-metric-na">—</span></div>'); return; }
          cells.push('<div class="cmp-cell cmp-cell--entity cmp-insight' + pc + '"><div class="cmp-insight-body">' + (ent.insight || '') +
            ' <a class="cmp-insight-chat" role="button" tabindex="0" title="Chat about this insight" aria-label="Chat with WISEcodeAI about this insight" onclick="cmpChatInsight(\'' + ent.id + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cmpChatInsight(\'' + ent.id + '\')}"><span class="material-symbols-outlined">forum</span></a>' +
            '</div></div>');
        });
      }

      /* ── Continuous "add a competitor" column ──────────────────────────
         One tall cell explicitly placed in the trailing grid column, spanning
         every rendered row, so its diagonal stripes read as a single unbroken
         panel. Row count: header + score, plus (in the health-bar view) one row
         per metric and the insight row. */
      if (showAddCol) {
        const primName = ordered[0] ? ordered[0].name : 'your food';
        const lockedLabel = cmpKindLabel(cmpLockedKind());
        /* Rows: header + (health-bar view) one per metric + insight. The old
           standalone score row is gone (scores now ride on the header tiles). */
        const addColRows = chartOverlay ? 1 : (gs ? (cmpGsVisibleRows().length + 1) : (metrics.length + 2));
        cells.push(
          '<div class="cmp-cell cmp-addcol cmp-addcol-span" style="grid-column:-2 / -1;grid-row:1 / span ' + addColRows + ';">' +
            '<div class="cmp-addcol-inner">' +
              '<div class="cmp-addcol-plus"><span class="material-symbols-outlined">add</span></div>' +
              '<div class="cmp-addcol-title">Add a ' + lockedLabel + '</div>' +
              '<div class="cmp-addcol-sub">Drop another ' + lockedLabel + ' in beside <strong>' + primName + '</strong> to build the head-to-head.</div>' +
              cmpAddSplit(false) +
            '</div>' +
          '</div>');
      }

      const gridWrapCls = 'cmp-grid-wrap' + (compareState.recalcing ? ' is-recalcing' : '') + (compact ? ' cmp-grid-wrap--compact' : '');
      const gridCls = 'cmp-grid' + (compareState._settle ? ' cmp-settled' : '') + (compact ? ' cmp-grid--compact' : '');
      const grid = `<div class="${gridWrapCls}"><div class="${gridCls}" style="grid-template-columns:${cols}">${cells.join('')}</div></div>`;

      /* ── Overlay chart — spider / parallel / race for every entity. In the
         Guiding Stars view the same charts plot the GS debit/credit & nutrient
         values (normalised to 0–100 goodness) instead of the WISEcode metrics. */
      const chartEnts = ordered.filter(e => !e.na && !pendingSet.has(e.id));
      const chartMetrics = gs ? cmpGsChartMetrics() : metrics;
      const chartValFn = gs ? cmpGsGoodness : null;
      const chartShowAvg = gs ? false : showAvg;
      const chart_html = radarMode
        ? cmpRadarSection(scope, chartMetrics, chartEnts, chartShowAvg, chartValFn)
        : (parallelMode ? cmpParallelSection(scope, chartMetrics, chartEnts, chartShowAvg, chartValFn)
        : (raceMode ? cmpRaceSection(scope, chartMetrics, chartEnts, chartShowAvg, chartValFn) : ''));

      /* ── Key Takeaways (auto-generated, responsive to what's on the board) ── */
      const live = ordered.filter(e => !e.na && !pendingSet.has(e.id));
      function topBy(metricId) { return live.slice().sort((a, b) => cmpScoreFor(b, metricId) - cmpScoreFor(a, metricId))[0]; }
      const takeawaySlots = compareState.takeawaySlots || ['perf', 'prot', 'clean', 'val'];
      const takeawayCards = takeawaySlots.map((key, slotIdx) => {
        const meta = CMP_TAKEAWAY_META[key];
        if (!meta) return null;
        const e = topBy(meta.metric);
        if (!e) return null;
        const score = Math.round(cmpScoreFor(e, meta.metric));
        return { key, slotIdx, entId: e.id, ic: meta.ic, lbl: meta.lbl, val: e.name, subLabel: meta.subLabel, score, why: cmpTakeawayWhy(key, e, score) };
      }).filter(Boolean);
      const takeaways =
        '<div class="cmp-takeaways-sec"><div class="cmp-section-label">Key Takeaways</div><div class="cmp-takeaways">' +
        takeawayCards.map(c => `<div class="cmp-takeaway">` +
          `<div class="cmp-takeaway-head">` +
            `<div class="cmp-takeaway-titlewrap">` +
              `<div class="cmp-takeaway-lbl">${c.lbl}</div>` +
              `<div class="cmp-takeaway-swap-wrap">` +
                `<button type="button" class="cmp-takeaway-swap" title="Swap this takeaway" aria-label="Swap this takeaway" aria-haspopup="menu" aria-expanded="false" onclick="cmpToggleTakeawayMenu(event, ${c.slotIdx})"><span class="material-symbols-outlined">swap_horiz</span></button>` +
              `</div>` +
            `</div>` +
            `<span class="cmp-takeaway-ic" aria-hidden="true"><span class="material-symbols-outlined">${c.ic}</span></span>` +
          `</div>` +
          `<div class="cmp-takeaway-score" data-count="${c.score}">${c.score}</div>` +
          `<div class="cmp-takeaway-val">${c.val}</div>` +
          `<div class="cmp-takeaway-sub-lbl">${c.subLabel}</div>` +
          `<hr class="cmp-takeaway-sep">` +
          `<div class="cmp-takeaway-insight"><span class="cmp-takeaway-insight-body">${c.why}` +
