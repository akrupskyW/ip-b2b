       type dropdown chip all step down a size as their column narrows, so a
       docked or many-column board never renders oversized names / chips. */
    @container cmpcol (max-width: 168px) {
      .cmp-hcell .cmp-ent-name { font-size: 0.78rem; }
      .cmp-hcell .cmp-ent-cat { font-size: 9px; }
      .cmp-tile { height: 178px; }
      .cmp-gauge { width: 96px; height: 96px; }
      .cmp-gauge-num { font-size: 1.85rem; }
      .cmp-kind-chip { top: 9px; left: 9px; padding: 5px 8px 5px 5px; font-size: 10px; gap: 5px; }
      .cmp-kind-chip .cmp-kind-rank { width: 17px; height: 17px; font-size: 10px; }
      .cmp-kind-chip .cmp-kind-chip-caret { font-size: 16px !important; padding-left: 7px; padding-right: 7px; margin: -5px -8px -5px 0; }
      .cmp-tile-toppill { top: 44px; }
    }
    @container cmpcol (max-width: 128px) {
      .cmp-hcell .cmp-ent-name { font-size: 0.7rem; }
      .cmp-hcell .cmp-ent-cat { font-size: 8.5px; }
      .cmp-tile { height: 150px; }
      .cmp-gauge { width: 76px; height: 76px; }
      .cmp-gauge-num { font-size: 1.45rem; }
      .cmp-gauge-lbl { font-size: 7px; }
      .cmp-kind-chip .cmp-kind-chip-label { display: none; }
    }

    /* Fixed popovers live on <body>, outside the board container, so they cap
       against the viewport instead — on a phone the type / takeaway menus never
       spill past the screen edge. */
    .cmp-kind-menu { width: min(246px, calc(100vw - 24px)); }
    .cmp-takeaway-menu { max-width: min(360px, calc(100vw - 24px)); }

    /* ── Guiding Stars ────────────────────────────────────────────────────
       A pink toggle in the Compare Foods header flips the board into a
       "Guiding Stars"-style nutrition rating table — debit/credit points,
       an overall star rating, and the key per-100-kcal nutrients that drive
       it — instead of the WISEcode bar grid. */
    /* Guiding Stars switch inside the module ⋯ menu — pink, so it stands out
       from the neutral Move/Width/Off items. */
    .pf-module-menu-item.pf-mi-gs .material-symbols-outlined,
    .pf-module-menu-item.pf-mi-gs .material-symbols-outlined { color: #EC4899 !important; }
    .pf-module-menu-item.pf-mi-gs { color: color-mix(in srgb, #EC4899 82%, var(--text)); font-weight: 600; }
    .pf-module-menu-item.pf-mi-gs:hover {
      background: color-mix(in srgb, #EC4899 12%, transparent);
      color: #EC4899;
    }
    .pf-module-menu-item.pf-mi-gs:hover .material-symbols-outlined,
    .pf-module-menu-item.pf-mi-gs:hover .material-symbols-outlined { color: #EC4899 !important; }
    .pf-module-menu-item.pf-mi-gs.is-on {
      background: color-mix(in srgb, #EC4899 14%, transparent);
      color: #EC4899;
    }

    /* In-chat Guiding Stars intent chip — pink star accent. */
    .sc-reply-chips .chip.chip-gs .material-symbols-outlined,
    .chip.chip-gs .material-symbols-outlined { color: #EC4899 !important; }
    .chip.chip-gs.is-on {
      border-color: #EC4899 !important;
      background: color-mix(in srgb, #EC4899 12%, transparent) !important;
      color: color-mix(in srgb, #EC4899 82%, var(--text)) !important;
    }
    .chip.chip-gs.is-on .material-symbols-outlined { color: #EC4899 !important; }

    /* Stars-and-Score badge on the header tile (replaces the WISEscore gauge
       when Guiding Stars is on). Centred on the tile, same footprint as the
       circular gauge, layered over the tile scrim. */
    .cmp-gs-badge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 3; display: flex; flex-direction: column; align-items: center;
      gap: 2px; text-align: center; pointer-events: none;
    }
    .cmp-gs-badge-stars { font-size: 34px; line-height: 1; letter-spacing: 3px; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .cmp-gs-badge-star { color: rgba(255,255,255,.4); }
    .cmp-gs-badge-star.is-on { color: #FFC94A; }
    .cmp-gs-badge.is-dq .cmp-gs-badge-star.is-on { color: #FFC94A; }
    .cmp-gs-badge-score { font-size: 40px; font-weight: 800; color: #fff; line-height: 1.02; margin-top: 5px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .cmp-gs-badge-lbl { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: rgba(255,255,255,.85); }
    .cmp-gs-badge.is-low .cmp-gs-badge-score { color: #FF8A8A; }
    .cmp-gs-badge.is-good .cmp-gs-badge-score { color: #9FE6B8; }

    /* Guiding Stars row cell values — reuse the metric-cell frame, so the rows
       read exactly like the WISEcode bar rows. */
    .cmp-gs-rowval {
      display: block; text-align: center; width: 100%;
      font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
      padding: 6px 0;
    }
    .cmp-gs-text { font-weight: 600; font-size: 12px; color: var(--text); }
    .cmp-gs-neg { color: var(--sec-red); }
    .cmp-gs-pos { color: var(--sec-green); }
    .cmp-gs-zero { color: var(--text-subtle); }
    .cmp-gs-unit { font-size: 10px; font-weight: 600; color: var(--text-subtle); }

    /* Per-cell chat affordance for the Guiding Stars rows — the forum icon rides
       in the top-right of each entity cell and fades in on hover/focus, so every
       product × line item can spawn a WISEcodeAI chat about that exact value. */
    .cmp-gs-cell { position: relative; }
    .cmp-gs-cellchat {
      position: absolute; top: 4px; right: 4px; z-index: 2;
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 6px;
      color: var(--primary-ink, var(--primary)); cursor: pointer; opacity: 0;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      transition: opacity 0.14s ease, transform 0.12s ease, background-color 0.14s ease;
    }
    .cmp-gs-cellchat .material-symbols-outlined { font-size: 14px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-gs-cell:hover .cmp-gs-cellchat,
    .cmp-gs-cell:focus-within .cmp-gs-cellchat { opacity: 0.9; }
    .cmp-gs-cellchat:hover { opacity: 1 !important; transform: scale(1.08); }
    .cmp-gs-cellchat:focus-visible { opacity: 1; outline: 2px solid var(--primary); outline-offset: 2px; }

    /* Report → Export as PDF: print only the report on a white page. */
    @media print {
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      html.wa-print-report,
      html.wa-print-report body {
        background: #fff !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
      }
      html.wa-print-report #topbar-row,
      html.wa-print-report #menu-panel,
      html.wa-print-report #wa-chat,
      html.wa-print-report #wa-unified,
      html.wa-print-report #wa-results,
      html.wa-print-report #wa-visuals,
      html.wa-print-report .wch-sidebar,
      html.wa-print-report #wa-share-panel,
      html.wa-print-report .pr-overlay,
      html.wa-print-report .cas-rail,
      html.wa-print-report [data-owt],
      html.wa-print-report #wa-report .wa-pane-controls,
      html.wa-print-report #wa-report .wa-rpt-more,
      html.wa-print-report #wa-report .wa-rpt-note {
        display: none !important;
      }
      html.wa-print-report #chat-shell-wrap,
      html.wa-print-report #modules-row {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        position: static !important;
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
      }
      html.wa-print-report #wa-report.wa-pane,
      html.wa-print-report #modules-row #wa-report.wa-pane.is-open.is-sticky {
        display: flex !important;
        position: static !important;
        width: 100% !important;
        max-width: none !important;
        min-width: 0 !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #fff !important;
      }
      html.wa-print-report #wa-report .wa-pane-top,
      html.wa-print-report #wa-report .wa-pane-body {
        background: #fff !important;
        overflow: visible !important;
        height: auto !important;
      }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body>
  <!-- Hidden host for the shared menu controls (mirrors studio-ai.html). -->
  <div id="topbar-row" hidden aria-hidden="true">
    <button type="button" id="topbar-menu-toggle" class="topbar-menu-toggle" title="Collapse menu to icons" aria-label="Collapse menu to icons" aria-pressed="false"><span class="material-symbols-outlined">chevron_left</span></button>
    <button type="button" class="topbar-appearance-btn" id="topbar-appearance-btn" title="Appearance" aria-label="Appearance settings" aria-haspopup="true" aria-expanded="false"><span class="material-symbols-outlined">crossword</span></button>
    <div class="topbar-profile has-dot" id="topbar-profile" title="Arthur Krupsky · akrupsky@wisecode.ai" data-action="user-menu" role="button" tabindex="0" aria-label="User menu">AK</div>
  </div>

  <div id="chat-shell-wrap" class="menu-brand-integrated">
    <!-- Left navigation module (shared WISE app nav) -->
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>

    <!-- Chat + result panes share the shell's "modules" grid area.
         `modules-sticky` is permanent here: the docked History (left) and Turns
         (right) modules ONLY ever render as tucked "sticky" drawers behind the
         chat — the old free-standing "breakout" presentation is gone. -->
    <div id="modules-row" class="modules-sticky">
      <!-- 1 · WISEcodeAI chat — the ONE shared WISEcodeAI chat module (js/wiseai-chat.js). -->
      <main class="wa-chat" id="wa-chat" data-pr-fill></main>

      <!-- 2 · Results & Details pane — food results, food-detail cards, reports. -->
      <section class="wa-pane" id="wa-results" aria-label="Results & Details">
        <div class="wa-pane-top">
          <div class="wa-pane-mast">
            <h2 class="wa-pane-title" id="wa-results-title"></h2>
            <p class="wa-pane-meta" id="wa-results-meta"></p>
            <span class="wa-pane-ver" id="wa-results-ver" hidden></span>
          </div>
          <div class="wa-pane-top-right">
            <span class="wa-pane-nav-count" id="wa-results-count" data-nav-count aria-live="polite"></span>
            <span class="wa-pane-nav-btns" id="wa-results-navbtns"></span>
            <div class="wa-pane-controls">
              <div class="panel-more-wrap" data-pane-more="results">

  <!-- Appearance + profile popovers for the nav footer (mirrors studio-ai.html). -->
  <script>
    (function () {
      function applyChatTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('wise-theme', theme); } catch (_) {}
      }
      window.toggleChatTheme = function () {
        applyChatTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
      };
      (function bootTheme() {
        let theme = 'light';
        try { theme = localStorage.getItem('wise-theme') || (localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light'); } catch (_) {}
        applyChatTheme(theme === 'dark' ? 'dark' : 'light');
      })();

      let activePopover = null, activeAnchor = null;
      function closePopover() {
        if (!activePopover) return;
        activeAnchor?.classList.remove('is-open');
        activeAnchor?.setAttribute('aria-expanded', 'false');
        activePopover.classList.remove('open');
        const p = activePopover;
        setTimeout(() => p.remove(), 210);
        activePopover = null; activeAnchor = null;
      }
      function positionWisePopover(pop, anchor) {
        if (window.isMenuFooterAnchor?.(anchor)) window.positionPopoverInMenuPanel?.(pop, anchor);
        else window.positionPopoverForTopbar?.(pop, anchor);
      }

      function renderAppearanceBody(pop) {
        pop.innerHTML = window.buildAppearanceBody({
          showPivot: true,
          isPivoted: !!window.isMenuPivoted?.(),
          isDark: document.documentElement.classList.contains('dark'),
          showWISEcodeAIDock: false,
        });
      }
      function openAppearancePopover(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        renderAppearanceBody(pop);
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open'); anchor.setAttribute('aria-expanded', 'true');

        window.wireAppearancePopover(pop, {
          render: () => renderAppearanceBody(pop),
          onClose: closePopover,
          togglePivot: () => window.toggleMenuPivot?.(),
          toggleTheme: () => window.toggleChatTheme?.(),
        });
      }

      function openUserMenu(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        pop.innerHTML = window.buildUserMenuBody({ name: 'Arthur Krupsky' });
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open');
        pop.addEventListener('click', (ev) => {
          const profile = ev.target.closest('[data-pop-action="profile"]');
          if (profile && pop.contains(profile)) { ev.stopPropagation(); location.href = 'profile.html'; return; }
          const invoices = ev.target.closest('[data-pop-action="invoices"]');
          if (invoices && pop.contains(invoices)) { ev.stopPropagation(); location.href = 'invoices.html'; return; }
          const signout = ev.target.closest('[data-pop-action="signout"]');
          if (signout && pop.contains(signout)) { ev.stopPropagation(); window.performSignOut(); return; }
          if (ev.target.closest('.wise-popover-header, .wise-popover-divider, .wise-popover-actions, .wise-pop-vline')) { ev.stopPropagation(); return; }
          closePopover();
        });
      }

      document.getElementById('topbar-appearance-btn')?.addEventListener('click', (e) => { e.stopPropagation(); openAppearancePopover(e.currentTarget); });
      document.getElementById('topbar-profile')?.addEventListener('click', (e) => { e.stopPropagation(); openUserMenu(e.currentTarget); });
      document.addEventListener('wise:menu-footer-layout', (e) => openAppearancePopover(e.detail.anchor));
      document.addEventListener('wise:menu-footer-profile', (e) => openUserMenu(e.detail.anchor));
      document.addEventListener('click', (e) => {
        if (activePopover && !activePopover.contains(e.target) && !activeAnchor?.contains(e.target)) closePopover();
      });
      window.addEventListener('resize', closePopover);
    })();
  </script>

    /* ── Tap-to-replay for every output chart ─────────────────────────────────

       are left alone so only the chart surface itself replays. Everything is

    function waCountUp(el, to, dur) {
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3)));   /* easeOutCubic */
        if (t < 1) requestAnimationFrame(tick); else el.textContent = to;

    /* Clearing the animation, forcing a reflow, then restoring it re-triggers the
       stylesheet @keyframes; per-element --i / --delay stagger reinstates itself. */
    function waRestart(el) {

      void el.offsetWidth;
      el.style.animation = '';

        if (Number(card.dataset.waSweepGen) !== gen) return;

        const eased = 1 - Math.pow(1 - t, 3);
        const sweep = eased * 360;
        arcs.forEach((arc) => {
          const fullD = arc.getAttribute('data-full-d');
          const a0 = parseFloat(arc.dataset.a0);
          const a1 = parseFloat(arc.dataset.a1);
          if (!fullD || !Number.isFinite(a0) || !Number.isFinite(a1)) return;

          const ro = parseFloat(arc.dataset.ro);
          const cr = parseFloat(arc.dataset.cr);
          const cx = parseFloat(arc.dataset.cx);

    const paneTitle = { results: document.getElementById('wa-results-title'), visuals: document.getElementById('wa-visuals-title'), unified: document.getElementById('wa-unified-title'), report: document.getElementById('wa-report-title') };

    const paneName = { unified: document.getElementById('wa-unified-name') };
    const paneVer = { results: document.getElementById('wa-results-ver'), visuals: document.getElementById('wa-visuals-ver'), unified: document.getElementById('wa-unified-ver') };
    /* Mirror an output's version label ("v1.0.2 · 3 versions") into the pane

    }
    /* Top-bar carousel bits: the position counter (left) and the prev/next/min
       button group (right cluster) live in .wa-pane-top; the thumbnail rail is
       its own standalone strip below. */
    const paneCount = { results: document.getElementById('wa-results-count'), visuals: document.getElementById('wa-visuals-count'), unified: document.getElementById('wa-unified-count') };
    const paneNavBtns = { results: document.getElementById('wa-results-navbtns'), visuals: document.getElementById('wa-visuals-navbtns'), unified: document.getElementById('wa-unified-navbtns') };
    const paneTrack = { results: document.getElementById('wa-results-track'), visuals: document.getElementById('wa-visuals-track'), unified: document.getElementById('wa-unified-track') };
    const paneMin = { results: false, visuals: false, unified: false };  /* rail minimized to intent chips */

    /* Bounce the header tally when a NEW output lands. The separate panes carry

    const paneBumpTimers = {};
    function bumpPaneTally(which) {

      el.classList.add('is-bump');

    }

    /* ── Merged mode ──────────────────────────────────────────────────────────
       Toggled from the chat's three-dot "Merge outputs into one panel" switch.
       When ON, every result/visual block is pulled into the single #wa-unified
       module, whose one thumbnail rail is grouped (Results · | · Visuals). The
       two source panes are hidden; flipping it OFF sends each block home. */
    let mergedMode = false;
    const PANE_GROUPS = ['results', 'visuals'];
    const PANE_GROUP_LABEL = { results: 'Results & Details', visuals: 'Visuals' };
    const PANE_GROUP_ICON = { results: 'table_chart', visuals: 'insights' };

    /* Stamp a fallback title onto blocks that don't already lead with a

    function ensureBlockOutTitle(block, fallbackTitle) {
      if (!block || block.nodeType !== 1 || !block.classList.contains('wa-block')) return;
      if (block.querySelector('.wa-out-title')) return;
      if (block.querySelector('.wa-report-title, .wa-dhero, .wa-ce-head')) return;
      const title = (block.dataset && block.dataset.slideTitle) || fallbackTitle || '';
      if (!title) return;

    }

    /* ── Full-screen chat → single-pane dock ────────────────────────────────

       must collapse it to the canonical single width. CSS cannot tween `auto`
       → `380px`, so we pin both ends in pixels (same pattern as History's
       `wch-anim` reveal) and let `#modules-row.is-dock-animating` run the
       ease. The pane is `flex: 1 1 0` with min-width 0, so it grows into

    const DOCK_ANIM_MS = 580;
    let dockAnimTimer = 0;
    let dockAnimDir = null; /* 'in' | 'out' | null — so type/delete can reverse mid-tween */

    }
    function anyOtherPaneOpen(except) {

      });
    }
    function chatDockTargetPx(chat, row) {
      if (chat.classList.contains('panel-triple')) return 760;
      if (chat.classList.contains('panel-wide')) return 580;

      chat.style.setProperty('width', v, 'important');
      chat.style.setProperty('min-width', v, 'important');
      chat.style.setProperty('max-width', v, 'important');

    function ensurePaneOpen(pane) {

      const chat = document.getElementById('wa-chat');
      const row = document.getElementById('modules-row');
      const firstDock = !anyOtherPaneOpen(pane) || dockAnimDir === 'out';
      const startW = chat ? chat.getBoundingClientRect().width : 0;
      const targetW = chat && row ? chatDockTargetPx(chat, row) : 380;

    /* While the chat is thinking, the Output sticky module is already open

    function outputSkelMarkup() {
      const cell = '<div class="cmp-cell cmp-cell--entity is-pending"><span class="cmp-ghost cmp-ghost--bar"></span></div>';

    function showOutputSkeleton(which) {

    /* Append a result/chart into a pane so the module keeps GROWING as the

       that masthead in sync as the carousel switches outputs.
       Returns the first appended block so we can reveal it. */
    function openPane(which, { html, title, meta } = {}) {
      /* While merged, results/visuals blocks flow into the single unified body
         (tagged with their origin group so the rail can group + un-merge them). */
      const routed = mergedMode && (which === 'results' || which === 'visuals');
      const dest = routed ? 'unified' : which;
      const el = paneEl[dest];
      if (!el) return;
      /* Split panes name the output in the masthead immediately. The merged
         Output pane is synced by syncUnifiedMast() after the carousel refresh
         (count + description + chart name under the "Output" eyebrow). */
      if (dest !== 'unified') {
        if (title != null && paneTitle[dest]) paneTitle[dest].textContent = title;

      }

         just landed (seeds the scope + renders the full interactive board). */
      paneBody[dest].querySelectorAll('.cmp-host:not([data-ready])').forEach((h) => bootCompareEngine(h));
      if (!el.classList.contains('is-open')) {
        ensurePaneOpen(el);
      }
      /* Rebuild the thumbnail rail; make the just-surfaced block the active slide
         once the pane holds 2+ outputs. */
      if (dest === 'unified') refreshUnifiedCarousel({ activate: firstAdded });
      else refreshPaneCarousel(which, { activate: firstAdded });
      /* The tally just ticked up — bounce the header count so the new output
         registers like a score going up. (After the refresh above, so the
         counter already reads the new total when it pops.) */
      if (paneBlocks(dest).length > tallyBefore) bumpPaneTally(dest);
      /* In carousel mode only one block shows, so reset the scroll to its top;
         otherwise scroll the newest result into view so growth stays visible. */
      if (firstAdded) {
        if (paneBody[dest].classList.contains('is-carousel')) {

        } else {
          requestAnimationFrame(() => firstAdded.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      }
      updatePaneVer(dest);
      ensureChartExpandBtns(paneBody[dest]);
    }

    /* ── Pane carousel: horizontal thumbnail rail + one-at-a-time output ──
       Treat every top-level .wa-block in a pane body as a slide. With a single

       only the active block renders. */
    function paneSlideLabel(block, which, i) {
      const pick = (sel, stripIcons) => {
        const el = block.querySelector(sel);
        if (!el) return '';
        if (stripIcons) {
          const c = el.cloneNode(true);
          c.querySelectorAll('.material-symbols-outlined, .material-symbols-outlined').forEach((n) => n.remove());
          return c.textContent.trim();
        }
        return el.textContent.trim();
      };
      return block.dataset.slideTitle
        || pick('.wa-report-title') || pick('.wa-dhero-name') || pick('.wa-sec-title', true)
        || ((which === 'visuals' ? 'Chart ' : 'Result ') + (i + 1));
    }

    function paneBlocks(which) {
      const body = paneBody[which];
      if (!body) return [];
      return Array.from(body.children).filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'));
    }

    /* Merged Output pane header: "Output" stays a static eyebrow; the count,
       chart/report name, and description all track the visible slide. */
    function syncUnifiedMast(idx) {
      const blocks = paneBlocks('unified');
      const nameEl = paneName.unified;
      if (!blocks.length) {
        if (paneTitle.unified) paneTitle.unified.textContent = '';
        if (paneMeta.unified) paneMeta.unified.textContent = '';
        if (nameEl) nameEl.textContent = '';

      }
      idx = Math.max(0, Math.min(idx == null ? 0 : idx, blocks.length - 1));
      const active = blocks[idx];
      if (paneTitle.unified) paneTitle.unified.textContent = `${idx + 1} / ${blocks.length}`;
      if (paneMeta.unified) paneMeta.unified.textContent = (active.dataset && active.dataset.slideMeta) || '';
      if (nameEl) nameEl.textContent = paneSlideLabel(active, active.dataset.origin || 'results', idx);
    }

    /* Sync the minimize/expand toggle (now a three-dot menu item) with the rail's
       current mode: swap its icon + label between minimize and expand. */
    function updateMinBtn(which) {
      const item = paneEl[which] && paneEl[which].querySelector('[data-pane-act="min"]');
      if (!item) return;
      const min = !!paneMin[which];
      const ic = item.querySelector('.material-symbols-outlined');
      const lbl = item.querySelector('.pane-min-label');
      const txt = min ? 'Expand output cards' : 'Minimize to chips';
      if (ic) ic.textContent = min ? 'open_in_full' : 'close_fullscreen';
      if (lbl) lbl.textContent = txt;
      item.setAttribute('aria-label', txt);
    }

    /* Show/hide the minimize menu item (and its divider) — it's only meaningful
       while the pane is in carousel mode (2+ outputs to collapse into chips). */
    function setPaneMinItemVisible(which, on) {
      const root = paneEl[which];
      if (!root) return;
      const item = root.querySelector('[data-pane-act="min"]');
      const div = root.querySelector('[data-pane-min-div]');
      if (item) item.hidden = !on;
      if (div) div.hidden = !on;
    }

    function setPaneSlide(which, idx, { animate = true, scrollNav = false } = {}) {
      const blocks = paneBlocks(which);
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      if (!blocks.length) return;
      idx = Math.max(0, Math.min(idx, blocks.length - 1));
      blocks.forEach((b, i) => b.classList.toggle('is-active', i === idx));
      if (paneBody[which]) paneBody[which].scrollTop = 0;
      /* Keep the editorial masthead in sync with the visible output. The
         merged pane always uses the Output eyebrow + count + name layout;
         split panes name the output in the title when they're carouseling. */
      if (which === 'unified') {
        syncUnifiedMast(idx);
      } else if (paneBody[which] && paneBody[which].classList.contains('is-carousel')) {
        const active = blocks[idx];
        if (paneTitle[which]) paneTitle[which].textContent = paneSlideLabel(active, which, idx);
        if (paneMeta[which]) paneMeta[which].textContent = active.dataset.slideMeta || '';
      }
      if (animate) {
        const active = blocks[idx];
        active.style.animation = 'none'; void active.offsetWidth; active.style.animation = '';
      }
      if (track) {
        const items = track.querySelectorAll('[data-slide]');
        items.forEach((it) => {
          const on = Number(it.dataset.slide) === idx;
          it.classList.toggle('is-active', on);
          it.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        if (scrollNav && items[idx]) items[idx].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      /* Position counter (e.g. "Chart 2 / 4") + prev/next availability. The
         merged pane already shows "N / M" under the Output eyebrow, so its
         top-right counter stays empty to avoid saying it twice. */
      const noun = which === 'visuals' ? 'Chart' : which === 'unified' ? 'Output' : 'Result';
      const count = paneCount[which];
      if (count) count.innerHTML = which === 'unified' ? '' : `${noun} <b>${idx + 1}</b> / ${blocks.length}`;
      if (btns) {
        const prev = btns.querySelector('[data-nav="prev"]');
        const next = btns.querySelector('[data-nav="next"]');
        if (prev) prev.disabled = idx <= 0;
        if (next) next.disabled = idx >= blocks.length - 1;
      }
      updatePaneVer(which);
      waBootDashCharts(blocks[idx]);
    }

    function refreshPaneCarousel(which, { activate } = {}) {
      const body = paneBody[which];
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      const count = paneCount[which];
      if (!body || !track || !btns) return;
      const blocks = paneBlocks(which);
      /* Separate panes run in carousel mode from the very FIRST output — the rail,
         counter ("Result 1 / 1") and nav all show as soon as there's one block, so
         you always land "on the first one". Only a truly empty pane resets. */
      if (blocks.length < 1) {
        body.classList.remove('is-carousel');
        track.classList.remove('is-on', 'is-min');
        track.innerHTML = '';
        btns.innerHTML = '';
        if (count) count.innerHTML = '';
        setPaneMinItemVisible(which, false);
        blocks.forEach((b) => b.classList.remove('is-active'));
        return;
      }
      body.classList.add('is-carousel');
      track.classList.add('is-on');
      blocks.forEach((b, i) => { b.dataset.slideIndex = i; });
      /* Preserve the current slide unless the caller points at a new block. */
      let activeIdx = blocks.findIndex((b) => b.classList.contains('is-active'));
      if (activate instanceof Element) {
        const idx = blocks.indexOf(activate);
        if (idx >= 0) activeIdx = idx;
      }
      if (activeIdx < 0) activeIdx = blocks.length - 1;
      /* NOTE: the preview clones the block's own HTML, which for result blocks
         contains <button>/<input> controls. A <button> may not nest interactive
         content, so the wrapper is a <div role="button"> (same trick as the
         in-chat .sc-surface-card) and the clone is made `inert` so its controls
         can't be focused or spill out of the wrapper. */
      const thumbs = blocks.map((b, i) =>
        `<div class="wa-pane-thumb-item" data-slide="${i}" role="tab" tabindex="0" aria-selected="false" title="${esc(paneSlideLabel(b, which, i))}">
          <span class="wa-pane-thumb-num">${i + 1}</span>
          <span class="wa-pane-thumb-preview"><span class="wa-pane-thumb-inner" inert>${thumbSafe(b.innerHTML)}</span></span>
          <span class="wa-pane-thumb-label">${esc(paneSlideLabel(b, which, i))}</span>
        </div>`).join('');
      track.innerHTML = thumbs;
      btns.innerHTML =
        `<button type="button" class="wa-pane-nav-arrow" data-nav="prev" aria-label="Previous output"><span class="material-symbols-outlined">chevron_left</span></button>
         <button type="button" class="wa-pane-nav-arrow" data-nav="next" aria-label="Next output"><span class="material-symbols-outlined">chevron_right</span></button>`;
      track.classList.toggle('is-min', !!paneMin[which]);
      /* The minimize toggle now lives in the three-dot menu — reveal it (and its
         divider) only while the pane is in carousel mode, and sync its label. */
      setPaneMinItemVisible(which, true);
      updateMinBtn(which);
      setPaneSlide(which, activeIdx, { animate: false, scrollNav: true });
    }

    /* ── Unified (merged) carousel ──
       The unified body holds every block from BOTH source panes (each tagged
       with data-origin). Its single rail is grouped by origin — Results first,
       then a vertical divider, then Visuals — so the two "carousels" read as
       distinct sections of one strip. Clicking any thumbnail reveals that one
       output below. Reuses setPaneSlide for slide activation + the counter. */
    function refreshUnifiedCarousel({ activate } = {}) {
      const which = 'unified';
      const body = paneBody[which];
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      const count = paneCount[which];
      if (!body || !track || !btns) return;
      /* Outputs changed — drop any open header dropdown so it can't go stale. */
      closeTitledropPop();
      /* Keep blocks ordered by group (results → visuals) so grouping stays clean
         even as new outputs append at the end of the body. Stable within group. */
      const blocks = Array.from(body.children).filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'));
      blocks.sort((a, b) => {
        const ra = PANE_GROUPS.indexOf(a.dataset.origin || 'results');
        const rb = PANE_GROUPS.indexOf(b.dataset.origin || 'results');
        return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
      });
      blocks.forEach((b) => body.appendChild(b)); /* re-flow into grouped order */

      if (blocks.length < 2) {
        body.classList.remove('is-carousel');
        track.classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked');
        track.innerHTML = '';
        btns.innerHTML = '';
        if (count) count.innerHTML = '';
        setPaneMinItemVisible(which, false);
        blocks.forEach((b) => b.classList.remove('is-active'));
        if (blocks.length === 1) {
          blocks[0].classList.add('is-active');
          syncUnifiedMast(0);
          updatePaneVer(which);
        } else {
          syncUnifiedMast();
        }
        return;
      }
      body.classList.add('is-carousel');
      /* Merged rail = ONE row of small intent-style chips (Results + Visuals
         combined), matching the chat transcript's chips — not the big preview
         thumbnails the single-pane rails use, and no per-group eyebrow/icon. */
      track.classList.add('is-on', 'is-merged');
      track.classList.remove('is-min', 'is-grouped', 'is-stacked');
      blocks.forEach((b, i) => { b.dataset.slideIndex = i; });

      let activeIdx = blocks.findIndex((b) => b.classList.contains('is-active'));
      if (activate instanceof Element) {
        const idx = blocks.indexOf(activate);
        if (idx >= 0) activeIdx = idx;
      }
      if (activeIdx < 0) activeIdx = blocks.length - 1;

      /* One combined row: every output (Results + Visuals) as a compact chip,
         kept in grouped order (results → visuals) but with no eyebrow/icon
         separating them. Each chip carries its block id so a tap can also jump
         the transcript to where that output was introduced. */
      const chips = blocks.map((b, i) => {
        const grp = b.dataset.origin || 'results';
        const label = paneSlideLabel(b, grp, i);
        const bid = b.dataset.blockId || '';
        /* A <div role="tab"> (not a <button>) so the preview clone — which for
           result blocks holds <button>/<input> controls — can nest safely; the
           clone is `inert` so nothing inside it is focusable. Mirrors the
           transcript's .sc-surface-card. */
        return `<div class="wa-merge-chip" data-slide="${i}"${bid ? ` data-block-id="${esc(bid)}"` : ''} role="tab" tabindex="0" aria-selected="false" title="${esc(label)}">
          <span class="wa-merge-chip-thumb"><span class="wa-merge-chip-thumb-inner" inert>${thumbSafe(b.innerHTML)}</span></span>
          <span class="wa-merge-chip-label">${esc(label)}</span>
        </div>`;
      }).join('');
      track.innerHTML = `<div class="wa-merge-chips">${chips}</div>`;
      btns.innerHTML =
        `<button type="button" class="wa-pane-nav-arrow" data-nav="prev" aria-label="Previous output"><span class="material-symbols-outlined">chevron_left</span></button>
         <button type="button" class="wa-pane-nav-arrow" data-nav="next" aria-label="Next output"><span class="material-symbols-outlined">chevron_right</span></button>`;
      /* The chip rail IS the compact form, so the "minimize to chips" item is
         meaningless here — keep it hidden while merged. */
      setPaneMinItemVisible(which, false);
      setPaneSlide(which, activeIdx, { animate: false, scrollNav: true });
    }

    /* Sync the chat menu's "Merge outputs" switch with the current state. */
    let mergeMenuItem = null;
    function syncMergeMenu() {
      if (!mergeMenuItem) return;
      mergeMenuItem.classList.toggle('is-on', mergedMode);
      mergeMenuItem.setAttribute('aria-checked', mergedMode ? 'true' : 'false');
    }

    /* Flip between the two-pane and one-merged-pane layouts, carrying every block
       across with it so nothing is lost either way. */
    function applyMergeMode(on) {
      on = !!on;
      if (on === mergedMode) { syncMergeMenu(); return; }
      mergedMode = on;
      const row = document.getElementById('modules-row');
      if (row) row.classList.toggle('outputs-merged', on);

      if (on) {
        /* Pull each source pane's blocks into the unified body, tagged by origin,
           results first then visuals (grouped order). */
        PANE_GROUPS.forEach((grp) => {
          const src = paneBody[grp];
          if (!src) return;
          Array.from(src.children)
            .filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'))
            .forEach((b) => { b.dataset.origin = grp; b.classList.remove('is-active'); paneBody.unified.appendChild(b); });
          /* Reset the now-empty source pane back to a clean closed state. */
          src.classList.remove('is-carousel');
          if (paneTrack[grp]) { paneTrack[grp].innerHTML = ''; paneTrack[grp].classList.remove('is-on', 'is-min'); }
          if (paneNavBtns[grp]) paneNavBtns[grp].innerHTML = '';
          if (paneCount[grp]) paneCount[grp].innerHTML = '';
          paneEl[grp]?.classList.remove('is-open', 'pane-wide', 'pane-triple', 'pane-fill', 'pane-fs');
          setOutputFsOn(false);
          const wb = document.querySelector(`[data-pane-width="${grp}"]`);
          if (wb) syncPaneWidthBtn(wb, 0);
        });
        const hasContent = paneBody.unified.querySelector('.wa-block');
        if (hasContent) {
          paneEl.unified.classList.remove('is-open'); void paneEl.unified.offsetWidth;
          paneEl.unified.classList.add('is-open');
        }
        refreshUnifiedCarousel({ activate: paneBody.unified.querySelector('.wa-block') });
      } else {
        /* Send every block home to its origin pane, preserving order. */
        Array.from(paneBody.unified.children)
          .filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'))
          .forEach((b) => {
            const grp = b.dataset.origin || 'results';
            b.classList.remove('is-active');
            (paneBody[grp] || paneBody.results).appendChild(b);
          });
        paneBody.unified.classList.remove('is-carousel');
        closeTitledropPop();
        if (paneTrack.unified) { paneTrack.unified.innerHTML = ''; paneTrack.unified.classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked'); }
        if (paneNavBtns.unified) paneNavBtns.unified.innerHTML = '';
        if (paneCount.unified) paneCount.unified.innerHTML = '';
        paneEl.unified.classList.remove('is-open', 'pane-wide', 'pane-triple', 'pane-fill', 'pane-fs');
        setOutputFsOn(false);
        const uwb = document.querySelector('[data-pane-width="unified"]');
        if (uwb) syncPaneWidthBtn(uwb, 0);
        /* Re-open each source pane that regained content + rebuild its rail. */
        PANE_GROUPS.forEach((grp) => {
          if (paneBody[grp] && paneBody[grp].querySelector('.wa-block')) {
            paneEl[grp]?.classList.remove('is-open'); void paneEl[grp]?.offsetWidth;
            paneEl[grp]?.classList.add('is-open');
            refreshPaneCarousel(grp);
          }
        });
      }
      window.WisePaneResize?.release?.([
        document.getElementById('wa-chat'),
        paneEl.results,
        paneEl.visuals,
        paneEl.unified,
        paneEl.report,
      ]);
      syncMergeMenu();
      recomputeSoloPaneWidth();
    }

    /* Carousel controls live in two spots: the prev/next group up in the top bar
       (paneNavBtns) and the thumbnail strip below (paneTrack). The minimize
       toggle now lives in the three-dot menu (see the [data-pane-act] handler).
       Delegate both off the pane section so a single handler covers each. */
    Object.keys(paneEl).forEach((which) => {
      const el = paneEl[which];
      if (!el || !paneTrack[which]) return;
      const curSlide = () => Number(paneTrack[which]?.querySelector('[data-slide].is-active')?.dataset.slide || 0);
      el.addEventListener('click', (e) => {
        const ctrl = e.target.closest('[data-nav]');
        if (ctrl && el.contains(ctrl)) {
          const act = ctrl.dataset.nav;
          setPaneSlide(which, curSlide() + (act === 'next' ? 1 : -1), { animate: true, scrollNav: true });
          return;
        }
        const it = e.target.closest('[data-slide]');
        if (!it || !el.contains(it)) return;
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
        /* In the merged rail, tapping a chip also jumps the chat transcript to
           the turn where that output was introduced. */
        if (which === 'unified' && it.dataset.blockId) jumpTranscriptToBlock(it.dataset.blockId);
      });
      el.addEventListener('keydown', (e) => {
        const track = paneTrack[which];
        if (!track || !track.contains(e.target)) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); setPaneSlide(which, curSlide() + 1, { animate: true, scrollNav: true }); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); setPaneSlide(which, curSlide() - 1, { animate: true, scrollNav: true }); return; }
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const it = e.target.closest('[data-slide]');
        if (!it) return;
        e.preventDefault();
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
        if (which === 'unified' && it.dataset.blockId) jumpTranscriptToBlock(it.dataset.blockId);
      });
    });

    /* Scroll the chat transcript to the inline surface card for a given output
       (its .sc-surface-card[data-surface=blockId]) and give it a brief highlight
       so it's obvious where in the conversation that output came from. */
    function jumpTranscriptToBlock(blockId) {
      if (!blockId || !host) return;
      const card = host.querySelector(`.sc-surface-card[data-surface="${blockId}"]`);
      if (!card) return;
      card.scrollIntoView({ block: 'center', behavior: 'smooth' });
      card.classList.remove('is-flash'); void card.offsetWidth; card.classList.add('is-flash');
      setTimeout(() => card.classList.remove('is-flash'), 1400);
    }

    function closePane(which, { instant } = {}) {
      const el = paneEl[which];
      const finishClose = () => {
        if (el) {
          const wasFs = paneIsFs(el);
          el.classList.remove('is-open', 'pane-wide', 'pane-triple', 'pane-fill', 'pane-fs', 'is-dock-opening', 'is-dock-settled');
          if (wasFs) setOutputFsOn(false);
        }
        if (which === 'unified') closeTitledropPop();
        if (which === 'report') {
          closeReportItemMenus();
          if (typeof shareContext !== 'undefined' && shareContext === 'report') closeShareModal();
        }
        if (paneBody[which]) {
          paneBody[which].innerHTML = '';
          paneBody[which].classList.remove('is-carousel', 'is-loading');
        }
        if (el) el.removeAttribute('aria-busy');
        if (paneTrack[which]) { paneTrack[which].innerHTML = ''; paneTrack[which].classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked'); }
        if (paneNavBtns[which]) paneNavBtns[which].innerHTML = '';
        if (paneCount[which]) paneCount[which].innerHTML = '';
        paneMin[which] = false;
        setPaneMinItemVisible(which, false);
        updateMinBtn(which);
        const wb = document.querySelector(`[data-pane-width="${which}"]`);
        if (wb) syncPaneWidthBtn(wb, 0);
        /* Drop any drag-pinned widths so the remaining modules reflow to fill the
           freed space — and once the last pane is gone, the chat expands back to
           full-screen (its stylesheet default) instead of staying docked at the
           width it was dragged to. */
        window.WisePaneResize?.release?.([
          document.getElementById('wa-chat'),
          paneEl.results,
          paneEl.visuals,
          paneEl.unified,
          paneEl.report,
        ]);
        recomputeSoloPaneWidth();
      };
      const wasLast = !!(el && el.classList.contains('is-open') && !anyOtherPaneOpen(el));
      if (!instant && wasLast) {
        animateChatExpand(el, finishClose);
        return;
      }
      finishClose();
    }

    /* Per-pane three-dot menu + width control (their own, independent of the chat).
       Cycles the canonical four tiers shared by every module in the app:
       single → double → triple → fill (take the rest of the row) → single. */
    const PANE_W_ICONS = ['width_normal', 'width_wide', 'width_full', 'width_full'];
    const PANE_W_TITLES = [
      'Width (single) — tap to widen',
      'Width (double) — tap to widen',
      'Width (triple) — tap to widen',
      'Width (fill) — tap to reset',
    ];
    function syncPaneWidthBtn(btn, tier) {
      btn.classList.toggle('is-on', tier >= 1);
      btn.setAttribute('aria-pressed', tier >= 1 ? 'true' : 'false');
      btn.title = PANE_W_TITLES[tier];
      const ic = btn.querySelector('.material-symbols-outlined');
      if (ic) ic.textContent = PANE_W_ICONS[tier];
    }
    function paneWidthTier(el) {
      if (el.classList.contains('pane-fill')) return 3;
      if (el.classList.contains('pane-triple')) return 2;
      if (el.classList.contains('pane-wide')) return 1;
      return 0;
    }
    function applyPaneWidth(el, tier) {
      el.classList.toggle('pane-wide', tier >= 1);
      el.classList.toggle('pane-triple', tier >= 2);
      el.classList.toggle('pane-fill', tier >= 3);
    }
    /* With TWO output panes open (results + visuals) the flex-grow tiers
       redistribute the shared space and are enough on their own; with ONE open the
       pane already fills the row, so its width tier must instead narrow the docked
       chat (see #modules-row[data-out-w] CSS).
       Reflect the lone open pane's width tier onto the row so the chat narrows.
       Cleared whenever more than one pane is open (flex-grow handles those) or the
       pane is back at its single tier. Reads live state, so it's safe to call from
       any layout change (width tap, pane open/close, merge/split). */
    function recomputeSoloPaneWidth() {
      const row = document.getElementById('modules-row');
      if (!row) return;
      const open = ['results', 'visuals', 'unified', 'report']
        .filter((k) => paneEl[k] && paneEl[k].classList.contains('is-open'));
      const tier = open.length === 1 ? paneWidthTier(paneEl[open[0]]) : 0;
      if (tier >= 1) row.setAttribute('data-out-w', String(tier));
      else row.removeAttribute('data-out-w');
    }
    document.querySelectorAll('[data-pane-width]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const which = btn.dataset.paneWidth;
        const el = paneEl[which];
        const next = (paneWidthTier(el) + 1) % 4;
        applyPaneWidth(el, next);
        syncPaneWidthBtn(btn, next);
        recomputeSoloPaneWidth();
      });
    });
    /* The Guiding Stars view is an admin-gated toggle that lives in the module's
       three-dot menu everywhere else in the app (portfolio, comparison,
       reformulation). The side-pane compare board is the same engine, so we
       surface the same admin toggle in the pane's ⋯ menu — but only while that
       pane is actually showing the Compare Foods board. */
    function paneHasActiveCompare(which) {
      const body = paneBody[which];
      if (!body) return false;
      if (body.classList.contains('is-carousel')) {
        const active = body.querySelector('.wa-block.is-active');
        return !!(active && active.querySelector('.cmp-host'));
      }
      return !!body.querySelector('.cmp-host');
    }
    function syncPaneGsItem(which) {
      const root = paneEl[which];
      if (!root) return;
      const item = root.querySelector('[data-pane-act="gs"]');
      const div = root.querySelector('[data-pane-gs-div]');
      const show = paneHasActiveCompare(which);
      if (item) item.hidden = !show;
      if (div) div.hidden = !show;
      if (show && item) {
        const on = (typeof compareState !== 'undefined') && !!compareState.guidingStars;
        item.classList.toggle('is-on', on);
        item.setAttribute('aria-checked', on ? 'true' : 'false');
        const ic = item.querySelector('.material-symbols-outlined');
        if (ic) ic.textContent = on ? 'star' : 'star_outline';
      }
    }
    /* ── Admin: merged pane "Outputs dropdown" header ──
       Toggled from the merged pane's ⋯ menu (pink Admin switch). While ON the
       chip carousel is hidden and the count ("N / M") under the Output eyebrow
       becomes a dropdown: clicking it opens a list of every output as a small
       preview + label; picking one reveals it below (and jumps the transcript,
       same as the chips did). */
    let unifiedTitleDrop = true;
    let titledropPop = null;
    /* Output ids picked via the plus column — survive open/close of the pop. */
    const titledropSelected = new Set();
    function titledropKey(block, i) {
      return (block && block.dataset && block.dataset.blockId) || `idx:${i}`;
    }
    function syncTitledropItem() {
      const item = paneEl.unified?.querySelector('[data-pane-act="titledrop"]');
      if (!item) return;
      item.classList.toggle('is-on', unifiedTitleDrop);
      item.setAttribute('aria-checked', unifiedTitleDrop ? 'true' : 'false');
    }
    function titledropTrigger() {
      return paneEl.unified?.querySelector('.wa-pane-mast-row') || paneTitle.unified;
    }
    function titledropAnchor() {
      /* Sit under the name+chevron row so the popover hangs off the headline
         (not below the meta line). Width/left are measured to also cover the
         counter to the left of this row. */
