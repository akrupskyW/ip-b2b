         same line as the neighbouring floating control clusters (chat 3-dot +
         width toggle, and this panel's own controls), which sit slightly lower
         than the top of the panel. Total vertical padding is unchanged so the
         bar height and its bottom divider stay put. */
      padding: 15px 16px 7px; cursor: pointer;
      font-size: var(--fs-label); font-weight: 600; white-space: nowrap;
      border: none; border-radius: 0; background: transparent; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    /* First tab's leading icon lines up with the panel header icon above it and
       the icons in the neighbouring module (both at the 12px content inset). */
    #chat-shell-wrap .cmp-scopebar .cmp-scope-btn:first-child { padding-left: 12px; }
    /* The global `#chat-shell-wrap button` rule forces a pill radius with
       !important; these tabs must stay square, so beat it with a higher-
       specificity !important override (id + class + class). */
    #chat-shell-wrap .cmp-scopebar .cmp-scope-btn { border-radius: 0 !important; }
    /* Vertical divider between adjacent tabs. */
    .cmp-scope-btn:not(:last-child) { border-right: 1px solid var(--border); }
    .cmp-scope-btn .material-symbols-outlined { font-size: 16px !important; }
    .cmp-scope-btn:hover:not(.is-active) { color: var(--text); background: color-mix(in srgb, var(--text-subtle) 9%, transparent); }
    .cmp-scope-btn.is-active {
      color: var(--primary-ink, var(--primary)); font-weight: 700;
      border-bottom-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 7%, transparent);
    }
    .cmp-scope-btn:focus { outline: none; }
    .cmp-scope-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

    .cmp-body { display: flex; flex-direction: column; gap: 12px; padding: 12px; }

    /* Empty state (mirrors wf-empty / vf-empty) */
    .cmp-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 6px; padding: 32px 18px; color: var(--text-subtle);
    }
    .cmp-empty .material-symbols-outlined { font-size: 40px; color: var(--primary-ink, var(--primary)); opacity: 0.7; }
    .cmp-empty-title { font-size: var(--fs-h6, 0.95rem); font-weight: 700; color: var(--text); }
    .cmp-empty-sub { font-size: var(--fs-ui); color: var(--text-muted); max-width: 300px; line-height: 1.5; }

    /* Owl loader — the WISE-owl mark breathing while the comparison assembles. */
    .cmp-owl-loader { color: var(--primary-ink, var(--primary)); }
    .cmp-owl-loader svg {
      width: 52px; height: auto; display: block;
      animation: cmp-owl-breathe 1.4s ease-in-out infinite;
    }
    @keyframes cmp-owl-breathe {
      0%, 100% { opacity: 0.35; transform: scale(0.94); }
      50%      { opacity: 1;    transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cmp-owl-loader svg { animation: cmp-owl-fade 1.6s ease-in-out infinite; transform: none; }
      @keyframes cmp-owl-fade { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    }

    /* Toolbar — metric picker, category filter, category-average, add entity */
    .cmp-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 2px 0; border-radius: 0;
      background: transparent; border: none;
    }
    .cmp-tool-btn {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 6px 11px; border-radius: 999px; font-size: var(--fs-label); font-weight: 600;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      transition: all 0.15s ease;
    }
    .cmp-tool-btn .material-symbols-outlined { font-size: 15px !important; }
    .cmp-tool-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary-ink, var(--primary)); }
    .cmp-tool-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    /* Solid primary CTA — matches .dash-btn--primary in analytics-types.html
       (navy fill, white text). */
    .cmp-tool-btn--primary {
      background: var(--primary); border-color: var(--primary); color: #fff;
      box-shadow: 0 4px 12px rgba(37, 80, 124, 0.25);
    }
    .cmp-tool-btn--primary .material-symbols-outlined { color: #fff !important; }
    .cmp-tool-btn--primary:hover:not(:disabled) {
      background: var(--primary); border-color: var(--primary); color: #fff;
      transform: translateY(-1px); box-shadow: 0 8px 18px rgba(37, 80, 124, 0.3);
    }
    .cmp-tool-spacer { flex: 1; }

    /* Toolbar relocated into the board's top-left header cell. It behaves as a
       self-contained responsive component: a container query on the cell lets
       the toolbar reflow to whatever width the rail column happens to be —
       controls sit inline and wrap into rows as space tightens, rather than
       being forced into a full-width vertical stack. */
    .cmp-cell--rail.cmp-hcell.cmp-hcell--tools {
      justify-content: flex-start; align-items: flex-start;
      padding: 12px 12px; gap: 0;
      container-type: inline-size; container-name: cmptools;
    }
    .cmp-hcell--tools .cmp-toolbar {
      flex-direction: column; flex-wrap: nowrap; align-items: stretch;
      gap: 0; width: 100%; padding: 0;
    }
    /* The toolbar now stacks: a main row (metrics · category · Add) sits above a
       horizontal divider, then the chart-type toggle drops onto its own row. */
    .cmp-tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
    .cmp-tool-divider {
      height: 1px; width: 100%; background: var(--border);
      margin: 12px 0 0;
    }
    .cmp-tool-row--chart { margin-top: 12px; }
    /* Keep the category filter and the category-average toggle glued together
       so they share a row whenever there's room for the pair. */
    .cmp-tool-group { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    /* Optional labels on the chart-type buttons — hidden by default (icon-only)
       and revealed by the container query once the toolbar is wide enough. */
    .cmp-chart-label { display: none; font-size: var(--fs-label); font-weight: 600; white-space: nowrap; }
    /* Split "＋ Add" control — ONE pill split into a left face (opens the guided
       add chat) and a right caret (opens a type dropdown), joined by a divider.
       The wrapper is the pill: it owns the rounding + shadow and clips the two
       flush buttons inside it, so they read as a single fused control. */
    .cmp-add-wrap { display: inline-flex; }
    /* Solo "＋ Add <kind>" pill — the comparison is locked to one kind, so the
       old split control (face + type-caret) is gone; this is a single CTA. */
    .cmp-add-solo { border-radius: 999px; }
    .cmp-add-split {
      display: inline-flex; align-items: stretch;
      border-radius: 999px; overflow: hidden; background: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 80, 124, 0.25);
    }
    .cmp-add-split .cmp-tool-btn { border-radius: 0; border: none; box-shadow: none; }
    .cmp-add-split .cmp-tool-btn:hover:not(:disabled) { transform: none; box-shadow: none; background: #1e4266; }
    .cmp-add-split .cmp-add-caret {
      border-left: 1px solid rgba(255, 255, 255, 0.4);
      padding-left: 9px; padding-right: 9px; gap: 0;
    }
    .cmp-add-split .cmp-add-caret .material-symbols-outlined { font-size: 18px !important; }
    /* Body-portalled dropdown — fixed + high z-index so it floats above every
       board element instead of being clipped beneath them. Positioned in JS. */
    .cmp-add-menu {
      position: fixed; z-index: 5000;
      min-width: 190px; padding: 6px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: 0 16px 40px rgba(8, 12, 20, 0.24);
      display: flex; flex-direction: column; gap: 2px;
    }
    .cmp-add-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
      padding: 8px 10px; border: none; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--text); font-size: var(--fs-label); font-weight: 600;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .cmp-add-menu-item .material-symbols-outlined { font-size: 17px !important; color: var(--text-subtle); }
    .cmp-add-menu-item:hover { background: var(--surface-2); color: var(--primary-ink, var(--primary)); }
    .cmp-add-menu-item:hover .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }

    /* Trailing "add a competitor" column — shown only in the default state when
       just YOUR own food is on the board. It's painted as ONE tall cell that
       spans every row of the grid, so the faint diagonal stripe wash runs
       unbroken down the whole column (no cell-by-cell seams). The call-to-action
       lives at the top; the rest of the column is intentionally blank. */
    /* Soft two-tone packaged-food pattern wash in place of the old diagonal
       stripes — a monochromatic navy-on-off-white illustration tiled down the
       column. A translucent surface overlay is layered on top to fade the pattern
       so the call-to-action copy stays crisp and legible. */
    .cmp-addcol {
      background-color: var(--surface);
      background-image:
        linear-gradient(color-mix(in srgb, var(--surface) 78%, transparent),
                        color-mix(in srgb, var(--surface) 78%, transparent)),
        url("../assets/food-pattern-bg.png");
      background-repeat: no-repeat, repeat;
      background-size: auto, 300px auto;
      border-left: 1px dashed var(--border-strong) !important;
    }
    /* Vertically center the CTA within the tall spanning column. */
    .cmp-addcol-span { display: flex; flex-direction: column; align-items: stretch; justify-content: center; }
    .cmp-addcol-inner {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; width: 100%;
      padding: 20px 16px;
    }
    .cmp-addcol-plus {
      width: 40px; height: 40px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary-ink, var(--primary));
    }
    .cmp-addcol-plus .material-symbols-outlined { font-size: 24px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-addcol-title { font-size: calc(var(--fs-ui) + 3px); font-weight: 800; color: var(--text); line-height: 1.2; }
    .cmp-addcol-sub { font-size: calc(var(--fs-label) + 1px); color: var(--text-muted); line-height: 1.45; max-width: 210px; }
    .cmp-addcol-inner .cmp-add-wrap { margin-top: 8px; }
    /* Enlarged Add split control inside the column so the primary CTA stands out. */
    .cmp-addcol .cmp-add-split .cmp-tool-btn { font-size: calc(var(--fs-label) + 3px); padding: 11px 20px; }
    .cmp-addcol .cmp-add-split .cmp-add-main .material-symbols-outlined { font-size: 22px !important; }
    /* Same enlargement for the solo (locked-kind) Add button. */
    .cmp-addcol .cmp-add-solo { font-size: calc(var(--fs-label) + 3px); padding: 11px 20px; }
    .cmp-addcol .cmp-add-solo .material-symbols-outlined { font-size: 22px !important; }
    .cmp-addcol .cmp-add-split .cmp-add-caret { padding-left: 12px; padding-right: 12px; }
    .cmp-addcol .cmp-add-split .cmp-add-caret .material-symbols-outlined { font-size: 22px !important; }

    /* Merged Category control — one pill covering both "which category" and
       "show its average overlay". The face reflects the active category (plus
       an AVG badge when the overlay is on); the body-portalled popover holds
       the average toggle above the category list. */
    .cmp-cat-wrap { display: inline-flex; }
    .cmp-cat-btn { gap: 7px; }
    .cmp-cat-btn.has-avg { border-color: var(--primary); color: var(--primary-ink, var(--primary)); }
    .cmp-cat-btn.has-avg > .material-symbols-outlined { color: var(--primary-ink, var(--primary)) !important; }
    .cmp-cat-btn-label { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp-cat-avg-badge {
      font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      background: var(--primary); color: #fff; border-radius: 999px; padding: 2px 6px; line-height: 1;
    }
    .cmp-cat-caret { font-size: 16px !important; color: var(--text-subtle); margin-left: -2px; }
    .cmp-cat-menu {
      position: fixed; z-index: 5000; width: 244px; padding: 6px;
      border-radius: 14px; background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: 0 16px 40px rgba(8, 12, 20, 0.24);
    }
    .cmp-cat-menu-hd { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-subtle); padding: 6px 8px 4px; }
    .cmp-cat-avg-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
      padding: 8px 10px; border: none; border-radius: 10px; cursor: pointer; background: transparent;
      color: var(--text); font-size: var(--fs-label); font-weight: 600;
    }
    .cmp-cat-avg-row:hover { background: var(--surface-2); }
    .cmp-cat-avg-txt { display: inline-flex; align-items: center; gap: 8px; }
    .cmp-cat-avg-txt .material-symbols-outlined { font-size: 17px !important; color: var(--text-subtle); }
    .cmp-cat-avg-row.is-on .cmp-cat-avg-txt .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }
    .cmp-cat-avg-row .cmp-switch-track { flex: 0 0 auto; }
    .cmp-cat-avg-row.is-on .cmp-switch-track { background: var(--primary); }
    .cmp-cat-avg-row.is-on .cmp-switch-track::after { transform: translateX(16px); }
    .cmp-cat-menu-div { height: 1px; background: var(--border); margin: 6px 4px; }
    .cmp-cat-menu-list { display: flex; flex-direction: column; gap: 2px; max-height: 258px; overflow-y: auto; }
    .cmp-cat-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
      padding: 8px 10px; border: none; border-radius: 8px; cursor: pointer; background: transparent;
      color: var(--text); font-size: var(--fs-label); font-weight: 600;
    }
    .cmp-cat-item:hover { background: var(--surface-2); }
    .cmp-cat-item.is-active { color: var(--primary-ink, var(--primary)); }
    .cmp-cat-check { font-size: 17px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-hcell--tools .cmp-tool-spacer { display: none; }
    /* If the wrapped controls run taller than the default tile height, let the
       neighbouring image tiles grow with the row so the header stays flush. */
    .cmp-grid .cmp-cell--entity.cmp-hcell .cmp-tile { height: 100%; min-height: 224px; }

    /* ≥ 300px: enough room to push the chart toggle + Add over to the right. */
    @container cmptools (min-width: 300px) {
      .cmp-hcell--tools .cmp-tool-spacer { display: block; flex: 1; }
    }
    /* ≥ 420px: the chart-type buttons gain text labels alongside their icons. */
    @container cmptools (min-width: 420px) {
      .cmp-chart-label { display: inline; }
      .cmp-hcell--tools .cmp-chart-btn { width: auto; gap: 5px; padding: 0 10px; }
    }

    /* In-board fallback header — only rendered when the real panel header is
       collapsed by "Header float" appearance mode. Kept out of the way of the
       ⋯ controls that float over the top-right corner in that mode. */
    .cmp-board-head { display: none; }
    html.header-float #compare-panel .cmp-board-head {
      display: block;
      padding: 4px 48px 8px 0;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .cmp-board-title { font-family: 'WISE Digits', var(--font-serif); font-size: 1.2rem; font-weight: 800; color: var(--text); line-height: 1.15; }
    .cmp-board-meta { font-size: var(--fs-label); color: var(--text-muted); margin-top: 1px; }

    /* Chart-type toggle — segmented pill sitting left of the Add button.
       Health bars (default) · spider · parallel coordinates. */
    .cmp-chart-toggle {
      display: inline-flex; align-items: center; gap: 2px; padding: 2px;
      border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface);
    }
    .cmp-chart-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 26px; border: none; background: transparent; cursor: pointer;
      border-radius: 999px; color: var(--text-subtle); transition: all 0.15s ease;
    }
    .cmp-chart-btn .material-symbols-outlined { font-size: 17px !important; }
    .cmp-chart-btn:hover:not(.is-active) { color: var(--text); }
    .cmp-chart-btn.is-active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(37,80,124,0.25); }

    /* Spider (radar) chart */
    .cmp-radar-wrap {
      margin-top: 12px; padding: 14px 15px 13px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .cmp-radar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .cmp-radar-title { font-family: 'WISE Digits', var(--font-serif); font-size: 1.05rem; font-weight: 800; color: var(--text); }
    .cmp-radar-sub { font-size: var(--fs-label); color: var(--text-muted); }
    .cmp-radar-canvas { display: flex; justify-content: center; }
    /* Square stage that shrinks to the SVG so the % positioned vertex-bug
       overlay lands exactly on the polygon nodes. */
    .cmp-radar-stage { position: relative; width: 100%; max-width: 380px; }
    .cmp-radar-svg { display: block; width: 100%; max-width: none; height: auto; overflow: visible; }
    .cmp-radar-ring { fill: none; stroke: var(--border-strong); stroke-width: 1; opacity: 0.7; }
    .cmp-radar-spoke { stroke: var(--border-strong); stroke-width: 1; opacity: 0.6; }
    .cmp-radar-tick { fill: var(--text-subtle); font-size: 9px; font-weight: 700; }
    .cmp-radar-label { fill: var(--text); font-size: 10px; font-weight: 700; dominant-baseline: middle; }
    .cmp-radar-avg { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.65; }
    .cmp-radar-area {
      fill-opacity: 0.16; stroke-width: 2; stroke-linejoin: round;
      transform-origin: center; transform-box: fill-box;
      animation: cmpRadarIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay, 0ms);
    }
    .cmp-radar-series circle {
      animation: cmpRadarDot 0.4s ease both;
      animation-delay: calc(var(--delay, 0ms) + 160ms);
    }
    @keyframes cmpRadarIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes cmpRadarDot { from { opacity: 0; } to { opacity: 1; } }
    .cmp-radar-legend { display: flex; flex-wrap: wrap; gap: 7px 16px; justify-content: center; margin-top: 12px; }
    .cmp-radar-key { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-label); font-weight: 600; color: var(--text); }
    .cmp-radar-key-name { line-height: 1.2; }
    .cmp-radar-swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .cmp-radar-swatch--avg { background: transparent; border: 1.5px dashed var(--text); border-radius: 50%; }
    /* Circular legend marker matching each entity's KIND: a product photo, a
       brand logo, or the category icon — the same visual language as the board
       tiles / race bugs. Sized in em so it scales with the legend font and
       stays responsive across breakpoints. */
    .cmp-legend-bug {
      position: relative; width: 1.7em; height: 1.7em; min-width: 16px; min-height: 16px;
      border-radius: 50%; overflow: hidden; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--lc, var(--primary)); color: #fff;
      font-size: 0.7em; font-weight: 800; line-height: 1; letter-spacing: 0.01em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.28); box-sizing: border-box;
    }
    .cmp-legend-bug img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--lc, var(--primary)); }
    .cmp-legend-bug .material-symbols-outlined { font-size: 1.45em !important; color: #fff; line-height: 1; }
    .cmp-radar-note {
      display: flex; align-items: center; gap: 8px; justify-content: center; text-align: center;
      padding: 22px 12px; font-size: var(--fs-ui); color: var(--text-muted);
    }
    .cmp-radar-note .material-symbols-outlined { font-size: 19px !important; color: var(--text-subtle); }

    /* Parallel-coordinates chart — one vertical axis per metric, one polyline
       per entity crossing every axis. Reuses the radar wrap/head/legend chrome. */
    .cmp-par-plot { max-width: 720px; margin: 0 auto; }
    .cmp-par-svg { width: 100%; max-width: none; height: auto; overflow: visible; }
    /* Overlay layer for the vertex bugs — sized to exactly match the SVG box so
       percentage-positioned markers land on each polyline node. */
    .cmp-par-canvas { position: relative; }
    .cmp-par-bugs { position: absolute; inset: 0; pointer-events: none; }
    .cmp-par-bug {
      position: absolute; transform: translate(-50%, -50%);
      width: 22px; height: 22px; min-width: 22px; min-height: 22px;
      font-size: 11px; border: 1.5px solid #fff;
      opacity: 0; animation: cmpRadarDot 0.32s ease forwards;
    }
    .cmp-par-bug .material-symbols-outlined { font-size: 14px !important; }
    .cmp-par-axis { stroke: var(--border-strong); stroke-width: 1.25; opacity: 0.85; }
    .cmp-par-axis-dot { fill: var(--text-subtle); opacity: 0.75; }
    .cmp-par-grid { stroke: var(--border-strong); stroke-width: 1; opacity: 0.35; stroke-dasharray: 3 4; }
    .cmp-par-tick { fill: var(--text-subtle); font-size: 9px; font-weight: 700; }
    /* HTML metric labels beneath the plot — one shared top baseline, wrap to
       multiple lines when crowded, aligned to each axis by fractional left. */
    .cmp-par-labels { position: relative; min-height: 30px; margin-top: 5px; }
    .cmp-par-xlabel {
      position: absolute; top: 0; transform: translateX(-50%); text-align: center;
      font-size: 9.5px; font-weight: 700; line-height: 1.2; color: var(--text);
      overflow-wrap: anywhere;
    }
    .cmp-par-xlabel.is-start { transform: none; text-align: left; }
    .cmp-par-xlabel.is-end { transform: none; text-align: right; }
    .cmp-par-avg { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.6; }
    /* Polylines draw on from left to right using a normalized path length. */
    .cmp-par-series {
      fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: cmpParDraw 0.85s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: var(--delay, 0ms);
    }
    .cmp-par-series-g circle {
      opacity: 0; animation: cmpRadarDot 0.32s ease forwards;
      animation-delay: calc(var(--delay, 0ms) + var(--dd, 0) * 110ms + 90ms);
    }
    @keyframes cmpParDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

    /* Race chart — one horizontal track per metric, each entity a circular
       brand "bug" positioned by its score with the number tucked on its edge,
       racing in from the start line. The category average sits inline beside
       the metric label. Reuses the radar wrap/head/legend chrome. */
    .cmp-race-row { padding: 6px 0; border-top: 1px solid var(--border); }
    .cmp-race-metric { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .cmp-race-avg-inline {
      margin-left: 10px; font-size: var(--fs-label); font-weight: 600; color: var(--text-muted);
      display: inline-flex; align-items: baseline; gap: 4px;
    }
    .cmp-race-avg-inline b { font-weight: 800; color: var(--text); }
    .cmp-race-metric-ic {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: #0B0B0F; border: none;
    }
    .cmp-race-metric-ic .material-symbols-outlined { font-size: 12px !important; color: #fff !important; }
    .cmp-race-metric-ic--btn { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .cmp-race-metric-ic--btn:hover { transform: scale(1.1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
    .cmp-race-metric-ic--btn:active { transform: scale(0.94); }
    .cmp-race-metric-ic--btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .cmp-race-metric-name { font-size: var(--fs-label); font-weight: 700; color: var(--text); }
    .cmp-race-track {
      position: relative; height: 54px; margin-top: 2px; cursor: pointer;
      border-radius: 999px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--sec-red) 12%, transparent), color-mix(in srgb, var(--ter-amber) 10%, transparent) 55%, color-mix(in srgb, var(--sec-green) 14%, transparent));
    }
    .cmp-race-lane { position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--border-strong); opacity: 0.45; border-radius: 2px; }
    .cmp-race-avgmark { position: absolute; top: 4px; bottom: 4px; width: 0; border-left: 1.5px dashed var(--text); opacity: 0.55; transform: translateX(-0.5px); }
    .cmp-race-runner {
      position: absolute; top: 50%; left: var(--pos, 0%);
      transform: translate(-50%, -50%);
      width: 40px; height: 40px; cursor: pointer;
      animation: cmpRaceRun 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay, 0ms);
    }
    .cmp-race-runner.is-primary { z-index: 6; }
    /* Hovering a runner lifts it above its neighbours and reveals a popover
       naming the food and its score — vital where circles overlap. */
    .cmp-race-runner:hover { z-index: 40 !important; }
    .cmp-race-pop {
      position: absolute; left: 50%; bottom: calc(100% + 9px); transform: translateX(-50%) translateY(4px);
      display: flex; align-items: center; gap: 7px; white-space: nowrap;
      padding: 6px 10px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: 0 10px 26px rgba(0,0,0,0.30);
      opacity: 0; pointer-events: none; z-index: 50;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .cmp-race-pop::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: var(--surface);
      filter: drop-shadow(0 1px 0 var(--border-strong));
    }
    .cmp-race-runner:hover .cmp-race-pop { opacity: 1; transform: translateX(-50%) translateY(0); }
    .cmp-race-pop-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .cmp-race-pop-name { font-size: var(--fs-label); font-weight: 700; color: var(--text); }
    .cmp-race-pop-score {
      font-size: 10px; font-weight: 800; color: #fff; background: #16202e;
      border-radius: 999px; padding: 1px 7px; line-height: 1.4; font-variant-numeric: tabular-nums;
    }
    .cmp-race-bug {
      position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--rc, var(--primary)); color: #fff;
      font-size: 13px; font-weight: 800; line-height: 1;
      box-shadow: 0 2px 7px rgba(0,0,0,0.30);
    }
    .cmp-race-bug img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--rc, var(--primary)); }
    .cmp-race-bug .material-symbols-outlined { font-size: 17px !important; color: #fff; line-height: 1; }
    /* Score badge straddling the bottom edge of the circle — a solid dark pill
       with a light ring to separate it from the logo, so it stays crisp and
       legible against any brand colour or artwork. */
    .cmp-race-num {
      position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); z-index: 3;
      font-size: 10.5px; font-weight: 800; color: #fff; letter-spacing: 0.02em; font-variant-numeric: tabular-nums;
      background: #16202e;
      border: 1.5px solid var(--surface);
      border-radius: 999px; padding: 1px 6px; min-width: 20px; text-align: center; line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
    }
    @keyframes cmpRaceRun { from { left: 0%; opacity: 0; } to { left: var(--pos, 0%); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cmp-race-runner { animation: none; }
    }

    .cmp-tool-select {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
      border-radius: 999px; font-size: var(--fs-label); font-weight: 600;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    }
    .cmp-tool-select .material-symbols-outlined { font-size: 15px !important; color: var(--text-subtle); }
    .cmp-tool-select select {
      border: none; background: transparent; color: var(--text); font: inherit;
      font-weight: 600; cursor: pointer; outline: none;
    }
    /* Category-average toggle switch */
    .cmp-switch { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-label); font-weight: 600; color: var(--text); cursor: pointer; }
    .cmp-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .cmp-switch-track {
      width: 34px; height: 18px; border-radius: 999px; background: var(--border-strong);
      position: relative; transition: background 0.15s ease; flex-shrink: 0;
    }
    .cmp-switch-track::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; transition: transform 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .cmp-switch input:checked + .cmp-switch-track { background: var(--primary); }
    .cmp-switch input:checked + .cmp-switch-track::after { transform: translateX(16px); }

    /* Metric picker popover */
    .cmp-metric-menu {
      position: absolute; z-index: 60; margin-top: 6px; width: 300px; max-height: 340px; overflow-y: auto;
      padding: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card, 0 12px 40px rgba(0,0,0,0.4));
    }
    .cmp-metric-menu[hidden] { display: none; }
    .cmp-metric-group { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); padding: 8px 8px 3px; }
    .cmp-metric-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: var(--fs-ui); color: var(--text); }
    .cmp-metric-opt:hover { background: var(--surface-2); }
    .cmp-metric-opt input { accent-color: var(--primary); width: 15px; height: 15px; }
    .cmp-metric-opt.is-future { opacity: 0.5; cursor: not-allowed; }
    .cmp-metric-opt .cmp-future-tag { margin-left: auto; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-subtle); }

    /* Summary line */
    .cmp-summary { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .cmp-summary-title { font-size: 1.05rem; font-weight: 800; color: var(--text); line-height: 1.15; }
    .cmp-summary-meta { font-size: var(--fs-label); color: var(--text-muted); }
    .cmp-summary-gen { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-label); color: var(--primary-ink, var(--primary)); font-weight: 600; }
    .cmp-summary-gen .material-symbols-outlined { font-size: 13px !important; }

    /* The comparison grid — metric rail + entity columns, aligned by CSS grid.
       Fully responsive: columns share the available width and shrink to fit,
       so the board never needs a horizontal scrollbar — only vertical. */
    .cmp-grid-wrap { overflow-x: hidden; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); }
    .cmp-grid { display: grid; width: 100%; min-width: 0; }
    .cmp-cell { padding: 10px 12px; border-bottom: 1px solid var(--border); min-width: 0; }
    .cmp-cell--rail {
      position: sticky; left: 0; z-index: 2;
      background: var(--surface-2); border-right: 1px solid var(--border);
    }
    .cmp-cell--entity + .cmp-cell--entity { border-left: 1px solid var(--border); }
    .cmp-grid > .cmp-cell:nth-last-child(-n + 1) { }

    /* Header row */
    .cmp-hcell { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .cmp-rank {
      width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; background: var(--primary); color: #fff;
    }
    .cmp-tile {
      width: 100%; height: 74px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 800; color: #fff; letter-spacing: 0.02em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .cmp-ent-name { font-size: var(--fs-ui); font-weight: 700; color: var(--text); line-height: 1.2; overflow-wrap: anywhere; }
    .cmp-ent-cat { font-size: var(--fs-label); color: var(--text-muted); overflow-wrap: anywhere; }
    .cmp-rail-title { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
    .cmp-rail-h { font-size: 1.0rem; font-weight: 800; color: var(--text); line-height: 1.1; margin-top: 2px; }

    /* Score row */
    .cmp-score-num { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1; }
    .cmp-score-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-subtle); margin-top: 2px; }
    .cmp-top-pill { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: var(--sec-green-10); color: var(--sec-green-text); }
    .cmp-top-pill.tp-mid { background: var(--ter-amber-10); color: var(--ter-amber-text); }

    /* Metric rows */
    .cmp-rail-metric { display: flex; flex-direction: column; gap: 1px; }
    .cmp-rail-metric-name { display: flex; align-items: center; gap: 6px; font-size: var(--fs-ui); font-weight: 600; color: var(--text); }
    .cmp-rail-metric-name .material-symbols-outlined { font-size: 15px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-rail-metric-avg {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 1px 7px; line-height: 1.4; white-space: nowrap;
    }
    .cmp-rail-metric-hint { font-size: 9px; color: var(--text-subtle); padding-left: 21px; }
    .cmp-metric-cell { display: flex; align-items: center; gap: 8px; min-width: 0; height: 100%; }
    .cmp-grade {
      width: 30px; flex-shrink: 0; text-align: center; padding: 2px 0; border-radius: 6px;
      font-size: var(--fs-label); font-weight: 800;
    }
    .cmp-grade.g-a { background: var(--sec-green-10); color: var(--sec-green-text); }
    .cmp-grade.g-b { background: var(--sec-green-10); color: var(--sec-green-text); }
    .cmp-grade.g-c { background: var(--ter-amber-10); color: var(--ter-amber-text); }
    .cmp-grade.g-d { background: var(--sec-red-10); color: var(--sec-red-text); }
    .cmp-bar-outer { position: relative; flex: 1 1 0; min-width: 18px; height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--text-subtle) 22%, transparent); overflow: visible; }
    .cmp-bar-fill { display: block; height: 100%; border-radius: 999px; }
    .cmp-bar-fill.g-a { background: var(--sec-green); }
    .cmp-bar-fill.g-b { background: var(--sec-green); }
    .cmp-bar-fill.g-c { background: var(--ter-amber); }
    .cmp-bar-fill.g-d { background: var(--sec-red); }
    /* Dotted category-average reference marker overlaid on each metric bar */
    .cmp-avg-mark { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 2px dotted var(--text); opacity: 0.65; }
    .cmp-metric-val { font-size: var(--fs-label); font-weight: 700; color: var(--text); width: 26px; text-align: right; flex-shrink: 0; }
    .cmp-metric-na { font-size: var(--fs-label); color: var(--text-subtle); font-style: italic; }

    /* Category-average column styling */
    .cmp-cell--avg { background: color-mix(in srgb, var(--primary) 7%, transparent); }
    .cmp-cell--avg.cmp-cell--rail { background: var(--surface-2); }
    .cmp-avg-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--primary-ink, var(--primary)); }
    .cmp-avg-badge .material-symbols-outlined { font-size: 12px !important; }

    /* Insight row */
    .cmp-insight { display: flex; flex-direction: column; gap: 4px; }
    .cmp-insight-head { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--primary-ink, var(--primary)); }
    .cmp-insight-head .material-symbols-outlined { font-size: 13px !important; }
    .cmp-insight-body { font-size: var(--fs-label); color: var(--text-muted); line-height: 1.45; }
    /* Inline chat affordance on each generated insight — continue the
       conversation about that specific product's insight. Brand blue. */
    .cmp-insight-chat {
      display: inline-flex; align-items: center; vertical-align: middle;
      margin-left: 3px; color: var(--primary-ink, var(--primary)); cursor: pointer;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .cmp-insight-chat .material-symbols-outlined { font-size: 14px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-insight-chat:hover { opacity: 0.75; transform: scale(1.08); }
    .cmp-insight-chat:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    /* Key Takeaways — scorecard style: all four in a single horizontal row,
       each a vertical card. The icon disc is modeled after the scorecard stamp
       marks in analytics-types.html (.dash-stamp-icon): a debossed, tone-on-tone
       outlined circle in the brand ink — never a stark black or white icon. */
    .cmp-section-label { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
    /* Group the eyebrow with its cards so they read as one block — a small gap
       between the label and the grid, with clear breathing room above the eyebrow. */
    .cmp-takeaways-sec { display: flex; flex-direction: column; gap: 7px; margin-top: 18px; }
    /* Indent the eyebrow so it lines up with the card labels (which sit inside
       the card's 15px left padding) below it. */
    .cmp-takeaways-sec .cmp-section-label { padding-left: 15px; font-family: 'WISE Digits', var(--font-serif); font-size: 14px; text-transform: none; letter-spacing: 0.01em; }
    .cmp-takeaways { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: stretch; }
    /* Stat-block card: eyebrow + stamp icon on top, then a big serif score, the
       winning product, its metric label, a divider, and an AI "why" insight. */
    .cmp-takeaway {
      display: flex; flex-direction: column; align-items: stretch; gap: 0;
      padding: 13px 15px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border);
    }
    html.dark .cmp-takeaway { background: #1A2339; }
    html.chat-tint:not(.dark) .cmp-takeaway { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .cmp-takeaway { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .cmp-takeaway-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    /* Title + swap glyph sit together on the left; the stamp icon stays right. */
    .cmp-takeaway-titlewrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .cmp-takeaway-swap-wrap { position: relative; display: inline-flex; }
    .cmp-takeaway-swap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; border: 0; border-radius: 5px;
      background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease, transform 0.12s ease;
    }
    .cmp-takeaway-swap .material-symbols-outlined {
      font-size: 15px !important; line-height: 1;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'opsz' 20;
    }
    .cmp-takeaway-swap:hover { color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 10%, transparent); transform: scale(1.06); }
    .cmp-takeaway-swap[aria-expanded="true"] { color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .cmp-takeaway-swap:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    /* Swap menu — compact popover of the takeaways not already on the board.
       Rendered as a viewport-fixed popover (appended to <body>) and placed by
       JS so it's never clipped by the card / scroll container. It defaults to
       opening upward and flips to whichever side has room. */
    .cmp-takeaway-menu {
      position: fixed; top: 0; left: 0; z-index: 1000;
      min-width: 190px; max-height: min(70vh, 360px); overflow-y: auto;
      padding: 5px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: 0 18px 44px -10px rgba(17, 24, 39, 0.40), 0 4px 12px rgba(17, 24, 39, 0.16);
      animation: cmpTakeawayMenuIn 0.14s ease;
    }
    @keyframes cmpTakeawayMenuIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .cmp-takeaway-menu-title {
      font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-subtle); padding: 5px 8px 4px;
    }
    .cmp-takeaway-menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 7px 8px; border: 0; border-radius: 8px; background: transparent;
      text-align: left; cursor: pointer; color: var(--text);
      transition: background 0.12s ease;
    }
    .cmp-takeaway-menu-item:hover { background: var(--surface-2); }
    .cmp-takeaway-menu-item.is-active { background: color-mix(in srgb, var(--primary) 9%, transparent); }
    .cmp-takeaway-menu-ic { font-size: 16px !important; color: var(--primary-ink, var(--primary)); font-variation-settings: 'FILL' 0, 'wght' 400, 'opsz' 20; }
    .cmp-takeaway-menu-lbl { flex: 1; min-width: 0; font-size: 0.8125rem; font-weight: 600; }
    .cmp-takeaway-menu-check { font-size: 15px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-takeaway-ic {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1.5px solid color-mix(in srgb, var(--primary) 14%, var(--surface-3));
      color: color-mix(in srgb, var(--primary) 26%, var(--surface-3));
      box-shadow:
        inset 0 1px 1px rgba(17, 24, 39, 0.07),
        inset 0 -1px 0 rgba(255, 255, 255, 0.55),
        0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .cmp-takeaway-ic .material-symbols-outlined {
      font-size: 17px !important; line-height: 1; color: inherit !important;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'opsz' 20;
    }
    .cmp-takeaway-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); }
    /* Big serif score — the "47"-style stat numeral. */
    .cmp-takeaway-score { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text); line-height: 1.05; margin-top: 9px; }
    /* Winning product = the bold title beneath the number. */
    .cmp-takeaway-val { font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.2; margin-top: 3px; }
    /* Metric label = the muted subtitle. */
    .cmp-takeaway-sub-lbl { font-size: var(--fs-label); color: var(--text-muted); margin-top: 2px; line-height: 1.3; }
    .cmp-takeaway-sep { border: 0; border-top: 1px solid var(--border); margin: 11px 0 10px; }
    /* AI-generated "why" insight + inline chat affordance. */
    .cmp-takeaway-insight { min-width: 0; }
    .cmp-takeaway-insight-body { min-width: 0; font-size: var(--fs-label); color: var(--text-muted); line-height: 1.45; }
    /* Inline chat affordance — flows right after the last word of the insight
       (like .cmp-insight-chat), not floated to the top-right of the block. */
    .cmp-takeaway-chat {
      display: inline-flex; align-items: center; vertical-align: middle;
      margin-left: 3px; color: var(--primary-ink, var(--primary)); cursor: pointer;
      transition: opacity 0.15s ease, transform 0.12s ease;
    }
    .cmp-takeaway-chat .material-symbols-outlined { font-size: 15px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-takeaway-chat:hover { opacity: 0.75; transform: scale(1.08); }
    .cmp-takeaway-chat:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    /* Ranked Summary */
    .cmp-ranked { border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
    .cmp-rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
    .cmp-rank-row + .cmp-rank-row { border-top: 1px solid var(--border); }
    .cmp-rank-badge { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; background: var(--border-strong); color: var(--text); flex-shrink: 0; }
    .cmp-rank-row:first-child .cmp-rank-badge { background: var(--primary); color: #fff; }
    .cmp-rank-name { flex: 1; min-width: 0; font-size: var(--fs-ui); font-weight: 600; color: var(--text); }
    .cmp-rank-score { font-size: var(--fs-ui); font-weight: 800; color: var(--text); }
    .cmp-rank-bar { width: 90px; height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--text-subtle) 22%, transparent); overflow: hidden; flex-shrink: 0; }
    .cmp-rank-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }

    /* Ingredient drill-down */
    .cmp-drill { border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 12px; }
    .cmp-drill-note { font-size: var(--fs-label); color: var(--text-muted); margin: 0 0 8px; padding-left: 15px; line-height: 1.4; }
    .cmp-drill-note strong { color: var(--text); font-weight: 700; }
    .cmp-drill-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .cmp-drill-row + .cmp-drill-row { border-top: 1px solid var(--border); }
    .cmp-drill-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .cmp-drill-name { flex: 1; min-width: 0; font-size: var(--fs-ui); color: var(--text); }
    .cmp-drill-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 999px; }
    .cmp-drill-tag.t-red { background: var(--sec-red-10); color: var(--sec-red-text); }
    .cmp-drill-tag.t-amber { background: var(--ter-amber-10); color: var(--ter-amber-text); }
    .cmp-drill-tag.t-green { background: var(--sec-green-10); color: var(--sec-green-text); }

    .cmp-foot-note { font-size: var(--fs-label); color: var(--text-subtle); text-align: center; padding: 2px 0 4px; }

    /* ════════════════════════════════════════════════════════════════════
       COMPARE BOARD — vibrant, clean redesign (matches the reference deck).
       Distinct grade colours (green / blue / amber / red — not the muted
       brand navy), colourful metric icons, package-style product tiles,
       thick gradient bars, and tinted insight cards. Everything sizes with
       the column so the board stays responsive (vertical scroll only).
       Appended last so these rules win over the base styling above.
       ════════════════════════════════════════════════════════════════════ */
    .cmp-body { gap: 14px; padding: 14px; }
    /* CRITICAL: #cmp-body is a flex column and its own vertical scroller.
       Flex children default to flex-shrink:1, so a tall grid gets *squeezed*
       to fit (and clipped by overflow:hidden) instead of overflowing and
       scrolling. Locking every section to flex-shrink:0 lets the body grow
       past its height and scroll vertically as it must. */
    .cmp-body > *:not(.cmp-empty) { flex-shrink: 0; }
    .cmp-grid-wrap {
      position: relative;
      overflow: hidden; border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }

    /* ── Recalculate flow: pending entrants + visible recompute ─────────────
       Adding a competitor through the chat drops a *pending* column onto the
       board (ghosted, unranked) and surfaces this bar. Recalculating runs a
       visible recompute (scanning sweep + spinner), then folds the newcomer
       into the ranking with a settle animation — so updates are explicit and
       feel responsive rather than silently mutating underfoot. */
    .cmp-recalc-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 13px;
      background: linear-gradient(100deg, color-mix(in srgb, var(--primary) 13%, var(--surface)) 0%, var(--surface) 72%);
      border: 1px solid color-mix(in srgb, var(--primary) 38%, var(--border));
      box-shadow: var(--shadow-1);
      animation: cmpBarIn 0.28s ease both;
    }
    @keyframes cmpBarIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .cmp-recalc-ic {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary); color: #fff;
    }
    .cmp-recalc-ic .material-symbols-outlined { font-size: 19px !important; }
    .cmp-recalc-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
    .cmp-recalc-title { font-size: var(--fs-ui); font-weight: 800; color: var(--text); line-height: 1.15; }
    .cmp-recalc-sub { font-size: var(--fs-label); color: var(--text-muted); line-height: 1.3; }
    .cmp-recalc-btn {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 8px 15px; border-radius: 999px; font-size: var(--fs-label); font-weight: 800;
      border: none; background: var(--primary); color: #fff; transition: filter 0.15s ease;
    }
    .cmp-recalc-btn .material-symbols-outlined { font-size: 16px !important; }
    .cmp-recalc-btn:hover:not(:disabled) { filter: brightness(1.08); }
    .cmp-recalc-btn:disabled { opacity: 0.7; cursor: default; }
    .cmp-recalc-bar.is-running .cmp-recalc-ic .material-symbols-outlined,
    .cmp-recalc-bar.is-running .cmp-recalc-btn .material-symbols-outlined { animation: cmpSpin 0.9s linear infinite; }
    @keyframes cmpSpin { to { transform: rotate(360deg); } }

    /* Scanning sweep over the grid while it recomputes. */
    .cmp-grid-wrap.is-recalcing::after {
      content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: linear-gradient(100deg, transparent 0%, color-mix(in srgb, var(--primary) 20%, transparent) 50%, transparent 100%);
      background-size: 220% 100%;
      animation: cmpSweep 0.95s ease-in-out infinite;
    }
    @keyframes cmpSweep { from { background-position: 130% 0; } to { background-position: -130% 0; } }

    /* Pending entrant column — ghosted, striped and unranked until recalculated. */
    .cmp-cell.is-pending {
      background: repeating-linear-gradient(45deg,
        color-mix(in srgb, var(--primary) 7%, var(--surface)),
        color-mix(in srgb, var(--primary) 7%, var(--surface)) 9px,
        transparent 9px, transparent 18px);
    }
    .cmp-pending-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 800; background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary-ink, var(--primary));
    }
    .cmp-pending-badge .material-symbols-outlined { font-size: 12px !important; }
    .cmp-hcell .cmp-rank.cmp-rank--pending { background: var(--primary); color: #fff; }
    .cmp-hcell .cmp-rank.cmp-rank--pending .material-symbols-outlined { font-size: 14px !important; }
    .cmp-ghost {
      display: inline-block; height: 12px; border-radius: 6px; width: 68%;
      background: color-mix(in srgb, var(--text-subtle) 24%, transparent);
      animation: cmpGhost 1.1s ease-in-out infinite;
    }
    .cmp-ghost.cmp-ghost--bar { width: 100%; }
    .cmp-ghost.cmp-ghost--num { height: 26px; width: 46px; }
    @keyframes cmpGhost { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; } }

    /* Settle animation after a recompute — columns pop into their new rank. */
    .cmp-grid.cmp-settled .cmp-cell--entity { animation: cmpSettle 0.5s ease both; }
    @keyframes cmpSettle { from { opacity: 0.15; transform: translateY(9px) scale(0.98); } to { opacity: 1; transform: none; } }
    .cmp-cell { padding: 11px 12px; border-bottom: 1px solid var(--border); }
    /* Softer vertical rules; the primary (YOU) column gets a subtle wash. */
    .cmp-cell--entity + .cmp-cell--entity { border-left: 1px solid var(--border); }
    .cmp-cell--entity.is-primary { background: color-mix(in srgb, var(--primary) 5%, transparent); }
    .cmp-cell--rail { background: color-mix(in srgb, var(--text-subtle) 5%, var(--surface)); }
    html.dark .cmp-cell--rail { background: color-mix(in srgb, #ffffff 4%, transparent); }

    /* Header row — rail intro block + full-bleed entity tiles. Entity header
       cells collapse their padding so the tile runs edge-to-edge in its column;
       the rail header ("Compare Foods") keeps its normal padding. */
    .cmp-hcell { gap: 8px; padding-top: 13px; }
    .cmp-cell--rail.cmp-hcell { justify-content: center; padding-top: 12px; padding-bottom: 12px; }
    .cmp-cell--entity.cmp-hcell { gap: 0; padding: 0; }
    .cmp-rail-title { font-size: 9px; letter-spacing: 0.08em; }
    .cmp-rail-h { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
    /* Full-bleed image tile — taller, no drop shadow. The product photo / brand
       logo fills the whole tile; rank + name + label are layered on top. */
    .cmp-tile {
      width: 100%; height: 224px; border-radius: 0; position: relative; overflow: hidden;
      background: var(--surface-3);
      display: block; box-shadow: none;
    }
    .cmp-tile-img {
      position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
      object-fit: cover; padding: 0;
    }
    /* Bottom scrim so the overlaid name/label stay legible on any image — this
       is a background gradient, not a text shadow. */
    .cmp-tile-overlay {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 22px 12px 10px;
      display: flex; flex-direction: column; gap: 2px;
      background: linear-gradient(to top,
        rgba(8,12,20,0.82) 0%, rgba(8,12,20,0.55) 45%, rgba(8,12,20,0) 100%);
    }
    /* Rank badge over the top-left of the tile — solid chip, no shadow. */
    .cmp-hcell .cmp-rank {
      position: absolute; top: 9px; left: 9px; z-index: 3;
      width: 24px; height: 24px; background: #fff; color: #1A2339;
      box-shadow: none; border: 1px solid rgba(0,0,0,0.06);
    }
    /* Layered text: crisp white on the scrim, no shadow. */
    .cmp-hcell .cmp-ent-name {
      font-size: 0.9rem; font-weight: 800; color: #fff; text-shadow: none;
      line-height: 1.2; overflow-wrap: anywhere;
    }
    .cmp-hcell .cmp-ent-cat {
      font-size: var(--fs-label); font-weight: 600; color: rgba(255,255,255,0.86);
      text-shadow: none; overflow-wrap: anywhere;
    }
    .cmp-you-pill {
      display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px;
      font-size: 9px; font-weight: 800; background: var(--primary); color: #fff; vertical-align: middle;
    }
    /* Floated "YOU" chip — pinned to the top-right corner of the tile instead of
       riding inline after the product name in the bottom overlay. The primary
       ("YOU") column never carries a remove ×, so the top-right is free. */
    .cmp-you-float {
      position: absolute; top: 12px; right: 12px; z-index: 4;
      margin-left: 0; padding: 3px 8px; font-size: 10px;
      box-shadow: 0 1px 6px rgba(8,12,20,0.35);
    }
    /* Category = a first-class peer column. Neutral striped tile + dashed pill
       so it reads as a benchmark entity, distinct from a real product/brand. */
    .cmp-cat-pill {
      display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px;
      font-size: 9px; font-weight: 800; letter-spacing: 0.03em; vertical-align: middle;
      background: rgba(255,255,255,0.16); color: #fff; border: 1px dashed rgba(255,255,255,0.75);
    }
    /* Category tile — a clean slate gradient carrying the category's own icon
       as a large centred watermark, in place of the old diagonal stripes. */
    .cmp-cell--entity.is-category .cmp-tile {
      background: linear-gradient(155deg, #3A4C61 0%, #253546 55%, #1B2836 100%) !important;
    }
    .cmp-cat-ic {
      position: absolute; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.30);
      pointer-events: none;
    }
    .cmp-cat-ic .material-symbols-outlined { font-size: 108px !important; line-height: 1; }

    /* ── Circular WISEscore gauge on the header tile ────────────────────────
       Floats large in the dead-centre of the tile: a translucent dark halo
       keeps the number legible on any photo, and a full-circle track carries
       the coloured arc that sweeps to the score. The Top-% pill lives up in the
       top-left, tucked under the kind chip. Clicking replays the sweep +
       count-up (see cmpAnimateGauge). */
    .cmp-gauge {
      position: absolute; z-index: 3; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 122px; height: 122px;
      border: none; padding: 0; cursor: pointer; border-radius: 50%;
      background: radial-gradient(circle at center,
        rgba(8,12,20,0.55) 0%, rgba(8,12,20,0.34) 60%, rgba(8,12,20,0) 100%);
      transition: transform 0.14s ease;
    }
    .cmp-gauge:hover { transform: translate(-50%, -50%) scale(1.05); }
    .cmp-gauge:active { transform: translate(-50%, -50%) scale(0.95); }
    .cmp-gauge:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .cmp-gauge-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .cmp-gauge-track { fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 6.5; }
    .cmp-gauge-arc {
      fill: none; stroke: var(--gauge-color, var(--sec-green)); stroke-width: 6.5; stroke-linecap: round;
      transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cmp-gauge-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .cmp-gauge-num { font-size: 2.5rem; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -0.02em; }
    .cmp-gauge-lbl {
      margin-top: 3px; font-size: 8.5px; font-weight: 800; letter-spacing: 0.05em;
      text-transform: uppercase; color: rgba(255,255,255,0.85);
    }
    /* Top-% pill anchored to the top-left, directly beneath the kind chip. */
    .cmp-tile-toppill {
      position: absolute; top: 50px; left: 12px; z-index: 4; margin-top: 0;
      box-shadow: 0 1px 6px rgba(8,12,20,0.35);
    }
    @media (prefers-reduced-motion: reduce) {
      .cmp-gauge-arc { transition-duration: 0.01ms; }
    }

    /* WISEscore copy that now lives in the top-left corner cell, beneath the
       "Compare Foods" title (moved up from the retired score row's rail). */
    .cmp-corner-score { width: 100%; }
    /* Per-slot TYPE TOGGLE chip — sits top-LEFT of each column tile, taking the
       spot the standalone rank badge used to hold. The rank number now rides
       inside the chip as its leading badge, so numbering + type selector read as
       one control. The remove × stays at the tile's top-right. Tap to change the
       slot between product/portfolio/category. */
    /* Height + type scale are matched to the left-hand toolbar buttons
       (.cmp-tool-btn: 6px vertical padding, var(--fs-label)) so the on-tile
       dropdown reads as the same size as "Metrics" / "All Categories". */
    .cmp-kind-chip {
      position: absolute; top: 12px; left: 12px; z-index: 4;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px 6px 6px; border: none; border-radius: 999px; cursor: pointer;
      background: rgba(8,12,20,0.55); color: #fff; line-height: 1.3;
      font-size: var(--fs-label); font-weight: 800; letter-spacing: 0.02em;
    }
    .cmp-kind-chip:hover { background: rgba(8,12,20,0.78); }
    .cmp-kind-chip-label { text-transform: capitalize; }
    /* The rank number as the chip's icon — matches the old white rank badge so
       the "1, 2, 3…" reads identically now that it lives inside the dropdown. */
    .cmp-kind-chip .cmp-kind-rank {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: #fff; color: #1A2339; font-size: 11px; font-weight: 800;
      border: 1px solid rgba(0,0,0,0.06); text-transform: none; letter-spacing: 0;
    }
    /* Caret is fenced off with a full-height left divider — matched 1:1 to the
       "＋ Add" split control: the caret is pulled out past the chip's vertical
       padding (negative margins) so its border-left runs edge-to-edge like the
       Add pill's, with the same 9px inset and 18px glyph. */
    .cmp-kind-chip .cmp-kind-chip-caret {
      font-size: 18px !important; opacity: 0.9; align-self: stretch;
      display: inline-flex; align-items: center;
      border-left: 1px solid rgba(255,255,255,0.4);
      padding-left: 9px; padding-right: 9px;
      margin: -6px -10px -6px 0;
    }

    /* Per-slot type toggle — the proper floating dropdown the kind chip opens.
       Appended to <body> and fixed-positioned so it never clips inside the
       grid. Two type tabs + the specific-item list live in the one popover. */
    .cmp-kind-menu {
      position: fixed; z-index: 200; width: 246px; max-height: 340px;
      display: flex; flex-direction: column; overflow: hidden;
      padding: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card, 0 12px 40px rgba(0,0,0,0.4));
    }
    .cmp-kind-menu-hd { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); padding: 4px 4px 7px; }
    .cmp-kind-menu-tabs { display: flex; gap: 4px; margin-bottom: 7px; }
    .cmp-kind-menu-tab {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 4px; border: 1px solid var(--border-strong); border-radius: 8px;
      background: var(--surface); color: var(--text); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .cmp-kind-menu-tab .material-symbols-outlined { font-size: 14px !important; }
    .cmp-kind-menu-tab:hover { background: var(--surface-2); }
    .cmp-kind-menu-tab.is-active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .cmp-kind-menu-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .cmp-kind-menu-item {
      display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      padding: 7px 8px; border: none; border-radius: 8px; background: transparent;
      color: var(--text); font-size: var(--fs-ui); cursor: pointer;
    }
    .cmp-kind-menu-item:hover { background: var(--surface-2); }
    .cmp-kind-menu-item .material-symbols-outlined { font-size: 15px !important; color: var(--text-subtle); }
    .cmp-kind-menu-item.is-match .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }
    .cmp-kind-menu-item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp-kind-menu-empty { padding: 10px 8px; font-size: var(--fs-ui); color: var(--text-subtle); }

    /* WISEscore block — score sits left, the Top-% pill floats to the right.
       Everything is vertically centered within the cell's full height. */
    .cmp-score-cell { display: flex; align-items: center; align-content: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .cmp-score-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cmp-score-num { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
    .cmp-score-lbl { font-size: 9px; }
    .cmp-score-cell .cmp-top-pill { margin-top: 0; margin-left: auto; flex-shrink: 0; align-self: center; }
    .cmp-top-pill {
      margin-top: 6px; padding: 3px 9px; font-size: 10px; font-weight: 800;
      background: rgba(42,168,102,0.16); color: #1F8A50;
    }
    .cmp-top-pill.tp-mid { background: rgba(232,152,31,0.18); color: #8A5410; }
    .cmp-top-pill.tp-low { background: rgba(220,48,56,0.15); color: #B32A31; }
    html.dark .cmp-top-pill { color: #5FD79B; }
    html.dark .cmp-top-pill.tp-mid { color: #F5C877; }
    html.dark .cmp-top-pill.tp-low { color: #F58C86; }

    /* On-tile pill overrides — the tile floats over a photo / gradient, so the
       faint tint variants above are illegible there. These use solid, saturated
       fills with high-contrast text so the pill reads clearly on any tile, in
       both themes. `tp-cat` is a neutral slate benchmark chip for categories. */
    .cmp-tile-toppill { border: 1px solid rgba(255,255,255,0.28); }
    .cmp-tile-toppill,
    html.dark .cmp-tile-toppill { background: #2E9E5F; color: #fff; }
    .cmp-tile-toppill.tp-mid,
    html.dark .cmp-tile-toppill.tp-mid { background: #E8981F; color: #2A1A00; }
    .cmp-tile-toppill.tp-low,
    html.dark .cmp-tile-toppill.tp-low { background: #DC3038; color: #fff; }
    .cmp-tile-toppill.tp-cat,
    html.dark .cmp-tile-toppill.tp-cat {
      background: rgba(20,32,45,0.72); color: #fff; border: 1px dashed rgba(255,255,255,0.7);
    }

    /* Metric-rail icons — solid black circular badge, glyph rendered white.
       No outline stroke / outer ring (matches the WISE mobile app glyphs). */
    .cmp-rail-metric-ic {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: #0B0B0F; border: none;
    }
    .cmp-rail-metric-ic .material-symbols-outlined { font-size: 15px !important; color: #fff !important; }
    .cmp-rail-metric-ic--btn { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .cmp-rail-metric-ic--btn:hover { transform: scale(1.08); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
    .cmp-rail-metric-ic--btn:active { transform: scale(0.95); }
    .cmp-rail-metric-ic--btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .cmp-rail-metric-name { gap: 8px; font-weight: 700; }
    .cmp-rail-metric-name .material-symbols-outlined { color: var(--primary-ink, var(--primary)); }
    .cmp-rail-metric-hint { padding-left: 35px; font-size: 9px; }
    .cmp-rail-metric-hint { margin-top: 3px; color: var(--text-subtle); }
    /* Wordier synopsis under each metric, with an inline chat icon that opens
       a full explanation in the chat. */
    .cmp-rail-metric-desc {
      padding-left: 35px; margin-top: 3px;
      font-size: 10.5px; line-height: 1.4; color: var(--text-muted);
    }
    .cmp-rail-learn {
      display: inline-flex; align-items: center; vertical-align: middle;
      margin-left: 2px; color: var(--primary-ink, var(--primary)); cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .cmp-rail-learn .material-symbols-outlined { font-size: 14px !important; color: var(--primary-ink, var(--primary)); }
    .cmp-rail-learn:hover { opacity: 0.65; }

    /* Grade chips + bars — vivid and distinct. The score sits ABOVE the bar so
       the bar can run the full width of the cell; the letter grade is hidden. */
    .cmp-metric-cell { display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 5px; }
    /* The metric row's height is set by the taller rail cell (name + hint), so
       stretch the entity cell and vertically centre the stack within it. */
    .cmp-cell--entity:has(> .cmp-metric-cell) { display: flex; align-items: center; }
    .cmp-cell--entity > .cmp-metric-cell { width: 100%; }
    .cmp-metric-cell .cmp-metric-val { text-align: left; order: 0; width: auto; }
    /* Bar takes the whole width beneath the score (don't let flex stretch it
       vertically in the column layout). */
    .cmp-metric-cell .cmp-bar-outer { order: 1; width: 100%; flex: 0 0 auto; }
    .cmp-metric-cell .cmp-grade { display: none; }
    .cmp-grade { width: 32px; border-radius: 7px; font-weight: 800; padding: 3px 0; }
    .cmp-grade.g-a { background: rgba(42,168,102,0.16); color: #1F8A50; }
    .cmp-grade.g-b { background: rgba(42,168,102,0.12); color: #2E9E5F; }
    .cmp-grade.g-c { background: rgba(232,152,31,0.20); color: #8A5410; }
    .cmp-grade.g-d { background: rgba(220,48,56,0.16); color: #B32A31; }
    html.dark .cmp-grade.g-a { color: #5FD79B; }
    html.dark .cmp-grade.g-b { color: #7FE0A8; }
    html.dark .cmp-grade.g-c { color: #F5C877; }
    html.dark .cmp-grade.g-d { color: #F58C86; }
    /* Track = a 15% tint of the bar's own status colour; fill = the flat status
       colour — matched to the WISE dashboard health bars (dashboard.css pillar
       tracks): shared status tokens, 8px pill track, solid fill (no gradient).
       Clicking the cell replays the grow-in. */
    .cmp-bar-outer { height: 8px; border-radius: var(--radius-pill, 999px); background: color-mix(in srgb, var(--text-subtle) 15%, transparent); }
    .cmp-bar-outer.g-a { background: color-mix(in srgb, var(--sec-green) 15%, transparent); }
    .cmp-bar-outer.g-b { background: color-mix(in srgb, var(--sec-green) 15%, transparent); }
    .cmp-bar-outer.g-c { background: color-mix(in srgb, var(--ter-amber) 15%, transparent); }
    .cmp-bar-outer.g-d { background: color-mix(in srgb, var(--sec-red) 15%, transparent); }
    /* Grow-in animation: the fill is rendered at its target width, then
       scaleX-animates from 0→1 on load (every time the node is created) and
       on demand via cmpReplayBar(). transform-origin:left keeps it anchored. */
    .cmp-bar-fill {
      display: block; height: 100%;   /* CRITICAL: inline spans ignore width/height/transform */
      border-radius: var(--radius-pill, 999px);
      transform-origin: left center;
      animation: cmpBarGrow 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--i, 0) * 55ms);
    }
    @keyframes cmpBarGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .cmp-bar-fill { animation-duration: 0.01ms; animation-delay: 0ms; }
    }
    /* Flat status-token fills — same palette as the dashboard health bars. */
    .cmp-bar-fill.g-a { background: var(--sec-green); }
    .cmp-bar-fill.g-b { background: var(--sec-green); }
    .cmp-bar-fill.g-c { background: var(--ter-amber); }
    .cmp-bar-fill.g-d { background: var(--sec-red); }
    .cmp-metric-cell { cursor: pointer; }
    .cmp-metric-val { width: 28px; font-weight: 800; }

    /* Insight — plain copy in the row (the rail already labels it). */
    .cmp-insight { padding: 11px 12px 13px; }
    .cmp-insight-body { font-size: var(--fs-label); color: var(--text-muted); line-height: 1.5; }

    /* ════════════════════════════════════════════════════════════════════
       COMPARE RAIL — icon + body layout, compact collapse, hover flyout.
       The metric rail's icon is a direct child of .cmp-rail-metric and the
       textual content (name / description / hint) lives in .cmp-rail-body
       beside it. In the normal (wide) layout this reads exactly like the
       previous markup — icon left, name to its right, desc + hint stacked
       beneath. When the board carries 4+ entity columns the grid gains
       .cmp-grid--compact: the rail shrinks to an icon-only strip and the
       body becomes a floating card revealed on hover/focus, so the entity
       columns keep a legible width no matter how many are added.
       ════════════════════════════════════════════════════════════════════ */
    /* Two-column rail: a vertically-centred LEFT column holds the icon with
       its (smaller) label stacked directly beneath it; a vertically-centred
       RIGHT column holds the description. */
    .cmp-rail-metric { display: flex; flex-direction: row; align-items: center; gap: 10px; }
    .cmp-rail-metric-lead {
      flex: 0 0 92px; width: 92px; align-self: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; text-align: center;
    }
    .cmp-rail-body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
    .cmp-rail-metric > .cmp-rail-body { flex: 1 1 auto; align-self: center; }
    /* The label now sits UNDER the icon: centred, wrapping within the left
       column, and shrunk (down to a floor) so long names stay compact. */
    .cmp-rail-metric-lead .cmp-rail-metric-name {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; text-align: center; font-weight: 700; min-height: 0;
      font-family: 'WISE Digits', var(--font-serif);
      font-size: clamp(10.5px, 0.85vw, 12px); line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .cmp-rail-body .cmp-rail-metric-desc,
    .cmp-rail-body .cmp-rail-metric-hint { padding-left: 0; }
    /* Desc no longer needs to clear the icon since it lives in its own column. */
    .cmp-rail-metric > .cmp-rail-body .cmp-rail-metric-desc { margin-top: 0; }
    /* Header rail lead icon only appears in the collapsed layout. */
    .cmp-rail-lead-ic { display: none; }

    /* ── Compact (icon-only) rail ─────────────────────────────────────── */
    .cmp-grid--compact .cmp-cell--rail {
      position: relative; overflow: visible;
      padding-left: 6px; padding-right: 6px;
    }
    /* Let the hover flyout escape the rounded grid clip while compact. */
    .cmp-grid-wrap--compact { overflow: visible; }
    .cmp-grid--compact .cmp-rail-metric { justify-content: center; align-items: center; height: 100%; }
    /* Collapse the left column back to an icon-only strip so the entity
       columns keep their width; the label rejoins the desc in the flyout. */
    .cmp-grid--compact .cmp-rail-metric-lead { flex: 0 0 auto; width: auto; max-width: none; gap: 0; }
    .cmp-grid--compact .cmp-rail-metric-lead .cmp-rail-metric-name { display: none; }
    .cmp-grid--compact .cmp-cell--rail.cmp-hcell { justify-content: center; align-items: center; }
    .cmp-grid--compact .cmp-cell--rail.cmp-hcell .cmp-rail-lead-ic {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: #0B0B0F; border: 1.5px solid #fff;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 14%, transparent);
    }
    .cmp-grid--compact .cmp-cell--rail.cmp-hcell .cmp-rail-lead-ic .material-symbols-outlined {
      font-size: 15px !important; color: #fff !important;
    }
    /* A subtle cue that a collapsed rail cell holds more on hover. */
    .cmp-grid--compact .cmp-cell--rail { cursor: help; }
    .cmp-grid--compact .cmp-cell--rail:hover { background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }

    /* Collapse the textual body into a floating card, revealed on hover/focus. */
    .cmp-grid--compact .cmp-rail-body {
      position: absolute; left: calc(100% + 4px); top: 6px;
      width: 244px; max-width: 62vw; z-index: 40;
      padding: 11px 13px; border-radius: 12px; gap: 5px;
      background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card, 0 12px 40px rgba(0,0,0,0.4));
      opacity: 0; visibility: hidden; transform: translateX(-6px);
      transition: opacity 0.14s ease, transform 0.14s ease, visibility 0.14s;
      pointer-events: none;
    }
    .cmp-grid--compact .cmp-cell--rail:hover .cmp-rail-body,
    .cmp-grid--compact .cmp-cell--rail:focus-within .cmp-rail-body {
      opacity: 1; visibility: visible; transform: translateX(0); pointer-events: auto;
    }
    /* Rail cells are keyboard-focusable in compact so the flyout is reachable. */
    .cmp-grid--compact .cmp-cell--rail:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    @media (prefers-reduced-motion: reduce) {
      .cmp-grid--compact .cmp-rail-body { transition: none; }
    }

    /* ── Container-driven responsiveness ──────────────────────────────────
       The board reflows off its own width (not the viewport) so it stacks
       cleanly whether it's a narrow docked column or a full-width mobile
       card. Key Takeaways drop from 4 → 2 → 1 columns; the ranked bars and
       toolbar already wrap on their own. */
    .cmp-body { container: cmpbody / inline-size; }
    @container cmpbody (max-width: 600px) {
      .cmp-takeaways { grid-template-columns: repeat(2, 1fr); }
    }
    @container cmpbody (max-width: 360px) {
      .cmp-takeaways { grid-template-columns: 1fr; }
      .cmp-rank-bar { width: 64px; }
    }

    /* ── Per-column responsiveness ────────────────────────────────────────
       The metric rail and each entity column watch their OWN width (not just
       the board's) so the board stays clean whether it's squeezed by a narrow
       docked panel (e.g. inside WISEcodeAI) or by simply carrying more
       columns. Making each cell its own inline-size container is what lets a
       4-up board react the same as a narrow 2-up one. */
    .cmp-cell--rail { container: cmprail / inline-size; }
    .cmp-cell--entity.cmp-hcell { container: cmpcol / inline-size; }

    /* Rail: once the metric column gets tight, the icon+label "score" lead and
       the description body stop sitting side-by-side (which crushes the
       description into a sliver) and STACK into one block — icon + label on
       top, full-width description beneath. */
    @container cmprail (max-width: 250px) {
      .cmp-rail-metric { flex-direction: column; align-items: stretch; gap: 5px; }
      .cmp-rail-metric-lead {
        flex: 0 0 auto; width: auto; align-self: stretch;
        flex-direction: row; align-items: center; justify-content: flex-start;
        gap: 8px; text-align: left;
      }
      .cmp-rail-metric-lead .cmp-rail-metric-name {
        flex-direction: row; flex-wrap: wrap; align-items: center;
        justify-content: flex-start; gap: 4px 6px; text-align: left;
      }
      .cmp-rail-metric > .cmp-rail-body { align-self: stretch; }
    }

    /* Entity columns: product name, category line, score gauge and the on-tile
