      paneBody[which].querySelectorAll('.wa-tbl:not([data-ready])').forEach((tbl) => initTable(tbl));
      if (!el.classList.contains('is-open')) {
        el.classList.remove('is-open'); void el.offsetWidth; /* replay entrance */
        el.classList.add('is-open');
      }
      /* Rebuild the thumbnail rail; make the just-surfaced block the active slide
         once the pane holds 2+ outputs. */
      refreshPaneCarousel(which, { activate: firstAdded });
      /* In carousel mode only one block shows, so reset the scroll to its top;
         otherwise scroll the newest result into view so growth stays visible. */
      if (firstAdded) {
        if (paneBody[which].classList.contains('is-carousel')) {
          paneBody[which].scrollTop = 0;
        } else {
          requestAnimationFrame(() => firstAdded.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      }
    }

    /* ── Pane carousel: horizontal thumbnail rail + one-at-a-time output ──
       Treat every top-level .wa-block in a pane body as a slide. With a single
       block the pane behaves exactly as before; with 2+ the rail turns on and
       only the active block renders. */
    function paneSlideLabel(block, which, i) {
      const pick = (sel, stripIcons) => {
        const el = block.querySelector(sel);
        if (!el) return '';
        if (stripIcons) {
          const c = el.cloneNode(true);
          c.querySelectorAll('.material-icons, .material-symbols-outlined').forEach((n) => n.remove());
          return c.textContent.trim();
        }
        return el.textContent.trim();
      };
      return pick('.wa-report-title') || pick('.wa-dhero-name') || pick('.wa-sec-title', true)
        || block.dataset.slideTitle || ((which === 'visuals' ? 'Chart ' : 'Result ') + (i + 1));
    }

    function paneBlocks(which) {
      const body = paneBody[which];
      if (!body) return [];
      return Array.from(body.children).filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'));
    }

    /* Sync the minimize/expand toggle icon with the rail's current mode. */
    function updateMinBtn(which) {
      const nav = paneNav[which];
      if (!nav) return;
      const btn = nav.querySelector('[data-nav="min"]');
      if (!btn) return;
      const min = !!paneMin[which];
      const ic = btn.querySelector('.material-icons');
      if (ic) ic.textContent = min ? 'open_in_full' : 'close_fullscreen';
      btn.title = min ? 'Expand output cards' : 'Minimize to chips';
      btn.setAttribute('aria-label', btn.title);
    }

    function setPaneSlide(which, idx, { animate = true, scrollNav = false } = {}) {
      const blocks = paneBlocks(which);
      const nav = paneNav[which];
      if (!blocks.length) return;
      idx = Math.max(0, Math.min(idx, blocks.length - 1));
      blocks.forEach((b, i) => b.classList.toggle('is-active', i === idx));
      if (paneBody[which]) paneBody[which].scrollTop = 0;
      /* Keep the editorial masthead in sync with the visible output. */
      if (paneBody[which] && paneBody[which].classList.contains('is-carousel')) {
        const active = blocks[idx];
        if (paneTitle[which]) paneTitle[which].textContent = paneSlideLabel(active, which, idx);
        if (paneMeta[which]) paneMeta[which].textContent = active.dataset.slideMeta || '';
      }
      if (animate) {
        const active = blocks[idx];
        active.style.animation = 'none'; void active.offsetWidth; active.style.animation = '';
      }
      if (nav) {
        const items = nav.querySelectorAll('[data-slide]');
        items.forEach((it) => {
          const on = Number(it.dataset.slide) === idx;
          it.classList.toggle('is-active', on);
          it.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        if (scrollNav && items[idx]) items[idx].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        /* Position counter (e.g. "Chart 2 / 4") + prev/next availability. */
        const noun = which === 'visuals' ? 'Chart' : 'Result';
        const count = nav.querySelector('[data-nav-count]');
        if (count) count.innerHTML = `${noun} <b>${idx + 1}</b> / ${blocks.length}`;
        const prev = nav.querySelector('[data-nav="prev"]');
        const next = nav.querySelector('[data-nav="next"]');
        if (prev) prev.disabled = idx <= 0;
        if (next) next.disabled = idx >= blocks.length - 1;
      }
    }

    function refreshPaneCarousel(which, { activate } = {}) {
      const body = paneBody[which];
      const nav = paneNav[which];
      if (!body || !nav) return;
      const blocks = paneBlocks(which);
      if (blocks.length < 2) {
        body.classList.remove('is-carousel');
        nav.classList.remove('is-on');
        nav.innerHTML = '';
        blocks.forEach((b) => b.classList.remove('is-active'));
        return;
      }
      body.classList.add('is-carousel');
      nav.classList.add('is-on');
      blocks.forEach((b, i) => { b.dataset.slideIndex = i; });
      /* Preserve the current slide unless the caller points at a new block. */
      let activeIdx = blocks.findIndex((b) => b.classList.contains('is-active'));
      if (activate instanceof Element) {
        const idx = blocks.indexOf(activate);
        if (idx >= 0) activeIdx = idx;
      }
      if (activeIdx < 0) activeIdx = blocks.length - 1;
      /* NOTE: the preview clones the block's own HTML, which for result blocks
         contains <button>/<input> controls. A <button> may not nest interactive
         content, so the wrapper is a <div role="button"> (same trick as the
         in-chat .sc-surface-card) and the clone is made `inert` so its controls
         can't be focused or spill out of the wrapper. */
      const thumbs = blocks.map((b, i) =>
        `<div class="wa-pane-thumb-item" data-slide="${i}" role="tab" tabindex="0" aria-selected="false" title="${esc(paneSlideLabel(b, which, i))}">
          <span class="wa-pane-thumb-num">${i + 1}</span>
          <span class="wa-pane-thumb-preview"><span class="wa-pane-thumb-inner" inert>${b.innerHTML}</span></span>
          <span class="wa-pane-thumb-label">${esc(paneSlideLabel(b, which, i))}</span>
        </div>`).join('');
      nav.innerHTML =
        `<div class="wa-pane-nav-ctrls">
          <span class="wa-pane-nav-count" data-nav-count aria-live="polite"></span>
          <span class="wa-pane-nav-btns">
            <button type="button" class="wa-pane-nav-arrow" data-nav="min" aria-label="Minimize to chips"><span class="material-icons">close_fullscreen</span></button>
            <button type="button" class="wa-pane-nav-arrow" data-nav="prev" aria-label="Previous output"><span class="material-icons">chevron_left</span></button>
            <button type="button" class="wa-pane-nav-arrow" data-nav="next" aria-label="Next output"><span class="material-icons">chevron_right</span></button>
          </span>
        </div>
        <div class="wa-pane-nav-track" data-nav-track role="tablist">${thumbs}</div>`;
      nav.classList.toggle('is-min', !!paneMin[which]);
      updateMinBtn(which);
      setPaneSlide(which, activeIdx, { animate: false, scrollNav: true });
    }

    /* Tapping a thumbnail switches the visible output. */
    Object.keys(paneNav).forEach((which) => {
      const nav = paneNav[which];
      if (!nav) return;
      const curSlide = () => Number(nav.querySelector('.wa-pane-thumb-item.is-active')?.dataset.slide || 0);
      nav.addEventListener('click', (e) => {
        const ctrl = e.target.closest('[data-nav]');
        if (ctrl) {
          const act = ctrl.dataset.nav;
          if (act === 'min') {
            paneMin[which] = !paneMin[which];
            nav.classList.toggle('is-min', paneMin[which]);
            updateMinBtn(which);
            /* Re-scroll the active chip/card into view after the layout change. */
            setPaneSlide(which, curSlide(), { animate: false, scrollNav: true });
            return;
          }
          setPaneSlide(which, curSlide() + (act === 'next' ? 1 : -1), { animate: true, scrollNav: true });
          return;
        }
        const it = e.target.closest('[data-slide]');
        if (!it) return;
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
      });
      nav.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); setPaneSlide(which, curSlide() + 1, { animate: true, scrollNav: true }); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); setPaneSlide(which, curSlide() - 1, { animate: true, scrollNav: true }); return; }
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const it = e.target.closest('[data-slide]');
        if (!it) return;
        e.preventDefault();
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
      });
    });

    function closePane(which) {
      const el = paneEl[which];
      if (el) el.classList.remove('is-open', 'pane-wide', 'pane-triple');
      if (paneBody[which]) { paneBody[which].innerHTML = ''; paneBody[which].classList.remove('is-carousel'); }
      if (paneNav[which]) { paneNav[which].innerHTML = ''; paneNav[which].classList.remove('is-on'); }
      const wb = document.querySelector(`[data-pane-width="${which}"]`);
      if (wb) syncPaneWidthBtn(wb, 0);
      /* Drop any drag-pinned widths so the remaining modules reflow to fill the
         freed space — and once the last pane is gone, the chat expands back to
         full-screen (its stylesheet default) instead of staying docked at the
         width it was dragged to. */
      window.WisePaneResize?.release?.([
        document.getElementById('wa-chat'),
        paneEl.results,
        paneEl.visuals,
      ]);
    }

    /* Per-pane three-dot menu + width control (their own, independent of the chat) */
    const PANE_W_ICONS = ['width_normal', 'width_wide', 'width_full'];
    const PANE_W_TITLES = ['Width (single) — tap to widen', 'Width (double) — tap to widen', 'Width (triple) — tap to reset'];
    function syncPaneWidthBtn(btn, tier) {
      btn.classList.toggle('is-on', tier >= 1);
      btn.setAttribute('aria-pressed', tier >= 1 ? 'true' : 'false');
      btn.title = PANE_W_TITLES[tier];
      const ic = btn.querySelector('.material-symbols-outlined');
      if (ic) ic.textContent = PANE_W_ICONS[tier];
    }
    document.querySelectorAll('[data-pane-width]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const which = btn.dataset.paneWidth;
        const el = paneEl[which];
        const cur = el.classList.contains('pane-triple') ? 2 : el.classList.contains('pane-wide') ? 1 : 0;
        const next = (cur + 1) % 3;
        el.classList.toggle('pane-wide', next >= 1);
        el.classList.toggle('pane-triple', next >= 2);
        syncPaneWidthBtn(btn, next);
      });
    });
    document.querySelectorAll('[data-pane-more]').forEach((wrap) => {
      const btn = wrap.querySelector('.panel-more-btn');
      const pop = wrap.querySelector('.topbar-popover');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = pop.classList.contains('hidden');
        document.querySelectorAll('[data-pane-more] .topbar-popover').forEach((p) => p.classList.add('hidden'));
        document.querySelectorAll('[data-pane-more] .panel-more-btn').forEach((b) => b.classList.remove('is-open'));
        pop.classList.toggle('hidden', !open);
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      pop.addEventListener('click', (e) => {
        const item = e.target.closest('[data-pane-act]');
        if (!item) return;
        pop.classList.add('hidden'); btn.classList.remove('is-open');
        const act = item.dataset.paneAct;
        const which = wrap.dataset.paneMore;
        if (act === 'close') closePane(which);
        else if (act === 'export') {
          const blob = new Blob(['WISEai export placeholder\n'], { type: 'text/plain' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wiseai-${which}.txt`; a.click();
        } else if (act === 'share') {
          const url = location.href;
          if (navigator.share) navigator.share({ title: 'WISEai', url }).catch(() => {});
          else navigator.clipboard?.writeText(url).catch(() => {});
        }
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('[data-pane-more] .topbar-popover').forEach((p) => p.classList.add('hidden'));
      document.querySelectorAll('[data-pane-more] .panel-more-btn').forEach((b) => b.classList.remove('is-open'));
    });

    /* ── Results-table controller: live search + click-to-sort + pagination ──
       Search (per result-set), the column headers, and the clickable score cards
       all funnel through applySort()/renderTable() so ranking, the "load more"
       window and the "Showing X of N" footer always stay in sync. */
    function tableQuery(tbl) {
      const set = tbl.closest('.wa-resultset');
      const inp = set && set.querySelector('.wa-search');
      return inp ? inp.value.trim().toLowerCase() : '';
    }

    /* Highlight whichever score card matches the table's active sort. */
    function syncStatCards(tbl) {
      const set = tbl.closest('.wa-resultset');
      if (!set) return;
      set.querySelectorAll('[data-stat-sort-col]').forEach((c) => {
        const on = c.dataset.statSortCol === tbl.dataset.sortCol && c.dataset.statSortDir === tbl.dataset.sortDir;
        c.classList.toggle('is-active', on);
      });
    }

    /* Apply the current search + page window to the rows, renumber the rank over
       the filtered ranking, and refresh the empty-state and pagination footer. */
    function renderTable(tbl) {
      if (!tbl) return;
      const tb = tbl.querySelector('.wa-tbl-body');
      if (!tb) return;
      const rows = Array.from(tb.querySelectorAll('.wa-trow'));
      const q = tableQuery(tbl);
      const filtered = rows.filter((r) => !q || (r.dataset.search || '').includes(q));
      filtered.forEach((r, i) => { const rk = r.querySelector('.wa-rank'); if (rk) rk.textContent = i + 1; });
      const total = filtered.length;
      const size = parseInt(tbl.dataset.pageSize, 10) || 0;
      let shown = size > 0 ? (parseInt(tbl.dataset.shown, 10) || size) : total;
      shown = Math.min(Math.max(size || total, shown), total);
      tbl.dataset.shown = shown;
      const visible = new Set(filtered.slice(0, shown));
      rows.forEach((r) => { r.style.display = visible.has(r) ? '' : 'none'; });

      const set = tbl.closest('.wa-resultset');
      const empty = set && set.querySelector('[data-empty]');
      if (empty) empty.hidden = total !== 0;

      const pager = tbl.querySelector('[data-pager-bar]');
      if (pager) {
        pager.hidden = total === 0;
        const range = pager.querySelector('[data-pager-range]');
        if (range) range.textContent = `Showing ${Math.min(shown, total)} of ${total} foods`;
        const more = pager.querySelector('[data-loadmore]');
        if (more) more.hidden = shown >= total;
      }
    }

    /* Re-order rows for the given column/direction, reset to page 1, sync UI. */
    function applySort(tbl, key, dir) {
      tbl.dataset.sortCol = key;
      tbl.dataset.sortDir = dir;
      tbl.querySelectorAll('.wa-tbl-th').forEach((h) => {
        const on = h.dataset.sort === key;
        h.classList.toggle('is-sorted', on);
        if (h.dataset.sort) {
          if (on) h.setAttribute('data-wa-dir', dir);
          else h.removeAttribute('data-wa-dir');
        }
      });
      const tb = tbl.querySelector('.wa-tbl-body');
      const rows = Array.from(tb.querySelectorAll('.wa-trow'));
      rows.sort((a, b) => {
        let av, bv;
        if (key === 'score') { av = parseFloat(a.dataset.score); bv = parseFloat(b.dataset.score); }
        else { av = a.dataset.name || ''; bv = b.dataset.name || ''; }
        if (av < bv) return dir === 'asc' ? -1 : 1;
        if (av > bv) return dir === 'asc' ? 1 : -1;
        return 0;
      });
      rows.forEach((r) => tb.appendChild(r));
      tbl.dataset.shown = parseInt(tbl.dataset.pageSize, 10) || 0;
      syncStatCards(tbl);
      renderTable(tbl);
    }

    function initTable(tbl) {
      if (!tbl || tbl.dataset.ready) return;
      tbl.dataset.ready = '1';
      syncStatCards(tbl);
      renderTable(tbl);
    }

    function wireResults(body) {
      if (!body) return;
      body.addEventListener('input', (e) => {
        const inp = e.target.closest('.wa-search');
        if (!inp) return;
        const set = inp.closest('.wa-resultset');
        const tbl = set && set.querySelector('.wa-tbl');
        if (tbl) { tbl.dataset.shown = parseInt(tbl.dataset.pageSize, 10) || 0; renderTable(tbl); }
      });
      body.addEventListener('click', (e) => {
        const th = e.target.closest('button.wa-tbl-th[data-sort]');
        if (th) {
          const tbl = th.closest('.wa-tbl');
          if (!tbl) return;
          const key = th.dataset.sort;
          const dir = tbl.dataset.sortCol === key
            ? (tbl.dataset.sortDir === 'asc' ? 'desc' : 'asc')
            : (key === 'score' ? 'desc' : 'asc');
          applySort(tbl, key, dir);
          return;
        }
        const stat = e.target.closest('[data-stat-sort-col]');
        if (stat) {
          const set = stat.closest('.wa-resultset');
          const tbl = set && set.querySelector('.wa-tbl');
          if (!tbl) return;
          const key = stat.dataset.statSortCol;
          let dir = stat.dataset.statSortDir || 'asc';
          if (tbl.dataset.sortCol === key && tbl.dataset.sortDir === dir) dir = dir === 'asc' ? 'desc' : 'asc';
          applySort(tbl, key, dir);
          return;
        }
        const more = e.target.closest('[data-loadmore]');
        if (more) {
          const tbl = more.closest('.wa-tbl');
          if (!tbl) return;
          const size = parseInt(tbl.dataset.pageSize, 10) || 0;
          const shown = parseInt(tbl.dataset.shown, 10) || size;
          tbl.dataset.shown = shown + size;
          renderTable(tbl);
        }
      });
    }
    wireResults(paneBody.results);
    wireResults(paneBody.visuals);

    /* ═════════ Content builders ═════════ */
    /* Representative food photos pulled from the app's asset library. The exact
       943k database items don't ship photos, so each row is assigned the closest
       available product shot, with a Material icon fallback if the file 404s. */
    const IMG = '../assets/';
    const DESSERT_IMGS = [
      'portfolio/coconut_brownies.png', 'portfolio/chocolate_brownies.png', 'portfolio/frosted_toaster_pastries.png',
      'portfolio/dark_cherry_brownies.png', 'portfolio/chocolate_chip_muffins.png', 'portfolio/blueberry_muffins.png',
      'portfolio/apple_cinnamon_muffins.png', 'portfolio/oatmeal_raisin_cookies.png', 'portfolio/vegan_chocolate_brownies.png',
      'portfolio/carrot_raisin_muffins.png',
    ];
    const COOKIE_IMGS = [
      'portfolio/oatmeal_raisin_cookies.png', 'top5-walnut-brownie-bar.png', 'top5-almond-coconut-crisp.png',
      'top5-matcha-cashew-bites.png', 'top5-pistachio-rose-bar.png', 'top5-ginger-turmeric-bar.png',
      'date-better-cashew-lime-crisp.png', 'portfolio/chocolate_brownies.png', 'portfolio/coconut_brownies.png',
      'portfolio/dark_cherry_brownies.png', 'portfolio/granola.jpg',
    ];
    function thumb(imgRel, fallbackIcon) {
      return `<span class="wa-thumb"><img class="wa-thumb-img" src="${IMG}${imgRel}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="wa-thumb-fallback"><span class="material-icons">${fallbackIcon}</span></span></span>`;
    }

    /* Scorecards. A card with a `sort` descriptor renders as a button that sorts
       the table below it (the score cards double as filters/sorters). */
    function scoreCards(cards) {
      return `<div class="wa-stats">${cards.map((c) => {
        const tone = c.tone ? ' wa-stat--' + c.tone : '';
        const inner = `<span class="wa-stat-num">${c.num}</span><span class="wa-stat-label">${esc(c.label)}</span>`;
        if (c.sort) {
          return `<button type="button" class="wa-stat wa-stat--btn${tone}" data-stat-sort-col="${c.sort.col}" data-stat-sort-dir="${c.sort.dir}" title="Sort the table by ${esc(c.label)}"><span class="material-icons wa-stat-sort">${c.sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward'}</span>${inner}</button>`;
        }
        return `<div class="wa-stat${tone}">${inner}</div>`;
      }).join('')}</div>`;
    }

    function searchToolbar(placeholder) {
      return `<div class="wa-toolbar"><div class="wa-search-inline"><span class="material-icons">search</span><input type="text" class="wa-search" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"></div></div>`;
    }

    /* Proper sortable table: real column headers (click Food / Score to sort),
       a real food photo per row, the brand tucked under the name, and — when the
       data has it — ingredients in their own column. Score is a plain numeric
       column value, not a pill. */
    function sortTable(rows, { images, fallbackIcon = 'restaurant', tone = 'bad', showIngredients = false, sortCol = 'score', sortDir = 'desc', pageSize = 0 } = {}) {
      const cols = showIngredients
        ? '28px minmax(0,1.5fr) minmax(0,1.35fr) 74px'
        : '28px minmax(0,1fr) 74px';
      const scoreCls = tone === 'good' ? 'wa-score-num--good' : 'wa-score-num--bad';
      const CHEVRON = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 9.5V2.5M3 6.5L6 9.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const dirAttr = (key) => (key === sortCol ? ` data-wa-dir="${sortDir}"` : '');
      const cls = (key, end) => `wa-tbl-th${end ? ' wa-tbl-th--end' : ''}${key === sortCol ? ' is-sorted' : ''}`;
      const head = `<div class="wa-tbl-head" style="grid-template-columns:${cols}">
          <span class="wa-tbl-th">#</span>
          <button type="button" class="${cls('name')}" data-sort="name"${dirAttr('name')}>Food<span class="wa-sort-ic" aria-hidden="true">${CHEVRON}</span></button>
          ${showIngredients ? '<span class="wa-tbl-th">Ingredients</span>' : ''}
          <button type="button" class="${cls('score', true)}" data-sort="score"${dirAttr('score')}>Score<span class="wa-sort-ic" aria-hidden="true">${CHEVRON}</span></button>
        </div>`;
      const body = rows.map((r, i) => {
        const [food, brand, score] = r;
        const img = images[i % images.length];
        const key = `${food} ${brand}`.toLowerCase();
        const ing = showIngredients
          ? `<div class="wa-td wa-ing-cell${r[3] ? '' : ' wa-nodata'}">${esc(r[3] || '\u2014')}</div>`
          : '';
        return `<div class="wa-trow" style="grid-template-columns:${cols}" data-search="${esc(key)}" data-name="${esc(food.toLowerCase())}" data-score="${score}">
            <span class="wa-rank">${i + 1}</span>
            <div class="wa-prod">
              ${thumb(img, fallbackIcon)}
              <span class="wa-prod-text">
                <span class="wa-prod-name">${esc(food)}</span>
                <span class="wa-prod-brand">${esc(brand)}</span>
              </span>
            </div>
            ${ing}
            <div class="wa-td--end"><span class="wa-score-num ${scoreCls}">${fmtScore(score)}</span></div>
          </div>`;
      }).join('');
      const paginate = pageSize > 0 && rows.length > pageSize;
      const pager = paginate ? `<div class="wa-pager" data-pager-bar>
          <span class="wa-pager-range" data-pager-range></span>
          <button type="button" class="wa-loadmore" data-loadmore>Load more <span class="material-icons">expand_more</span></button>
        </div>` : '';
      return `<div class="wa-tbl" data-sort-col="${sortCol}" data-sort-dir="${sortDir}" data-shown="${paginate ? pageSize : 0}" data-page-size="${paginate ? pageSize : 0}">
          ${head}
          <div class="wa-tbl-body">${body}</div>
          <div class="wa-empty-row" data-empty hidden>No foods match your search.</div>
          ${pager}
        </div>`;
    }

    function worstFoodsView() {
      return `
        <div class="wa-block wa-resultset">
          ${scoreCards([
            { num: '943,428', label: 'Foods searched' },

    /* ── Charts ── */
    function radarChart() {
      // Square viewBox with generous margin so the outer labels (left/right)
      // never clip. R is kept well inside the box; labels sit just outside the
      // outer ring. Modeled on the product-comparison spider chart.
      const size = 300, cx = size / 2, cy = size / 2, R = size / 2 - 62;
      // Five metrics laid out evenly. Only WISEscore returned values for this
      // set; the rest came back empty, so their spokes are drawn dashed.
      const axes = [
        { label: 'WISEscore', data: true },
        { label: 'Gut Health', data: false },
        { label: 'Immune Support', data: false },
        { label: 'Additive Load', data: false },
        { label: 'Excellent Source', data: false },
      ];
      const M = axes.length;
      const ang = (i) => (Math.PI * 2 * i) / M - Math.PI / 2;
      const pt = (i, t) => [cx + R * t * Math.cos(ang(i)), cy + R * t * Math.sin(ang(i))];
      const ptsAt = (t) => axes.map((_, i) => pt(i, t).map((v) => v.toFixed(1)).join(',')).join(' ');

      let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" class="wa-radar-svg" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Spider chart of the 10 worst foods across five health metrics">`;
      // rings
      [0.25, 0.5, 0.75, 1].forEach((t) => {
        svg += `<polygon points="${ptsAt(t)}" fill="none" stroke="var(--border-strong)" stroke-width="1" opacity="0.7"/>`;
      });
      // spokes
      axes.forEach((a, i) => {
        const [x, y] = pt(i, 1);
        svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1" ${a.data ? '' : 'stroke-dasharray="4 4"'} opacity="0.8"/>`;
      });
      // spread of the 10 normalized WISEscores along the data axis
      const scores = WORST_FOODS.slice(0, 10).map((r) => r[2]);
      const mn = Math.min(...scores), mx = Math.max(...scores);
      const norm = (s) => 0.16 + 0.72 * ((s - mn) / (mx - mn || 1));
      const avgT = norm(scores.reduce((a, b) => a + b, 0) / scores.length);
      // collapsed polygon: real data on the WISEscore axis, near-zero elsewhere
      const polyPts = axes.map((a, i) => pt(i, a.data ? avgT : 0.05).map((v) => v.toFixed(1)).join(',')).join(' ');
      svg += `<polygon points="${polyPts}" fill="var(--primary)" fill-opacity="0.18" stroke="var(--primary)" stroke-width="2"/>`;
      // dots for each food on the data axis
      scores.forEach((s) => {
        const [x, y] = pt(0, norm(s));
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--primary)"/>`;
      });
      // axis labels
      axes.forEach((a, i) => {
        const [x, y] = pt(i, 1.2);
        const anchor = Math.abs(x - cx) < 6 ? 'middle' : x > cx ? 'start' : 'end';
        svg += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="var(--text)">${a.label}</text>`;
      });
      svg += `</svg>`;

      const scoreBars = WORST_FOODS.slice(0, 10).map((r) => {
        const w = (norm(r[2]) * 100).toFixed(0);
        return `<div class="wa-scorebar">
            <div class="wa-scorebar-name">${esc(r[0])}</div>
            <div class="wa-scorebar-line">
              <div class="wa-bar-track"><div class="wa-bar-fill" style="width:${w}%"></div></div>
              <div class="wa-bar-val">${fmtScore(r[2])}</div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="wa-block">
          <div class="wa-chart-card">
            <div class="wa-radar-wrap">
              <div style="align-self:center;width:100%;max-width:300px">${svg}</div>
              <div class="wa-radar-scores">
                <div style="margin-bottom:8px"><span class="wa-nd-tag">No data</span> <span style="font-size:11px;color:var(--text-muted)">Gut Health, Immune Support, Additive Load &amp; Excellent Source came back empty across the set.</span></div>
                <div class="wa-scorebars">${scoreBars}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function scoreCurveChart() {
      // "Where the cookie shell gets its score" — a descending curve across the ranking.
      const W = 560, H = 200, padL = 34, padR = 14, padT = 14, padB = 26;
      const pts = [100, 100, 100, 100, 100, 98.5, 96, 91, 84, 73, 61, 49, 38, 29, 22];
      const n = pts.length, mx = 100;
      const x = (i) => padL + (i / (n - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - v / mx) * (H - padT - padB);
      const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const area = `${padL},${(H - padB)} ${line} ${(W - padR)},${(H - padB)}`;
      let grid = '';
      [0, 25, 50, 75, 100].forEach((g) => {
        const yy = y(g);
        grid += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
        grid += `<text x="${padL - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-subtle)">${g}</text>`;
      });

              <text x="${padL}" y="${H - 6}" font-size="9" fill="var(--text-subtle)">Rank 1</text>

    /* ═════════ Scripted transcript (chips → user turn → WISEai reply → panes) ═════════
       The chat transcript stays verbatim to the source conversation; only the

    const INTENTS = [

    const DEFAULT_REPLY = 'I\u2019m answering from your verified WISE Food data. Try one of the suggested prompts to walk through this conversation \u2014 as results come up, I\u2019ll open them in the Results &amp; Details and Visuals panes on the right.';

    function reply(text, intent) {
      if (intent && INTENT_REPLIES[intent] != null) return INTENT_REPLIES[intent];
      const t = String(text || '').toLowerCase();
      if (/ultra|upf|processed/.test(t)) return INTENT_REPLIES.upf;
      if (/worst|bottom|lowest/.test(t)) return INTENT_REPLIES.worst;

    /* ── Inline surface previews ──────────────────────────────────────────

    let surfaceSeq = 0;

    /* ── Conversation manifest (floating Outputs / Sources box) ───────────────
       A running jump-list pinned to the chat's top-right (below the width
       toggle). Every surfaced OUTPUT registers here, and the verified SOURCES
       this transcript draws on are seeded on first surface. Open by default when
       the chat is wide (≈triple width); collapses to a slim icon rail otherwise,
       peeking open on hover. When wide it can be manually collapsed or closed. */
    const MANIFEST_OPEN_W = 800;          /* chat width (px) at/above which it opens by default */
    const MANIFEST_SOURCES = [
      { icon: 'verified', title: 'WISE Verified Food Data' },
      { logo: 'https://www.google.com/s2/favicons?domain=kroger.com&sz=128', icon: 'storefront', title: 'Kroger' },
      { logo: 'https://www.google.com/s2/favicons?domain=walmart.com&sz=128', icon: 'storefront', title: 'Walmart' },
    ];
    const manifestOutputs = [];           /* { blockId, which, icon, title } */
    let manifestBuilt = false, manifestUserCollapsed = false, manifestUserHidden = false, manifestSourcesSeeded = false;
    /* Turned off entirely from the chat's "Hide outputs & sources" menu switch
       (off by default). Unlike the panel's own "close" — which hides the box but
       leaves a floating re-open button — this removes the whole component. */
    let manifestMenuOff = false;
    let manifestEl, manifestOutListEl, manifestSrcListEl, manifestRailEl, manifestOutSecEl, manifestSrcSecEl, manifestBadgeEl;

    function buildManifest() {
      if (manifestBuilt || !host) return;
      manifestBuilt = true;
      manifestEl = document.createElement('div');
      manifestEl.className = 'wa-manifest is-empty';
      manifestEl.innerHTML = `

            <div class="wa-manifest-list" data-mf-srclist></div>
          </div>
        </div>
        <div class="wa-manifest-rail" data-mf-rail></div>
        <button type="button" class="wa-manifest-reopen" data-mf="reopen" title="Show outputs & sources" aria-label="Show outputs & sources"><span class="material-icons">dashboard_customize</span><span class="wa-manifest-reopen-badge" data-mf-badge>0</span></button>`;
      host.appendChild(manifestEl);
      manifestOutListEl = manifestEl.querySelector('[data-mf-outlist]');
      manifestSrcListEl = manifestEl.querySelector('[data-mf-srclist]');
      manifestRailEl = manifestEl.querySelector('[data-mf-rail]');
      manifestOutSecEl = manifestEl.querySelector('[data-mf-out]');
      manifestSrcSecEl = manifestEl.querySelector('[data-mf-src]');
      manifestBadgeEl = manifestEl.querySelector('[data-mf-badge]');

      manifestEl.addEventListener('click', (e) => {
        const ctrl = e.target.closest('[data-mf]');
        if (ctrl) {
          const act = ctrl.dataset.mf;
          if (act === 'collapse') { manifestUserCollapsed = !manifestUserCollapsed; }
          else if (act === 'close') { manifestUserHidden = true; }
          else if (act === 'reopen') { manifestUserHidden = false; manifestUserCollapsed = false; }
          syncManifestState();
          return;
        }
        const item = e.target.closest('[data-mf-block]');
        if (item) reopenSurface(item.dataset.mfBlock);
      });

      /* Track the chat module's width so the box opens/collapses with it. */
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => syncManifestState()).observe(host);
      } else {
        window.addEventListener('resize', syncManifestState);
      }
    }

    function iconMarkup(item, cls) {
      if (item.logo) {
        return `<span class="${cls}"><img src="${item.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span style="display:none;align-items:center;justify-content:center"><span class="material-icons">${esc(item.icon || 'public')}</span></span></span>`;
      }
      return `<span class="${cls}"><span class="material-icons">${esc(item.icon || 'insights')}</span></span>`;
    }

    function renderManifest() {
      if (!manifestBuilt) return;
      const hasOut = manifestOutputs.length > 0;
      const hasSrc = manifestSourcesSeeded && MANIFEST_SOURCES.length > 0;

      manifestOutSecEl.hidden = !hasOut;
      manifestSrcSecEl.hidden = !hasSrc;
      manifestEl.querySelector('[data-mf-div]').hidden = !(hasOut && hasSrc);
      manifestEl.classList.toggle('is-empty', !hasOut && !hasSrc);
      if (manifestBadgeEl) manifestBadgeEl.textContent = String(manifestOutputs.length + (hasSrc ? MANIFEST_SOURCES.length : 0));

      manifestOutListEl.innerHTML = manifestOutputs.map((o) =>
        `<button type="button" class="wa-manifest-item" data-mf-block="${o.blockId}" title="Open “${esc(o.title)}”">
          ${iconMarkup(o, 'wa-manifest-ic')}
          <span class="wa-manifest-name">${esc(o.title)}</span>
        </button>`).join('');

      manifestSrcListEl.innerHTML = (hasSrc ? MANIFEST_SOURCES : []).map((s) =>
        `<div class="wa-manifest-item wa-manifest-item--static">
          ${iconMarkup(s, 'wa-manifest-ic')}
          <span class="wa-manifest-name">${esc(s.title)}</span>
        </div>`).join('');

      /* Collapsed icon rail: output icons (clickable) · divider · source icons. */
      manifestRailEl.innerHTML =
        manifestOutputs.map((o) =>
          `<button type="button" class="wa-manifest-rail-ic" data-mf-block="${o.blockId}" title="${esc(o.title)}" aria-label="Open “${esc(o.title)}”"><span class="material-icons">${esc(o.icon || 'insights')}</span></button>`
        ).join('') +
        (hasOut && hasSrc ? '<span class="wa-manifest-rail-div"></span>' : '') +
        (hasSrc ? MANIFEST_SOURCES.map((s) =>
          `<span class="wa-manifest-rail-ic wa-manifest-rail-ic--static" title="${esc(s.title)}">${s.logo ? `<img src="${s.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none" class="material-icons">${esc(s.icon || 'public')}</span>` : `<span class="material-icons">${esc(s.icon || 'public')}</span>`}</span>`
        ).join('') : '');
    }

    /* Chat three-dot "Hide outputs & sources" switch — fully show/hide the
       whole manifest (panel, rail AND re-open button). Applied lazily so it
       works whether or not the box has been built yet. */
    function setManifestOff(off) {
      manifestMenuOff = !!off;
      if (manifestBuilt) syncManifestState();
    }

    function syncManifestState() {
      if (!manifestBuilt || !host) return;
      const w = host.getBoundingClientRect().width;
      const wide = w >= MANIFEST_OPEN_W;
      manifestEl.classList.toggle('is-off', manifestMenuOff);
      manifestEl.classList.toggle('is-wide', wide);
      manifestEl.classList.toggle('is-hidden', manifestUserHidden);
      /* Narrow → always the icon rail (hover to peek). Wide → open unless the
         user manually collapsed it. */
      const collapsed = manifestUserHidden ? false : (wide ? manifestUserCollapsed : true);
      manifestEl.classList.toggle('is-collapsed', collapsed);
      /* The collapse control doubles as a pin-open toggle when collapsed. */
      const cBtn = manifestEl.querySelector('[data-mf="collapse"]');
      if (cBtn) {
        cBtn.querySelector('.material-icons').textContent = collapsed ? 'unfold_more' : 'unfold_less';
        cBtn.title = collapsed ? 'Pin open' : 'Collapse to icons';
      }
    }

    function addManifestOutput(o) {
      buildManifest();
      if (!manifestSourcesSeeded) manifestSourcesSeeded = true;
      manifestOutputs.push(o);
      renderManifest();
      syncManifestState();
    }

    /* Open (or refresh) a pane block AND mirror it as an inline preview card. */
    function surfaceBlock(which, { icon, title, meta, html }) {
      const blockId = 'blk' + (++surfaceSeq);
      const tagged = tagBlock(html, blockId, title, meta);
      openPane(which, { title, meta, html: tagged });
      SURFACED[blockId] = { which, title, meta, html: tagged };
      addManifestOutput({ blockId, which, icon, title });
      if (chat && typeof chat.addWISEai === 'function') {
        chat.addWISEai(surfaceCardHtml(blockId, which, icon, title, html), { source: '', feedback: false });
      }
    }

    /* Re-open a surfaced block from its inline preview. If the block is still in
       its pane, just bring the pane forward + scroll to it; otherwise re-add it. */
    function reopenSurface(blockId) {
      const e = SURFACED[blockId];
      if (!e) return;
      const pane = paneEl[e.which];
      const present = paneBody[e.which] && paneBody[e.which].querySelector(`[data-block-id="${blockId}"]`);
      if (present) {
        if (pane && !pane.classList.contains('is-open')) pane.classList.add('is-open');
        if (paneBody[e.which].classList.contains('is-carousel')) {
          const idx = Number(present.dataset.slideIndex);
          setPaneSlide(e.which, Number.isNaN(idx) ? 0 : idx, { animate: true, scrollNav: true });
        } else {
          requestAnimationFrame(() => present.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      } else {
        openPane(e.which, { title: e.title, meta: e.meta, html: e.html });
      }
    }

    /* When a turn surfaces data, open/refresh the right panes shortly after the
       reply lands (so the transcript reads first, then the pane resolves). */
    function surface(intent) {
      setTimeout(() => {
        if (intent === 'worst') {
          surfaceBlock('results', {
            icon: 'trending_down',
            title: 'Worst foods in the database',
            meta: '25 of 943,428 matches — all foods, sorted by WISEscore ascending',
            html: worstFoodsView(),
          });
        } else if (intent === 'spider') {
          surfaceBlock('results', {
            icon: 'format_list_numbered',
            title: '10 worst foods · gut & immune request',
            meta: '10 of 943,428 matches — sorted by WISEscore ascending · Gut Health & Excellent Source requested',
            html: tenWorstView(),
          });
          surfaceBlock('visuals', {
            icon: 'radar',
            title: 'Spider chart · 10 worst foods',
            meta: 'Requested sort: gut health & immune-system support. Only WISEscore returned data.',
            html: radarChart(),
          });
        } else if (intent === 'cupcake') {
          surfaceBlock('results', {
            icon: 'cake',
            title: 'Worst-ranked cupcake · detail',
            meta: 'What the search result confirms — full detail lookup failed',
            html: cupcakeDetailView(),
          });
        } else if (intent === 'cookie') {
          surfaceBlock('results', {
            icon: 'cookie',
            title: 'Best chocolate chip cookies',
            meta: "25 of 3,010 matches — category 'snacks,cookies' & name 'chocolate chip', sorted by WISEscore descending",
            html: cookiesView(),
          });
        } else if (intent === 'report') {
          surfaceBlock('results', {
            icon: 'summarize',
            title: 'Finding the best chocolate chip cookie',
            meta: 'WISEai report · ranked views, candidate shortlist & trend-style slopes',
            html: reportView(),
          });
          surfaceBlock('visuals', {
            icon: 'insights',
            title: 'Report visuals · cookie ranking',
            meta: 'Distribution, score curve & trend-style slopes built from the current data',
            html: reportVisualsView(),
          });
        }
      }, 660);
    }

    const host = document.getElementById('wa-chat');
    let chat = null;
    if (host) {
      chat = mountWISEaiChat(host, {
        title: 'WISEai\u2122',
        heading: 'WISEai\u2122, the intelligence for Food Truth\u2122.',
        sub: 'Search 943,428 foods, compare WISEscores, and turn any answer into a report — with results and visuals in their own panes.',
        subCounter: true,
        placeholder: 'Ask WISEai about any food\u2026',
        chipsFlow: 'wrap',
        inlineChips: true,
        persistChips: false,
        cardsHiddenDefault: false,
        sourceLabel: '',
        statusLabel: 'WISEai is searching',
        /* Small animated "thinking" dots docked under the input that pulse while
           WISEai is working, with a hover read-out of live token/cache/cost
           telemetry for the current turn and the whole conversation. */
        activity: true,
        userInitials: 'AK',
        historyKey: 'wise-chat-history:wiseai',
        /* History is a first-class, broken-out module on WISEai (docked to the
           left of the chat as a real flex sibling in #modules-row) rather than
           an in-chat overlay popover. It carries pane-style header chrome (a
           three-dot menu + width changer) and stays open as its own module. */
        historyBreakout: true,
        /* Open History docked from the very first load (no overlay step). */
        historyBreakoutDefault: true,
        /* Dress the broken-out History header like the result panes: serif
           masthead + three-dot menu + width changer (instead of the overlay's
           break-out / close buttons). */
        historyDockedControls: true,
        /* Add an MCP-server filter toggle to the right of the History search
           that narrows the list to conversations that used the MCP server. */
        historyMcpFilter: true,
        /* Preload a few past conversations so the three-dot → History pane opens
           on an established workspace you can jump back into (seeded once). Each
           reuses the same verbatim replies the live transcript uses. */
        historySeed: [
          {
            title: 'What\u2019s the worst food in our database?',
            msAgo: 2 * 3600000,
            mcp: true,
            turns: [
              { role: 'you', text: 'What\u2019s the worst food in our database?' },
              { role: 'wiseai', html: INTENT_REPLIES.worst },
              { role: 'you', text: 'Tell me more about the worst-ranked cupcake' },
              { role: 'wiseai', html: INTENT_REPLIES.cupcake },
            ],
          },
          {
            title: 'Best chocolate chip cookie with the least chocolate',
            daysAgo: 1,
            mcp: false,
            turns: [
              { role: 'you', text: 'Best chocolate chip cookie with the least chocolate' },
              { role: 'wiseai', html: INTENT_REPLIES.cookie },
              { role: 'you', text: 'Show me a pretty report — all the charts & trends' },
              { role: 'wiseai', html: INTENT_REPLIES.report },
            ],
          },
          {
            title: 'Is this ingredient list ultra-processed?',
            daysAgo: 4,
            mcp: true,
            turns: [
              { role: 'you', text: 'Is this ingredient list ultra-processed?' },
              { role: 'wiseai', html: INTENT_REPLIES.upf },
              { role: 'you', text: 'Spider-chart the 10 worst foods by gut & immune health' },
              { role: 'wiseai', html: INTENT_REPLIES.spider },
            ],
          },
        ],
        intents: INTENTS,
        intentReplies: INTENT_REPLIES,
        reply,
        /* Retailer & food-data sources WISEai can pull verified product data
           from. The docked below-input rail is dropped (connectorsRail:false);
           sources now live in the three-dot "Connect a data source" side panel. */
        connectorsLabel: 'Connect a data source',
        connectorsRail: false,
        /* Every source is shown in the panel, so the trailing "more connectors"
           three-dot control is redundant — drop it. */
        connectorsMore: false,
        /* Enable the Turns Module — the three-dot "View turns" toggle opens a
           panel listing every turn, each with a "Fork from here" button that
           branches the conversation up to that point into a new chat of your
           own (the original is never touched; forks show a fork badge in
           History and a "Forked from …" banner). */
        turns: true,
        /* Let the Turns overlay "break out" into its own module docked to the
           right of the chat — a real flex sibling in #modules-row, dressed like
           the Results & Details / Visuals panes (same surface, border, radius,
           shadow & serif masthead via the #modules-row .wch-docked rules). */
        turnsBreakout: true,
        turnsBreakoutWidth: 380,
        /* Turns is OFF by default — the module is pre-built and docked to the
           right of the chat but starts hidden. Flipping the "Turns" switch in
           the chat's three-dot menu reveals it (it animates out from behind the
           chat); flipping it off tucks it back behind the chat. */
        turnsBreakoutDefault: false,
        /* Dress the broken-out Turns header like the result panes (serif
           masthead + three-dot menu + width changer). */
        turnsDockedControls: true,
        /* Search box pinned above the turn list to filter turns by question,
           answer text or artifact. */
        turnsSearch: true,
        /* Per-turn Share + Note (annotate) controls in addition to Fork/Jump. */
        turnsShare: true,
        turnsNotes: true,
        /* "Sticky modules" toggle in the chat's three-dot menu — tucks the docked
           History (left) and Turns (right) modules in behind the chat card
           (flush, square inner corners, calmer surface, slightly shorter). The
           preference persists across reloads via localStorage. */
        stickyModules: true,
        stickyModulesDefault: (() => { try { return localStorage.getItem('wiseai-sticky-modules') === '1'; } catch (_) { return false; } })(),
        onStickyModules: (on) => {
          const row = document.getElementById('modules-row');
          if (row) row.classList.toggle('modules-sticky', on);
          try { localStorage.setItem('wiseai-sticky-modules', on ? '1' : '0'); } catch (_) {}
        },
        /* "Hide outputs & sources" switch in the chat's three-dot menu — fully
           hides the floating Outputs / Sources manifest pinned to the chat's
           top-right. OFF by default (the manifest shows as before); flipping it
           on removes the whole component. */
        outputsToggle: true,
        outputsToggleDefault: false,
        onToggleOutputs: (hidden) => setManifestOff(hidden),
        connectors: [
          { id: 'kroger',   name: 'Kroger',              color: '#0f4b8f', mono: 'K', logo: 'https://www.google.com/s2/favicons?domain=kroger.com&sz=128', connected: true },
          { id: 'instacart', name: 'Instacart',          color: '#0AAD0A', icon: 'shopping_cart', logo: 'https://www.google.com/s2/favicons?domain=instacart.com&sz=128' },
          { id: 'walmart',  name: 'Walmart',             color: '#0071DC', mono: 'W', logo: 'https://www.google.com/s2/favicons?domain=walmart.com&sz=128', connected: true },
          { id: 'usda',     name: 'USDA FoodData Central', color: '#1F5C3D', icon: 'eco', logo: 'https://www.google.com/s2/favicons?domain=fdc.nal.usda.gov&sz=128' },
          { id: 'off',      name: 'Open Food Facts',      color: '#E64A19', icon: 'public', logo: 'https://www.google.com/s2/favicons?domain=openfoodfacts.org&sz=128' },
          { id: 'nielseniq', name: 'NielsenIQ',          color: '#1A2CC0', icon: 'insights', logo: 'https://www.google.com/s2/favicons?domain=nielseniq.com&sz=128' },
          { id: 'wholefoods', name: 'Whole Foods Market', color: '#00674B', mono: 'W', logo: 'https://www.google.com/s2/favicons?domain=wholefoodsmarket.com&sz=128' },
          { id: 'amazonfresh', name: 'Amazon Fresh',     color: '#FF9900', icon: 'local_grocery_store', logo: 'https://www.google.com/s2/favicons?domain=amazon.com&sz=128' },
          { id: 'spins',    name: 'SPINS',               color: '#6D28D9', icon: 'query_stats', logo: 'https://www.google.com/s2/favicons?domain=spins.com&sz=128' },
          { id: 'shopify',  name: 'Shopify',             color: '#5A863E', icon: 'storefront', logo: 'https://www.google.com/s2/favicons?domain=shopify.com&sz=128' },
        ],
        /* Large "at a glance" welcome cards — the big intent chips. */
        scorecards: {
          label: 'Start a conversation',
          cards: [
            { variant: 'wiseai', icon: 'auto_awesome', title: 'Is this ultra-processed?', desc: 'Paste an ingredient list for a WISEcode UPF read.', action: 'Ask', intent: 'upf', ask: 'Is this ingredient list ultra-processed?' },
            { variant: 'metric', icon: 'trending_down', pill: { tone: 'alert', icon: 'south', text: 'Lowest' }, metric: '0.06', title: 'Worst food in the database', desc: 'The bottom of the WISEscore ranking across 943,428 foods.', action: 'Show ranking', intent: 'worst', ask: 'What\u2019s the worst food in our database?' },
            { variant: 'wiseai', icon: 'radar', title: 'Spider-chart the 10 worst foods', desc: 'Compare the bottom of the ranking by gut & immune health.', action: 'Chart it', intent: 'spider', ask: 'Spider-chart the 10 worst foods by gut & immune health' },
            { variant: 'wiseai', icon: 'cake', title: 'Worst-ranked cupcake', desc: 'Dig into the single lowest-scoring cupcake and why it landed there.', action: 'Explain', intent: 'cupcake', ask: 'Tell me more about the worst-ranked cupcake' },
            { variant: 'metric', icon: 'cookie', pill: { tone: 'up', icon: 'north', text: 'Highest' }, metric: '3,010', title: 'Best chocolate chip cookie', desc: 'Highest-WISEscore cookies with the least chocolate.', action: 'Find it', intent: 'cookie', ask: 'Best chocolate chip cookie with the least chocolate' },
            { variant: 'intro', icon: 'summarize', title: 'Build me a report', desc: 'Turn the cookie ranking into a full visual report with charts & trends.', action: 'Generate', intent: 'report', ask: 'Show me a pretty report — all the charts & trends' },
            { variant: 'wiseai', icon: 'hub', title: 'Connect a data source', desc: 'Link Kroger, Instacart, USDA FoodData Central & more so WISEai can pull verified product data.', action: 'Connect', intent: 'connect_source' },
            { variant: 'wiseai', icon: 'explore', title: 'Take a tour', desc: 'A quick guided walkthrough of WISEai — the panes, prompts & reports.', locked: true },
          ],
        },
        /* Open the right panes when a turn surfaces data; return false so the
           scripted reply still posts into the transcript. */
        onIntent(intent) {
          surface(intent);
          return false;
        },
      });

      /* Tapping an inline surface preview card re-opens its module on the right
         (delegated on the chat root so it covers every card in the transcript,
         including ones parked further up the conversation). */
      host.addEventListener('click', (e) => {
        const card = e.target.closest('.sc-surface-card[data-surface]');
        if (!card) return;
        reopenSurface(card.getAttribute('data-surface'));
      });
      host.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('.sc-surface-card[data-surface]');
        if (!card) return;
        e.preventDefault();
        reopenSurface(card.getAttribute('data-surface'));
      });

      /* History is toggled from the chat's own three-dot menu — inject the entry
         (the shared module wires data-sc="history" to the in-module sidebar). */
      const morePop = host.querySelector('.topbar-popover');
      if (morePop && !morePop.querySelector('[data-sc="history"]')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'topbar-menu-item';
        btn.setAttribute('data-sc', 'history');
        btn.innerHTML = '<span class="material-icons topbar-menu-icon">history</span><span>History &amp; Projects</span>';
        const div = document.createElement('div');
        div.className = 'topbar-menu-divider';
        morePop.insertBefore(div, morePop.firstChild);
        morePop.insertBefore(btn, div);
      }
    }
  </script>
</body>
</html>
