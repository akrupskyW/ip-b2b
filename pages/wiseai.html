    .wa-nova-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
    .wa-nova-n {
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box; width: 28px; height: 28px; flex: 0 0 auto;
      border-radius: 50%; color: #fff; background: var(--nova-tone);
      font-size: var(--fs-label); font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .wa-nova-name { font-weight: 700; font-size: 12.5px; color: var(--text); }
    .wa-nova-desc { font-size: 11.5px; line-height: 1.5; color: var(--text-muted); margin-top: 2px; }

    /* ── Inline brand token (little brand logo inside an answer) ─────────── */
    .wa-brandtoken { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; overflow: hidden; vertical-align: -5px; margin-right: 3px; position: relative; background: var(--surface-2); border: 1px solid var(--border); }
    html.dark .wa-brandtoken { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .wa-brandtoken-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wa-brandtoken-fb { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--sec-green-text); }
    /* Round brand mark for the retailer hero thumb */
    .wa-brand-thumb { background: var(--surface-2); border: 1px solid var(--border); border-radius: 50%; }
    html.dark .wa-brand-thumb { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .wa-brand-thumb .wa-thumb-img { border-radius: 50%; }
    .wa-brand-thumb .wa-thumb-fallback { color: var(--sec-green-text); }

    /* ── PL-split pills row (in the sweeteners answer) ───────────────────── */
    .wa-plsplit { display: flex; gap: 16px; margin: 12px 0; flex-wrap: wrap; }
    .wa-plsplit-item { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--text); }
    .wa-plsplit-item b { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }

    /* ── Shared PL / GRAS pill (answer + ingredient-query table) ─────────── */
    .wa-ib-pill { display: inline-flex; align-items: center; justify-content: center; padding: 2px 9px; min-width: 22px; box-sizing: border-box; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .02em; line-height: 1.6; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .wa-ib-pl-2 { background: rgba(185,130,43,0.16); color: #8a6400; }
    html.dark .wa-ib-pl-2 { background: rgba(255,217,138,0.16); color: #FFD98A; }
    .wa-ib-pl-3 { background: rgba(197,106,42,0.16); color: #b4551f; }
    html.dark .wa-ib-pl-3 { background: rgba(247,161,105,0.18); color: #F7A169; }
    .wa-ib-pl-4 { background: rgba(200,42,42,0.12); color: var(--sec-red); }
    html.dark .wa-ib-pl-4 { background: rgba(255,158,150,0.16); color: #FF9E96; }
    .wa-ib-gras--gras { background: var(--primary-10, rgba(37,80,124,0.12)); color: var(--primary); }
    html.dark .wa-ib-gras--gras { background: rgba(96,165,250,0.16); color: #93C5FD; }
    .wa-ib-gras--unsafe { background: rgba(200,42,42,0.12); color: var(--sec-red); }
    html.dark .wa-ib-gras--unsafe { background: rgba(255,158,150,0.16); color: #FF9E96; }

    /* ── Ingredient-query table (WISEcode ingredient-browser artifact) ───── */
    .wa-ib-wrap { position: relative; }
    .wa-ib-query { margin-bottom: 12px; }
    .wa-ib-count { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--sec-green-text); }
    .wa-ib-count .material-symbols-outlined { font-size: 16px; }
    .wa-ib { border: 1px solid var(--border); border-radius: 12px; background: var(--wa-tbl-bg, #fff); overflow-x: auto; }
    html.dark .wa-ib { --wa-tbl-bg: #1A2339; }
    .wa-ib-head, .wa-ib-row { display: grid; align-items: center; gap: 10px; padding: 10px 14px; min-width: 720px; grid-template-columns: minmax(150px,1.7fr) minmax(90px,1fr) 56px 92px minmax(120px,1.1fr) minmax(140px,1.9fr); }
    .wa-ib-head { border-bottom: 1px solid var(--border); }
    .wa-ib-th { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); white-space: nowrap; background: none; border: 0; padding: 0; margin: 0; font-family: inherit; text-align: left; }
    button.wa-ib-th { cursor: pointer; transition: color .14s; }
    button.wa-ib-th:hover { color: var(--text); }
    button.wa-ib-th:focus-visible { outline: 2px solid color-mix(in srgb, var(--primary) 55%, transparent); outline-offset: 3px; border-radius: 3px; }
    .wa-ib-th.is-sorted { color: var(--primary); }
    html.dark .wa-ib-th.is-sorted { color: var(--primary-bright, #8B9FAF); }
    button.wa-ib-th:hover .wa-sort-ic { opacity: .6; }
    .wa-ib-th.is-sorted .wa-sort-ic { opacity: 1; }
    .wa-ib-th[data-wa-dir="asc"] .wa-sort-ic { transform: rotate(180deg); }
    .wa-ib-row { border-bottom: 1px solid var(--border); transition: background .14s ease; }
    .wa-ib-row:last-child { border-bottom: 0; }
    .wa-ib-row:hover { background: var(--surface-2); }
    html.dark .wa-ib-row:hover { background: rgba(255,255,255,0.03); }
    .wa-ib-td { font-size: 12px; color: var(--text-muted); min-width: 0; }
    .wa-ib-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
    .wa-ib-cat { color: var(--text-muted); }
    .wa-ib-flags { display: flex; flex-wrap: wrap; gap: 4px; }
    .wa-ib-tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
    html.dark .wa-ib-tag { background: rgba(255,255,255,0.08); }
    .wa-ib-empty { padding: 22px 14px; text-align: center; color: var(--text-subtle); font-size: 12px; }

    /* Filter control inside the ingredient-query search pill (same pattern as
       Product Portfolio / admin tables). Popover sits above the tune icon. */
    .wa-search-inline.has-filter .wa-search { padding-right: 46px; }
    .wa-ib-filter-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--text-subtle); cursor: pointer; transition: background .15s ease, color .15s ease; }
    .wa-ib-filter-btn:hover { background: var(--surface-3, var(--surface-2)); color: var(--text); }
    html.dark .wa-ib-filter-btn:hover { background: rgba(255,255,255,0.08); }
    .wa-ib-filter-btn .material-symbols-outlined { position: static; transform: none; font-size: 18px; color: inherit; pointer-events: none; }
    .wa-ib-filter-btn.is-open { color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    html.dark .wa-ib-filter-btn.is-open { color: var(--primary-bright, #93C5FD); }
    .wa-ib-filter-btn.has-filters { color: var(--primary); }
    html.dark .wa-ib-filter-btn.has-filters { color: var(--primary-bright, #93C5FD); }
    .wa-ib-filter-btn .wa-ib-filter-dot { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); border: 1.5px solid var(--surface-2); display: none; }
    html.dark .wa-ib-filter-btn .wa-ib-filter-dot { background: var(--primary-bright, #93C5FD); }
    .wa-ib-filter-btn.has-filters .wa-ib-filter-dot { display: block; }
    .wa-ib-filter-pop { position: fixed; z-index: 240; right: 0; bottom: calc(100% + 8px); width: 320px; max-width: min(320px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-2, 0 12px 32px rgba(0,0,0,0.18)); padding: 14px; color: var(--text); }
    .wa-ib-filter-pop[hidden] { display: none; }
    .wa-ib-filter-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .wa-ib-filter-pop-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .wa-ib-filter-clear { border: none; background: transparent; color: var(--primary); font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
    html.dark .wa-ib-filter-clear { color: var(--primary-bright, #93C5FD); }
    .wa-ib-filter-clear:hover { text-decoration: underline; }
    .wa-ib-filter-group { margin-top: 12px; }
    .wa-ib-filter-group:first-of-type { margin-top: 0; }
    .wa-ib-filter-label { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 7px; }
    .wa-ib-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .wa-ib-fchip { display: inline-flex; align-items: center; padding: 5px 11px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--surface-2); font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--text-muted); transition: color .15s ease, border-color .15s ease, background .15s ease; }
    html.dark .wa-ib-fchip { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.12); color: var(--text-muted); }
    .wa-ib-fchip:hover { color: var(--text); border-color: var(--primary); }
    .wa-ib-fchip.is-on { color: #fff; border-color: var(--primary); background: var(--primary); }
    html.dark .wa-ib-fchip.is-on { color: #fff; border-color: var(--primary); background: var(--primary); }

    /* ── Footnote citations (in-transcript) ──────────────────────────────────
       Superscript numbered markers rendered proper-footnote style. A group like
       [1,3,5] clusters inside one bracketed superscript; each number is its own
       clickable target that opens the References output and scrolls to the card. */
    .wa-cite { font-size: .62em; line-height: 0; font-weight: 700; vertical-align: super; white-space: nowrap; margin-left: 1px; color: var(--text-subtle); }
    .wa-cite::before { content: '['; }
    .wa-cite::after { content: ']'; }
    .wa-cite-n { color: var(--primary); text-decoration: none; cursor: pointer; padding: 0 1px; border-radius: 3px; transition: background .12s ease, color .12s ease; }
    html.dark .wa-cite-n { color: var(--primary-bright, #8B9FAF); }
    .wa-cite-n + .wa-cite-n { margin-left: 1px; }
    .wa-cite-n:hover, .wa-cite-n:focus-visible { background: var(--primary-soft); color: var(--primary-ink, var(--primary)); outline: none; }
    .wa-cite-sep { color: var(--text-subtle); }

    /* Compact "footnotes" block that trails the answer — the wordy inline
       reference dump, distilled to a tight numbered list. The full cards live in
       the References output pane. */
    .wa-refs-mini { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border); }
    .wa-refs-mini-head { display: flex; align-items: center; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 9px; }
    .wa-refs-mini-list { display: grid; gap: 6px; }
    .wa-refs-mini-item { display: flex; gap: 8px; align-items: baseline; font-size: 11px; line-height: 1.4; color: var(--text-muted); cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; transition: background .12s ease; }
    .wa-refs-mini-item:hover { background: var(--surface-2); }
    html.dark .wa-refs-mini-item:hover { background: rgba(255,255,255,0.04); }
    .wa-refs-mini-n { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; font-variant-numeric: tabular-nums; background: var(--primary-soft); color: var(--primary); }
    html.dark .wa-refs-mini-n { color: var(--primary-bright, #8B9FAF); }
    .wa-refs-mini-t { flex: 1 1 auto; min-width: 0; }
    .wa-refs-mini-t b { color: var(--text); font-weight: 700; }
    .wa-refs-mini-src { color: var(--text-subtle); font-style: italic; }

    /* ── Reference output (a new pane OUTPUT type, alongside charts & details) ──
       Modeled on the WISEcodeAI Library module (pages/conversation-library.html):
       the canonical app search, a row of at-a-glance / filter scorecards, then a
       card per reference. The "References" title itself lives in the pane's
       HEADER masthead (.wa-pane-title), like every other module. */
    .wa-refset { container-type: inline-size; display: flex; flex-direction: column; }
    /* Search — copied from the Library / Product Portfolio search field. */
    .wa-refset .wa-ref-toolbar { display: flex; align-items: center; gap: 8px; }
    .wa-refset .wa-ref-search { position: relative; display: inline-flex; align-items: center; flex: 1 1 auto; min-width: 0; }
    .wa-refset .wa-ref-search > .material-symbols-outlined { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-subtle); pointer-events: none; }
    .wa-refset .wa-ref-search-input { width: 100%; height: 38px; box-sizing: border-box; padding: 0 16px 0 40px; font-family: inherit; font-size: .8125rem; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 999px; outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease; }
    html.dark .wa-refset .wa-ref-search-input { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-refset .wa-ref-search-input::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .wa-refset .wa-ref-search-input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    /* Scorecards — the canonical portfolio at-a-glance tiles, doubling as type
       filters, laid out on a grid that never leaves a lone orphan card. */
    .wa-refset .wa-ref-stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
    @container (min-width: 520px) { .wa-refset .wa-ref-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .wa-refset .wa-ref-stat { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-1); font-family: inherit; text-align: center; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease; }
    html.dark .wa-refset .wa-ref-stat { background: #1A2339; }
    html.chat-tint:not(.dark) .wa-refset .wa-ref-stat { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-refset .wa-ref-stat { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-refset .wa-ref-stat:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
    .wa-refset .wa-ref-stat:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .wa-refset .wa-ref-stat.is-active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); box-shadow: inset 0 0 0 1px var(--primary), var(--shadow-1); }
    html.dark .wa-refset .wa-ref-stat.is-active { background: color-mix(in srgb, var(--primary) 26%, transparent); }
    .wa-refset .wa-ref-stat-num { font-family: 'WISE Digits', 'Noto Serif', serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); }
    .wa-refset .wa-ref-stat-label { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .wa-refset .wa-ref-stat-label .material-symbols-outlined { font-size: 13px; line-height: 1; color: var(--text-subtle); }
    .wa-refset .wa-ref-divider { height: 1px; background: var(--border); margin: 20px 0 18px; }
    /* Card grid — mirrors .lib-grid / .lib-card on conversation-library.html:
       a responsive auto-fill grid of thumb-topped cards, not stacked rows. */
    .wa-refset .wa-ref-list { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .wa-refset .wa-ref-empty { grid-column: 1 / -1; font-size: 12px; color: var(--text-muted); padding: 10px 2px; }
    .wa-ref { display: flex; flex-direction: column; min-width: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-1); scroll-margin-top: 12px; transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease; }
    html.dark .wa-ref { background: rgba(255,255,255,0.02); }
    .wa-ref:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--primary) 32%, var(--border)); }
    .wa-ref.is-flash { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    /* Preview thumb — the paper's key highlight under a study-type badge, the
       reference counterpart of .lib-thumb + .lib-thumb-badge card headers. */
    .wa-ref-thumb { position: relative; flex: 0 0 auto; height: 122px; box-sizing: border-box; overflow: hidden; padding: 38px 14px 12px; border-bottom: 1px solid var(--border); background: var(--ter-amber-10); }
    /* When a card has no type badge, drop the reserved top gutter so the
       highlight fills the thumb evenly (agency / law refs have no chip). */
    .wa-ref-thumb:not(:has(.wa-ref-badge)) { padding-top: 14px; }
    .wa-ref-badge { position: absolute; top: 9px; left: 10px; max-width: calc(100% - 20px); box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .625rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(3px); color: var(--text-muted); border: 1px solid var(--border); }
    .wa-ref-badge .material-symbols-outlined { font-size: 12px; flex: 0 0 auto; }
    .wa-ref-badge.is-exp { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
    html.dark .wa-ref-badge.is-exp { color: var(--primary-bright, #8B9FAF); }
    .wa-ref-highlight { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; line-height: 1.5; color: var(--text); }
    .wa-ref-highlight .material-symbols-outlined { font-size: 15px; flex: 0 0 auto; margin-top: 1px; color: var(--ter-amber-text); }
    .wa-ref-highlight-t { display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    /* Card body — title / byline / footer, mirroring .lib-cbody / .lib-cname. */
    .wa-ref-cbody { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 13px; flex: 1; }
    .wa-ref-title { font-size: .875rem; font-weight: 700; line-height: 1.3; color: var(--text); }
    .wa-ref-byline { font-size: .75rem; color: var(--text-subtle); line-height: 1.45; }
    .wa-ref-byline .wa-ref-year { color: var(--text-muted); font-weight: 600; }
    .wa-ref-byline .wa-ref-journal { font-style: italic; }
    .wa-ref-byline .sep { margin: 0 5px; opacity: .55; }
    .wa-ref-abstract > summary { display: inline-flex; align-items: center; gap: 5px; list-style: none; cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--text-muted); user-select: none; }
    .wa-ref-abstract > summary::-webkit-details-marker { display: none; }
    .wa-ref-abstract > summary::before { content: 'chevron_right'; font-family: 'Material Symbols Outlined'; font-size: 17px; transition: transform .15s ease; }
    .wa-ref-abstract[open] > summary::before { transform: rotate(90deg); }
    .wa-ref-abstract-body { font-size: 11.5px; line-height: 1.6; color: var(--text-muted); margin: 8px 0 0; }
    /* Footer — citation count left, view-paper link right (like .lib-cfoot). */
    .wa-ref-cfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 2px; }
    .wa-ref-cites { display: inline-flex; align-items: center; gap: 3px; font-size: .75rem; font-weight: 600; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
    .wa-ref-cites .material-symbols-outlined { font-size: 14px; transform: scaleX(-1); }
    .wa-ref-view { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-decoration: none; transition: color .15s ease; }
    .wa-ref-view:hover { color: var(--text); text-decoration: underline; }
    .wa-ref-view .material-symbols-outlined { font-size: 14px; }

    /* Per-output title rendered INSIDE the block. Hidden everywhere now: the
       merged Output pane carries the name in its header masthead, and the
       split panes already name the output in theirs. Kept in the DOM so
       paneSlideLabel() can still read it as a fallback. */
    .wa-out-title { display: none; }
    /* Name + description live in the output header (count + chart name +
       meta). Do not repeat them above charts, and drop the tiny captions
       that used to trail tables. Per-card labels inside a plot (e.g. a
       donut's own "1,240 brands" title) stay visible. */
    .wa-pane-body .wa-chart-head,
    .wa-pane-body .wa-kraft-share-head,
    .wa-pane-body .wa-block > .wa-report-title,
    .wa-pane-body .wa-block > .wa-kraft-sub,
    .wa-pane-body .wa-block > .wa-ov-lede,
    .wa-pane-body .wa-sprouts-mix > .wa-kraft-sub,
    .wa-pane-body .wa-report-hero > .wa-report-title,
    .wa-pane-body .wa-caption,
    .wa-pane-body .wa-kraft-foot,
    .wa-pane-body .wa-table-foot { display: none; }

    /* ── Report layout ── */
    .wa-report-hero { margin-bottom: 20px; }
    .wa-report-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 900; font-size: 1.55rem; line-height: 1.15; letter-spacing: -.015em; color: var(--text); margin: 0 0 10px; }
    .wa-report-lede { font-size: 12.5px; line-height: 1.6; color: var(--text-muted); margin: 0; max-width: 640px; }
    .wa-report .wa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .wa-report .wa-stat { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
    html.dark .wa-report .wa-stat { background: #1A2339; }
    html.chat-tint:not(.dark) .wa-report .wa-stat { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-report .wa-stat { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-report .wa-stat-num { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 26px; line-height: 1; color: var(--text); }
    .wa-report .wa-stat-num .u { font-size: 14px; color: var(--text-muted); font-weight: 700; }
    .wa-report .wa-stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); margin-top: 7px; }
    .wa-shortlist { display: flex; flex-direction: column; gap: 8px; }
    .wa-cand { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
    html.dark .wa-cand { background: rgba(255,255,255,0.03); }
    .wa-cand-rank { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 13px; background: var(--primary); color: #fff; }
    html.dark .wa-cand-rank { background: var(--primary-bright, #8B9FAF); color: var(--surface); }
    .wa-report--brisket .wa-cand-rank { width: auto; height: auto; border-radius: 0; background: transparent; color: var(--primary); font-size: 15px; }
    html.dark .wa-report--brisket .wa-cand-rank { background: transparent; color: var(--primary-bright, #8B9FAF); }
    .wa-cand-body { flex: 1 1 auto; min-width: 0; }
    .wa-cand-name { font-size: 12.5px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .wa-cand-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .wa-cand-score { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 16px; color: var(--sec-green-text); flex: 0 0 auto; }

    /* ── Charts (SVG + div bars, app tokens only) ──
       Headline, lede, and caption sit on the pane. Only the plot itself is a
       white (surface) card — matching dash-card chrome, not a full-bleed wrap. */
    .wa-pane-body {
      --dash-donut-ring-h: calc(252px * 26 / 300);
    }
    .wa-pane-body .wa-chart-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 16px);
      box-shadow: var(--shadow-1);
      padding: 18px 20px;
      container-type: inline-size;
      container-name: donut-card;
    }
    html.dark .wa-pane-body .wa-chart-card {
      background: rgba(255, 255, 255, 0.025);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-card);
    }
    html.chat-tint:not(.dark) .wa-pane-body .wa-chart-card { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-pane-body .wa-chart-card { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-pane-body > .wa-block:has(> .wa-chart-card),
    #wa-report .wa-rpt-item-body > .wa-block:has(> .wa-chart-card) {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
    }
    /* Single-ring donuts in chat: same geometry as analytics-types
       `.dash-donut-single`. That class is `display:none` inside a
       dash-donut-card until the health ring is toggled off; here the
       donut IS the single ring, so keep it visible. */
    .wa-pane-body .dash-donut.dash-donut-single { display: block; }
    .wa-pane-body .dash-donut-num {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
    }

    /* Sprouts catalog mix — up to four compact donut cards in Visuals. */
    .wa-sprouts-mix { container-type: inline-size; }
    .wa-sprouts-donuts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .wa-sprouts-donut-card .wa-chart-title { font-size: 1.2rem; margin: 0 0 4px; }
    .wa-sprouts-donut-card .dash-donut-row { margin: 8px 0 0; }
    .wa-pane-body .wa-sprouts-donut-card .dash-donut {
      width: 190px;
      height: 190px;
    }
    .wa-pane-body .wa-sprouts-donut-card .dash-donut .dash-donut-center::before {
      width: 138px;
      height: 138px;
    }
    .wa-pane-body .wa-sprouts-donut-card .dash-donut-num { font-size: 1.7rem; }
    .wa-pane-body > .wa-block:has(.wa-sprouts-donuts),
    #wa-report .wa-rpt-item-body > .wa-block:has(.wa-sprouts-donuts) {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
    }
    .wa-pane-body .dash-donut-legend-group .dash-legend-item strong {
      width: auto;
      min-width: 36px;
    }
    .wa-health-bars { display: flex; flex-direction: column; gap: 12px; }
    .wa-health-row {
      display: grid;
      grid-template-columns: var(--wa-health-label, 140px) 1fr;
      align-items: center;
      gap: 12px;
    }
    .wa-health-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: right; line-height: 1.25; }
    .wa-pane-body .dash-ws-health-bar,
    .wa-pane-body .dash-ws-health-track { display: block; }
    .wa-pane-body .dash-ws-health-fill {
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* A carded chart carries its own edge, so drop the hairline separator that
       normally divides stacked blocks when one sits beside it. */
    .wa-pane-body > .wa-block:has(> .wa-chart-card) + .wa-block,
    .wa-pane-body > .wa-block + .wa-block:has(> .wa-chart-card) { border-top: 0; }
    .wa-chart-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--text-muted); }
    .wa-chart-legend .k { display: inline-flex; align-items: center; gap: 6px; }

    /* Kraft UPF charts — donut with outside labels + share table. */
    .wa-kraft-sub { font-size: 12.5px; font-style: italic; color: var(--text-muted); margin: -4px 0 14px; }
    .wa-kraft-share-head {
      display: flex; align-items: flex-start; gap: 10px; margin: 0 0 10px;
    }
    .wa-kraft-share-head > .material-symbols-outlined {
      font-size: 22px; color: var(--primary); margin-top: 4px; flex: 0 0 auto;
    }
    html.dark .wa-kraft-share-head > .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-kraft-share-head .wa-report-title { margin: 0 0 4px; }
    .wa-kraft-overall { font-size: 13.5px; color: var(--text-muted); margin: 0 0 14px; }
    .wa-kraft-overall b { color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-kraft-tbl { width: 100%; border-collapse: collapse; }
    .wa-kraft-tbl th {
      font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--primary); font-weight: 700; text-align: left;
      padding: 0 8px 8px; border-bottom: 1px solid var(--border);
    }
    html.dark .wa-kraft-tbl th { color: var(--primary-bright, #8B9FAF); }
    .wa-kraft-tbl th.wa-kraft-num, .wa-kraft-tbl td.wa-kraft-num { text-align: right; }
    .wa-kraft-tbl td {
      font-size: 13px; color: var(--text); font-weight: 600;
      padding: 11px 8px; border-top: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .wa-kraft-pctcell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
    .wa-kraft-pctbar {
      width: 88px; height: 8px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; flex: 0 0 auto;
    }
    .wa-kraft-pctbar .wa-bar-fill { background: color-mix(in srgb, var(--primary) 42%, #c5d4e8); }
    html.dark .wa-kraft-pctbar .wa-bar-fill { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 50%, #3a4d6a); }
    .wa-kraft-foot { font-size: 11.5px; color: var(--text-subtle); margin: 14px 0 0; }

    /* ── Top-brands overview (WISEscore top half) ── */
    .wa-pane-body > .wa-block.wa-ov,
    #wa-report .wa-rpt-item-body > .wa-block.wa-ov {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md, 16px);
      box-shadow: var(--shadow-1);
      padding: 22px 24px;
    }
    html.dark .wa-pane-body > .wa-block.wa-ov,
    html.dark #wa-report .wa-rpt-item-body > .wa-block.wa-ov {
      background: rgba(255, 255, 255, 0.025);
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-card);
    }
    html.chat-tint:not(.dark) .wa-pane-body > .wa-block.wa-ov,
    html.chat-tint:not(.dark) #wa-report .wa-rpt-item-body > .wa-block.wa-ov { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-pane-body > .wa-block.wa-ov,
    html.dark.chat-tint #wa-report .wa-rpt-item-body > .wa-block.wa-ov { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-ov-lede { font-size: 13px; line-height: 1.45; color: var(--text-muted); margin: 0 0 18px; }
    .wa-ov-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .wa-ov-kpi {
      display: flex; flex-direction: column; gap: 4px;
      padding: 14px 14px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; min-width: 0;
    }
    html.dark .wa-ov-kpi { background: #1A2339; }
    html.chat-tint:not(.dark) .wa-ov-kpi { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-ov-kpi { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-ov-kpi-lbl { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .wa-ov-kpi-val {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 1.45rem; font-weight: 800; line-height: 1.15; letter-spacing: -.02em;
      color: var(--text); font-variant-numeric: tabular-nums;
    }
    .wa-ov-kpi-foot { font-size: 11.5px; color: var(--text-subtle); line-height: 1.35; margin-top: 2px; }
    .wa-ov-kpi-track { height: 4px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
    .wa-ov-kpi-fill { display: block; height: 100%; border-radius: 9999px; background: var(--primary); width: 0; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    html.dark .wa-ov-kpi-fill { background: var(--primary-bright, #8B9FAF); }
    .wa-chart-head { margin: 0 0 12px; }
    .wa-chart-head .wa-report-title { margin-bottom: 6px; }
    .wa-bottomline {
      margin: 16px 0 0; padding: 12px 14px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    html.dark .wa-bottomline { background: rgba(255,255,255,0.04); }
    .wa-bottomline-h {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-size: 13px; font-weight: 800; color: var(--text); margin: 0 0 4px;
    }
    .wa-bottomline p { font-size: 12.5px; line-height: 1.45; color: var(--text-muted); margin: 0; }
    @media (max-width: 720px) {
      .wa-ov-kpis { grid-template-columns: 1fr; }
    }

    .wa-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .wa-bars { display: flex; flex-direction: column; gap: 9px; }
    .wa-bar-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; }
    .wa-bar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: right; }
    .wa-bar-track { height: 16px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; }
    .wa-bar-fill { height: 100%; border-radius: 9999px; background: var(--chart-mono, var(--primary)); }
    .wa-bars-thin .wa-bar-track { height: 6px; }
    .wa-bar-val { font-size: 11.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    /* Stacked score rows: name on its own line, bar + value beneath it so each
       ranked item gets vertical room to breathe. */
    .wa-scorebars { display: flex; flex-direction: column; gap: 14px; }
    .wa-scorebar { display: flex; flex-direction: column; gap: 7px; }
    .wa-scorebar-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .wa-scorebar-line { display: flex; align-items: center; gap: 12px; }
    .wa-scorebar-line .wa-bar-track { flex: 1 1 auto; height: 8px; }
    .wa-scorebar-line .wa-bar-val { flex: 0 0 auto; }
    .wa-radar-wrap { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
    .wa-radar-scores { width: 100%; }
    /* Let axis labels render past the SVG box instead of being clipped. */
    .wa-radar-svg { overflow: visible; }
    .wa-nd-tag { display: inline-block; padding: 1px 7px; border-radius: 9999px; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--ter-amber-10); color: var(--ter-amber-text); border: 1px solid color-mix(in srgb, var(--ter-amber) 30%, transparent); }

    /* ── Chart entrance + tap-to-replay ──
       Every surfaced chart animates in and can be REPLAYED by tapping it, just
       like the analytics dashboards. Bars grow from the left, SVG plots pop in,
       and the code-eval gauge sweeps its arc. Replaying just restarts these
       stylesheet animations from JS (see the waReplay* helpers), so the elements
       hold their final static state whenever motion is reduced. */
    @keyframes waBarGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes waSvgPop  { from { opacity: 0; transform: scale(0.72); } to { opacity: 1; transform: scale(1); } }
    @keyframes waGaugeSweep { from { stroke-dashoffset: var(--wa-gauge-c, 251); } to { stroke-dashoffset: var(--wa-off, 0); } }
    /* A carded chart is clickable as a whole; the code-eval gauge and the ported
       comparison spider / parallel plots carry their own hit surface. */
    .wa-pane-body > .wa-block:has(> .wa-chart-card),
    #wa-report .wa-rpt-item-body > .wa-block:has(> .wa-chart-card) { cursor: pointer; }
    .wa-ce-gauge { cursor: pointer; }
    .wa-pane-body .cmp-radar-canvas,
    .wa-pane-body .cmp-par-canvas { cursor: pointer; }
    .wa-chart-card .wa-bar-fill {
      transform-origin: left center;
      animation: waBarGrow 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--i, 0) * 55ms);
    }
    .wa-chart-card svg {
      transform-origin: center;
      animation: waSvgPop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .wa-ce-gauge-arc { animation: waGaugeSweep 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .wa-ce-plbar-fill { transform-origin: left center; animation: waBarGrow 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @media (prefers-reduced-motion: reduce) {
      .wa-chart-card .wa-bar-fill,
      .wa-chart-card svg,
      .wa-ce-gauge-arc,
      .wa-ce-plbar-fill { animation: none !important; }
    }

    /* ═══════════ Code Evaluation module ═══════════
       A distinct OUTPUT TYPE (beyond result tables, detail cards, reports &
       charts): the WISEcode "code evaluation" run for a recipe / ingredient
       list. Header carries a score gauge + parse summary; a collapsible STEP
       BREAKDOWN lists the code that produced the score; an INGREDIENT
       PROCESSING panel groups every parsed ingredient by NOVA-style processing
       level with a category tag. Renders inside a .wa-block in the Results pane. */
    .wa-ce-head { display: flex; align-items: center; gap: 18px; padding: 2px 2px 22px; }
    .wa-ce-gauge { flex: 0 0 auto; width: 88px; height: 88px; position: relative; }
    .wa-ce-gauge svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
    .wa-ce-gauge-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wa-ce-gauge-val { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 25px; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-gauge-band { font-size: 8.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--sec-green-text); margin-top: 3px; }
    .wa-ce-sum-concept { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); }
    .wa-ce-sum-main { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 18px; font-weight: 800; color: var(--text); margin-top: 4px; line-height: 1.1; }
    .wa-ce-sum-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .wa-ce-sum-sub b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    .wa-ce-sum-sub .sep { color: var(--text-subtle); opacity: .6; }

    .wa-ce-sec { border-top: 1px solid var(--border); padding-top: 16px; }
    .wa-ce-sec + .wa-ce-sec { margin-top: 24px; }
    .wa-ce-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .wa-ce-sec-head > .material-symbols-outlined { font-size: 17px; color: var(--primary); }
    html.dark .wa-ce-sec-head > .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-sec-title { font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--text); }
    .wa-ce-sec-count { font-size: 11px; font-weight: 600; color: var(--text-subtle); }
    .wa-ce-sec-chev { margin-left: auto; color: var(--text-subtle); font-size: 18px; }

    .wa-ce-steps-head { display: grid; grid-template-columns: 46px 1fr 72px; gap: 10px; padding: 0 4px 8px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); border-bottom: 1px solid var(--border); }
    .wa-ce-steps-head .end { text-align: right; }
    .wa-ce-step { display: grid; grid-template-columns: 46px 1fr 72px; gap: 10px; align-items: start; padding: 11px 4px; border-bottom: 1px solid var(--border); }
    .wa-ce-step:hover { background: var(--surface-2); }
    html.dark .wa-ce-step:hover { background: rgba(255,255,255,0.03); }
    .wa-ce-step-num { font-size: 11.5px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .wa-ce-step-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .wa-ce-step-name .tag { font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--primary); margin-left: 5px; }
    html.dark .wa-ce-step-name .tag { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-step-note { font-size: 11px; color: var(--text-subtle); line-height: 1.45; margin-top: 3px; }
    .wa-ce-step-val { text-align: right; font-size: 12.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-step-val.is-empty { color: var(--text-subtle); font-weight: 600; }
    .wa-ce-step-val.is-false { color: var(--ter-amber-text); }

    .wa-ce-pl { display: flex; align-items: center; gap: 9px; }
    .wa-ce-pl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sec-green); flex: 0 0 auto; }
    .wa-ce-pl-label { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .wa-ce-pl-count { margin-left: auto; font-size: 13px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ce-plbar { height: 6px; border-radius: 9999px; background: var(--surface-3); overflow: hidden; margin: 10px 0 16px; }
    .wa-ce-plbar-fill { height: 100%; border-radius: 9999px; background: var(--sec-green); }
    .wa-ce-ings { display: flex; flex-wrap: wrap; gap: 7px; }
    .wa-ce-ing { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 9999px; font-size: 11.5px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); }
    html.dark .wa-ce-ing { background: rgba(255,255,255,0.03); }
    .wa-ce-ing-tag { font-size: 10px; font-weight: 700; color: var(--primary); }
    html.dark .wa-ce-ing-tag { color: var(--primary-bright, #8B9FAF); }
    .wa-ce-role-tag { flex: 0 0 auto; padding: 3px 9px; border-radius: 9999px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--sec-green-10); color: var(--sec-green-text); border: 1px solid color-mix(in srgb, var(--sec-green) 26%, transparent); }

    /* ═══════════ Inline surface preview chip ═══════════
       When a turn opens a Results/Visuals module on the right, a small chip is
       dropped INTO the transcript: a tiny thumbnail preview of that content on
       the left, with the chart/result name to its right. Tapping it re-opens the
       full module. It's a <div role="button"> (not a <button>) so it can safely
       wrap the inner content of the surfaced view. */
    .sc-surface-slot { display: block; min-width: 0; max-width: 100%; }
    .sc-surface-card {
      position: relative; box-sizing: border-box;
      display: inline-flex; flex-direction: column; align-items: stretch;
      width: min(240px, 100%); max-width: 100%; min-width: 0;
      text-align: left; margin: 4px 0 0; padding: 8px 12px 8px 8px;
      /* Thin, light gold-yellow stroke so the output chips echo the amber
         activity-strip ticks on the chat's right edge — but the fill matches the
         chat container's own background so only the outline reads as gold. */
      background: var(--surface); border: 1px solid color-mix(in srgb, var(--ter-amber, #FFC434) 50%, transparent);
      border-radius: 14px; cursor: pointer; font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease, max-width .35s ease;
    }
    /* The chip's top row: thumbnail(s) + title. min-width:0 so the title column
       can shrink inside the docked chat instead of overflowing and clipping. */
    .sc-surface-head { display: flex; align-items: center; gap: 12px; min-width: 0; width: 100%; }
    /* Dark chat card uses #1A2339 (not --surface), so match it here too. */
    html.dark .sc-surface-card { background: #1A2339; }
    html.dark.chat-tint .sc-surface-card { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .sc-surface-card:hover { border-color: color-mix(in srgb, var(--ter-amber, #FFC434) 80%, transparent); box-shadow: 0 4px 12px rgba(255,196,52,0.12); }
    .sc-surface-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sc-surface-card:active { transform: translateY(1px); }
    /* Small clipped snapshot of the surfaced content, scaled way down. */
    .sc-surface-thumb {
      width: 52px; height: 52px; flex: 0 0 auto; border-radius: 10px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .sc-surface-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.1444); transform-origin: top left; pointer-events: none;
    }
    .sc-surface-thumb-inner > * { margin: 0 !important; }
    /* Body column — the title now stacks above a small meta row (timestamp +
       version), so every output chip is time-stamped and versioned. */
    .sc-surface-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
    /* Title uses the full width beside the thumbnail and wraps to two lines
       when the name is long, instead of stretching the chip across the chat. */
    .sc-surface-title {
      min-width: 0; width: 100%; font-size: 14px; font-weight: 700; color: var(--text);
      line-height: 1.3; white-space: normal; overflow-wrap: anywhere; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sc-surface-stamp { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
    .sc-surface-time {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 500; letter-spacing: .02em; color: var(--text-subtle);
      font-variant-numeric: tabular-nums;
    }
    .sc-surface-time .material-symbols-outlined { font-size: 12px !important; opacity: .8; }
    /* Version pill — the current version tag; when there's more than one it also
       carries the total count ("v3 · 3 versions"). */
    .sc-surface-ver {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px; border-radius: 9999px;
      font-size: 10px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
      color: var(--primary-ink, var(--primary));
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent);
    }
    html.dark .sc-surface-ver { color: var(--primary-bright, #8B9FAF); background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 16%, transparent); border-color: color-mix(in srgb, var(--primary-bright, #8B9FAF) 32%, transparent); }
    .sc-surface-ver-count { font-weight: 600; opacity: .85; }

    /* ── Surface chip meta (timestamp + version live in the turn's ⋯ menu) ── */
    .sc-surface-metabar { display: inline-flex; align-items: center; gap: 8px; }
    .sc-surface-ver-num {
      font-size: 10px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
      color: var(--text-subtle); font-variant-numeric: tabular-nums;
    }
    /* Version tag tucked into the three-dot menu, right after the timestamp. */
    .sc-fb-menu-ver {
      margin-right: 4px; padding-right: 6px; white-space: nowrap;
      border-right: 1px solid var(--border);
      font-size: 11px; font-weight: 600; letter-spacing: .02em;
      color: var(--text-subtle); font-variant-numeric: tabular-nums;
    }

    /* ── Chart expand (inside the right sticky output module) ─────────────────
       Each chart block wears a top-right icon that puts its host module into
       a viewport overlay: it sits over the primary nav and the rest of the
       shell. Chat and sibling modules hide. Inline expand in the transcript
       chip is gone. */
    .wa-pane-body > .wa-block:has(> .wa-chart-card),
    #wa-report .wa-rpt-item-body > .wa-block:has(> .wa-chart-card) { position: relative; }
    #modules-row.output-fs {
      z-index: 80;
    }
    html.output-fs #menu-panel {
      z-index: 1 !important;
    }
    #modules-row.output-fs > .wa-chat,
    #modules-row.output-fs > .wch-sidebar,
    #modules-row.output-fs > .wa-pane:not(.pane-fs) {
      display: none !important;
    }
    #modules-row.output-fs > .wa-pane.pane-fs.is-open {
      position: fixed !important;
      inset: var(--modules-bottom-pad, 12px) !important;
      flex: none !important;
      width: auto !important;
      height: auto !important;
      min-width: 0;
      align-self: auto !important;
      margin: 0 !important;
      padding-left: 0 !important;
      border: 1px solid var(--border) !important;
      border-radius: 16px !important;
      background: var(--surface) !important;
      box-shadow: var(--shadow-card) !important;
      z-index: 80 !important;
    }
    #modules-row.output-fs > .wa-pane.pane-fs.is-sticky .wa-pane-top {
      background: var(--surface);
    }
    /* Full-screen chart: drop the 300px / 70% caps and grow the plot so it
       reads as the hero of the overlay, not a leftover docked thumbnail. */
    #modules-row.output-fs > .wa-pane.pane-fs .wa-pane-body > .wa-block:has(> .wa-chart-card) {
      padding: 0;
    }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-chart-card {
      padding: 28px 36px 32px;
    }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-chart-card svg {
      max-width: none !important;
      width: 100% !important;
    }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-radar-wrap > div {
      max-width: min(640px, 80%) !important;
      width: min(640px, 80%) !important;
    }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-bars { gap: 18px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-bar-row {
      grid-template-columns: 168px 1fr 64px;
      gap: 16px;
    }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-bar-track { height: 28px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-bar-label { font-size: 14px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-bar-val { font-size: 16px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-scorebars { gap: 20px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-scorebar-name { font-size: 15px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-scorebar-line .wa-bar-track { height: 16px; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-report-title.wa-chart-title { font-size: 1.85rem; }
    #modules-row.output-fs > .wa-pane.pane-fs .wa-pane-name { font-size: 1.7rem; }
    /* Expand control sits in a toolbar above the plot/table — top-right of
       the output block, never inside the table. */
    .wa-pane-body .wa-block:has(.wa-chart-card) { position: relative; }
    .wa-chart-toolbar {
      display: flex; justify-content: flex-end; align-items: center;
      min-height: 28px; margin: 0 0 10px;
    }
    .wa-chart-expand-btn {
      position: relative; z-index: 4; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-subtle);
      box-shadow: 0 1px 3px rgba(15,30,55,0.12);
      cursor: pointer; transition: color .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
      opacity: .72;
    }
    .wa-pane-body .wa-block:has(.wa-chart-card):hover .wa-chart-expand-btn,
    .wa-chart-expand-btn:focus-visible { opacity: 1; }
    html.dark .wa-chart-expand-btn { background: #1A2339; border-color: rgba(37,80,124,0.32); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .wa-chart-expand-btn:hover { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); }
    .wa-chart-expand-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-chart-expand-btn .material-symbols-outlined { font-size: 16px !important; }
    html.dark .wa-chart-expand-btn:hover { color: var(--primary-bright, #8B9FAF); background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 14%, #1A2339); }
    .wa-chart-expand-btn.is-on { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); opacity: 1; }
    html.dark .wa-chart-expand-btn.is-on { color: var(--primary-bright, #8B9FAF); }

    /* ═══════════ Versioned output — stacked thumbnails ═══════════
       When an output has been redone, its chip shows every version as a
       horizontal cascade: the previous version(s) first, the newest last and
       fully raised. Each mini-thumb wears a small vN tag. */
    .sc-surface-stack { display: inline-flex; align-items: center; flex: 0 0 auto; padding-left: 4px; }
    .sc-surface-stack .sc-surface-thumb {
      width: 40px; height: 40px; margin-left: -18px;
      box-shadow: -3px 2px 8px rgba(0,0,0,0.16); background: var(--surface-2);
      transition: transform .15s ease, margin .15s ease;
    }
    html.dark .sc-surface-stack .sc-surface-thumb { box-shadow: -3px 2px 10px rgba(0,0,0,0.45); }
    .sc-surface-stack .sc-surface-thumb:first-child { margin-left: 0; }
    /* Newest version is emphasized: full opacity + brand ring, the rest recede. */
    .sc-surface-stack .sc-surface-thumb.is-old { filter: saturate(.85) brightness(.98); opacity: .9; }
    .sc-surface-stack .sc-surface-thumb.is-latest { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: -3px 2px 10px rgba(37,80,124,0.28), 0 0 0 1px color-mix(in srgb, var(--primary) 30%, transparent); }
    /* The version currently mirrored into the pane gets a stronger ring so the
       stack and the pane agree. */
    .sc-surface-stack .sc-surface-thumb.is-active { z-index: 3; border-color: color-mix(in srgb, var(--primary) 70%, var(--border-strong)); box-shadow: -3px 2px 12px rgba(37,80,124,0.34), 0 0 0 2px color-mix(in srgb, var(--primary) 45%, transparent); }
    .sc-surface-card:hover .sc-surface-stack .sc-surface-thumb { margin-left: -10px; }
    .sc-surface-card:hover .sc-surface-stack .sc-surface-thumb:first-child { margin-left: 0; }
    /* Each stacked version thumb is its own click target — tapping it opens that
       exact version on the right. Give it a clear hover/focus affordance so it
       reads as individually clickable, not just part of the card. */
    .sc-surface-stack .sc-surface-thumb[data-surface-ver] { cursor: pointer; }
    .sc-surface-card:hover .sc-surface-stack .sc-surface-thumb[data-surface-ver]:hover {
      transform: translateY(-3px); z-index: 3;
      border-color: color-mix(in srgb, var(--primary) 70%, var(--border-strong));
      box-shadow: -3px 4px 12px rgba(37,80,124,0.32), 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent);
    }
    .sc-surface-stack .sc-surface-thumb[data-surface-ver]:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 2px; z-index: 3;
    }
    /* vN tag riding the bottom-right of each stacked thumb. */
    .sc-surface-vtag {
      position: absolute; right: 1px; bottom: 1px; z-index: 2;
      padding: 0 3px; border-radius: 5px; min-width: 12px; text-align: center;
      font-size: 8px; font-weight: 800; line-height: 13px; letter-spacing: 0;
      color: var(--text-muted); background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .sc-surface-thumb.is-latest .sc-surface-vtag { color: #fff; background: var(--primary); border-color: var(--primary); }
    /* Brief highlight when a merged-rail chip jumps the transcript here, so the
       eye lands on the right turn. */
    .sc-surface-card.is-flash {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
      animation: scSurfaceFlash 1.4s ease;
    }
    @keyframes scSurfaceFlash {
      0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 40%, transparent); }
      100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 0%, transparent); }
    }

    /* ═══════════ Conversation manifest (floating Outputs / Sources) ═══════════
       A floating summary card pinned to the chat's top-right, just below the
       width-toggle. It lists every OUTPUT surfaced into the result panes and the
       verified SOURCES this transcript draws on, so a long conversation always
       keeps a jump-list of what it produced. Open by default when the chat is
       wide (≈triple width); otherwise it collapses to a slim icon rail that
       expands on hover. When wide it can also be manually collapsed or closed. */
    .wa-manifest {
      position: absolute;
      top: calc(var(--panel-header-h, 60px) + 10px);
      right: 14px;
      z-index: 24;
      width: auto;               /* hug whichever child is visible, right-anchored */
      max-width: calc(100% - 28px);
      font-family: inherit;
      /* Stack the full panel, the icon rail and the re-open button in one grid
         cell so they can cross-fade in place without any reflow. */
      display: grid;
      justify-items: end;
      align-items: start;
    }
    .wa-manifest.is-empty { display: none; }

    /* Expanded panel — the default when the chat is wide. */
    .wa-manifest-full {
      display: flex; flex-direction: column;
      width: 266px; max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.05);
      padding: 12px 12px 14px;
      max-height: calc(100vh - var(--panel-header-h, 60px) - 60px);
      overflow: hidden;
    }
    html.dark .wa-manifest-full { box-shadow: 0 14px 36px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4); }

    /* Smooth open/close. The panel, rail and re-open button share one grid cell
       and cross-fade with a small scale from the top-right. transition-behavior:
       allow-discrete + @starting-style animate the display:none <-> shown flip in
       BOTH directions, so the box eases open and closed instead of popping. */
    .wa-manifest-full,
    .wa-manifest-rail,
    .wa-manifest-reopen {
      grid-area: 1 / 1;
      transform-origin: top right;
      transition: opacity .17s ease,
                  transform .24s cubic-bezier(0.22, 0.61, 0.36, 1),
                  display .24s allow-discrete;
    }
    @starting-style {
      .wa-manifest-full,
      .wa-manifest-rail,
      .wa-manifest-reopen { opacity: 0; transform: scale(0.97) translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wa-manifest-full,
      .wa-manifest-rail,
      .wa-manifest-reopen { transition: none; }
    }

    /* Collapse / close controls — floated in the panel's top-right corner. Only
       meaningful (and shown) when the chat is wide enough to be open by default. */
    .wa-manifest-ctrls { display: flex; justify-content: flex-end; gap: 2px; height: 0; overflow: visible; }
    .wa-manifest:not(.is-wide) .wa-manifest-ctrls { display: none; }
    .wa-manifest-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: 0; border-radius: 7px;
      background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: background .14s, color .14s;
    }
    .wa-manifest-btn:hover { background: var(--surface-2); color: var(--text); }
    html.dark .wa-manifest-btn:hover { background: rgba(255,255,255,0.06); }
    .wa-manifest-btn .material-symbols-outlined { font-size: 17px; }

    .wa-manifest-section { min-height: 0; display: flex; flex-direction: column; }
    .wa-manifest-section[hidden] { display: none; }
    .wa-manifest-label { font-size: 12.5px; font-weight: 700; color: var(--text); margin: 2px 4px 7px; flex: 0 0 auto; }
    .wa-manifest-list { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0; }
    .wa-manifest-div { height: 1px; background: var(--border); margin: 11px 2px; flex: 0 0 auto; }

    .wa-manifest-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 7px 8px; border: 0; border-radius: 9px; background: transparent;
      cursor: pointer; text-align: left; font-family: inherit; color: var(--text);
      transition: background .14s;
    }
    .wa-manifest-item--static { cursor: default; }
    .wa-manifest-item[role="button"]:hover,
    button.wa-manifest-item:hover { background: var(--surface-2); }
    html.dark .wa-manifest-item[role="button"]:hover,
    html.dark button.wa-manifest-item:hover { background: rgba(255,255,255,0.05); }
    .wa-manifest-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .wa-manifest-ic {
      width: 27px; height: 27px; flex: 0 0 auto; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary-soft); color: var(--primary); overflow: hidden;
    }
    html.dark .wa-manifest-ic { color: var(--primary-bright, #8B9FAF); }
    .wa-manifest-ic .material-symbols-outlined { font-size: 16px; }
    .wa-manifest-ic img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
    .wa-manifest-name { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Collapsed icon rail — the slim state on narrow widths. */
    .wa-manifest-rail {
      display: none; opacity: 0; transform: scale(0.97) translateY(-5px);
      flex-direction: column; align-items: center; gap: 5px;
      margin-left: auto; width: max-content; padding: 8px 7px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,0.12);
      max-height: calc(100vh - var(--panel-header-h, 60px) - 60px); overflow-y: auto;
    }
    html.dark .wa-manifest-rail { box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
    .wa-manifest-rail-ic {
      width: 26px; height: 26px; flex: 0 0 auto; border: 0; border-radius: 50%; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: var(--primary-soft); color: var(--primary); overflow: hidden;
      transition: transform .12s, box-shadow .14s;
    }
    html.dark .wa-manifest-rail-ic { color: var(--primary-bright, #8B9FAF); }
    .wa-manifest-rail-ic:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.14); }
    .wa-manifest-rail-ic--static { cursor: default; background: var(--surface-2); color: var(--text-muted); }
    html.dark .wa-manifest-rail-ic--static { background: rgba(255,255,255,0.06); }
    .wa-manifest-rail-ic .material-symbols-outlined { font-size: 14px; }
    .wa-manifest-rail-ic img { width: 14px; height: 14px; object-fit: contain; border-radius: 50%; }
    .wa-manifest-rail-div { width: 18px; height: 1px; background: var(--border); margin: 2px 0; flex: 0 0 auto; }

    /* State toggling: collapsed shows the rail; hovering the rail peeks the full
       panel; hidden shows only a small reopen button. Each shown/hidden variant
       carries its own opacity + transform so the shared transition has real
       start/end values to ease between. */
    .wa-manifest.is-collapsed .wa-manifest-full { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }
    .wa-manifest.is-collapsed .wa-manifest-rail { display: flex; opacity: 1; transform: none; }
    .wa-manifest.is-collapsed:hover .wa-manifest-full { display: flex; opacity: 1; transform: none; }
    .wa-manifest.is-collapsed:hover .wa-manifest-rail { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }

    .wa-manifest.is-hidden .wa-manifest-full,
    .wa-manifest.is-hidden .wa-manifest-rail { display: none; opacity: 0; transform: scale(0.97) translateY(-5px); }
    /* Turned off from the chat's three-dot "Hide outputs & sources" switch —
       removes the whole component (panel, rail AND re-open button). */
    .wa-manifest.is-off { display: none !important; }
    .wa-manifest-reopen {
      display: none; opacity: 0; margin-left: auto; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--primary); cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }
    html.dark .wa-manifest-reopen { color: var(--primary-bright, #8B9FAF); box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
    .wa-manifest-reopen:hover { transform: translateY(-1px); }
    .wa-manifest.is-hidden .wa-manifest-reopen { display: inline-flex; opacity: 1; transform: none; }
    .wa-manifest-reopen .material-symbols-outlined { font-size: 20px; }
    .wa-manifest-reopen-badge {
      position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 9999px; background: var(--primary); color: #fff; font-size: 9.5px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    }
    html.dark .wa-manifest-reopen-badge { background: var(--primary-bright, #8B9FAF); color: var(--surface); }
    .wa-manifest-reopen { position: relative; }

    /* Full bleed — mirror the shared treatment (wise.css). Chat always
       stretches; the output pane (.wa-pane) and docked History do too unless
       Chat only is on (html.fb-chat-only), which puts those back in cards.
       !important so we beat the page-level `height: calc(100% - 30px)` drawer
       inset that previously left the output module sitting in a gutter. */
    html.full-bleed .wa-chat,
    html.full-bleed:not(.fb-chat-only) .wa-pane,
    html.full-bleed:not(.fb-chat-only) #modules-row .wch-sidebar.wch-docked {
      border-top: 0 !important; border-bottom: 0 !important; border-radius: 0 !important;
      box-shadow: none !important; animation: none !important;
    }
    html.full-bleed:not(.fb-chat-only) #modules-row .wa-pane.is-open,
    html.full-bleed:not(.fb-chat-only) #modules-row .wa-pane.is-open.is-sticky,
    html.full-bleed:not(.fb-chat-only) #modules-row .wch-sidebar.wch-docked {
      align-self: stretch !important;
      height: 100% !important;
      max-height: 100% !important;
    }
    html.full-bleed:not(.fb-chat-only) body { padding: 0 !important; }

    /* Narrow viewports: let the modules scroll horizontally rather than crush. */
    @media (max-width: 1180px) {
      #chat-shell-wrap.menu-brand-integrated #modules-row { overflow-x: auto; }
      .wa-pane.is-open { min-width: 480px; }
    }

    /* ═══════════ Share side panel (⋯ → Share) ═══════════
       A right-docked panel that slides over the chat, reusing the SHARED
       `.wch-sidebar` shell (identical to "Connect a data source") plus the app's
       own form controls (.adm-field / .adm-input / .adm-btn pill / .chip). Only
       the bits those classes don't cover (chip box, people dropdown, output rows)
       are defined here. */
    #wa-share-panel { width: 372px; }
    /* Editorial serif masthead — matches the result panes / docked modules. The
       title + conversation subtitle stack in the header (no leading icon). */
    #wa-share-panel .wch-head { align-items: flex-start; padding: 16px 12px 14px 18px; }
    #wa-share-panel .wch-head-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; line-height: 1.16; color: var(--text); }
    .wa-sh-head-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .wa-sh-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-sub { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-form { display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-form[hidden], .wa-sh-done[hidden] { display: none; }

    /* Textarea sibling to .adm-input (which is a fixed-height single-line field). */
    .wa-sh-textarea { width: 100%; box-sizing: border-box; min-height: 74px; padding: 10px 14px; font-family: inherit; font-size: 0.8125rem; line-height: 1.45; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 10px; outline: none; resize: vertical; }
    html.dark .wa-sh-textarea { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-sh-textarea:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .adm-input::placeholder, .wa-sh-textarea::placeholder { color: var(--text-subtle); opacity: 0.85; }

    /* Recipient chip box — matches .adm-input, but wraps chips + a borderless input. */
    .wa-sh-chips { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; box-sizing: border-box; padding: 5px 8px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 10px; }
    html.dark .wa-sh-chips { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-sh-chips:focus-within { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .wa-sh-chipinput { flex: 1 1 90px; min-width: 90px; height: 30px; border: 0; background: transparent; font-family: inherit; font-size: 0.8125rem; color: var(--text); outline: none; padding: 0 4px; }
    .wa-sh-chipinput::placeholder { color: var(--text-subtle); opacity: 0.85; }

    /* Recipient pill (compact take on .chip; body isn't clickable, only the ×). */
    .wa-sh-chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 5px 3px 11px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); font-size: 0.76rem; font-weight: 500; color: var(--text); }
    html.dark .wa-sh-chip { background: rgba(255,255,255,0.06); }
    .wa-sh-chip.is-invalid { border-color: var(--sec-red); color: var(--sec-red); }
    .wa-sh-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-chip-x { display: grid; place-items: center; width: 17px; height: 17px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text-subtle); cursor: pointer; }
    .wa-sh-chip-x:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    html.dark .wa-sh-chip-x:hover { background: rgba(255,255,255,0.12); }
    .wa-sh-chip-x .material-symbols-outlined { font-size: 14px; }

    /* People search dropdown. */
    .wa-sh-menu { position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 5; overflow: hidden auto; max-height: 210px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 16px 34px rgba(20,30,60,0.16); }
    html.dark .wa-sh-menu { background: var(--surface-2); box-shadow: 0 16px 34px rgba(0,0,0,0.5); }
    .wa-sh-menu[hidden] { display: none; }
    .wa-sh-person { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer; }
    .wa-sh-person:last-child { border-bottom: 0; }
    .wa-sh-person:hover, .wa-sh-person.is-active { background: var(--surface-2); }
    html.dark .wa-sh-person:hover, html.dark .wa-sh-person.is-active { background: rgba(255,255,255,0.06); }
    .wa-sh-person-av { display: grid; place-items: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: var(--surface-2); color: var(--text-subtle); }
    html.dark .wa-sh-person-av { background: rgba(255,255,255,0.08); }
    .wa-sh-person-av .material-symbols-outlined { font-size: 17px; }
    .wa-sh-person-txt { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
    .wa-sh-person-name { font-size: 0.82rem; font-weight: 600; color: var(--text); white-space: nowrap; }
    .wa-sh-person-mail { font-size: 0.78rem; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-sh-menu-empty { padding: 10px 12px; font-size: 0.8rem; color: var(--text-subtle); line-height: 1.4; }

    /* Checkbox rows (entire org + individual outputs). */
    .wa-sh-check { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; color: var(--text); cursor: pointer; }
    .wa-sh-outs { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .wa-sh-out { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
    .wa-sh-out:hover { background: var(--surface-2); }
    html.dark .wa-sh-out:hover { background: rgba(255,255,255,0.05); }
    .wa-sh-out-tag { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--primary); flex-shrink: 0; }
    html.dark .wa-sh-out-tag { color: var(--primary-bright); }
    .wa-sh-out-name { min-width: 0; font-size: 0.8125rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Footer pinned to the bottom of the panel. */
    .wa-sh-foot { flex-shrink: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); }
    html.dark .wa-sh-foot { border-top-color: rgba(255,255,255,0.08); }

    /* Success view — a "Share created" card (link + copy) above the running
       "Existing shares" list. Copy uses the app's primary pill button. */
    .wa-sh-done { display: flex; flex-direction: column; gap: 16px; }
    .wa-sh-created { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--sec-green) 42%, var(--border)); background: color-mix(in srgb, var(--sec-green) 7%, var(--surface)); }
    html.dark .wa-sh-created { background: color-mix(in srgb, var(--sec-green) 14%, var(--surface-2)); }
    .wa-sh-created-title { font-size: 1rem; font-weight: 700; color: var(--sec-green-text, var(--sec-green)); }
    .wa-sh-linkrow { display: flex; gap: 8px; }
    .wa-sh-linkrow .adm-input { flex: 1 1 auto; min-width: 0; font-size: 0.76rem; }
    .wa-sh-linkrow .adm-btn { flex: 0 0 auto; }

    .wa-sh-existing { display: flex; flex-direction: column; padding-top: 14px; border-top: 1px solid var(--border); }
    .wa-sh-existing-label { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .wa-sh-existing-empty { font-size: 0.8rem; color: var(--text-subtle); padding: 4px 0; }
    .wa-sh-share-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .wa-sh-share-ic { display: grid; place-items: center; width: 22px; height: 22px; flex-shrink: 0; color: var(--sec-green); }
    .wa-sh-share-ic .material-symbols-outlined { font-size: 19px; }
    .wa-sh-share-meta { flex: 1 1 auto; min-width: 0; font-size: 0.82rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wa-sh-share-scope { color: var(--text-subtle); }
    .wa-sh-share-acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .wa-sh-share-act { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--text-subtle); cursor: pointer; }
    .wa-sh-share-act:hover { background: var(--surface-2); color: var(--text); }
    html.dark .wa-sh-share-act:hover { background: rgba(255,255,255,0.06); }
    .wa-sh-share-act .material-symbols-outlined { font-size: 17px; }

    /* Report-hosted Share — same form, but it fills the report module instead
       of sliding over the chat. Content (title + charts) is report-specific. */
    #wa-report.wch-host { position: relative; }
    #wa-report #wa-share-panel {
      width: 100%;
      max-width: none;
      left: 0;
      right: 0;
      border-left: 0;
      box-shadow: none;
      background: var(--surface);
    }
    html.dark #wa-report #wa-share-panel { background: var(--surface); }
    #wa-report #wa-share-panel .wa-sh-body { padding: 12px 14px 6px; }
    #wa-report #wa-share-panel .wa-sh-foot { padding: 10px 14px 12px; }
    #wa-report > .wch-scrim { display: none !important; }

    /* ===== PORTED COMPARE ENGINE CSS (from product-comparison.html) ===== */
    /* ── Competitive Comparison ("Compare Foods") module ─────────────────
       Chat-driven board that renders the reference "Compare Foods" grid. Opens
       wider than the workflow modules because it carries a metric rail plus up
       to five entity columns; the grid scrolls horizontally inside the body. */
    #compare-panel { display: none; flex-shrink: 0; }
    #compare-panel.cp-open { display: flex; width: 640px; }
    #compare-panel.panel-wide.cp-open { width: 860px; }
    #compare-panel.panel-wide.panel-triple.cp-open { width: 1080px; }
    #compare-panel .cmp-inner {
      width: 640px;
      min-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(155deg, #1A2339 0%, #0d1b27 60%, #1A2339 100%);
      box-shadow: 0 4px 56px rgba(0, 0, 0, 0.5), inset 1px 0 0 rgba(37, 80, 124, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform-origin: right center;
      font-size: var(--fs-ui);
    }
    #compare-panel.panel-wide .cmp-inner { width: 860px; }
    #compare-panel.panel-wide.panel-triple .cmp-inner { width: 1080px; }
    #compare-panel.cp-open .cmp-inner { animation: panelBounceRight 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @media (prefers-reduced-motion: reduce) { #compare-panel.cp-open .cmp-inner { animation: none !important; } }
    html:not(.dark) #compare-panel .cmp-inner {
      background: linear-gradient(165deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    /* Scope selector — TRUE tabs: square corners, vertical dividers between
       each, an active underline, and a square hover wash. No rounding, ever.
       Wraps instead of scrolling so the report never needs a horizontal bar. */
    .cmp-scopebar {
      display: flex; flex-wrap: wrap; gap: 0; padding: 0;
      border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .cmp-scopebar::-webkit-scrollbar { display: none; }
    .cmp-scope-btn {
      display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
      /* Asymmetric vertical padding (down ~4px) centres the tab label on the
