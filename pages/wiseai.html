            `<a class="cmp-takeaway-chat" role="button" tabindex="0" title="Chat about this takeaway" aria-label="Chat with WISEcodeAI about this takeaway" onclick="cmpChatTakeaway('${c.entId}','${c.key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cmpChatTakeaway('${c.entId}','${c.key}')}"><span class="material-symbols-outlined">forum</span></a></span>` +
          `</div>` +
        `</div>`).join('') +
        '</div></div>';

      /* ── Ranked Summary ────────────────────────────────────────────────
         A compact 1-to-N leaderboard by overall WISEscore. The PRD flags this
         as best-fit for the "vs. Many" scopes and redundant at 1-vs-1, so it
         only surfaces once three or more entities are scored. Complements the
         per-column rank badges the head-to-head already shows. */
      const rankedLive = ranked.filter(e => !e.na);
      const rankedSummary = (rankedLive.length >= 3)
        ? '<div class="cmp-takeaways-sec"><div class="cmp-section-label">Ranked Summary</div>' +
          '<div class="cmp-ranked">' +
          rankedLive.map(e => {
            const sc = Math.round(cmpScoreFor(e, 'wisescore'));
            const you = e.primary ? ' <span class="cmp-you-pill">YOU</span>' : (e.isCategory ? ' <span class="cmp-cat-pill">CATEGORY</span>' : '');
            return '<div class="cmp-rank-row">' +
              `<span class="cmp-rank-badge">${rankOf.get(e.id)}</span>` +
              `<span class="cmp-rank-name">${e.name}${you}</span>` +
              `<span class="cmp-rank-bar"><span style="width:${sc}%"></span></span>` +
              `<span class="cmp-rank-score">${sc}</span>` +
            '</div>';
          }).join('') +
          '</div></div>'
        : '';

      /* ── Ingredient-Level Detail ────────────────────────────────────────
         Not a standalone view: it surfaces only when the metric set includes
         an Ingredient Quality leaf metric (compareState.drill, set in
         cmpToggleMetric / scenarios). Lists the ingredients driving the
         primary entity's score, colour-graded like the report drill-down. */
      const drillMetric = metrics.find(m => m.fam === 'Ingredient Quality' && m.id !== 'ing_overall');
      const drillPrimary = rankedLive.find(e => e.primary) || rankedLive[0];
      const drillDetail = (drillMetric && scope.drill && scope.drill.length && drillPrimary)
        ? '<div class="cmp-takeaways-sec"><div class="cmp-section-label">Ingredient-Level Detail</div>' +
          `<div class="cmp-drill-note">Key ingredients shaping <strong>${drillPrimary.name}</strong>’s ingredient profile${drillMetric ? ', graded for <strong>' + cmpMetricShort(drillMetric) + '</strong>' : ''}</div>` +
          '<div class="cmp-drill">' +
          scope.drill.map(d =>
            '<div class="cmp-drill-row">' +
            `<span class="cmp-drill-dot" style="background:${d.color}"></span>` +
            `<span class="cmp-drill-name">${d.name}</span>` +
            `<span class="cmp-drill-tag ${d.cls}">${d.tag}</span>` +
            '</div>').join('') +
          '</div></div>'
        : '';

      /* Guiding Stars shows the rating grid on its own — the Key Takeaways,
         Ranked Summary and Ingredient drill are WISEcode-specific, so they're
         suppressed while the star view is on. */
      const extras = gs ? '' : (takeaways + rankedSummary + drillDetail);
      body.innerHTML = boardHead + toolbar + recalcBar + grid + chart_html + extras;
      body.scrollTop = 0;
      compareState._settle = false;   /* consume the one-shot settle animation flag */
      /* Animate the header WISEscore gauges + count the takeaway scores up on
         render so they sweep in with the bars. */
      requestAnimationFrame(() => { cmpReplayGauges(); cmpReplayTakeaways(); });
    }

    /* ── Chat-driven guided flow ──────────────────────────────────────── */
    /* You're signed in as a brand (Amy's Kitchen), so a comparison should be live
       the instant this opens — never a blank "pick a scope" board. We load YOUR
       own portfolio first (scores, charts and takeaways all filled) as the
       default single-column board, then make adding a competitor the obvious
       next step — both as a prominent "Add" intent chip in the chat and via the
       always-visible Add button on the board itself. */
    function startComparisonWorkflow() {
      hideWelcomeScreen(() => {
        compareResetState();
        openComparePanel();
        addUserMessage('Compare my food', { lead: true });
        const typing = showWISEcodeAITyping('WISEcodeAI is loading your food');
        setTimeout(() => {
          typing?.remove();
          cmpSetScope('portfolio_vs_portfolio');   /* populates the scope + metrics */
          /* Start with only YOUR food on the board — no competitor yet. */
          const scope = CMP_SCOPES['portfolio_vs_portfolio'];
          const prim = scope.entities.find(e => e.primary) || scope.entities[0];
          compareState.shown = [prim.id];
          renderCompare();
          scrollPanelIntoView('compare-panel');
          addWISEcodeAIMessage('You’re set up as <strong>Amy’s Kitchen</strong>, so I’ve loaded <strong>your</strong> food on the left — WISEscore, UPF, GRAS, ingredient and protein quality are all populated. When you’re ready, <strong>add a competitor</strong> to build the head-to-head — use the chip below or the <strong>Add</strong> button on the board.', { source: false });
          cmpOfferFollowChips();
        }, 650);
      });
    }

    /* ── Use-case scenarios ───────────────────────────────────────────────
       One intent chip per documented user story / scope. Each preloads a
       scope, a tailored metric set, and any toggles (category avg, drill,
       self-vs-category) so every situation in the PRD is one click away. */
    const CMP_SCENARIOS = [
      { id: 'pvp_heart',        level: 'Product',   icon: 'favorite',    label: 'Bitchin’ Sauce vs a dip · Heart Health',

      { id: 'pvm_granola',      level: 'Product',   icon: 'grid_view',   label: 'My granola vs a competitor shelf set',
        scope: 'product_vs_many', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall', 'protein_density'],
        userMsg: 'Compare my granola SKU against a realistic shelf set of competitor granolas.',

      { id: 'pvm_claim',        level: 'Product',   icon: 'health_and_safety', label: 'WISEscore &amp; Sugar density claim',
        scope: 'product_vs_many', metrics: ['wisescore', 'sugar_density', 'upf', 'nutrient_overall'],
        userMsg: 'Compare WISEscore and sugar density against named competitors to validate a healthier-choice claim.',
        wiseaiReply: 'Comparing on <strong>WISEscore</strong> and <strong>Sugar Density</strong>. <strong>Brekky Mix</strong> holds the highest WISEscore and lowest sugar density in the set — enough to substantiate a healthier-choice claim against these competitors.' },

        scope: 'familia_alpen', metrics: ['wisescore', 'fiber_density', 'nutrient_overall', 'upf'],
        userMsg: 'Compare Familia vs Alpen on fiber density and overall value.',
        wiseaiReply: 'Here’s <strong>Familia Swiss Muesli</strong> against <strong>Alpen Original Muesli</strong> with <strong>Fiber Density</strong> front and centre. Familia leads on fiber and overall balance — a strong build for a DTC or retail value deck.' },
      { id: 'pvm_ingredients',  level: 'Product',   icon: 'account_tree', label: 'Ingredient flags · seed oils, emulsifiers',
        scope: 'product_vs_many', metrics: ['upf', 'ing_overall', 'seed_oils', 'emulsifiers', 'artificial_sweeteners'],
        userMsg: 'Compare specific ingredient flags — seed oils, emulsifiers, artificial sweeteners — across competitors.',
        wiseaiReply: 'Pulled the ingredient-level flags: <strong>Seed Oils of Concern</strong>, <strong>Emulsifiers of Concern</strong>, and <strong>Artificial Sweeteners</strong>. Each is scored as its own metric so you can back a specific label claim with evidence.' },
      { id: 'pfp_protein',      level: 'Portfolio', icon: 'business',    label: 'Amy’s Kitchen vs Annie’s · Protein',
        scope: 'portfolio_vs_portfolio', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall', 'protein_density'],
        userMsg: 'Compare the Amy’s Kitchen portfolio against Annie’s on Protein Quality.',
        wiseaiReply: 'Comparing the <strong>Amy’s Kitchen</strong> portfolio against <strong>Annie’s</strong>, with <strong>Protein Density</strong> in the set. Amy’s Kitchen leads on protein and clean label; Annie’s has the broader assortment. Filter to a single category to narrow the read.' },
      { id: 'pfp_category',     level: 'Portfolio', icon: 'show_chart',  label: 'Benchmark vs category average',
        scope: 'portfolio_vs_portfolio', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall'], showAvg: true, selfOnly: true,
        userMsg: 'Benchmark my portfolio against the category average — where are my biggest points of differentiation?',
        wiseaiReply: 'Benchmarking <strong>Amy’s Kitchen</strong> against the <strong>category average</strong> alone — no named competitor needed. The dotted line on each bar marks the category; the widest gaps are your biggest points of differentiation. Add a named competitor anytime.' },
      { id: 'pfm_retailer',     level: 'Portfolio', icon: 'store',       label: 'Rank brands across a shelf set',
        scope: 'portfolio_vs_many', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall'],
        userMsg: 'Evaluate multiple brand portfolios across the shelf set.',
        wiseaiReply: 'Here’s a retailer-style read across the shelf set. <strong>Amy’s Kitchen</strong> and <strong>Banza</strong> lead the composite; <strong>Chef Boyardee</strong> lags and carries no products in some categories. Filter to a category to see how each portfolio narrows.' },
      { id: 'pfm_takeaways',    level: 'Portfolio', icon: 'emoji_events', label: 'Auto takeaways · strongest &amp; cleanest',
        scope: 'portfolio_vs_many', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall', 'protein_density', 'clean_label'],
        userMsg: 'Auto-generate the takeaways — strongest portfolio, cleanest label — across these brands.',
        wiseaiReply: 'Generated the <strong>Key Takeaways</strong> automatically — Top Performer, Highest Protein, and Cleanest Label — so you don’t have to interpret raw scores across every metric and brand by hand.' },
      { id: 'cat_vs_cat',       level: 'Category',  icon: 'category',    label: 'Category vs Category · Granola vs Cereal',
        scope: 'category_vs_category', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall'],
        userMsg: 'Compare the Granola category average against the Cereal category.',
        wiseaiReply: 'Here’s the <strong>Granola</strong> category average head-to-head with <strong>Cereal</strong> — each column is the typical profile across every product WISEcode scored in that category. Use the per-column type toggle to swap either slot to a product or portfolio.' },
      { id: 'prod_vs_cat',      level: 'Category',  icon: 'insights',    label: 'Your product vs its category',
        scope: 'product_vs_product', metrics: ['upf', 'gras', 'ing_overall', 'nutrient_overall'], swapSlot: { index: 1, category: 'Dips & Sauces' },
        userMsg: 'Compare my product against its category average as a peer.',
        wiseaiReply: 'Now it’s <strong>Bitchin’ Sauce</strong> head-to-head with the <strong>Dips &amp; Sauces category</strong> as a ranked peer — not just an overlay line. Swap the category slot, add a competitor, or toggle either column’s type anytime.' },
    ];

    function cmpApplyScenario(s) {
      cmpSetScope(s.scope);
      if (s.metrics) compareState.metrics = s.metrics.slice();
      if (s.category) compareState.category = s.category;
      if (s.showAvg) compareState.showAvg = true;
      if (s.drill) compareState.drill = true;
      if (s.selfOnly) {
        const sc = CMP_SCOPES[s.scope];
        const prim = sc.entities.find(e => e.primary) || sc.entities[0];
        compareState.shown = [prim.id];
      }
      /* Drop a synthesised category into a specific slot (e.g. "your product
         vs its category" — the category as a ranked peer, not an overlay). */
      if (s.swapSlot) {
        const sc = CMP_SCOPES[s.scope];
        const clone = cmpCloneCategory(s.swapSlot.category);
        if (clone) {
          const catEnt = sc.entities.find(e => e.id === clone.id) || (sc.entities.push(clone), clone);
          const i = Math.min(s.swapSlot.index, compareState.shown.length - 1);
          if (i >= 0) compareState.shown[i] = catEnt.id;
        }
      }
      renderCompare();
      /* Don't re-offer follow actions the scenario already applied. */
      compareState.followDone = {};
      if (s.showAvg)  compareState.followDone.avg = true;
      if (s.drill)    compareState.followDone.drill = true;
      if (s.category) compareState.followDone.category = true;
    }

    function cmpOfferScopeChips() {
      const box = cmpChatBox();
      if (!box) return;
      const chipHtml = lvl => CMP_SCENARIOS.filter(s => s.level === lvl)
        .map(s => `<button type="button" class="chip" onclick="cmpChatScenario('${s.id}', this)"><span class="material-symbols-outlined">${s.icon}</span>${s.label}</button>`).join('');
      const wrap = document.createElement('div');
      wrap.id = 'cmp-scope-chips';
      wrap.innerHTML =
        '<div class="sc-reply-chips">' + chipHtml('Product') + '</div>' +
        '<div class="sc-reply-chips">' + chipHtml('Portfolio') + '</div>' +
        '<div class="sc-reply-chips">' + chipHtml('Category') + '</div>';
      cmpOfferChipRow(wrap);
    }

    function cmpChatScenario(id, btn) {
      const s = CMP_SCENARIOS.find(x => x.id === id);
      if (!s) return;
      document.getElementById('cmp-scope-chips')?.remove();
      btn?.closest('#cmp-scope-chips')?.remove();
      compareState.followDone = {};
      addUserMessage(s.userMsg);
      const typing = showWISEcodeAITyping('WISEcodeAI is assembling the comparison');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage(s.wiseaiReply);
        cmpApplyScenario(s);
        cmpOfferFollowChips();
      }, 680);
    }

    function cmpChatScope(key, btn) {
      const scope = CMP_SCOPES[key];
      if (!scope) return;
      document.getElementById('cmp-scope-chips')?.remove();
      btn?.closest('.sc-reply-chips')?.remove();
      compareState.followDone = {};
      addUserMessage(scope.userMsg);
      const typing = showWISEcodeAITyping('WISEcodeAI is assembling the comparison');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage(scope.wiseaiReply);
        cmpSetScope(key);
        cmpOfferFollowChips();
      }, 680);
    }

    /* ── Comparison TYPE switch (chat intent chip) ────────────────────────
       Flips the entire board between comparing products, portfolios, or
       categories. Offered from the initial follow-chip row on load. */
    function cmpPromptKind() {
      document.getElementById('cmp-kind-scope-chips')?.remove();
      addUserMessage('Change the comparison type');
      const typing = showWISEcodeAITyping();
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage('What do you want to compare — individual <strong>products</strong>, whole <strong>portfolios</strong>, or <strong>categories</strong>? I’ll rebuild the board for that type.', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const cur = CMP_SCOPES[compareState.scope];
        const curTab = (cur && (cur.tab || cur.key)) || '';
        const opts = [['product_vs_product', 'Product', 'inventory_2'], ['portfolio_vs_portfolio', 'Portfolio', 'business'], ['category_vs_category', 'Category', 'category']];
        const chips = opts.map(([k, l, ic]) => {
          const cls = k === curTab ? 'chip chip--match' : 'chip';
          return `<button type="button" class="${cls}" onclick="cmpChatKind('${k}', this)"><span class="material-symbols-outlined">${ic}</span>${l}</button>`;
        }).join('');
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-kind-scope-chips';
        row.innerHTML = chips;
        cmpOfferChipRow(row);
      }, 420);
    }

    function cmpChatKind(key, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-kind-scope-chips')?.remove();
      const scope = CMP_SCOPES[key];
      if (!scope) return;
      compareState.followDone = {};
      const noun = scope.noun;
      addUserMessage('Compare ' + (noun === 'category' ? 'categories' : noun + 's'));
      const typing = showWISEcodeAITyping('WISEcodeAI is rebuilding the board');
      setTimeout(() => {
        typing?.remove();
        cmpSetScope(key);
        /* Products / portfolios start with only YOUR food, consistent with the
           default board; category-vs-category has no "yours", so keep its pair. */
        const prim = scope.entities.find(e => e.primary);
        let reply;
        if (prim && noun !== 'category') {
          compareState.shown = [prim.id];
          renderCompare();
          scrollPanelIntoView('compare-panel');
          reply = 'Switched to a <strong>' + noun + '</strong> comparison, starting with <strong>your</strong> ' + noun + '. Add a competitor to build the head-to-head.';
        } else {
          reply = 'Switched to a <strong>category</strong> comparison — each column is the average profile across every product WISEcode scored in that category. Add or swap categories anytime.';
        }
        addWISEcodeAIMessage(reply, { source: false });
        cmpOfferFollowChips();
      }, 640);
    }

    /* Chat control surface — mirrors EVERY interactive control on the compare
       module (scope, add/remove entity, metric set, category filter, category
       average, ranking, ingredient drill-down, recalculate) as intent chips.
       Each chip is live and updates the board. No lead label: the chat is only
       ever the transcript plus intent chips. One row exists at a time and it
       always reflects the board's current state. */
    function cmpOfferFollowChips() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const box = cmpChatBox();
      if (!box) return;
      document.getElementById('cmp-follow-chips')?.remove();
      const chips = [];
      if (compareState.guidingStars) {
        /* Guiding Stars view — the chat surfaces ONLY the rating-specific
           conversational chips. Every board control (metrics, categories,
           chart types, add/remove) lives on the board toolbar, so nothing
           else is echoed into the chat here. */
        chips.push(`<button type="button" class="chip chip-primary chip-gs is-on" onclick="cmpFollow('gs', this)"><span class="material-symbols-outlined">star</span>Guiding Stars · On</button>`);
        chips.push(`<button type="button" class="chip" onclick="cmpFollow('gs_explain', this)"><span class="material-symbols-outlined">help_outline</span>How are stars scored?</button>`);
        chips.push(`<button type="button" class="chip" onclick="cmpFollow('gs_dq', this)"><span class="material-symbols-outlined">gpp_maybe</span>Why disqualified?</button>`);
      } else {
        /* Default WISEcode view — the standard "things to do" action chips. */
        if (compareState.stale && !compareState.recalcing)
          chips.push(`<button type="button" class="chip chip-primary" onclick="cmpRecalculate(this)"><span class="material-symbols-outlined">calculate</span>Recalculate</button>`);
        /* Adding an entity is the primary next step. The comparison is LOCKED to
           its own kind, so there's just one Add chip — of the same kind the board
           started as. No cross-type mixing. */
        if (compareState.shown.length < 5) {
          const lk = cmpLockedKind();
          chips.push(`<button type="button" class="chip" onclick="cmpPromptAddKind('${lk}', this)"><span class="material-symbols-outlined">${cmpKindIcon(lk)}</span>Add a ${cmpKindLabel(lk)}</button>`);
        }
        if (compareState.shown.length > 2)
          chips.push(`<button type="button" class="chip" onclick="cmpFollow('remove', this)"><span class="material-symbols-outlined">remove_circle</span>Remove an item</button>`);
        chips.push(`<button type="button" class="chip" onclick="cmpFollow('metrics', this)"><span class="material-symbols-outlined">tune</span>Metrics · ${compareState.metrics.length}</button>`);
        if (scope.categories) {
          const cur = compareState.category === 'all' ? 'All' : compareState.category;
          chips.push(`<button type="button" class="chip" onclick="cmpFollow('category', this)"><span class="material-symbols-outlined">filter_alt</span>Category · ${cur}</button>`);
        }
        chips.push(`<button type="button" class="chip" onclick="cmpFollow('avg', this)"><span class="material-symbols-outlined">show_chart</span>Category avg · ${compareState.showAvg ? 'On' : 'Off'}</button>`);
        if (scope.many)
          chips.push(`<button type="button" class="chip" onclick="cmpFollow('rank', this)"><span class="material-symbols-outlined">leaderboard</span>Rank them</button>`);
        chips.push(`<button type="button" class="chip chip-gs" onclick="cmpFollow('gs', this)"><span class="material-symbols-outlined">star</span>Guiding Stars · Off</button>`);
        chips.push(`<button type="button" class="chip" onclick="cmpFollow('switch', this)"><span class="material-symbols-outlined">swap_horiz</span>Change comparison</button>`);
      }
      const row = document.createElement('div');
      row.className = 'sc-reply-chips';
      row.id = 'cmp-follow-chips';
      row.innerHTML = chips.join('');
      cmpOfferChipRow(row);
    }

    function cmpFollow(action, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const delay = 560;

      if (action === 'add')      { cmpPromptAddEntity();    return; }
      if (action === 'remove')   { cmpPromptRemoveEntity(); return; }
      if (action === 'metrics')  { cmpPromptMetrics();      return; }
      if (action === 'category') { cmpPromptCategory();     return; }
      if (action === 'kind')     { cmpPromptKind();         return; }

      if (action === 'gs') {
        const on = !compareState.guidingStars;
        addUserMessage(on ? 'Show me the Guiding Stars ratings.' : 'Back to the WISEcode comparison.');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          cmpToggleGuidingStars(on); scrollPanelIntoView('compare-panel');
          addWISEcodeAIMessage(on
            ? 'Switched the board to the <strong>Guiding Stars</strong> rating. Each product earns <strong>debit points</strong> for saturated fat, sugar, sodium, trans fat and additives, and <strong>credit points</strong> for fiber, vitamins/minerals and whole grain — netted into a <strong>0–3 star</strong> rating. Products with a heavy additive load or high processing are <em>disqualified</em>.'
            : 'Back to the <strong>WISEcode</strong> comparison — the 0–100 metric bars and charts. Flip <strong>Guiding Stars</strong> on anytime to see the star ratings.', { source: false });
          cmpOfferFollowChips();
        }, delay);
        return;
      }
      if (action === 'gs_explain') {
        addUserMessage('How are the Guiding Stars scored?');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          addWISEcodeAIMessage('Guiding Stars sums <strong>debit points</strong> (saturated fat, added sugar, sodium, trans fat, and cosmetic/non-GRAS additives — all measured per 100 kcal) against <strong>credit points</strong> (fiber, vitamins &amp; minerals, and whole grain). The net score maps to <strong>1★</strong> (good), <strong>2★</strong> (better) or <strong>3★</strong> (best); a product that clears none, or trips a disqualifier, shows <strong>0★</strong>.', { source: false });
          cmpOfferFollowChips();
        }, delay);
        return;
      }
      if (action === 'gs_dq') {
        addUserMessage('Why is a product disqualified?');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          const dq = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e)).filter(e => !e.na).filter(e => cmpGuidingStarsData(e).disqualified);
          const names = dq.map(e => '<strong>' + e.name + '</strong>').join(', ');
          addWISEcodeAIMessage((dq.length
            ? names + (dq.length > 1 ? ' are' : ' is') + ' <strong>disqualified</strong> — a heavy additive load or a high level of processing keeps a product out of the star system entirely, so it can only score <strong>0★</strong> regardless of its debit/credit tally.'
            : 'Nothing on the board is currently disqualified — every product clears the additive and processing gates, so each one earns its stars from the debit/credit tally.'), { source: false });
          cmpOfferFollowChips();
        }, delay);
        return;
      }

      if (action === 'avg') {
        const on = !compareState.showAvg;
        addUserMessage(on ? 'Show the category average.' : 'Hide the category average.');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          compareState.showAvg = on; renderCompare(); scrollPanelIntoView('compare-panel');
          addWISEcodeAIMessage(on
            ? 'Turned on the <strong>category average</strong> — the dotted line on each metric bar marks where the category sits, so every gap reads at a glance. It works even with no named competitor selected.'
            : 'Hid the <strong>category average</strong> benchmark line.', { source: false });
          cmpOfferFollowChips();
        }, delay);
        return;
      }
      if (action === 'rank') {
        addUserMessage('Rank the shelf set for me.');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          const live = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e)).filter(e => !e.na).sort((a, b) => cmpScoreFor(b, 'wisescore') - cmpScoreFor(a, 'wisescore'));
          addWISEcodeAIMessage('Ranked by composite WISEscore: ' + live.map((e, i) => (i + 1) + '. <strong>' + e.name + '</strong> (' + Math.round(cmpScoreFor(e, 'wisescore')) + ')').join(' · ') + '.', { source: false });
          cmpOfferFollowChips();
        }, delay);
        return;
      }
      if (action === 'switch') {
        addUserMessage('Let me try a different comparison.');
        const typing = showWISEcodeAITyping();
        setTimeout(() => {
          typing?.remove();
          addWISEcodeAIMessage('Sure — pick another comparison below and I’ll rebuild the board.', { source: false });
          cmpOfferScopeChips();
        }, delay);
        return;
      }
    }

    /* Remove a competitor from the chat (mirrors the board's × control). */
    function cmpPromptRemoveEntity() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      document.getElementById('cmp-remove-chips')?.remove();
      const removable = cmpEntitiesShown().filter(e => !e.primary);
      if (compareState.shown.length <= 2 || !removable.length) {
        addWISEcodeAIMessage('There’s nothing to drop — a comparison needs at least the primary ' + scope.noun + ' and one competitor.', { source: false });
        cmpOfferFollowChips();
        return;
      }
      addUserMessage('Remove a ' + scope.noun + ' from the comparison');
      const typing = showWISEcodeAITyping('WISEcodeAI is listing what you can remove');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage('Which ' + scope.noun + ' should I drop from the board?', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const chips = removable.map(e =>
          `<button type="button" class="chip" onclick="cmpConfirmRemoveEntity('${e.id}', this)"><span class="material-symbols-outlined">remove_circle</span>${e.name}</button>`
        ).join('');
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-remove-chips';
        row.innerHTML = chips;
        cmpOfferChipRow(row);
      }, 500);
    }
    function cmpConfirmRemoveEntity(id, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-remove-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      const ent = scope && scope.entities.find(e => e.id === id);
      if (!ent) return;
      addUserMessage('Remove ' + ent.name);
      const typing = showWISEcodeAITyping('Removing ' + ent.name + ' from the board');
      setTimeout(() => {
        typing?.remove();
        cmpRemoveEntity(id);
        scrollPanelIntoView('compare-panel');
        addWISEcodeAIMessage('Removed <strong>' + ent.name + '</strong> from the comparison and re-ranked the remaining ' + scope.noun + 's.', { source: false });
        cmpOfferFollowChips();
      }, 500);
    }

    /* Choose the metric set from the chat (mirrors the board's Metrics menu).
       Every metric is a live toggle chip; the board updates on each tap. */
    function cmpPromptMetrics() {
      document.getElementById('cmp-metric-chips')?.remove();
      addUserMessage('Choose which metrics to compare');
      const typing = showWISEcodeAITyping('WISEcodeAI is loading the metric set');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage('Toggle any metric on or off and the board updates live. Tap <strong>Done</strong> when the set looks right.', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-metric-chips';
        cmpRenderMetricChips(row);        /* populate the toggle chips (row still detached)… */
        cmpOfferChipRow(row);             /* …then land + fly them in behind the answer. */
      }, 500);
    }
    function cmpRenderMetricChips(rowEl) {
      const row = rowEl || document.getElementById('cmp-metric-chips');
      if (!row) return;
      const chips = CMP_METRICS.filter(m => !m.future && m.id !== 'wisescore').map(m => {
        const on = compareState.metrics.includes(m.id);
        return `<button type="button" class="chip ${on ? 'chip-primary' : ''}" onclick="cmpToggleMetricChat('${m.id}')"><span class="material-symbols-outlined">${on ? 'check' : 'add'}</span>${cmpMetricShort(m)}</button>`;
      }).join('');
      row.innerHTML = chips + `<button type="button" class="chip chip-primary" onclick="cmpMetricsDone(this)"><span class="material-symbols-outlined">check</span>Done</button>`;
    }
    function cmpToggleMetricChat(id) {
      cmpToggleMetric(id);       /* toggles + re-renders the board */
      cmpRenderMetricChips();    /* reflect the new on/off state in the chips */
      scrollPanelIntoView('compare-panel');
    }
    function cmpMetricsDone(btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-metric-chips')?.remove();
      const names = compareState.metrics.map(id => cmpMetricShort(CMP_METRIC_BY_ID[id])).filter(Boolean).join(', ');
      addWISEcodeAIMessage('Metric set updated — now comparing on <strong>' + names + '</strong>.', { source: false });
      cmpOfferFollowChips();
    }

    /* Filter by category from the chat (mirrors the board's category select). */
    function cmpPromptCategory() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope || !scope.categories) return;
      document.getElementById('cmp-cat-chips')?.remove();
      addUserMessage('Filter the comparison by category');
      const typing = showWISEcodeAITyping('WISEcodeAI is pulling the category filters');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage('Pick a category to narrow every portfolio to it — or choose <strong>All Categories</strong> for the full assortment.', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const chips = scope.categories.map(c => {
          const on = compareState.category === c;
          const label = c === 'all' ? 'All Categories' : c;
          return `<button type="button" class="chip ${on ? 'chip-primary' : ''}" onclick="cmpChooseCategory('${c}', this)"><span class="material-symbols-outlined">${on ? 'check' : 'filter_alt'}</span>${label}</button>`;
        }).join('');
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-cat-chips';
        row.innerHTML = chips;
        cmpOfferChipRow(row);
      }, 500);
    }
    function cmpChooseCategory(cat, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-cat-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const label = cat === 'all' ? 'all categories' : cat;
      addUserMessage(cat === 'all' ? 'Show all categories' : 'Filter to ' + cat);

        typing?.remove();
        compareState.category = cat; renderCompare(); scrollPanelIntoView('compare-panel');
        const zero = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e)).find(e => e.na);
        addWISEcodeAIMessage('Filtered to <strong>' + label + '</strong> — counts and scores narrowed accordingly.' + (cat !== 'all' && zero ? ' <strong>' + zero.name + '</strong> has no products here, so it reads <em>N/A</em> rather than a plotted zero.' : ''), { source: false });

    /* "Learn more" pod on each metric in the board rail — routes straight into
       the chat and has WISEcodeAI explain that metric in depth, then leaves the
       comparison controls in place so the flow never dead-ends. */
    function cmpExplainMetric(id) {
      const m = CMP_METRIC_BY_ID[id];
      if (!m) return;
      const label = cmpMetricShort(m);
      document.getElementById('cmp-follow-chips')?.remove();

      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage(cmpMetricLong(id), { source: false, feedback: true });
        if (compareState.scope) cmpOfferFollowChips();
      }, 640);

      calories: '<strong>Calories</strong> per serving — context for the nutrient values, which are all judged per 100 kcal so small and large servings compare fairly.',
    };

    /* Continue the conversation about a Guiding Stars line item (optionally for
       one specific product on the board), mirroring cmpExplainMetric. */
    function cmpExplainGs(key, entId) {
      const r = CMP_GS_ROWS.find(x => x.key === key);
      if (!r) return;
      const scope = CMP_SCOPES[compareState.scope];
      document.getElementById('cmp-follow-chips')?.remove();
      let ent = null;
      if (entId && scope) ent = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e)).find(e => e.id === entId) || null;
      addUserMessage(ent
        ? 'Tell me about ' + ent.name + '’s ' + r.label + ' in Guiding Stars.'
        : 'Tell me more about ' + r.label + ' in Guiding Stars.');
      const typing = showWISEcodeAITyping('WISEcodeAI is pulling the ' + r.label + ' detail');
      setTimeout(() => {
        typing?.remove();
        let msg = CMP_GS_LONG[key] || r.desc;
        if (ent && !ent.na) {
          const gsd = cmpGuidingStarsData(ent);
          const raw = r.get(gsd);
          let read;
          if (r.type === 'flag') read = raw ? 'is <strong>disqualified</strong>' : 'is <strong>not disqualified</strong>';
          else if (r.type === 'text') read = 'uses the <strong>' + raw + '</strong> algorithm';
          else if (r.type === 'point') read = 'scores <strong>' + (raw == null ? '—' : (raw > 0 ? '+' + raw : raw)) + '</strong> here';
          else read = 'comes in at <strong>' + raw + (r.unit ? ' ' + r.unit : '') + '</strong>';
          msg += '<br><br>For <strong>' + ent.name + '</strong>: it ' + read + ' (overall ' + gsd.stars + '★, score ' + (gsd.score > 0 ? '+' : '') + gsd.score + ').';
        }
        addWISEcodeAIMessage(msg, { source: false, feedback: true });
        if (compareState.scope) cmpOfferFollowChips();
      }, 640);
    }

    /* Key-takeaway metadata + AI "why" copy, shared by the board cards and the
       chat handler so both read identically. */
    const CMP_TAKEAWAY_META = {
      perf:    { metric: 'wisescore',         topic: 'top performer',          ic: 'emoji_events',      lbl: 'Top Performer',     subLabel: 'WISEscore' },
      prot:    { metric: 'protein_density',   topic: 'highest protein',        ic: 'fitness_center',    lbl: 'Highest Protein',   subLabel: 'Protein density' },
      clean:   { metric: 'clean_label',       topic: 'cleanest label',         ic: 'spa',               lbl: 'Cleanest Label',    subLabel: 'Clean label' },
      val:     { metric: 'cost_value',        topic: 'best value',             ic: 'savings',           lbl: 'Best Value',        subLabel: 'Value' },
      fiber:   { metric: 'fiber_density',     topic: 'most fiber',             ic: 'grass',             lbl: 'Most Fiber',        subLabel: 'Fiber density' },
      lowupf:  { metric: 'upf',               topic: 'least processed',        ic: 'blender',           lbl: 'Least Processed',   subLabel: 'UPF score' },
      gras:    { metric: 'gras',              topic: 'safest additives',       ic: 'health_and_safety', lbl: 'Safest Additives',  subLabel: 'GRAS score' },
      gut:     { metric: 'gut_health',        topic: 'best for gut health',    ic: 'clean_hands',       lbl: 'Best Gut Health',   subLabel: 'Gut health' },
      heart:   { metric: 'heart_healthy',     topic: 'most heart-healthy',     ic: 'favorite',          lbl: 'Heart Healthy',     subLabel: 'Heart health' },
      antiinf: { metric: 'anti_inflammatory', topic: 'most anti-inflammatory', ic: 'healing',           lbl: 'Anti-Inflammatory', subLabel: 'Anti-inflammatory' },
      lowsugar:{ metric: 'sugar_density',     topic: 'lowest sugar',           ic: 'icecream',          lbl: 'Lowest Sugar',      subLabel: 'Sugar density' },
    };
    /* ── Overall board insight ─────────────────────────────────────────────
       The single "what's happening here" read that sits beside the Insight
       rail. It is recomputed from scratch on every renderCompare(), so it
       automatically re-writes itself whenever a product/portfolio/category is
       added, removed, swapped, re-scored, filtered by category, or when the
       metric set changes — no cached copy to fall stale. */
    function cmpOverallInsight(scope, metrics, ordered, pendingSet) {
      const live = ordered.filter(e => !e.na && !pendingSet.has(e.id));
      const pendingCount = ordered.filter(e => pendingSet.has(e.id)).length;
      const noun = scope.noun === 'portfolio' ? 'portfolio' : (scope.noun === 'category' ? 'category' : 'product');
      const nounPl = noun === 'category' ? 'categories' : noun + 's';
      const catFilter = (compareState.category && compareState.category !== 'all') ? compareState.category : null;
      const catBit = catFilter ? ' in ' + catFilter : '';
      const pendBit = pendingCount
        ? ' ' + pendingCount + ' pending ' + (pendingCount > 1 ? nounPl : noun) + ' — recalculate to fold ' + (pendingCount > 1 ? 'them' : 'it') + ' in.'
        : '';

      if (!live.length) return 'Add ' + nounPl + ' to the board and WISEcodeAI will summarize how they stack up here.' + pendBit;

      const byScore = live.slice().sort((a, b) => cmpScoreFor(b, 'wisescore') - cmpScoreFor(a, 'wisescore'));
      const leader = byScore[0];
      const leadScore = Math.round(cmpScoreFor(leader, 'wisescore'));

      const primary = live.find(e => e.primary);
      const youRankBit = (rank) => primary
        ? (primary.id === leader.id ? ' Your ' + noun + ' leads the set.' : ' Your ' + noun + ' sits #' + rank + ' of ' + live.length + '.')
        : '';

      if (live.length === 1) {
        const only = leader.name + ' scores ' + leadScore + ' overall' + catBit + ' — add another ' + noun + ' to see how it stacks up.';
        return only + pendBit;
      }

      /* The leader's single biggest edge vs the rest of the field. */
      let edge = null, edgeGap = -Infinity;
      const others = live.filter(e => e.id !== leader.id);
      metrics.forEach(m => {
        const avgOther = others.reduce((s, e) => s + cmpScoreFor(e, m.id), 0) / others.length;
        const gap = cmpScoreFor(leader, m.id) - avgOther;
        if (gap > edgeGap) { edgeGap = gap; edge = m; }
      });
      const edgeBit = (edge && edgeGap >= 4) ? ', led by its ' + cmpMetricShort(edge).toLowerCase() : '';

      const gap = leadScore - Math.round(cmpScoreFor(byScore[byScore.length - 1], 'wisescore'));
      const spread = gap >= 20 ? 'a wide ' + gap + '-point spread'
        : (gap >= 8 ? 'a ' + gap + '-point spread' : 'a tight ' + gap + '-point spread');

      const rank = byScore.findIndex(e => e.id === (primary ? primary.id : leader.id)) + 1;
      return leader.name + ' tops ' + live.length + ' ' + nounPl + catBit + ' at ' + leadScore
        + edgeBit + ', with ' + spread + ' across the board.' + youRankBit(rank) + pendBit;
    }

    function cmpTakeawayWhy(key, ent, score) {
      switch (key) {
        case 'perf':  return `Strong nutrient density and a clean ingredient panel outweigh its processing level.`;
        case 'prot':  return `Genuinely protein-forward from real sources, not propped up by isolates just to earn a label claim.`;
        case 'clean': return `The fewest artificial colors, flavors, sweeteners and preservatives across the compared products.`;
        case 'val':   return `Top-tier composite quality at the lowest cost per serving in the set.`;
        case 'fiber': return `The highest fiber density in the set, from whole-food sources rather than added isolates.`;
        case 'lowupf':return `The lowest ultra-processing footprint across the compared products.`;
        case 'gras':  return `The strongest GRAS standing, with the fewest ingredients of concern in the set.`;
        case 'gut':   return `The most fiber- and ferment-friendly profile, with the fewest emulsifiers of concern.`;
        case 'heart': return `The best fat quality and sodium balance, with no seed oils of concern.`;
        case 'antiinf':return `The highest score on inflammation-lowering nutrients and the cleanest additive panel.`;
        case 'lowsugar':return `The least added sugar per serving across the compared products.`;
        default:
          const m = CMP_TAKEAWAY_META[key];
          const lbl = m ? m.subLabel.toLowerCase() : 'this measure';
          return `The strongest result in the compared set on ${lbl}.`;
      }
    }

    /* ── Swap a takeaway card ─────────────────────────────────────────────
       Each of the four cards can be re-pointed at any takeaway that isn't
       already on the board. The swap glyph (right of the card title) opens a
       compact menu of the remaining takeaways; picking one re-renders that
       slot. If the chosen takeaway already lives in another card, the two
       cards trade places so the board never shows a duplicate. */
    function cmpToggleTakeawayMenu(ev, slotIdx) {
      ev.stopPropagation();
      const btn = ev.currentTarget;
      const wrap = btn.closest('.cmp-takeaway-swap-wrap');
      if (!wrap) return;
      /* The menu is portaled to <body>, so track open state on the button
         itself rather than looking for the menu inside the wrap. */
      const alreadyOpen = btn.getAttribute('aria-expanded') === 'true';
      cmpCloseTakeawayMenus();
      if (alreadyOpen) return;

      const slots = compareState.takeawaySlots || ['perf', 'prot', 'clean', 'val'];
      const currentKey = slots[slotIdx];
      const used = new Set(slots);
      const opts = Object.keys(CMP_TAKEAWAY_META).filter(k => k === currentKey || !used.has(k));

      const menu = document.createElement('div');
      menu.className = 'cmp-takeaway-menu';
      menu.setAttribute('role', 'menu');
      menu.innerHTML =
        '<div class="cmp-takeaway-menu-title">Show in this card</div>' +
        opts.map(k => {
          const m = CMP_TAKEAWAY_META[k];
          const isCur = k === currentKey;
          return `<button type="button" role="menuitemradio" aria-checked="${isCur}" class="cmp-takeaway-menu-item${isCur ? ' is-active' : ''}" onclick="cmpSetTakeawaySlot(event, ${slotIdx}, '${k}')">` +
            `<span class="cmp-takeaway-menu-ic material-symbols-outlined">${m.ic}</span>` +
            `<span class="cmp-takeaway-menu-lbl">${m.lbl}</span>` +
            (isCur ? '<span class="cmp-takeaway-menu-check material-symbols-outlined">check</span>' : '') +
          '</button>';
        }).join('');

      /* Append to <body> so the popover escapes the card + the scroll/contain
         context of #cmp-body — a fixed element inside a `contain: layout`
         container would otherwise be trapped and clipped. */
      document.body.appendChild(menu);
      btn.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => cmpPositionTakeawayMenu(menu, btn));
    }
    /* Place the swap popover in the viewport relative to its button: opens
       upward and right-aligned by default, but flips down / re-clamps whenever
       that edge of the screen is short on room. */
    function cmpPositionTakeawayMenu(menu, btn) {
      if (!menu.isConnected || !btn.isConnected) return;
      const gap = 6, margin = 8;
      const b = btn.getBoundingClientRect();
      const mw = menu.offsetWidth, mh = menu.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;

      /* Vertical — prefer opening ABOVE the button; only drop below when there
         isn't room above and there's more room below. */
      const roomAbove = b.top - margin;
      const roomBelow = vh - b.bottom - margin;
      let top = (roomAbove >= mh + gap || roomAbove >= roomBelow)
        ? b.top - gap - mh
        : b.bottom + gap;
      top = Math.max(margin, Math.min(top, vh - mh - margin));

      /* Horizontal — align the menu's right edge to the button (sits up-and-to
         the-right), then clamp so it never runs off either screen edge. */
      let left = b.right - mw;
      if (left < margin) left = b.left;
      left = Math.max(margin, Math.min(left, vw - mw - margin));

      menu.style.top = top + 'px';
      menu.style.left = left + 'px';
    }
    function cmpCloseTakeawayMenus() {
      document.querySelectorAll('.cmp-takeaway-menu').forEach(m => m.remove());
      document.querySelectorAll('.cmp-takeaway-swap[aria-expanded="true"]')
        .forEach(b => b.setAttribute('aria-expanded', 'false'));
    }
    function cmpSetTakeawaySlot(ev, slotIdx, key) {
      ev.stopPropagation();
      cmpCloseTakeawayMenus();
      const slots = (compareState.takeawaySlots || ['perf', 'prot', 'clean', 'val']).slice();
      if (slots[slotIdx] === key) return;
      const dupIdx = slots.indexOf(key);            /* if it's already shown elsewhere, trade places */
      if (dupIdx !== -1) slots[dupIdx] = slots[slotIdx];
      slots[slotIdx] = key;
      compareState.takeawaySlots = slots;
      renderCompare();
    }
    /* Dismiss any open takeaway swap menu when clicking outside of it. The
       menu is portaled to <body>, so treat clicks inside it as "inside" too. */
    document.addEventListener('click', function (e) {
      if (!document.querySelector('.cmp-takeaway-menu')) return;
      if (!e.target.closest('.cmp-takeaway-swap-wrap') && !e.target.closest('.cmp-takeaway-menu')) cmpCloseTakeawayMenus();
    });
    /* The popover is viewport-anchored, so close it if the page scrolls or
       resizes rather than letting it drift away from its button. */
    window.addEventListener('scroll', cmpCloseTakeawayMenus, true);
    window.addEventListener('resize', cmpCloseTakeawayMenus);

    /* Continue the conversation about a takeaway card — opened from the chat
       glyph beneath the AI "why" insight. */
    function cmpChatTakeaway(entId, key) {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const base = scope.entities.find(e => e.id === entId);
      const meta = CMP_TAKEAWAY_META[key];
      if (!base || !meta) return;
      const ent = cmpResolveEntity(scope, base);
      const score = Math.round(cmpScoreFor(ent, meta.metric));
      document.getElementById('cmp-follow-chips')?.remove();
      addUserMessage('Why is ' + ent.name + ' the ' + meta.topic + '?');
      const typing = showWISEcodeAITyping('WISEcodeAI is breaking down ' + ent.name);
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage(cmpTakeawayWhy(key, ent, score) +
          ' Want me to show the ingredients behind it, compare it against another product, or flag where it still has room to improve?', { source: false, feedback: true });
        if (compareState.scope) cmpOfferFollowChips();
      }, 640);
    }

    /* Continue the conversation about the WHOLE board — opened from the chat
       glyph beside the overall Insight read in the rail. */
    function cmpChatOverall() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const ents = cmpEntitiesShown().map(e => cmpResolveEntity(scope, e));
      const pendingSet = new Set(compareState.pending || []);
      const metrics = compareState.metrics.map(id => CMP_METRIC_BY_ID[id]).filter(Boolean);
      const ordered = ents;
      document.getElementById('cmp-follow-chips')?.remove();
      addUserMessage('What’s the overall read on this comparison?');
      const typing = showWISEcodeAITyping('WISEcodeAI is summarizing the board');
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage(cmpOverallInsight(scope, metrics, ordered, pendingSet) +
          ' Want me to break down what’s driving the leader, swap in another ' + (scope.noun || 'product') + ', or focus on a specific metric?', { source: false, feedback: true });
        if (compareState.scope) cmpOfferFollowChips();
      }, 640);
    }

    /* Continue the conversation about one product's generated insight — opened
       from the chat glyph inline with each Insight cell on the board. */
    function cmpChatInsight(entId) {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const base = scope.entities.find(e => e.id === entId);
      if (!base) return;
      const ent = cmpResolveEntity(scope, base);
      document.getElementById('cmp-follow-chips')?.remove();
      addUserMessage('Let’s talk about ' + ent.name + '.');
      const typing = showWISEcodeAITyping('WISEcodeAI is pulling up ' + ent.name);
      setTimeout(() => {
        typing?.remove();
        const lead = ent.insight ? ' ' + ent.insight : '';
        addWISEcodeAIMessage('Happy to dig into <strong>' + ent.name + '</strong>.' + lead +
          ' Want me to break down the ingredients driving this, compare it on a specific metric, or flag where it could improve?', { source: false, feedback: true });
        if (compareState.scope) cmpOfferFollowChips();
      }, 640);
    }
  </script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/responsive-tables.js"></script>
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
