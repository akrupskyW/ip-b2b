<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISEcodeAI — Ask your verified food data anything</title>
  <script src="../js/text-size-fouc.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* ═══════════ WISEcodeAI — page-specific shell ═══════════
       Reuses the shared WISE palette + chat classes (wise.css Section 2). Everything
       bespoke here is prefixed wa-. The shell mirrors reformulation.html / studio-ai.html:
       a fixed-width WISEcodeAI chat card on the left, and up to two RESULT panes that open
       on the right as the conversation surfaces data — one for Results & Details (food
       results, food-detail cards, reports) and one for Visuals (charts, graphs, trends).
       Each result pane carries its own three-dot menu + width control. */

    :root {
      --sec-green-10: rgba(50, 169, 102, 0.12);
      --sec-red-10: rgba(220, 48, 56, 0.12);
      --ter-amber-10: rgba(255, 196, 52, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--modules-bottom-pad, 12px);
      font-family: 'WISE Digits', 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #chat-shell-wrap { flex: 1 1 0%; min-height: 0; width: 100%; overflow: visible; }
    #chat-shell-wrap.menu-brand-integrated #modules-row {
      grid-area: modules;
      display: flex;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      /* Scroll horizontally whenever the modules (chat + broken-out History /
         Turns + result panes) total wider than the row, so nothing is stranded
         off-screen with no way to reach it. overflow-y is hidden (not visible)
         because a single overflow axis can't stay `visible` alongside a
         scrolling one; a little vertical padding gives the card shadows room so
         they aren't cut hard at the box edge. */
      overflow-x: auto;
      overflow-y: hidden;
      /* Match the nav module's height exactly. The shared shell adds
         margin-top:8px to the modules row and we used to inset it another 4px
         top/bottom — together that made the middle chat card read ~16px shorter
         than the nav (and, in sticky mode, visibly off). Zero both so the chat
         (and every module) spans the same top-to-bottom band as the nav. */
      margin-top: 0;
      /* overflow-x:auto (needed for horizontal scroll when panes break out)
         forces overflow-y to compute as non-visible, so overflow-y:hidden
         clips the module cards' drop-shadow flush at the row's bottom edge —
         leaving the body's 12px bottom inset as bare empty space. Fix it the
         same way product-portfolio does: keep a bottom SHADOW GUTTER inside the
         row (padding-bottom) so the shadow renders into padding the clip box
         still shows, then pull the row back down by the same amount (negative
         margin) so the panes still fill the nav column's full height. */
      padding: 0 2px;
    }

    /* ── Nav brand strip height (chat-shell), matches every other WISE page ── */
    #chat-shell-wrap #menu-panel:not(.mp-pivot) .menu-brand-bar { min-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-bar { height: var(--panel-header-h); min-height: var(--panel-header-h); max-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo,
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo a { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Drop the owl lower than the shared 7px nudge so it lines up horizontally
       with the headlines of the modules to the right (their heads pad the title
       ~18px from the top, so the centered logo otherwise reads too high). */
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo svg.tl-bug { transform: translateY(16px); }

    /* ── Center chat column (the ONE shared WISEcodeAI chat, carded) ──
       Default: the chat fills the whole modules row (full-screen, single pane).
       Once a result pane opens, it collapses to a fixed-width side column so the
       layout reads as a double pane. */
    .wa-chat {
      position: relative;
      flex: 1 1 auto;
      width: auto;
      /* Floor so the chat never collapses to nothing when several fixed-width
         modules (broken-out History / Turns + result panes) push the row past
         the viewport — instead the row scrolls horizontally and the chat keeps
         a usable width. When modules close, its flex-grow refills the space. */
      min-width: 380px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transform-origin: left center;
      /* `backwards` (not `both`): hold the start frame during the delay, but DON'T
         retain the end frame's transform afterwards. A lingering `transform` would
         make the card a containing block for position:fixed AND (with overflow:hidden)
         clip any floated three-dot popover inside the chat — which no z-index escapes.
         The end frame is visually identical to no transform, so reverting is seamless. */
      animation: panelBounceLeft 0.56s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s backwards;
    }
    /* When any result pane is open, dock the chat to a fixed-width column. */
    #modules-row:has(.wa-pane.is-open) .wa-chat {
      flex: 0 0 var(--chat-pane-w, 380px);
      width: var(--chat-pane-w, 380px);
    }
    /* Chat width toggle — the canonical app-wide tiers (single 380 / double 580 /
       triple 760; the fourth "fill" tier grows via the shared .panel-fill rule).
       Only meaningful while a pane is open and the chat is docked. */
    #modules-row:has(.wa-pane.is-open) .wa-chat.panel-wide { flex-basis: 580px; width: 580px; }
    #modules-row:has(.wa-pane.is-open) .wa-chat.panel-triple { flex-basis: 760px; width: 760px; }
    /* Output-pane width control. When a SINGLE output pane is open it is the only
       flexible element in the row, so cycling its flex-grow tier alone can't make
       it visibly wider — it already fills the leftover space. Widening the lone
       pane therefore narrows the docked chat column instead, which is the only
       physically meaningful way to give the pane more room. Higher specificity +
       !important beats the chat's own single/double/triple width rules above. */
    #modules-row[data-out-w="1"]:has(.wa-pane.is-open) .wa-chat { flex-basis: 480px !important; width: 480px !important; }
    #modules-row[data-out-w="2"]:has(.wa-pane.is-open) .wa-chat { flex-basis: 400px !important; width: 400px !important; }
    #modules-row[data-out-w="3"]:has(.wa-pane.is-open) .wa-chat { flex-basis: 340px !important; width: 340px !important; }

    /* ── Full-screen → single-pane collapse ────────────────────────────────
       The welcome chat fills the modules row. The first time a result pane
       opens, the chat eases down to its single-column width while the pane
       grows into the freed space. Pixel flex-basis is interpolable; `flex: auto`
       → `380px` is not, so JS pins both ends and this class runs the tween.
       Competing bounce/slide keyframes are paused so width is the only motion. */
    #modules-row.is-dock-animating {
      overflow-x: hidden;
    }
    #modules-row.is-dock-animating .wa-chat,
    #modules-row.is-dock-animating .wa-pane.is-open {
      transition:
        flex-basis 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        min-width 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 0.58s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #modules-row.is-dock-animating .wa-pane.is-open,
    #modules-row.is-dock-animating .wa-pane.is-open.is-sticky {
      animation: none !important;
    }
    #modules-row.is-dock-animating .wa-pane.is-open.is-dock-opening {
      min-width: 0 !important;
      overflow: hidden;
    }
    /* After the collapse finishes we drop `is-dock-animating`, which would
       otherwise re-apply panelBounceRight / stickySlideRight and jerk the
       pane. Mark it settled so those entrance keyframes stay off. */
    #modules-row .wa-pane.is-open.is-dock-settled,
    #modules-row .wa-pane.is-open.is-sticky.is-dock-settled {
      animation: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      #modules-row.is-dock-animating .wa-chat,
      #modules-row.is-dock-animating .wa-pane.is-open {
        transition: none !important;
      }
    }

    /* ── Activity strip ──────────────────────────────────────────────
       The thin landmark rail on the chat's edge is fully self-contained in
       js/chat-activity-strip.js now — it injects its own styles and is mounted
       by the shared chat module (js/wiseai-chat.js), so no per-page CSS or
       wiring lives here anymore. Toggled from the chat's three-dot menu
       ("Activity strip") and the Appearance popover, which also picks the edge. */

    /* Small in-chat lead + intent-chip helpers reused from studio-ai (kept so the
       shared chat's inline chips read the same as everywhere else in the app). */
    .sc-reply-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 4px 42px; }
    .sc-reply-chips .chip { text-align: left; max-width: 100%; }
    @media (max-width: 720px) { .sc-reply-chips { margin-left: 0; } }
    html.header-float .wa-chat .chat-topbar { z-index: 12 !important; }
    /* Floated chat controls (⋯ + width): when the transcript scrolls up beneath
       them they gain an opaque backing so glyphs stay legible. The shared rule
       paints that backing white (--surface), which reads as a different color
       from the chat module's scrolling surface (--bg). Match --bg so, at rest,
       the icons blend into the chat module instead of sitting on white pills. */
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: var(--bg);
    }
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: #1A2339; /* matches html.dark .sc-card's surface */
    }
    /* Blue chat surface (chat-tint): the module's surface is the brand-blue mix,
       so the backing circles must repaint with the SAME mix to blend in. */
    html.chat-tint:not(.dark).header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.chat-tint:not(.dark).header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary) 5%, #fff);
    }
    html.dark.chat-tint.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.chat-tint.header-float #wa-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339);
    }
    /* Keep hover/active affordances readable over the new resting backing. */
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn:hover,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn:hover { background: var(--surface-3); }
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn.is-open,
    #wa-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn.is-on { background: color-mix(in srgb, var(--primary) 16%, var(--surface-2)); }

    /* Welcome headline on the WISEcodeAI surface — leads the full-width chat, sized
       at twice the previous scale for a bolder, more prominent lead-in. */
    #wa-chat .ws-heading { font-size: clamp(1.5rem, 1rem + 1.6vw, 2rem); }

    /* Make the input placeholder the WISE blue so the prompt pops. */
    #wa-chat .fl-input::placeholder { color: var(--primary); opacity: 1; }
    html.dark #wa-chat .fl-input::placeholder { color: var(--primary-bright, #8B9FAF); }

    /* Center the large welcome cards (and intent chips). The shared rule gives
       these blocks width:100%, so on the full-width WISEcodeAI surface they stretch
       edge-to-edge and the cards left-float. Let the card cluster shrink to its
       content and center it (the welcome column is already align-items:center);
       the max-width fits the full set on wide screens. Full-size chat shows
       every chip; a single-pane dock wraps them into three rows inside
       `.ws-chips-scroll` and scrolls extra chips vertically. */
    #wa-chat .sc-welcome > .ws-scorecards-section,
    #wa-chat .sc-welcome > .ws-chips-wrap,
    #wa-chat .sc-welcome > .ws-chips {
      width: auto;
      max-width: min(100%, 1040px);
      margin-left: auto;
      margin-right: auto;
    }
    #wa-chat .sc-welcome > .ws-chips-scroll {
      width: 100%;
      min-width: 0;
      max-width: min(100%, 1040px);
      margin-left: auto;
      margin-right: auto;
    }

    /* ═══════════ Right result panes ═══════════
       Two carded modules that open on demand. Both share .wa-pane; each keeps its
       own header controls (three-dot menu + 3-step width toggle). Hidden until the
       conversation produces content for them. */
    .wa-pane {
      display: none;
      flex-direction: column;
      min-width: 0; min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .wa-pane.is-open {
      display: flex;
      flex: 1 1 0%;
      min-width: 400px;
      transform-origin: right center;
      animation: panelBounceRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    /* Width control — cycles the pane's grow ratio so it visibly takes more of the
       row: Single (1) · Double (2) · Triple (3) · Fill (takes the rest of the row). */
    .wa-pane.is-open.pane-wide { flex-grow: 2; }
    .wa-pane.is-open.pane-triple { flex-grow: 3; }
    .wa-pane.is-open.pane-fill { flex-grow: 1000; }
    @media (prefers-reduced-motion: reduce) { .wa-chat, .wa-pane.is-open { animation: none !important; } }

    /* Shared vertical rhythm — EVERY non-chat module (result panes + docked
       History / Turns) sits ~15px shorter top & bottom, centered in the row, to
       match the sticky modules' inset. The chat is the sole exception: it still
       spans the full row height. */
    #modules-row .wa-pane.is-open,
    #modules-row .wch-sidebar.wch-docked {
      align-self: center;
      height: calc(100% - 30px);
    }

    /* Pane top bar — the module HEADER, matching every other docked module
       (chat / History / Turns): the active output's serif title + meta line on
       the LEFT, and the control cluster on the RIGHT (position counter, the
       prev/next buttons, then the three-dot menu + width changer). openPane()
       and setPaneSlide() keep the title/meta in sync with the visible output.
       The merged Output pane is an exception: "Output" is a small eyebrow
       above the count + chart name; the description sits to the right of
       the count (see #wa-unified .wa-pane-mast below). */
    .wa-pane-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 12px 14px 20px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    /* Title + version share the first line (version sits inline, directly to the
       right of the title's dropdown chevron); the meta caption wraps below. */
    .wa-pane-mast { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
    .wa-pane-title { order: 0; flex: 0 1 auto; min-width: 0; }
    .wa-pane-ver { order: 1; }
    .wa-pane-meta { order: 2; flex-basis: 100%; }
    .wa-pane-title {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      margin: 0; font-size: 1.2rem; font-weight: 800;
      letter-spacing: -.01em; line-height: 1.16; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wa-pane-meta { font-size: 12px; color: var(--text-muted); margin: 3px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-pane-title:empty, .wa-pane-meta:empty { display: none; }
    /* Merged Output pane: shared dash-eyebrow over the headline
       (count + chart name + dropdown chevron). Version + description sit
       on the next line, aligned under the title — not under the count. */
    #wa-unified .wa-pane-mast {
      display: flex; flex-direction: column; flex-wrap: nowrap;
      align-items: stretch; gap: 2px;
    }
    #wa-unified .wa-pane-eyebrow { margin: 0; }
    #wa-unified .wa-pane-mast-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      column-gap: 8px;
      align-items: center;
      min-width: 0;
      position: relative;
    }
    #wa-unified .wa-pane-title { grid-column: 1; grid-row: 1; }
    #wa-unified .wa-pane-mast-row {
      grid-column: 2; grid-row: 1;
      display: flex; flex-wrap: nowrap; align-items: center;
      column-gap: 8px; width: auto; max-width: 100%; min-width: 0;
      position: relative;
    }
    #wa-unified .wa-pane-name {
      flex: 0 1 auto; min-width: 0; margin: 0;
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; line-height: 1.16;
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #wa-unified .wa-pane-mast-sub {
      grid-column: 2; grid-row: 2;
      display: flex; flex-wrap: wrap; align-items: baseline;
      column-gap: 8px; row-gap: 2px; min-width: 0; margin-top: 3px;
    }
    #wa-unified .wa-pane-ver { order: 0; }
    #wa-unified .wa-pane-meta {
      order: 1; flex: 1 1 8rem; min-width: 0; margin: 0;
      font-size: 12.5px; font-style: italic; line-height: 1.35;
    }
    #wa-unified .wa-pane-name:empty { display: none; }

    /* Report pane — same eyebrow + serif title mast as Output, with an
       editable name so the generated report can be renamed in place. */
    #wa-report .wa-pane-mast {
      display: flex; flex-direction: column; flex-wrap: nowrap;
      align-items: stretch; gap: 2px;
    }
    #wa-report .wa-pane-eyebrow { margin: 0; }
    #wa-report .wa-pane-title {
      cursor: text; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #wa-report .wa-pane-title:empty { display: block; min-height: 1.2em; }
    #wa-report .wa-pane-title:focus {
      outline: none;
      box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--primary) 55%, transparent);
    }
    /* Chart-count line is gone — the editable title is the only mast label. */
    #wa-report .wa-pane-meta { display: none; }
    /* Report is the secondary sticky drawer to the RIGHT of Output: narrower
       than the output pane. Unlike Output (which tucks under chat), it must
       keep a visible left seam so the two modules read as separate drawers. */
    #wa-report.wa-pane.is-open {
      flex: 0 0 340px !important;
      width: 340px !important;
      min-width: 280px !important;
      max-width: 420px !important;
    }
    #wa-report.wa-pane.is-open.pane-wide { flex: 0 0 460px !important; width: 460px !important; max-width: 520px !important; }
    #wa-report.wa-pane.is-open.pane-triple { flex: 0 0 580px !important; width: 580px !important; max-width: none !important; }
    #wa-report.wa-pane.is-open.pane-fill { flex: 1 1 0% !important; width: auto !important; min-width: 400px !important; max-width: none !important; }
    #modules-row #wa-unified.is-open.is-sticky,
    #modules-row #wa-results.is-open.is-sticky,
    #modules-row #wa-visuals.is-open.is-sticky { z-index: 2; }
    /* Output sits ON TOP of Report: one right-edge seam (no second left
       border on Report) and a little elevation so the drawer reads as
       the layer underneath. */
    #modules-row:has(#wa-report.is-open) #wa-unified.is-open.is-sticky,
    #modules-row:has(#wa-report.is-open) #wa-results.is-open.is-sticky,
    #modules-row:has(#wa-report.is-open) #wa-visuals.is-open.is-sticky {
      /* Soft right-hand elevation only — a tight inner shadow sat next to
         Output's own right border and read as a second seam. */
      box-shadow: 18px 0 36px rgba(15, 23, 42, 0.18);
    }
    html.dark #modules-row:has(#wa-report.is-open) #wa-unified.is-open.is-sticky,
    html.dark #modules-row:has(#wa-report.is-open) #wa-results.is-open.is-sticky,
    html.dark #modules-row:has(#wa-report.is-open) #wa-visuals.is-open.is-sticky {
      box-shadow: 18px 0 40px rgba(0, 0, 0, 0.5);
    }
    #modules-row #wa-report.wa-pane.is-open.is-sticky {
      z-index: 1 !important;
      /* One step shorter than Output so the taller pane overlaps it. */
      height: calc(100% - 62px);
      /* Same tuck as every other sticky drawer: slide under the neighbour,
         drop the facing corners / left border so Output's right edge is
         the only seam. */
      margin-left: calc(-14px - var(--modules-gap, 8px));
      padding-left: 14px;
      border-left: 0 !important;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      box-shadow: none;
      /* Paper white (or the dark-mode surface) — not the linen sticky fill. */
      background: var(--surface) !important;
    }
    #modules-row #wa-report.is-sticky .wa-pane-top,
    #wa-report .wa-pane-body {
      background: var(--surface) !important;
    }
    /* Version badge in the pane masthead — mirrors the transcript card's
       "v1.0.2 · 3 versions" so the versioning on the mini cards stays in line
       with the output shown on the right. Hidden for unversioned outputs. */
    .wa-pane-ver {
      display: inline; margin: 0; padding: 0; border: 0; background: none; border-radius: 0;
      font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .wa-pane-ver[hidden] { display: none; }
    html.dark .wa-pane-ver { color: var(--text-muted); background: none; border: 0; }
    /* The header control cluster (nav + three-dot + width) is ALWAYS pinned to the
       pane's right edge. margin-left:auto guarantees this even when the position
       counter on the left is empty/hidden (a single output) — without it,
       justify-content:space-between would collapse the lone cluster to the left. */
    .wa-pane-top-right { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: auto; }
    .wa-pane-controls { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .wa-pane-controls .panel-more-wrap { margin-left: 0; }
    /* .topbar-menu-item carries an explicit display:flex, which would otherwise
       defeat the [hidden] attribute — force menu items/dividers hidden when set
       (used to reveal the "Minimize" item only in carousel mode). */
    .wa-pane .topbar-menu-item[hidden],
    .wa-pane .topbar-menu-divider[hidden] { display: none !important; }

    /* ── Broken-out History / Turns modules ──
       When History or Turns live as their own docked modules (real flex siblings
       in #modules-row), dress them as first-class panes: same surface color,
       border, radius & shadow as .wa-pane, an editorial serif masthead with NO
       boxed icon, and the same header chrome the panes carry (a three-dot menu +
       a width changer). */
    #modules-row .wch-sidebar.wch-docked {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      animation: none;
    }
    #modules-row .wch-sidebar.wch-docked .wch-head {
      padding: 18px 14px 16px 24px;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    #modules-row .wch-sidebar.wch-docked.wch-rail .wch-head {
      padding: 4px 0 !important;
      border-bottom: 0;
    }
    #modules-row .wch-sidebar.wch-docked.wch-rail .wch-controls { margin: 0 !important; }
    #modules-row .wch-sidebar.wch-docked .wch-head-title {
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -.01em;
      line-height: 1.16;
      color: var(--text);
      align-items: center;
    }
    #modules-row .wch-sidebar.wch-docked .wch-head-title .material-symbols-outlined { display: none; }
    /* Header controls cluster (three-dot + width) sits top-right, like the panes. */
    #modules-row .wch-sidebar.wch-docked .wch-controls { margin-top: 1px; }

    /* ── Sticky modules mode ──────────────────────────────────────────────────
       A toggle in the chat's three-dot menu (data-sc="sticky") turns the docked
       History (left) and Turns (right) modules into "drawers" that tuck in behind
       the chat: they butt right up against it (no gap), lose the corners that face
       the chat, slide a few px UNDER it (the chat overlays their inner edge), take
       a calmer, non-white surface, and sit a little shorter top & bottom so they
       read as sliding out from underneath the chat card. */
    #modules-row.modules-sticky { position: relative; }
    /* Chat rides above the tucked drawers (z-index 1) and keeps casting its shadow
       onto them — but must sit BELOW the resize-handle overlay (z-index 60) so the
       drag handles at the chat↔module seams stay grabbable. (The shared pane-resize
       rule otherwise lifts the chat to z-index 500 because the input's always-present
       role="menu" popovers trip its "menu open" test, which would bury the handles.) */
    #modules-row.modules-sticky #wa-chat { position: relative; z-index: 3 !important; }
    /* `.wch-unsticky` (set from the module's ⋯ "Sticky module" switch) opts a
       single docked module OUT of the tuck: it keeps the base free-standing card
       look (surface, border, radius, shadow — see the .wch-docked rules above)
       and the normal 8px row gap, so every :not(.wch-unsticky) below is what
       actually performs the tuck. */
    #modules-row.modules-sticky .wch-sidebar.wch-docked:not(.wch-unsticky) {
      z-index: 1;
      background: var(--surface-2);
      box-shadow: none;
      align-self: center;
      height: calc(100% - 30px);
    }
    /* History (left of chat): flush + tucked under the chat's LEFT edge. */
    #modules-row.modules-sticky .wch-sidebar.wch-docked:not(.wch-right):not(.wch-unsticky) {
      margin-right: calc(-14px - var(--modules-gap, 8px)); /* cancels the REAL row gap + ~14px tuck */
      padding-right: 14px;                 /* keep content clear of the tucked edge */
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: 0;
      /* Resting sticky state has no enter animation. A leftover keyframe here
         restarts from its "closed" from-state when reveal/conceal classes drop,
         so the module flashes shut after expanding. Show/hide uses only
         wch-dock-reveal / wch-dock-conceal. */
      animation: none;
    }
    /* Turns (right of chat): flush + tucked under the chat's RIGHT edge. */
    #modules-row.modules-sticky .wch-sidebar.wch-docked.wch-right:not(.wch-unsticky) {
      margin-left: calc(-14px - var(--modules-gap, 8px));
      padding-left: 14px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
      animation: none;
    }
    /* Output pane + Turns / walkthrough: restore a vertical left edge. */
    #modules-row:has(.wa-pane.is-open) .wch-sidebar.wch-docked.wch-right,
    #modules-row.modules-sticky:has(.wa-pane.is-open) .wch-sidebar.wch-docked.wch-right:not(.wch-unsticky) {
      border-left: 1px solid var(--border-strong, var(--border)) !important;
    }
    html.dark #modules-row:has(.wa-pane.is-open) .wch-sidebar.wch-docked.wch-right {
      border-left-color: rgba(255, 255, 255, 0.22) !important;
    }
    @media (prefers-reduced-motion: reduce) {
      #modules-row.modules-sticky .wch-sidebar.wch-docked { animation: none !important; }
    }

    /* ── Stacking: the chat always rides ABOVE the docked History / Turns
       modules, so when they slide in/out they read as tucking behind the chat
       card (never on top of it). Kept well under the resize-handle overlay
       (z-index 60) so the drag grips at the seams stay grabbable. */
    #modules-row #wa-chat { position: relative; z-index: 3 !important; }
    #modules-row .wch-sidebar.wch-docked { position: relative; z-index: 1; }

    /* The docked History / Turns three-dot menu portals its popover to <body>
       (z-index 3000), so the module itself never needs lifting to show it. Pin
       the docked sidebars BELOW the chat even while their menu is open — this
       overrides the shared pane-resize "menu open" rule (which otherwise jumps
       the whole module to z-index 500, popping the entire History module on top
       of the chat). Higher specificity + !important beats that generic rule. */
    #modules-row .wch-sidebar.wch-docked:has(.panel-more-btn.is-open),
    #modules-row .wch-sidebar.wch-docked:has(.topbar-popover:not(.hidden)),
    #modules-row .wch-sidebar.wch-docked:has([role="menu"]:not(.hidden):not([hidden])) {
      z-index: 1 !important;
    }

    /* ── Docked module reveal / conceal ──────────────────────────────────────
       Showing a docked module (History on the left, Turns on the right) slides
       it out from behind the chat; hiding it slides it back in behind the chat
       and then removes it. Because the modules sit a layer below the chat, the
       motion always reads as emerging from / disappearing under the chat card. */
    #modules-row .wch-sidebar.wch-docked.wch-dock-reveal { animation: waDockRevealL .44s cubic-bezier(.34, 1.4, .64, 1) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-right.wch-dock-reveal { animation: waDockRevealR .44s cubic-bezier(.34, 1.4, .64, 1) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-dock-conceal { animation: waDockConcealL .3s cubic-bezier(.4, 0, .75, .25) both !important; }
    #modules-row .wch-sidebar.wch-docked.wch-right.wch-dock-conceal { animation: waDockConcealR .3s cubic-bezier(.4, 0, .75, .25) both !important; }
    @keyframes waDockRevealL { from { opacity: 0; transform: translateX(46px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes waDockRevealR { from { opacity: 0; transform: translateX(-46px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes waDockConcealL { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(46px) scale(.97); } }
    @keyframes waDockConcealR { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-46px) scale(.97); } }
    @media (prefers-reduced-motion: reduce) {
      #modules-row .wch-sidebar.wch-docked.wch-dock-reveal,
      #modules-row .wch-sidebar.wch-docked.wch-dock-conceal { animation: none !important; }
    }

    .wa-pane-body { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 20px 24px 28px; }
    .wa-pane-body > .wa-block { animation: waBlockIn .34s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    @keyframes waBlockIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Empty-state placeholder that hints what each pane will hold before it opens. */
    .wa-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; height: 100%; gap: 12px; color: var(--text-muted); padding: 24px;
    }
    .wa-empty .material-symbols-outlined { font-size: 34px; color: var(--text-subtle); }
    .wa-empty-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 700; font-size: 15px; color: var(--text); }
    .wa-empty-sub { font-size: 12.5px; line-height: 1.5; max-width: 300px; }

    /* Output pane loading — same pending-ghost bars, scan sweep, and breathing
       owl that product-comparison.html uses while a board is still assembling.
       Fills the sticky module so engage-to-surface is never a blank cream panel. */
    .wa-pane-body.is-loading {
      display: flex; flex-direction: column;
      padding: 14px 16px 18px;
    }
    .wa-pane-skel {
      position: relative;
      flex: 1 1 auto; min-height: 0; width: 100%;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .wa-pane-skel-board {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
    }
    .wa-pane-skel-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      flex: 1 1 0;
      min-height: 44px;
    }
    .wa-pane-skel-row--head { flex: 2.1 1 0; min-height: 88px; }
    .wa-pane-skel-row .cmp-cell {
      display: flex; align-items: center; min-width: 0;
    }
    .wa-pane-skel-row--head .cmp-cell { align-items: stretch; padding: 10px; }
    .wa-pane-skel-tile .cmp-ghost {
      height: 100%; min-height: 64px; width: 100%;
      border-radius: 10px;
    }
    .wa-pane-skel-row:not(.wa-pane-skel-row--head) .cmp-ghost.cmp-ghost--bar { width: 68%; }
    .wa-pane-skel-row:not(.wa-pane-skel-row--head) .cmp-cell:nth-child(2) .cmp-ghost--bar { width: 86%; }
    .wa-pane-skel-row:not(.wa-pane-skel-row--head) .cmp-cell:nth-child(3) .cmp-ghost--bar { width: 52%; }
    .wa-pane-skel-row:not(.wa-pane-skel-row--head) .cmp-cell:nth-child(4) .cmp-ghost--bar { width: 74%; }
    .wa-pane-skel-owl {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 7; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
    }
    .wa-pane-skel-owl svg { width: 64px; height: auto; display: block; }
    @media (prefers-reduced-motion: reduce) {
      .wa-pane-skel-board.is-recalcing::after { animation: none; opacity: 0; }
    }

    /* ── Section scaffolding inside panes ── */
    .wa-block { margin: 0 0 26px; }
    .wa-block:last-child { margin-bottom: 0; }
    /* As the conversation surfaces more results/charts, each new answer is
       appended into the pane so it keeps growing. Separate stacked blocks with
       a hairline rule so each result reads as its own section. */
    .wa-pane-body > .wa-block + .wa-block { margin-top: 4px; padding-top: 24px; border-top: 1px solid var(--border); }

    /* ── Carousel mode: one output at a time + a horizontal thumbnail rail ──
       Once a pane holds 2+ blocks we stop stacking them in a long vertical
       scroll. A horizontal strip of scaled "output visual" thumbnails (the same
       surface-card preview idea used in the chat) sits at the top of the pane,
       and only the selected block renders below it. Tap a thumbnail to switch. */
    .wa-pane-body.is-carousel > .wa-block { display: none; margin: 0; padding-top: 0; border-top: 0; }
    .wa-pane-body.is-carousel > .wa-block.is-active { display: block; }

    /* Position counter — sits in the top-bar right cluster, just left of the
       prev/next arrows (the LEFT now belongs to the title masthead).
       Hidden when a pane holds a single output (nothing to count). */
    .wa-pane-nav-count { font-size: 11.5px; font-weight: 600; color: var(--text-muted); letter-spacing: .01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
    .wa-pane-nav-count:empty { display: none; }
    .wa-pane-nav-count b { color: var(--text); font-weight: 800; }

    /* ── Header tally bounce ──
       When a NEW output lands in a pane, its header tally ticks up — "Result
       2 / 3" becomes "/ 4" (or the merged masthead's "N / M"). Replay a
       springy bounce + a brief color flash on it so the count going up reads
       like a score being scored. openPane() applies .is-bump on growth and
       clears it once the run finishes. */
    @keyframes wa-tally-bounce {
      0%   { transform: translateY(0)    scale(1); }
      28%  { transform: translateY(-6px) scale(1.18); }
      52%  { transform: translateY(2px)  scale(.96); }
      74%  { transform: translateY(-3px) scale(1.07); }
      100% { transform: translateY(0)    scale(1); }
    }
    @keyframes wa-tally-flash {
      0%, 60% { color: var(--primary-ink, var(--primary)); }
      100%    { color: inherit; }
    }
    .wa-pane-nav-count.is-bump,
    .wa-pane-title.is-bump {
      animation: wa-tally-bounce .85s cubic-bezier(.3, 1.5, .4, 1) both,
                 wa-tally-flash  .85s ease-out both;
      transform-origin: left center;
    }
    .wa-pane-nav-count.is-bump { transform-origin: center; }
    .wa-pane-nav-count.is-bump b { animation: wa-tally-flash .85s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .wa-pane-nav-count.is-bump,
      .wa-pane-title.is-bump,
      .wa-pane-nav-count.is-bump b { animation: wa-tally-flash .85s ease-out both; }
    }
    /* prev/next button group — sits in the top-bar right cluster, just LEFT of
       the three-dot + width controls. Empty (and collapsed) unless the pane is
       in carousel mode. (Minimize now lives inside the three-dot menu.) */
    .wa-pane-nav-btns { display: inline-flex; align-items: center; gap: 2px; }
    .wa-pane-nav-btns:empty { display: none; }
    /* Borderless icon buttons that match the three-dot + width controls beside
       them: no circle backing at rest, a soft fill on hover only. */
    .wa-pane-nav-arrow {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
      background: transparent; border: 0; color: var(--text-muted); opacity: .85; padding: 0;
      transition: background .15s ease, color .15s ease, opacity .15s ease;
    }
    .wa-pane-nav-arrow:hover { opacity: 1; background: var(--surface-3); color: var(--text); }
    .wa-pane-nav-arrow:disabled { opacity: .32; cursor: default; }
    .wa-pane-nav-arrow:disabled:hover { background: transparent; color: var(--text-muted); }
    .wa-pane-nav-arrow .material-symbols-outlined { font-size: 18px; }

    /* Scrollable thumbnail track — a full-width row of its own below the top
       bar, flush to the module's left edge, shown only in carousel mode. */
    .wa-pane-nav-track {
      display: none; flex: 0 0 auto; min-width: 0; width: 100%;
      gap: 10px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; padding: 10px 14px 12px 0;
      border-bottom: 1px solid var(--border); background: var(--surface);
      scroll-snap-type: x proximity;
    }
    .wa-pane-nav-track.is-on { display: flex; }
    /* Keep the very first thumbnail off the pane's left border by a hair without
       losing the edge-to-edge scroll (the strip still begins at the module edge). */
    .wa-pane-thumb-item:first-child { margin-left: 16px; }
    .wa-pane-thumb-item {
      position: relative; scroll-snap-align: start;
      flex: 0 0 auto; width: 118px;
      display: flex; flex-direction: column; gap: 6px;
      padding: 6px; border-radius: 12px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      font-family: inherit; text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    /* Turn/output number, top-left of each thumbnail. */
    .wa-pane-thumb-num {
      position: absolute; top: 4px; left: 4px; z-index: 2;
      min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
      background: var(--surface); color: var(--text-muted); border: 1px solid var(--border-strong);
    }
    .wa-pane-thumb-item.is-active .wa-pane-thumb-num { background: var(--primary); color: #fff; border-color: var(--primary); }
    .wa-pane-thumb-item:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 4px 12px rgba(37,80,124,0.10); }
    .wa-pane-thumb-item:active { transform: translateY(1px); }
    .wa-pane-thumb-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-pane-thumb-item.is-active { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--surface); }
    /* Small clipped snapshot of the block, scaled way down (matches .sc-surface-thumb). */
    .wa-pane-thumb-preview {
      width: 100%; height: 66px; border-radius: 8px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .wa-pane-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.283); transform-origin: top left; pointer-events: none;
    }
    .wa-pane-thumb-inner > * { margin: 0 !important; }
    .wa-pane-thumb-label {
      font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wa-pane-thumb-item.is-active .wa-pane-thumb-label { color: var(--primary-ink, var(--primary)); }

    /* ── Minimized (intent-chip) mode ──
       The minimize control collapses the thumbnail cards into compact intent-
       style chips: a small circular preview image + the output's label. */
    .wa-pane-nav-track.is-min { align-items: center; padding-top: 6px; padding-bottom: 8px; }
    .wa-pane-nav-track.is-min .wa-pane-thumb-item {
      flex-direction: row; align-items: center; gap: 8px;
      width: auto; max-width: 190px; padding: 4px 12px 4px 4px; border-radius: 9999px;
    }
    .wa-pane-nav-track.is-min .wa-pane-thumb-num { display: none; }
    .wa-pane-nav-track.is-min .wa-pane-thumb-preview {
      width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%;
    }
    .wa-pane-nav-track.is-min .wa-pane-thumb-inner { transform: scale(0.1056); } /* 38 / 360 */
    .wa-pane-nav-track.is-min .wa-pane-thumb-label {
      display: block; -webkit-line-clamp: none; line-clamp: none;
      font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
    }

    /* ── Unified (merged) rail: ONE combined chip carousel ──
       When Results & Visuals are merged into one module, the rail is a single
       horizontally-scrolling strip of small intent-style chips (matching the
       chat transcript's chips) — Results and Visuals combined, with no per-group
       eyebrow or label icon. Clicking a chip reveals that output below AND jumps
       the transcript to where it was introduced. */
    .wa-pane-nav-track.is-merged {
      align-items: center; scroll-snap-type: none;
      overflow-x: hidden; overflow-y: hidden;
      /* Edge-to-edge chip rail: no left/right padding so chips scroll flush
         against the module's borders. */
      padding: 10px 0 12px;
      /* Query container so the chips can reflow as the merged pane narrows. */
      container-type: inline-size; container-name: mergerail;
    }
    .wa-pane-nav-track.is-merged .wa-merge-chips { width: 100%; padding-left: 0; padding-right: 0; }
    /* ── Unified (merged) rail: two STACKED chip carousels (legacy) ── */
    .wa-pane-nav-track.is-stacked {
      flex-direction: column; align-items: stretch; gap: 8px;
      overflow-x: hidden; overflow-y: auto; scroll-snap-type: none;
      padding: 10px 14px 12px;
    }
    /* Label sits DIRECTLY ABOVE its chip row (not beside it), so every chip row
       starts flush against the rail's left edge. */
    .wa-merge-group { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; }
    /* Hairline between the two stacked carousels so each reads as its own row. */
    .wa-pane-nav-track.is-stacked .wa-merge-group + .wa-merge-group { border-top: 1px solid var(--border); padding-top: 10px; }
    .wa-merge-group-label {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding-left: 2px;
      font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-subtle); line-height: 1.2;
    }
    .wa-merge-group-label .material-symbols-outlined { font-size: 15px; color: var(--primary); flex: 0 0 auto; }
    html.dark .wa-merge-group-label .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-merge-chips {
      flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      scroll-snap-type: x proximity; padding: 2px;
    }
    .wa-merge-chips::-webkit-scrollbar { height: 6px; }
    /* Output chip — a rounded-corner RECTANGLE card that mirrors the transcript's
       .sc-surface-card exactly: a tiny scaled preview of the output on the left,
       its name to the right. NOT a pill. Clicking it reveals that output below. */
    .wa-merge-chip {
      flex: 0 0 auto; scroll-snap-align: start; max-width: 200px;
      display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px;
      background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 12px;
      font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--text);
      cursor: pointer; text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    .wa-merge-chip:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 4px 12px rgba(37,80,124,0.10); }
    .wa-merge-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-merge-chip:active { transform: translateY(1px); }
    /* Clipped snapshot of the output, scaled way down (matches .sc-surface-thumb). */
    .wa-merge-chip-thumb {
      width: 40px; height: 40px; flex: 0 0 auto; border-radius: 8px; overflow: hidden;
      position: relative; background: var(--surface); border: 1px solid var(--border);
    }
    .wa-merge-chip-thumb-inner {
      position: absolute; top: 0; left: 0; width: 360px;
      transform: scale(0.111); transform-origin: top left; pointer-events: none;
    }
    .wa-merge-chip-thumb-inner > * { margin: 0 !important; }
    /* Two-line clamp — lets the name wrap so chips stay short instead of running
       out into one long ellipsised line. */
    .wa-merge-chip-label {
      flex: 1 1 auto; min-width: 0; line-height: 1.25; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    }
    .wa-merge-chip.is-active {
      background: var(--surface); border-color: var(--primary); color: var(--primary-ink, var(--primary));
      box-shadow: inset 0 0 0 1px var(--primary);
    }
    html.dark .wa-merge-chip { background: rgba(255,255,255,0.04); }

    /* ── Merged rail, responsive ──
       As the merged pane narrows, keep the carousel but stack each chip: the
       preview square on top with a smaller name below it (instead of a wide
       thumb + name row). At the tightest widths the name drops away entirely so
       the rail is just a strip of preview squares. */
    @container mergerail (max-width: 380px) {
      .wa-pane-nav-track.is-merged .wa-merge-chip {
        flex-direction: column; align-items: center; gap: 4px;
        max-width: 96px; padding: 6px 6px 8px;
        text-align: center; font-size: 11px;
      }
      .wa-pane-nav-track.is-merged .wa-merge-chip-label {
        flex: 0 0 auto; text-align: center; font-size: 10px; line-height: 1.2;
        -webkit-line-clamp: 2; line-clamp: 2;
      }
    }
    @container mergerail (max-width: 200px) {
      .wa-pane-nav-track.is-merged .wa-merge-chip {
        max-width: 60px; padding: 5px;
      }
      .wa-pane-nav-track.is-merged .wa-merge-chip-label { display: none; }
    }

    /* ── Admin: "Outputs dropdown" header mode (merged pane only) ──
       Toggled from the merged pane's three-dot menu (pink Admin switch). Hides
       the chip carousel; the count ("N / M") in the masthead becomes a dropdown
       that lists every output as a small preview + label row (click one to
       reveal it). The header prev/next left/right arrows stay visible so both
       nav affordances coexist. */
    #wa-unified.is-titledrop .wa-pane-nav-track { display: none !important; }
    #wa-unified.is-titledrop .wa-pane-nav-count { display: none !important; }
    #wa-unified.is-titledrop .wa-pane-mast-head { cursor: pointer; user-select: none; }
    #wa-unified.is-titledrop .wa-pane-mast-head:hover .wa-pane-title,
    #wa-unified.is-titledrop .wa-pane-mast-head:hover .wa-pane-name { color: var(--primary-ink, var(--primary)); }
    #wa-unified.is-titledrop .wa-pane-mast-row::after {
      content: 'keyboard_arrow_down';
      font-family: 'Material Symbols Outlined';
      font-weight: 400; font-size: 18px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      height: 1.2rem; margin: 0; color: var(--text-muted); order: 2; flex: 0 0 auto;
      transform: translateY(-1px);
      transition: transform .15s ease;
    }
    #wa-unified.is-titledrop .wa-pane-mast-row.is-open::after { transform: translateY(-1px) rotate(180deg); }
    .wa-titledrop-pop {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
      box-sizing: border-box; min-width: 0; max-width: none;
      max-height: min(420px, calc(100vh - 160px));
      display: flex; flex-direction: column;
      overflow: hidden;
      padding: 6px; background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.16);
    }
    html.dark .wa-titledrop-pop { background: #1A2339; box-shadow: 0 14px 36px rgba(0,0,0,0.5); }
    .wa-titledrop-list {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .wa-titledrop-item {
      display: grid;
      grid-template-columns: 1.35em 40px minmax(0, 1fr) 28px;
      align-items: center; gap: 8px; width: 100%;
      padding: 6px 8px; border-radius: 10px; cursor: pointer;
    }
    .wa-titledrop-item:hover { background: var(--surface-2); }
    .wa-titledrop-item:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .wa-titledrop-item.is-active { background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .wa-titledrop-num {
      flex: 0 0 auto; min-width: 0;
      font-size: 12.5px; font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums; text-align: center;
      color: var(--text-muted);
    }
    .wa-titledrop-item.is-active .wa-titledrop-num { color: var(--primary-ink, var(--primary)); }
    .wa-titledrop-text {
      flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;
    }
    .wa-titledrop-label {
      min-width: 0; font-size: 12.5px; font-weight: 600;
      color: var(--text); line-height: 1.3; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
    }
    .wa-titledrop-item.is-active .wa-titledrop-label { color: var(--primary-ink, var(--primary)); font-weight: 700; }
    /* Version sits under the name so redone charts / artifact updates that share
       a title (v1.0.0 vs v1.0.1) stay distinguishable in the dropdown. */
    .wa-titledrop-ver {
      font-size: 11px; font-weight: 600; line-height: 1.25;
      color: var(--text-muted); font-variant-numeric: tabular-nums;
    }
    .wa-titledrop-item.is-active .wa-titledrop-ver { color: var(--primary-ink, var(--primary)); opacity: .78; }
    html.dark .wa-titledrop-ver { color: var(--text-muted); }
    /* Plus / selected check — bare circular icon, no boxed backdrop. */
    .wa-titledrop-plus {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: var(--text-muted); cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }
    .wa-titledrop-plus:hover { color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .wa-titledrop-plus:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .wa-titledrop-plus.is-on { color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 14%, transparent); }
    html.dark .wa-titledrop-plus.is-on { color: var(--primary-bright, #8B9FAF); }
    .wa-titledrop-plus .material-symbols-outlined { font-size: 20px; }
    .wa-titledrop-foot {
      flex: 0 0 auto; padding: 8px 6px 4px; margin-top: 2px;
      border-top: 1px solid var(--border);
    }
    .wa-titledrop-foot[hidden] { display: none; }
    .wa-titledrop-gen {
      width: 100%;
    }

    /* ── Generated report items (stacked charts inside #wa-report) ── */
    .wa-rpt-item + .wa-rpt-item { margin-top: 4px; padding-top: 22px; border-top: 1px solid var(--border); }
    .wa-rpt-item-head {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 10px;
    }
    .wa-rpt-item-title {
      flex: 1 1 auto; min-width: 0; margin: 0;
      font-family: 'WISE Digits', 'Noto Serif', Georgia, serif;
      font-weight: 800; font-size: 1.05rem; line-height: 1.2; letter-spacing: -.01em;
      color: var(--text); cursor: text;
    }
    .wa-rpt-item-title:focus {
      outline: none;
      box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--primary) 55%, transparent);
    }
    .wa-rpt-more { margin-left: auto; flex-shrink: 0; }
    .wa-rpt-item-pop,
    .wa-rpt-swap-pop {
      position: fixed;
      top: auto; right: auto; left: auto; bottom: auto;
      z-index: 400;
    }
    .wa-rpt-swap-pop {
      min-width: 260px; max-width: 320px;
      max-height: min(420px, calc(100vh - 24px));
      display: flex; flex-direction: column;
      overflow: hidden;
      padding: 8px 6px 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 14px;
      box-shadow: var(--shadow-card);
    }
    html.dark .wa-rpt-swap-pop { background: #1A2339; box-shadow: 0 14px 36px rgba(0,0,0,0.5); }
    .wa-rpt-swap-head {
      margin: 0 8px 8px;
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2;
      color: var(--text);
    }
    .wa-rpt-swap-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .wa-rpt-swap-item { grid-template-columns: 40px minmax(0, 1fr); }
    .wa-rpt-swap-empty {
      margin: 4px 8px 8px; font-size: 12.5px; color: var(--text-muted); line-height: 1.4;
    }
    .wa-rpt-note { margin: 14px 0 0; }
    .wa-rpt-note-input.adm-input {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 42px;
      background: var(--surface);
    }
    html.dark .wa-rpt-note-input.adm-input { background: rgba(255,255,255,0.05); }
    .wa-rpt-item-body { min-width: 0; }
    .wa-rpt-item-body > .wa-block {
      display: block !important;
      margin: 0;
      padding-top: 0;
      border-top: 0;
    }

    /* ── Admin: "Sticky module" mode (every result pane) ──
       Toggled from a pane's three-dot menu (pink Admin switch), ON by default on
       all panes. Turns the pane into a "drawer" that tucks in behind the chat
       (and any pane to its left) off its RIGHT edge — exactly like the docked
       Turns module in sticky mode: flush against the neighbour to its left (no
       gap), no corners/border on the edge that faces it, slid a few px UNDER it
       (the neighbour overlays the inner edge), a calmer non-white surface, and no
       card shadow. */
    #modules-row .wa-pane.is-open.is-sticky {
      position: relative;
      z-index: 1;
      background: var(--surface-2);
      box-shadow: none;
      margin-left: calc(-14px - var(--modules-gap, 8px)); /* cancels the REAL row gap + ~14px tuck */
      padding-left: 14px;                 /* keep content clear of the tucked edge */
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
      animation: stickySlideRight .42s cubic-bezier(.34, 1.45, .64, 1) both;
    }
    /* Blend the header into the calmer drawer surface (its default is --surface). */
    #modules-row .wa-pane.is-sticky .wa-pane-top { background: var(--surface-2); }
    @media (prefers-reduced-motion: reduce) {
      #modules-row .wa-pane.is-open.is-sticky { animation: none !important; }
    }
    /* Keep a sticky pane tucked BEHIND the chat even while its ⋯ menu / dropdown
       is open. The shared pane-resize rule lifts any #modules-row child with an
       open popover to z-index 500 (so its inline menu clears its neighbours) —
       but that also floats the whole pane over the chat, breaking the tuck.
       Pin the pane at z-index 1 (same as its resting sticky layer). Chat is
       z-index 3 !important, so it always paints on top — including when the
       Output N / M titledrop is open on the pane's LEFT edge. Higher
       specificity + !important beats the generic 500 rule. */
    #modules-row .wa-pane.is-sticky:has(.panel-more-btn.is-open),
    #modules-row .wa-pane.is-sticky:has(.topbar-popover:not(.hidden)),
    #modules-row .wa-pane.is-sticky:has(.wa-titledrop-pop),
    #modules-row .wa-pane.is-sticky:has([role="menu"]:not(.hidden):not([hidden])) {
      z-index: 1 !important;
    }

    .wa-sec-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .wa-sec-title .material-symbols-outlined { font-size: 18px; color: var(--primary); }
    html.dark .wa-sec-title .material-symbols-outlined { color: var(--primary-bright, #8B9FAF); }
    .wa-caption { font-size: 11.5px; color: var(--text-subtle); margin: 0 0 12px; font-style: normal; }

    /* ── Result "table" rows (head + pager live under .wa-tbl below) ── */
    .wa-trow { display: grid; align-items: center; gap: 10px; padding: 9px 14px; }
    .wa-td--end { text-align: right; justify-self: end; }
    .wa-trow { border-bottom: 1px solid var(--border); transition: background .14s; }
    .wa-trow:last-child { border-bottom: 0; }
    .wa-trow:hover { background: var(--surface-2); }
    html.dark .wa-trow:hover { background: rgba(255,255,255,0.03); }
    .wa-td { font-size: 12px; color: var(--text-muted); min-width: 0; }
    .wa-food { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.32; }
    .wa-rank { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--surface-3); color: var(--text-muted); font-size: 10.5px; font-weight: 800; flex: 0 0 auto; }
    .wa-score { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    .wa-score--bad { color: var(--sec-red-text); }
    .wa-score--good { color: var(--sec-green-text); }
    .wa-nodata { color: var(--text-subtle); }
    .wa-cat { font-size: 11px; color: var(--text-subtle); }
    .wa-ing { font-size: 11px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wa-table-foot { font-size: 11.5px; color: var(--text-subtle); margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .wa-table-foot .material-symbols-outlined { font-size: 14px; }

    /* ═══ Result-set treatment ═══
       Each block carries its own title, scorecards, a search, and a proper
       sortable table (the pane no longer has a separate masthead header). */
    .wa-resultset { margin: 0; }

    /* ── Scorecards (result-set) — scoped to .wa-resultset so the report's own
       scorecard styling below can't bleed in and vice-versa. ── */
    .wa-resultset .wa-stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
    /* Scorecard fill mirrors the chat module's own background across every theme
       (light / dark / chat-tint), matching .sc-card exactly — so the stat tiles
       read as part of the chat surface, set apart only by their hairline border. */
    .wa-resultset .wa-stat { flex: 1 1 118px; min-width: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-1); text-align: center; }
    html.dark .wa-resultset .wa-stat { background: #1A2339; }
    html.chat-tint:not(.dark) .wa-resultset .wa-stat { background: color-mix(in srgb, var(--primary) 5%, #fff); }
    html.dark.chat-tint .wa-resultset .wa-stat { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339); }
    .wa-resultset .wa-stat-num { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-resultset .wa-stat-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .wa-resultset .wa-stat--alert .wa-stat-num { color: var(--sec-red-text); }
    .wa-resultset .wa-stat--good .wa-stat-num { color: var(--sec-green-text); }
    /* Clickable stat = a sort/filter control for the table below it. */
    .wa-resultset button.wa-stat { cursor: pointer; font-family: inherit; position: relative; transition: border-color .14s, box-shadow .14s, transform .05s; }
    .wa-resultset button.wa-stat:hover { border-color: var(--border-strong); box-shadow: 0 3px 10px rgba(0,0,0,0.07); }
    .wa-resultset button.wa-stat:active { transform: translateY(1px); }
    .wa-resultset button.wa-stat .wa-stat-sort { position: absolute; top: 7px; right: 8px; font-size: 13px !important; color: var(--text-subtle); opacity: .55; transition: opacity .14s, color .14s; }
    .wa-resultset button.wa-stat:hover .wa-stat-sort { opacity: 1; }
    .wa-resultset .wa-stat.is-active { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 22%, transparent); }
    .wa-resultset .wa-stat.is-active .wa-stat-sort { opacity: 1; color: var(--primary-ink, var(--primary)); }

    /* ── Toolbar + inline search ── */
    .wa-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
    .wa-search-inline { position: relative; display: inline-flex; align-items: center; flex: 1 1 auto; min-width: 200px; }
    .wa-search-inline > .material-symbols-outlined { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-subtle); pointer-events: none; }
    .wa-search { width: 100%; height: 38px; box-sizing: border-box; padding: 0 16px 0 42px; font-family: inherit; font-size: 0.8125rem; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 9999px; outline: none; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease; }
    html.dark .wa-search { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-search::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .wa-search:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }

    /* ── Sortable results table (real column headers, click-to-sort) ── */
    /* overflow visible so .wa-tbl-head can stick to the scrolling .wa-pane-body;
       the head + last row carry the rounded corners instead.
       White fill in light mode so the grid doesn't show the cream sticky-pane
       (--surface-2) through the rows. Dark mode uses the same card surface as
       the chart blocks on this pane. */
    .wa-tbl {
      --wa-tbl-bg: #fff;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--wa-tbl-bg);
    }
    html.dark .wa-tbl { --wa-tbl-bg: #1A2339; }
    .wa-tbl-head, .wa-trow { display: grid; align-items: center; gap: 12px; padding: 10px 14px; }
    .wa-tbl-head { border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; background: var(--wa-tbl-bg, #fff); border-radius: 12px 12px 0 0; }
    .wa-tbl-th { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); background: none; border: 0; padding: 0; margin: 0; font-family: inherit; text-align: left; white-space: nowrap; }
    button.wa-tbl-th { cursor: pointer; transition: color .14s; }
    button.wa-tbl-th:hover { color: var(--text); }
    .wa-tbl-th--end { justify-content: flex-end; text-align: right; }
    .wa-tbl-th.is-sorted { color: var(--primary); }
    html.dark .wa-tbl-th.is-sorted { color: var(--primary-bright, #8B9FAF); }
    /* Shared chevron sort arrow (matches srt-arrow / adm-sort-arrow app-wide):
       a faint down-chevron that turns primary and flips to point up on asc. */
    .wa-sort-ic { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; margin-left: 2px; flex: none; opacity: .3; transition: opacity .12s ease, transform .12s ease; }
    .wa-sort-ic svg { width: 12px; height: 12px; display: block; }
    button.wa-tbl-th:hover .wa-sort-ic { opacity: .6; }
    .wa-tbl-th.is-sorted .wa-sort-ic { opacity: 1; }
    .wa-tbl-th[data-wa-dir="asc"] .wa-sort-ic { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) { .wa-sort-ic { transition: none; } }
    .wa-tbl-body { display: block; }
    .wa-trow { border-bottom: 1px solid var(--border); transition: background .14s; }
    .wa-tbl-body .wa-trow:last-child { border-bottom: 0; border-radius: 0 0 12px 12px; }
    .wa-trow:hover { background: var(--surface-2); }
    html.dark .wa-trow:hover { background: rgba(255,255,255,0.03); }
    .wa-td { font-size: 12px; color: var(--text-muted); min-width: 0; }
    .wa-td--end { text-align: right; justify-self: end; }

    /* Product cell — real food image + name with brand beneath it */
    .wa-prod { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .wa-thumb { width: 40px; height: 40px; flex: 0 0 auto; border-radius: var(--w-prod-thumb-r, 8px); overflow: hidden; position: relative; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--primary); border: 1px solid var(--border); }
    html.dark .wa-thumb { background: rgba(37,80,124,0.28); color: #9DC0E6; border-color: rgba(255,255,255,0.10); }
    .wa-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wa-thumb-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
    .wa-thumb-fallback .material-symbols-outlined { font-size: 19px; }
    .wa-prod-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .wa-prod-name { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.32; }
    .wa-prod-brand { font-size: 11px; color: var(--text-subtle); }

    /* Ingredients as its own column */
    .wa-ing-cell { font-size: 11px; color: var(--text-muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wa-ing-cell.wa-nodata { color: var(--text-subtle); }

    /* Score as a plain sortable column value (no pill chip) */
    .wa-score-num { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
    .wa-score-num--bad { color: var(--sec-red-text); }
    .wa-score-num--good { color: var(--sec-green-text); }
    .wa-empty-row { padding: 22px 14px; text-align: center; color: var(--text-subtle); font-size: 12px; border-top: 1px solid var(--border); }

    /* ── Table pagination (bottom of the sortable table) ── */
    .wa-pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px 6px; font-size: 12px; color: var(--text-subtle); }
    .wa-pager[hidden] { display: none; }
    .wa-pager-range { font-size: 12px; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
    .wa-loadmore { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; background: transparent; border: none; color: var(--primary-ink, var(--primary)); font-family: inherit; font-size: 12px; font-weight: 700; }
    .wa-loadmore .material-symbols-outlined { font-size: 16px; }
    .wa-loadmore[hidden] { display: none; }

    /* ── Food Filter UI result table ──────────────────────────────────────
       A clean, text-first ranked table matching the WISE "Food Filter UI":
       a query summary + "Edit in Food Filter UI" button on top, an italic
       filter caption, then the ranked rows. Editing the query re-surfaces the
       artifact as a new version (see editEnergyFilter / editProteinFilter). */
    .wa-ffui { border: 1px solid var(--border); border-radius: 12px; background: var(--wa-tbl-bg, #fff); overflow: hidden; }
    html.dark .wa-ffui { --wa-tbl-bg: #1A2339; }
    .wa-ffui-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px 6px; }
    .wa-ffui-count { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
    .wa-ffui-count .material-symbols-outlined { font-size: 16px; color: var(--text-subtle); }
    .wa-ffui-count b { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
    .wa-ffui-edit { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: color .14s ease, border-color .14s ease; }
    .wa-ffui-edit .material-symbols-outlined { font-size: 16px; }
    .wa-ffui-edit:hover { color: var(--text); border-color: var(--primary); }
    html.dark .wa-ffui-edit { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .wa-ffui-cap { padding: 0 14px 10px; font-size: 11.5px; font-style: italic; color: var(--text-subtle); }
    .wa-ffui-tbl { display: block; }
    .wa-ffui-hrow, .wa-ffui-row { display: grid; align-items: center; gap: 12px; padding: 11px 14px; }
    .wa-ffui-hrow { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .wa-ffui-th { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); white-space: nowrap; }
    .wa-ffui-row { border-bottom: 1px solid var(--border); transition: background .14s; }
    .wa-ffui-row:last-child { border-bottom: 0; }
    .wa-ffui-row:hover { background: var(--surface-2); }
    html.dark .wa-ffui-row:hover { background: rgba(255,255,255,0.03); }
    .wa-ffui-food { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.34; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .wa-ffui-brand { font-size: 12px; font-weight: 600; color: var(--primary-ink, var(--primary)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    html.dark .wa-ffui-brand { color: var(--primary-bright, #8B9FAF); }
    .wa-ffui-cell { font-size: 12px; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-ffui-end { text-align: right; justify-self: end; }
    .wa-ffui-score { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 13.5px; color: var(--text); font-variant-numeric: tabular-nums; }
    .wa-ffui-upf--min { color: var(--sec-green-text); font-weight: 600; }
    .wa-ffui-upf--proc { color: color-mix(in srgb, var(--ter-amber) 60%, #7a5200); font-weight: 600; }
    html.dark .wa-ffui-upf--proc { color: var(--ter-amber); }
    .wa-ffui-upf--ultra { color: #C4681F; font-weight: 600; }
    html.dark .wa-ffui-upf--ultra { color: #E28A45; }
    .wa-ffui-upf--sup { color: var(--sec-red-text); font-weight: 600; }
    .wa-ffui-flag--present { color: var(--sec-red-text); font-weight: 700; }
    .wa-ffui-flag--none { color: var(--text-subtle); }

    /* ── Correlation heatmap (UPF tier × sweetener presence) ── */
    .wa-heat { display: flex; flex-direction: column; gap: 6px; }
    .wa-heat-row { display: grid; grid-template-columns: minmax(112px, 1.15fr) 1fr 1fr; gap: 6px; align-items: stretch; }
    .wa-heat-head .wa-heat-col { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); text-align: center; align-self: center; padding: 0 4px; line-height: 1.25; }
    .wa-heat-rowlabel { font-size: 11.5px; font-weight: 600; color: var(--text-muted); align-self: center; }
    .wa-heat-cell { border-radius: 8px; padding: 15px 8px; text-align: center; display: flex; align-items: center; justify-content: center; }
    .wa-heat-val { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── Food-detail hero (failed-lookup notice state) ──
       A clean editorial header rather than a boxed card: the product photo +
       name + brand on the left, with a large, prominent WISEscore on the right.
       No shaded background / card chrome (the pane header already carries the
       title), just a hairline rule beneath so the hero doesn't read as a second
       header. */
    .wa-dhero { display: flex; align-items: center; gap: 16px; padding: 2px 0 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .wa-dhero-thumb { width: 66px; height: 66px; flex: 0 0 auto; border-radius: 14px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .wa-dhero-thumb .wa-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Fallback is a bare glyph — never a filled rounded-square tile behind the icon. */
    .wa-dhero-thumb .wa-thumb-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: none; color: var(--primary); }
    html.dark .wa-dhero-thumb .wa-thumb-fallback { color: var(--primary-bright, #8B9FAF); }
    .wa-dhero-thumb .wa-thumb-fallback .material-symbols-outlined { font-size: 30px; }
    /* Icon-only heroes (no product photo) — glyph on its own, no boxed backdrop. */
    .wa-dhero-icon { flex: 0 0 auto; font-size: 30px; line-height: 1; color: var(--primary); }
    html.dark .wa-dhero-icon { color: var(--primary-bright, #8B9FAF); }
    .wa-dhero-info { flex: 1 1 auto; min-width: 0; }
    .wa-dhero-name { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 18px; line-height: 1.22; color: var(--text); letter-spacing: -.01em; }
    .wa-dhero-brand { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); margin-top: 6px; }
    .wa-dhero-score { flex: 0 0 auto; text-align: center; padding-left: 10px; }
    .wa-dhero-score-n { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 46px; line-height: .9; color: var(--sec-red-text); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .wa-dhero-score-l { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle); margin-top: 6px; }
    .wa-notice { display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 11px; font-size: 12px; line-height: 1.45; margin-bottom: 14px; background: var(--ter-amber-10); border: 1px solid color-mix(in srgb, var(--ter-amber) 34%, transparent); color: var(--ter-amber-text); }
    .wa-notice .material-symbols-outlined { font-size: 17px; flex: 0 0 auto; margin-top: 1px; }
    .wa-detail-sub { font-size: 12px; font-weight: 700; color: var(--text); margin: 0 0 8px; }
    .wa-chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
    .wa-ing-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; background: var(--sec-red-10); border: 1px solid color-mix(in srgb, var(--sec-red) 26%, transparent); color: var(--sec-red-text); }
    /* Static chips in a detail pane — same 28px family as .chip, no pointer. */
    .wa-chiplist > .chip { cursor: default; }
    .wa-chiplist > .chip:hover { background: color-mix(in srgb, var(--primary) 10%, #fff); border-color: var(--border-strong); color: var(--text-muted); }
    html.dark .wa-chiplist > .chip:hover { background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 14%, transparent); border-color: var(--primary); }
    /* UPF marker tags — compact, non-interactive, tinted. Not intent chips. */
    .wa-upf-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .wa-upf-tag {
      display: inline-flex; align-items: center;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10px; font-weight: 700; line-height: 1.3;
      pointer-events: none; user-select: none; cursor: default;
    }
    .wa-upf-tag[data-tone="red"] { background: var(--sec-red-10); color: var(--sec-red-text); }
    .wa-upf-tag[data-tone="amber"] { background: var(--ter-amber-10); color: var(--ter-amber-text); }
    .wa-upf-tag[data-tone="fair"] { background: color-mix(in srgb, var(--chart-status-fair) 16%, transparent); color: var(--ter-amber-text); }
    .wa-upf-tag[data-tone="green"] { background: var(--sec-green-10); color: var(--sec-green-text); }
    .wa-upf-tag[data-tone="blue"] { background: var(--primary-soft); color: var(--primary-ink, var(--primary)); }
    html.dark .wa-upf-tag[data-tone="fair"] { color: var(--ter-amber-text); }
    html.dark .wa-upf-tag[data-tone="blue"] { color: var(--primary-bright, #8B9FAF); }

    /* NOVA group rows — status lives in the numbered circle, never a left stripe. */
    .wa-nova-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
