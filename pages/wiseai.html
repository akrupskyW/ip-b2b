      font-size: 9px; font-weight: 800; background: var(--sec-green-10); color: var(--sec-green-text);
      box-shadow: 0 1px 6px rgba(8,12,20,0.35);
    }
    .wa-cmp-toppill.tp-mid { background: var(--ter-amber-10); color: var(--ter-amber-text); }
    .wa-cmp-toppill.tp-low { background: var(--sec-red-10); color: var(--sec-red-text); }

    /* Circular WISEscore gauge floating in the tile centre */
    .wa-cmp-gauge {
      position: absolute; z-index: 3; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: 96px; height: 96px; border: none; padding: 0; cursor: pointer; border-radius: 50%;
      background: radial-gradient(circle at center, rgba(8,12,20,0.55) 0%, rgba(8,12,20,0.32) 60%, rgba(8,12,20,0) 100%);
      transition: transform 0.14s ease;
    }
    .wa-cmp-gauge:hover { transform: translate(-50%, -50%) scale(1.05); }
    .wa-cmp-gauge:active { transform: translate(-50%, -50%) scale(0.95); }
    .wa-cmp-gauge:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .wa-cmp-gauge-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .wa-cmp-gauge-track { fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 7; }
    .wa-cmp-gauge-arc { fill: none; stroke: var(--gauge-color, var(--sec-green)); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    .wa-cmp-gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wa-cmp-gauge-num { font-size: 1.9rem; font-weight: 800; color: #fff; line-height: 1; letter-spacing: -0.02em; }
    .wa-cmp-gauge-lbl { margin-top: 2px; font-size: 7.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255,255,255,0.85); }

    /* Metric rows */
    .wa-cmp-rail-metric { display: flex; flex-direction: column; gap: 3px; }
    .wa-cmp-rail-lead { display: flex; align-items: center; gap: 6px; }
    .wa-cmp-rail-ic {
      width: 22px; height: 22px; flex: 0 0 auto; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--mic, var(--primary)) 15%, transparent); color: var(--mic, var(--primary)); cursor: pointer;
    }
    .wa-cmp-rail-ic .material-symbols-outlined { font-size: 15px; }
    .wa-cmp-rail-name { font-size: 0.78rem; font-weight: 600; color: var(--text); }
    .wa-cmp-rail-desc { font-size: 9.5px; color: var(--text-subtle); line-height: 1.4; padding-left: 28px; }
    .wa-cmp-metric-cell { display: flex; align-items: center; gap: 8px; min-width: 0; height: 100%; }
    .wa-cmp-metric-val { font-size: 11px; font-weight: 700; color: var(--text); width: 22px; text-align: right; flex-shrink: 0; }
    .wa-cmp-bar-outer { position: relative; flex: 1 1 0; min-width: 16px; height: 6px; border-radius: 9999px; background: color-mix(in srgb, var(--text-subtle) 22%, transparent); overflow: hidden; }
    .wa-cmp-bar-fill { display: block; height: 100%; width: 0; border-radius: 9999px; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    .wa-cmp-bar-fill.g-a, .wa-cmp-bar-fill.g-b { background: var(--sec-green); }
    .wa-cmp-bar-fill.g-c { background: var(--ter-amber); }
    .wa-cmp-bar-fill.g-d { background: var(--sec-red); }
    .wa-cmp-grade { width: 28px; flex-shrink: 0; text-align: center; padding: 2px 0; border-radius: 6px; font-size: 10px; font-weight: 800; }
    .wa-cmp-grade.g-a, .wa-cmp-grade.g-b { background: var(--sec-green-10); color: var(--sec-green-text); }
    .wa-cmp-grade.g-c { background: var(--ter-amber-10); color: var(--ter-amber-text); }
    .wa-cmp-grade.g-d { background: var(--sec-red-10); color: var(--sec-red-text); }

    /* Insight row */
    .wa-cmp-insight-head { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--primary); }
    .wa-cmp-insight-head .material-symbols-outlined { font-size: 13px; color: #C9A227; }
    .wa-cmp-insight-body { font-size: 11px; color: var(--text-muted); line-height: 1.45; margin-top: 3px; }
    .wa-cmp-foot { display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: var(--text-subtle); line-height: 1.5; }
    .wa-cmp-foot .material-symbols-outlined { font-size: 15px; flex: 0 0 auto; margin-top: 1px; }
    @media (prefers-reduced-motion: reduce) {
      .wa-cmp-gauge-arc, .wa-cmp-bar-fill { transition-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <!-- Hidden host for the shared menu controls (mirrors studio-ai.html). -->
  <div id="topbar-row" hidden aria-hidden="true">
    <button type="button" id="topbar-menu-toggle" class="topbar-menu-toggle" title="Collapse menu to icons" aria-label="Collapse menu to icons" aria-pressed="false"><span class="material-symbols-outlined">chevron_left</span></button>
    <button type="button" class="topbar-appearance-btn" id="topbar-appearance-btn" title="Appearance" aria-label="Appearance settings" aria-haspopup="true" aria-expanded="false"><span class="material-symbols-outlined">crossword</span></button>
    <div class="topbar-profile has-dot" id="topbar-profile" title="Arthur Krupsky · akrupsky@wisecode.ai" data-action="user-menu" role="button" tabindex="0" aria-label="User menu">AK</div>
  </div>

  <div id="chat-shell-wrap" class="menu-brand-integrated">
    <!-- Left navigation module (shared WISE app nav) -->
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>

    <!-- Chat + result panes share the shell's "modules" grid area.
         `modules-sticky` is permanent here: the docked History (left) and Turns
         (right) modules ONLY ever render as tucked "sticky" drawers behind the
         chat — the old free-standing "breakout" presentation is gone. -->
    <div id="modules-row" class="modules-sticky">
      <!-- 1 · WISEai chat — the ONE shared WISEai chat module (js/wiseai-chat.js). -->
      <main class="wa-chat" id="wa-chat" data-pr-fill></main>

      <!-- 2 · Results & Details pane — food results, food-detail cards, reports. -->
      <section class="wa-pane" id="wa-results" aria-label="Results & Details">
        <div class="wa-pane-top">
          <span class="wa-pane-nav-count" id="wa-results-count" data-nav-count aria-live="polite"></span>
          <div class="wa-pane-top-right">
            <span class="wa-pane-nav-btns" id="wa-results-navbtns"></span>
            <div class="wa-pane-controls">
              <div class="panel-more-wrap" data-pane-more="results">
                <button type="button" class="panel-more-btn" title="More options" aria-haspopup="menu" aria-expanded="false" aria-label="More options"><span class="material-symbols-outlined">more_vert</span></button>
                <div class="topbar-popover hidden" role="menu">
                  <button type="button" class="topbar-menu-item" data-pane-act="min" hidden><span class="material-symbols-outlined topbar-menu-icon">close_fullscreen</span><span class="pane-min-label">Minimize to chips</span></button>
                  <div class="topbar-menu-divider" data-pane-min-div hidden></div>
                  <button type="button" class="topbar-menu-item" data-pane-act="export"><span class="material-symbols-outlined topbar-menu-icon">download</span><span>Export</span></button>
                  <button type="button" class="topbar-menu-item" data-pane-act="share"><span class="material-symbols-outlined topbar-menu-icon">share</span><span>Share</span></button>
                  <div class="topbar-menu-divider"></div>
                  <button type="button" class="topbar-menu-item topbar-menu-item--danger" data-pane-act="close"><span class="material-symbols-outlined topbar-menu-icon">close</span><span>Close pane</span></button>
                </div>
              </div>
              <button type="button" class="panel-width-toggle-btn" data-pane-width="results" aria-pressed="false" title="Width (single) — tap to widen" aria-label="Results pane width"><span class="material-symbols-outlined">width_normal</span></button>
            </div>
          </div>
        </div>
        <div class="wa-pane-nav-track" id="wa-results-track" role="tablist" aria-label="Results outputs"></div>
        <div class="wa-pane-body" id="wa-results-body"></div>
      </section>

      <!-- 3 · Visuals pane — charts, graphs & trends. -->
      <section class="wa-pane" id="wa-visuals" aria-label="Visuals">
        <div class="wa-pane-top">
          <span class="wa-pane-nav-count" id="wa-visuals-count" data-nav-count aria-live="polite"></span>
          <div class="wa-pane-top-right">
            <span class="wa-pane-nav-btns" id="wa-visuals-navbtns"></span>
            <div class="wa-pane-controls">
              <div class="panel-more-wrap" data-pane-more="visuals">
                <button type="button" class="panel-more-btn" title="More options" aria-haspopup="menu" aria-expanded="false" aria-label="More options"><span class="material-symbols-outlined">more_vert</span></button>
                <div class="topbar-popover hidden" role="menu">
                  <button type="button" class="topbar-menu-item" data-pane-act="min" hidden><span class="material-symbols-outlined topbar-menu-icon">close_fullscreen</span><span class="pane-min-label">Minimize to chips</span></button>
                  <div class="topbar-menu-divider" data-pane-min-div hidden></div>
                  <button type="button" class="topbar-menu-item" data-pane-act="export"><span class="material-symbols-outlined topbar-menu-icon">download</span><span>Export</span></button>
                  <button type="button" class="topbar-menu-item" data-pane-act="share"><span class="material-symbols-outlined topbar-menu-icon">share</span><span>Share</span></button>
                  <div class="topbar-menu-divider"></div>
                  <button type="button" class="topbar-menu-item topbar-menu-item--danger" data-pane-act="close"><span class="material-symbols-outlined topbar-menu-icon">close</span><span>Close pane</span></button>
                </div>
              </div>
              <button type="button" class="panel-width-toggle-btn" data-pane-width="visuals" aria-pressed="false" title="Width (single) — tap to widen" aria-label="Visuals pane width"><span class="material-symbols-outlined">width_normal</span></button>
            </div>
          </div>
        </div>
        <div class="wa-pane-nav-track" id="wa-visuals-track" role="tablist" aria-label="Visuals outputs"></div>
        <div class="wa-pane-body" id="wa-visuals-body"></div>
      </section>

      <!-- 4 · Unified pane — Results & Visuals merged into ONE module. Hidden
           unless the chat's "Merge outputs into one panel" switch is on. Its
           thumbnail rail is grouped (Results · | · Visuals), split by a line
           divider; clicking a thumbnail reveals that one output below. -->
      <section class="wa-pane wa-pane--unified" id="wa-unified" aria-label="Outputs (merged)">
        <div class="wa-pane-top">
          <span class="wa-pane-nav-count" id="wa-unified-count" data-nav-count aria-live="polite"></span>
          <div class="wa-pane-top-right">
            <span class="wa-pane-nav-btns" id="wa-unified-navbtns"></span>
            <div class="wa-pane-controls">
              <div class="panel-more-wrap" data-pane-more="unified">
                <button type="button" class="panel-more-btn" title="More options" aria-haspopup="menu" aria-expanded="false" aria-label="More options"><span class="material-symbols-outlined">more_vert</span></button>
                <div class="topbar-popover hidden" role="menu">
                  <button type="button" class="topbar-menu-item" data-pane-act="split"><span class="material-symbols-outlined topbar-menu-icon">splitscreen</span><span>Split into two panels</span></button>
                  <div class="topbar-menu-divider"></div>
                  <button type="button" class="topbar-menu-item" data-pane-act="min" hidden><span class="material-symbols-outlined topbar-menu-icon">close_fullscreen</span><span class="pane-min-label">Minimize to chips</span></button>
                  <div class="topbar-menu-divider" data-pane-min-div hidden></div>
                  <button type="button" class="topbar-menu-item" data-pane-act="export"><span class="material-symbols-outlined topbar-menu-icon">download</span><span>Export</span></button>
                  <button type="button" class="topbar-menu-item" data-pane-act="share"><span class="material-symbols-outlined topbar-menu-icon">share</span><span>Share</span></button>
                  <div class="topbar-menu-divider"></div>
                  <button type="button" class="topbar-menu-item topbar-menu-item--danger" data-pane-act="close"><span class="material-symbols-outlined topbar-menu-icon">close</span><span>Close pane</span></button>

  <!-- Appearance + profile popovers for the nav footer (mirrors studio-ai.html). -->
  <script>
    (function () {
      function applyChatTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('wise-theme', theme); } catch (_) {}
      }
      window.toggleChatTheme = function () {
        applyChatTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
      };
      (function bootTheme() {
        let theme = 'light';
        try { theme = localStorage.getItem('wise-theme') || (localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light'); } catch (_) {}
        applyChatTheme(theme === 'dark' ? 'dark' : 'light');
      })();

      let activePopover = null, activeAnchor = null;
      function closePopover() {
        if (!activePopover) return;
        activeAnchor?.classList.remove('is-open');
        activeAnchor?.setAttribute('aria-expanded', 'false');
        activePopover.classList.remove('open');
        const p = activePopover;
        setTimeout(() => p.remove(), 210);
        activePopover = null; activeAnchor = null;
      }
      function positionWisePopover(pop, anchor) {
        if (window.isMenuFooterAnchor?.(anchor)) window.positionPopoverInMenuPanel?.(pop, anchor);
        else window.positionPopoverForTopbar?.(pop, anchor);
      }

      function renderAppearanceBody(pop) {
        pop.innerHTML = window.buildAppearanceBody({
          showPivot: true,
          isPivoted: !!window.isMenuPivoted?.(),
          isDark: document.documentElement.classList.contains('dark'),
          showWISEaiDock: false,
        });
      }
      function openAppearancePopover(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        renderAppearanceBody(pop);
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open'); anchor.setAttribute('aria-expanded', 'true');

        window.wireAppearancePopover(pop, {
          render: () => renderAppearanceBody(pop),
          onClose: closePopover,
          togglePivot: () => window.toggleMenuPivot?.(),
          toggleTheme: () => window.toggleChatTheme?.(),
        });
      }

      function openUserMenu(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        pop.innerHTML = window.buildUserMenuBody({ name: 'Arthur Krupsky' });
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open');
        pop.addEventListener('click', (ev) => {
          const profile = ev.target.closest('[data-pop-action="profile"]');
          if (profile && pop.contains(profile)) { ev.stopPropagation(); location.href = 'profile.html'; return; }
          const invoices = ev.target.closest('[data-pop-action="invoices"]');
          if (invoices && pop.contains(invoices)) { ev.stopPropagation(); location.href = 'invoices.html'; return; }
          const signout = ev.target.closest('[data-pop-action="signout"]');
          if (signout && pop.contains(signout)) { ev.stopPropagation(); location.href = 'login.html'; return; }
          if (ev.target.closest('.wise-popover-header, .wise-popover-divider, .wise-popover-actions, .wise-pop-vline')) { ev.stopPropagation(); return; }
          closePopover();
        });
      }

      document.getElementById('topbar-appearance-btn')?.addEventListener('click', (e) => { e.stopPropagation(); openAppearancePopover(e.currentTarget); });
      document.getElementById('topbar-profile')?.addEventListener('click', (e) => { e.stopPropagation(); openUserMenu(e.currentTarget); });
      document.addEventListener('wise:menu-footer-layout', (e) => openAppearancePopover(e.detail.anchor));
      document.addEventListener('wise:menu-footer-profile', (e) => openUserMenu(e.detail.anchor));
      document.addEventListener('click', (e) => {
        if (activePopover && !activePopover.contains(e.target) && !activeAnchor?.contains(e.target)) closePopover();
      });
      window.addEventListener('resize', closePopover);
    })();
  </script>
