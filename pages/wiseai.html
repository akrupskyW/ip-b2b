    /* ═════════ Helpers ═════════ */
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    const fmtScore = (n) => (Math.round(n * 100) / 100).toFixed(2);

    /* Result panes ------------------------------------------------------------ */
    const paneEl = { results: document.getElementById('wa-results'), visuals: document.getElementById('wa-visuals'), unified: document.getElementById('wa-unified') };
    const paneBody = { results: document.getElementById('wa-results-body'), visuals: document.getElementById('wa-visuals-body'), unified: document.getElementById('wa-unified-body') };
    const paneTitle = { results: document.getElementById('wa-results-title'), visuals: document.getElementById('wa-visuals-title'), unified: null };
    const paneMeta = { results: document.getElementById('wa-results-meta'), visuals: document.getElementById('wa-visuals-meta'), unified: null };
    /* Top-bar carousel bits: the position counter (left) and the prev/next/min
       button group (right cluster) live in .wa-pane-top; the thumbnail rail is
       its own standalone strip below. */
    const paneCount = { results: document.getElementById('wa-results-count'), visuals: document.getElementById('wa-visuals-count'), unified: document.getElementById('wa-unified-count') };
    const paneNavBtns = { results: document.getElementById('wa-results-navbtns'), visuals: document.getElementById('wa-visuals-navbtns'), unified: document.getElementById('wa-unified-navbtns') };
    const paneTrack = { results: document.getElementById('wa-results-track'), visuals: document.getElementById('wa-visuals-track'), unified: document.getElementById('wa-unified-track') };
    const paneMin = { results: false, visuals: false, unified: false };  /* rail minimized to intent chips */

    /* ── Merged mode ──────────────────────────────────────────────────────────
       Toggled from the chat's three-dot "Merge outputs into one panel" switch.
       When ON, every result/visual block is pulled into the single #wa-unified
       module, whose one thumbnail rail is grouped (Results · | · Visuals). The
       two source panes are hidden; flipping it OFF sends each block home. */
    let mergedMode = false;
    const PANE_GROUPS = ['results', 'visuals'];
    const PANE_GROUP_LABEL = { results: 'Results & Details', visuals: 'Visuals' };
    const PANE_GROUP_ICON = { results: 'table_chart', visuals: 'insights' };

    /* Append a result/chart into a pane so the module keeps GROWING as the
       conversation surfaces more — each answer stacks below the previous one.
       Each block carries its own title/byline, so nothing is promoted into a
       pane masthead (the pane has none); the body just accumulates.
       Returns the first appended block so we can reveal it. */
    function openPane(which, { html, title, meta } = {}) {
      /* While merged, results/visuals blocks flow into the single unified body
         (tagged with their origin group so the rail can group + un-merge them). */
      const routed = mergedMode && (which === 'results' || which === 'visuals');
      const dest = routed ? 'unified' : which;
      const el = paneEl[dest];
      if (!el) return;
      if (title != null && paneTitle[dest]) paneTitle[dest].textContent = title;
      if (meta != null && paneMeta[dest]) paneMeta[dest].textContent = meta;
      let firstAdded = null;
      if (html != null) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        while (tmp.firstChild) {
          const node = tmp.firstChild;
          if (routed && node.nodeType === 1) node.dataset.origin = which;
          paneBody[dest].appendChild(node);
          if (!firstAdded && node.nodeType === 1) firstAdded = node;
        }
      }
      /* Activate search/sort/pagination on any table that just landed. */
      paneBody[dest].querySelectorAll('.wa-tbl:not([data-ready])').forEach((tbl) => initTable(tbl));
      /* Animate any compare board (gauges + metric bars) that just landed. */
      paneBody[dest].querySelectorAll('.wa-cmp:not([data-ready])').forEach((cmp) => initCompare(cmp));
      if (!el.classList.contains('is-open')) {
        el.classList.remove('is-open'); void el.offsetWidth; /* replay entrance */
        el.classList.add('is-open');
      }
      /* Rebuild the thumbnail rail; make the just-surfaced block the active slide
         once the pane holds 2+ outputs. */
      if (dest === 'unified') refreshUnifiedCarousel({ activate: firstAdded });
      else refreshPaneCarousel(which, { activate: firstAdded });
      /* In carousel mode only one block shows, so reset the scroll to its top;
         otherwise scroll the newest result into view so growth stays visible. */
      if (firstAdded) {
        if (paneBody[dest].classList.contains('is-carousel')) {
          paneBody[dest].scrollTop = 0;
        } else {
          requestAnimationFrame(() => firstAdded.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      }
    }

    /* ── Pane carousel: horizontal thumbnail rail + one-at-a-time output ──
       Treat every top-level .wa-block in a pane body as a slide. With a single
       block the pane behaves exactly as before; with 2+ the rail turns on and
       only the active block renders. */
    function paneSlideLabel(block, which, i) {
      const pick = (sel, stripIcons) => {
        const el = block.querySelector(sel);
        if (!el) return '';
        if (stripIcons) {
          const c = el.cloneNode(true);
          c.querySelectorAll('.material-symbols-outlined, .material-symbols-outlined').forEach((n) => n.remove());
          return c.textContent.trim();
        }
        return el.textContent.trim();
      };
      return pick('.wa-report-title') || pick('.wa-dhero-name') || pick('.wa-sec-title', true)
        || block.dataset.slideTitle || ((which === 'visuals' ? 'Chart ' : 'Result ') + (i + 1));
    }

    function paneBlocks(which) {
      const body = paneBody[which];
      if (!body) return [];
      return Array.from(body.children).filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'));
    }

    /* Sync the minimize/expand toggle (now a three-dot menu item) with the rail's
       current mode: swap its icon + label between minimize and expand. */
    function updateMinBtn(which) {
      const item = paneEl[which] && paneEl[which].querySelector('[data-pane-act="min"]');
      if (!item) return;
      const min = !!paneMin[which];
      const ic = item.querySelector('.material-symbols-outlined');
      const lbl = item.querySelector('.pane-min-label');
      const txt = min ? 'Expand output cards' : 'Minimize to chips';
      if (ic) ic.textContent = min ? 'open_in_full' : 'close_fullscreen';
      if (lbl) lbl.textContent = txt;
      item.setAttribute('aria-label', txt);
    }

    /* Show/hide the minimize menu item (and its divider) — it's only meaningful
       while the pane is in carousel mode (2+ outputs to collapse into chips). */
    function setPaneMinItemVisible(which, on) {
      const root = paneEl[which];
      if (!root) return;
      const item = root.querySelector('[data-pane-act="min"]');
      const div = root.querySelector('[data-pane-min-div]');
      if (item) item.hidden = !on;
      if (div) div.hidden = !on;
    }

    function setPaneSlide(which, idx, { animate = true, scrollNav = false } = {}) {
      const blocks = paneBlocks(which);
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      if (!blocks.length) return;
      idx = Math.max(0, Math.min(idx, blocks.length - 1));
      blocks.forEach((b, i) => b.classList.toggle('is-active', i === idx));
      if (paneBody[which]) paneBody[which].scrollTop = 0;
      /* Keep the editorial masthead in sync with the visible output. */
      if (paneBody[which] && paneBody[which].classList.contains('is-carousel')) {
        const active = blocks[idx];
        if (paneTitle[which]) paneTitle[which].textContent = paneSlideLabel(active, which, idx);
        if (paneMeta[which]) paneMeta[which].textContent = active.dataset.slideMeta || '';
      }
      if (animate) {
        const active = blocks[idx];
        active.style.animation = 'none'; void active.offsetWidth; active.style.animation = '';
      }
      if (track) {
        const items = track.querySelectorAll('[data-slide]');
        items.forEach((it) => {
          const on = Number(it.dataset.slide) === idx;
          it.classList.toggle('is-active', on);
          it.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        if (scrollNav && items[idx]) items[idx].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      /* Position counter (e.g. "Chart 2 / 4") + prev/next availability. */
      const noun = which === 'visuals' ? 'Chart' : which === 'unified' ? 'Output' : 'Result';
      const count = paneCount[which];
      if (count) count.innerHTML = `${noun} <b>${idx + 1}</b> / ${blocks.length}`;
      if (btns) {
        const prev = btns.querySelector('[data-nav="prev"]');
        const next = btns.querySelector('[data-nav="next"]');
        if (prev) prev.disabled = idx <= 0;
        if (next) next.disabled = idx >= blocks.length - 1;
      }
    }

    function refreshPaneCarousel(which, { activate } = {}) {
      const body = paneBody[which];
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      const count = paneCount[which];
      if (!body || !track || !btns) return;
      const blocks = paneBlocks(which);
      /* Separate panes run in carousel mode from the very FIRST output — the rail,
         counter ("Result 1 / 1") and nav all show as soon as there's one block, so
         you always land "on the first one". Only a truly empty pane resets. */
      if (blocks.length < 1) {
        body.classList.remove('is-carousel');
        track.classList.remove('is-on', 'is-min');
        track.innerHTML = '';
        btns.innerHTML = '';
        if (count) count.innerHTML = '';
        setPaneMinItemVisible(which, false);
        blocks.forEach((b) => b.classList.remove('is-active'));
        return;
      }
      body.classList.add('is-carousel');
      track.classList.add('is-on');
      blocks.forEach((b, i) => { b.dataset.slideIndex = i; });
      /* Preserve the current slide unless the caller points at a new block. */
      let activeIdx = blocks.findIndex((b) => b.classList.contains('is-active'));
      if (activate instanceof Element) {
        const idx = blocks.indexOf(activate);
        if (idx >= 0) activeIdx = idx;
      }
      if (activeIdx < 0) activeIdx = blocks.length - 1;
      /* NOTE: the preview clones the block's own HTML, which for result blocks
         contains <button>/<input> controls. A <button> may not nest interactive
         content, so the wrapper is a <div role="button"> (same trick as the
         in-chat .sc-surface-card) and the clone is made `inert` so its controls
         can't be focused or spill out of the wrapper. */
      const thumbs = blocks.map((b, i) =>
        `<div class="wa-pane-thumb-item" data-slide="${i}" role="tab" tabindex="0" aria-selected="false" title="${esc(paneSlideLabel(b, which, i))}">
          <span class="wa-pane-thumb-num">${i + 1}</span>
          <span class="wa-pane-thumb-preview"><span class="wa-pane-thumb-inner" inert>${b.innerHTML}</span></span>
          <span class="wa-pane-thumb-label">${esc(paneSlideLabel(b, which, i))}</span>
        </div>`).join('');
      track.innerHTML = thumbs;
      btns.innerHTML =
        `<button type="button" class="wa-pane-nav-arrow" data-nav="prev" aria-label="Previous output"><span class="material-symbols-outlined">chevron_left</span></button>
         <button type="button" class="wa-pane-nav-arrow" data-nav="next" aria-label="Next output"><span class="material-symbols-outlined">chevron_right</span></button>`;
      track.classList.toggle('is-min', !!paneMin[which]);
      /* The minimize toggle now lives in the three-dot menu — reveal it (and its
         divider) only while the pane is in carousel mode, and sync its label. */
      setPaneMinItemVisible(which, true);
      updateMinBtn(which);
      setPaneSlide(which, activeIdx, { animate: false, scrollNav: true });
    }

    /* ── Unified (merged) carousel ──
       The unified body holds every block from BOTH source panes (each tagged
       with data-origin). Its single rail is grouped by origin — Results first,
       then a vertical divider, then Visuals — so the two "carousels" read as
       distinct sections of one strip. Clicking any thumbnail reveals that one
       output below. Reuses setPaneSlide for slide activation + the counter. */
    function refreshUnifiedCarousel({ activate } = {}) {
      const which = 'unified';
      const body = paneBody[which];
      const track = paneTrack[which];
      const btns = paneNavBtns[which];
      const count = paneCount[which];
      if (!body || !track || !btns) return;
      /* Keep blocks ordered by group (results → visuals) so grouping stays clean
         even as new outputs append at the end of the body. Stable within group. */
      const blocks = Array.from(body.children).filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'));
      blocks.sort((a, b) => {
        const ra = PANE_GROUPS.indexOf(a.dataset.origin || 'results');
        const rb = PANE_GROUPS.indexOf(b.dataset.origin || 'results');
        return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
      });
      blocks.forEach((b) => body.appendChild(b)); /* re-flow into grouped order */

      if (blocks.length < 2) {
        body.classList.remove('is-carousel');
        track.classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked');
        track.innerHTML = '';
        btns.innerHTML = '';
        if (count) count.innerHTML = '';
        setPaneMinItemVisible(which, false);
        blocks.forEach((b) => b.classList.remove('is-active'));
        if (blocks.length === 1) blocks[0].classList.add('is-active');
        return;
      }
      body.classList.add('is-carousel');
      /* Merged rail = two STACKED rows of small intent-style pill chips (one row
         per group), matching the chat transcript's chips — not the big preview
         thumbnails the single-pane rails use. */
      track.classList.add('is-on', 'is-grouped', 'is-stacked');
      track.classList.remove('is-min');
      blocks.forEach((b, i) => { b.dataset.slideIndex = i; });

      let activeIdx = blocks.findIndex((b) => b.classList.contains('is-active'));
      if (activate instanceof Element) {
        const idx = blocks.indexOf(activate);
        if (idx >= 0) activeIdx = idx;
      }
      if (activeIdx < 0) activeIdx = blocks.length - 1;

      /* Group blocks by origin, preserving global slide indices for setPaneSlide. */
      const groups = new Map();
      blocks.forEach((b, i) => {
        const grp = b.dataset.origin || 'results';
        if (!groups.has(grp)) groups.set(grp, []);
        groups.get(grp).push({ b, i });
      });
      let html = '';
      PANE_GROUPS.forEach((grp) => {
        const items = groups.get(grp);
        if (!items || !items.length) return;
        const chips = items.map(({ b, i }) => {
          const label = paneSlideLabel(b, grp, i);
          /* A <div role="tab"> (not a <button>) so the preview clone — which for
             result blocks holds <button>/<input> controls — can nest safely; the
             clone is `inert` so nothing inside it is focusable. Mirrors the
             transcript's .sc-surface-card. */
          return `<div class="wa-merge-chip" data-slide="${i}" role="tab" tabindex="0" aria-selected="false" title="${esc(label)}">
            <span class="wa-merge-chip-thumb"><span class="wa-merge-chip-thumb-inner" inert>${b.innerHTML}</span></span>
            <span class="wa-merge-chip-label">${esc(label)}</span>
          </div>`;
        }).join('');
        html += `<div class="wa-merge-group">
          <span class="wa-merge-group-label"><span class="material-symbols-outlined">${esc(PANE_GROUP_ICON[grp] || 'category')}</span>${esc(PANE_GROUP_LABEL[grp] || grp)}</span>
          <div class="wa-merge-chips">${chips}</div>
        </div>`;
      });
      track.innerHTML = html;
      btns.innerHTML =
        `<button type="button" class="wa-pane-nav-arrow" data-nav="prev" aria-label="Previous output"><span class="material-symbols-outlined">chevron_left</span></button>
         <button type="button" class="wa-pane-nav-arrow" data-nav="next" aria-label="Next output"><span class="material-symbols-outlined">chevron_right</span></button>`;
      /* The chip rail IS the compact form, so the "minimize to chips" item is
         meaningless here — keep it hidden while merged. */
      setPaneMinItemVisible(which, false);
      setPaneSlide(which, activeIdx, { animate: false, scrollNav: true });
    }

    /* Sync the chat menu's "Merge outputs" switch with the current state. */
    let mergeMenuItem = null;
    function syncMergeMenu() {
      if (!mergeMenuItem) return;
      mergeMenuItem.classList.toggle('is-on', mergedMode);
      mergeMenuItem.setAttribute('aria-checked', mergedMode ? 'true' : 'false');
    }

    /* Flip between the two-pane and one-merged-pane layouts, carrying every block
       across with it so nothing is lost either way. */
    function applyMergeMode(on) {
      on = !!on;
      if (on === mergedMode) { syncMergeMenu(); return; }
      mergedMode = on;
      const row = document.getElementById('modules-row');
      if (row) row.classList.toggle('outputs-merged', on);

      if (on) {
        /* Pull each source pane's blocks into the unified body, tagged by origin,
           results first then visuals (grouped order). */
        PANE_GROUPS.forEach((grp) => {
          const src = paneBody[grp];
          if (!src) return;
          Array.from(src.children)
            .filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'))
            .forEach((b) => { b.dataset.origin = grp; b.classList.remove('is-active'); paneBody.unified.appendChild(b); });
          /* Reset the now-empty source pane back to a clean closed state. */
          src.classList.remove('is-carousel');
          if (paneTrack[grp]) { paneTrack[grp].innerHTML = ''; paneTrack[grp].classList.remove('is-on', 'is-min'); }
          if (paneNavBtns[grp]) paneNavBtns[grp].innerHTML = '';
          if (paneCount[grp]) paneCount[grp].innerHTML = '';
          paneEl[grp]?.classList.remove('is-open', 'pane-wide', 'pane-triple');
          const wb = document.querySelector(`[data-pane-width="${grp}"]`);
          if (wb) syncPaneWidthBtn(wb, 0);
        });
        const hasContent = paneBody.unified.querySelector('.wa-block');
        if (hasContent) {
          paneEl.unified.classList.remove('is-open'); void paneEl.unified.offsetWidth;
          paneEl.unified.classList.add('is-open');
        }
        refreshUnifiedCarousel({ activate: paneBody.unified.querySelector('.wa-block') });
      } else {
        /* Send every block home to its origin pane, preserving order. */
        Array.from(paneBody.unified.children)
          .filter((n) => n.nodeType === 1 && n.classList.contains('wa-block'))
          .forEach((b) => {
            const grp = b.dataset.origin || 'results';
            b.classList.remove('is-active');
            (paneBody[grp] || paneBody.results).appendChild(b);
          });
        paneBody.unified.classList.remove('is-carousel');
        if (paneTrack.unified) { paneTrack.unified.innerHTML = ''; paneTrack.unified.classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked'); }
        if (paneNavBtns.unified) paneNavBtns.unified.innerHTML = '';
        if (paneCount.unified) paneCount.unified.innerHTML = '';
        paneEl.unified.classList.remove('is-open', 'pane-wide', 'pane-triple');
        const uwb = document.querySelector('[data-pane-width="unified"]');
        if (uwb) syncPaneWidthBtn(uwb, 0);
        /* Re-open each source pane that regained content + rebuild its rail. */
        PANE_GROUPS.forEach((grp) => {
          if (paneBody[grp] && paneBody[grp].querySelector('.wa-block')) {
            paneEl[grp]?.classList.remove('is-open'); void paneEl[grp]?.offsetWidth;
            paneEl[grp]?.classList.add('is-open');
            refreshPaneCarousel(grp);
          }
        });
      }
      window.WisePaneResize?.release?.([
        document.getElementById('wa-chat'),
        paneEl.results,
        paneEl.visuals,
        paneEl.unified,
      ]);
      syncMergeMenu();
    }

    /* Carousel controls live in two spots: the prev/next group up in the top bar
       (paneNavBtns) and the thumbnail strip below (paneTrack). The minimize
       toggle now lives in the three-dot menu (see the [data-pane-act] handler).
       Delegate both off the pane section so a single handler covers each. */
    Object.keys(paneEl).forEach((which) => {
      const el = paneEl[which];
      if (!el) return;
      const curSlide = () => Number(paneTrack[which]?.querySelector('[data-slide].is-active')?.dataset.slide || 0);
      el.addEventListener('click', (e) => {
        const ctrl = e.target.closest('[data-nav]');
        if (ctrl && el.contains(ctrl)) {
          const act = ctrl.dataset.nav;
          setPaneSlide(which, curSlide() + (act === 'next' ? 1 : -1), { animate: true, scrollNav: true });
          return;
        }
        const it = e.target.closest('[data-slide]');
        if (!it || !el.contains(it)) return;
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
      });
      el.addEventListener('keydown', (e) => {
        const track = paneTrack[which];
        if (!track || !track.contains(e.target)) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); setPaneSlide(which, curSlide() + 1, { animate: true, scrollNav: true }); return; }
        if (e.key === 'ArrowLeft') { e.preventDefault(); setPaneSlide(which, curSlide() - 1, { animate: true, scrollNav: true }); return; }
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const it = e.target.closest('[data-slide]');
        if (!it) return;
        e.preventDefault();
        setPaneSlide(which, Number(it.dataset.slide), { animate: true, scrollNav: true });
      });
    });

    function closePane(which) {
      const el = paneEl[which];
      if (el) el.classList.remove('is-open', 'pane-wide', 'pane-triple');
      if (paneBody[which]) { paneBody[which].innerHTML = ''; paneBody[which].classList.remove('is-carousel'); }
      if (paneTrack[which]) { paneTrack[which].innerHTML = ''; paneTrack[which].classList.remove('is-on', 'is-min', 'is-grouped', 'is-stacked'); }
      if (paneNavBtns[which]) paneNavBtns[which].innerHTML = '';
      if (paneCount[which]) paneCount[which].innerHTML = '';
      paneMin[which] = false;
      setPaneMinItemVisible(which, false);
      updateMinBtn(which);
      const wb = document.querySelector(`[data-pane-width="${which}"]`);
      if (wb) syncPaneWidthBtn(wb, 0);
      /* Closing the merged panel closes ALL outputs and drops merged mode, so the
         next surfaced output lands back in the normal two-pane layout. */
      if (which === 'unified') {
        mergedMode = false;
        document.getElementById('modules-row')?.classList.remove('outputs-merged');
        syncMergeMenu();
      }
      /* Drop any drag-pinned widths so the remaining modules reflow to fill the
         freed space — and once the last pane is gone, the chat expands back to
         full-screen (its stylesheet default) instead of staying docked at the
         width it was dragged to. */
      window.WisePaneResize?.release?.([
        document.getElementById('wa-chat'),
        paneEl.results,
        paneEl.visuals,
        paneEl.unified,
      ]);
    }

    /* Per-pane three-dot menu + width control (their own, independent of the chat) */
    const PANE_W_ICONS = ['width_normal', 'width_wide', 'width_full'];
    const PANE_W_TITLES = ['Width (single) — tap to widen', 'Width (double) — tap to widen', 'Width (triple) — tap to reset'];
    function syncPaneWidthBtn(btn, tier) {
      btn.classList.toggle('is-on', tier >= 1);
      btn.setAttribute('aria-pressed', tier >= 1 ? 'true' : 'false');
      btn.title = PANE_W_TITLES[tier];
      const ic = btn.querySelector('.material-symbols-outlined');
      if (ic) ic.textContent = PANE_W_ICONS[tier];
    }
    document.querySelectorAll('[data-pane-width]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const which = btn.dataset.paneWidth;
        const el = paneEl[which];
        const cur = el.classList.contains('pane-triple') ? 2 : el.classList.contains('pane-wide') ? 1 : 0;
        const next = (cur + 1) % 3;
        el.classList.toggle('pane-wide', next >= 1);
        el.classList.toggle('pane-triple', next >= 2);
        syncPaneWidthBtn(btn, next);
      });
    });
    document.querySelectorAll('[data-pane-more]').forEach((wrap) => {
      const btn = wrap.querySelector('.panel-more-btn');
      const pop = wrap.querySelector('.topbar-popover');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = pop.classList.contains('hidden');
        document.querySelectorAll('[data-pane-more] .topbar-popover').forEach((p) => p.classList.add('hidden'));
        document.querySelectorAll('[data-pane-more] .panel-more-btn').forEach((b) => b.classList.remove('is-open'));
        pop.classList.toggle('hidden', !open);
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      pop.addEventListener('click', (e) => {
        const item = e.target.closest('[data-pane-act]');
        if (!item) return;
        pop.classList.add('hidden'); btn.classList.remove('is-open');
        const act = item.dataset.paneAct;
        const which = wrap.dataset.paneMore;
        if (act === 'min') {
          paneMin[which] = !paneMin[which];
          paneTrack[which]?.classList.toggle('is-min', paneMin[which]);
          updateMinBtn(which);
          /* Re-scroll the active chip/card into view after the layout change. */
          const idx = Number(paneTrack[which]?.querySelector('.wa-pane-thumb-item.is-active')?.dataset.slide || 0);
          setPaneSlide(which, idx, { animate: false, scrollNav: true });
        }
        else if (act === 'split') applyMergeMode(false);
        else if (act === 'close') closePane(which);
        else if (act === 'export') {
          const blob = new Blob(['WISEai export placeholder\n'], { type: 'text/plain' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `wiseai-${which}.txt`; a.click();
        } else if (act === 'share') {
          openShareModal(which);
        }
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('[data-pane-more] .topbar-popover').forEach((p) => p.classList.add('hidden'));
      document.querySelectorAll('[data-pane-more] .panel-more-btn').forEach((b) => b.classList.remove('is-open'));
    });

    /* ══════════ Share side panel ══════════
       Opened from the chat's ⋯ → Share (and any result pane's ⋯ → Share). Slides
       in from the RIGHT over the chat, reusing the shared `.wch-sidebar` shell —
       the exact same panel chrome + open/close animation as "Connect a data
       source" — and the app's own `.adm-*` form controls (pill buttons included).
       Invite brand-new users by email, search the people directory (matches
       surface their address), share with the whole org, and attach individual
       outputs from this conversation, each tagged by the pane it lives in. */
    const PANE_SHARE_TAG = { results: 'Results', visuals: 'Visuals', unified: 'Output' };
    /* Mock org directory. Entries without a `name` are addresses with no display
       name on file (shown by email, mirroring the reference design). */
    const SHARE_PEOPLE = [
      { name: 'Christopher K Knoch', email: 'cknoch@wisecode.ai' },
      { name: 'Craig Anderson', email: 'canderson@wisecode.ai' },
      { name: 'Danny Webb', email: 'dwebb@wisecode.ai' },
      { name: '', email: 'edunleavy@wisecode.ai' },
      { name: '', email: 'ereyes@wisecode.ai' },
      { name: 'Priya Anand', email: 'panand@wisecode.ai' },
      { name: 'Maria Alvarez', email: 'malvarez@wisecode.ai' },
      { name: 'Aaron Bell', email: 'abell@wisecode.ai' },
      { name: 'Sophia Nguyen', email: 'snguyen@wisecode.ai' },
      { name: 'James Carter', email: 'jcarter@wisecode.ai' },
      { name: 'Olivia Martin', email: 'omartin@wisecode.ai' },
      { name: 'Liam Patel', email: 'lpatel@wisecode.ai' },
      { name: 'Grace Kim', email: 'gkim@wisecode.ai' },
      { name: 'Noah Foster', email: 'nfoster@wisecode.ai' },
    ];
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    /* Recipients live here: people (from the directory) + ad-hoc email invites. */
    const shareRecipients = [];
    /* Links created this session — powers the "Existing shares" list. */
    const shareExisting = [];
    let shareSeq = 0;
    let shareActiveIdx = -1;              /* highlighted row in the people dropdown */
    let sharePanel = null, shareScrim = null, shareEls = null, shareCloseTimer = null, shareLastFocus = null;

    function fmtShareTime(ts) {
      const d = new Date(ts);
      const date = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${date}, ${time}`;
    }

    function renderShareExisting() {
      if (!shareEls) return;
      if (!shareExisting.length) {
        shareEls.existing.innerHTML = '<div class="wa-sh-existing-empty">No active share links yet.</div>';
        return;
      }
      shareEls.existing.innerHTML = shareExisting.map((s) =>
        `<div class="wa-sh-share-row" data-share-row="${s.id}">
          <span class="wa-sh-share-ic"><span class="material-symbols-outlined">public</span></span>
          <span class="wa-sh-share-meta">${esc(fmtShareTime(s.time))} <span class="wa-sh-share-scope">· ${esc(s.scope)}</span></span>
          <span class="wa-sh-share-acts">
            <button type="button" class="wa-sh-share-act" data-share-copyrow="${s.id}" title="Copy link" aria-label="Copy link"><span class="material-symbols-outlined">content_copy</span></button>
            <button type="button" class="wa-sh-share-act" data-share-unlink="${s.id}" title="Remove share link" aria-label="Remove share link"><span class="material-symbols-outlined">link_off</span></button>
          </span>
        </div>`).join('');
    }

    /* Best-effort conversation title from the first thing you asked. */
    function conversationTitle() {
      const firstYou = host && host.querySelector('.sc-line-you .sc-line-body');
      if (firstYou) {
        const clone = firstYou.cloneNode(true);
        clone.querySelectorAll('.sc-line-meta, .sc-att-row').forEach((n) => n.remove());
        const t = (clone.textContent || '').trim();
        if (t) return t;
      }
      return 'WISEai conversation';
    }

    function personLabel(p) { return p.name || p.email; }

    /* Build the side panel once, inside the chat body (`.sc-body`) so it docks
       over the transcript exactly like the connectors panel. */
    function buildSharePanel() {
      if (sharePanel) return;
      const paneHost = host && (host.querySelector('.sc-body') || host);
      if (!paneHost) return;
      paneHost.classList.add('wch-host');
      shareScrim = document.createElement('div');
      shareScrim.className = 'wch-scrim';
      sharePanel = document.createElement('aside');
      sharePanel.className = 'wch-sidebar wch-right';
      sharePanel.id = 'wa-share-panel';
      sharePanel.setAttribute('aria-label', 'Share');
      sharePanel.innerHTML =
        '<div class="wch-head">' +
          '<span class="wa-sh-head-text"><span class="wch-head-title">Share</span><span class="wa-sh-sub" data-sub></span></span>' +
          '<button type="button" class="wch-close" title="Close" aria-label="Close"><span class="material-symbols-outlined">close</span></button>' +
        '</div>' +
        '<div class="wa-sh-body">' +
          '<form class="wa-sh-form" data-form novalidate>' +
            '<div class="adm-field"><label class="adm-field-label" for="wa-sh-title">Title</label>' +
              '<input type="text" id="wa-sh-title" class="adm-input" data-title autocomplete="off"></div>' +
            '<div class="adm-field"><label class="adm-field-label" for="wa-sh-email">Email addresses</label>' +
              '<div class="wa-sh-chips" data-emailbox data-focus="wa-sh-email">' +
                '<input type="text" id="wa-sh-email" class="wa-sh-chipinput" data-email placeholder="name@example.com" inputmode="email" autocomplete="off"></div></div>' +
            '<div class="adm-field"><label class="adm-field-label" for="wa-sh-people">People</label>' +
              '<div class="wa-sh-chips" data-peoplebox data-focus="wa-sh-people">' +
                '<input type="text" id="wa-sh-people" class="wa-sh-chipinput" data-people placeholder="Search by name or email" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list"></div>' +
              '<div class="wa-sh-menu" data-menu role="listbox" hidden></div></div>' +
            '<label class="wa-sh-check"><input type="checkbox" class="adm-check" data-org><span>Entire organization</span></label>' +
            '<div class="adm-field" data-outwrap hidden><span class="adm-field-label">Also share individually</span>' +
              '<div class="wa-sh-outs" data-outs></div></div>' +
            '<div class="adm-field"><label class="adm-field-label" for="wa-sh-msg">Message</label>' +
              '<textarea id="wa-sh-msg" class="wa-sh-textarea" data-message rows="3" placeholder="Optional note, included in the invitation email"></textarea></div>' +
          '</form>' +
          '<div class="wa-sh-done" data-done hidden>' +
            '<div class="wa-sh-created">' +
              '<div class="wa-sh-created-title">Share created</div>' +
              '<div class="wa-sh-linkrow"><input type="text" class="adm-input" data-link readonly aria-label="Share link">' +
                '<button type="button" class="adm-btn adm-btn--primary" data-copy><span class="material-symbols-outlined">content_copy</span><span data-copylabel>Copy link</span></button></div>' +
            '</div>' +
            '<div class="wa-sh-existing">' +
              '<div class="wa-sh-existing-label">Existing shares</div>' +
              '<div class="wa-sh-existing-list" data-existing></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wa-sh-foot"><button type="button" class="adm-btn adm-btn--primary" data-create>Create share link</button></div>';
      paneHost.appendChild(shareScrim);
      paneHost.appendChild(sharePanel);
      const q = (s) => sharePanel.querySelector(s);
      shareEls = {
        sub: q('[data-sub]'), form: q('[data-form]'), done: q('[data-done]'),
        titleInput: q('[data-title]'), emailBox: q('[data-emailbox]'), emailInput: q('[data-email]'),
        peopleBox: q('[data-peoplebox]'), peopleInput: q('[data-people]'), peopleMenu: q('[data-menu]'),
        org: q('[data-org]'), outputsWrap: q('[data-outwrap]'), outputs: q('[data-outs]'),
        message: q('[data-message]'), create: q('[data-create]'), link: q('[data-link]'),
        copy: q('[data-copy]'), copyLabel: q('[data-copylabel]'), existing: q('[data-existing]'),
      };
      wireSharePanel();
    }

    function renderShareChips() {
      if (!shareEls) return;
      [shareEls.emailBox, shareEls.peopleBox].forEach((box) => {
        box.querySelectorAll('.wa-sh-chip').forEach((c) => c.remove());
      });
      shareRecipients.forEach((r, i) => {
        const box = r.type === 'email' ? shareEls.emailBox : shareEls.peopleBox;
        const input = r.type === 'email' ? shareEls.emailInput : shareEls.peopleInput;
        const chip = document.createElement('span');
        chip.className = 'wa-sh-chip' + (r.invalid ? ' is-invalid' : '');
        const label = r.type === 'email' ? r.email : personLabel(r);
        chip.title = r.type === 'person' && r.name ? `${r.name} · ${r.email}` : r.email;
        chip.innerHTML = `<span class="wa-sh-chip-name">${esc(label)}</span>` +
          `<button type="button" class="wa-sh-chip-x" data-share-rm="${i}" aria-label="Remove ${esc(label)}"><span class="material-symbols-outlined">close</span></button>`;
        box.insertBefore(chip, input);
      });
    }

    function hasRecipient(email) {
      return shareRecipients.some((r) => r.email.toLowerCase() === email.toLowerCase());
    }

    function addEmailRecipient(raw) {
      const email = raw.trim().replace(/[,;]+$/, '').trim();
      if (!email || hasRecipient(email)) return;
      const known = SHARE_PEOPLE.find((p) => p.email.toLowerCase() === email.toLowerCase());
      if (known) shareRecipients.push({ type: 'person', ...known });
      else shareRecipients.push({ type: 'email', email, invalid: !EMAIL_RE.test(email) });
      renderShareChips();
    }

    function addPersonRecipient(p) {
      if (hasRecipient(p.email)) return;
      shareRecipients.push({ type: 'person', ...p });
      renderShareChips();
    }

    function closePeopleMenu() {
      if (!shareEls) return;
      shareEls.peopleMenu.hidden = true;
      shareEls.peopleInput.setAttribute('aria-expanded', 'false');
      shareActiveIdx = -1;
    }

    function renderPeopleMenu(rawQ) {
      if (!shareEls) return;
      const query = rawQ.trim().toLowerCase();
      const matches = SHARE_PEOPLE.filter((p) =>
        !hasRecipient(p.email) &&
        ((p.name && p.name.toLowerCase().includes(query)) || p.email.toLowerCase().includes(query))
      );
      if (!query && matches.length === 0) { closePeopleMenu(); return; }
      shareActiveIdx = -1;
      if (matches.length === 0) {
        shareEls.peopleMenu.innerHTML = `<div class="wa-sh-menu-empty">No people match “${esc(rawQ.trim())}”. Add “${esc(rawQ.trim())}” as an email above.</div>`;
      } else {
        shareEls.peopleMenu.innerHTML = matches.slice(0, 8).map((p) =>
          `<button type="button" class="wa-sh-person" role="option" data-share-pick="${esc(p.email)}">
            <span class="wa-sh-person-av"><span class="material-symbols-outlined">person</span></span>
            <span class="wa-sh-person-txt">
              ${p.name ? `<span class="wa-sh-person-name">${esc(p.name)}</span>` : ''}
              <span class="wa-sh-person-mail">${esc(p.email)}</span>
            </span>
          </button>`).join('');
      }
      shareEls.peopleMenu.hidden = false;
      shareEls.peopleInput.setAttribute('aria-expanded', 'true');
    }

    function renderShareOutputs() {
      if (!shareEls) return;
      if (!manifestOutputs.length) {
        shareEls.outputsWrap.hidden = true;
        shareEls.outputs.innerHTML = '';
        return;
      }
      shareEls.outputsWrap.hidden = false;
      shareEls.outputs.innerHTML = manifestOutputs.map((o) => {
        const tag = PANE_SHARE_TAG[o.which] || 'Output';
        return `<label class="wa-sh-out">
          <input type="checkbox" class="adm-check" data-share-out="${o.blockId}">
          <span class="wa-sh-out-tag">${esc(tag)}</span>
          <span class="wa-sh-out-name">${esc(o.title)}</span>
        </label>`;
      }).join('');
    }

    function onShareKey(e) {
      if (e.key !== 'Escape') return;
      if (shareEls && !shareEls.peopleMenu.hidden) { closePeopleMenu(); return; }
      closeShareModal();
    }

    function openShareModal(/* which */) {
      buildSharePanel();
      if (!sharePanel) return;
      shareLastFocus = document.activeElement;
      /* Never leave two chat overlays open at once. */
      try { chat && chat.closeConnectors && chat.closeConnectors(); } catch (_) {}
      try { chat && chat.closeTurns && chat.closeTurns(); } catch (_) {}
      shareRecipients.length = 0;
      shareActiveIdx = -1;
      const title = conversationTitle();
      shareEls.titleInput.value = title;
      shareEls.sub.textContent = title;
      shareEls.emailInput.value = '';
      shareEls.peopleInput.value = '';
      shareEls.org.checked = false;
      shareEls.message.value = '';
      renderShareChips();
      renderShareOutputs();
      closePeopleMenu();
      /* Reset from any prior success view. */
      shareEls.form.hidden = false;
      shareEls.done.hidden = true;
      shareEls.create.textContent = 'Create share link';
      clearTimeout(shareCloseTimer);
      sharePanel.classList.remove('wch-closing');
      shareScrim.classList.remove('wch-closing');
      sharePanel.classList.add('wch-open');
      shareScrim.classList.add('wch-open');
      document.addEventListener('keydown', onShareKey);
      requestAnimationFrame(() => shareEls.peopleInput.focus());
    }

    function closeShareModal() {
      if (!sharePanel) return;
      if (!sharePanel.classList.contains('wch-open') && !sharePanel.classList.contains('wch-closing')) return;
      closePeopleMenu();
      sharePanel.classList.remove('wch-open');
      shareScrim.classList.remove('wch-open');
      sharePanel.classList.add('wch-closing');
      shareScrim.classList.add('wch-closing');
      document.removeEventListener('keydown', onShareKey);
      clearTimeout(shareCloseTimer);
      shareCloseTimer = setTimeout(() => {
        sharePanel.classList.remove('wch-closing');
        shareScrim.classList.remove('wch-closing');
      }, 300);
      if (shareLastFocus && typeof shareLastFocus.focus === 'function') shareLastFocus.focus();
    }

    function createShareLink() {
      if (!shareEls) return;
      /* Commit whatever is still sitting in the inputs. */
      if (shareEls.emailInput.value.trim()) { addEmailRecipient(shareEls.emailInput.value); shareEls.emailInput.value = ''; }

      const org = shareEls.org.checked;
      const people = shareRecipients.map((r) => r.type === 'email' ? r.email : personLabel(r));
      const outIds = Array.from(shareEls.outputs.querySelectorAll('[data-share-out]:checked')).map((c) => c.dataset.shareOut);
      const outTitles = outIds.map((id) => (manifestOutputs.find((o) => o.blockId === id) || {}).title).filter(Boolean);

      const token = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
      const url = `https://wi-alpha.wisecode.ai/share/${token}`;

      /* Scope label for the "Existing shares" row. */
      const scope = org ? 'entire organization'
        : people.length ? `${people.length} ${people.length === 1 ? 'person' : 'people'}`
        : 'link only';

      shareEls.link.value = url;
      shareExisting.unshift({ id: ++shareSeq, time: Date.now(), scope, url, outputs: outTitles.length });
      renderShareExisting();

      shareEls.form.hidden = true;
      shareEls.done.hidden = false;
      shareEls.create.textContent = 'Done';
      navigator.clipboard?.writeText(url).catch(() => {});
      requestAnimationFrame(() => shareEls.link.focus());
    }

    /* Attach the panel's own listeners (called once, right after it's built). */
    function wireSharePanel() {
      if (!shareEls) return;

      /* Clicking empty space in a chip box focuses its text input. */
      [shareEls.emailBox, shareEls.peopleBox].forEach((box) => {
        box.addEventListener('mousedown', (e) => {
          if (e.target.closest('.wa-sh-chip')) return;
          if (e.target === box) { e.preventDefault(); document.getElementById(box.dataset.focus)?.focus(); }
        });
      });

      shareEls.emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',' || (e.key === ' ' && shareEls.emailInput.value.includes('@'))) {
          e.preventDefault(); addEmailRecipient(shareEls.emailInput.value); shareEls.emailInput.value = '';
        } else if (e.key === 'Backspace' && !shareEls.emailInput.value) {
          const last = [...shareRecipients].reverse().find((r) => r.type === 'email');
          if (last) { shareRecipients.splice(shareRecipients.indexOf(last), 1); renderShareChips(); }
        }
      });
      shareEls.emailInput.addEventListener('blur', () => {
        if (shareEls.emailInput.value.trim()) { addEmailRecipient(shareEls.emailInput.value); shareEls.emailInput.value = ''; }
      });

      shareEls.peopleInput.addEventListener('input', () => renderPeopleMenu(shareEls.peopleInput.value));
      shareEls.peopleInput.addEventListener('focus', () => { if (shareEls.peopleInput.value.trim()) renderPeopleMenu(shareEls.peopleInput.value); });
      shareEls.peopleInput.addEventListener('keydown', (e) => {
        const opts = Array.from(shareEls.peopleMenu.querySelectorAll('[data-share-pick]'));
        if (e.key === 'ArrowDown' && opts.length) {
          e.preventDefault(); shareActiveIdx = Math.min(shareActiveIdx + 1, opts.length - 1);
        } else if (e.key === 'ArrowUp' && opts.length) {
          e.preventDefault(); shareActiveIdx = Math.max(shareActiveIdx - 1, 0);
        } else if (e.key === 'Enter') {
          if (shareActiveIdx >= 0 && opts[shareActiveIdx]) {
            e.preventDefault();
            const p = SHARE_PEOPLE.find((x) => x.email === opts[shareActiveIdx].dataset.sharePick);
            if (p) { addPersonRecipient(p); shareEls.peopleInput.value = ''; renderPeopleMenu(''); }
          }
          return;
        } else if (e.key === 'Backspace' && !shareEls.peopleInput.value) {
          const last = [...shareRecipients].reverse().find((r) => r.type === 'person');
          if (last) { shareRecipients.splice(shareRecipients.indexOf(last), 1); renderShareChips(); renderPeopleMenu(shareEls.peopleInput.value); }
          return;
        } else { return; }
        opts.forEach((o, i) => o.classList.toggle('is-active', i === shareActiveIdx));
        if (opts[shareActiveIdx]) opts[shareActiveIdx].scrollIntoView({ block: 'nearest' });
      });

      shareEls.peopleMenu.addEventListener('mousedown', (e) => {
        const pick = e.target.closest('[data-share-pick]');
        if (!pick) return;
        e.preventDefault();
        const p = SHARE_PEOPLE.find((x) => x.email === pick.dataset.sharePick);
        if (p) { addPersonRecipient(p); shareEls.peopleInput.value = ''; renderPeopleMenu(''); shareEls.peopleInput.focus(); }
      });

      /* Delegated clicks: remove a recipient chip, copy/unlink an existing share. */
      sharePanel.addEventListener('click', (e) => {
        const rm = e.target.closest('[data-share-rm]');
        if (rm) { shareRecipients.splice(Number(rm.dataset.shareRm), 1); renderShareChips(); return; }
        const copyRow = e.target.closest('[data-share-copyrow]');
        if (copyRow) {
          const s = shareExisting.find((x) => String(x.id) === copyRow.dataset.shareCopyrow);
          if (s) navigator.clipboard?.writeText(s.url).catch(() => {});
          const ic = copyRow.querySelector('.material-symbols-outlined');
          if (ic) { ic.textContent = 'check'; setTimeout(() => { ic.textContent = 'content_copy'; }, 1400); }
          return;
        }
        const unlink = e.target.closest('[data-share-unlink]');
        if (unlink) {
          const idx = shareExisting.findIndex((x) => String(x.id) === unlink.dataset.shareUnlink);
          if (idx >= 0) shareExisting.splice(idx, 1);
          renderShareExisting();
          return;
        }
      });

      shareEls.create.addEventListener('click', () => {
        if (!shareEls.done.hidden) { closeShareModal(); return; } /* second click ("Done") closes */
        createShareLink();
      });
      shareEls.copy.addEventListener('click', () => {
        navigator.clipboard?.writeText(shareEls.link.value).catch(() => {});
        shareEls.link.select();
        if (shareEls.copyLabel) {
          shareEls.copyLabel.textContent = 'Copied';
          setTimeout(() => { if (shareEls.copyLabel) shareEls.copyLabel.textContent = 'Copy link'; }, 1600);
        }
      });

      sharePanel.querySelector('.wch-close').addEventListener('click', closeShareModal);
      shareScrim.addEventListener('click', closeShareModal);
      /* Close the people dropdown on any click outside it. */
      document.addEventListener('mousedown', (e) => {
        if (!sharePanel.classList.contains('wch-open')) return;
        if (!e.target.closest('[data-peoplebox]') && !e.target.closest('[data-menu]')) closePeopleMenu();
      });
    }

    /* ── Results-table controller: live search + click-to-sort + pagination ──
       Search (per result-set), the column headers, and the clickable score cards
       all funnel through applySort()/renderTable() so ranking, the "load more"
       window and the "Showing X of N" footer always stay in sync. */
    function tableQuery(tbl) {
      const set = tbl.closest('.wa-resultset');
      const inp = set && set.querySelector('.wa-search');
      return inp ? inp.value.trim().toLowerCase() : '';
    }

    /* Highlight whichever score card matches the table's active sort. */
    function syncStatCards(tbl) {
      const set = tbl.closest('.wa-resultset');
      if (!set) return;
      set.querySelectorAll('[data-stat-sort-col]').forEach((c) => {
        const on = c.dataset.statSortCol === tbl.dataset.sortCol && c.dataset.statSortDir === tbl.dataset.sortDir;
        c.classList.toggle('is-active', on);
      });
    }

    /* Apply the current search + page window to the rows, renumber the rank over
       the filtered ranking, and refresh the empty-state and pagination footer. */
    function renderTable(tbl) {
      if (!tbl) return;
      const tb = tbl.querySelector('.wa-tbl-body');
      if (!tb) return;
      const rows = Array.from(tb.querySelectorAll('.wa-trow'));
      const q = tableQuery(tbl);
      const filtered = rows.filter((r) => !q || (r.dataset.search || '').includes(q));
      filtered.forEach((r, i) => { const rk = r.querySelector('.wa-rank'); if (rk) rk.textContent = i + 1; });
      const total = filtered.length;
      const size = parseInt(tbl.dataset.pageSize, 10) || 0;
      let shown = size > 0 ? (parseInt(tbl.dataset.shown, 10) || size) : total;
      shown = Math.min(Math.max(size || total, shown), total);
      tbl.dataset.shown = shown;
      const visible = new Set(filtered.slice(0, shown));
      rows.forEach((r) => { r.style.display = visible.has(r) ? '' : 'none'; });

      const set = tbl.closest('.wa-resultset');
      const empty = set && set.querySelector('[data-empty]');
      if (empty) empty.hidden = total !== 0;

      const pager = tbl.querySelector('[data-pager-bar]');
      if (pager) {
        pager.hidden = total === 0;
        const range = pager.querySelector('[data-pager-range]');
        if (range) range.textContent = `Showing ${Math.min(shown, total)} of ${total} foods`;
        const more = pager.querySelector('[data-loadmore]');
        if (more) more.hidden = shown >= total;
      }
    }

    /* Re-order rows for the given column/direction, reset to page 1, sync UI. */
    function applySort(tbl, key, dir) {
      tbl.dataset.sortCol = key;
      tbl.dataset.sortDir = dir;
      tbl.querySelectorAll('.wa-tbl-th').forEach((h) => {
        const on = h.dataset.sort === key;
        h.classList.toggle('is-sorted', on);
        if (h.dataset.sort) {
          if (on) h.setAttribute('data-wa-dir', dir);
          else h.removeAttribute('data-wa-dir');
        }
      });
      const tb = tbl.querySelector('.wa-tbl-body');
      const rows = Array.from(tb.querySelectorAll('.wa-trow'));
      rows.sort((a, b) => {
        let av, bv;
        if (key === 'score') { av = parseFloat(a.dataset.score); bv = parseFloat(b.dataset.score); }
        else { av = a.dataset.name || ''; bv = b.dataset.name || ''; }
        if (av < bv) return dir === 'asc' ? -1 : 1;
        if (av > bv) return dir === 'asc' ? 1 : -1;
        return 0;
      });
      rows.forEach((r) => tb.appendChild(r));
      tbl.dataset.shown = parseInt(tbl.dataset.pageSize, 10) || 0;
      syncStatCards(tbl);
      renderTable(tbl);
    }

    function initTable(tbl) {
      if (!tbl || tbl.dataset.ready) return;
      tbl.dataset.ready = '1';
      syncStatCards(tbl);
      renderTable(tbl);
    }

    function wireResults(body) {
      if (!body) return;
      body.addEventListener('input', (e) => {
        const inp = e.target.closest('.wa-search');
        if (!inp) return;
        const set = inp.closest('.wa-resultset');
        const tbl = set && set.querySelector('.wa-tbl');
        if (tbl) { tbl.dataset.shown = parseInt(tbl.dataset.pageSize, 10) || 0; renderTable(tbl); }
      });
      body.addEventListener('click', (e) => {
        /* Compare board: replay a single WISEscore gauge, or a whole metric row. */
        const gauge = e.target.closest('.wa-cmp-gauge');
        if (gauge) { e.stopPropagation(); waCmpAnimateGauge(gauge); return; }
        const railIc = e.target.closest('.wa-cmp-rail-ic');
        if (railIc) {
          const rail = railIc.closest('.wa-cmp-cell--rail');
          const grid = railIc.closest('.wa-cmp-grid');
          if (rail && grid) {
            const cells = Array.from(grid.children);
            const start = cells.indexOf(rail);
            let i = 0;
            for (let k = start + 1; k < cells.length && cells[k].classList.contains('wa-cmp-cell--entity'); k++) {
              const bar = cells[k].querySelector('.wa-cmp-bar-fill');
              if (bar) { const w = bar.style.width; bar.style.width = '0'; void bar.getBoundingClientRect(); setTimeout(((b, ww) => () => { b.style.width = ww; })(bar, w), i++ * 60); }
            }
          }
          return;
        }
        const th = e.target.closest('button.wa-tbl-th[data-sort]');
        if (th) {
          const tbl = th.closest('.wa-tbl');
          if (!tbl) return;
          const key = th.dataset.sort;
          const dir = tbl.dataset.sortCol === key
            ? (tbl.dataset.sortDir === 'asc' ? 'desc' : 'asc')
            : (key === 'score' ? 'desc' : 'asc');
          applySort(tbl, key, dir);
          return;
        }
        const stat = e.target.closest('[data-stat-sort-col]');
        if (stat) {
          const set = stat.closest('.wa-resultset');
          const tbl = set && set.querySelector('.wa-tbl');
          if (!tbl) return;
          const key = stat.dataset.statSortCol;
          let dir = stat.dataset.statSortDir || 'asc';
          if (tbl.dataset.sortCol === key && tbl.dataset.sortDir === dir) dir = dir === 'asc' ? 'desc' : 'asc';
          applySort(tbl, key, dir);
          return;
        }
        const more = e.target.closest('[data-loadmore]');
        if (more) {
          const tbl = more.closest('.wa-tbl');
          if (!tbl) return;
          const size = parseInt(tbl.dataset.pageSize, 10) || 0;
          const shown = parseInt(tbl.dataset.shown, 10) || size;
          tbl.dataset.shown = shown + size;
          renderTable(tbl);
        }
      });
    }
    wireResults(paneBody.results);
    wireResults(paneBody.visuals);
    wireResults(paneBody.unified);

    /* ═════════ Content builders ═════════ */
    /* Representative food photos pulled from the app's asset library. The exact
       943k database items don't ship photos, so each row is assigned the closest
       available product shot, with a Material icon fallback if the file 404s. */
    const IMG = '../assets/';
    const DESSERT_IMGS = [
      'portfolio/coconut_brownies.png', 'portfolio/chocolate_brownies.png', 'portfolio/frosted_toaster_pastries.png',
      'portfolio/dark_cherry_brownies.png', 'portfolio/chocolate_chip_muffins.png', 'portfolio/blueberry_muffins.png',
      'portfolio/apple_cinnamon_muffins.png', 'portfolio/oatmeal_raisin_cookies.png', 'portfolio/vegan_chocolate_brownies.png',
      'portfolio/carrot_raisin_muffins.png',
    ];
    const COOKIE_IMGS = [
      'portfolio/oatmeal_raisin_cookies.png', 'top5-walnut-brownie-bar.png', 'top5-almond-coconut-crisp.png',
      'top5-matcha-cashew-bites.png', 'top5-pistachio-rose-bar.png', 'top5-ginger-turmeric-bar.png',
      'date-better-cashew-lime-crisp.png', 'portfolio/chocolate_brownies.png', 'portfolio/coconut_brownies.png',
      'portfolio/dark_cherry_brownies.png', 'portfolio/granola.jpg',
    ];
    function thumb(imgRel, fallbackIcon) {
      return `<span class="wa-thumb"><img class="wa-thumb-img" src="${IMG}${imgRel}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="wa-thumb-fallback"><span class="material-symbols-outlined">${fallbackIcon}</span></span></span>`;
    }

    /* Scorecards. A card with a `sort` descriptor renders as a button that sorts
       the table below it (the score cards double as filters/sorters). */
    function scoreCards(cards) {
      return `<div class="wa-stats">${cards.map((c) => {
        const tone = c.tone ? ' wa-stat--' + c.tone : '';
        const inner = `<span class="wa-stat-num">${c.num}</span><span class="wa-stat-label">${esc(c.label)}</span>`;
        if (c.sort) {
          return `<button type="button" class="wa-stat wa-stat--btn${tone}" data-stat-sort-col="${c.sort.col}" data-stat-sort-dir="${c.sort.dir}" title="Sort the table by ${esc(c.label)}"><span class="material-symbols-outlined wa-stat-sort">${c.sort.dir === 'asc' ? 'arrow_upward' : 'arrow_downward'}</span>${inner}</button>`;
        }
        return `<div class="wa-stat${tone}">${inner}</div>`;
      }).join('')}</div>`;
    }

    function searchToolbar(placeholder) {
      return `<div class="wa-toolbar"><div class="wa-search-inline"><span class="material-symbols-outlined">search</span><input type="text" class="wa-search" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"></div></div>`;
    }

    /* Proper sortable table: real column headers (click Food / Score to sort),
       a real food photo per row, the brand tucked under the name, and — when the
       data has it — ingredients in their own column. Score is a plain numeric
       column value, not a pill. */
    function sortTable(rows, { images, fallbackIcon = 'restaurant', tone = 'bad', showIngredients = false, sortCol = 'score', sortDir = 'desc', pageSize = 0 } = {}) {
      const cols = showIngredients
        ? '28px minmax(0,1.5fr) minmax(0,1.35fr) 74px'
        : '28px minmax(0,1fr) 74px';
      const scoreCls = tone === 'good' ? 'wa-score-num--good' : 'wa-score-num--bad';
      const CHEVRON = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 9.5V2.5M3 6.5L6 9.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const dirAttr = (key) => (key === sortCol ? ` data-wa-dir="${sortDir}"` : '');
      const cls = (key, end) => `wa-tbl-th${end ? ' wa-tbl-th--end' : ''}${key === sortCol ? ' is-sorted' : ''}`;
      const head = `<div class="wa-tbl-head" style="grid-template-columns:${cols}">
          <span class="wa-tbl-th">#</span>
          <button type="button" class="${cls('name')}" data-sort="name"${dirAttr('name')}>Food<span class="wa-sort-ic" aria-hidden="true">${CHEVRON}</span></button>
          ${showIngredients ? '<span class="wa-tbl-th">Ingredients</span>' : ''}
          <button type="button" class="${cls('score', true)}" data-sort="score"${dirAttr('score')}>Score<span class="wa-sort-ic" aria-hidden="true">${CHEVRON}</span></button>
        </div>`;
      const body = rows.map((r, i) => {
        const [food, brand, score] = r;
        const img = images[i % images.length];
        const key = `${food} ${brand}`.toLowerCase();
        const ing = showIngredients
          ? `<div class="wa-td wa-ing-cell${r[3] ? '' : ' wa-nodata'}">${esc(r[3] || '\u2014')}</div>`
          : '';
        return `<div class="wa-trow" style="grid-template-columns:${cols}" data-search="${esc(key)}" data-name="${esc(food.toLowerCase())}" data-score="${score}">
            <span class="wa-rank">${i + 1}</span>
            <div class="wa-prod">
              ${thumb(img, fallbackIcon)}
              <span class="wa-prod-text">
                <span class="wa-prod-name">${esc(food)}</span>
                <span class="wa-prod-brand">${esc(brand)}</span>
              </span>
            </div>
            ${ing}
            <div class="wa-td--end"><span class="wa-score-num ${scoreCls}">${fmtScore(score)}</span></div>
          </div>`;
      }).join('');
      const paginate = pageSize > 0 && rows.length > pageSize;
      const pager = paginate ? `<div class="wa-pager" data-pager-bar>
          <span class="wa-pager-range" data-pager-range></span>
          <button type="button" class="wa-loadmore" data-loadmore>Load more <span class="material-symbols-outlined">expand_more</span></button>
        </div>` : '';
      return `<div class="wa-tbl" data-sort-col="${sortCol}" data-sort-dir="${sortDir}" data-shown="${paginate ? pageSize : 0}" data-page-size="${paginate ? pageSize : 0}">
          ${head}
          <div class="wa-tbl-body">${body}</div>
          <div class="wa-empty-row" data-empty hidden>No foods match your search.</div>
          ${pager}
        </div>`;
    }

    function worstFoodsView() {
      return `
        <div class="wa-block wa-resultset">
          ${scoreCards([
            { num: '943,428', label: 'Foods searched' },
            { num: '25', label: 'Matches' },
            { num: '0.06', label: 'Lowest score', tone: 'alert', sort: { col: 'score', dir: 'asc' } },
            { num: 'A\u2013Z', label: 'Food name', sort: { col: 'name', dir: 'asc' } },
          ])}
          ${searchToolbar('Search food or brand\u2026')}
          ${sortTable(WORST_FOODS, { images: DESSERT_IMGS, fallbackIcon: 'cake', tone: 'bad', sortCol: 'score', sortDir: 'asc', pageSize: 8 })}
          <div class="wa-table-foot"><span class="material-symbols-outlined">south</span>Lower WISEscore = further from the WISE standard. The bottom of the database clusters around decorated cakes, cupcakes &amp; dessert kits.</div>
        </div>`;
    }

    function tenWorstView() {
      return `
        <div class="wa-block wa-resultset">
          ${scoreCards([
            { num: '10', label: 'Matches' },
            { num: '0.06', label: 'Lowest score', tone: 'alert', sort: { col: 'score', dir: 'asc' } },
            { num: '0', label: 'Gut Health', tone: 'alert' },
            { num: '0', label: 'Excellent Src', tone: 'alert' },
          ])}
          ${searchToolbar('Search these 10 foods\u2026')}

        </div>`;

    function cupcakeDetailView() {
      const badIngredients = ['Refined sugars & syrups', 'Multiple refined oils', 'Emulsifiers & stabilizers', 'Artificial colors', 'Multiple preservatives'];
      return `
        <div class="wa-block">
          <div class="wa-dhero">
            <span class="wa-dhero-thumb"><img class="wa-thumb-img" src="${IMG}portfolio/frosted_toaster_pastries.png" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="wa-thumb-fallback"><span class="material-symbols-outlined">cake</span></span></span>
            <div class="wa-dhero-info">
              <div class="wa-dhero-name">Member\u2019s Mark Christmas Gourmet Cupcakes, 8 Ct.</div>

    /* ── Compare board (side-pane port of the product-comparison module) ──
       A few products are grabbed by default and rendered as a comparison board:
       a metric rail + one column per product, WISEscore gauges on each tile,
       and per-metric value/bar/grade rows — the same read as the product
       comparison page, surfaced into the Results & Details pane. */
    const COMPARE_METRICS = [
      { id: 'upf',              icon: 'science',           color: '#2AA866', label: 'UPF Risk',             desc: 'How ultra-processed the formulation reads \u2014 lower is cleaner.' },
      { id: 'gras',             icon: 'health_and_safety', color: '#5B6ED0', label: 'GRAS',                 desc: 'Share of ingredients Generally Recognized As Safe.' },

    const COMPARE_PRODUCTS = [
      {
        name: 'Aloha Organic Protein Bar, Peanut Butter Chocolate Chip', brand: 'Aloha',
        cat: 'Bars \u00b7 Protein', img: 'portfolio/pf_protein_bar.png', score: 84, top: 'Top 8%',
        scores: { upf: 86, gras: 90, ing_overall: 88, nutrient_overall: 80, gut_health: 72 },
        insight: 'Cleanest formulation of the three \u2014 organic plant protein, dates &amp; brown-rice syrup with no synthetic additives. Nutrient density leads on protein and fiber.',
      },
      {
        name: 'Simple Truth Organic Trail Mix', brand: 'Simple Truth',
        cat: 'Snacks \u00b7 Trail mix', img: 'portfolio/pf_trail_mix.png', score: 71, top: 'Top 27%',
        scores: { upf: 74, gras: 85, ing_overall: 76, nutrient_overall: 73, gut_health: 68 },
        insight: 'Whole nuts &amp; dried fruit keep ingredient integrity high, but the added chocolate &amp; sugar pull the UPF and nutrient scores down a notch.',
      },
      {
        name: 'SkinnyPop Original Popcorn', brand: 'SkinnyPop',
        cat: 'Snacks \u00b7 Popcorn', img: 'portfolio/pf_popcorn.png', score: 63, top: 'Top 44%',
        scores: { upf: 66, gras: 82, ing_overall: 70, nutrient_overall: 58, gut_health: 55 },
        insight: 'A short, recognizable ingredient list, but sunflower oil &amp; salt with modest fiber cap the nutrient density and gut-health signals.',
      },
    ];

    const CMP_R = 42, CMP_C = 2 * Math.PI * 42;
    function waCmpGrade(v) {
      v = Math.round(v);
      if (v >= 90) return 'A+'; if (v >= 85) return 'A'; if (v >= 80) return 'A-';
      if (v >= 75) return 'B+'; if (v >= 70) return 'B'; if (v >= 65) return 'B-';
      if (v >= 60) return 'C+'; if (v >= 55) return 'C'; if (v >= 50) return 'C-';
      if (v >= 40) return 'D'; return 'F';
    }
    function waCmpGradeClass(g) { const c = g[0]; return c === 'A' ? 'g-a' : c === 'B' ? 'g-b' : c === 'C' ? 'g-c' : 'g-d'; }
    function waCmpGauge(score) {
      const color = score < 55 ? 'var(--sec-red)' : (score < 68 ? 'var(--ter-amber)' : 'var(--sec-green)');
      return `<button type="button" class="wa-cmp-gauge" data-score="${score}" style="--gauge-color:${color}" title="Replay WISEscore" aria-label="WISEscore ${score} \u2014 tap to replay">
          <svg class="wa-cmp-gauge-svg" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="wa-cmp-gauge-track" cx="50" cy="50" r="${CMP_R}"></circle>
            <circle class="wa-cmp-gauge-arc" cx="50" cy="50" r="${CMP_R}" stroke-dasharray="${CMP_C.toFixed(1)}" stroke-dashoffset="${(CMP_C * (1 - score / 100)).toFixed(1)}"></circle>
          </svg>
          <span class="wa-cmp-gauge-center"><span class="wa-cmp-gauge-num" data-score="${score}">${score}</span><span class="wa-cmp-gauge-lbl">WISEscore</span></span>
        </button>`;
    }
    function waCmpTile(prod, rank) {
      const s = prod.score;
      const pillCls = s < 55 ? ' tp-low' : (s < 68 ? ' tp-mid' : '');
      const img = prod.img
        ? `<img class="wa-cmp-tile-img" src="${IMG}${prod.img}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : '';
      const you = prod.primary ? '<span class="wa-cmp-you">YOU</span>' : '';
      return `<div class="wa-cmp-tile">
          ${img}
          <span class="wa-cmp-rankchip"><span class="wa-cmp-rank">${rank}</span>${esc(prod.brand)}</span>
          ${you}
          <span class="wa-cmp-toppill${pillCls}">${esc(prod.top || 'Top 50%')}</span>
          ${waCmpGauge(s)}
          <div class="wa-cmp-tile-overlay">
            <div class="wa-cmp-ent-name" title="${esc(prod.name)}">${esc(prod.name)}</div>
            <div class="wa-cmp-ent-cat">${esc(prod.cat)}</div>
          </div>
        </div>`;
    }
    function compareProductsView(products = COMPARE_PRODUCTS, metrics = COMPARE_METRICS) {
      const n = products.length;
      const cols = `minmax(150px, 1.05fr) repeat(${n}, minmax(0, 1fr))`;
      const cells = [];
      /* Header row: corner + one image tile per product. */
      cells.push(`<div class="wa-cmp-cell wa-cmp-cell--rail wa-cmp-hcell">
          <div class="wa-cmp-corner">
            <span class="wa-cmp-corner-title">Compare Foods</span>
            <span class="wa-cmp-corner-h">WISEscore</span>
            <span class="wa-cmp-corner-desc">The overall 0\u2013100 Food Truth\u2122 score. Tap a gauge to replay it.</span>
          </div>
        </div>`);
      products.forEach((p, i) => cells.push(`<div class="wa-cmp-cell wa-cmp-cell--entity wa-cmp-hcell">${waCmpTile(p, i + 1)}</div>`));
      /* Metric rows: rail (icon + label + desc) then value/bar/grade per product. */
      metrics.forEach((m) => {
        cells.push(`<div class="wa-cmp-cell wa-cmp-cell--rail">
            <div class="wa-cmp-rail-metric">
              <div class="wa-cmp-rail-lead">
                <span class="wa-cmp-rail-ic" style="--mic:${m.color}" title="Replay this row" role="button" tabindex="0"><span class="material-symbols-outlined">${m.icon}</span></span>
                <span class="wa-cmp-rail-name">${esc(m.label)}</span>
              </div>
              <div class="wa-cmp-rail-desc">${m.desc}</div>
            </div>
          </div>`);
        products.forEach((p) => {
          const v = Math.round((p.scores && p.scores[m.id] != null) ? p.scores[m.id] : p.score);
          const g = waCmpGrade(v), gc = waCmpGradeClass(g);
          cells.push(`<div class="wa-cmp-cell wa-cmp-cell--entity">
              <div class="wa-cmp-metric-cell">
                <span class="wa-cmp-metric-val">${v}</span>
                <span class="wa-cmp-bar-outer"><span class="wa-cmp-bar-fill ${gc}" style="width:${v}%" data-w="${v}"></span></span>
                <span class="wa-cmp-grade ${gc}">${g}</span>
              </div>
            </div>`);
        });
      });
      /* Insight row. */
      cells.push(`<div class="wa-cmp-cell wa-cmp-cell--rail">
          <div class="wa-cmp-insight-head"><span class="material-symbols-outlined">auto_awesome</span>Insight</div>
          <div class="wa-cmp-insight-body">Ranked by WISEscore, the cleaner-label bar leads on ingredient integrity and nutrient density, while the popcorn trails mostly on nutrient density.</div>
        </div>`);
      products.forEach((p) => cells.push(`<div class="wa-cmp-cell wa-cmp-cell--entity"><div class="wa-cmp-insight-body">${p.insight || ''}</div></div>`));

      return `
        <div class="wa-block">
          <div class="wa-cmp">
            <div class="wa-cmp-toolbar">
              <button type="button" class="wa-cmp-chip is-on"><span class="material-symbols-outlined">tune</span>${metrics.length} metrics</button>
              <button type="button" class="wa-cmp-chip"><span class="material-symbols-outlined">category</span>All categories</button>
              <button type="button" class="wa-cmp-chip wa-cmp-chip--add"><span class="material-symbols-outlined">add</span>Add product</button>
            </div>
            <div class="wa-cmp-grid-wrap">
              <div class="wa-cmp-grid" style="grid-template-columns:${cols}">${cells.join('')}</div>
            </div>
            <div class="wa-cmp-foot"><span class="material-symbols-outlined">info</span>Grabbed the top ${n} matching products to start. Same board as the Product Comparison page \u2014 tap a metric icon to replay its bars, or a gauge to replay a WISEscore.</div>
          </div>
        </div>`;
    }

    /* Animate the compare board when it lands: sweep each gauge arc + count its
       number up, then fill the metric bars, staggered left-to-right. */
    function waCmpCountUp(el, to, ms) {
      const start = performance.now();
      (function tick(now) {
        const p = Math.min(1, (now - start) / ms);
        el.textContent = Math.round(to * (0.5 - Math.cos(Math.PI * p) / 2));
        if (p < 1) requestAnimationFrame(tick);
      })(start);
    }
    function waCmpAnimateGauge(el) {
      if (!el) return;
      const arc = el.querySelector('.wa-cmp-gauge-arc');
      const num = el.querySelector('.wa-cmp-gauge-num');
      const to = parseInt(el.getAttribute('data-score'), 10) || 0;
      if (arc) {
        arc.style.transition = 'none';
        arc.style.strokeDashoffset = CMP_C.toFixed(1);
        void arc.getBoundingClientRect();
        arc.style.transition = 'stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1)';
        arc.style.strokeDashoffset = (CMP_C * (1 - to / 100)).toFixed(1);
      }
      if (num) { num.textContent = '0'; waCmpCountUp(num, to, 850); }
    }
    function initCompare(cmp) {
      if (!cmp || cmp.dataset.ready) return;
      cmp.dataset.ready = '1';
      /* Bars/gauges render pre-filled (so the static inline preview reads right);
         reset them to empty, then replay the fill so the live pane animates in. */
      const bars = cmp.querySelectorAll('.wa-cmp-bar-fill');
      bars.forEach((b) => { b.style.transition = 'none'; b.style.width = '0'; });
      cmp.querySelectorAll('.wa-cmp-gauge').forEach((g, i) => setTimeout(() => waCmpAnimateGauge(g), 120 + i * 110));
      requestAnimationFrame(() => {
        bars.forEach((b, i) => {
          setTimeout(() => { b.style.transition = ''; b.style.width = (parseFloat(b.dataset.w) || 0) + '%'; }, 240 + i * 28);
        });
      });
    }

    /* ── Charts ── */
    function radarChart() {
      // Square viewBox with generous margin so the outer labels (left/right)
      // never clip. R is kept well inside the box; labels sit just outside the
      // outer ring. Modeled on the product-comparison spider chart.
      const size = 300, cx = size / 2, cy = size / 2, R = size / 2 - 62;
      // Five metrics laid out evenly. Only WISEscore returned values for this
      // set; the rest came back empty, so their spokes are drawn dashed.
      const axes = [
        { label: 'WISEscore', data: true },
        { label: 'Gut Health', data: false },
        { label: 'Immune Support', data: false },
        { label: 'Additive Load', data: false },
        { label: 'Excellent Source', data: false },
      ];
      const M = axes.length;
      const ang = (i) => (Math.PI * 2 * i) / M - Math.PI / 2;
      const pt = (i, t) => [cx + R * t * Math.cos(ang(i)), cy + R * t * Math.sin(ang(i))];
      const ptsAt = (t) => axes.map((_, i) => pt(i, t).map((v) => v.toFixed(1)).join(',')).join(' ');

      let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" class="wa-radar-svg" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Spider chart of the 10 worst foods across five health metrics">`;
      // rings
      [0.25, 0.5, 0.75, 1].forEach((t) => {
        svg += `<polygon points="${ptsAt(t)}" fill="none" stroke="var(--border-strong)" stroke-width="1" opacity="0.7"/>`;
      });
      // spokes
      axes.forEach((a, i) => {
        const [x, y] = pt(i, 1);
        svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border-strong)" stroke-width="1" ${a.data ? '' : 'stroke-dasharray="4 4"'} opacity="0.8"/>`;
      });
      // spread of the 10 normalized WISEscores along the data axis
      const scores = WORST_FOODS.slice(0, 10).map((r) => r[2]);
      const mn = Math.min(...scores), mx = Math.max(...scores);
      const norm = (s) => 0.16 + 0.72 * ((s - mn) / (mx - mn || 1));
      const avgT = norm(scores.reduce((a, b) => a + b, 0) / scores.length);
      // collapsed polygon: real data on the WISEscore axis, near-zero elsewhere
      const polyPts = axes.map((a, i) => pt(i, a.data ? avgT : 0.05).map((v) => v.toFixed(1)).join(',')).join(' ');
      svg += `<polygon points="${polyPts}" fill="var(--primary)" fill-opacity="0.18" stroke="var(--primary)" stroke-width="2"/>`;
      // dots for each food on the data axis
      scores.forEach((s) => {
        const [x, y] = pt(0, norm(s));
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--primary)"/>`;
      });
      // axis labels
      axes.forEach((a, i) => {
        const [x, y] = pt(i, 1.2);
        const anchor = Math.abs(x - cx) < 6 ? 'middle' : x > cx ? 'start' : 'end';
        svg += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="var(--text)">${a.label}</text>`;
      });
      svg += `</svg>`;

      const scoreBars = WORST_FOODS.slice(0, 10).map((r) => {
        const w = (norm(r[2]) * 100).toFixed(0);
        return `<div class="wa-scorebar">
            <div class="wa-scorebar-name">${esc(r[0])}</div>
            <div class="wa-scorebar-line">
              <div class="wa-bar-track"><div class="wa-bar-fill" style="width:${w}%"></div></div>
              <div class="wa-bar-val">${fmtScore(r[2])}</div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="wa-block">
          <div class="wa-chart-card">
            <div class="wa-radar-wrap">
              <div style="align-self:center;width:100%;max-width:300px">${svg}</div>
              <div class="wa-radar-scores">
                <div style="margin-bottom:8px"><span class="wa-nd-tag">No data</span> <span style="font-size:11px;color:var(--text-muted)">Gut Health, Immune Support, Additive Load &amp; Excellent Source came back empty across the set.</span></div>
                <div class="wa-scorebars">${scoreBars}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function scoreCurveChart() {
      // "Where the cookie shell gets its score" — a descending curve across the ranking.
      const W = 560, H = 200, padL = 34, padR = 14, padT = 14, padB = 26;
      const pts = [100, 100, 100, 100, 100, 98.5, 96, 91, 84, 73, 61, 49, 38, 29, 22];
      const n = pts.length, mx = 100;
      const x = (i) => padL + (i / (n - 1)) * (W - padL - padR);
      const y = (v) => padT + (1 - v / mx) * (H - padT - padB);
      const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const area = `${padL},${(H - padB)} ${line} ${(W - padR)},${(H - padB)}`;
      let grid = '';
      [0, 25, 50, 75, 100].forEach((g) => {
        const yy = y(g);
        grid += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
        grid += `<text x="${padL - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-subtle)">${g}</text>`;
      });
      return `
        <div class="wa-block">
          <h3 class="wa-report-title wa-chart-title">Where the cookie shell gets its score</h3>
          <div class="wa-chart-card">
            <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="WISEscore across the ranked chocolate chip cookies">
              ${grid}
              <polygon points="${area}" fill="var(--primary)" fill-opacity="0.12"/>
              <polyline points="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
              <text x="${padL}" y="${H - 6}" font-size="9" fill="var(--text-subtle)">Rank 1</text>
              <text x="${W - padR}" y="${H - 6}" text-anchor="end" font-size="9" fill="var(--text-subtle)">Rank ${n}</text>
            </svg>
            <p class="wa-caption" style="margin:8px 0 0">Score holds at the top of the ranking, then falls off sharply as ingredient lists get noisier and more chocolate-forward.</p>
          </div>
        </div>`;
    }

    function distributionChart() {
      const buckets = [
        ['90–100', 612], ['70–89', 548], ['50–69', 806], ['30–49', 574], ['0–29', 470],
      ];
      const mx = Math.max(...buckets.map((b) => b[1]));
