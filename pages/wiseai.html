    }

    /* ── Inline surface previews ──────────────────────────────────────────
       Every block we open on the right ALSO drops a medium preview card into
       the transcript. The card carries a clamped copy of the same content and
       remembers how to re-open its module, so closing a pane never loses the
       answer — it lives on inline and re-opens on tap. */
    let surfaceSeq = 0;
    const SURFACED = {}; /* blockId → { which, title, meta, html } */
    /* Version history per output, keyed by a stable versionKey (defaults to the
       output's title). Each entry is { previewHtml, version, time } so re-doing
       an output (same key) grows a stack the chip can show. */
    const SURFACE_VERSIONS = {}; /* versionKey → [{ previewHtml, version, time }] */

    /* Tag the first .wa-block in a view's html so we can later tell whether that
       exact block is still present in its pane (i.e. not closed/cleared). */
    function tagBlock(html, id, title, meta, icon, ver) {
      const headAttrs = `data-block-id="${id}"`
        + (title ? ` data-slide-title="${esc(title)}"` : '')
        + (meta ? ` data-slide-meta="${esc(meta)}"` : '')
        + (icon ? ` data-slide-icon="${esc(icon)}"` : '')
        + (ver ? ` data-slide-ver="${esc(ver)}"` : '');
      /* Tag EVERY top-level output block of this surface with the same block id
         (so a multi-block output — e.g. chart + headroom — can be found and
         swapped as one group when a specific version is opened) and with the
         version label (so the pane's version badge holds across all of the
         output's sub-slides). Only the FIRST block carries the slide
         title/meta/icon, which differ per sub-block. */
      const tailAttrs = `data-block-id="${id}"` + (ver ? ` data-slide-ver="${esc(ver)}"` : '');
      let first = true;
      return html.replace(/<div class="wa-block/g, () => {
        if (first) { first = false; return `<div ${headAttrs} class="wa-block`; }
        return `<div ${tailAttrs} class="wa-block`;
      });
    }

    /* A short wall-clock stamp ("6:54 PM") for the moment an output is produced. */
    function nowClock() {
      try { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
      catch (e) { return ''; }
    }

    /* Every surfaced output is time-stamped and versioned. `opts` carries:
         time     — wall-clock stamp for this version
         version  — the current version number (1-based)
         versions — optional history [{ previewHtml, version, time }]; when it
                    has more than one entry the chip renders a horizontal stack
                    of thumbnails (previous versions first, newest last). */
    function surfaceCardHtml(blockId, which, icon, title, previewHtml, opts) {
      const paneName = which === 'visuals' ? 'Visuals' : 'Results & Details';
      const o = opts || {};
      const time = o.time || nowClock();
      const versions = Array.isArray(o.versions) ? o.versions : null;
      const count = versions ? versions.length : 1;
      const version = o.version || count;
      const rawTitle = String(title == null ? '' : title).trim() || 'Output';
      /* Let the title fill the chip and wrap naturally (up to two lines). A
         middot is a wrap hint, not a forced line break. */
      const titleHtml = esc(rawTitle);

      let thumb;
      if (versions && versions.length > 1) {
        /* Stacked cascade — oldest → newest, newest raised + tagged. */
        thumb = `<div class="sc-surface-stack">` + versions.map((entry, i) => {
          const isLatest = i === versions.length - 1;
          const vn = entry.version || (i + 1);
          return `<div class="sc-surface-thumb ${isLatest ? 'is-latest' : 'is-old'}" role="button" tabindex="0" data-surface-ver="${blockId}" data-ver="${vn}" aria-label="Open version ${vn} of “${esc(rawTitle)}” in the ${esc(paneName)} panel" title="Open v${vn} in the ${esc(paneName)} panel">
              <div class="sc-surface-thumb-inner">${entry.previewHtml}</div>
              <span class="sc-surface-vtag">v${vn}</span>
            </div>`;
        }).join('') + `</div>`;
      } else {
        thumb = `<div class="sc-surface-thumb"><div class="sc-surface-thumb-inner">${previewHtml}</div></div>`;
      }

      /* The timestamp + version no longer live inside the chip — they render in
         the turn's meta row below it (see decorateSurfaceMeta). The chip keeps
         only the thumbnail + title; charts no longer expand inline here — use
         the expand icon on the chart in the right sticky module instead. */
      return `<div class="sc-surface-slot">
          <div class="sc-surface-card" role="button" tabindex="0" data-surface="${blockId}" data-activity="output"${count > 1 ? ' data-activity-multi' : ''} aria-label="Open “${esc(rawTitle)}” in the ${esc(paneName)} panel — version ${version}${count > 1 ? ` of ${count}` : ''}, ${esc(time)}">
            <div class="sc-surface-head">
              ${thumb}
              <div class="sc-surface-body">
                <div class="sc-surface-title">${titleHtml}</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    /* Render the surface output's version as a proper, patch-style version
       string ("v1.0.0", "v1.0.1", …) instead of a bare "v1" chip. */
    function verLabel(n) { return `v1.0.${Math.max(0, (n | 0) - 1)}`; }

    /* The timestamp + version live INSIDE the turn's three-dot ("more") menu —
       the same collapsed popover that already carries the wall-clock stamp. Drop
       the version number in right after the time so both read together when the
       menu is opened. */
    function decorateSurfaceMeta(line, o) {
      if (!line) return;
      const metaEl = line.querySelector('.sc-line-meta');
      if (!metaEl) return;
      metaEl.classList.add('sc-line-meta--output');
      const menu = metaEl.querySelector('.sc-fb-menu');
      if (!menu) return;
      const ver = document.createElement('span');
      ver.className = 'sc-fb-menu-ver';
      ver.textContent = verLabel(o.version) + (o.count > 1 ? ` · ${o.count} versions` : '');
      const timeEl = menu.querySelector('.sc-fb-menu-time');
      if (timeEl) timeEl.insertAdjacentElement('afterend', ver);
      else menu.insertBefore(ver, menu.firstChild);
    }

    /* ── Conversation manifest (floating Outputs / Sources box) ───────────────
       A running jump-list pinned to the chat's top-right (below the width
       toggle). Every surfaced OUTPUT registers here, and the verified SOURCES
       this transcript draws on are seeded on first surface. Open by default when
       the chat is wide (≈triple width); collapses to a slim icon rail otherwise,
       peeking open on hover. When wide it can be manually collapsed or closed. */
    const MANIFEST_OPEN_W = 800;          /* chat width (px) at/above which it opens by default */
    const MANIFEST_SOURCES = [
      { icon: 'verified', title: 'WISE Verified Food Data' },
      { logo: 'https://www.google.com/s2/favicons?domain=kroger.com&sz=128', icon: 'storefront', title: 'Kroger' },
      { logo: 'https://www.google.com/s2/favicons?domain=walmart.com&sz=128', icon: 'storefront', title: 'Walmart' },
    ];
    const manifestOutputs = [];           /* { blockId, which, icon, title } */
    let manifestBuilt = false, manifestUserCollapsed = false, manifestUserHidden = false, manifestSourcesSeeded = false;
    /* Turned off entirely from the chat's "Hide outputs & sources" menu switch
       (off by default). Unlike the panel's own "close" — which hides the box but
       leaves a floating re-open button — this removes the whole component. */
    let manifestMenuOff = false;
    let manifestEl, manifestOutListEl, manifestSrcListEl, manifestRailEl, manifestOutSecEl, manifestSrcSecEl, manifestBadgeEl;

    function buildManifest() {
      if (manifestBuilt || !host) return;
      manifestBuilt = true;
      manifestEl = document.createElement('div');
      manifestEl.className = 'wa-manifest is-empty';
      manifestEl.innerHTML = `
        <div class="wa-manifest-full">
          <div class="wa-manifest-ctrls">
            <button type="button" class="wa-manifest-btn" data-mf="collapse" title="Collapse to icons" aria-label="Collapse outputs & sources to icons"><span class="material-symbols-outlined">unfold_less</span></button>
            <button type="button" class="wa-manifest-btn" data-mf="close" title="Hide" aria-label="Hide outputs & sources"><span class="material-symbols-outlined">close</span></button>
          </div>
          <div class="wa-manifest-section" data-mf-out hidden>
            <div class="wa-manifest-label">Outputs</div>
            <div class="wa-manifest-list" data-mf-outlist></div>
          </div>
          <div class="wa-manifest-div" data-mf-div hidden></div>
          <div class="wa-manifest-section" data-mf-src hidden>
            <div class="wa-manifest-label">Sources</div>
            <div class="wa-manifest-list" data-mf-srclist></div>
          </div>
        </div>
        <div class="wa-manifest-rail" data-mf-rail></div>
        <button type="button" class="wa-manifest-reopen" data-mf="reopen" title="Show outputs & sources" aria-label="Show outputs & sources"><span class="material-symbols-outlined">dashboard_customize</span><span class="wa-manifest-reopen-badge" data-mf-badge>0</span></button>`;
      host.appendChild(manifestEl);
      manifestOutListEl = manifestEl.querySelector('[data-mf-outlist]');
      manifestSrcListEl = manifestEl.querySelector('[data-mf-srclist]');
      manifestRailEl = manifestEl.querySelector('[data-mf-rail]');
      manifestOutSecEl = manifestEl.querySelector('[data-mf-out]');
      manifestSrcSecEl = manifestEl.querySelector('[data-mf-src]');
      manifestBadgeEl = manifestEl.querySelector('[data-mf-badge]');

      manifestEl.addEventListener('click', (e) => {
        const ctrl = e.target.closest('[data-mf]');
        if (ctrl) {
          const act = ctrl.dataset.mf;
          if (act === 'collapse') { manifestUserCollapsed = !manifestUserCollapsed; }
          else if (act === 'close') { manifestUserHidden = true; }
          else if (act === 'reopen') { manifestUserHidden = false; manifestUserCollapsed = false; }
          syncManifestState();
          return;
        }
        const item = e.target.closest('[data-mf-block]');
        if (item) reopenSurface(item.dataset.mfBlock);
      });

      /* Track the chat module's width so the box opens/collapses with it. */
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => syncManifestState()).observe(host);
      } else {
        window.addEventListener('resize', syncManifestState);
      }
    }

    function iconMarkup(item, cls) {
      if (item.logo) {
        return `<span class="${cls}"><img src="${item.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span style="display:none;align-items:center;justify-content:center"><span class="material-symbols-outlined">${esc(item.icon || 'public')}</span></span></span>`;
      }
      return `<span class="${cls}"><span class="material-symbols-outlined">${esc(item.icon || 'insights')}</span></span>`;
    }

    function renderManifest() {
      if (!manifestBuilt) return;
      const hasOut = manifestOutputs.length > 0;
      const hasSrc = manifestSourcesSeeded && MANIFEST_SOURCES.length > 0;

      manifestOutSecEl.hidden = !hasOut;
      manifestSrcSecEl.hidden = !hasSrc;
      manifestEl.querySelector('[data-mf-div]').hidden = !(hasOut && hasSrc);
      manifestEl.classList.toggle('is-empty', !hasOut && !hasSrc);
      if (manifestBadgeEl) manifestBadgeEl.textContent = String(manifestOutputs.length + (hasSrc ? MANIFEST_SOURCES.length : 0));

      manifestOutListEl.innerHTML = manifestOutputs.map((o) =>
        `<button type="button" class="wa-manifest-item" data-mf-block="${o.blockId}" title="Open “${esc(o.title)}”">
          ${iconMarkup(o, 'wa-manifest-ic')}
          <span class="wa-manifest-name">${esc(o.title)}</span>
        </button>`).join('');

      manifestSrcListEl.innerHTML = (hasSrc ? MANIFEST_SOURCES : []).map((s) =>
        `<div class="wa-manifest-item wa-manifest-item--static">
          ${iconMarkup(s, 'wa-manifest-ic')}
          <span class="wa-manifest-name">${esc(s.title)}</span>
        </div>`).join('');

      /* Collapsed icon rail: output icons (clickable) · divider · source icons. */
      manifestRailEl.innerHTML =
        manifestOutputs.map((o) =>
          `<button type="button" class="wa-manifest-rail-ic" data-mf-block="${o.blockId}" title="${esc(o.title)}" aria-label="Open “${esc(o.title)}”"><span class="material-symbols-outlined">${esc(o.icon || 'insights')}</span></button>`
        ).join('') +
        (hasOut && hasSrc ? '<span class="wa-manifest-rail-div"></span>' : '') +
        (hasSrc ? MANIFEST_SOURCES.map((s) =>
          `<span class="wa-manifest-rail-ic wa-manifest-rail-ic--static" title="${esc(s.title)}">${s.logo ? `<img src="${s.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none" class="material-symbols-outlined">${esc(s.icon || 'public')}</span>` : `<span class="material-symbols-outlined">${esc(s.icon || 'public')}</span>`}</span>`
        ).join('') : '');
    }

    /* Chat three-dot "Hide outputs & sources" switch — fully show/hide the
       whole manifest (panel, rail AND re-open button). Applied lazily so it
       works whether or not the box has been built yet. */
    function setManifestOff(off) {
      manifestMenuOff = !!off;
      if (manifestBuilt) syncManifestState();
    }

    function syncManifestState() {
      if (!manifestBuilt || !host) return;
      const w = host.getBoundingClientRect().width;
      const wide = w >= MANIFEST_OPEN_W;
      manifestEl.classList.toggle('is-off', manifestMenuOff);
      manifestEl.classList.toggle('is-wide', wide);
      manifestEl.classList.toggle('is-hidden', manifestUserHidden);
      /* Narrow → always the icon rail (hover to peek). Wide → open unless the
         user manually collapsed it. */
      const collapsed = manifestUserHidden ? false : (wide ? manifestUserCollapsed : true);
      manifestEl.classList.toggle('is-collapsed', collapsed);
      /* The collapse control doubles as a pin-open toggle when collapsed. */
      const cBtn = manifestEl.querySelector('[data-mf="collapse"]');
      if (cBtn) {
        cBtn.querySelector('.material-symbols-outlined').textContent = collapsed ? 'unfold_more' : 'unfold_less';
        cBtn.title = collapsed ? 'Pin open' : 'Collapse to icons';
      }
    }

    function addManifestOutput(o) {
      buildManifest();
      if (!manifestSourcesSeeded) manifestSourcesSeeded = true;
      manifestOutputs.push(o);
      renderManifest();
      syncManifestState();
    }

    /* Open (or refresh) a pane block AND mirror it as an inline preview card. */
    function surfaceBlock(which, { icon, title, meta, html, versionKey, versionReset }) {
      const blockId = 'blk' + (++surfaceSeq);
      /* The compare board is engine-rendered into a fixed #cmp-body; strip those
         ids (and the References cards' #cat-ref-N ids) from the preview clone so
         we never create a duplicate id that would misdirect the engine's
         getElementById re-renders / footnote scrolls. */
      const previewHtml = html.replace(/ id="cmp-(body|subtitle)"/g, '').replace(/ id="cat-ref-\d+"/g, '').replace(/ id="news-ref-[^"]+"/g, '');
      /* Record this as a version of the output BEFORE opening the pane, so the
         pane block can be tagged with the correct version label. The key defaults
         to the title, so re-surfacing the same output (e.g. "redo the chart")
         stacks onto the same history and bumps the version count. */
      const key = versionKey || title;
      const time = nowClock();
      if (versionReset) SURFACE_VERSIONS[key] = [];
      const list = SURFACE_VERSIONS[key] || (SURFACE_VERSIONS[key] = []);
      list.push({ previewHtml, version: list.length + 1, time });
      const count = list.length;
      /* Stamp the SAME version label the transcript card's meta row shows
         ("v1.0.0", or "v1.0.2 · 3 versions" once it's been redone) onto the pane
         block, so the versioning reads identically on the mini card and on the
         output shown on the right. */
      const verText = `${verLabel(count)}${count > 1 ? ` · ${count} versions` : ''}`;
      const tagged = tagBlock(html, blockId, title, meta, icon, verText);
      openPane(which, { title, meta, html: tagged });
      SURFACED[blockId] = { which, title, meta, icon, html: tagged, versionKey: key };
      addManifestOutput({ blockId, which, icon, title });
      if (chat && typeof chat.addWISEcodeAI === 'function') {
        /* A preview card is posted mid-turn (while WISEcodeAI is still "thinking"),
           so it must NOT trail the intent chips — those belong to the actual
           answer that lands after it, and should animate in there. */
        const surfLine = chat.addWISEcodeAI(
          surfaceCardHtml(blockId, which, icon, title, previewHtml, {
            time,
            version: count,
            versions: list.slice(),
          }),
          { feedback: true, trailChips: false }
        );
        decorateSurfaceMeta(surfLine, { time, version: count, count, blockId });
      }
    }

    /* Re-open a surfaced block from its inline preview. If the block is still in
       its pane, just bring the pane forward + scroll to it; otherwise re-add it. */
    function reopenSurface(blockId) {
      const e = SURFACED[blockId];
      if (!e) return;
      /* While merged, every block lives in the unified pane — look for it there. */
      const dest = mergedMode ? 'unified' : e.which;
      const pane = paneEl[dest];
      const present = paneBody[dest] && paneBody[dest].querySelector(`[data-block-id="${blockId}"]`);
      if (present) {
        if (pane && !pane.classList.contains('is-open')) ensurePaneOpen(pane);
        if (paneBody[dest].classList.contains('is-carousel')) {
          const idx = Number(present.dataset.slideIndex);
          setPaneSlide(dest, Number.isNaN(idx) ? 0 : idx, { animate: true, scrollNav: true });
        } else {
          requestAnimationFrame(() => present.scrollIntoView({ block: 'start', behavior: 'smooth' }));
        }
      } else {
        openPane(e.which, { title: e.title, meta: e.meta, html: e.html });
      }
      return dest;
    }

    /* Overlay the host artifacts module across the viewport (over the primary
       nav). Chat and sibling modules hide; charts inside scale up. */
    function paneWhichFromEl(el) {
      if (!el) return null;
      if (el.id === 'wa-visuals') return 'visuals';
      if (el.id === 'wa-results') return 'results';
      if (el.id === 'wa-unified') return 'unified';
      if (el.id === 'wa-report') return 'report';
      return el.dataset.origin || null;
    }
    function paneIsFs(el) {
      return !!(el && el.classList.contains('pane-fs'));
    }
    function syncChartExpandBtns(root) {
      const scope = root || document;
      scope.querySelectorAll('.wa-chart-expand-btn').forEach((btn) => {
        const pane = btn.closest('.wa-pane');
        const on = paneIsFs(pane);
        btn.classList.toggle('is-on', on);
        const ic = btn.querySelector('.material-symbols-outlined');
        if (ic) ic.textContent = on ? 'close_fullscreen' : 'open_in_full';
        btn.title = on ? 'Restore module' : 'Expand module to full screen';
        btn.setAttribute('aria-label', on ? 'Restore module' : 'Expand output module to full screen');
      });
    }
    function setOutputFsOn(on) {
      document.getElementById('modules-row')?.classList.toggle('output-fs', !!on);
      document.documentElement.classList.toggle('output-fs', !!on);
    }
    function applyPaneFs(el, on) {
      ['results', 'visuals', 'unified', 'report'].forEach((k) => {
        if (paneEl[k] && paneEl[k] !== el) paneEl[k].classList.remove('pane-fs');
      });
      if (el) el.classList.toggle('pane-fs', !!on);
      setOutputFsOn(!!(el && on));
      syncChartExpandBtns();
    }
    function togglePaneFs(which) {
      const dest = which === 'report' ? 'report' : (mergedMode ? 'unified' : which);
      const el = paneEl[dest];
      if (!el) return;
      if (!el.classList.contains('is-open')) ensurePaneOpen(el);
      applyPaneFs(el, !paneIsFs(el));
    }

    /* Top-right open_in_full control for each chart output — parked in a
       toolbar on the block, above the card/table, never inside the table. */
    function ensureChartExpandBtns(root) {
      if (!root) return;
      root.querySelectorAll('.wa-chart-card').forEach((card) => {
        card.setAttribute('data-cu-card', '1');
        card.querySelectorAll(':scope > .wa-chart-toolbar, :scope > .wa-chart-expand-btn').forEach((n) => n.remove());
      });
      root.querySelectorAll('.wa-block').forEach((block) => {
        if (!block.querySelector('.wa-chart-card')) return;
        let bar = block.querySelector(':scope > .wa-chart-toolbar');
        if (!bar) {
          bar = document.createElement('div');
          bar.className = 'wa-chart-toolbar';
          const card = block.querySelector('.wa-chart-card');
          const overall = block.querySelector(':scope > .wa-kraft-overall');
          const mix = block.querySelector(':scope > .wa-sprouts-mix');
          let insertBefore = overall || mix || card;
          while (insertBefore && insertBefore.parentElement && insertBefore.parentElement !== block) {
            insertBefore = insertBefore.parentElement;
          }
          block.insertBefore(bar, insertBefore || block.firstElementChild);
        }
        if (bar.querySelector('.wa-chart-expand-btn')) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wa-chart-expand-btn';
        btn.setAttribute('data-chart-expand', '');
        btn.setAttribute('aria-label', 'Expand output module to full screen');
        btn.title = 'Expand module to full screen';
        btn.innerHTML = '<span class="material-symbols-outlined">open_in_full</span>';
        bar.appendChild(btn);
      });
      syncChartExpandBtns(root);
    }

    /* Flag the active version thumbnail in the stack so the chip and pane agree. */
    function syncSurfaceVersionThumbs(blockId, entry) {
      if (!entry) return;
      document.querySelectorAll(`.sc-surface-thumb[data-surface-ver="${blockId}"]`).forEach((t) => {
        t.classList.toggle('is-active', Number(t.getAttribute('data-ver')) === entry.version);
      });
    }

    /* Open a SPECIFIC version of a surfaced output in its pane (tapping one of the
       stacked version thumbnails on the transcript card). The chosen version's
       content is swapped in place of whatever version is currently shown, and the
       pane's version badge updates to match — so the mini-card stack and the
       output on the right always agree on which version you're looking at. */
    function openSurfaceVersion(blockId, verNum) {
      const e = SURFACED[blockId];
      if (!e) return;
      const list = e.versionKey ? SURFACE_VERSIONS[e.versionKey] : null;
      if (!list || !list.length || !verNum) { reopenSurface(blockId); return; }
      const idx = Math.max(0, Math.min((verNum | 0) - 1, list.length - 1));
      const entry = list[idx];
      const count = list.length;
      const verText = `${verLabel(entry.version)}${count > 1 ? ` · ${count} versions` : ''}`;
      syncSurfaceVersionThumbs(blockId, entry);
      const dest = mergedMode ? 'unified' : e.which;
      const pane = paneEl[dest];
      const body = paneBody[dest];
      if (!body) return;
      const tagged = tagBlock(entry.previewHtml, blockId, e.title, e.meta, e.icon, verText);
      const group = Array.from(body.querySelectorAll(`[data-block-id="${blockId}"]`));
      if (!group.length) {
        /* The output isn't in the pane anymore — open it fresh at this version. */
        openPane(e.which, { title: e.title, meta: e.meta, html: tagged });
        SURFACED[blockId].html = tagged;
        return;
      }
      /* Slot the chosen version back into the same carousel position: insert its
         block(s) before the current group's first block, then drop the old ones. */
      const tmp = document.createElement('div');
      tmp.innerHTML = tagged;
      const inserted = [];
      const anchor = group[0];
      while (tmp.firstChild) {
        const node = tmp.firstChild;
        if (dest === 'unified' && node.nodeType === 1) node.dataset.origin = e.which;
        body.insertBefore(node, anchor);
        if (node.nodeType === 1) inserted.push(node);
      }
      group.forEach((n) => n.remove());
      const blocks = inserted.filter((n) => n.classList && n.classList.contains('wa-block'));
      blocks.forEach((b) => ensureBlockOutTitle(b, e.title));
      /* Wake up any interactive content that just landed (tables / compare board). */
      body.querySelectorAll('.wa-tbl:not([data-ready])').forEach((tbl) => initTable(tbl));
      body.querySelectorAll('.cmp-host:not([data-ready])').forEach((h) => bootCompareEngine(h));
      if (pane && !pane.classList.contains('is-open')) ensurePaneOpen(pane);
      const firstBlock = blocks[0] || null;
      if (dest === 'unified') refreshUnifiedCarousel({ activate: firstBlock });
      else refreshPaneCarousel(e.which, { activate: firstBlock });
      updatePaneVer(dest);
      /* Remember the shown version so a later card-body tap reopens the same one. */
      SURFACED[blockId].html = tagged;
      ensureChartExpandBtns(body);
    }

    /* When a turn surfaces data, open/refresh the right panes shortly after the
       reply lands (so the transcript reads first, then the pane resolves).
       Generic follow-ups (compare / report / spider) reuse the previous
       topic's artifacts so the pane matches the transcript. */
    const COMPARE_SURFACE = {
      kraft: 'kraft_heinz', sprouts: 'sprouts', gras: 'gras', gras_upf: 'upf_def',
      energy: 'energy_sugar', proteinbars: 'protein_vs_granola', sweeteners: 'sweet_vs_natural',
      topbrands: 'topbrands_top10', brisket: 'brisket', upf: 'upf',

      kraft: 'kraft', sprouts: 'sprouts', gras: 'gras', gras_upf: 'gras_upf',
      energy: 'energy', proteinbars: 'proteinbars', sweeteners: 'sweeteners',
      topbrands: 'topbrands', brisket: 'brisket', upf: 'upf',
      worst: 'worst', cupcake: 'cupcake', cat: 'catnutrients',

      else if (intent === 'spider' && topic && topic !== 'worst' && SPIDER_SURFACE[topic]) intent = SPIDER_SURFACE[topic];

    /* The live References output as it sits in a pane — the transcript preview
       clone carries the same `.wa-refset` markup, so we skip anything nested in a
       `.sc-surface-card` and return the pane copy's tagged block. */
    function paneRefsetBlock() {
      /* Feline nutrition refs only — exclude news/law sets keyed by data-news-kind. */
      const refset = Array.from(document.querySelectorAll('.wa-refset:not([data-news-kind])'))
        .find((el) => !el.closest('.sc-surface-card'));
      return (refset && refset.closest('[data-block-id]')) || null;
    }

    /* News / law / Federal Register References — one live block per kind so a
       re-open finds the parked pane copy instead of spawning a duplicate. */
    function paneNewsRefsetBlock(kind) {
      const set = Array.from(document.querySelectorAll(`.wa-refset[data-news-kind="${kind}"]`))
        .find((el) => !el.closest('.sc-surface-card'));
      return (set && set.closest('[data-block-id]')) || null;
    }
    function surfaceNewsRefs(kind) {
      const cfg = NEWS_REFSETS[kind];
      if (!cfg) return;
      const existing = paneNewsRefsetBlock(kind);
      if (existing) { reopenSurface(existing.getAttribute('data-block-id')); return; }
      surfaceBlock('results', { icon: cfg.icon, title: cfg.title, meta: cfg.meta, html: newsRefsView(kind) });
    }
    function openNewsRefs(kind, i) {
      const focus = () => {
        const card = Array.from(document.querySelectorAll(`.wa-refset[data-news-kind="${kind}"] .wa-ref[data-news-i="${i}"]`))
          .find((el) => !el.closest('.sc-surface-card'));
        if (!card) return;
        const set = card.closest('.wa-refset');
        if (set) resetRefset(set);
        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        card.classList.add('is-flash');
        setTimeout(() => card.classList.remove('is-flash'), 1400);
      };
      const existing = paneNewsRefsetBlock(kind);
      if (existing) { reopenSurface(existing.getAttribute('data-block-id')); setTimeout(focus, 360); }
      else { surfaceNewsRefs(kind); setTimeout(focus, 900); }
    }

       superscript footnote markers in the answer and the compact footnote list.

    function openCatRef(n) {

          .find((el) => !el.closest('.sc-surface-card'));

        const set = card.closest('.wa-refset');

        if (det) det.open = true;
        card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        card.classList.add('is-flash');
        setTimeout(() => card.classList.remove('is-flash'), 1400);
      };
      const existingBlk = paneRefsetBlock();
      if (existingBlk) {

    /* ── References module search + scorecard filtering ──────────────────────
       The References output is injected as pane HTML (no inline scripts), so its
       search box + scorecard filters are driven by delegated document handlers.
       Each `.wa-refset` instance filters itself, so the pane copy and the inline
       transcript preview clone stay independent. */
    function filterRefset(set) {
      if (!set) return;
      const activeStat = set.querySelector('.wa-ref-stat.is-active');
      const cat = activeStat ? activeStat.dataset.refcat : 'all';
      const input = set.querySelector('.wa-ref-search-input');
      const q = (input ? input.value : '').trim().toLowerCase();
      let shown = 0;
      set.querySelectorAll('.wa-ref').forEach((card) => {
        const okCat = cat === 'all' || card.dataset.refcat === cat;
        const okQ = !q || (card.dataset.search || '').includes(q);
        const ok = okCat && okQ;
        card.style.display = ok ? '' : 'none';
        if (ok) shown += 1;
      });
      const empty = set.querySelector('.wa-ref-empty');
      if (empty) empty.hidden = shown !== 0;
    }
    function resetRefset(set) {
      if (!set) return;
      const input = set.querySelector('.wa-ref-search-input');
      if (input) input.value = '';
      set.querySelectorAll('.wa-ref-stat').forEach((b) => {
        const on = b.dataset.refcat === 'all';
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      filterRefset(set);
    }
    document.addEventListener('input', (e) => {
      const input = e.target.closest && e.target.closest('.wa-ref-search-input');
      if (input) filterRefset(input.closest('.wa-refset'));
    });
    /* Ingredient-query table filter (artificial-sweeteners artifact). Each copy
       — the pane output and its inline transcript clone — filters itself.
       The in-input filter popover is portalled to <body> so pane overflow +
       transform don't clip it; it anchors above (or beside) the tune icon. */
    function ibChipOn(wrap, attr) {
      const root = (wrap && wrap._ibPop) || wrap;
      const el = root && root.querySelector(`.wa-ib-fchip[${attr}].is-on`);
      return el ? el.getAttribute(attr) : 'all';
    }
    function ibFiltersActive(wrap) {
      if (!wrap) return false;
      const root = wrap._ibPop || wrap;
      const flags = root.querySelectorAll('.wa-ib-fchip[data-flag].is-on');
      return ibChipOn(wrap, 'data-pl') !== 'all'
        || ibChipOn(wrap, 'data-gras') !== 'all'
        || ibChipOn(wrap, 'data-kind') !== 'all'
        || flags.length > 0;
    }
    function filterIbWrap(wrap) {
      if (!wrap) return;
      const root = wrap._ibPop || wrap;
      const input = wrap.querySelector('.wa-ib-search');
      const q = (input ? input.value : '').trim().toLowerCase();
      const pl = ibChipOn(wrap, 'data-pl');
      const gras = ibChipOn(wrap, 'data-gras');
      const kind = ibChipOn(wrap, 'data-kind');
      const flags = Array.from(root.querySelectorAll('.wa-ib-fchip[data-flag].is-on'))
        .map((c) => (c.getAttribute('data-flag') || '').toLowerCase());
      let shown = 0;
      wrap.querySelectorAll('.wa-ib-row').forEach((row) => {
        const rowFlags = (row.dataset.flags || '').split('|');
        const okQ = !q || (row.dataset.search || '').includes(q);
        const okPl = pl === 'all' || String(row.dataset.pl) === pl;
        const okGras = gras === 'all' || row.dataset.gras === gras;
        const okKind = kind === 'all' || row.dataset.kind === kind;
        const okFlags = !flags.length || flags.every((f) => rowFlags.includes(f));
        const ok = okQ && okPl && okGras && okKind && okFlags;
        row.style.display = ok ? '' : 'none';
        if (ok) shown += 1;
      });
      const empty = wrap.querySelector('.wa-ib-empty');
      if (empty) empty.hidden = shown !== 0;
      const cnt = wrap.querySelector('.wa-ib-count-n');
      if (cnt) cnt.textContent = shown;
      const btn = wrap.querySelector('.wa-ib-filter-btn');
      if (btn) btn.classList.toggle('has-filters', ibFiltersActive(wrap));
    }
    function applyIbSort(wrap, key, dir) {
      const table = wrap && wrap.querySelector('.wa-ib');
      const body = wrap && wrap.querySelector('.wa-ib-body');
      if (!table || !body) return;
      table.dataset.sortCol = key;
      table.dataset.sortDir = dir;
      wrap.querySelectorAll('.wa-ib-th[data-sort]').forEach((h) => {
        const on = h.dataset.sort === key;
        h.classList.toggle('is-sorted', on);
        if (on) {
          h.setAttribute('data-wa-dir', dir);
          h.setAttribute('aria-sort', dir === 'asc' ? 'ascending' : 'descending');
        } else {
          h.removeAttribute('data-wa-dir');
          h.setAttribute('aria-sort', 'none');
        }
      });
      const rows = Array.from(body.querySelectorAll('.wa-ib-row'));
      const numeric = key === 'pl';
      rows.sort((a, b) => {
        let av = a.dataset[key] || '';
        let bv = b.dataset[key] || '';
        let cmp;
        if (numeric) cmp = (parseFloat(av) || 0) - (parseFloat(bv) || 0);
        else cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
        if (cmp) return dir === 'asc' ? cmp : -cmp;
        return (a.dataset.name || '').localeCompare(b.dataset.name || '', undefined, { sensitivity: 'base' });
      });
      rows.forEach((r) => body.appendChild(r));
    }
    function ibFilterHost(wrap) {
      return wrap && wrap.querySelector('.wa-search-inline.has-filter');
    }
    function placeIbFilterPop(btn, pop) {
      if (!btn || !pop) return;
      pop.style.position = 'fixed';
      pop.style.right = 'auto';
      pop.style.bottom = 'auto';
      const r = btn.getBoundingClientRect();
      const pw = pop.offsetWidth;
      const ph = pop.offsetHeight;
      let left = r.right - pw;
      left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
      let top = r.top - ph - 8;
      if (top < 8) {
        top = Math.max(8, Math.min(r.top, window.innerHeight - ph - 8));
        left = r.right + 8;
        if (left + pw > window.innerWidth - 8) left = Math.max(8, r.left - pw - 8);
      }
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }
    function closeIbFilter(wrap) {
      if (!wrap) return;
      const btn = wrap.querySelector('.wa-ib-filter-btn');
      const pop = wrap._ibPop || wrap.querySelector('.wa-ib-filter-pop');
      const host = ibFilterHost(wrap);
      if (pop && host && pop.parentElement !== host) host.appendChild(pop);
      if (pop) pop.hidden = true;
      if (btn) {
        btn.classList.remove('is-open');
        btn.setAttribute('aria-expanded', 'false');
      }
      wrap.removeAttribute('data-ib-filter-open');
    }
    function closeAllIbFilters() {
      document.querySelectorAll('.wa-ib-wrap[data-ib-filter-open]').forEach(closeIbFilter);
    }
    function openIbFilter(wrap) {
      if (!wrap) return;
      const btn = wrap.querySelector('.wa-ib-filter-btn');
      const pop = wrap._ibPop || wrap.querySelector('.wa-ib-filter-pop');
      if (!btn || !pop) return;
      closeAllIbFilters();
      wrap._ibPop = pop;
      pop._ibWrap = wrap;
      document.body.appendChild(pop);
      pop.hidden = false;
      wrap.setAttribute('data-ib-filter-open', '1');
      btn.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => placeIbFilterPop(btn, pop));
    }
    document.addEventListener('input', (e) => {
      const input = e.target.closest && e.target.closest('.wa-ib-search');
      if (!input) return;
      filterIbWrap(input.closest('.wa-ib-wrap'));
    });
    document.addEventListener('click', (e) => {
      const th = e.target.closest && e.target.closest('button.wa-ib-th[data-sort]');
      if (th) {
        const wrap = th.closest('.wa-ib-wrap');
        const table = wrap && wrap.querySelector('.wa-ib');
        if (!wrap || !table) return;
        const key = th.dataset.sort;
        const dir = table.dataset.sortCol === key
          ? (table.dataset.sortDir === 'asc' ? 'desc' : 'asc')
          : 'asc';
        applyIbSort(wrap, key, dir);
        closeAllIbFilters();
        return;
      }
      const btn = e.target.closest && e.target.closest('.wa-ib-filter-btn');
      if (btn) {
        const wrap = btn.closest('.wa-ib-wrap');
        if (!wrap) return;
        e.stopPropagation();
        if (wrap.getAttribute('data-ib-filter-open')) closeIbFilter(wrap);
        else openIbFilter(wrap);
        return;
      }
      const clear = e.target.closest && e.target.closest('.wa-ib-filter-clear');
      if (clear) {
        const pop = clear.closest('.wa-ib-filter-pop');
        const wrap = (pop && pop._ibWrap) || (clear.closest && clear.closest('.wa-ib-wrap'));
        if (!wrap) return;
        const root = wrap._ibPop || wrap;
        root.querySelectorAll('.wa-ib-filter-chips[data-ib-group]').forEach((group) => {
          const exclusive = group.getAttribute('data-ib-group') !== 'flag';
          group.querySelectorAll('.wa-ib-fchip').forEach((chip) => {
            const isAll = exclusive && (chip.getAttribute('data-pl') === 'all'
              || chip.getAttribute('data-gras') === 'all'
              || chip.getAttribute('data-kind') === 'all');
            chip.classList.toggle('is-on', !!isAll);
          });
        });
        filterIbWrap(wrap);
        return;
      }
      const chip = e.target.closest && e.target.closest('.wa-ib-fchip');
      if (chip) {
        const group = chip.closest('.wa-ib-filter-chips');
        const pop = chip.closest('.wa-ib-filter-pop');
        const wrap = (pop && pop._ibWrap) || (chip.closest && chip.closest('.wa-ib-wrap'));
        if (!group || !wrap) return;
        if (group.getAttribute('data-ib-group') === 'flag') {
          chip.classList.toggle('is-on');
        } else {
          group.querySelectorAll('.wa-ib-fchip').forEach((c) => c.classList.toggle('is-on', c === chip));
        }
        filterIbWrap(wrap);
        return;
      }
      if (!e.target.closest || !e.target.closest('.wa-ib-filter-pop')) closeAllIbFilters();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllIbFilters();
    });
    window.addEventListener('resize', closeAllIbFilters);
    document.addEventListener('scroll', (e) => {
      const open = document.querySelector('.wa-ib-wrap[data-ib-filter-open]');
      if (!open) return;
      const pop = open._ibPop;
      const btn = open.querySelector('.wa-ib-filter-btn');
      if (pop && btn && !pop.hidden) placeIbFilterPop(btn, pop);
    }, true);
    document.addEventListener('click', (e) => {
      const stat = e.target.closest && e.target.closest('.wa-ref-stat');
      if (!stat) return;
      const set = stat.closest('.wa-refset');
      if (!set) return;
      set.querySelectorAll('.wa-ref-stat').forEach((b) => {
        const on = b === stat;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      filterRefset(set);
    });

    /* ── "What can I ask?" catalog ────────────────────────────────────────────

        activity: true,

  <script>
  /* ===== COMPARE ENGINE HOST SHIMS =====
     The next <script> is a verbatim copy of the compare engine from
     product-comparison.html. It expects a handful of chat + panel helpers on
     its host page. Here we (a) bridge its chat calls into this page's WISEcodeAI
     chat — the module script fills window.__waChatBridge once mountWISEcodeAIChat
     runs — and (b) no-op the panel-docking helpers this side-pane port doesn't
     use. These are true globals so the engine's bare-identifier calls resolve. */
  window.__waChatBridge = null;
  function addUserMessage(text, opts) {
    var b = window.__waChatBridge;
    if (b && b.addUser) b.addUser(String(text == null ? '' : text));
  }
  /* Resolves when the MOST RECENT compare-flow answer has finished typing in, so
     its trailing chip row can be held back until then (bound per-reply, never a
     shared flag — the board posts preview cards mid-answer that must not release
     the chips early). */
  var __waReplyDone = Promise.resolve();
  function addWISEcodeAIMessage(html, opts) {
    var b = window.__waChatBridge;
    if (!b || !b.addWISEcodeAI) { __waReplyDone = Promise.resolve(); return; }
    var resolve;
    __waReplyDone = new Promise(function (r) { resolve = r; });
    b.addWISEcodeAI(html, {
      source: (opts && opts.source) || '',
      /* Compare-flow answers are real WISEcodeAI turns, so they carry the same
         action-icon row (copy / thumbs / re-run / edit / fork) as any other —
         on by default, opt out with { feedback:false }. */
      feedback: !(opts && opts.feedback === false),
      /* This surface supplies its OWN follow-up chips (Add / Metrics / Rank …)
         right after the answer, so suppress the module's generic welcome intent
         chips here — otherwise both would trail the same turn. */
      trailChips: false,
      onDone: function () { resolve(); },
    });
  }

    /* ── Module open / close ──────────────────────────────────────────── */
    /* Guarantee the report opens to the RIGHT of the chat, every time an
       intent chip is clicked — regardless of any earlier flip/dock state.
       The chat is a fixed early child of #modules-row (so it's always the
       left module); returning the report board to a direct child of the row
       (its right-of-chat home) undoes any previous "flip left", and syncs the
       flip control so its persisted side is 'right'. */
    function dockReportRight(panelId, flipKey) {
      const panel = document.getElementById(panelId);
      const row = document.getElementById('modules-row');
      if (!panel || !row) return;
      if (panel.parentElement !== row) row.appendChild(panel);
      if (flipKey && typeof window.flipPanelTo === 'function') window.flipPanelTo(flipKey, 'right');
    }

    function openComparePanel() {
      const panel = document.getElementById('compare-panel');
      if (!panel) return;
      dockReportRight('compare-panel', 'compare');
      panel.classList.add('cp-open');
      try {
        const w = JSON.parse(localStorage.getItem('wise-panel-wide-v1') || '{}') || {};
        if (w.compare === undefined && typeof window.setPanelWide === 'function') window.setPanelWide('compare', 1);
      } catch (_) {}
      if (typeof syncPanelsRowRight === 'function') syncPanelsRowRight();
      scrollPanelIntoView('compare-panel');
    }
    function closeComparisonWorkflow() {
      const panel = document.getElementById('compare-panel');
      if (!panel) return;
      if (typeof cmpCloseKindMenu === 'function') cmpCloseKindMenu();
      panel.classList.remove('cp-open');
      if (typeof syncPanelsRowRight === 'function') syncPanelsRowRight();
    }

      const keepGsAlgorithm = (compareState && compareState.gsAlgorithm) || 'auto';
      const keepGsRows = (compareState && compareState.gsRows) ? compareState.gsRows.slice() : null;
      compareState = {
        scope: null, metrics: CMP_DEFAULT_METRICS.slice(), category: 'all',
        showAvg: false, shown: [], pending: [], stale: false, recalcing: false,
        drill: false, metricMenuOpen: false, chartMode: 'bars', followDone: {},

        gsAlgorithm: keepGsAlgorithm, gsRows: keepGsRows, gsAlgoMenuOpen: false,
        takeawaySlots: ['perf', 'prot', 'clean', 'val'],
      };
      const body = document.getElementById('cmp-body');
      if (body) {
        body.innerHTML =

          '<div class="cmp-owl-loader" role="status" aria-label="Loading comparison">' + WISEAI_OWL_BUG + '</div>' +

      compareState.drill = false;
      compareState.metricMenuOpen = false;
      compareState.pending = [];
      compareState.stale = false;
      compareState.recalcing = false;
      compareState.metrics = CMP_DEFAULT_METRICS.slice();
      if (scope.emphasis && !compareState.metrics.includes(scope.emphasis)) compareState.metrics.push(scope.emphasis);
      compareState.shown = scope.entities.slice(0, scope.initShown).map(e => e.id);
      const tabKey = scope.tab || key;
      document.querySelectorAll('#cmp-scopebar .cmp-scope-btn').forEach(b => b.classList.toggle('is-active', b.dataset.scope === tabKey));
      const sub = document.getElementById('cmp-subtitle');
      if (sub) sub.textContent = scope.label + ' · WISEcode Intelligence';
      renderCompare();
      scrollPanelIntoView('compare-panel');
    }

    /* ── Live controls ────────────────────────────────────────────────── */
    /* Merged Category control — a single pill that owns both axes of "category":
       WHICH category the board is scoped to, and whether that category's AVERAGE
       is overlaid as a peer. Picking a category and flipping the average live
       together in one body-portalled popover instead of two loose controls. */
    function cmpCatControl() {
      const cur = compareState.category || 'all';
      const label = (cur && cur !== 'all') ? cur : 'All Categories';
      const avg = compareState.showAvg;
      return '<div id="cmp-cat-wrap" class="cmp-cat-wrap">' +
        `<button type="button" id="cmp-cat-btn" class="cmp-tool-btn cmp-cat-btn${avg ? ' has-avg' : ''}" onclick="cmpToggleCatMenu(this)" aria-haspopup="menu" aria-expanded="false" aria-label="Category and average">` +
          '<span class="material-symbols-outlined">filter_alt</span>' +
          `<span class="cmp-cat-btn-label">${label}</span>` +
          (avg ? '<span class="cmp-cat-avg-badge">Avg</span>' : '') +
          '<span class="material-symbols-outlined cmp-cat-caret">expand_more</span>' +
        '</button>' +
      '</div>';
    }
    let cmpCatMenuEl = null;
    function cmpToggleCatMenu(btn) {
      if (cmpCatMenuEl) { cmpCloseCatMenu(); return; }
      const anchor = btn || document.getElementById('cmp-cat-btn');
      if (!anchor) return;
      const menu = document.createElement('div');
      menu.className = 'cmp-cat-menu';
      menu.setAttribute('role', 'menu');
      document.body.appendChild(menu);
      cmpCatMenuEl = menu;
      cmpRenderCatMenu();
      cmpPositionCatMenu(anchor);
      anchor.setAttribute('aria-expanded', 'true');
      setTimeout(() => document.addEventListener('mousedown', cmpOutsideCat, true), 0);
      window.addEventListener('scroll', cmpCloseCatMenu, true);
      window.addEventListener('resize', cmpCloseCatMenu, true);
    }
    function cmpRenderCatMenu() {
      if (!cmpCatMenuEl) return;
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const cats = scope.categories || ['all'];
      const cur = compareState.category || 'all';
      const avg = compareState.showAvg;
      const avgRow =
        `<button type="button" class="cmp-cat-avg-row${avg ? ' is-on' : ''}" role="menuitemcheckbox" aria-checked="${avg}" onclick="cmpMenuToggleAvg()">` +
          '<span class="cmp-cat-avg-txt"><span class="material-symbols-outlined">show_chart</span>Category average</span>' +
          '<span class="cmp-switch-track" aria-hidden="true"></span>' +
        '</button>';
      const list = cats.map(c => {
        const on = c === cur;
        const l = c === 'all' ? 'All Categories' : c;
        const val = String(c).replace(/'/g, "\\'");
        return `<button type="button" role="menuitemradio" aria-checked="${on}" class="cmp-cat-item${on ? ' is-active' : ''}" onclick="cmpMenuSetCategory('${val}')">` +
          `<span class="cmp-cat-item-label">${l}</span>` +
          (on ? '<span class="material-symbols-outlined cmp-cat-check">check</span>' : '') +
        '</button>';
      }).join('');
      cmpCatMenuEl.innerHTML =
        '<div class="cmp-cat-menu-hd">Overlay</div>' + avgRow +
        '<div class="cmp-cat-menu-div"></div>' +
        '<div class="cmp-cat-menu-hd">Scope to category</div>' +
        '<div class="cmp-cat-menu-list">' + list + '</div>';
    }
    function cmpPositionCatMenu(anchor) {
      if (!cmpCatMenuEl || !anchor) return;
      const r = anchor.getBoundingClientRect();
      const mw = cmpCatMenuEl.offsetWidth || 244;
      const mh = cmpCatMenuEl.offsetHeight || 260;
      let left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8));
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
      cmpCatMenuEl.style.left = left + 'px';
      cmpCatMenuEl.style.top = top + 'px';
    }
    function cmpCloseCatMenu() {
      if (cmpCatMenuEl) { cmpCatMenuEl.remove(); cmpCatMenuEl = null; }
      const btn = document.getElementById('cmp-cat-btn');
      if (btn) btn.setAttribute('aria-expanded', 'false');
      document.removeEventListener('mousedown', cmpOutsideCat, true);
      window.removeEventListener('scroll', cmpCloseCatMenu, true);
      window.removeEventListener('resize', cmpCloseCatMenu, true);
    }
    function cmpOutsideCat(e) {
      if (cmpCatMenuEl && cmpCatMenuEl.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.cmp-cat-wrap')) return;
      cmpCloseCatMenu();
    }
    /* Flip the average overlay from inside the popover — keep it open so the
       user can keep tuning, and refresh both the board and the live menu. */
    function cmpMenuToggleAvg() {
      compareState.showAvg = !compareState.showAvg;
      renderCompare();
      cmpRenderCatMenu();
      const btn = document.getElementById('cmp-cat-btn');
      if (btn) btn.setAttribute('aria-expanded', 'true');
      cmpPositionCatMenu(btn);
    }
    function cmpMenuSetCategory(cat) {
      compareState.category = cat;
      cmpCloseCatMenu();
      renderCompare();
    }

    /* Split "＋ Add" control: the main face opens the guided add chat, while the
       caret opens a dropdown to jump straight to adding a Product / Portfolio /
       Category. Rendered inside the toolbar; the menu re-renders with the board
       so its open state survives a re-render (mirrors the metric menu). */
    /* Add is locked to the board's kind, so there's no "what kind?" chooser —
       just one button that adds another of the same kind (product / portfolio
       / category) the comparison started as. */
    function cmpAddSplit(disabled) {
      const dis = disabled ? ' disabled' : '';
      const label = cmpKindLabel(cmpLockedKind());
      return '<div class="cmp-add-wrap">' +
        `<button type="button" class="cmp-tool-btn cmp-tool-btn--primary cmp-add-main cmp-add-solo" onclick="cmpPromptAddEntity()"${dis}><span class="material-symbols-outlined">add</span>Add ${label}</button>` +
      '</div>';
    }
    /* Body-portalled type dropdown for the split Add button — lives on <body>
       with fixed positioning so nothing on the board can clip or cover it. */
    let cmpAddMenuEl = null;
    function cmpToggleAddMenu(btn) {
      if (cmpAddMenuEl) { cmpCloseAddMenu(); return; }
      const anchor = btn || document.getElementById('cmp-add-caret');
      if (!anchor) return;
      const kinds = [['product', 'Product', 'inventory_2'], ['portfolio', 'Portfolio', 'business'], ['category', 'Category', 'category']];
      const menu = document.createElement('div');
      menu.className = 'cmp-add-menu';
      menu.setAttribute('role', 'menu');
      menu.innerHTML = kinds.map(([k, l, ic]) =>
        `<button type="button" role="menuitem" class="cmp-add-menu-item" onclick="cmpAddPickKind('${k}')"><span class="material-symbols-outlined">${ic}</span>Add ${l}</button>`
      ).join('');
      document.body.appendChild(menu);
      cmpAddMenuEl = menu;
      cmpPositionAddMenu(anchor);
      anchor.setAttribute('aria-expanded', 'true');
      setTimeout(() => document.addEventListener('mousedown', cmpOutsideAdd, true), 0);
      window.addEventListener('scroll', cmpCloseAddMenu, true);
      window.addEventListener('resize', cmpCloseAddMenu, true);
    }
    function cmpPositionAddMenu(anchor) {
      if (!cmpAddMenuEl || !anchor) return;
      const r = anchor.getBoundingClientRect();
      const mw = cmpAddMenuEl.offsetWidth || 190;
      const mh = cmpAddMenuEl.offsetHeight || 150;
      let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
      left = Math.max(8, left);
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
      cmpAddMenuEl.style.left = left + 'px';
      cmpAddMenuEl.style.top = top + 'px';
    }
    function cmpCloseAddMenu() {
      if (cmpAddMenuEl) { cmpAddMenuEl.remove(); cmpAddMenuEl = null; }
      document.querySelectorAll('.cmp-add-caret[aria-expanded="true"]').forEach(c => c.setAttribute('aria-expanded', 'false'));
      document.removeEventListener('mousedown', cmpOutsideAdd, true);
      window.removeEventListener('scroll', cmpCloseAddMenu, true);
      window.removeEventListener('resize', cmpCloseAddMenu, true);
    }
    function cmpOutsideAdd(e) {
      if (cmpAddMenuEl && cmpAddMenuEl.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.cmp-add-wrap')) return;
      cmpCloseAddMenu();
    }
    function cmpAddPickKind(kind) {
      cmpCloseAddMenu();
      if (compareState.shown.length >= 5) {
        addWISEcodeAIMessage('You’ve hit the <strong>5-item limit</strong> for one comparison (1 primary + 4 comparators). Remove one on the board to add another.', { source: false });
        return;
      }
      /* Locked to the board's kind so a comparison can never become mixed. */
      kind = cmpLockedKind();
      addUserMessage('Add a ' + cmpKindLabel(kind) + ' to the comparison');
      cmpPromptAddOfKind(kind);
    }

    function cmpToggleMetricMenu() {
      compareState.metricMenuOpen = !compareState.metricMenuOpen;
      renderCompare();
      /* Listen on mousedown, not click: a checkbox toggle re-renders the menu
         (detaching the clicked node) before the click event finishes bubbling,
         which would otherwise read as an "outside" click and close the menu. */
      if (compareState.metricMenuOpen) setTimeout(() => document.addEventListener('mousedown', cmpOutsideMetric), 0);
      else document.removeEventListener('mousedown', cmpOutsideMetric);
    }
    function cmpOutsideMetric(e) {
      const wrap = document.getElementById('cmp-metric-wrap');
      if (wrap && wrap.contains(e.target)) return;
      compareState.metricMenuOpen = false;
      document.removeEventListener('mousedown', cmpOutsideMetric);
      renderCompare();
    }
    function cmpToggleMetric(id) {
      const m = CMP_METRIC_BY_ID[id];
      if (!m || m.future) return;
      const i = compareState.metrics.indexOf(id);
      if (i >= 0) {
        if (compareState.metrics.length <= 1) return; /* keep at least one */
        compareState.metrics.splice(i, 1);
      } else {
        compareState.metrics.push(id);
      }
      /* Selecting an ingredient leaf reveals the ingredient drill-down. */
      compareState.drill = compareState.metrics.some(x => { const mm = CMP_METRIC_BY_ID[x]; return mm && mm.fam === 'Ingredient Quality' && x !== 'ing_overall'; });
      renderCompare();
    }
    function cmpSetCategory(cat) {
      compareState.category = cat;
      renderCompare();
    }
    function cmpToggleCategoryAvg() {
      compareState.showAvg = !compareState.showAvg;
      renderCompare();
    }
    function cmpAddEntity() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      if (compareState.shown.length >= 5) {
        addWISEcodeAIMessage('You’ve hit the <strong>5-item limit</strong> for one comparison (1 primary + 4 competitors). Remove one to add another.', { source: false });
        return;
      }
      const next = scope.entities.find(e => !compareState.shown.includes(e.id));
      if (!next) {
        addWISEcodeAIMessage('That’s every entity in this demo set — all <strong>' + compareState.shown.length + '</strong> are already on the board.', { source: false });
        return;
      }
      compareState.shown.push(next.id);
      renderCompare();
      return next;
    }
    function cmpRemoveEntity(id) {
      if (compareState.shown.length <= 2) return; /* keep a real comparison */
      compareState.shown = compareState.shown.filter(x => x !== id);
      if (compareState.pending) compareState.pending = compareState.pending.filter(x => x !== id);
      if (compareState.pending && !compareState.pending.length) compareState.stale = false;
      renderCompare();
    }

    /* Adding a competitor is always driven THROUGH the chat — the board's
       "Add" button never silently drops in a random entity. It asks WISEcodeAI,
       which posts a prompt with the specific brands/products you can pick. */
    /* Build the pickable candidate list for the Add prompt: the board's own
       shelf-set members that aren't shown yet (the strongest matches) come
       first, then the deep-bench suggestion pool for this scope's noun. Deduped
       by name and capped at 10 so the chat always offers a real menu of
       competitors — even when the current shelf set is fully on the board. */
    function cmpAddCandidates(scope, kind) {
      kind = kind || scope.noun;
      /* Category picks come straight from the synthesised category set — one
         chip per category not already on the board. */
      if (kind === 'category') {
        const shownIds = new Set(compareState.shown);
        const list = CMP_CATEGORY_ENTITIES.filter(e => !shownIds.has(e.id)).slice(0, 10);
        return { list, realCount: 0, matchCount: Math.min(3, list.length) };
      }
      const shownNames = new Set(
        compareState.shown.map(id => (scope.entities.find(e => e.id === id) || {}).name).filter(Boolean)
      );
      const pool = kind === 'portfolio' ? CMP_BRAND_SUGGESTIONS : CMP_PRODUCT_SUGGESTIONS;
      const realAvail = scope.entities.filter(e => !compareState.shown.includes(e.id) && !e.primary && cmpEntKind(e, scope) === kind);
      const realSet = new Set(realAvail);
      /* Bias suggestions toward what's actually being compared: for products,
         match the primary product's category (so a dip comparison surfaces
         dips, not granola); for portfolios under a category filter, favour
         brands that carry products in that category. */
      const primary = scope.entities.find(e => e.primary) || scope.entities[0] || {};
      const wantCat = scope.noun === 'portfolio'
        ? (compareState.category && compareState.category !== 'all' ? compareState.category : null)
        : primary.cat;
      const relevance = e => {
        if (!wantCat) return 0;
        if (scope.noun === 'portfolio') return (e.cats && e.cats[wantCat]) ? 1 : 0;
        return e.cat === wantCat ? 1 : 0;
      };
      const seen = new Set();
      const merged = [];
      [...realAvail, ...pool].forEach(e => {
        if (shownNames.has(e.name) || seen.has(e.name)) return;
        seen.add(e.name);
        merged.push(e);
      });
      /* Stable sort: category matches first, real shelf-set members ahead of
         the deep-bench pool, otherwise original order. */
      const scored = merged.map((e, i) => ({ e, i, rel: relevance(e), real: realSet.has(e) ? 1 : 0 }));
      scored.sort((a, b) => (b.rel - a.rel) || (b.real - a.real) || (a.i - b.i));
      const relevantCount = scored.filter(s => s.rel).length;
      const list = scored.map(s => s.e).slice(0, 10);
      /* How many leading chips to flag as "closest matches": the relevant ones
         if we found any, else the real shelf-set members, else a sensible few. */
      const matchCount = Math.min(list.length, relevantCount || realAvail.length || Math.min(3, list.length));
      return { list, realCount: realAvail.length, matchCount };
    }

    /* The chat chips that let you choose WHICH kind to add / swap in. Shared
       by the Add flow and the per-slot type toggle. */
    function cmpKindChips(onclickFn, current, argPrefix) {
      const pre = argPrefix || '';
      const kinds = [['product', 'Product', 'inventory_2'], ['portfolio', 'Portfolio', 'business'], ['category', 'Category', 'category']];
      return kinds.map(([k, l, ic]) => {
        const cls = k === current ? 'chip chip--match' : 'chip';
        return `<button type="button" class="${cls}" onclick="${onclickFn}(${pre}'${k}', this)"><span class="material-symbols-outlined">${ic}</span>${l}</button>`;
      }).join('');
    }

    /* Jump straight to picking a specific product / portfolio / category to
       add, skipping the intermediate "what kind?" step. Backs the dedicated
       per-kind add chips offered on the follow row (Add a product / Add a
       category / Add a portfolio). */
    function cmpPromptAddKind(kind, btn) {
      if (compareState.shown.length >= 5) {
        btn?.closest('.sc-reply-chips')?.remove();
        addWISEcodeAIMessage('You’ve hit the <strong>5-item limit</strong> for one comparison (1 primary + 4 comparators). Remove one on the board to add another.', { source: false });
        return;
      }
      /* Locked to the board's kind — the requested kind is ignored if it
         doesn't match, so a comparison can never become mixed. */
      kind = cmpLockedKind();
      addUserMessage('Add a ' + cmpKindLabel(kind) + ' to the comparison');
      cmpPromptAddOfKind(kind, btn);
    }

    /* Add is LOCKED to the board's kind: there's no "what kind?" step. Whatever
       the comparison started as (product / portfolio / category) is the only
       kind you can add, so we jump straight to picking the specific one. */
    function cmpPromptAddEntity() {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      if (compareState.shown.length >= 5) {
        addWISEcodeAIMessage('You’ve hit the <strong>5-item limit</strong> for one comparison (1 primary + 4 comparators). Remove one on the board to add another.', { source: false });
        return;
      }
      document.getElementById('cmp-add-chips')?.remove();
      document.getElementById('cmp-add-kind-chips')?.remove();
      const kind = cmpLockedKind();
      addUserMessage('Add a ' + cmpKindLabel(kind) + ' to the comparison');
      cmpPromptAddOfKind(kind);
    }

    /* Show the specific picks for the chosen kind. */
    function cmpPromptAddOfKind(kind, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-add-kind-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const label = cmpKindLabel(kind);
      const { list, matchCount } = cmpAddCandidates(scope, kind);
      document.getElementById('cmp-add-chips')?.remove();
      const typing = showWISEcodeAITyping('WISEcodeAI is finding ' + label + 's you can add');
      setTimeout(() => {
        typing?.remove();
        if (!list.length) {
          addWISEcodeAIMessage('I couldn’t find another ' + label + ' to add here. Remove one on the board first, then try again.', { source: false });
          return;
        }
        const lead = kind === 'category'
          ? 'Which <strong>category</strong> would you like to drop in as a peer? Each is the average profile across every product WISEcode scored in it.'
          : 'Which ' + label + ' would you like to add? The <strong>starred</strong> ones are the closest matches to your current board.';
        addWISEcodeAIMessage(lead + ' I’ll drop it onto the board as a pending column, then fold it into the ranking.', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const chips = list.map((e, i) => {
          const isMatch = i < matchCount;
          const ic = isMatch ? 'auto_awesome' : 'add';
          const cls = isMatch ? 'chip chip--match' : 'chip';
          return `<button type="button" class="${cls}" onclick="cmpConfirmAddEntity('${e.id}', this)"><span class="material-symbols-outlined">${ic}</span>${e.name}</button>`;
        }).join('');
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-add-chips';
        row.innerHTML = chips;
        cmpOfferChipRow(row);
      }, 480);
    }

    /* Resolve a picked id into the scope's working set, tagging its KIND from
       the pool it came from so mixed boards resolve every column correctly.
       Shared by the add and per-slot swap flows. */
    function cmpResolvePickIntoScope(scope, id) {
      let ent = scope.entities.find(e => e.id === id);
      if (ent) return ent;
      const tagged = [[CMP_CATEGORY_ENTITIES, 'category'], [CMP_BRAND_SUGGESTIONS, 'portfolio'], [CMP_PRODUCT_SUGGESTIONS, 'product']];
      for (const [pool, kind] of tagged) {
        const src = pool.find(e => e.id === id);
        if (src) { const clone = Object.assign({}, src); clone.kind = src.kind || kind; scope.entities.push(clone); return clone; }
      }
      return null;
    }

    /* Commit the specific pick the user chose from the chat prompt. The new
       entity lands as a *pending* column (ghosted, unranked); the board goes
       stale and asks to be recalculated, so nothing silently reshuffles. */
    function cmpConfirmAddEntity(id, btn) {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      /* Resolve the pick BEFORE tearing down the prompt chips, so a pick can
         never silently vanish. Looks in the scope, then the product / brand /
         category pools, cloning + kind-tagging so mixed boards resolve. */
      const ent = cmpResolvePickIntoScope(scope, id);
      /* Unknown id — leave the chips in place so the user can pick again. */
      if (!ent) return;
      /* Committed to a real pick: now retire the prompt chips. */
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-add-chips')?.remove();
      /* Guard cases get a visible reply instead of a silent no-op. */
      if (compareState.shown.includes(id)) {
        addWISEcodeAIMessage('<strong>' + ent.name + '</strong> is already on the board.', { source: false });
        return;
      }
      if (compareState.shown.length >= 5) {
        addWISEcodeAIMessage('You’ve hit the <strong>5-item limit</strong> (1 primary + 4 competitors). Remove one on the board to add another.', { source: false });
        return;
      }
      addUserMessage('Add ' + ent.name);
      const typing = showWISEcodeAITyping('Dropping ' + ent.name + ' onto the board');
      setTimeout(() => {
        typing?.remove();
        compareState.shown.push(id);
        (compareState.pending = compareState.pending || []).push(id);
        compareState.stale = true;
        renderCompare();               /* new column lands as a pending ghost… */
        scrollPanelIntoView('compare-panel');
        addWISEcodeAIMessage('Added <strong>' + ent.name + '</strong> — scoring it and folding it into the ranking now…', { source: false });
        /* …then auto-fold it in so the board always resolves. Previously this
           waited on a manual "Recalculate" click, which left the column stuck
           as a shimmering skeleton if that button was never pressed. */
        setTimeout(() => cmpRecalculate({ auto: true }), 520);
      }, 560);
    }

    /* ── Per-slot type toggle ─────────────────────────────────────────────
       The column chip calls this: change a single slot between product /
       portfolio / category. Step 1 — pick the new kind. */
    function cmpPromptSwapSlot(id) {
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const ent = scope.entities.find(e => e.id === id) || {};
      const curKind = cmpEntKind(ent, scope);
      document.getElementById('cmp-swap-chips')?.remove();
      document.getElementById('cmp-swap-pick-chips')?.remove();
      addUserMessage('Change a comparison slot to a different type');
      const typing = showWISEcodeAITyping();
      setTimeout(() => {
        typing?.remove();
        addWISEcodeAIMessage('Swap <strong>' + (ent.name || 'this slot') + '</strong> to a different type — a <strong>product</strong>, whole <strong>portfolio</strong>, or a <strong>category</strong> average. I’ll replace it and re-rank.', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-swap-chips';
        row.innerHTML = cmpKindChips('cmpPromptSwapPick', curKind, "'" + id + "',");
        cmpOfferChipRow(row);
      }, 360);
    }

    /* Step 2 — with the kind chosen, pick the specific entity for that slot. */
    function cmpPromptSwapPick(slotId, kind, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-swap-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const label = cmpKindLabel(kind);
      const { list, matchCount } = cmpAddCandidates(scope, kind);
      const typing = showWISEcodeAITyping('WISEcodeAI is finding ' + label + 's');
      setTimeout(() => {
        typing?.remove();
        if (!list.length) {
          addWISEcodeAIMessage('No other ' + label + ' is available to place in that slot.', { source: false });
          return;
        }
        addWISEcodeAIMessage('Pick the ' + label + ' to place in that slot:', { source: false });
        const box = cmpChatBox();
        if (!box) return;
        const chips = list.map((e, i) => {
          const isMatch = i < matchCount;
          const ic = isMatch ? 'auto_awesome' : 'add';
          const cls = isMatch ? 'chip chip--match' : 'chip';
          return `<button type="button" class="${cls}" onclick="cmpConfirmSwapSlot('${slotId}','${e.id}', this)"><span class="material-symbols-outlined">${ic}</span>${e.name}</button>`;
        }).join('');
        const row = document.createElement('div');
        row.className = 'sc-reply-chips';
        row.id = 'cmp-swap-pick-chips';
        row.innerHTML = chips;
        cmpOfferChipRow(row);
      }, 460);
    }

    /* Step 3 — replace the slot's occupant in place, carry the YOU anchor
       (unless swapping to a category), then re-rank via the usual recalc. */
    function cmpConfirmSwapSlot(slotId, pickId, btn) {
      btn?.closest('.sc-reply-chips')?.remove();
      document.getElementById('cmp-swap-pick-chips')?.remove();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const idx = compareState.shown.indexOf(slotId);
      if (idx < 0) return;
      if (pickId === slotId) { addWISEcodeAIMessage('That slot already holds that item.', { source: false }); return; }
      if (compareState.shown.includes(pickId)) {
        const dupe = scope.entities.find(e => e.id === pickId) || cmpResolvePickIntoScope(scope, pickId) || {};
        addWISEcodeAIMessage('<strong>' + (dupe.name || 'That item') + '</strong> is already on the board.', { source: false });
        return;
      }
      const ent = cmpResolvePickIntoScope(scope, pickId);
      if (!ent) return;
      const old = scope.entities.find(e => e.id === slotId) || {};
      const oldKind = cmpEntKind(old, scope);
      const newKind = ent.kind || cmpEntKind(ent, scope);
      /* Is this the seed (first/anchor) column changing to a DIFFERENT kind?
         If so, we re-key the whole board to the new kind: the seed becomes the
         only column (competitors of the old kind are cleared), then the user
         builds the comparison back up by adding the new kind. This keeps a board
         from ever holding a mix of kinds. */
      const isSeed = slotId === cmpSeedId();
      const reKey = isSeed && newKind !== oldKind;
      /* Carry the YOU anchor to the new seed for product/portfolio; a category
         seed can't be "YOU", so clear the primary flag instead. Only touch
         primary flags when the seed itself is being swapped. */
      if (isSeed) {
        scope.entities.forEach(e => { if (e.primary) e.primary = false; });
        if (newKind !== 'category') ent.primary = true;
      } else if (old.primary && newKind !== 'category') {
        ent.primary = true; old.primary = false;
      }
      addUserMessage(reKey ? ('Compare ' + cmpKindLabel(newKind) + 's instead') : ('Swap in ' + ent.name));
      const typing = showWISEcodeAITyping(reKey ? ('Rebuilding as a ' + cmpKindLabel(newKind) + ' comparison') : ('Swapping in ' + ent.name));
      setTimeout(() => {
        typing?.remove();
        if (reKey) {
          /* Reset to just the new seed; drop every other column so nothing of
             the old kind lingers. */
          compareState.shown = [pickId];
          compareState.pending = [pickId];
        } else {
          compareState.shown[idx] = pickId;
          (compareState.pending = compareState.pending || []).push(pickId);
        }
        compareState.stale = true;
        renderCompare();
        scrollPanelIntoView('compare-panel');
        addWISEcodeAIMessage(reKey
          ? ('Switched the anchor to <strong>' + ent.name + '</strong> — this is now a <strong>' + cmpKindLabel(newKind) + '</strong> comparison. Add more ' + cmpKindLabel(newKind) + 's on the right to build it out.')
          : ('Swapped in <strong>' + ent.name + '</strong> — scoring and re-ranking now…'), { source: false });
        setTimeout(() => cmpRecalculate({ auto: true }), 520);
      }, 520);
    }

    /* ── Per-slot type toggle — PROPER ON-BOARD DROPDOWN ──────────────────
       The column's kind chip opens a real floating menu anchored to it — no
       "copy in the chat". Step 1 (three type tabs) and step 2 (the specific
       item for that type) both live inside the one dropdown; picking an item
       swaps the slot in place and re-ranks via the usual recalc. */
    let cmpKindMenuEl = null;
    let cmpKindMenuState = null;   /* { slotId, kind, anchor } */

    function cmpCloseKindMenu() {
      if (cmpKindMenuEl) { cmpKindMenuEl.remove(); cmpKindMenuEl = null; }
      cmpKindMenuState = null;
      document.removeEventListener('mousedown', cmpKindMenuOutside, true);
      document.removeEventListener('keydown', cmpKindMenuKey, true);
      window.removeEventListener('scroll', cmpCloseKindMenu, true);
      window.removeEventListener('resize', cmpCloseKindMenu, true);
    }
    function cmpKindMenuOutside(e) {
      if (cmpKindMenuEl && !cmpKindMenuEl.contains(e.target)) cmpCloseKindMenu();
    }
    function cmpKindMenuKey(e) { if (e.key === 'Escape') cmpCloseKindMenu(); }

    function cmpToggleKindMenu(slotId, btn) {
      /* Second click on the same chip closes the menu. */
      if (cmpKindMenuEl && cmpKindMenuState && cmpKindMenuState.slotId === slotId) { cmpCloseKindMenu(); return; }
      cmpCloseKindMenu();
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const ent = scope.entities.find(e => e.id === slotId) || {};
      const isSeed = slotId === cmpSeedId();
      cmpKindMenuState = { slotId, kind: cmpEntKind(ent, scope), anchor: btn, isSeed };
      const menu = document.createElement('div');
      menu.className = 'cmp-kind-menu';
      menu.setAttribute('role', 'menu');
      cmpKindMenuEl = menu;
      document.body.appendChild(menu);
      cmpRenderKindMenu();
      cmpPositionKindMenu(btn);
      document.addEventListener('mousedown', cmpKindMenuOutside, true);
      document.addEventListener('keydown', cmpKindMenuKey, true);
      window.addEventListener('scroll', cmpCloseKindMenu, true);
      window.addEventListener('resize', cmpCloseKindMenu, true);
    }

    function cmpPositionKindMenu(btn) {
      if (!cmpKindMenuEl || !btn) return;
      const r = btn.getBoundingClientRect();
      const mw = cmpKindMenuEl.offsetWidth || 244;
      const mh = cmpKindMenuEl.offsetHeight || 260;
      let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
      left = Math.max(8, left);
      let top = r.bottom + 6;
      if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
      cmpKindMenuEl.style.left = left + 'px';
      cmpKindMenuEl.style.top = top + 'px';
    }

    function cmpRenderKindMenu() {
      if (!cmpKindMenuEl || !cmpKindMenuState) return;
      const scope = CMP_SCOPES[compareState.scope];
      if (!scope) return;
      const isSeed = !!cmpKindMenuState.isSeed;
      /* The SEED (first/anchor) column can change TYPE — product / portfolio /
         category — which re-keys the whole board. Every other column is locked
         to the board's kind and can only be swapped for another of that kind
         (no type tabs). */
      let kind, tabs = '', hd;
      if (isSeed) {
        kind = cmpKindMenuState.kind || cmpLockedKind();
        const kinds = [['product', 'Product', 'inventory_2'], ['portfolio', 'Portfolio', 'business'], ['category', 'Category', 'category']];
        tabs = '<div class="cmp-kind-menu-tabs">' + kinds.map(([k, l, ic]) =>
          `<button type="button" role="menuitemradio" aria-checked="${k === kind}" class="cmp-kind-menu-tab ${k === kind ? 'is-active' : ''}" onclick="cmpKindMenuSetKind('${k}')"><span class="material-symbols-outlined">${ic}</span>${l}</button>`
        ).join('') + '</div>';
        hd = 'Change this comparison to…';
      } else {
        kind = cmpLockedKind();
        cmpKindMenuState.kind = kind;
        hd = 'Swap in another ' + cmpKindLabel(kind);
      }
      const { list, matchCount } = cmpAddCandidates(scope, kind);
      const items = list.length
        ? list.map((e, i) => {
            const isMatch = i < matchCount;
            const ic = isMatch ? 'auto_awesome' : 'add';
            return `<button type="button" role="menuitem" class="cmp-kind-menu-item ${isMatch ? 'is-match' : ''}" onclick="cmpKindMenuPick('${e.id}')"><span class="material-symbols-outlined">${ic}</span><span class="cmp-kind-menu-item-name">${e.name}</span></button>`;
          }).join('')
        : '<div class="cmp-kind-menu-empty">No other ' + cmpKindLabel(kind) + ' is available to place here.</div>';
      cmpKindMenuEl.innerHTML =
        '<div class="cmp-kind-menu-hd">' + hd + '</div>' +
        tabs +
        '<div class="cmp-kind-menu-list">' + items + '</div>';
    }

    function cmpKindMenuSetKind(kind) {
      if (!cmpKindMenuState) return;
      cmpKindMenuState.kind = kind;
      cmpRenderKindMenu();
      cmpPositionKindMenu(cmpKindMenuState.anchor);
    }

    function cmpKindMenuPick(pickId) {
      const st = cmpKindMenuState;
      cmpCloseKindMenu();
      if (st) cmpConfirmSwapSlot(st.slotId, pickId, null);
    }
