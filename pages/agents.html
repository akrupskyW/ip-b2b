<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Agents</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Agents — account-level manager for agents, databases, rules and skills,
       rendered by js/agents-flow.js. All styling comes from the canonical
       `wmod-` module set in wise.css. */
    body[data-nav-id="agents"] #agent-main-header { display: none; }
    body[data-nav-id="agents"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="agents"] #modules-row { margin-top: 0; }
    body[data-nav-id="agents"] .wmod-wrap { max-width: 1080px; }

    /* Columns: type glyph · name (+desc) · kind pill · status/controls · toggle. */
    body[data-nav-id="agents"] .ag-table .wmod-thead,
    body[data-nav-id="agents"] .ag-table .wmod-trow {
      grid-template-columns: 40px minmax(0, 1.6fr) 104px minmax(180px, 1fr) 52px;
    }
    body[data-nav-id="agents"] .ag-row.is-off { opacity: 0.6; }
    body[data-nav-id="agents"] .ag-ctl { display: flex; align-items: center; justify-content: flex-end; }
    body[data-nav-id="agents"] .ag-status-meta { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-muted); }
    body[data-nav-id="agents"] .ag-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    body[data-nav-id="agents"] .ag-dot--on { background: var(--sec-green, #2e7d32); }
    body[data-nav-id="agents"] .ag-dot--off { background: var(--text-subtle); }

    @media (max-width: 860px) {
      body[data-nav-id="agents"] .wmod-wrap { padding: 20px 20px 48px; }
      body[data-nav-id="agents"] .ag-table .wmod-thead,
      body[data-nav-id="agents"] .ag-table .wmod-trow { grid-template-columns: 40px minmax(0, 1fr) 52px; }
      body[data-nav-id="agents"] .ag-col-kind, body[data-nav-id="agents"] .ag-col-ctl { display: none; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="agents" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
</body>
</html>
