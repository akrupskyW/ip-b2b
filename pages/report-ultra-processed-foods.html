  <script>
    /* Export menu — turns the header "Export" button into a fully working
       popover: Export to PDF (prints the exact on-screen visual via the print
       stylesheet above), Share (Web Share API with a copy-link fallback), Copy
       link (clipboard, with a legacy fallback), and Download data (a real CSV of
       the Performance Matrix). Closes on outside click or Esc; each non-print
       action confirms with a toast. */
    (function () {
      var wrap = document.getElementById('ah-export');
      var trigger = document.getElementById('ah-export-trigger');
      var menu = document.getElementById('ah-export-menu');
      if (!wrap || !trigger || !menu) return;

      /* ---- Transient feedback toast (one reused node) ---- */
      var toastEl = null, toastTimer = null;
      function toast(msg) {
        if (!toastEl) {
          toastEl = document.createElement('div');
          toastEl.className = 'ah-toast';
          toastEl.setAttribute('role', 'status');
          toastEl.setAttribute('aria-live', 'polite');
          document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        void toastEl.offsetWidth; /* restart the transition on repeat actions */
        toastEl.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('is-visible'); }, 2600);
      }

      function open() {
        menu.hidden = false;
        wrap.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onOutside, true);
        document.addEventListener('keydown', onKey);
      }
      function close() {
        menu.hidden = true;
        wrap.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', onOutside, true);
        document.removeEventListener('keydown', onKey);
      }
      function onOutside(e) { if (!wrap.contains(e.target)) close(); }
      function onKey(e) { if (e.key === 'Escape') { close(); trigger.focus(); } }

      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        if (menu.hidden) open(); else close();
      });

      /* Copy text to the clipboard, falling back to a hidden textarea + execCommand
         on browsers without (or without permission for) the async Clipboard API. */
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            ok ? resolve() : reject(new Error('copy failed'));
          } catch (err) { reject(err); }
        });
      }

      /* Build the Performance Matrix CSV (exposed by the matrix script) and
         trigger a download via a temporary object URL. */
      function downloadCSV() {
        var csv = (typeof window.attBuildCSV === 'function') ? window.attBuildCSV() : null;
        if (!csv) { toast('Report data isn\u2019t ready yet \u2014 try again in a moment.'); return; }
        var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'wise-portfolio-analytics.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        toast('CSV downloaded.');
      }

      /* The four export actions, factored out so the main-panel header's
         three-dot (⋯) menu can drive the exact same behaviour as this button. */
      function runExport(action) {
        if (action === 'pdf') {
          window.print();
        } else if (action === 'copy-link') {
          copyText(window.location.href)
            .then(function () { toast('Link copied to clipboard.'); })
            .catch(function () { toast('Couldn\u2019t copy the link.'); });
        } else if (action === 'share') {
          var shareData = {
            title: document.title,
            text: 'WISE Portfolio Analytics report',
            url: window.location.href,
          };
          if (navigator.share) {
            navigator.share(shareData).catch(function () { /* user dismissed */ });
          } else {
            copyText(window.location.href)
              .then(function () { toast('Sharing isn\u2019t supported here \u2014 link copied instead.'); })
              .catch(function () { toast('Couldn\u2019t share the report.'); });
          }
        } else if (action === 'csv') {
          downloadCSV();
        }
      }
      window.runReportExport = runExport;

      menu.addEventListener('click', function (e) {
        var item = e.target.closest('.ah-export-item');
        if (!item) return;
        close();
        runExport(item.dataset.action);
      });
    })();
  </script>

        { name: 'Cocoa Almond Date Bar',  upc: '8 10207 71213 8', cls: 'Non-UPF',       proc: 'Lightly Processed',    shield: 'Non-UPF Verified' },
        { name: 'Strawberry Oat Bar',     upc: '8 10207 71214 5', cls: 'Minimally UPF', proc: 'Moderately Processed', shield: 'Under Review' },
        { name: 'Matcha Cashew Crisp',    upc: '8 10207 71215 2', cls: 'Non-UPF',       proc: 'Lightly Processed',    shield: 'Pre-Qualified' },
        { name: 'Honey Sesame Bar',       upc: '8 10207 71216 9', cls: 'Non-UPF',       proc: 'Minimally Processed',  shield: 'Pre-Qualified' },
        { name: 'Blueberry Flax Bites',   upc: '8 10207 71217 6', cls: 'Non-UPF',       proc: 'Minimally Processed',  shield: 'Non-UPF Verified' },
        { name: 'Salted Caramel Date Bar', upc: '8 10207 71218 3', cls: 'Minimally UPF', proc: 'Moderately Processed', shield: 'Under Review' },
        { name: 'Orange Cranberry Crisp', upc: '8 10207 71219 0', cls: 'Non-UPF',       proc: 'Lightly Processed',    shield: 'Pre-Qualified' },
        { name: 'Vanilla Chai Bites',     upc: '8 10207 71220 6', cls: 'Non-UPF',       proc: 'Minimally Processed',  shield: 'Pre-Qualified' },
        { name: 'Chili Lime Cashew Bar',  upc: '8 10207 71221 3', cls: 'Non-UPF',       proc: 'Lightly Processed',    shield: 'Non-UPF Verified' },
      ];

      /* Columns, in render order. `map` columns are pill-rendered + rank-sorted. */
      const COLS = [
        { key: 'name',   label: 'Product',            type: 'text' },
        { key: 'upc',    label: 'UPC',                type: 'upc'  },
        { key: 'cls',    label: 'UPF Classification', type: 'rank', map: CLS_MAP },
        { key: 'proc',   label: 'Processing Level',   type: 'rank', map: PROC_MAP },
        { key: 'shield', label: 'Shield Status',      type: 'rank', map: SHIELD_MAP },
      ];

      const VIEW_KEY = 'upf-view-cards';
      const sort = { key: 'name', dir: 1 };          /* default: Product A–Z */
      /* Default to card view on narrow viewports; a stored toggle choice wins. */
      const NARROW_MQ = window.matchMedia('(max-width: 700px)');
      let userPref = null;
      try { const v = localStorage.getItem(VIEW_KEY); if (v === '0' || v === '1') userPref = v === '1'; } catch (_) {}
      let cardsView = userPref !== null ? userPref : NARROW_MQ.matches;

      const upcNum = (s) => Number(String(s).replace(/\D/g, '')) || 0;

      function compare(a, b) {
        const col = COLS.find((c) => c.key === sort.key) || COLS[0];
        let r;
        if (col.type === 'upc') r = upcNum(a.upc) - upcNum(b.upc);
        else if (col.type === 'rank') {
          const ra = (col.map[a[col.key]] || {}).rank ?? 99;
          const rb = (col.map[b[col.key]] || {}).rank ?? 99;
          r = ra - rb;
        } else r = String(a[col.key]).localeCompare(String(b[col.key]), undefined, { sensitivity: 'base' });
        if (r === 0 && col.key !== 'name') r = a.name.localeCompare(b.name);
        return r * sort.dir;
      }

      function pill(value, col) {
        const tone = (col.map[value] || {}).tone || 'good';
        return `<span class="upf-pill upf-pill--${tone}">${esc(value)}</span>`;

      const REPORT_BTN =

      /* Circular product thumbnail for the leading (titleless) column. Uses the
         row's `img` URL when supplied, otherwise a deterministic seeded
         placeholder photo (same product → same image across re-renders). Error
         fallback is wired in JS after render (see wireAvatars). */
      const PH_FALLBACK = '<span class="material-icons upf-avatar-ph">photo_camera</span>';
      function imgSrc(r) {
        return r.img || ('https://picsum.photos/seed/' + encodeURIComponent('upf-' + r.upc) + '/72/72');
      }
      function avatar(r) {
        return `<span class="upf-avatar"><img src="${escAttr(imgSrc(r))}" alt="${escAttr(r.name)} product image" loading="lazy" /></span>`;
      }
      function wireAvatars(card) {
        card.querySelectorAll('.upf-avatar img').forEach((img) => {
          img.addEventListener('error', () => {
            const holder = img.closest('.upf-avatar');
            if (holder) holder.innerHTML = PH_FALLBACK;
          }, { once: true });
        });
      }

      function arrowSvg() {
        return '<span class="upf-th-arrow"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 9.5V2.5M3 6.5L6 9.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
      }

      function buildCard() {

        card.id = 'upf-class-card';

        const headCells = '<th class="upf-th-avatar" aria-hidden="true"></th>' + COLS.map((c) =>

        ).join('') + '<th class="upf-th-action"><span class="upf-th-label">Report</span></th>';

        card.innerHTML = `

            <span class="att-title">Product-Level UPF Classification</span>

          <div class="upf-table-wrap" id="upf-table-wrap">

              <tbody id="upf-tbody"></tbody>
            </table>

          <div class="upf-cards" id="upf-cards" hidden></div>`;
        return card;
      }

      function rowCells(r) {
        return `
          <td class="upf-th-avatar">${avatar(r)}</td>
          <td><span class="upf-name">${esc(r.name)}</span></td>
          <td><span class="upf-upc">${esc(r.upc)}</span></td>

      function cardMarkup(r) {
        return `
          <div class="upf-card">
            <div class="upf-card-top">
              ${avatar(r)}
              <div class="upf-card-titles">
                <span class="upf-card-name">${esc(r.name)}</span>
                <span class="upf-card-upc">${esc(r.upc)}</span>
              </div>
            </div>
            <div class="upf-card-fields">
              <div class="upf-field">${pill(r.cls, COLS[2])}</div>
              <div class="upf-field">${pill(r.proc, COLS[3])}</div>
              <div class="upf-field">${pill(r.shield, COLS[4])}</div>
            </div>
            ${REPORT_BTN}
          </div>`;
      }

      function render(card) {
        const data = ROWS.slice().sort(compare);
        card.querySelector('#upf-tbody').innerHTML = data.map((r) => `<tr>${rowCells(r)}</tr>`).join('');
        card.querySelector('#upf-cards').innerHTML = data.map(cardMarkup).join('');
        wireAvatars(card);

        /* Header arrow state. */
        card.querySelectorAll('.upf-th-btn').forEach((btn) => {
          if (btn.dataset.key === sort.key) btn.setAttribute('data-sort', sort.dir === 1 ? 'asc' : 'desc');
          else btn.removeAttribute('data-sort');
        });

        card.querySelector('#upf-table-wrap').hidden = cardsView;
        card.querySelector('#upf-cards').hidden = !cardsView;
      }

      function wire(card) {
        card.querySelectorAll('.upf-th-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const key = btn.dataset.key;
            if (sort.key === key) sort.dir *= -1;
            else { sort.key = key; sort.dir = 1; }
            render(card);
          });
        });

        /* Follow the viewport when the user hasn't explicitly chosen a view. */
        NARROW_MQ.addEventListener('change', (e) => {
          if (userPref !== null) return;
          cardsView = e.matches;
          render(card);
        });
      }

      function mount() {
        const scroll = document.getElementById('agent-main-scroll');
        const dash = scroll && scroll.querySelector('.dash');
        if (!dash || document.getElementById('upf-class-card')) return false;
        const card = buildCard();
        dash.appendChild(card);
        render(card);
        wire(card);
        return true;
      }

      function init() {
        if (mount()) return;
        const obs = new MutationObserver(() => { if (mount()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>



  <script>
    /* =====================================================================
       Portfolio Overview stats (analytics-types.html only).
       Adds a second 3-column stats row directly below the dashboard's claim
       row (the first set of 3 columns: Products Discovered / Claimed /
       Qualify), reusing that row's exact styling (.dash-claim / .dash-bignum)
       but with portfolio-level overview counts. Injected client-side so the
       shared dashboard module stays untouched.
    ===================================================================== */
    (function () {
      const STATS = [
        { num: '24',  label: 'Foods in Portfolio',     icon: 'nutrition' },
        { num: '8.4', label: 'Avg Ingredients / Food', icon: 'blender' },
        { num: '61',  label: 'Unique Ingredients',     icon: 'science' },
      ];

      function buildRow() {
        const section = document.createElement('section');
        section.className = 'dash-claim att-overview-claim';
        section.innerHTML = STATS
          .map((s) => `
            <div class="dash-claim-col">
              <div class="dash-bignum-row">
                <span class="dash-bignum">${s.num}</span>
                <span class="dash-bignum-cap"><strong>${s.label}</strong></span>
                <span class="dash-stamp-icon" aria-hidden="true"><span class="material-symbols-outlined">${s.icon}</span></span>
              </div>
            </div>`)
          .join('<div class="dash-claim-divider"></div>');
        return section;
      }

      /* Mount as the 2nd row: right after the claim row, still a direct child
         of .dash so it inherits the same side padding + inter-row gap. */
      function mount() {
        const dash = document.querySelector('#agent-main-scroll .dash') || document.querySelector('.dash');
        if (!dash) return false;
        const claim = dash.querySelector(':scope > .dash-claim');
        if (!claim) return false;
        if (dash.querySelector('.att-overview-claim')) return true;
        claim.insertAdjacentElement('afterend', buildRow());
        return true;
      }

      function init() {
        if (mount()) return;
        const obs = new MutationObserver(() => { if (mount()) obs.disconnect(); });
        obs.observe(document.getElementById('agent-main-scroll') || document.body, { childList: true, subtree: true });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>


  <script>
    /* =====================================================================
       Thin-style WISEscore health bars (this report only). Flips every chunky
       .dash-ws-health-bar to a slim track and relocates the score baked into
       the coloured fill up into the row's head (via the .az-skinny-bars body
       class + the CSS above). The dashboard body is injected asynchronously by
       agent-overview.js, so we re-run on DOM changes until the bars settle.
    ===================================================================== */
    (function () {
      const scroller = () => document.getElementById('agent-main-scroll');

      function readScore(num) {
        const to = num.getAttribute('data-count-to') || (num.textContent || '').trim();
        let suffix = num.getAttribute('data-count-suffix') || '';
        if (!suffix && num.closest('.dash-pct-wrap')) suffix = '%';
        return to + suffix;
      }

      function enhanceBars() {
        const sc = scroller();
        const root = (sc && sc.querySelector('.dash')) || document.body;
        root.querySelectorAll('.dash-ws-health-bar').forEach((bar) => {
          if (bar.dataset.azScore) return;
          const num = bar.querySelector('.dash-ws-health-num');
          if (!num) return;
          bar.dataset.azScore = '1';
          const chip = document.createElement('span');
          chip.className = 'az-score-chip';
          chip.textContent = readScore(num);
          const fill = bar.querySelector('.dash-ws-health-fill');
          if (fill && fill.style.background) chip.style.color = fill.style.background;
          const head = bar.previousElementSibling;
          if (head && head.nodeType === 1 && /-bar-head\b/.test(head.className || '')) {
            head.appendChild(chip);
          } else {
            chip.classList.add('az-score-chip--overlay');
            bar.appendChild(chip);
          }
        });
      }

      /* Thin style is the fixed default for this report — always on. */
      function apply() {
        document.body.classList.add('az-skinny-bars');
        enhanceBars();
      }

      function init() {
        apply();
        const host = document.getElementById('agent-main-scroll') || document.body;
        const obs = new MutationObserver(() => apply());
        obs.observe(host, { childList: true, subtree: true });
        setTimeout(() => obs.disconnect(), 12000);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>

  <script>
    /* =====================================================================
       Main-panel header three-dot (⋯) menu → mirror the top "Export" button.
       The ⋯ cluster is injected into #agent-main-header by agent-overview.js
       after load. We swap its menu for the same four export actions and run
       them through window.runReportExport (defined by the header Export button
       above) so both entry points behave identically.
    ===================================================================== */
    (function () {
      const MENU =
        '<button type="button" class="topbar-menu-item" data-xport="pdf">' +
          '<span class="material-icons topbar-menu-icon">download</span><span>Export to PDF</span></button>' +
        '<button type="button" class="topbar-menu-item" data-xport="share">' +
          '<span class="material-icons topbar-menu-icon">share</span><span>Share</span></button>' +
        '<button type="button" class="topbar-menu-item" data-xport="copy-link">' +
          '<span class="material-icons topbar-menu-icon">link</span><span>Copy link</span></button>' +
        '<button type="button" class="topbar-menu-item" data-xport="csv">' +
          '<span class="material-icons topbar-menu-icon">table_view</span><span>Download data</span></button>';

      function rewire(pop) {
        if (pop.dataset.xportWired) return;
        pop.dataset.xportWired = '1';
        pop.innerHTML = MENU;
        pop.addEventListener('click', (e) => {
          const item = e.target.closest('[data-xport]');
          if (!item) return;
          /* Close the popover (mirrors agent-overview.js's own closePop). */
          pop.classList.add('hidden');
          const btn = document.getElementById('agent-main-more-btn');
          if (btn) { btn.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false'); }
          if (typeof window.runReportExport === 'function') window.runReportExport(item.dataset.xport);
        });
      }

      function tryWire() {
        const pop = document.getElementById('agent-main-more-pop');
        if (pop) { rewire(pop); return true; }
        return false;
      }

      function init() {
        if (tryWire()) return;
        const obs = new MutationObserver(() => { if (tryWire()) obs.disconnect(); });
        obs.observe(document.body, { childList: true, subtree: true });
        setTimeout(() => obs.disconnect(), 12000);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
