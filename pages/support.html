<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Help</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Help center — rendered by js/help-flow.js. Built on the canonical `wmod-`
       module (search + scorecards + list). Only the FAQ accordion and support
       rows are page-specific below. NO icon-on-rounded-square backdrops.

       The shared #agent-main-header collapses to zero height but stays rendered
       so its ⋯ + width control cluster floats pinned to the module's top-right
       (see the shared rule in wise.css). The module supplies its own .wmod-
       masthead below. `display: none` on the header would hide those controls. */
    body[data-nav-id="help"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="help"] #modules-row { margin-top: 0; }
    body[data-nav-id="help"] .wmod-wrap { max-width: 960px; }
    /* Keep the serif masthead clear of the pinned ⋯ / width cluster. */
    body[data-nav-id="help"] .wmod-masthead { padding-right: calc(var(--module-head-ctrl-inset, 12px) + 60px); }

    /* FAQ accordion — a list inside the standard table card. */
    .hc-faq { border-top: 1px solid var(--border); }
    .hc-faq:first-child { border-top: 0; }
    .hc-faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; padding: 16px 18px; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.92rem; font-weight: 600; color: var(--text); }
    .hc-faq-q:hover { background: var(--surface-2); }
    html.dark .hc-faq-q:hover { background: rgba(255,255,255,0.04); }
    .hc-faq-chev { color: var(--text-subtle); transition: transform 0.2s ease; flex-shrink: 0; }
    .hc-faq.is-open .hc-faq-chev { transform: rotate(180deg); }
    .hc-faq-a { max-height: 0; overflow: hidden; padding: 0 18px; font-size: 0.86rem; line-height: 1.55; color: var(--text-muted); transition: max-height 0.25s ease, padding 0.25s ease; }
    .hc-faq.is-open .hc-faq-a { max-height: 360px; padding: 0 18px 18px; }
    .hc-hl { background: color-mix(in srgb, var(--ter-amber, #e0a800) 40%, transparent); border-radius: 3px; padding: 0 2px; color: inherit; }

    /* Section title — same serif headline as Help center, not the eyebrow group label. */
    body[data-nav-id="help"] .hc-support-head {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-size: var(--module-title-size, 1.35rem);
      font-weight: var(--module-title-weight, 800);
      letter-spacing: -0.01em;
      line-height: 1.15;
      text-transform: none;
      color: var(--text);
      gap: 0;
    }

    /* Support rows — a bare leading icon (no boxed backdrop), label, arrow. */
    .hc-support-row { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 20px; border: 0; border-top: 1px solid var(--border); background: transparent; cursor: pointer; font-family: inherit; }
    .hc-support-row:first-child { border-top: 0; }
    .hc-support-row:hover { background: var(--surface-2); }
    html.dark .hc-support-row:hover { background: rgba(255,255,255,0.04); }
    .hc-support-ic { display: inline-flex; align-items: center; justify-content: center; color: var(--primary-ink, var(--primary)); flex-shrink: 0; }
    .hc-support-ic .material-symbols-outlined { font-size: 24px; }
        .hc-support-body { flex: 1; min-width: 0; }
        .hc-support-title { display: block; font-size: 0.9rem; font-weight: 700; color: var(--text); }
        .hc-support-desc { display: block; font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .hc-support-arrow { color: var(--text-subtle); font-size: 20px; }
    .hc-support-row.is-locked,
    .hc-support-row:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .hc-support-row.is-locked:hover,
    .hc-support-row:disabled:hover {
      background: transparent;
    }
    html.dark .hc-support-row.is-locked:hover,
    html.dark .hc-support-row:disabled:hover { background: transparent; }

    /* Point-at glow for Chat composer + the Write (email) sticky module.
       Inset ring stays visible even when a parent card clips overflow. */
    @keyframes hc-spot-fade {
      0%, 45% {
        box-shadow: inset 0 0 0 3px var(--primary),
                    0 0 0 4px color-mix(in srgb, var(--primary) 55%, transparent),
                    0 0 28px 8px color-mix(in srgb, var(--primary) 38%, transparent);
        border-color: var(--primary);
      }
      100% {
        box-shadow: none;
        border-color: var(--border);
      }
    }
    @keyframes hc-spot-fade-dark {
      0%, 45% {
        box-shadow: inset 0 0 0 3px var(--primary-bright, #8B9FAF),
                    0 0 0 4px color-mix(in srgb, var(--primary-bright, #8B9FAF) 55%, transparent),
                    0 0 32px 10px color-mix(in srgb, var(--primary-bright, #8B9FAF) 40%, transparent);
        border-color: var(--primary-bright, #8B9FAF);
      }
      100% {
        box-shadow: none;
        border-color: var(--border);
      }
    }
    .hc-spot {
      border-color: var(--primary) !important;
      box-shadow: inset 0 0 0 3px var(--primary),
                  0 0 0 4px color-mix(in srgb, var(--primary) 55%, transparent),
                  0 0 28px 8px color-mix(in srgb, var(--primary) 38%, transparent) !important;
      animation: hc-spot-fade 3.2s ease-out forwards;
      position: relative;
      z-index: 5;
    }
    html.dark .hc-spot {
      border-color: var(--primary-bright, #8B9FAF) !important;
      box-shadow: inset 0 0 0 3px var(--primary-bright, #8B9FAF),
                  0 0 0 4px color-mix(in srgb, var(--primary-bright, #8B9FAF) 55%, transparent),
                  0 0 32px 10px color-mix(in srgb, var(--primary-bright, #8B9FAF) 40%, transparent) !important;
      animation-name: hc-spot-fade-dark;
    }
    .hc-spot-host { overflow: visible !important; }
    /* Contact is a tucked drawer: overflow must stay hidden so the square
       head/body/foot clip to the card radius. Sticky also forces
       box-shadow: none, so paint the ring on a matching-radius overlay. */
    #help-contact.hc-spot {
      position: relative;
      overflow: hidden !important;
      box-shadow: none !important;
    }
    #help-contact.hc-spot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 30;
      box-shadow: inset 0 0 0 3px var(--primary);
      animation: hc-spot-ring-fade 3.2s ease-out forwards;
    }
    html.dark #help-contact.hc-spot::after {
      box-shadow: inset 0 0 0 3px var(--primary-bright, #8B9FAF);
    }
    @keyframes hc-spot-ring-fade {
      0%, 45% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hc-spot, html.dark .hc-spot,
      #help-contact.hc-spot::after { animation: none; }
    }

    /* Contact support — a next-level sticky drawer off Help (the aside IS the
       card, so generic `.sticky-mod.is-sticky` tucks it under Help). Form
       language matches Share. Do not wrap an inner card — that sits flush
       beside Help and reads as a third module. */
    #help-contact {
      flex: 0 0 372px;
      width: 372px;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      font-size: var(--fs-ui);
    }
    html.dark #help-contact {
      background: linear-gradient(155deg, #1A2339 0%, #1A2339 60%, #1A2339 100%);
      border-color: rgba(37, 80, 124, 0.18);
    }
    #help-contact.panel-wide { flex-basis: 520px; width: 520px; }
    #help-contact.panel-wide.panel-triple { flex-basis: 680px; width: 680px; }
    #help-contact .wch-head {
      align-items: flex-start;
      padding: var(--module-head-pad-t) var(--module-head-ctrl-inset) var(--module-head-pad-b) var(--module-head-pad-l);
    }
    #help-contact .wch-head-title {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-weight: var(--module-title-weight, 800); font-size: var(--module-title-size, 1.2rem);
      letter-spacing: -0.01em; line-height: var(--module-title-lh, 1.16);
      color: var(--text);
    }
    .hc-mail-head-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0; }
    .hc-mail-sub {
      margin: var(--module-sub-gap, 3px) 0 0; font-size: var(--module-sub-size, 0.78125rem);
      line-height: var(--module-sub-lh, 1.35); color: var(--text-subtle);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #help-contact .wch-head .panel-controls,
    #help-contact .wch-controls { margin-left: auto; display: inline-flex; align-items: center; gap: var(--module-head-ctrl-gap, 2px); flex-shrink: 0; }
    .hc-mail-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 16px; }
    .hc-mail-form { display: flex; flex-direction: column; gap: 16px; }
    .hc-mail .adm-input { width: 100%; }
    .hc-mail-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .hc-mail-chips .chip { height: auto; min-height: 28px; white-space: normal; text-align: left; }
    .hc-mail-chips .chip.is-on {
      background: color-mix(in srgb, var(--primary) 16%, var(--surface));
      border-color: var(--primary);
      color: var(--text);
      font-weight: 600;
    }
    html.dark .hc-mail-chips .chip.is-on {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 22%, transparent);
      border-color: var(--primary-bright, #8B9FAF);
    }
    .hc-mail-textarea {
      width: 100%; box-sizing: border-box; min-height: 92px; padding: 10px 14px;
      font-family: inherit; font-size: 0.8125rem; line-height: 1.45; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: 10px; outline: none; resize: vertical;
    }
    html.dark .hc-mail-textarea { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .hc-mail-textarea:focus {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .hc-mail-textarea::placeholder { color: var(--text-subtle); opacity: 0.85; }
    .hc-mail-textarea.is-invalid,
    .hc-mail .adm-input.is-invalid { border-color: var(--sec-red); }
    .hc-mail-who { display: flex; flex-direction: column; gap: 8px; }
    .hc-mail-opt { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text-subtle); }
    .hc-mail-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .hc-mail-drop {
      width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; text-align: left; font-family: inherit; cursor: pointer;
      background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 10px;
      color: var(--text);
    }
    html.dark .hc-mail-drop { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .hc-mail-drop:hover, .hc-mail-drop.is-over {
      border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .hc-mail-drop.is-invalid { border-color: var(--sec-red); }
    .hc-mail-drop > .material-symbols-outlined { font-size: 22px; color: var(--ter-amber, #E3C878); flex-shrink: 0; }
    .hc-mail-drop-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .hc-mail-drop-name { font-size: 0.82rem; font-weight: 600; }
    .hc-mail-drop-sub { font-size: 0.7rem; color: var(--text-subtle); }
    .hc-mail [data-mail-attach-list] { margin-top: 8px; }
    .hc-mail-foot {
      flex-shrink: 0; display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 16px 14px; border-top: 1px solid var(--border);
    }
    .hc-mail-foot[hidden] { display: none; }
    html.dark .hc-mail-foot { border-top-color: rgba(255,255,255,0.08); }
    .hc-mail-done { display: flex; flex-direction: column; gap: 16px; }
    .hc-mail-created {
      display: flex; flex-direction: column; gap: 12px; padding: 16px 4px 4px;
    }
    .hc-mail-created-title {
      font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif);
      font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.16;
      color: var(--text);
    }
    .hc-mail-created-sub { margin: 0; font-size: 0.86rem; line-height: 1.45; color: var(--text-muted); }
    .hc-mail-receipt { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
    .hc-mail-receipt-row { display: flex; flex-direction: column; gap: 3px; }
    .hc-mail-receipt-k {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-subtle);
    }
    .hc-mail-receipt-v { font-size: 0.88rem; line-height: 1.45; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }

    @media (max-width: 760px) {
      body[data-nav-id="help"] .wmod-wrap { padding: 20px 20px 48px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="help" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
