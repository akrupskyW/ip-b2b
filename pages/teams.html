<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Team</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- SVG icon shim: swaps every Material Symbols glyph for an inline SVG from
       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Team — same chrome as Invoices: the board fills the pane, Invite sits
       next to the serif title, and the shared ⋯ + width cluster floats in
       #agent-main-header with the brand chip to its left. */
    body[data-nav-id="team"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="team"] #modules-row { margin-top: 0; }
    body[data-nav-id="team"] .sc-welcome,
    body[data-nav-id="team"] .sc-welcome--cards { justify-content: safe flex-end; }

    body[data-nav-id="team"] .adm-wrap,
    body[data-nav-id="team"] .adm-wrap--wide {
      max-width: none;
      padding: 26px 40px 56px;
    }

    body[data-nav-id="team"] .adm-head { padding: 2px 2px 0; margin-bottom: 16px; }
    body[data-nav-id="team"] .adm-head-row {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 10px; flex-wrap: wrap;
    }
    body[data-nav-id="team"] .adm-title {
      font-size: var(--module-title-size, 1.2rem);
      line-height: 1.15;
    }
    body[data-nav-id="team"] .adm-head .adm-btn { height: 34px; padding: 0 14px; font-size: 12px; }
    body[data-nav-id="team"] .adm-head .adm-btn .material-symbols-outlined {
      font-size: 16px;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body[data-nav-id="team"] .panel-controls .tm-brand-trail {
      display: inline-flex; align-items: center; gap: 6px;
      flex-shrink: 0; margin-right: 4px;
    }
    body[data-nav-id="team"] .panel-controls .pf-brand-chip {
      height: 28px; padding: 2px 8px 2px 3px; gap: 6px;
    }
    body[data-nav-id="team"] .panel-controls .pf-brand-avatar {
      width: 20px; height: 20px; font-size: 10px;
    }
    body[data-nav-id="team"] .panel-controls .pf-brand-name {
      font-size: 11px; max-width: 120px;
    }
    body[data-nav-id="team"] .panel-controls .pf-brand-caret {
      font-size: 15px !important;
    }

    @media (max-width: 640px) {
      body[data-nav-id="team"] .adm-wrap,
      body[data-nav-id="team"] .adm-wrap--wide { padding: 20px 20px 48px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="team" data-adm-page data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js?v=teams2"></script>
  <script type="module">
    /* If a cached agent-overview.js predates the Team flow, the shell paints
       the "content coming soon" placeholder. Replace that with the board. */
    import { renderTeam } from '../js/teams-flow.js';
    function paintIfEmpty() {
      const main = document.getElementById('agent-main-scroll');
      if (!main || main.querySelector('[data-tm-board]')) return;
      if (main.querySelector('[data-module-placeholder]') || !main.innerHTML.trim()) {
        renderTeam(main);
      }
    }
    window.addEventListener('load', () => {
      paintIfEmpty();
      setTimeout(paintIfEmpty, 400);
    });
  </script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
