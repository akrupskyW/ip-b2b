<!DOCTYPE html>
<html lang="en">
<head>

<body class="auth-chat-page">

    <div class="ac-main"><div id="ac-chat"></div></div>
    <aside id="ac-setup" class="setup-pane" hidden></aside>

    import { initAuthChat } from '../js/auth-chat.js';
    initAuthChat({ mode: 'forgot' });
