<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — WISEcode Intelligence</title>
  <script>
    try { if (localStorage.getItem('wise-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <script src="../js/auth.js"></script>
</head>
<body class="auth-page">
  <aside id="auth-nav" class="auth-nav" aria-label="Primary"></aside>
  <main class="auth-main">
    <div class="auth-wrap">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title" class="auth-title">Reset your password</h1>
      <p class="auth-sub">Enter the email on your account and we'll send reset instructions.</p>

      <div class="auth-banner auth-banner--success" id="forgot-success" hidden>
        <span class="material-symbols-outlined">mark_email_read</span>
        <span class="auth-banner-text"></span>
      </div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email">Email address <span class="req">*</span></label>
          <input type="email" id="email" name="email" class="auth-input" autocomplete="email" placeholder="you@company.com" required />
        </div>
        <p class="auth-banner auth-banner--error" id="forgot-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="forgot-submit"><span class="material-symbols-outlined">send</span>Send reset link</button>
      </form>

      <p class="auth-foot"><a class="auth-link" href="login.html">&larr; Back to sign in</a></p>
    </section>
    </div>
  </main>

  <script src="../js/auth-forms.js"></script>
  <script>WiseAuthForms.initForgot();</script>
</body>
</html>
