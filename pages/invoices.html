<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Invoices &amp; Downloads</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Invoices & Downloads — billing surface rendered by js/invoices-flow.js. */
    body[data-nav-id="invoices"] #agent-main-header { display: none; }
    body[data-nav-id="invoices"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="invoices"] #modules-row { margin-top: 0; padding-bottom: 0; }

    .inv-wrap { padding: 26px 40px 56px; max-width: 1100px; }

    /* Header */
    .inv-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .inv-title { font-family: 'Noto Serif', Georgia, serif; font-size: 1.9rem; font-weight: 800; color: var(--text); margin: 0; letter-spacing: -0.01em; }
    .inv-lede { font-size: 0.9rem; color: var(--text-muted); margin: 8px 0 0; max-width: 60ch; }

    /* Toolbar / search */
    .inv-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .inv-search-inline { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; max-width: 420px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; padding: 0 14px; height: 40px; }
    .inv-search-inline .material-icons { font-size: 18px; color: var(--text-subtle); }
    .inv-search { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 0.85rem; color: var(--text); }
    .inv-search::placeholder { color: var(--text-subtle); }

    /* Board card */
    .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 14px); box-shadow: var(--shadow-1); overflow: hidden; }
    .inv-stats-bar { padding: 16px 18px 0; }
    .inv-stats-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-subtle); }

    /* At-a-glance filter cards */
    .inv-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 12px 18px 18px; }
    .inv-stat { text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px; cursor: pointer; font-family: inherit; transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; }
    .inv-stat:hover { border-color: var(--border-strong); }
    .inv-stat.is-active { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }
    html.dark .inv-stat { background: rgba(255,255,255,0.03); }
    .inv-stat-num { display: block; font-family: 'Noto Serif', Georgia, serif; font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1; }
    .inv-stat-label { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 600; color: var(--text-muted); margin-top: 8px; }
    .inv-stat-label .material-icons { font-size: 14px; }
    .inv-stat--sent .inv-stat-num { color: var(--primary); }
    html.dark .inv-stat--sent .inv-stat-num { color: #93C5FD; }
    .inv-stat--paid .inv-stat-num { color: var(--sec-green); }
    .inv-stat--failed .inv-stat-num { color: var(--sec-red); }
    .inv-stat--cancelled .inv-stat-num { color: var(--text-muted); }

    .inv-board-divider { height: 1px; background: var(--border); }

    /* Table (CSS grid so rows align without a real table) */
    .inv-table-card { padding: 6px 6px 10px; }
    .inv-thead, .inv-trow { display: grid; grid-template-columns: 120px 1.4fr 110px 150px 170px 1.6fr; align-items: center; gap: 12px; padding: 12px 14px; }
    .inv-thead { border-bottom: 1px solid var(--border); }
    .inv-th { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-subtle); }
    .inv-trow { border-bottom: 1px solid var(--border); }
    .inv-trow:last-child { border-bottom: 0; }
    .inv-trow:hover { background: var(--surface-2); }
    html.dark .inv-trow:hover { background: rgba(255,255,255,0.03); }
    .inv-trow.inv-row-hidden { display: none; }
    .inv-td { min-width: 0; font-size: 0.85rem; color: var(--text); }
    .inv-date { color: var(--text-muted); font-size: 0.82rem; }
    .inv-desc { display: flex; flex-direction: column; gap: 2px; }
    .inv-desc-name { font-weight: 600; color: var(--text); }
    .inv-desc-sub { font-size: 0.74rem; color: var(--text-subtle); }
    .inv-amount { font-weight: 700; color: var(--text); }
    .inv-num { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 0.78rem; color: var(--text-muted); }
    .inv-table-foot { padding: 12px 14px 4px; font-size: 0.76rem; color: var(--text-subtle); }

    /* Status chips */
    .inv-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .inv-chip .material-icons { font-size: 14px; }
    .inv-chip--sent { background: rgba(37,80,124,0.10); color: var(--primary); }
    html.dark .inv-chip--sent { background: rgba(96,165,250,0.16); color: #93C5FD; }
    .inv-chip--paid { background: var(--sec-green-10); color: var(--sec-green); }
    html.dark .inv-chip--paid { color: #6FE0A0; }
    .inv-chip--failed { background: var(--sec-red-10); color: var(--sec-red); }
    html.dark .inv-chip--failed { color: #FF9E96; }
    .inv-chip--cancelled { background: var(--surface-3, var(--surface-2)); color: var(--text-muted); }
    html.dark .inv-chip--cancelled { background: rgba(255,255,255,0.08); }

    /* Row + header action buttons */
    .inv-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .inv-btn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 7px 12px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-family: inherit; font-size: 0.72rem; font-weight: 700; line-height: 1; transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease; }
    .inv-btn .material-icons { font-size: 14px; }
    .inv-btn--primary { background: var(--primary); color: #fff; }
    .inv-btn--primary:hover { filter: brightness(1.08); }
    .inv-btn--danger { background: transparent; color: var(--sec-red); border-color: var(--sec-red-10); }
    .inv-btn--danger:hover { background: var(--sec-red-10); }
    html.dark .inv-btn--danger { color: #FF9E96; }
    .inv-btn--good { background: transparent; color: var(--sec-green); border-color: var(--sec-green-10); }
    .inv-btn--good:hover { background: var(--sec-green-10); }
    html.dark .inv-btn--good { color: #6FE0A0; }
    .inv-btn--ghost { background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
    .inv-btn--ghost:hover { color: var(--text); background: var(--surface-2); }
    html.dark .inv-btn--ghost:hover { background: rgba(255,255,255,0.06); }

    /* Toast */
    #inv-toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .inv-toast { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-3); opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .inv-toast.is-in { opacity: 1; transform: none; }
    .inv-toast .material-icons { font-size: 17px; }

    @media (max-width: 1000px) {
      .inv-wrap { padding: 20px 20px 48px; }
      .inv-stats { grid-template-columns: repeat(2, 1fr); }
      .inv-thead { display: none; }
      .inv-trow { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body data-nav-id="invoices" data-default-dock="left" data-default-nav-collapsed="1">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
