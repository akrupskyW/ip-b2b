<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Invoices &amp; Downloads</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Invoices & Downloads — billing surface rendered by js/invoices-flow.js. */
    body[data-nav-id="invoices"] #agent-main-header { display: none; }
    body[data-nav-id="invoices"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="invoices"] #modules-row { margin-top: 0; padding-bottom: var(--modules-bottom-pad); margin-bottom: calc(-1 * var(--modules-bottom-pad)); }

    /* WISEai chat on this surface reads bottom-up: the welcome anchors to the
       bottom of the pane (just above the input) and grows upward, so there's no
       dead gap between the last chip and the composer. `safe` keeps the top
       reachable when the content is taller than the pane. */
    body[data-nav-id="invoices"] .sc-welcome,
    body[data-nav-id="invoices"] .sc-welcome--cards { justify-content: safe flex-end; }

    /* A size container so the board responds to its OWN width — this surface
       often sits in a narrow column beside the chat dock, where viewport media
       queries don't reflect how little room the table actually has. Fills the
       full width of its area (no capped column) so the table spans the pane. */
    .inv-wrap { padding: 26px 40px 56px; max-width: none; container-type: inline-size; container-name: inv; }

    /* Header — serif title + a line of details, mirroring the Product
       Portfolio module's .pf-head / .pf-head-title / .pf-head-meta. */
    .inv-head { padding: 2px 2px 0; margin-bottom: 16px; }
    .inv-title { font-family: var(--module-title-family, 'Noto Serif', Georgia, serif); font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
    .inv-lede { font-size: 0.9rem; color: var(--text-muted); margin: 6px 0 0; max-width: 60ch; }

    /* Toolbar / search — the search fills the row and the primary action sits
       to its right, mirroring the Portfolio module's .pf-toolbar (search +
       Add Product). */
    .inv-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
    .inv-search-inline { position: relative; display: inline-flex; align-items: center; flex: 1 1 auto; min-width: 220px; }
    .inv-search-inline .material-symbols-outlined { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-subtle); pointer-events: none; }
    .inv-search { width: 100%; height: 40px; box-sizing: border-box; padding: 0 16px 0 42px; font-family: inherit; font-size: 0.8125rem; font-weight: 400; color: var(--text); background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius-pill, 999px); outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease; }
    html.dark .inv-search { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .inv-search::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .inv-search:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }

    /* Board card — same elevation / radius / surface as the Portfolio module's
       .pf-card. */
    /* overflow visible so a row's actions popover isn't clipped by the card. */
    .inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-1); overflow: visible; padding: 14px; }
    .inv-stats-bar { padding: 0 2px 10px; }
    .inv-stats-label { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-subtle); }

    /* At-a-glance filter cards — centered, rectangular tiles (serif number on
       top, label below), matching the Portfolio module's .pf-stat. */
    .inv-stats { display: flex; flex-wrap: wrap; gap: 10px; }
    .inv-stat { flex: 1 1 120px; min-width: 108px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-1); font-family: inherit; text-align: center; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
    html.dark .inv-stat { background: rgba(255,255,255,0.04); }
    .inv-stat:hover { transform: translateY(-1px); box-shadow: var(--shadow-card, var(--shadow-1)); border-color: var(--border-strong); }
    .inv-stat:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .inv-stat.is-active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface-2)); box-shadow: inset 0 0 0 1px var(--primary), var(--shadow-1); }
    html.dark .inv-stat.is-active { background: color-mix(in srgb, var(--primary) 26%, transparent); }
    .inv-stat-num { font-family: 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); }
    .inv-stat-label { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .inv-stat-label .material-symbols-outlined { font-size: 13px !important; line-height: 1; width: 14px; height: 14px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .inv-stat--sent .inv-stat-num { color: var(--primary); }
    html.dark .inv-stat--sent .inv-stat-num { color: #93C5FD; }
    .inv-stat--paid .inv-stat-num { color: var(--sec-green); }
    .inv-stat--failed .inv-stat-num { color: var(--sec-red); }
    .inv-stat--cancelled .inv-stat-num { color: var(--text-muted); }

    .inv-board-divider { height: 1px; background: var(--border); margin: 14px 0 6px; }

    /* Table (CSS grid so rows align without a real table). Columns:
       Date · Amount/Description · Status/Invoice · Actions. */
    .inv-table-card { padding: 6px 4px; }
    .inv-thead, .inv-trow { display: grid; grid-template-columns: minmax(150px, 0.9fr) minmax(0, 1.1fr) minmax(0, 2fr); align-items: center; gap: 12px; padding: 12px 12px; }
    .inv-thead { border-bottom: 1px solid var(--border); }
    .inv-th { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
    .inv-trow { border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
    .inv-trow:last-child { border-bottom: 0; }
    .inv-trow:hover { background: var(--surface-2); }
    html.dark .inv-trow:hover { background: rgba(255,255,255,0.04); }
    .inv-trow.inv-row-hidden { display: none; }
    .inv-td { min-width: 0; font-size: 0.85rem; color: var(--text); }
    /* Date / Invoice / Status — date on top, then the invoice number, then the
       invoice state as plain coloured text (no chip). */
    .inv-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
    .inv-date { color: var(--text); font-size: 0.85rem; font-weight: 600; }
    .inv-num { font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 0.74rem; color: var(--text-muted); }
    .inv-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 700; }
    .inv-state .material-symbols-outlined { font-size: 14px; }
    .inv-state--sent { color: var(--primary); }
    html.dark .inv-state--sent { color: #93C5FD; }
    .inv-state--paid { color: var(--sec-green); }
    html.dark .inv-state--paid { color: #6FE0A0; }
    .inv-state--failed { color: var(--sec-red); }
    html.dark .inv-state--failed { color: #FF9E96; }
    .inv-state--cancelled { color: var(--text-muted); }
    /* Amount / Description — amount stacked above the description. */
    .inv-desc { display: flex; flex-direction: column; gap: 2px; }
    .inv-amount { font-weight: 700; color: var(--text); font-size: 0.9rem; }
    .inv-desc-name { font-weight: 600; color: var(--text); font-size: 0.82rem; }
    .inv-desc-sub { font-size: 0.74rem; color: var(--text-subtle); }
    .inv-table-foot { padding: 12px 12px 4px; font-size: 0.76rem; color: var(--text-subtle); }

    /* Click-to-sort headers — a faint chevron that turns primary-coloured and
       flips for asc/desc, matching the app-wide sortable tables. */
    .inv-th--sortable { cursor: pointer; user-select: none; -webkit-user-select: none; white-space: nowrap; }
    .inv-sort-arrow { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; margin-left: 5px; flex: none; opacity: 0.28; transition: opacity 0.12s ease, transform 0.12s ease; }
    .inv-sort-arrow svg { width: 12px; height: 12px; display: block; }
    .inv-th--sortable:hover .inv-sort-arrow { opacity: 0.6; }
    .inv-th--sortable[data-inv-dir="asc"] .inv-sort-arrow { opacity: 1; color: var(--primary); transform: rotate(180deg); }
    .inv-th--sortable[data-inv-dir="desc"] .inv-sort-arrow { opacity: 1; color: var(--primary); }
    html.dark .inv-th--sortable[data-inv-dir] .inv-sort-arrow { color: var(--primary-bright, var(--primary)); }
    @media (prefers-reduced-motion: reduce) { .inv-sort-arrow { transition: none; } }

    /* Status chips */
    .inv-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .inv-chip .material-symbols-outlined { font-size: 14px; }
    .inv-chip--sent { background: rgba(37,80,124,0.10); color: var(--primary); }
    html.dark .inv-chip--sent { background: rgba(96,165,250,0.16); color: #93C5FD; }
    .inv-chip--paid { background: var(--sec-green-10); color: var(--sec-green); }
    html.dark .inv-chip--paid { color: #6FE0A0; }
    .inv-chip--failed { background: var(--sec-red-10); color: var(--sec-red); }
    html.dark .inv-chip--failed { color: #FF9E96; }
    .inv-chip--cancelled { background: var(--surface-3, var(--surface-2)); color: var(--text-muted); }
    html.dark .inv-chip--cancelled { background: rgba(255,255,255,0.08); }

    /* Row + header action buttons — kept in a single row (never stacked) and
       all one uniform size. */
    .inv-actions { display: flex; align-items: center; flex-flow: row wrap; gap: 6px; }
    .inv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; height: 32px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-family: inherit; font-size: 0.75rem; font-weight: 700; line-height: 1; transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease; }
    .inv-btn .material-symbols-outlined { font-size: 15px; }
    /* Toolbar-level primary button matches the search field height + the
       Portfolio module's Add Product button. */
    .inv-toolbar .inv-btn { height: 40px; padding: 0 18px; font-size: 0.8rem; }
    .inv-toolbar .inv-btn .material-symbols-outlined { font-size: 16px; }
    .inv-btn--primary { background: var(--primary); color: #fff; }
    .inv-btn--primary:hover { filter: brightness(1.08); }
    .inv-btn--danger { background: transparent; color: var(--sec-red); border-color: var(--sec-red-10); }
    .inv-btn--danger:hover { background: var(--sec-red-10); }
    html.dark .inv-btn--danger { color: #FF9E96; }
    .inv-btn--good { background: transparent; color: var(--sec-green); border-color: var(--sec-green-10); }
    .inv-btn--good:hover { background: var(--sec-green-10); }
    html.dark .inv-btn--good { color: #6FE0A0; }
    .inv-btn--ghost { background: transparent; color: var(--text-muted); border-color: var(--border-strong); }
    .inv-btn--ghost:hover { color: var(--text); background: var(--surface-2); }
    html.dark .inv-btn--ghost:hover { background: rgba(255,255,255,0.06); }

    /* Row actions kebab — hidden until the board is narrow, where the inline
       button row is swapped for a three-dot menu + popover (mirrors the
       Portfolio module's .pf-rowmenu). */
    .inv-rowmenu { display: none; position: relative; }
    .inv-rowmenu-btn { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; color: var(--text-subtle); cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
    .inv-rowmenu-btn:hover, .inv-rowmenu.is-open .inv-rowmenu-btn { background: var(--surface-2); color: var(--text); }
    html.dark .inv-rowmenu-btn:hover, html.dark .inv-rowmenu.is-open .inv-rowmenu-btn { background: rgba(255,255,255,0.06); }
    .inv-rowmenu-btn .material-symbols-outlined { font-size: 20px; }
    .inv-rowmenu-pop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 40; min-width: 210px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-2, 0 12px 32px rgba(0,0,0,0.18)); padding: 6px; }
    .inv-rowmenu-pop[hidden] { display: none; }
    .inv-rowmenu-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: none; background: transparent; cursor: pointer; border-radius: 8px; font-family: inherit; font-size: 0.8rem; font-weight: 600; color: var(--text); text-align: left; }
    .inv-rowmenu-item:hover { background: var(--surface-2); }
    html.dark .inv-rowmenu-item:hover { background: rgba(255,255,255,0.06); }
    .inv-rowmenu-item .material-symbols-outlined { font-size: 17px; color: var(--text-subtle); flex-shrink: 0; }
    .inv-rowmenu-item--primary .material-symbols-outlined { color: var(--primary); }
    .inv-rowmenu-item--danger { color: var(--sec-red); }
    html.dark .inv-rowmenu-item--danger { color: #FF9E96; }
    .inv-rowmenu-item--danger .material-symbols-outlined { color: var(--sec-red); }
    html.dark .inv-rowmenu-item--danger .material-symbols-outlined { color: #FF9E96; }
    .inv-rowmenu-item--good { color: var(--sec-green); }
    html.dark .inv-rowmenu-item--good { color: #6FE0A0; }
    .inv-rowmenu-item--good .material-symbols-outlined { color: var(--sec-green); }
    html.dark .inv-rowmenu-item--good .material-symbols-outlined { color: #6FE0A0; }

    /* Toast */
    #inv-toast-wrap { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 2100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .inv-toast { display: inline-flex; align-items: center; gap: 9px; padding: 11px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-3); opacity: 0; transform: translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease; }
    .inv-toast.is-in { opacity: 1; transform: none; }
    .inv-toast .material-symbols-outlined { font-size: 17px; }

    /* Narrow container (e.g. docked beside chat): stack each row into a single
       column and swap the inline action buttons for a three-dot menu pinned to
       the row's top-right. */
    @container inv (max-width: 820px) {
      .inv-thead { display: none; }
      .inv-trow { grid-template-columns: 1fr; gap: 4px; position: relative; padding-right: 44px; }
      .inv-actions { display: none; }
      .inv-rowmenu { display: inline-flex; position: absolute; top: 8px; right: 6px; }
    }

    @media (max-width: 640px) {
      .inv-wrap { padding: 20px 20px 48px; }
    }
  </style>
</head>
<body data-nav-id="invoices" data-default-dock="left" data-default-nav-collapsed="1">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
</body>
</html>
