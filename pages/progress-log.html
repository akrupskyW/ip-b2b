<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Never serve a stale snapshot of this journal — every reload / hot reload
       must re-evaluate counts, filters, and the timeline from the current LOG.
       A new local day opens a live day at the top of the board. Eval notes and
       crawls are today-only — they never rewrite earlier days or write a
       journal-wide digest. Boot, the hourly poll, midnight, and Re-evaluate
       open every HTML file, inventory features / UX / modules, and rewrite
       today’s cards against a frozen start-of-day baseline. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>WISE · Progress Log</title>
  <!-- Auth: redirect to sign-in if there is no session, then load the auth API. -->
  <script src="../js/auth-guard.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/text-size-fouc.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* ═══════════ Progress Log — internal build journal ═══════════
       Reuses the shared WISE app shell (nav + brand strip + topbar controls) and
       the ONE shared WISEcodeAI chat module, exactly like reformulation.html /
       product-portfolio.html. Two modules share the shell's "modules" grid area:
       the WISEcodeAI chat (left) and the Progress Log board (right). Everything
       bespoke here is prefixed pl-. */

    /* Semantic tints (wise.css ships the base inks + AAA text, not these tints). */
    :root {
      --sec-green-10: rgba(50, 169, 102, 0.12);
      --sec-red-10: rgba(220, 48, 56, 0.12);
      --ter-amber-10: rgba(255, 196, 52, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--modules-bottom-pad, 12px);
      font-family: 'WISE Digits', 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    #chat-shell-wrap { flex: 1 1 0%; min-height: 0; width: 100%; overflow: visible; }
    #chat-shell-wrap.menu-brand-integrated #modules-row {
      grid-area: modules;
      display: flex;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      margin-top: 0;
      padding: 0 2px;
    }

    /* ── Nav brand strip height (chat-shell), matches every other WISE page ── */
    #chat-shell-wrap #menu-panel:not(.mp-pivot) .menu-brand-bar { min-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-bar { height: var(--panel-header-h); min-height: var(--panel-header-h); max-height: var(--panel-header-h); margin-bottom: 0; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo,
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo a { height: 100%; display: flex; align-items: center; justify-content: center; }
    #chat-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo svg.tl-bug { transform: translateY(16px); }

    /* ── Shared carded module frame (mirrors .rf-card) ── */
    .pl-card {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    /* Left chat column — fixed width, carded, canonical widen tiers. */
    .pl-chat { flex: 0 0 var(--chat-pane-w, 380px); width: var(--chat-pane-w, 380px); background: var(--bg); }
    .pl-chat.panel-wide { flex-basis: 580px; width: 580px; }
    .pl-chat.panel-triple { flex-basis: 760px; width: 760px; }
    /* Floated ⋯ + width sit above the welcome overlay (z-index 10) and blend
       into the chat surface, matching wiseai.html. */
    html.header-float .pl-chat .chat-topbar { z-index: 12 !important; }
    html.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: var(--bg);
    }
    html.dark.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: #1A2339;
    }
    html.chat-tint:not(.dark).header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.chat-tint:not(.dark).header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary) 5%, #fff);
    }
    html.dark.chat-tint.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-more-btn,
    html.dark.chat-tint.header-float #pl-chat.sc-card.sc-scrolled .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn {
      background: color-mix(in srgb, var(--primary-bright, #8B9FAF) 8%, #1A2339);
    }
    #pl-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn:hover,
    #pl-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn:hover { background: var(--surface-3); }
    #pl-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-more-btn.is-open,
    #pl-chat.sc-card .chat-topbar > .sc-topbar-controls .panel-width-toggle-btn.is-on { background: color-mix(in srgb, var(--primary) 16%, var(--surface-2)); }
    /* Progress log board — the flexible filler beside the chat.
       The card itself scrolls so the serif header travels with the
       journal (not a sticky bar above a separate .pl-body scroller). */
    .pl-log { flex: 1 1 auto; min-width: 520px; overflow-x: hidden; overflow-y: auto; }
    .pl-log.panel-wide { min-width: 720px; }
    .pl-log.panel-triple { min-width: 900px; }

    /* ── Module header — serif headline + meta, controls to the right (mirrors .rf-head) ── */
    .pl-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 26px 14px; flex-shrink: 0; }
    .pl-head-titles { min-width: 0; }
    .pl-head-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 1.2rem; color: var(--text); margin: 0; letter-spacing: -.01em; line-height: 1.15; }
    .pl-head-meta { font-size: 11.5px; color: var(--text-muted); margin: 3px 0 0; line-height: 1.3; }
    .pl-head-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* ── Scrolling body — sizes to content; the .pl-log card is the scroller ── */
    .pl-body { flex: 0 0 auto; min-height: auto; overflow: visible; padding: 4px 26px 22px; }

    /* ── Toolbar + canonical search (mirrors reformulation's .rf-search) ──
       Search fills the row; Re-evaluate sits to its right and writes notes
       for every page/day. No in-search page picker. */
    .pl-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0 2px; }
    .pl-search-inline { position: relative; display: inline-flex; align-items: center; flex: 1 1 auto; min-width: 200px; }
    .pl-search {
      width: 100%; height: 38px; box-sizing: border-box; padding: 0 16px;
      font-family: inherit; font-size: 0.8125rem; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill, 9999px); outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .pl-search-inline.has-query .pl-search { padding-right: 40px; }
    html.dark .pl-search { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .pl-search::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .pl-search:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .pl-search-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); z-index: 1;
      width: 28px; height: 28px; border-radius: 50%; display: none;
      align-items: center; justify-content: center;
      border: 0; background: transparent; color: var(--text-subtle); cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .pl-search-inline.has-query .pl-search-clear { display: inline-flex; }
    .pl-search-clear:hover { background: var(--surface-3); color: var(--text); }
    html.dark .pl-search-clear:hover { background: rgba(255,255,255,0.08); }
    .pl-search-clear-x { font-size: 18px; line-height: 1; font-weight: 400; }
    .pl-review-btn {
      flex: 0 0 auto; height: 38px; padding: 0 16px;
      box-shadow: 0 4px 12px rgba(37, 80, 124, 0.25);
    }
    .pl-review-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(37, 80, 124, 0.3); }
    .pl-review-btn:disabled { opacity: 0.7; cursor: progress; }
    .pl-review-btn.is-busy .material-symbols-outlined { animation: pl-spin .8s linear infinite; }
    .pl-review-btn.is-done { background: var(--sec-green); border-color: var(--sec-green); box-shadow: 0 4px 12px rgba(50, 169, 102, 0.28); }
    @keyframes pl-spin { to { transform: rotate(360deg); } }

    /* ── Scorecards — the canonical clickable stat card (mirrors .rf-stat).
       Summary cards are read-outs; category cards double as list filters.
       Brand palette ONLY (navy / green / amber / red) — no invented colours. ── */
    .pl-stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
    .pl-stats + .pl-stats { margin-top: 10px; }
    .pl-stat {
      flex: 1 1 120px; min-width: 108px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 12px 14px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-1);
      font-family: inherit; text-align: center; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    }
    html.dark .pl-stat { background: #1A2339; }
    .pl-stat:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); border-color: var(--border-strong); }
    .pl-stat:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .pl-stat.is-active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); box-shadow: inset 0 0 0 1px var(--primary), var(--shadow-1); }
    html.dark .pl-stat.is-active { background: color-mix(in srgb, var(--primary) 26%, transparent); }
    .pl-stat:disabled { cursor: default; }
    .pl-stat:disabled:hover { transform: none; box-shadow: var(--shadow-1); border-color: var(--border); }
    .pl-stat-num { display: inline-flex; align-items: center; gap: 1px; font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 22px; font-weight: 800; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
    .pl-stat-label { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .pl-stat-sub { font-size: 10px; color: var(--text-subtle); margin-top: 1px; }
    .pl-stat--good .pl-stat-num { color: var(--sec-green); }
    .pl-stat--alert .pl-stat-num { color: var(--sec-red); }

    .pl-filter-note { font-size: 11px; color: var(--text-subtle); margin: 14px 0 0; }

    /* ── Timeline ── */
    .pl-day { margin-top: 24px; scroll-margin-top: 12px; }
    .pl-day:first-child { margin-top: 0; }
    .pl-day-head {
      display: flex; align-items: center; gap: 11px; flex-wrap: wrap;
      padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .pl-day-titles { min-width: 0; flex: 1; }
    .pl-day-date { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
    .pl-day-rel { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); font-family: 'WISE Digits', 'DM Sans', system-ui, sans-serif; }
    .pl-day-summary { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pl-day-tally { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pl-tally-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 9999px;
      font-size: 10.5px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border);
    }
    html.dark .pl-tally-pill { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
    .pl-day-copy {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 10px; border-radius: 9999px;
      border: 0; background: transparent; color: var(--text-subtle); cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 700;
      transition: background .15s ease, color .15s ease;
    }
    .pl-day-copy:hover { background: var(--surface-2); color: var(--text); }
    html.dark .pl-day-copy:hover { background: rgba(255,255,255,0.08); }
    .pl-day-copy:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .pl-day-copy.is-copied { color: var(--sec-green); }
    .pl-day.is-collapsed .pl-day-body { display: none; }

    /* One container per day: notes + every page live inside a single card. */
    .pl-day-body { display: flex; flex-direction: column; gap: 0; }
    .pl-day-card {
      padding: 18px 18px 10px; border-radius: var(--r-md, 16px);
      background: var(--surface-2); border: 1px solid var(--border);
    }
    html.dark .pl-day-card { background: rgba(255,255,255,0.03); }
    .pl-day-card .pl-notes { border-bottom-color: var(--border); }

    /* ── Page block (inside the day container) ── */
    .pl-pcard { padding: 16px 0 8px; }
    .pl-pcard + .pl-pcard { border-top: 1px solid var(--border); }
    .pl-pcard-head { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 10px; }
    .pl-pcard-meta { min-width: 0; flex: 1; }
    .pl-pcard-name { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; word-break: break-word; color: var(--text); }
    .pl-pcard-path { font-size: 10.5px; color: var(--text-subtle); font-family: 'Courier New', monospace; margin-top: 1px; }
    .pl-pcard-new { display: inline-flex; align-items: center; margin-left: auto; flex-shrink: 0; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec-green); }

    /* One category, then a stack of full descriptions — never inline bullets
       wrapped into a single run-on line. */
    .pl-pcard-cats { display: flex; flex-direction: column; gap: 16px; }
    .pl-cat-block { display: flex; flex-direction: column; gap: 8px; margin: 0; }
    .pl-cat-block-head { display: flex; align-items: baseline; gap: 5px; flex: 0 0 auto; }
    .pl-cat-block-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-subtle); }
    .pl-cat-block-count { font-size: 10px; font-weight: 700; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
    .pl-cat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .pl-cat-list li { display: block; font-size: 13px; line-height: 1.55; color: var(--text); }
    .pl-cat-list mark { background: color-mix(in srgb, var(--primary) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

    /* ── Empty state ── */
    .pl-empty { margin-top: 26px; padding: 40px 22px; text-align: center; border-radius: var(--r-md, 16px); border: 1px dashed var(--border-strong); color: var(--text-muted); }
    .pl-empty-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-size: 14px; font-weight: 700; color: var(--text); }
    .pl-empty-note { font-size: 12px; margin-top: 3px; }

    /* ── Personal notes — same language as chat turn notes + admin Save / Cancel ── */
    .pl-notes { margin: 0 0 10px; padding: 0 0 12px; border-bottom: 1px dashed var(--border); grid-column: 1 / -1; }
    .pl-notes.is-empty { padding-bottom: 4px; margin-bottom: 6px; border-bottom: 0; }
    .pl-notes.is-empty .pl-note-add { margin-top: 0; }
    .pl-notes-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .pl-notes-title { font-family: 'WISE Digits', 'Noto Serif', Georgia, serif; font-weight: 800; font-size: 0.95rem; color: var(--text); letter-spacing: -.01em; }
    .pl-notes-count { font-size: 10px; font-weight: 700; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
    .pl-notes-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .pl-note {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px; border-radius: 10px;
      background: color-mix(in srgb, var(--ter-amber-10) 100%, transparent);
      border: 1px solid color-mix(in srgb, #E0A100 30%, transparent);
    }
    html.dark .pl-note { background: color-mix(in srgb, #E0A100 14%, transparent); border-color: color-mix(in srgb, #E0A100 32%, transparent); }
    .pl-note-body { flex: 1 1 auto; min-width: 0; }
    .pl-note-text { font-size: 12.5px; line-height: 1.45; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .pl-note-text mark { background: color-mix(in srgb, var(--primary) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
    .pl-note-meta { font-size: 10.5px; color: var(--text-subtle); margin-top: 3px; }
    .pl-note-edit {
      display: inline-flex; align-items: center; justify-content: center;
      height: 28px; padding: 0 8px; border-radius: 9999px; flex-shrink: 0;
      border: 0; background: transparent; color: var(--text-subtle); cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 700;
      transition: background .15s ease, color .15s ease;
    }
    .pl-note-edit:hover { background: var(--surface-2); color: var(--text); }
    html.dark .pl-note-edit:hover { background: rgba(255,255,255,0.08); }
    .pl-note-edit:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .pl-note-edit.is-on { color: var(--primary-ink, var(--primary)); }
    .pl-note-add {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 8px; padding: 6px 12px;
      font-family: inherit; font-weight: 700; font-size: 12px;
      color: var(--text-muted); background: transparent;
      border: 1px dashed var(--border-strong); border-radius: 9999px;
      cursor: pointer; transition: background .16s, color .16s, border-color .16s;
    }
    .pl-note-add:hover { color: var(--text); border-color: var(--primary); background: var(--surface-2); }
    html.dark .pl-note-add:hover { background: rgba(255,255,255,0.05); }
    .pl-note-add:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
    .pl-note-composer { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .pl-note-input {
      width: 100%; box-sizing: border-box; min-height: 74px; padding: 10px 14px;
      font-family: inherit; font-size: 0.8125rem; line-height: 1.45; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border-strong);
      border-radius: 10px; outline: none; resize: vertical;
    }
    html.dark .pl-note-input { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.10); }
    .pl-note-input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .pl-note-input::placeholder { color: color-mix(in srgb, var(--text-subtle) 55%, transparent); font-style: italic; }
    .pl-note-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Module three-dot menu reuses the shared .topbar-popover / .panel-more-* chrome. */
    .pl-log .panel-more-wrap { position: relative; }

    @media (max-width: 620px) {
      .pl-head { padding: 18px 18px 12px; }
      .pl-body { padding: 4px 18px 18px; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body>
  <!-- Hidden host for the shared menu controls (mirrors reformulation.html). -->
  <div id="topbar-row" hidden aria-hidden="true">
    <button type="button" id="topbar-menu-toggle" class="topbar-menu-toggle" title="Collapse menu to icons" aria-label="Collapse menu to icons" aria-pressed="false"><span class="material-symbols-outlined">chevron_left</span></button>
    <button type="button" class="topbar-appearance-btn" id="topbar-appearance-btn" title="Appearance" aria-label="Appearance settings" aria-haspopup="true" aria-expanded="false"><span class="material-symbols-outlined">crossword</span></button>
    <div class="topbar-profile has-dot" id="topbar-profile" title="Arthur Krupsky · akrupsky@wisecode.ai" data-action="user-menu" role="button" tabindex="0" aria-label="User menu">AK</div>
  </div>

  <div id="chat-shell-wrap" class="menu-brand-integrated">
    <!-- Left navigation module (shared WISE app nav) -->
    <div id="menu-panel" class="mp-open">

  <!-- Appearance + profile popovers for the nav footer (mirrors reformulation.html). -->
  <script>
    (function () {
      function applyChatTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('wise-theme', theme); } catch (_) {}
      }
      window.toggleChatTheme = function () {
        applyChatTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
      };
      (function bootTheme() {
        let theme = 'light';
        try { theme = localStorage.getItem('wise-theme') || (localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light'); } catch (_) {}
        applyChatTheme(theme === 'dark' ? 'dark' : 'light');
      })();

      let activePopover = null, activeAnchor = null;
      function closePopover() {
        if (!activePopover) return;
        activeAnchor?.classList.remove('is-open');
        activeAnchor?.setAttribute('aria-expanded', 'false');
        activePopover.classList.remove('open');
        const p = activePopover;
        setTimeout(() => p.remove(), 210);
        activePopover = null; activeAnchor = null;
      }
      function positionWisePopover(pop, anchor) {
        if (window.isMenuFooterAnchor?.(anchor)) window.positionPopoverInMenuPanel?.(pop, anchor);
        else window.positionPopoverForTopbar?.(pop, anchor);
      }
      function renderAppearanceBody(pop) {
        pop.innerHTML = window.buildAppearanceBody({
          showPivot: true,
          isPivoted: !!window.isMenuPivoted?.(),
          isDark: document.documentElement.classList.contains('dark'),
          showWISEcodeAIDock: false,
        });
      }
      function openAppearancePopover(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        renderAppearanceBody(pop);
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open'); anchor.setAttribute('aria-expanded', 'true');
        window.wireAppearancePopover(pop, {
          render: () => renderAppearanceBody(pop),
          onClose: closePopover,
          togglePivot: () => window.toggleMenuPivot?.(),
          toggleTheme: () => window.toggleChatTheme?.(),
        });
      }
      function openUserMenu(anchor) {
        if (activeAnchor === anchor) { closePopover(); return; }
        closePopover();
        const pop = document.createElement('div');
        pop.className = 'wise-popover';
        document.body.appendChild(pop);
        pop.innerHTML = window.buildUserMenuBody({ name: 'Arthur Krupsky' });
        positionWisePopover(pop, anchor);
        requestAnimationFrame(() => pop.classList.add('open'));
        activePopover = pop; activeAnchor = anchor;
        anchor.classList.add('is-open');
        pop.addEventListener('click', (ev) => {
          const profile = ev.target.closest('[data-pop-action="profile"]');
          if (profile && pop.contains(profile)) { ev.stopPropagation(); location.href = 'profile.html'; return; }
          const invoices = ev.target.closest('[data-pop-action="invoices"]');
          if (invoices && pop.contains(invoices)) { ev.stopPropagation(); location.href = 'invoices.html'; return; }
          const signout = ev.target.closest('[data-pop-action="signout"]');
          if (signout && pop.contains(signout)) { ev.stopPropagation(); window.performSignOut(); return; }
          if (ev.target.closest('.wise-popover-header, .wise-popover-divider, .wise-popover-actions, .wise-pop-vline')) { ev.stopPropagation(); return; }
          closePopover();
        });
      }
      document.getElementById('topbar-appearance-btn')?.addEventListener('click', (e) => { e.stopPropagation(); openAppearancePopover(e.currentTarget); });
      document.getElementById('topbar-profile')?.addEventListener('click', (e) => { e.stopPropagation(); openUserMenu(e.currentTarget); });
      document.addEventListener('wise:menu-footer-layout', (e) => openAppearancePopover(e.detail.anchor));
      document.addEventListener('wise:menu-footer-profile', (e) => openUserMenu(e.detail.anchor));
      document.addEventListener('click', (e) => {
        if (activePopover && !activePopover.contains(e.target) && !activeAnchor?.contains(e.target)) closePopover();
      });
      window.addEventListener('resize', closePopover);
    })();
  </script>

          .filter((c) => catTotals[c.id] > 0)
          .map((c) => statHtml({
            num: catTotals[c.id], label: c.label, cat: c.id,
            tone: CAT_TONE[c.id], active: catFilter === c.id,
          })).join('');
      }

      function highlight(text) {
        const safe = esc(text);
        if (!searchTerm) return safe;
        const re = new RegExp('(' + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        return safe.replace(re, '<mark>$1</mark>');
      }
      function matchesSearch(entry) {
        if (!searchTerm) return true;
        const hay = (entry.page + ' ' + entry.path + ' ' + entryItems(entry).map((i) => i.text).join(' ')).toLowerCase();
        return hay.includes(searchTerm);
      }
      function notesMatchSearch(iso) {
        const list = notesForDay(iso);
        if (!searchTerm) return list.length > 0;
        return list.some((n) => n.text.toLowerCase().includes(searchTerm));
      }

      function renderNoteCard(n) {
        const when = relTime(n.updatedAt || n.createdAt);
        const evalLabel = n.scope === 'crawl' ? 'Live page crawl' : (n.scope === 'journal' ? 'All pages' : 'Evaluated');
        const bits = [n.kind === 'eval' ? evalLabel : '', when].filter(Boolean);
        return `
          <li class="pl-note" data-note-id="${esc(n.id)}">
            <div class="pl-note-body">
              <div class="pl-note-text">${highlight(n.text)}</div>
              ${bits.length ? `<div class="pl-note-meta">${esc(bits.join(' · '))}</div>` : ''}
            </div>
            <button type="button" class="pl-note-edit" data-note-edit="${esc(n.id)}" data-note-day="${esc(n.day)}" title="Edit note" aria-label="Edit note">Edit</button>
          </li>`;
      }
      function renderComposer(dayIso) {
        const isEdit = !!(noteEditor && noteEditor.id);
        const val = noteEditor && noteEditor.day === dayIso ? noteEditor.text : '';
        return `
          <div class="pl-note-composer">
            <label class="adm-field-label" for="pl-note-input-${esc(dayIso)}">${isEdit ? 'Edit note' : 'Your note'}</label>
            <textarea id="pl-note-input-${esc(dayIso)}" class="pl-note-input" rows="3" placeholder="Capture a decision, a question, or an observation…" aria-label="${isEdit ? 'Edit note' : 'Add a note'}">${esc(val)}</textarea>
            <div class="pl-note-actions">
              <button type="button" class="adm-btn adm-btn--ghost adm-btn--sm" data-note-cancel>Cancel</button>
              <button type="button" class="adm-btn adm-btn--primary adm-btn--sm" data-note-save>Save</button>
            </div>
          </div>`;
      }
      function renderNotesBlock(dayIso) {
        const list = notesForDay(dayIso);
        const editing = noteEditor && noteEditor.day === dayIso;
        const editingId = editing ? noteEditor.id : null;
        const cards = list.filter((n) => n.id !== editingId).map(renderNoteCard).join('');
        const head = list.length ? `
          <div class="pl-notes-head">
            <span class="pl-notes-title">Notes</span>
            <span class="pl-notes-count">${list.length}</span>
          </div>` : '';
        const composer = editing ? renderComposer(dayIso) : '';
        const addBtn = editing ? '' : `<button type="button" class="pl-note-add" data-note-add="${esc(dayIso)}">Add a note</button>`;
        const empty = !list.length && !editing;
        return `<div class="pl-notes${empty ? ' is-empty' : ''}" data-notes-day="${esc(dayIso)}">${head}${cards ? `<ul class="pl-notes-list">${cards}</ul>` : ''}${composer}${addBtn}</div>`;
      }

      function renderCatBlock(cat, items) {
        const c = CAT_BY_ID[cat];
        return `
          <div class="pl-cat-block">
            <div class="pl-cat-block-head">
              <span class="pl-cat-block-label">${c.label}</span>
              <span class="pl-cat-block-count">${items.length}</span>
            </div>
            <ul class="pl-cat-list">${items.map((t) => `<li>${highlight(t)}</li>`).join('')}</ul>
          </div>`;
      }
      function renderPageCard(entry) {
        const blocks = CATS
          .filter((c) => (!catFilter || c.id === catFilter) && Array.isArray(entry[c.id]) && entry[c.id].length)
          .map((c) => renderCatBlock(c.id, entry[c.id])).join('');
        if (!blocks) return '';
        return `
          <article class="pl-pcard${entry.isNew ? ' is-new' : ''}">
            <div class="pl-pcard-head">
              <div class="pl-pcard-meta">
                <div class="pl-pcard-name">${esc(entry.page)}</div>
                <div class="pl-pcard-path">${esc(entry.path)}</div>
              </div>
              ${entry.isNew ? '<span class="pl-pcard-new">New</span>' : ''}
            </div>
            <div class="pl-pcard-cats">${blocks}</div>
          </article>`;
      }

      function renderTimeline() {
        const root = document.getElementById('pl-timeline');
        let html = '';
        let visible = 0;
        let visibleNotes = 0;
        LOG.forEach((day) => {
          const entries = day.entries.filter((e) => (pageFilter === '__all' || e.page === pageFilter) && matchesSearch(e));
          const cards = entries.map(renderPageCard).filter(Boolean);
          const editingHere = !!(noteEditor && noteEditor.day === day.date);
          const notesHit = notesMatchSearch(day.date);
          const showNotesOnly = !catFilter && pageFilter === '__all' && (notesHit || editingHere);
          if (!cards.length && !showNotesOnly && !editingHere) return;
          visible += cards.length;
          visibleNotes += notesForDay(day.date).length;
          const tally = {};
          entries.forEach((e) => entryItems(e).forEach((it) => { if (!catFilter || it.cat === catFilter) tally[it.cat] = (tally[it.cat] || 0) + 1; }));
          const noteN = notesForDay(day.date).length;
          const tallyPills = CATS.filter((c) => tally[c.id]).map((c) => `<span class="pl-tally-pill" title="${c.label}">${esc(c.label)} ${tally[c.id]}</span>`).join('') +
            (noteN ? `<span class="pl-tally-pill" title="Notes">Notes ${noteN}</span>` : '');
          const isCollapsed = collapsed.has(day.date);
          const dayInner = `${renderNotesBlock(day.date)}${cards.join('')}`;
          html += `
            <section class="pl-day${isCollapsed ? ' is-collapsed' : ''}" id="pl-day-${day.date}">
              <div class="pl-day-head" data-day="${day.date}" role="button" tabindex="0" aria-expanded="${!isCollapsed}">
                <div class="pl-day-titles">
                  <div class="pl-day-date">${fmtDate(day.date)} <span class="pl-day-rel">${day.rel}</span></div>
                  <div class="pl-day-summary">${esc(day.summary)}</div>
                </div>
                <div class="pl-day-tally">${tallyPills}<button type="button" class="pl-day-copy" data-copy-day="${day.date}" title="Copy this day's work" aria-label="Copy ${esc(fmtDate(day.date))}'s work">Copy</button></div>
              </div>
              <div class="pl-day-body"><div class="pl-day-card">${dayInner}</div></div>
            </section>`;
        });
        root.innerHTML = html ? html : `
          <div class="pl-empty">
            <div class="pl-empty-title">Nothing matches those filters</div>
            <div class="pl-empty-note">Clear the search or deselect the category scorecard.</div>
          </div>`;

        const note = document.getElementById('pl-filter-note');
        const parts = [`${visible} page ${visible === 1 ? 'entry' : 'entries'} shown`];
        if (visibleNotes) parts.push(`${visibleNotes} ${visibleNotes === 1 ? 'note' : 'notes'}`);
        if (catFilter) parts.push(`category: ${CAT_BY_ID[catFilter].label}`);
        if (pageFilter !== '__all') parts.push(`page: ${pageFilter}`);
        if (searchTerm) parts.push(`search: “${searchTerm}”`);
        note.textContent = parts.join(' · ');
        restoreNoteComposer();
      }

      /* ── Re-evaluate: today only ──
         Personal notes (no kind) are left alone. Re-evaluate writes one
         eval note for today. Earlier days are not rewritten. There is no
         journal-wide “across N days” note. Click again updates today’s
         note instead of stacking duplicates. */
      function oxford(items) {
        const list = (items || []).filter(Boolean);
        if (!list.length) return '';
        if (list.length === 1) return list[0];
        if (list.length === 2) return list[0] + ' and ' + list[1];
        return list.slice(0, -1).join(', ') + ', and ' + list[list.length - 1];
      }
      function dayEvalNote(day) {
        const pages = (day.entries || []).filter((e) => e.path !== '(all HTML files)');
        return 'Evaluated every HTML file on ' + fmtDate(day.date) + '. '
          + pages.length + (pages.length === 1 ? ' surface has' : ' surfaces have')
          + ' a card below with full feature, UX, UI, and module descriptions — not byte counts or heading tallies.';
      }
      function upsertEvalNote(dayIso, text, scope) {
        const now = new Date().toISOString();
        const existing = notes.find((n) => n.day === dayIso && n.kind === 'eval' && n.scope === scope);
        if (existing) {
          existing.text = text;
          existing.updatedAt = now;
          existing.stamp = LOG_STAMP;
          notes = [existing, ...notes.filter((n) => n.id !== existing.id)];
        } else {
          notes.unshift({
            id: nid(), day: dayIso, text, kind: 'eval', scope,
            stamp: LOG_STAMP, createdAt: now, updatedAt: now,
          });
        }
      }
      function evaluateAllPages({ scroll = true } = {}) {
        syncBoardLog();
        notes = loadNotes();
        dropJournalNotes();
        const day = todayDay();
        if (day) upsertEvalNote(day.date, dayEvalNote(day), 'day');
        persistNotes();
        if (scroll) collapsed.clear();
        lastEvalAt = Date.now();
        lastEvalDay = localDayIso();
        persistEvalMeta();
        renderAll();
        updateEvalMeta();
        if (scroll && day) {
          const first = document.querySelector('#pl-day-' + day.date + ' .pl-notes');
          if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
      function shouldEvaluateAll() {
        return isNewLocalDay() || evalNotesNeedRefresh() || !lastEvalAt;
      }

      function renderAll() { renderSummary(); renderCatStats(); renderTimeline(); }

      /* Paint the board from the current LOG + persisted notes. A full
         evaluateAllPages() is a separate pass — boot / restore call that
         when the local day rolled or eval notes are stale. `reset` wipes
         filters, search, and collapse so a restored snapshot never shows
         a stale filtered board. */
      function reevaluate({ reset = false } = {}) {
        syncBoardLog();
        notes = loadNotes();
        if (reset) {
          catFilter = null;
          pageFilter = '__all';
          searchTerm = '';
          collapsed.clear();
          noteEditor = null;
          noteWantFocus = false;
          if (searchInput) searchInput.value = '';
          syncSearchWrap();
        }
        renderAll();
      }
      window.plReevaluate = (opts) => reevaluate(opts || {});

      /* ── Live page crawl ──────────────────────────────────────────────
         Re-evaluate opens every HTML file every time (catalog + directory
         listing + extras), inventories features / UX / modules / scripts /
         chips, and diffs against a frozen start-of-day baseline. The live
         day is rebuilt from that same baseline on every pass so the cards
         stay identical until the files themselves move. Byte counts are
         supporting context only. */
      let lastCrawlAt = 0;
      let crawlBusy = false;
      let lastCrawlFileCount = catalogHtmlPaths().length + SHARED_SCRIPTS.length;

      async function crawlPage(path) {
        try {
          const res = await fetch(path + '?plc=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return { path, missing: true };
          const fp = inventoryDoc(path, await res.text());
          const lm = res.headers.get('Last-Modified');
          fp.mtime = lm ? Date.parse(lm) : 0;
          return fp;
        } catch (_) { return { path, missing: true }; }
      }
      async function resolveCrawlFiles() {
        const html = await discoverHtmlPaths(async (url) => {
          const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'plc=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return '';
          return res.text();
        });
        const seen = new Set();
        const files = [];
        html.concat(SHARED_SCRIPTS).forEach((p) => {
          if (!p || seen.has(p)) return;
          seen.add(p);
          files.push(p);
        });
        lastCrawlFileCount = files.length;
        return files;
      }
      function crawlAllPages(files) { return Promise.all(files.map(crawlPage)); }
      function fileLabel(path, title) {
        const authored = (() => {
          const base = String(path || '').split('/').pop();
          const disp = displayPath(path);
          for (const d of AUTHORED) {
            for (const e of d.entries) {
              if (e.path === path || e.path === base || e.path === disp) return e.page;
            }
          }
          return '';
        })();
        return authored || defaultFileLabel(path, title);
      }
      function loadCrawlSnap() {
        try {
          const raw = JSON.parse(localStorage.getItem(CRAWL_KEY) || 'null');
          if (raw && raw.pages && typeof raw.pages === 'object') return raw;
        } catch (_) {}
        try {
          const legacy = JSON.parse(localStorage.getItem(CRAWL_KEY_LEGACY) || 'null');
          if (legacy && legacy.pages && typeof legacy.pages === 'object') return legacy;
        } catch (_) {}
        return null;
      }
      function persistCrawlSnap(snap) {
        const compactMap = (map) => {
          const out = {};
          Object.keys(map || {}).forEach((k) => {
            const fp = map[k];
            if (!fp) return;
            out[k] = {
              path: fp.path, title: fp.title, size: fp.size, hash: fp.hash,
              headings: fp.headings, modules: fp.modules, scripts: fp.scripts,
              chips: fp.chips, buttons: fp.buttons, signals: fp.signals,
              functions: fp.functions, classes: fp.classes, copy: fp.copy,
              hasChat: fp.hasChat, kind: fp.kind,
            };
          });
          return out;
        };
        const payload = {
          at: snap.at, day: snap.day, history: snap.history,
          dayStart: compactMap(snap.dayStart),
          pages: compactMap(snap.pages),
        };
        try { localStorage.setItem(CRAWL_KEY, JSON.stringify(payload)); }
        catch (_) {
          try {
            delete payload.dayStart;
            localStorage.setItem(CRAWL_KEY, JSON.stringify(payload));
          } catch (__) {}
        }
      }
      function dayStartMap(prev, todayIso) {
        if (!prev || !prev.pages) return null;
        if (prev.day === todayIso && prev.dayStart && typeof prev.dayStart === 'object') return prev.dayStart;
        return prev.pages;
      }
      function liveDaySummary(day, htmlCount) {
        const names = (day.entries || []).filter((e) => e.path !== '(all HTML files)').map((e) => e.page);
        const n = htmlCount || 0;
        if (!names.length) {
          return 'Evaluated every HTML file' + (n ? ' (' + n + ')' : '') + '. No disk changes versus the start-of-day baseline.';
        }
        return 'Evaluated every HTML file' + (n ? ' (' + n + ')' : '') + '. '
          + names.length + (names.length === 1 ? ' surface has' : ' surfaces have')
          + ' full feature, UX, UI, and module details below.';
      }
      function entryFromCats(fp, cats, isNew) {
        const entry = { page: fileLabel(fp.path, fp.title), path: displayPath(fp.path) };
        if (isNew) entry.isNew = true;
        CATS.forEach((c) => {
          if (Array.isArray(cats[c.id]) && cats[c.id].length) entry[c.id] = cats[c.id].slice();
        });
        return entry;
      }
      function rebuildLiveDay(diff, htmlCount) {
        syncBoardLog();
        if (!liveDay) return false;
        const next = [];
        (diff.added || []).forEach((fp) => {
          const cats = describeInventoryDiff(fp, null);
          if (catsHaveItems(cats)) next.push(entryFromCats(fp, cats, true));
        });
        (diff.changed || []).forEach(({ fp, before }) => {
          const cats = describeInventoryDiff(fp, before);
          if (catsHaveItems(cats)) next.push(entryFromCats(fp, cats, false));
        });
        next.sort((a, b) => String(a.page).localeCompare(String(b.page)) || String(a.path).localeCompare(String(b.path)));
        const unchangedHtml = (diff.unchanged || []).filter((fp) => isHtmlPath(fp.path));
        if (unchangedHtml.length) {
          const names = unchangedHtml.map((fp) => fileLabel(fp.path, fp.title)).sort((a, b) => a.localeCompare(b));
          const scope = emptyCats();
          scope.updates.push(
            'Evaluated every HTML file on this pass. Unchanged from the start of today: '
            + oxford(names) + '.'
          );
          next.push({ page: 'All HTML files', path: '(all HTML files)', updates: scope.updates });
        }
        liveDay.entries = next;
        liveDay.summary = liveDaySummary(liveDay, htmlCount);
        persistLiveDay();
        syncBoardLog();
        return true;
      }
      function diffAgainstBaseline(baseline, cur) {
        const prevMap = baseline || {};
        const curMap = {};
        cur.forEach((fp) => { if (!fp.missing) curMap[fp.path] = fp; });
        const added = [], changed = [], unchanged = [], unreachable = [];
        const hasBaseline = !!(baseline && Object.keys(baseline).length);
        cur.forEach((fp) => {
          if (fp.missing) { unreachable.push(fp.path); return; }
          const before = prevMap[fp.path];
          if (!hasBaseline) { unchanged.push(fp); return; }
          if (!before) added.push(fp);
          else if (before.hash !== fp.hash) changed.push({ fp, before });
          else unchanged.push(fp);
        });
        return { added, changed, unchanged, unreachable, curMap, firstBaseline: !hasBaseline };
      }
      function setCrawlBusyUi(on, n) {
        const el = document.getElementById('pl-head-meta');
        if (on && el) el.textContent = 'Evaluating every HTML file (' + (n || lastCrawlFileCount) + ')…';
        else updateEvalMeta();
      }
      async function crawlAndReport({ scroll = false } = {}) {
        if (crawlBusy) return;
        crawlBusy = true;
        setCrawlBusyUi(true);
        try {
          syncBoardLog();
          notes = loadNotes();
          dropJournalNotes();
          const files = await resolveCrawlFiles();
          setCrawlBusyUi(true, files.length);
          const cur = await crawlAllPages(files);
          const prev = loadCrawlSnap();
          const todayIso = localDayIso();
          const baseline = dayStartMap(prev, todayIso);
          const diff = diffAgainstBaseline(baseline, cur);
          const htmlCount = files.filter(isHtmlPath).length;
          const mutated = rebuildLiveDay(diff, htmlCount);
          const overview = diff.firstBaseline
            ? ('Evaluated every HTML file (' + htmlCount + ') plus ' + SHARED_SCRIPTS.length
              + ' shared scripts. First inventory saved as today’s baseline — the next Re-evaluate will describe features, UX, UI, and modules against this snapshot.')
            : crawlOverview(htmlCount, SHARED_SCRIPTS.length, diff, (fp) => fileLabel(fp.path, fp.title));
          upsertEvalNote(todayIso, overview, 'crawl');
          if (mutated && liveDay) upsertEvalNote(todayIso, dayEvalNote(liveDay), 'day');
          persistNotes();
          const prevHist = Array.isArray(prev && prev.history) ? prev.history : [];
          persistCrawlSnap({
            at: Date.now(),
            day: todayIso,
            dayStart: baseline || diff.curMap,
            pages: diff.curMap,
            history: prevHist.concat([{
              at: Date.now(),
              day: todayIso,
              changed: (diff.changed || []).map((c) => c.fp.path),
              added: (diff.added || []).map((f) => f.path),
            }]).slice(-20),
          });
          lastCrawlAt = Date.now();
          if (scroll) collapsed.delete(todayIso);
          renderAll();
          updateEvalMeta();
          if (scroll) {
            const first = document.querySelector('#pl-day-' + todayIso + ' .pl-notes');
            if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        } finally {
          crawlBusy = false;
          setCrawlBusyUi(false);
        }
      }
      window.plCrawlNow = () => crawlAndReport({ scroll: true });

      /* ── Hourly check + new-day full evaluation ──
         Every hour (and when the tab comes back after an hour) we cache-bust
         fetch this page, compare LOG_STAMP, and reload if the journal was
         rewritten. We also crawl every HTML file so a save (or an overnight
         change) lands on today with full feature / UX / module descriptions.
         A Re-evaluate click, a new local day, a missing today-note, or a
         stamp mismatch rewrites today’s eval note only. Polling pauses
         while the tab is hidden. Auto-checks skip if a note composer is open;
         a manual Re-evaluate does not. */
      const HOUR_MS = 60 * 60 * 1000;
      let hourlyTimer = null;
      let midnightTimer = null;
      function fmtClock(ts) {
        if (!ts) return 'never';
        return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      function updateEvalMeta() {
        const el = document.getElementById('pl-head-meta');
        if (!el) return;
        if (!lastEvalAt) {
          el.textContent = 'Not yet evaluated · re-evaluates at the start of each day';
          return;
        }
        const remaining = Math.max(0, (lastEvalAt + HOUR_MS) - Date.now());
        const mins = Math.round(remaining / 60000);
        const nextLabel = mins <= 0 ? 'due now' : (mins === 1 ? 'in 1 min' : 'in ' + mins + ' min');
        el.textContent = 'Last evaluated ' + fmtClock(lastEvalAt) + ' · next check ' + nextLabel;
      }
      async function journalStampMoved() {
        try {
          const url = location.pathname.split('?')[0] + '?pl=' + Date.now();
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) return false;
          const text = await res.text();
          const m = text.match(/const LOG_STAMP = '([^']+)'/);
          return !!(m && m[1] !== LOG_STAMP);
        } catch (_) { return false; }
      }
      async function pollLog({ evaluate = false, crawl = true } = {}) {
        syncBoardLog();
        const wantEval = evaluate || shouldEvaluateAll();
        if (noteEditor && !evaluate) { updateEvalMeta(); return; }
        if (await journalStampMoved()) { location.reload(); return; }
        if (wantEval) evaluateAllPages({ scroll: evaluate });
        else {
          lastEvalAt = Date.now();
          persistEvalMeta();
          reevaluate();
          updateEvalMeta();
        }
        if (crawl) await crawlAndReport({ scroll: evaluate });
      }
      function msUntilNextLocalMidnight() {
        const n = new Date();
        return new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1).getTime() - n.getTime();
      }
      function scheduleMidnightEval() {
        if (midnightTimer) clearTimeout(midnightTimer);
        midnightTimer = setTimeout(() => {
          midnightTimer = null;
          if (!document.hidden) pollLog();
          scheduleMidnightEval();
        }, Math.max(250, msUntilNextLocalMidnight() + 250));
      }
      function startHourlyPoll() {
        if (hourlyTimer) return;
        hourlyTimer = setInterval(() => { if (!document.hidden) pollLog(); }, HOUR_MS);
        setInterval(updateEvalMeta, 60000);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { updateEvalMeta(); return; }
          if (shouldEvaluateAll() || (Date.now() - lastEvalAt) >= HOUR_MS) pollLog();
          else updateEvalMeta();
        });
        scheduleMidnightEval();
      }
      async function runFullEval() {
        syncBoardLog();
        evaluateAllPages({ scroll: false });
        await crawlAndReport({ scroll: true });
        if (await journalStampMoved()) location.reload();
      }
      window.plReevaluateNow = () => { runFullEval(); };

      /* ── Filter API (also driven by the chat) ── */
      function syncSearchWrap() {
        const wrap = document.getElementById('pl-search-wrap');
        if (!wrap) return;
        wrap.classList.toggle('has-query', !!searchTerm);
      }
      function setSearch(v) { searchTerm = String(v || '').trim().toLowerCase(); const inp = document.getElementById('pl-search-input'); if (inp) inp.value = v || ''; syncSearchWrap(); renderTimeline(); }
      function setPage(p) { pageFilter = p || '__all'; renderTimeline(); }
      function setCatOnly(catId) { catFilter = catId; renderCatStats(); renderTimeline(); }
      function focusDay(iso) { collapsed.clear(); LOG.forEach((d) => { if (d.date !== iso) collapsed.add(d.date); }); renderTimeline(); const el = document.getElementById('pl-day-' + iso); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      window.plExpandAll = () => { collapsed.clear(); renderTimeline(); };
      window.plCollapseAll = () => { LOG.forEach((d) => collapsed.add(d.date)); renderTimeline(); };
      window.plResetFilters = () => { catFilter = null; pageFilter = '__all'; searchTerm = ''; collapsed.clear(); const inp = document.getElementById('pl-search-input'); if (inp) inp.value = ''; syncSearchWrap(); renderCatStats(); renderTimeline(); };
      window.plEvaluatePages = () => evaluateAllPages({ scroll: true });

      /* ── Note editor ── */
      let noteWantFocus = false;
      function restoreNoteComposer() {
        if (!noteEditor || !noteWantFocus) return;
        const ta = document.getElementById('pl-note-input-' + noteEditor.day);
        if (!ta) return;
        ta.focus();
        try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (_) {}
      }
      function openNoteEditor(dayIso, id) {
        const existing = id ? notes.find((n) => n.id === id) : null;
        noteEditor = { day: dayIso, id: existing ? existing.id : null, text: existing ? existing.text : '' };
        noteWantFocus = true;
        collapsed.delete(dayIso);
        renderTimeline();
        const ta = document.getElementById('pl-note-input-' + dayIso);
        if (ta) ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      function cancelNoteEditor() {
        if (!noteEditor) return;
        noteEditor = null;
        noteWantFocus = false;
        renderTimeline();
        if (shouldEvaluateAll()) pollLog({ crawl: false });
      }
      function commitNote() {
        if (!noteEditor) return;
        const val = String(noteEditor.text || '').trim();
        if (noteEditor.id) {
          if (!val) notes = notes.filter((n) => n.id !== noteEditor.id);
          else {
            const n = notes.find((x) => x.id === noteEditor.id);
            if (n) { n.text = val; n.updatedAt = new Date().toISOString(); }
          }
        } else if (val) {
          const now = new Date().toISOString();
          notes.unshift({ id: nid(), day: noteEditor.day, text: val, createdAt: now, updatedAt: now });
        }
        noteEditor = null;
        noteWantFocus = false;
        persistNotes();
        if (shouldEvaluateAll()) pollLog({ crawl: false });
        else { renderSummary(); renderTimeline(); }
      }
      function addNoteToDay(dayIso, text) {
        const val = String(text || '').trim();
        if (!val) return false;
        const now = new Date().toISOString();
        notes.unshift({ id: nid(), day: dayIso, text: val, createdAt: now, updatedAt: now });
        persistNotes();
        collapsed.delete(dayIso);
        renderSummary();
        renderTimeline();
        return true;
      }
      window.plAddNote = () => { openNoteEditor(LOG[0].date, null); };

      /* ── Module three-dot menu ── */
      window.plCloseModuleMenu = function () {
        const m = document.getElementById('pl-menu');
        if (!m) return;
        m.classList.add('hidden');
        document.getElementById('pl-menu-btn')?.setAttribute('aria-expanded', 'false');
      };
      window.plToggleModuleMenu = function (e) {
        if (e) e.stopPropagation();
        const m = document.getElementById('pl-menu');
        if (!m) return;
        const willOpen = m.classList.contains('hidden');
        window.plCloseModuleMenu();
        if (willOpen) { m.classList.remove('hidden'); document.getElementById('pl-menu-btn')?.setAttribute('aria-expanded', 'true'); }
      };
      document.addEventListener('click', (e) => { if (!e.target.closest('#pl-menu-wrap')) window.plCloseModuleMenu(); });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        window.plCloseModuleMenu();
        if (noteEditor) { e.preventDefault(); cancelNoteEditor(); }
      });

      /* ── Board interactions ── */
      let searchDebounce;
      const searchInput = document.getElementById('pl-search-input');
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchDebounce);
        const v = e.target.value.trim().toLowerCase();
        searchDebounce = setTimeout(() => { searchTerm = v; syncSearchWrap(); renderTimeline(); }, 120);
      });
      document.getElementById('pl-search-clear').addEventListener('click', () => { setSearch(''); searchInput.focus(); });
      searchInput.addEventListener('focus', () => { noteWantFocus = false; });
      (function wireEvalBtn() {
        const btn = document.getElementById('pl-eval-btn');
        if (!btn) return;
        const icon = btn.querySelector('.material-symbols-outlined');
        const label = btn.querySelector('.pl-review-btn-label');
        btn.addEventListener('click', async () => {
          if (btn.disabled) return;
          btn.disabled = true;
          btn.classList.add('is-busy');
          btn.classList.remove('is-done');
          if (icon) icon.textContent = 'autorenew';
          if (label) label.textContent = 'Evaluating HTML…';
          btn.setAttribute('aria-busy', 'true');
          try { await runFullEval(); } catch (_) {}
          btn.classList.remove('is-busy');
          btn.classList.add('is-done');
          if (icon) icon.textContent = 'check';
          if (label) label.textContent = 'Updated';
          btn.removeAttribute('aria-busy');
          btn.disabled = false;
          window.setTimeout(() => {
            btn.classList.remove('is-done');
            if (icon) icon.textContent = 'autorenew';
            if (label) label.textContent = 'Re-evaluate';
          }, 1600);
        });
      })();
      /* Category scorecards are single-select filters: tap to isolate, tap the
         active one again to clear back to all. */
      document.getElementById('pl-cat-stats').addEventListener('click', (e) => {
        const card = e.target.closest('[data-cat]');
        if (!card) return;
        const id = card.dataset.cat;
        catFilter = (catFilter === id) ? null : id;
        renderCatStats(); renderTimeline();
      });
      const timelineEl = document.getElementById('pl-timeline');
      function toggleDay(head) { const key = head.dataset.day; if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key); renderTimeline(); }

      /* ── Copy a full day's work ──
         Builds a plain-text digest of EVERY page + category for the day (ignores
         the board's filters — "copy all in a day's work" means the whole day). */
      function dayPlainText(day) {
        const lines = [`${fmtDate(day.date)} (${day.rel})`, day.summary, ''];
        day.entries.forEach((e) => {
          lines.push(`${e.page} — ${e.path}${e.isNew ? ' (NEW)' : ''}`);
          CATS.forEach((c) => {
            const arr = e[c.id];
            if (Array.isArray(arr) && arr.length) {
              lines.push(`  ${c.label}:`);
              arr.forEach((t) => lines.push(`    - ${t}`));
            }
          });
          lines.push('');
        });
        const dayNotes = notesForDay(day.date);
        if (dayNotes.length) {
          lines.push('Notes:');
          dayNotes.forEach((n) => lines.push(`  - ${n.text}`));
          lines.push('');
        }
        return lines.join('\n').trim() + '\n';
      }
      function flashCopy(btn) {
        if (!btn) return;
        if (btn.dataset.flashing) return;
        btn.dataset.flashing = '1';
        btn.classList.add('is-copied');
        const prevLabel = btn.textContent;
        const prevTitle = btn.title;
        btn.textContent = 'Copied';
        btn.title = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('is-copied');
          btn.textContent = prevLabel;
          btn.title = prevTitle;
          delete btn.dataset.flashing;
        }, 1200);
      }
      function copyText(text, done) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
            return;
          }
        } catch (_) {}
        fallbackCopy(text, done);
      }
      function fallbackCopy(text, done) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        } catch (_) {}
        done();
      }
      function copyDay(iso, btn) {
        const day = LOG.find((d) => d.date === iso);
        if (!day) return;
        copyText(dayPlainText(day), () => flashCopy(btn));
      }

      timelineEl.addEventListener('click', (e) => {
        const addBtn = e.target.closest('[data-note-add]');
        if (addBtn) { e.stopPropagation(); openNoteEditor(addBtn.dataset.noteAdd, null); return; }
        const editBtn = e.target.closest('[data-note-edit]');
        if (editBtn) { e.stopPropagation(); openNoteEditor(editBtn.dataset.noteDay, editBtn.dataset.noteEdit); return; }
        if (e.target.closest('[data-note-save]')) { e.stopPropagation(); commitNote(); return; }
        if (e.target.closest('[data-note-cancel]')) { e.stopPropagation(); cancelNoteEditor(); return; }
        if (e.target.closest('.pl-notes')) { e.stopPropagation(); return; }
        const copyBtn = e.target.closest('[data-copy-day]');
        if (copyBtn) { e.stopPropagation(); copyDay(copyBtn.dataset.copyDay, copyBtn); return; }
        const head = e.target.closest('[data-day]'); if (head) toggleDay(head);
      });
      timelineEl.addEventListener('input', (e) => {
        if (!e.target.classList.contains('pl-note-input') || !noteEditor) return;
        noteEditor.text = e.target.value;
      });
      timelineEl.addEventListener('focusin', (e) => {
        if (e.target.classList.contains('pl-note-input')) noteWantFocus = true;
      });
      timelineEl.addEventListener('keydown', (e) => {
        if (e.target.classList.contains('pl-note-input')) {
          if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelNoteEditor(); return; }
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commitNote(); return; }
          return;
        }
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const head = e.target.closest('[data-day]');
        if (!head) return;
        if (e.target.closest('[data-copy-day], .pl-notes')) return;
        e.preventDefault();
        toggleDay(head);
      });

      /* ── Width toggle — canonical four-step cycle via the shared pane-width helper ── */
      const CANON_ICONS = ['width_normal', 'width_wide', 'width_full', 'width_full'];
      const CANON_TITLES = ['Width (single) — tap to widen', 'Width (double) — tap to widen', 'Width (triple) — tap to widen', 'Width (fill) — tap to reset'];
      (function wireWidth() {
        const wBtn = document.getElementById('pl-width');
        const moduleEl = document.getElementById('pl-log');
        if (!wBtn || !moduleEl) return;
        const W = window.WPaneWidth;
        const applyTier = (t) => {
          if (W) { W.applyClasses(moduleEl, t, 'panel'); W.syncButton(wBtn, t); return; }
          moduleEl.classList.toggle('panel-wide', t >= 1);
          moduleEl.classList.toggle('panel-triple', t >= 2);
          moduleEl.classList.toggle('panel-fill', t >= 3);
          const ic = wBtn.querySelector('.material-symbols-outlined');
          if (ic) ic.textContent = CANON_ICONS[t];
          wBtn.classList.toggle('is-on', t >= 1);
          wBtn.setAttribute('aria-pressed', t >= 1 ? 'true' : 'false');
          wBtn.title = CANON_TITLES[t];
        };
        let tier = W ? W.tierOfEl(moduleEl) : 0;
        applyTier(tier);
        wBtn.addEventListener('click', () => { tier = W ? W.next(tier) : (tier + 1) % 4; applyTier(tier); });
      })();

      /* ═══════════ Chat intent chips + replies ═══════════
         The chips drive the board: each summarizes a slice of the log AND applies
         the matching filter so the board and the conversation stay in lockstep —
         the same pattern reformulation.html uses for its move chips. */
      function countCat(catId) { let n = 0; LOG.forEach((d) => d.entries.forEach((e) => { if (Array.isArray(e[catId])) n += e[catId].length; })); return n; }
      function catItemsHtml(catId, max = 8) {
        const rows = [];
        LOG.forEach((d) => d.entries.forEach((e) => { (e[catId] || []).forEach((t) => rows.push({ page: e.page, t })); }));
        const shown = rows.slice(0, max).map((r) => `<li><b>${esc(r.page)}</b> — ${esc(r.t)}</li>`).join('');
        const more = rows.length > max ? `<li>+ ${rows.length - max} more…</li>` : '';
        return `<ul class="sc-reply-list">${shown}${more}</ul>`;
      }
      function dayReplyHtml(day) {
        const items = day.entries.map((e) => {
          const cats = CATS.filter((c) => Array.isArray(e[c.id]) && e[c.id].length).map((c) => `${e[c.id].length} ${c.label.toLowerCase()}`);
          return `<li><b>${esc(e.page)}</b> — ${esc(cats.join(', '))}</li>`;
        }).join('');
        return `<b>${fmtDate(day.date)}</b> — ${esc(day.summary)}<ul class="sc-reply-list">${items}</ul>`;
      }

      const INTENTS = [
        { intent: 'pl:today', label: 'What shipped today?', icon: 'today', nextIntents: ['pl:components', 'pl:features', 'pl:notes'] },
        { intent: 'pl:components', label: 'New components', icon: 'widgets', nextIntents: ['pl:features', 'pl:newpages', 'pl:today'] },
        { intent: 'pl:features', label: 'New features', icon: 'bolt', nextIntents: ['pl:components', 'pl:newpages', 'pl:today'] },
        { intent: 'pl:newpages', label: 'New pages', icon: 'note_add', nextIntents: ['pl:features', 'pl:components', 'pl:today'] },
        { intent: 'pl:notes', label: 'My notes', icon: 'edit_note', nextIntents: ['pl:today', 'pl:features'] },
        { intent: 'pl:busiest', label: 'Busiest day', icon: 'trending_up', nextIntents: ['pl:today', 'pl:features', 'pl:deletions'] },
        { intent: 'pl:deletions', label: 'What was removed?', icon: 'delete', nextIntents: ['pl:today', 'pl:features', 'pl:components'] },
      ];
      const INTENT_REPLIES = {
        'pl:today': () => { const d = LOG[0]; focusDay(d.date); return `Here's the latest — ${dayReplyHtml(d)}`; },
        'pl:components': () => { setCatOnly('components'); return `<b>${countCat('components')}</b> components were built. I've filtered the board to just components.${catItemsHtml('components')}`; },
        'pl:features': () => { setCatOnly('features'); return `<b>${countCat('features')}</b> features shipped. Filtered the board to features.${catItemsHtml('features')}`; },
        'pl:newpages': () => {
          const news = [];
          LOG.forEach((d) => d.entries.forEach((e) => { if (e.isNew) news.push({ page: e.page, path: e.path, date: d.date }); }));
          if (!news.length) return 'No brand-new pages were added in this window — the work was on existing pages.';
          setSearch('');
          return `<b>${news.length}</b> new page${news.length === 1 ? '' : 's'} in this window:<ul class="sc-reply-list">${news.map((n) => `<li><b>${esc(n.page)}</b> <span style="opacity:.7">(${esc(n.path)})</span> — ${fmtDate(n.date)}</li>`).join('')}</ul>`;
        },
        'pl:notes': () => {
          if (!notes.length) return 'You have no notes yet. Tap <b>Add a note</b> on any day — same Save / Cancel composer as the rest of the app. You can also type <b>note:</b> followed by your text.';
          const items = notes.slice(0, 8).map((n) => `<li><b>${fmtDate(n.day)}</b> — ${esc(n.text)}</li>`).join('');
          const more = notes.length > 8 ? `<li>+ ${notes.length - 8} more…</li>` : '';
          return `You have <b>${notes.length}</b> note${notes.length === 1 ? '' : 's'} on this log.<ul class="sc-reply-list">${items}${more}</ul>`;
        },
        'pl:busiest': () => {
          let best = null, bestN = -1;
          LOG.forEach((d) => { let n = 0; d.entries.forEach((e) => { n += entryItems(e).length; }); if (n > bestN) { bestN = n; best = d; } });
          focusDay(best.date);
          return `The busiest day was <b>${fmtDate(best.date)}</b> with <b>${bestN}</b> logged entries. ${dayReplyHtml(best)}`;
        },
        'pl:deletions': () => { setCatOnly('deletions'); return `Removals in this window:${catItemsHtml('deletions')}`; },
      };

      /* Free-text: save a note, or route to a page, a category, or an overview. */
      function tryChatNote(text) {
        const m = String(text || '').match(/^(?:note:|add (?:a )?note[:\s]+)\s*([\s\S]+)$/i);
        if (!m) return null;
        const day = LOG[0].date;
        addNoteToDay(day, m[1]);
        focusDay(day);
        return `Saved that note on <b>${fmtDate(day)}</b>. It uses the same sticky-note card as chat turns — one pattern, everywhere.`;
      }
      function reply(text) {
        const saved = tryChatNote(text);
        if (saved) return saved;
        const t = String(text || '').toLowerCase();
        if (/\b(my notes|show notes|list notes)\b/.test(t)) return INTENT_REPLIES['pl:notes']();
        const pageHit = [...new Set(LOG.flatMap((d) => d.entries.map((e) => e.page)))].find((p) => t.includes(p.toLowerCase()));
        if (pageHit) {
          setPage(pageHit);
          const items = [];
          LOG.forEach((d) => d.entries.filter((e) => e.page === pageHit).forEach((e) => entryItems(e).forEach((it) => items.push({ d, it }))));
          return `Filtered the board to <b>${esc(pageHit)}</b> — <b>${items.length}</b> logged ${items.length === 1 ? 'entry' : 'entries'}.<ul class="sc-reply-list">${items.slice(0, 10).map((x) => `<li><b>${CAT_BY_ID[x.it.cat].label}</b> · ${esc(x.it.text)}</li>`).join('')}</ul>`;
        }
        const catHit = CATS.find((c) => t.includes(c.label.toLowerCase()) || t.includes(c.id));
        if (catHit) { setCatOnly(catHit.id); return `Filtered to <b>${catHit.label}</b> — <b>${countCat(catHit.id)}</b> entries.${catItemsHtml(catHit.id)}`; }
        if (/today|latest|recent/.test(t)) return INTENT_REPLIES['pl:today']();
        if (/delete|remove|deletion/.test(t)) return INTENT_REPLIES['pl:deletions']();
        if (/new page/.test(t)) return INTENT_REPLIES['pl:newpages']();
        const days = LOG.length, pages = new Set(); let total = 0;
        LOG.forEach((d) => d.entries.forEach((e) => { pages.add(e.page); total += entryItems(e).length; }));
        return `This log covers <b>${days} days</b>, <b>${pages.size} surfaces</b> and <b>${total} entries</b>. It re-evaluates itself every hour. Ask about a page (e.g. “Add Product”), a category (components, features, logic, UX, changes, improvements, updates, deletions), add a note with “note: …”, or tap a chip below.`;
      }

      /* ═══════════ Boot — evaluate the log, then mount the ONE shared chat ═══════════ */
      syncBoardLog();
      dropJournalNotes();
      lastCrawlAt = (loadCrawlSnap() || {}).at || 0;
      if (shouldEvaluateAll()) evaluateAllPages({ scroll: false });
      else { reevaluate(); updateEvalMeta(); }
      startHourlyPoll();
      setTimeout(() => { crawlAndReport({ scroll: false }); }, 80);

      /* Re-evaluate on every restore. A normal load remounts this module (hot
         reload included) and the boot pass above already ran. A bfcache
         restore (`pageshow` + persisted) keeps the old heap, so we reset
         filters and rebuild — and if the local day rolled while we were
         away, we rewrite every eval note. The first pageshow of a remount
         is skipped so we don't double-paint on boot. */
      let plDidShow = false;
      window.addEventListener('pageshow', (e) => {
        if (!plDidShow) { plDidShow = true; if (!e.persisted) return; }
        syncBoardLog();
        if (shouldEvaluateAll()) evaluateAllPages({ scroll: false });
        else {
          reevaluate({ reset: !!e.persisted });
          updateEvalMeta();
        }
        crawlAndReport({ scroll: false });
      });

      chat = mountWISEcodeAIChat(document.getElementById('pl-chat'), {
        title: 'WISEcodeAI\u2122',
        heading: 'What shipped, and when?',
        sub: 'Ask about the build log — by day, by page, or by category. Tap a chip to jump in.',
        placeholder: 'Ask about the progress log\u2026',
        userInitials: 'AK',
        sourceLabel: '',
        statusLabel: 'WISEcodeAI is checking the log',
        chipsFlow: 'wrap',
        inlineChips: true,
        historyKey: 'wise-chat-history:progress-log',
        activity: true,
        turns: true,
        turnsSearch: true,
        turnsBreakout: true,
        turnsDockedControls: true,
        turnsBreakoutDefault: false,
        historyBreakout: true,
        historyBreakoutDefault: true,
        historyDockedControls: true,
        historyBreakoutHidden: true,
        stickyModules: true,
        stickyModulesDefault: true,
        stickyModulesMenu: false,
        intents: INTENTS,
        intentReplies: INTENT_REPLIES,
        reply: (text) => reply(text),
      });

      /* History & Projects entry in the chat's three-dot menu — parity with
         wiseai.html / reformulation.html (the shared module wires data-sc="history"
         to open/view the sticky History drawer). Without this the top-right menu
         is missing its History functionality. */
      const plMorePop = document.getElementById('pl-chat').querySelector('.topbar-popover');
      if (plMorePop && !plMorePop.querySelector('[data-sc="history"]')) {
        const hb = document.createElement('button');
        hb.type = 'button';
        hb.className = 'topbar-menu-item sc-mcp-item';
        hb.setAttribute('data-sc', 'history');
        hb.setAttribute('role', 'menuitemcheckbox');
        hb.setAttribute('aria-checked', 'false');
        hb.innerHTML = '<span class="material-symbols-outlined topbar-menu-icon">history</span><span>History &amp; Projects</span><span class="sc-switch" aria-hidden="true"></span>';
        const hd = document.createElement('div');
        hd.className = 'topbar-menu-divider';
        plMorePop.insertBefore(hd, plMorePop.firstChild);
        plMorePop.insertBefore(hb, hd);
      }
    })();
  </script>
  <script src="../js/table-pagination.js" defer></script>
  <script src="../js/responsive-tables.js" defer></script>
  <!-- LiveReload (dev_server.py) — a save anywhere under pages/ or js/ remounts
       this journal so boot re-evaluates and crawls against the current LOG. -->
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
</body>
</html>
