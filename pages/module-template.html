<!DOCTYPE html>
<!--
  WISE module page template.

  Copy this file to create a new workspace module page (Overview, Product
  Portfolio, Marketing Assets, Reports, Profile, Invoices & Downloads, …).

  To wire a page up, you only need to:
    1. Set `<body data-nav-id="…">` to the matching WISE_APP_NAV id
       (see WISE_APP_NAV in js/agent-menu.js). This drives the active nav item,
       the page title, and the header icon/label.
    2. Fill `#agent-main-scroll` with the page's content.

  Everything else — the sectioned navigation, the always-present Appearance
  controls (Minimal UI, Header, Full bleed, Colorblind, Pivot, Text size,
  Theme), the profile menu, the Scout dock, alerts, rail collapse, and the
  main-panel header cluster — is wired automatically by js/agent-overview.js.
-->
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Module</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint so the page
       never flashes dark→light (or vice versa). */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="agent-page.css" />
  <link rel="stylesheet" href="scout-chat.css" />
</head>
<!-- Change data-nav-id to the WISE_APP_NAV id for this page. -->
<body data-nav-id="overview">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <!-- Top bar rendered by the shared component in js/topbar.js (mountTopbar). -->
    <div id="topbar-row" hidden aria-hidden="true"></div>

    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <!-- Fill #agent-main-scroll with this page's content. -->
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/agent-overview.js"></script>
</body>
</html>
