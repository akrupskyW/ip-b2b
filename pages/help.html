<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · Help</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'light' ? 'light' : 'dark';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* Help center — rendered by js/help-flow.js. */
    body[data-nav-id="help"] #agent-main-header { display: none; }
    body[data-nav-id="help"] .agent-main-scroll { padding: 0; }
    body[data-nav-id="help"] #modules-row { margin-top: 0; }

    .hc-wrap { padding: 26px 40px 56px; max-width: 940px; }
    .hc-hero { text-align: left; padding: 0 0 24px; }
    .hc-title { font-family: 'WISE Digits', var(--module-title-family, 'Noto Serif', Georgia, serif); font-size: var(--module-title-size, 1.2rem); font-weight: var(--module-title-weight, 800); color: var(--text); margin: 0 0 18px; letter-spacing: -0.01em; line-height: 1.15; }
    .hc-search { position: relative; display: flex; align-items: center; max-width: 560px; margin: 0 auto; }
    .hc-search > .material-symbols-outlined { position: absolute; left: 16px; font-size: 20px; color: var(--text-subtle); pointer-events: none; }
    .hc-search-input { width: 100%; height: 50px; box-sizing: border-box; padding: 0 44px; font-family: inherit; font-size: 0.95rem; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px; outline: none; box-shadow: var(--shadow-1); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .hc-search-input::placeholder { color: var(--text-subtle); font-style: italic; }
    .hc-search-input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .hc-search-clear { position: absolute; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--text-subtle); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .hc-search-clear:hover { background: var(--surface-2); color: var(--text); }
    .hc-search-clear .material-symbols-outlined { font-size: 18px; }

    .hc-section-title { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 14px; }

    .hc-topics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 34px; }
    .hc-topic { display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; border-radius: var(--r-md, 14px); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-1); cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; font-family: inherit; }
    .hc-topic:hover { border-color: var(--primary); transform: translateY(-1px); }
    .hc-topic-ic { width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .hc-topic-ic .material-symbols-outlined { font-size: 22px; }
    .hc-topic-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .hc-topic-title { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .hc-topic-sub { font-size: 0.78rem; color: var(--text-muted); }
    .hc-topic-arrow { color: var(--text-subtle); font-size: 20px; }

    .hc-faqs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 38px; }
    .hc-faq { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md, 14px); overflow: hidden; }
    .hc-faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; padding: 16px 18px; border: 0; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.92rem; font-weight: 600; color: var(--text); }
    .hc-faq-chev { color: var(--text-subtle); transition: transform 0.2s ease; }
    .hc-faq.is-open .hc-faq-chev { transform: rotate(180deg); }
    .hc-faq-a { max-height: 0; overflow: hidden; padding: 0 18px; font-size: 0.86rem; line-height: 1.55; color: var(--text-muted); transition: max-height 0.25s ease, padding 0.25s ease; }
    .hc-faq.is-open .hc-faq-a { max-height: 320px; padding: 0 18px 18px; }
    .hc-hl { background: color-mix(in srgb, var(--ter-amber, #e0a800) 40%, transparent); border-radius: 3px; padding: 0 2px; color: inherit; }
    .hc-empty { padding: 20px; font-size: 0.86rem; color: var(--text-muted); font-style: italic; background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--r-md, 14px); }

    .hc-support { margin-top: 8px; }
    .hc-support-head { margin-bottom: 14px; }
    .hc-support-sub { font-size: 0.84rem; color: var(--text-muted); margin: 6px 0 0; }
    .hc-support-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .hc-support-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 18px; border-radius: var(--r-md, 14px); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-1); cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease; font-family: inherit; }
    .hc-support-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .hc-support-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary-ink, var(--primary)); background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .hc-support-ic .material-symbols-outlined { font-size: 21px; }
    .hc-support-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .hc-support-desc { font-size: 0.78rem; color: var(--text-muted); }

    @media (max-width: 760px) {
      .hc-wrap { padding: 20px 20px 48px; }
      .hc-topics, .hc-support-cards { grid-template-columns: 1fr; }
    }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="help" data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../js/agent-overview.js"></script>
  <script src="/livereload.js?snipver=1"></script>
  <!-- App-wide "Sticky module" toggle for every module right of the chat. -->
  <script defer src="../js/sticky-modules.js"></script>
</body>
</html>
