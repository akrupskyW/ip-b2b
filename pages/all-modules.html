<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* All Modules is too heavy to remount on every save. Block LiveReload on
       this page only — Hard reload (next to Re-evaluate) is the refresh. */
    (function () {
      var OrigWS = window.WebSocket;
      if (OrigWS) {
        function BlockedWS(url, protocols) {
          if (/livereload/i.test(String(url || ''))) {
            return {
              url: url, readyState: OrigWS.CLOSED, bufferedAmount: 0,
              extensions: '', protocol: '', binaryType: 'blob',
              close: function () {}, send: function () {},
              addEventListener: function () {}, removeEventListener: function () {},
              dispatchEvent: function () { return false; },
              onopen: null, onmessage: null, onerror: null, onclose: null
            };
          }
          return protocols === undefined ? new OrigWS(url) : new OrigWS(url, protocols);
        }
        BlockedWS.prototype = OrigWS.prototype;
        BlockedWS.CONNECTING = OrigWS.CONNECTING;
        BlockedWS.OPEN = OrigWS.OPEN;
        BlockedWS.CLOSING = OrigWS.CLOSING;
        BlockedWS.CLOSED = OrigWS.CLOSED;
        window.WebSocket = BlockedWS;
      }
      var lr;
      try {
        Object.defineProperty(window, 'LiveReload', {
          configurable: true,
          get: function () { return lr; },
          set: function (v) {
            lr = v;
            try {
              if (v && typeof v.shutDown === 'function') v.shutDown();
              else if (v && v.connector && typeof v.connector.disconnect === 'function') v.connector.disconnect();
            } catch (e) { /* already down */ }
          }
        });
      } catch (e) { /* non-configurable LiveReload */ }
    })();
  </script>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISE · All Modules</title>
  <script src="../js/text-size-fouc.js"></script>
  <script>
    /* FOUC guard — apply the persisted theme before first paint. Mirrors the
       other app pages so the shell never flashes the wrong theme. */
    (function () {
      try {
        var t = localStorage.getItem('wise-theme');
        if (t !== 'light' && t !== 'dark') {
          t = localStorage.getItem('chat-theme') === 'dark' ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) { /* no saved theme: default light */ }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

       assets/icons/wise-icons.svg (Rounded 300). The font links above stay as the
       fallback for any glyph the sprite does not carry. See js/icon-svg-shim.js. -->
  <script defer src="../js/icon-svg-shim.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wise.css" />
  <style>
    /* ═══════════ All Modules — shell spacing matches wiseai.html ═══════════
       The shared wise.css body rule leaves 0 horizontal padding and a shorter
       --shell-topbar-h brand strip, so the primary nav sat flush to the window
       edge and looked squeezed vs. the rest of the app. Copy the canonical
       chat-shell insets (12px all sides, 60px brand bar, owl nudge). */
    html, body { height: 100%; margin: 0; }
    body[data-nav-id="all-modules"] {
      padding: var(--modules-bottom-pad, 12px);
    }
    #agent-shell-wrap { flex: 1 1 0%; min-height: 0; width: 100%; overflow: visible; }
    #agent-shell-wrap.menu-brand-integrated #modules-row {
      grid-area: modules;
      display: flex;
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      /* Match the nav module's height exactly (cancels wise.css margin-top: 8px). */
      margin-top: 0;
      padding: 0 2px;
    }

    /* Nav brand strip height — same pin as wiseai.html / reformulation / studio-ai. */
    #agent-shell-wrap #menu-panel:not(.mp-pivot) .menu-brand-bar { min-height: var(--panel-header-h); margin-bottom: 0; }
    #agent-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-bar { height: var(--panel-header-h); min-height: var(--panel-header-h); max-height: var(--panel-header-h); margin-bottom: 0; }
    #agent-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo,
    #agent-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo a { height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Drop the owl so it lines up with the headlines of the modules to the right. */
    #agent-shell-wrap #menu-panel.mp-rail:not(.mp-pivot) .menu-brand-logo svg.tl-bug { transform: translateY(16px); }

    /* All Modules is the only surface in the row — open at fill (tier 3) and
       grow to the full modules column beside the nav. */
    body[data-nav-id="all-modules"] #agent-main {
      flex: 1 1 0%;
      min-width: 0;
      max-width: none;
    }
    body[data-nav-id="all-modules"] #agent-main.panel-fill {
      flex-grow: 1000;
    }
    body[data-nav-id="all-modules"] .agent-main-inner {
      flex: 1 1 0%;
      min-height: 0;
    }
    body[data-nav-id="all-modules"] .agent-main-scroll {
      flex: 1 1 0%;
      min-height: 0;
      overflow: auto;
    }

    /* Boot headline — same serif All Modules title as the rendered module, so
       the load % is visible while the (large) JS graph is still arriving. */
    .mi-wrap { padding: var(--module-head-pad-t, 26px) var(--module-head-pad-x, 40px) 64px; }
    .mi-hero-title-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .mi-hero-title {
      font-family: var(--module-title-family), 'Noto Serif', Georgia, serif;
      margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text);
    }
    .mi-load-pct {
      font-family: var(--module-title-family), 'Noto Serif', Georgia, serif;
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em;
      color: var(--text-muted); line-height: 1.2; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .mi-load-bytes {
      font-size: 0.75rem; font-weight: 700; color: var(--text-subtle);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    html.dark .mi-load-pct { color: var(--text-subtle); }
    html.dark .mi-load-bytes { color: var(--text-subtle); }
    .mi-load-pct[data-done="1"] { color: var(--text-subtle); }
  </style>
  <script src="../js/cwr-toggle.js"></script>
</head>
<body data-nav-id="all-modules" data-adm-page data-default-dock="left">
  <div id="agent-shell-wrap" class="menu-brand-integrated">
    <div id="menu-panel" class="mp-open">
      <div class="menu-inner">
        <div class="menu-panel-body">
          <nav class="menu-nav" id="agent-menu-nav" aria-label="WISE platform navigation"></nav>
        </div>
      </div>
    </div>
    <div id="topbar-row" hidden aria-hidden="true"></div>
    <div id="modules-row">
      <main id="agent-main" class="panel-fill">
        <div class="agent-main-inner">
          <header class="agent-main-header" id="agent-main-header"></header>
          <div class="agent-main-scroll" id="agent-main-scroll">
            <div class="mi-wrap" data-mi-boot>
              <header class="mi-hero">
                <div class="mi-hero-text">
                  <div class="mi-hero-title-row">
                    <h1 class="mi-hero-title">All Modules</h1>
                    <span class="mi-load-pct no-countup" id="mi-load-pct" data-no-countup aria-live="polite" title="How much of this page has arrived">0%</span>
                    <span class="mi-load-bytes no-countup" id="mi-load-bytes" data-no-countup></span>
                  </div>
                </div>
              </header>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script>
    /* Load meter: this page’s own boot graph (HTML, CSS, the shell, the
       catalog module, the chat dock, the icon sprite). Completions paint
       across frames so the headline climbs instead of jumping once.
       Icon / app-logic catalogs and the project inventory are not in this
       graph — they arrive when a section opens or Re-evaluate runs. */
    (function () {
      var arrived = Object.create(null);
      var lastPct = 0;
      var lastLoaded = 0;
      var lastLabel = '0%';
      var lastBytes = '';
      var shownPct = 0;
      var shownLoaded = 0;
      var displayRaf = 0;
      var bootReady = false;
      var loadFired = false;
      /* Only this page’s first-paint graph. Fetching the project inventory,
         opening a section, or loading helix media must not grow the
         denominator — that is what pinned the headline at 38% of 139 MB. */
      var BOOT_HINT = {
        'pages/all-modules.html': 18134,
        'pages/wise.css': 914441,
        'js/auth-guard.js': 1073,
        'js/cwr-toggle.js': 47932,
        'js/icon-svg-shim.js': 16592,
        'js/text-size-fouc.js': 22577,
        'js/agent-overview.js': 91685,
        'js/agent-menu.js': 62025,
        'js/all-modules-flow.js': 641048,
        'js/code-stats-data.js': 9666,
        'js/module-directory-data.js': 7844,
        'js/dev-ready-data.js': 3549,
        'js/ai-ready-data.js': 491,
        'js/wiseai-dock.js': 18103,
        'js/wiseai-chat.js': 707316,
        'js/chat-history.js': 134918,
        'assets/icons/wise-icons.svg': 480475
      };

      function projectPath(url) {
        try {
          var abs = new URL(url, location.href);
          if (abs.origin !== location.origin) return '';
          return String(abs.pathname || '').replace(/^\//, '');
        } catch (e) { return ''; }
      }
      function hintKey(url) {
        var path = projectPath(url);
        if (!path) return '';
        if (BOOT_HINT[path] != null) return path;
        var keys = Object.keys(BOOT_HINT);
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          if (path.slice(-(k.length + 1)) === '/' + k) return k;
        }
        return '';
      }
      function sizeOf(entry, key) {
        var n = (entry && (entry.encodedBodySize || entry.decodedBodySize || entry.transferSize)) || 0;
        return n || (key && BOOT_HINT[key]) || 0;
      }
      function applyEntry(entry) {
        if (!entry || !entry.name) return;
        var key = hintKey(entry.name);
        if (!key) return;
        var n = sizeOf(entry, key);
        if (!n) return;
        if ((arrived[key] || 0) >= n) return;
        arrived[key] = n;
        scheduleDisplay();
      }
      function arrivedTotal() {
        var n = 0;
        Object.keys(BOOT_HINT).forEach(function (k) { n += arrived[k] || 0; });
        return n;
      }
      function hintTotal() {
        var n = 0;
        Object.keys(BOOT_HINT).forEach(function (k) { n += BOOT_HINT[k]; });
        return n;
      }
      function isComplete() {
        /* Catalog headers + jump tiles are up. Chat media can keep arriving
           after that — do not hold 99% for a helix video. */
        return bootReady;
      }
      function fmtBytes(n) {
        n = Math.max(0, n || 0);
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) {
          var kb = n / 1024;
          return (kb < 10 ? kb.toFixed(1) : Math.round(kb)) + ' KB';
        }
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
      }
      function targets() {
        var loaded = arrivedTotal();
        var expected = hintTotal();
        var complete = isComplete();
        var pct = 0;
        if (complete) {
          expected = Math.max(loaded, hintTotal());
          loaded = expected;
          pct = 100;
        } else if (expected > 0) pct = Math.round(100 * loaded / expected);
        if (!complete && pct > 99) pct = 99;
        lastPct = pct;
        lastLoaded = loaded;
        return { loaded: loaded, expected: expected, files: Object.keys(arrived).length, complete: complete, pct: pct };
      }
      function writeDom(t) {
        lastLabel = shownPct + '%';
        lastBytes = t.expected ? (fmtBytes(shownLoaded) + ' / ' + fmtBytes(t.expected)) : fmtBytes(shownLoaded);
        var el = document.getElementById('mi-load-pct');
        var bytesEl = document.getElementById('mi-load-bytes');
        if (el) {
          el.textContent = lastLabel;
          el.setAttribute('aria-label', fmtBytes(t.loaded) + ' arrived of ' + (t.expected ? fmtBytes(t.expected) : 'this page') + ', ' + t.pct + ' percent');
          el.setAttribute('title', fmtBytes(t.loaded) + ' arrived of this page' + (t.expected ? ' · ' + fmtBytes(t.expected) : ''));
          if (t.complete && shownPct >= 100) el.setAttribute('data-done', '1');
          else el.removeAttribute('data-done');
        }
        if (bytesEl) {
          bytesEl.textContent = lastBytes;
          bytesEl.setAttribute('title', t.expected
            ? (fmtBytes(t.loaded) + ' arrived · ' + t.files + ' files on this page')
            : 'Arrived in this tab');
        }
      }
      function stepDisplay() {
        displayRaf = 0;
        var t = targets();
        if (shownPct < t.pct) shownPct = Math.min(t.pct, shownPct + Math.max(1, Math.ceil((t.pct - shownPct) / 6)));
        if (shownLoaded < t.loaded) shownLoaded = Math.min(t.loaded, shownLoaded + Math.max(16 * 1024, Math.ceil((t.loaded - shownLoaded) / 6)));
        writeDom(t);
        if (shownPct < t.pct || shownLoaded < t.loaded) scheduleDisplay();
      }
      function scheduleDisplay() {
        if (displayRaf) return;
        displayRaf = requestAnimationFrame(stepDisplay);
      }
      function paint() {
        targets();
        scheduleDisplay();
      }

      try {
        if (performance.getEntriesByType) {
          (performance.getEntriesByType('navigation') || []).forEach(applyEntry);
          (performance.getEntriesByType('resource') || []).forEach(applyEntry);
        }
        if (typeof PerformanceObserver === 'function') {
          var po = new PerformanceObserver(function (list) {
            list.getEntries().forEach(applyEntry);
          });
          try { po.observe({ type: 'resource', buffered: true }); }
          catch (e1) { try { po.observe({ entryTypes: ['resource'] }); } catch (e2) { /* no observer */ } }
          try {
            var pn = new PerformanceObserver(function (list) {
              list.getEntries().forEach(applyEntry);
            });
            pn.observe({ type: 'navigation', buffered: true });
          } catch (e3) { /* optional */ }
        }
      } catch (e) { /* best-effort */ }

      window.addEventListener('load', function () { loadFired = true; paint(); });
      document.addEventListener('readystatechange', paint);
      setInterval(function () {
        try {
          (performance.getEntriesByType('navigation') || []).forEach(applyEntry);
          (performance.getEntriesByType('resource') || []).forEach(applyEntry);
        } catch (e) { /* ignore */ }
        paint();
      }, 400);

      window.WiseMiLoad = {
        label: function () { return lastLabel; },
        bytes: function () { return lastBytes; },
        scan: function () { paint(); },
        markReady: function () { bootReady = true; paint(); },
        setInventory: function () { /* project size is not this page’s load */ paint(); },
        snapshot: function () {
          var t = targets();
          return {
            label: lastLabel,
            bytes: lastBytes,
            files: t.files,
            pending: 0,
            loaded: t.loaded,
            expected: t.expected,
            done: t.complete
          };
        }
      };
      paint();
    })();
  </script>
  <script type="module" src="../js/agent-overview.js"></script>
  <!-- LiveReload is intentionally off on All Modules — it remounts this page
       on every save. Use Hard reload next to Re-evaluate when you want a
       fresh load. Do not re-add /livereload.js here. -->

  <script defer src="../js/sticky-modules.js"></script>
  <script defer src="../js/count-up-all.js"></script>
  <script defer src="../js/feedback.js"></script>
</body>
</html>
