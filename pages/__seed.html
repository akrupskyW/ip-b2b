<!DOCTYPE html><html><head><meta charset="utf-8"><title>seed</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100vw;height:100vh;display:block}</style>
  <script src="../js/cwr-toggle.js"></script>
</head><body>
<script>
const q=new URLSearchParams(location.search);
const st=parseInt(q.get('st')||'0',10);
const sl=parseInt(q.get('sl')||'0',10);
const open=(q.get('open')||'command-deck,ledger,intake,verified,identity,recipes').split(',');
const wide=(q.get('wide')||'').split(',').filter(Boolean);
const wmap={}; wide.forEach(w=>wmap[w]=true);
localStorage.setItem('pf-open-modules', JSON.stringify(open));
localStorage.setItem('pf-module-wide', JSON.stringify(wmap));
localStorage.setItem('wise-module-layout','col');
localStorage.setItem('wise-theme',q.get('theme')||'dark');
const f=document.createElement('iframe');
f.src='portfolio.html';
f.onload=()=>{ setTimeout(()=>{ try{ const r=f.contentDocument.getElementById('modules-row'); if(r){r.scrollTop=st;r.scrollLeft=sl;} }catch(e){} }, 1200); };
document.body.appendChild(f);
</script>
</body></html>
